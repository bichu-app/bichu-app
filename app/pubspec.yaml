name: bichu
description: "Bichu — identidade digital do pet, tag QR e rede local de perdido e achado."
publish_to: 'none'

# versionName / versionCode. O build da esteira sobrescreve com
# --build-name e --build-number.
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # Strings do proprio Flutter em pt-BR: tooltip de voltar, rotulo do menu de
  # colar, meses do seletor de data, rotulo que o VoiceOver e o TalkBack leem
  # em Scaffold, Dialog e DatePicker. Sem isto o app fala portugues e o sistema
  # operacional responde em ingles na mesma tela, e quem usa leitor de tela
  # ouve a mistura.
  #
  # EFEITO COLATERAL NO pubspec: `flutter_localizations` vem do SDK e traz o
  # `intl` que a versao do Flutter fixa. A partir daqui o app nao escolhe mais
  # a versao de `intl` livremente -- quem declarar `intl` como dependencia
  # direta tem de casar com o que o SDK pinou, ou o `pub get` reprova. E o
  # preco de usar o pacote do SDK em vez de um de terceiros, e ele e o certo:
  # as strings tem de vir da mesma versao do framework que as consome.
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Navegacao declarativa. Escolhida por causa do F5: App Links e Universal
  # Links entregam uma URL, e rota declarativa e o que faz o mesmo endereco
  # abrir com o app fechado, em segundo plano e sem sessao.
  go_router: ^17.2.1

  # Cliente HTTP. Sem interceptador magico: a camada de API e explicita e o
  # formato de erro e RFC 9457, tratado por `type` e nunca por texto.
  http: ^1.5.0

  # Token no chaveiro do sistema (Keychain / Keystore). Segredo nao vive em
  # armazenamento comum.
  flutter_secure_storage: ^9.2.4

  # Exigido por lib/firebase_options.dart, que ja veio configurado para o
  # projeto bichu-app-508914.
  firebase_core: ^4.3.0

  # Push (BICHUS-13, criterio 3). A VERSAO NAO FOI ESCOLHIDA A MAO: saiu de
  # `flutter pub add firebase_messaging`, e o resolvedor a casou com o
  # `firebase_core: ^4.3.0` acima pelo `_flutterfire_internals` que os dois
  # compartilham. Fixar um numero aqui a mao e o jeito conhecido de descobrir a
  # incompatibilidade so no `pod install` ou no Gradle, que e longe daqui.
  #
  # O QUE ESTE PACOTE **NAO** TRAZ, e a fronteira do ADR-0008: nada de Firebase
  # Auth, Analytics, Firestore ou Crashlytics. Identidade e nossa (ADR-0002) e
  # observabilidade e Sentry. O Firebase entra como transporte de mensagem e
  # nada mais -- a fronteira some sem ninguem decidir se o proximo pacote da
  # familia entrar sem esta linha ser lida.
  #
  # iOS nao esta coberto: falta a chave APNs (`.p8`), que e da conta Apple e
  # esta em BICHUS-136. O pacote entra igual, porque quem o usa e o Android.
  firebase_messaging: ^16.7.0
  # Abre os termos de uso e a politica de privacidade no navegador do sistema.
  # Eles sao superficie web, de outro time, e nao telas deste app: embuti-los
  # num WebView colocaria o app na fronteira de "site embrulhado" da revisao da
  # App Store, e obrigaria este binario a acompanhar mudanca de documento
  # juridico. O navegador do sistema e tambem onde a pessoa consegue guardar,
  # imprimir e compartilhar o que aceitou.
  url_launcher: ^6.3.2
  # A FOLHA DE COMPARTILHAMENTO DO SISTEMA (cliente, 20/10/2026): *"quando o
  # usuario clicar em compartilhar, tem que aparecer aquela barra no celular
  # para o usuario selecionar onde ele quer compartilhar, e um dos lugares vai
  # ser o whatsapp se o usuario tiver instalado"*.
  #
  # `^12` E NAO `^13`, e o motivo e medido: `share_plus >= 13` depende de
  # `win32 ^6`, e `flutter_secure_storage ^9.2.4` exige `win32 ^5`. As duas nao
  # coexistem, e a resolucao reprova com essas palavras. `win32` so vale para
  # Windows, que este produto nao publica -- mas a resolucao de versao nao faz
  # essa distincao, e forcar `^13` custaria trocar o cofre de credenciais.
  #
  # CUSTO MEDIDO, e nao estimado: `app-arm64-v8a-release.apk` passou de
  # 30.777.264 para 30.777.908 bytes, **+644 bytes (+0,0021%)**, com a chamada
  # de fato referenciada no binario. Descompactado sao +6.461 bytes:
  # `classes.dex` +5.076, `AndroidManifest.xml` +824 e `res/RT.xml` (novo, o
  # `flutter_share_file_paths` do FileProvider) +396.
  #
  # NENHUMA PERMISSAO NOVA: comparei a lista de permissoes dos manifestos
  # mesclados antes e depois, e ela e identica. O plugin acrescenta so um
  # `FileProvider` nao exportado (`app.bichu.flutter.share_provider`) e um
  # receiver nao exportado, os dois pelo manifesto dele.
  #
  # iOS entra sem configuracao: minimo 12.0 contra os 15.0 deste Runner, nenhuma
  # chave de uso no `Info.plist` (compartilhar texto nao pede permissao) e o
  # `PrivacyInfo.xcprivacy` ja vem no pacote.
  #
  # **Ele e pacote de APARELHO.** Entra na MESMA rodada na lista de
  # `_importesProibidos` de `app/test/dispositivo/porta_nao_contornada_test.dart`
  # -- o cabecalho daquele portao manda acrescentar "no mesmo dia em que entra no
  # `pubspec.yaml`", e nao quando a primeira tela errar. Quem fala com ele e
  # `lib/dispositivo/saida_do_app.dart`, a porta que ja abre mapa e navegador.
  share_plus: ^12.0.2
  # Unica forma de achar o diretorio do app sem escrever codigo por plataforma.
  # Entra pela fila offline da BICHUS-31, que precisa sobreviver ao app ser
  # encerrado pelo sistema -- e memoria nao sobrevive a isso.
  path_provider: ^2.1.5
  image_picker: ^1.2.3
  permission_handler: ^13.0.2
  mobile_scanner: ^7.4.2

  # Localizacao aproximada no ponto de uso (BICHUS-23), atras da porta
  # `lib/dispositivo/localizacao.dart`. A VERSAO NAO FOI ESCOLHIDA A MAO: saiu
  # de `flutter pub add geolocator`.
  #
  # POR QUE ESTE, e nao o `location`, que tem um TERCO das dependencias:
  #
  # 1. **Ele nao sabe geocodificar**, e isso era o requisito ate 19/10/2026.
  #    LEIA O BLOCO DO `geocoding` ABAIXO ANTES DE CONCLUIR QUALQUER COISA
  #    DAQUI: a proibicao de coordenada->cidade caiu por decisao do cliente, e
  #    a de endereco->coordenada CONTINUA. O `geolocator` continua nao sabendo
  #    fazer nem uma nem outra, e continua sendo escolhido tambem por isso --
  #    o que mudou e que a conversao autorizada passou a existir no binario,
  #    por um pacote proprio e com portao proprio.
  #
  # 2. **Ele deixa desligar o provedor do Google.** No Android, o padrao do
  #    ecossistema e o `FusedLocationProvider`, que e um componente do Google
  #    Play Services e combina GPS com a base de Wi-Fi e de celula do Google.
  #    `AndroidSettings(forceLocationManager: true)` usa o `LocationManager` do
  #    proprio Android, sem terceiro no caminho -- e a porta liga isso POR
  #    PADRAO. O `location` nao oferece essa saida. O produto precisa de
  #    bairro, nao de calcada: a precisao que o provedor fundido acrescenta nao
  #    tem uso aqui, e o custo dela e uma dependencia de terceiro no caminho de
  #    um dado pessoal.
  #
  # O QUE **ESTE** PACOTE MANDA PARA FORA: nada. Nao ha cliente HTTP nem socket
  # no codigo Dart dos quatro pacotes do `geolocator` (conferido por varredura:
  # as unicas URLs sao links de documentacao em comentario).
  #
  # **A FRASE "O QUE ELE MANDA PARA FORA: nada" VALIA PARA O APP INTEIRO ATE
  # 19/10/2026, E NAO VALE MAIS.** Ela ficou aqui, com escopo estreitado para
  # o `geolocator`, em vez de ser apagada: quem ler so este bloco precisa ser
  # mandado para o de baixo, porque manter a frase larga seria pior que o
  # proprio risco que ela descrevia. O `geocoding`, declarado abaixo, MANDA a
  # coordenada para a Apple ou para o Google a cada resolucao. Esta escrito la,
  # com a decisao e a data.
  #
  # O PRECO: ele e federado e traz as implementacoes de web, Windows e Linux
  # junto (`geoclue`, `gsettings`, `win32`, `package_info_plus`, `uuid`) -- 14
  # pacotes no `pub add` contra 3 do `location`. Nenhum deles entra no binario
  # de iOS ou de Android: sao compilados por plataforma, e este app so publica
  # nas duas. Depender so de `geolocator_android` + `geolocator_apple` cortaria
  # a lista, e nao vale: e um arranjo que a proxima pessoa "conserta"
  # acrescentando o `geolocator` de volta.
  #
  # O que limita a precisao NAO e este pacote: e `ACCESS_COARSE_LOCATION` sem
  # `ACCESS_FINE_LOCATION` no AndroidManifest, e a chave
  # `NSLocationWhenInUseUsageDescription` sem nenhuma de `Always` no Info.plist
  # — o `geolocator_apple` LE o plist para decidir qual autorizacao pedir. As
  # duas sao cobradas por teste; ver `permissoes_de_loja_test.dart`.
  geolocator: ^14.0.2

  # ---------------------------------------------------------------------------
  # COORDENADA -> NOME DE CIDADE, autorizado pelo cliente em 19/10/2026.
  # ---------------------------------------------------------------------------
  #
  # A DECISAO, nas palavras dele: *"autorizar o gps, e trazer algum valor
  # padrao em caso de fallback"*. Ela veio depois de ele pedir duas vezes que a
  # pagina de pets mostrasse *"os pets cadastrados nessa cidade"* -- a cidade
  # em que a pessoa esta -- e depois de a conta honesta ser posta na mesa dele:
  # o caminho sem este pacote cobria 3 de 47 contas (`users.reference_city`
  # preenchido, medido em homologacao em 19/10/2026) e nenhum visitante
  # deslogado. A emenda do ADR-0006 tem a frase literal e a data.
  #
  # ===========================================================================
  # O QUE ELE MANDA PARA FORA, E PARA QUEM. LEIA ANTES DE USAR.
  # ===========================================================================
  # **A COORDENADA SAI DO APARELHO, para a Apple ou para o Google, a cada
  # resolucao.** Isto nao e suposicao e nao e leitura pessimista: e o que o
  # README do proprio pacote declara (linhas 13-15 de
  # `geocoding-5.0.0/README.md`), e o que o fonte confirma --
  # `geocoding_android` chama `android.location.Geocoder`
  # (`GeocoderProxyApi.kt`) e `geocoding_darwin` usa `CLGeocoder`.
  #
  # O README e literal: *"This plugin uses the free Geocoding services provided
  # by the iOS, macOS and Android platforms. This means that there are
  # restrictions to their use"*, *"When a `PlatformException(IO_ERROR, ...)`
  # gets thrown, most of the times it means that the rate limit has been
  # reached"*, e *"The availability of the Google Play Services depends on your
  # country"*. Teto de uso e disponibilidade por pais sao propriedades de
  # servico REMOTO. Nao ha resolucao local.
  #
  # A primeira versao desta decisao foi tomada sobre a premissa de que a
  # resolucao acontecia NO APARELHO, sem nada viajar. Essa premissa estava
  # errada, foi medida, foi corrigida com o cliente, e ele decidiu de novo com
  # o fato na mesa. Fica registrado porque a premissa errada e mais facil de
  # repetir que a decisao.
  #
  # O QUE O CLIENTE ACEITOU EM TROCA, e esta na emenda do ADR-0006:
  #   1. um terceiro (Apple/Google) no caminho de um dado pessoal;
  #   2. teto de uso, que faz a resolucao falhar sob volume;
  #   3. indisponibilidade por pais e por aparelho sem Play Services.
  #
  # NAO EXIGE CHAVE DE API NEM CONTA DE SERVICO, e isso foi conferido antes de
  # declarar: o README nao pede chave, nenhum dos quatro pacotes le credencial,
  # e as duas plataformas usam o servico gratuito do proprio sistema. Se algum
  # dia exigir, a decisao muda de natureza -- vira servico contratado, e o
  # ADR-0006 volta a valer contra.
  #
  # ===========================================================================
  # O PACOTE TRAZ OS DOIS SENTIDOS. SO UM ESTA AUTORIZADO.
  # ===========================================================================
  # `geocoding-5.0.0/lib/geocoding.dart` expoe os dois no mesmo arquivo:
  #
  #   placemarkFromCoordinates  coordenada -> lugar   AUTORIZADO
  #   locationFromAddress       endereco   -> ponto   PROIBIDO, segue proibido
  #
  # O segundo e exatamente o que o cabecalho de
  # `app/test/dispositivo/sem_geocodificacao_test.dart` nomeia: *"o CEP que
  # 'acha' o ponto de quem negou o GPS"*. Nao da para importar meio pacote,
  # entao a protecao mudou de forma: ela era a AUSENCIA da dependencia e passou
  # a ser ASSERCAO sobre o uso. Aquele portao NAO foi removido -- foi
  # ESTREITADO, e ganhou caso novo que reprova `locationFromAddress` em
  # qualquer importe, chamada ou porta do app.
  #
  # A porta e `lib/dispositivo/localizacao.dart`, e ela expoe **um** metodo de
  # conversao, num sentido so. Chamar o pacote direto de uma tela reprova no
  # portao.
  geocoding: ^5.0.0

  # ---------------------------------------------------------------------------
  # DESENHAR UM QR -- e por que este e o PRIMEIRO QR que o app desenha.
  # ---------------------------------------------------------------------------
  #
  # O app ja mostrava um QR antes deste pacote: o da plaquinha. Ele **nao e
  # desenhado aqui** -- chega como PNG pronto de
  # `GET /v1/pets/{petId}/tags/{tagId}/qr.png`, e o cabecalho de
  # `lib/widgets/qr_da_plaquinha.dart` pede, com todas as letras, que a proxima
  # pessoa NAO troque aquilo por um gerador local. Aquele pedido continua
  # valendo e este pacote nao o contraria: a plaquinha continua vindo do
  # servidor.
  #
  # O QR DO CONVITE E OUTRO CASO, e a diferenca esta no contrato:
  # `ConnectionInviteIssued` recusa devolver imagem e recusa devolver URL, com
  # o motivo escrito -- *"devolver URL absoluta amarraria o convite ao dominio
  # do dia"* -- e termina dizendo *"quem os monta e a tela"*. Nao ha PNG para
  # baixar, e nao vai haver: pedir um ao servidor seria pedir que ele monte o
  # endereco que ele acabou de recusar montar.
  #
  # O QUE ELE MANDA PARA FORA: **nada.** `qr_flutter` e pintura, e so. Ele
  # depende de `qr` (codificador puro em Dart) e desenha num `CustomPainter`.
  # Nao ha plugin, nao ha canal de plataforma, nao ha codigo nativo, nao ha
  # cliente HTTP e nao ha arquivo: o token nao sai do processo, e e por isso que
  # ele **nao** e pacote de aparelho e **nao** entra em `_importesProibidos` de
  # `app/test/dispositivo/porta_nao_contornada_test.dart` -- aquela lista e de
  # portas de aparelho, e este nao abre nenhuma.
  #
  # `^4.1.0` e nao `qr: ^4`: `qr_flutter 4.1.0` resolve com `qr 3.0.2`, e
  # declarar `qr` direto criaria a segunda fonte da versao do codificador.
  qr_flutter: ^4.1.0

  # SHA-256. **Era `dev_dependencies` ate 27/10/2026**, com a razao escrita:
  # "entra como dependencia de teste, e nao de producao, porque nada do app
  # assina nada". Continua verdade que o app nao ASSINA nada -- ele passou a
  # RESUMIR, que e outra coisa.
  #
  # O uso e um so: o nome dos arquivos do cache de imagem em disco (BICHUS-296),
  # em `lib/api/cache_de_imagens.dart`. A chave de cache de uma foto de pessoa
  # carrega o apelido dela, e o apelido **nao pode virar nome de pasta em
  # claro**: a pasta de cache e legivel por quem tem o aparelho na mao, e uma
  # lista de pastas com os apelidos seria a lista de com quem a pessoa tem
  # conexao -- o que o ADR-0025 decisao 2 proibe o produto de ter em forma
  # nenhuma.
  #
  # **A alternativa recusada foi escrever o resumo a mao.** Sem este pacote o
  # caminho seria um hash proprio dentro de um arquivo de privacidade, ou uma
  # codificacao REVERSIVEL (base64 do apelido), que devolveria o problema
  # inteiro. Pacote do time do Dart, ja resolvido no `pubspec.lock` desde antes
  # desta frente, e usado numa funcao de tres linhas.
  #
  # O portao do criterio 10 da BICHUS-161 continua usando o mesmo pacote, e
  # subir de `dev` para producao nao o afeta.
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Geradores de icone e de splash. Rodam em tempo de desenvolvimento, escrevem
  # arquivo nativo no disco e NAO entram no binario -- por isso `dev_`.
  #
  # Por que estes dois, e nao mao livre: icone de loja e splash sao quinze
  # arquivos por plataforma, em densidades que precisam bater exatamente. Feito
  # a mao, a divergencia entre densidades so aparece no aparelho de outra
  # pessoa. Feito por gerador, a fonte e um arquivo de arte e o resto e saida.
  # Sao tambem os dois pacotes que o proprio time do Flutter aponta na
  # documentacao de deployment, o que importa aqui porque o formato de icone
  # adaptativo e o da splash de Android 12 mudam com a plataforma e quem
  # acompanha a mudanca e o pacote, nao este repositorio.
  #
  # A configuracao dos dois esta no fim deste arquivo.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  # Fontes embarcadas, e nao baixadas em tempo de execucao: a tela do achador
  # pode ser a primeira tela que o aparelho ve, com sinal ruim
  # (docs/06-design-system.md secao 18.3). Licenca SIL OFL 1.1, em
  # assets/fonts/OFL.txt.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

  assets:
    - assets/fonts/OFL.txt
    # A ilustracao da identidade visual (tres pessoas com os pets no bairro),
    # na TELA DE ENTRAR. Embarcada, e nao baixada: a tela de login nao pode
    # depender de rede para ficar de pe -- e o mesmo motivo das fontes acima.
    #
    # ORIGEM E COMO REFAZER. A arte e do cliente e a fonte continua sendo
    # `design/marca/referencia/08-ilustracao-tres-pessoas.png` (1536x1024, com
    # vinheta). O arquivo daqui e DERIVADO da versao ja recortada de fundo que
    # o site usa, `web/src/assets/ilustracoes/ilustracao-tres-pessoas.png`:
    # margem transparente aparada (1399x700) e largura reduzida a 1152 px.
    # Nao da para apontar `assets:` para fora do pacote -- o Flutter recusa
    # caminho com `..` --, entao a copia aqui e obrigatoria; ela nao e uma
    # segunda FONTE, e uma saida medida, e e por isso que o comando esta
    # escrito:
    #
    #   node -e "require('sharp')('web/src/assets/ilustracoes/ilustracao-tres-pessoas.png')\
    #     .trim({threshold:1}).resize({width:1152}).webp({lossless:true,effort:6})\
    #     .toFile('app/assets/ilustracoes/tres-pessoas-no-parque.webp')"
    #
    # POR QUE 1152 px: a tela pinta a ilustracao numa caixa de no maximo
    # 384 dp de largura (ver `telas/conta/tela_entrar.dart`), e 1152 = 384 x 3,
    # a densidade do aparelho mais denso que o produto mira. Acima disso seria
    # peso que nenhum pixel usa.
    #
    # POR QUE WEBP SEM PERDA, e nao JPEG nem PNG. Medido nos tres, no mesmo
    # 1152x576, com o erro por canal calculado so onde ha desenho:
    #
    #   webp sem perda   451.292 B   erro 0,000   <- escolhido
    #   png de paleta    209.298 B   erro medio 0,760 / max 179
    #   png de 24 bits   782.360 B   erro 0,000
    #
    # A regra do produto e JPEG para FOTO, com alvo de 300-500 KB. Isto nao e
    # foto: e ilustracao de cor chapada COM CANAL ALFA (ela se apoia na
    # superficie do tema, nos dois temas), e JPEG nao tem alfa e ainda toca
    # anel nas bordas duras. Entre os dois que tem alfa, o WebP sem perda cabe
    # na faixa de 300-500 KB e nao mexe num byte da arte do cliente; o PNG de
    # 24 bits passa da faixa e o de paleta so cabe quantizando a marca.
    - assets/ilustracoes/tres-pessoas-no-parque.webp
    # A PLAQUINHA, na pagina de ACOMPANHAMENTO DO PEDIDO. Mesma regra da
    # ilustracao acima: embarcada, porque a pagina tem de ficar de pe antes de
    # qualquer resposta de rede chegar.
    #
    # ORIGEM E COMO REFAZER. Arte do cliente, sem um byte alterado:
    # `design/marca/referencia/04-tag-frente.png` (1297x1213, com alfa). E a
    # plaquinha de verdade -- a que o pedido vai produzir --, e nao um desenho
    # novo: nada aqui foi gerado por IA nem baixado da internet.
    #
    #   node -e "require('sharp')('design/marca/referencia/04-tag-frente.png')\
    #     .trim({threshold:1}).resize({height:432}).webp({lossless:true,effort:6})\
    #     .toFile('app/assets/ilustracoes/plaquinha-da-coleira.webp')"
    #
    # POR QUE 432 px DE ALTURA, e nao de largura: a tela pinta a ilustracao
    # numa caixa de no maximo 144 dp de ALTURA (`AcompanhamentoDoPedido`), e
    # 432 = 144 x 3, a densidade do aparelho mais denso que o produto mira. O
    # recorte do alfa decide a largura (351 px), e nao o contrario -- dimensionar
    # pela largura deixaria a altura maior do que o que e pintado.
    #
    # POR QUE WEBP SEM PERDA. Mesmo criterio ja medido para a outra ilustracao:
    # isto nao e foto, e cor chapada COM CANAL ALFA (ela se apoia na superficie
    # do tema, nos dois temas), e JPEG nao tem alfa e toca anel nas bordas
    # duras do traco. Medido nos tres, no mesmo 351x432:
    #
    #   webp sem perda   116.218 B   erro 0,000   <- escolhido
    #   png de paleta    100.797 B   quantiza a marca
    #   webp q92          43.068 B   com perda na borda dura
    #
    # 113,5 KB fica ABAIXO da faixa de 300-500 KB do produto, e a faixa e alvo
    # de peso e nao piso: nao ha motivo para gastar mais bytes do que a arte
    # precisa.
    - assets/ilustracoes/plaquinha-da-coleira.webp

# ---------------------------------------------------------------------------
# Icone do app (flutter_launcher_icons)
# ---------------------------------------------------------------------------
#
# Fonte da arte: `design/marca/app/`, na RAIZ do repositorio, fora deste
# pacote. E o mesmo arranjo de `tool/gen_tokens.dart`, que le
# `../design/tokens.json`: a marca tem uma fonte so, e ela nao mora dentro do
# app. Copiar os PNG para `app/assets/` criaria a segunda fonte da verdade que
# docs/06-design-system.md paragrafo 18.2.2 existe para impedir.
#
# Os quatro arquivos sao entrega da designer. Enquanto nao estiverem la, o
# comando abaixo FALHA dizendo qual arquivo faltou, que e o comportamento certo:
# gerador que nao acha a arte precisa parar, nao emitir icone em branco.
#
#   cd app && dart run flutter_launcher_icons
#   cd app && dart run tool/corrigir_splash_ios.dart
#
# O segundo comando carimba o perfil de cor nos PNG do catalogo de assets do
# iOS. As dezoito medidas do icone sofrem o mesmo desvio do fundo do splash --
# sem `sRGB` declarado, o Xcode le os componentes como Display P3 e o quadrado
# da marca sai em `#AD0038`. Ver o bloco do splash mais abaixo.
#
flutter_launcher_icons:
  # iOS: quadrado de 1024x1024 sem transparencia. A App Store recusa icone com
  # canal alfa (App Store Review Guidelines, secao de metadados; o proprio
  # Transporter barra no upload). `remove_alpha_ios` achata o alfa contra o
  # fundo em vez de deixar o build chegar ate a loja para descobrir la.
  ios: true
  image_path: "../design/marca/app/icone-ios-1024.png"
  remove_alpha_ios: true

  # Android. `android: true` sobrescreve o `ic_launcher` legado nas cinco
  # densidades (mipmap-mdpi a xxxhdpi) e reescreve
  # `mipmap-anydpi-v26/ic_launcher.xml` com as camadas declaradas abaixo.
  android: true

  # Icone adaptativo (Android 8.0 / API 26 em diante). Duas camadas separadas,
  # porque o sistema recorta a mascara do fabricante -- circulo, quadrado
  # arredondado, gota -- e desloca as camadas no parallax da tela inicial. Uma
  # imagem chapada unica fica cortada em aparelho que usa mascara redonda.
  #
  # GEOMETRIA, que e a parte que costuma sair errada:
  #   - cada camada e 108x108 dp;
  #   - a mascara do fabricante fica sobre os 72x72 dp centrais;
  #   - so os 66x66 dp centrais sao garantidos visiveis em TODA mascara
  #     (a "safe zone" do Material Design);
  #   - os 18 dp de cada borda existem para o parallax e SEMPRE somem.
  # Ou seja: o simbolo precisa caber nos 66 dp centrais, e nao nos 72. Os 72 dp
  # sao a MASCARA; a GARANTIA e 66, que e o numero mais restritivo e o que vale.
  # Medido na arte em vigor: 62,4 dp de diametro circunscrito, 3,6 dp de folga.
  #
  # ESTE BLOCO E A FONTE DA GEOMETRIA, e esta aqui por um motivo mecanico:
  # `mipmap-anydpi-v26/ic_launcher.xml` e SAIDA de `dart run
  # flutter_launcher_icons` e e reescrito a cada geracao, junto com os drawables
  # de camada. Qualquer explicacao que viva la se perde no proximo comando, sem
  # ninguem perceber. Este arquivo nao e gerado, entao a explicacao mora aqui.
  adaptive_icon_foreground: "../design/marca/app/icone-android-foreground.png"
  adaptive_icon_background: "../design/marca/app/icone-android-background.png"
  adaptive_icon_foreground_inset: 16

  # ICONE MONOCROMATICO (Android 13 / API 33, "themed icons"): DELIBERADAMENTE
  # VAZIO. Nao e esquecimento.
  #
  # O campo pede uma silhueta de uma cor so, que o sistema repinta com a cor do
  # papel de parede. Derivar essa silhueta do PNG colorido seria eu redesenhar
  # a marca do cliente por conta propria, e a regua de reducao de
  # docs/06-design-system.md paragrafo 3.10 mede o simbolo REPROVANDO abaixo de
  # 48px -- ou seja, a silhueta que eu inventasse sairia errada justamente no
  # tamanho em que ela e usada. Falta o VETOR da marca, que e item do cliente
  # (design/marca/README.md, pendencia 3).
  #
  # Sem este campo o Android 13+ usa o icone adaptativo colorido normal. Isso e
  # degradacao correta, nao defeito.
  # adaptive_icon_monochrome: "../design/marca/app/icone-android-monocromatico.png"

  # Piso declarado no gradle do Flutter. Abaixo de 26 o sistema ignora o
  # adaptativo e cai no `ic_launcher.png` legado, que continua sendo gerado.
  min_sdk_android: 21

# CONFIRA O `project.pbxproj` DEPOIS DE RODAR O GERADOR DE ICONE. A versao
# 0.14.4 tem um defeito: ela quer garantir
# `ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;` em cada configuracao de build
# e, nas configuracoes de NIVEL DE PROJETO (Debug e Release), onde essa chave
# nao existe, ela sobrescreve o VALOR da primeira chave `ASSETCATALOG_COMPILER_*`
# que encontra. Na pratica isso grava
# `ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS = AppIcon`, que
# o Xcode le como booleano: tudo que nao for `YES` vale `NO`. O efeito e desligar
# a geracao de simbolos de asset em Swift, em silencio e sem ninguem pedir.
#
# Revertido a mao em 21/09/2026 (BICHUS-141): as duas voltaram para `YES`. As
# configuracoes do ALVO Runner ja tem `ASSETCATALOG_COMPILER_APPICON_NAME` e
# nao precisam da chave; as de projeto nunca precisaram.
#
# Quem rodar `dart run flutter_launcher_icons` de novo precisa conferir:
#   git diff app/ios/Runner.xcodeproj/project.pbxproj
# O diff esperado desse comando e VAZIO. Qualquer linha
# `..._GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS = AppIcon` e o defeito voltando.

# ---------------------------------------------------------------------------
# Splash (flutter_native_splash)
# ---------------------------------------------------------------------------
#
# FUNDO CARMIM `#9E0B3A`. Semente escolhida pelo cliente em 21/09/2026 (secao
# 21 do design system). Era a Framboesa `#922C4A` de 17/09/2026.
#
# DE ONDE VEM O VALOR: `design/tokens.json`, primitivo `raspberry.700`, que e o
# `primary` do tema claro (`lib/theme/bichu_tokens.g.dart`). NAO e o fundo
# neutro do app (`#FAFAF8`, neutral.25) -- o splash e a unica superficie do
# produto que abre em cor de marca preenchida.
#
# ESTE VALOR ESTA DUPLICADO DE PROPOSITO. O XML de recurso do Android e o
# catalogo de assets do iOS sao lidos pelo sistema operacional antes de existir
# processo Dart: nenhum dos dois consegue ler `design/tokens.json`. A
# duplicacao e imposicao de plataforma, nao cor solta. Os pontos duplicados
# estao listados em `android/app/src/main/res/values-v31/styles.xml`, que e o
# unico deles que o gerador preserva comentario.
#
# Quem mudar a cor do splash precisa mudar, no mesmo commit:
#   1. `color` e `color_dark` aqui, e os mesmos dois dentro de `android_12`;
#   2. rodar os DOIS comandos abaixo, nesta ordem;
#   3. conferir que o valor continua igual a `raspberry.700` de
#      `design/tokens.json` -- se divergiu, o errado e aqui.
#
#   cd app && dart run flutter_native_splash:create
#   cd app && dart run tool/corrigir_splash_ios.dart
#
# O SEGUNDO COMANDO NAO E OPCIONAL. O `flutter_native_splash` escreve os PNG do
# catalogo de assets do iOS sem chunk de espaco de cor, e escreve o
# `backgroundColor` do `LaunchScreen.storyboard` em branco. Sem perfil
# declarado o Xcode trata os componentes como se fossem do gamut do display
# (Display P3) e a splash NATIVA do iOS abre em `#AD0038` -- medido no
# simulador, iPhone 18 Pro com iOS 27. O segundo comando carimba `sRGB`,
# `gAMA` e `cHRM` e troca o branco pela semente; ele e idempotente e desfaz
# exatamente o que o primeiro estraga.
#
# ESQUECER O PASSO 2 NAO E SILENCIOSO. `test/marca/arte_do_app_test.dart` le
# `design/tokens.json`, decodifica os PNG que os dois geradores assam e REPROVA
# quando o pixel diverge do token -- inclusive quando so estes quatro valores
# foram trocados e nenhum gerador rodou. Ate 21/09/2026 esse era o caminho em
# que o produto saia com duas cores de marca ao mesmo tempo e nenhum portao
# acusava, porque nada lia pixel.
#
# E `test/marca/splash_ios_test.dart` cobre a metade que a leitura de pixel NAO
# alcanca: ele nao pergunta qual e o byte, pergunta qual cor o iOS EXIBE a
# partir dele. Com o defeito do perfil de cor de pe, as oito iscas do arquivo
# acima ficavam VERDES -- o byte estava certo, o render e que nao.
#
flutter_native_splash:
  color: "#9E0B3A"
  # Mesmo valor no tema escuro: o cliente decidiu UM splash, nao dois. Sem esta
  # linha o Android usaria o branco do `values-night` e o app abriria branco
  # para quem esta no tema escuro, que e a maioria.
  color_dark: "#9E0B3A"

  # Simbolo da marca, centrado, em Marfim sobre o Carmim
  # (design/marca/referencia/03-icone-do-app.png). Arte da designer.
  image: "../design/marca/app/splash-simbolo.png"
  android_gravity: center
  ios_content_mode: center

  android: true
  ios: true
  # O produto nao tem alvo web. Deixar `true` faria o gerador escrever em
  # `web/`, que nao existe neste pacote.
  web: false

  # Android 12 (API 31) trocou o mecanismo: o sistema desenha a splash pela
  # SplashScreen API e IGNORA `android:windowBackground`. Sem este bloco o
  # aparelho de qualquer pessoa hoje abriria no fundo do tema, e nao no
  # Carmim -- e o teste em emulador antigo nao acusaria.
  #
  # O icone desta splash e recortado num circulo pelo sistema: a arte precisa
  # ser 1152x1152 com o desenho dentro dos 768px centrais, senao as bordas
  # entram no corte.
  android_12:
    color: "#9E0B3A"
    color_dark: "#9E0B3A"
    image: "../design/marca/app/splash-simbolo.png"
