# Esteira do Bichu. docs/07-devops.md secao 5.
#
# Ordem: do mais rapido para o mais caro, porque o primeiro estagio existe para
# economizar os outros.
#
# LEIA ISTO ANTES DE ACRESCENTAR `continue-on-error` OU `|| true` EM QUALQUER
# JOB: com a `main` sem protecao de branch (secao 13), esta esteira deixou de
# ser um portao e virou um DETECTOR. Ela nao impede o merge; ela diz que o
# merge estava errado. Job que fica verde sem verificar nao e neutro: ele ocupa
# o lugar de um que funcionaria.

name: ci

# A BRANCH PADRAO DO REPOSITORIO E `development`, e nao `main` (17/09/2026,
# repositorio novo `bichu-app/bichu-app`). Um gatilho so em `main` deixaria
# esta esteira sem disparar em nenhum PR do fluxo real de trabalho, que abre
# contra `development`: o arquivo existiria, os jobs estariam escritos, e nada
# rodaria. Portao que nao dispara nem chega a ficar verde sem verificar -- ele
# so consta.
on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development, 'integra/**']

permissions:
  contents: read
  # LEITURA, e so. O gitleaks chama `GET /repos/{dono}/{repo}/pulls/{n}/commits`
  # no evento `pull_request` para saber o intervalo que precisa varrer, e o
  # padrao `contents: read` responde 403 nesse endpoint -- o portao rapido caia,
  # e com ele os outros 7 jobs, que dependem dele.
  #
  # `write` faria a acao tambem comentar o achado no PR, e nao e o que queremos:
  # o comentario cita o TRECHO do segredo, em lugar publico e permanente. Um
  # vazamento viraria dois, e o segundo sobrevive ao rebase que apagar o
  # primeiro. Por isso o escopo para em `read` e o comentario segue desligado.
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rapidos:
    name: portoes rapidos (portabilidade, dispensas, segredo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: dispensas datadas
        run: python3 infra/verificacao/verificar_dispensas.py

      - name: portabilidade e hostname
        run: python3 infra/verificacao/verificar_portabilidade.py

      # BOA-FORMACAO DO XML QUE O BUILD DO APLICATIVO LE (22/09/2026).
      #
      # Duas vezes em dois dias a mesma classe derrubou o build do Android, com
      # a esteira e a suite verdes: `--` dentro de comentario XML, que a
      # especificacao proibe e o mesclador de manifesto do Gradle recusa --
      # `86499cb` (21/09) e `c0cd002` (22/09).
      #
      # ELE FICA AQUI, NO `rapidos`, E A ESCOLHA E DELIBERADA. 44 ms medidos,
      # sem Gradle, sem JDK e sem SDK do Android: ele reprova no PROPRIO commit
      # que traz o defeito, com arquivo, linha, coluna e o `--` apontado. Posto
      # no job `apk`, que ja pega a mesma coisa, chegaria 4 minutos e um JDK
      # depois, e com a mensagem pior ("Error parsing", sem linha).
      #
      # O que ele NAO cobre esta escrito no cabecalho do script e no alvo
      # `fechar-integracao` do Makefile: merge com o manifesto das bibliotecas,
      # placeholder do AGP e regra de esquema do Android. Essa metade continua
      # sendo do job `apk`, que compila de verdade.
      #
      # As iscas ANTES da conferencia, como no `apk`: elas sao seis arquivos
      # versionados em `infra/verificacao/iscas/manifesto-android/`, dois deles
      # os manifestos REAIS de 21 e 22/09 extraidos do commit quebrado. Mais
      # tres que precisam ser APROVADOS, porque portao que reprova quem esta
      # certo e desligado na primeira semana.
      - name: as iscas do portao de boa-formacao do manifesto reprovam
        run: python3 infra/verificacao/verificar_manifesto_android.py --autoteste

      - name: o XML que o build do aplicativo le esta bem formado
        run: python3 infra/verificacao/verificar_manifesto_android.py --raiz .

      # O guarda que torna a lista de fechamento obrigatoria: branch `integra/*`
      # so sai da maquina com o recibo de `make fechar-integracao` daquele
      # commit (`.githooks/pre-push`). O gancho e contornavel com `--no-verify`,
      # como o da `main`; o que NAO e contornavel e esta esteira, que roda em
      # `integra/**` desde 22/09 (ver o gatilho no topo do arquivo).
      #
      # Aqui rodam so as iscas: elas nao empurram nada e nao tocam no git.
      - name: as iscas do guarda de push de branch de integracao reprovam
        run: sh infra/verificacao/verificar-recibo-de-fechamento.sh --autoteste



      # BICHUS-211, as duas iscas. Nenhuma das duas precisa de docker nem de
      # `.env`, por isso estao aqui no primeiro estagio e nao no de integracao.
      #
      # A primeira roda o portao do invariante contra as iscas de
      # `iscas/portas-*.json` e exige que cada uma REPROVE. Ela nao confere a
      # configuracao real -- quem faz isso e o passo de mesmo nome no job
      # `integracao`, onde existe `.env` para o compose interpolar. O que ela
      # prova e que o portao continua enxergando: o dia em que alguem afrouxar
      # uma regra, a isca correspondente passa a aprovar e este passo cai
      # nomeando o arquivo.
      - name: as iscas do portao de portas reprovam
        run: python3 infra/verificacao/verificar_portas.py --autoteste

      # A segunda: havendo par livre, a escolha de portas nao pode entregar um
      # par ocupado -- e o que fazia `make up` sem argumento morrer em
      # `port is already allocated`. O cenario ocupa portas altas com socket do
      # proprio processo e inclui o caso `sem mecanismo`, que precisa reprovar.
      - name: "`make up` sem argumento nao cai no bind havendo par livre"
        run: python3 infra/verificacao/verificar_escolha_de_portas.py

      # BICHUS-213. O passo `o alvo de producao constroi, e morre
      # pelo motivo certo`, la no job `integracao`, aprova UMA morte e precisa
      # reprovar as outras -- um portao que aprova qualquer morte nao prova
      # nada, e era exatamente esse o risco de trocar a sonda por uma
      # conferencia de log.
      #
      # Aqui e nao la porque o juizo nao precisa de docker: ele le o log e a
      # lista `SEGREDOS_DE_RUNTIME` do codigo. Cada isca esta em
      # `iscas/boot-prod-*.log`, e a que precisa APROVAR foi capturada da
      # execucao 35721851040, que e a vermelha de hoje.
      - name: as iscas do juizo do alvo prod reprovam
        run: python3 infra/verificacao/verificar_boot_do_alvo_prod.py --autoteste

      # BICHUS-216, as iscas primeiro. Cada caso guardado precisa reprovar pela
      # regra DELE e so por ela: o autoteste compara conjuntos de regras, porque
      # isca que reprova por dois motivos ao mesmo tempo continua verde depois de
      # a regra que ela testava ser desligada, e passa a aprovar a regra
      # quebrada. Nao usa docker; roda em milissegundos.
      - name: as iscas do portao do commit de build reprovam
        run: make --no-print-directory verificar-commit-de-build-autoteste

      # BICHUS-219. O `portao` recusa `skipped` no nivel de JOB. Passo pulado
      # dentro de job que reporta sucesso nao passa por la -- e era assim que o
      # job `codigo` inteiro (lint, tipos, tipos gerados, suite unitaria) podia
      # ficar verde sem ter rodado nada, bastando `package.json` faltar.
      #
      # Este passo le `.github/workflows/*.yml` e recusa condicao de PASSO que
      # dependa de premissa que o proprio job mediu (`steps.*.outputs.*`, `env.*`,
      # `hashFiles(...)`). Condicao sobre o evento e sobre o resultado continua
      # valendo. A lista e de PERMITIDOS: forma que ele nao reconhece reprova, em
      # vez de passar por omissao.
      #
      # As iscas de `iscas/passos-condicionais/` rodam DENTRO deste comando,
      # antes dos workflows de verdade, e cada uma precisa reprovar pelo motivo
      # que ela isola -- nao so reprovar. Duas delas reprovavam parcialmente pelo
      # motivo do vizinho ate isso ser medido.
      - name: nenhum passo e pulado por premissa do proprio job, iscas primeiro
        run: python3 infra/verificacao/verificar_passos_condicionais.py

      # BICHUS-236, e ele e o irmao do passo de cima: aquele cuida de passo que
      # nao RODA, este cuida de passo que roda e fica verde SEM A RESPOSTA.
      #
      # O defeito medido hoje, no run 35750052587 da `main`: o passo do veredito
      # do SonarCloud saiu com HTTP 403 -- o veredito nunca foi obtido -- e a
      # dispensa datada `sonarcloud-veredito` engoliu a reprovacao. O job ficou
      # verde com uma indisponibilidade do SonarCloud. O `ci.yml` tinha um ramo
      # escrito contra isso, e o ramo era INALCANCAVEL: o destino de um passo so
      # assume quatro valores, e "nao consegui perguntar" e "perguntei e a
      # resposta e nao" tem o mesmo nome entre eles.
      #
      # Este passo fecha a CLASSE em vez do caso. Ele le todos os workflows e
      # recusa os tres mecanismos que a plataforma oferece para ler o destino de
      # um passo sem ler o que ele respondeu -- `continue-on-error: true`,
      # `steps.<id>.outcome`/`.conclusion`, e `needs.<job>.result` fora do `case`
      # com ramo padrao que reprova -- mais o shell declarando sucesso no
      # caminho de falha. A lista e de PERMITIDOS: forma que ele nao reconhece
      # REPROVA.
      #
      # A varredura de hoje achou TRES passos: os dois do SonarCloud e o
      # `compatibilidade contra main`, que lia "a base nao existe neste clone"
      # como "primeira introducao da spec". Os tres estao corrigidos neste
      # commit; o portao existe para o quarto.
      #
      # As iscas de `iscas/consulta-externa/` rodam DENTRO deste comando, antes
      # dos workflows de verdade, e cada uma isola UMA regra -- inclusive uma
      # que CITA `steps.x.outcome` num comentario e precisa APROVAR, porque uma
      # isca deste repositorio ja nasceu furada casando com a propria explicacao.
      - name: nenhum passo trata "nao consegui perguntar" como resposta, iscas primeiro
        run: python3 infra/verificacao/verificar_consulta_externa.py

      # BICHUS-236, o caso concreto de que a classe acima saiu. AQUI, e nao no
      # job `sonar`: os dois comandos levam milissegundos e nao precisam de
      # `npm ci`, e o job `sonar` so comeca depois do `codigo`. Portao que so
      # acusa vinte minutos adiante chega tarde.
      #
      # O primeiro sobe um SonarCloud de mentira em 127.0.0.1 e exige que 403,
      # 500, analise em FAILED, corpo sem `projectStatus.status` e relatorio
      # ausente virem `obtido: false` COM MOTIVO -- e nunca um veredito. Cada
      # caso cobra o fragmento de motivo que so o caminho dele escreve, e isso
      # foi medido: com a leitura do codigo HTTP desligada, o 403 escorre para
      # a conferencia seguinte e produz um envelope de campos identicos. Sem a
      # cobranca do motivo o autoteste ficava verde com a regra apagada.
      #
      # O segundo confere que "nao obtive" e "obtive e e negativo" continuam
      # sendo desfechos distintos, e que a dispensa `sonarcloud-veredito` so
      # cobre o segundo.
      - name: a busca do veredito traduz HTTP em envelope, e nao em veredito
        run: python3 infra/verificacao/buscar_veredito_do_sonar.py --autoteste

      - name: as iscas do juizo do veredito do SonarCloud reprovam
        run: python3 infra/verificacao/verificar_veredito_do_sonar.py --autoteste

      # Absorcao da BICHUS-210: o Dockerfile reprova o build sem `BUILD_COMMIT`
      # e o compose so repassa o que estiver no AMBIENTE, entao quem poe o valor
      # la e o Makefile. Este passo roda POR DENTRO do make de proposito -- ele
      # le a variavel do ambiente que o make montou, que e o caminho real. Apague
      # o `export` do Makefile e ele reprova; a pre-checagem do `make up`, que le
      # a variavel do make e nao o ambiente, continuaria passando.
      #
      # ELE CONTINUA AQUI, NO `rapidos`, E A ESCOLHA E DELIBERADA (BICHUS-216).
      # Ate 22/09 a terceira conferencia deste passo -- a que le
      # `build.args.BUILD_COMMIT` da configuracao renderizada -- ficava CEGA aqui,
      # porque nao ha `.env` neste job (ele so nasce no `integracao`, no
      # `cp .env.example .env`) e a renderizacao do compose falhava. A recusa era
      # engolida por um `except Exception` e o passo saia APROVADO.
      #
      # As duas saidas obvias foram medidas e recusadas:
      #
      #   - mover o passo para o `integracao` o poe DEPOIS do build, e depois de
      #     dois jobs. Portao que so acusa depois de construir a imagem chega
      #     tarde para pegar um `export` apagado num rebase;
      #   - `cp .env.example .env` aqui nao basta: o exemplo nasce com quatro
      #     chaves vazias que o compose exige com `:?`, e a renderizacao morre em
      #     `OBJECT_STORAGE_SECRET_ACCESS_KEY`. Passar dali exigiria repetir aqui
      #     as ~40 linhas de `sed` do job `integracao`, uma segunda copia que
      #     deriva da primeira na proxima variavel.
      #
      # O portao passou a renderizar contra um `.env` descartavel, derivado do
      # `.env.example` num diretorio temporario. `BUILD_COMMIT` continua vindo do
      # ambiente que o make exportou, que e o que este passo mede; todo o resto e
      # enchimento. A resposta passou a ser a mesma aqui e na maquina de quem tem
      # `.env` -- antes ela dependia do `.env` de cada um, em silencio.
      - name: o make exporta BUILD_COMMIT, e ele chega ao build
        run: make --no-print-directory verificar-commit-de-build

      # ADR-0016 (itens 4 e 6) e o defeito de 17/09. Tres conferencias num
      # script so, todas por leitura de arquivo, todas com isca guardada em
      # `infra/verificacao/iscas/`:
      #   - `x-edge-limits` do contrato contra os numeros do Caddyfile;
      #   - `PREFIXO_DA_API` do Fastify contra o caminho dos `servers`;
      #   - caminho que o contrato declara fora de `/v1` (os quatro
      #     `/.well-known/`) contra as rotas da borda.
      #
      # A terceira existe porque a segunda-feira 17/09 terminou com
      # `/.well-known/jwks.json` respondendo 404 pela borda enquanto o servico
      # o servia com 200 por dentro. Nada acusou: nao havia nada olhando.
      # Portao de intermitencia, classe "assercao de tolerancia zero sobre
      # quantidade sorteada". AQUI, no `rapidos`: ele le arquivo, nao precisa de
      # npm nem de docker, e roda em milissegundos. Portao que so acusa vinte
      # minutos adiante chega tarde.
      #
      # ELE E RASO, E O CABECALHO DELE DIZ ISSO EM VOZ ALTA. Ele pega a FORMA
      # das duas assercoes que reprovavam em 22/09 (contador de coincidencia
      # igual a zero; N sorteios que deram N distintos) e NAO pega assercao que
      # mede outra propriedade que nao a que o nome promete -- o furo que custou
      # o dia, e que e semantico. Ver `verificar-sorteio-sem-semente.mjs`.
      #
      # As iscas rodam DENTRO do comando, antes da varredura de verdade, e a
      # mais forte delas e o proprio `tag-code.test.ts` como ele era antes do
      # conserto: o portao precisa achar as duas assercoes que reprovavam e
      # NAO achar os dois casos estatisticos legitimos, de margens 10^-53 e
      # 8 sigma, que ja estavam no mesmo arquivo no mesmo dia.
      - name: nenhuma assercao de tolerancia zero sobre sorteio, iscas primeiro
        run: node infra/verificacao/verificar-sorteio-sem-semente.mjs

      - name: a borda concorda com o contrato
        run: python3 infra/verificacao/verificar_borda.py

      - name: varredura de segredo
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No evento `pull_request` a acao tenta COMENTAR no PR, e o token do
          # workflow so tem `contents: read` -- ela morria com "Resource not
          # accessible by integration" e derrubava o portao rapido, que e o
          # primeiro: os outros 7 jobs nem chegavam a rodar.
          #
          # A correcao natural seria conceder `pull-requests: write`. Nao e a
          # certa: o comentario do gitleaks cita o TRECHO do segredo achado, e
          # comentario de PR e publico e permanente. Um vazamento viraria dois.
          # Desligar o comentario mantem a varredura (que e o que importa: ela
          # reprova o job do mesmo jeito) e o token sem escopo de escrita.
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'true'

  codigo:
    name: lint, tipos e teste unitario
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: rapidos
    steps:
      - uses: actions/checkout@v4

      # BICHUS-219. ISTO ERA UM `if:`, E O `if:` ERA O DEFEITO.
      #
      # Ate hoje este passo escrevia `tem=sim`/`tem=nao` num output e os seis
      # passos abaixo carregavam `if: steps.existe.outputs.tem == 'sim'`. Sem
      # `package.json`, lint, typecheck, tipos gerados e `npm test` eram TODOS
      # pulados e o job reportava `success`. O `portao` recusa `skipped`, mas so
      # no nivel de JOB: passo pulado dentro de job que reporta sucesso passa
      # batido, e um job inteiro podia aprovar sem ter rodado nada.
      #
      # A premissa nao virou condicao: virou ASSERCAO. Ou o repositorio tem o
      # esqueleto de backend, e os passos abaixo rodam todos, ou ele nao tem, e
      # este passo derruba o job nomeando o motivo. As duas saidas sao visiveis;
      # a terceira, que era "verde sem ter olhado", deixou de existir.
      #
      # `infra/verificacao/verificar_passos_condicionais.py`, no job `rapidos`,
      # impede que a forma antiga volte por qualquer passo de qualquer workflow.
      - name: o esqueleto de backend existe
        run: |
          if [ ! -f package.json ]; then
            echo "::error::package.json nao existe. Este job inteiro (lint, tipos, tipos gerados e suite unitaria) so tem sentido com o esqueleto de backend no repositorio. Verificacao que nao consegue verificar REPROVA: um job verde aqui diria que o codigo foi conferido, e nada teria sido"
            exit 1
          fi
          echo "package.json presente; os passos deste job rodam todos, sem condicao"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: tipos
        run: npm run typecheck

      # Uma fonte, um destino gerado, e um portao que reprova na divergencia.
      # Sem isto, `src/shared/types/generated/` pode ser editado a mao e o
      # contrato e o codigo divergem SEM QUE O DIFF MOSTRE, porque a proxima
      # geracao desfaz a edicao em silencio.
      - name: tipos gerados batem com a spec
        run: |
          npm run generate:types
          if ! git diff --exit-code -- src/shared/types/generated/; then
            echo "::error::os tipos gerados divergem de api/openapi.yaml. Rode 'npm run generate:types' e versione o resultado; se o tipo esta errado, o errado e a especificacao"
            exit 1
          fi

      # BICHUS-219, as iscas ANTES da suite. `npm test` terminava num curinga
      # entregue ao runner, e padrao que nao casa nada sai `# tests 0` com
      # codigo 0 -- medido no Node 22.23.2, o mesmo desta imagem. O executor
      # calcula os caminhos do DISCO e exige que todo `*.test.ts` da fonte tenha
      # compilado correspondente executado. Este passo prova que ele continua
      # enxergando: cada regra reprova sozinha, contra arvore descartavel.
      - name: as iscas do executor da suite unitaria reprovam
        run: node infra/suite/executar-unitaria.mjs --autoteste

      # `--placar placar` nao muda o que a suite faz: ela so deixa uma COPIA do
      # relatorio TAP fora de `dist/`, para o passo seguinte conseguir ler
      # QUAIS casos reprovaram.
      - name: suite unitaria
        run: npm test -- --placar placar

      # O LIVRO DOS CASOS QUE PISCAM, e ele existe por causa de uma resposta
      # cultural e nao de um defeito de codigo: quando a suite reprova sem
      # defeito atras, a resposta que funciona e "roda de novo", e ela nao custa
      # nada porque a reprovacao EVAPORA -- o relatorio daquela execucao e
      # substituido pelo da seguinte. No dia em que a suite reprovar COM defeito,
      # alguem vai rodar de novo e seguir em frente.
      #
      # Os tres passos abaixo tiram o de graca. Eles nao impedem ninguem de
      # rodar de novo; eles fazem o caso APARECER numa lista que sobrevive a
      # execucao seguinte. Custo medido: menos de 2 s no runner.
      #
      # `restore-keys` casa por PREFIXO e devolve o cache mais recente. O preco
      # desta morada esta dito em `.github/workflows/repeticao.yml`: cache
      # expira em 7 dias sem uso e e por escopo de branch, entao o acumulado de
      # verdade se forma nas execucoes da `development` e na repeticao agendada.
      - name: restaura o livro dos casos que piscam (unitaria)
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: .livro
          key: livro-unitaria-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            livro-unitaria-

      # `always()` e o ponto inteiro: o livro existe PARA a execucao que
      # reprovou. Registrar so quando a suite passa seria manter uma lista de
      # nada. E `registrar` REPROVA quando nao acha placar para ler -- execucao
      # pulada em silencio estraga o denominador de todas as outras.
      - name: registra esta execucao no livro, e mostra o acumulado
        if: always()
        run: |
          node infra/suite/acumular-reprovados.mjs registrar \
            --livro .livro/unitaria.jsonl --tap placar/unitaria.tap --suite unitaria \
            --rotulo "ci ${{ github.run_id }}/${{ github.run_attempt }} ${{ github.ref_name }}"
          node infra/suite/acumular-reprovados.mjs render \
            --livro .livro/unitaria.jsonl --suite unitaria | tee -a "$GITHUB_STEP_SUMMARY"

      - name: guarda o livro (unitaria)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .livro
          key: livro-unitaria-${{ github.run_id }}-${{ github.run_attempt }}

  contrato:
    name: spec OpenAPI e compatibilidade
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: rapidos
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # VERSAO FIXA. `npx --yes @stoplight/spectral-cli` sem versao traz a
      # ultima do dia, e a esteira muda de comportamento num dia em que
      # ninguem tocou em nada. Uma regra de lint ja foi declarada funcionando
      # sendo cega por ter sido provada numa versao e rodada em outra.
      - name: spectral (6.15.0)
        run: npx --yes @stoplight/spectral-cli@6.15.0 lint api/openapi.yaml --ruleset infra/spectral/.spectral.yaml --fail-severity=error

      # BICHUS-25. O lint le `x-rate-limit-vocabulary` da raiz do contrato em
      # vez de carregar uma lista propria -- lista no lint e a segunda fonte da
      # verdade que faz o portao reprovar o documento que ele protege.
      #
      # As duas iscas do QA em `tests/lint-limite/` rodam DENTRO deste comando,
      # antes do contrato: a primeira precisa reprovar nas quatro operacoes,
      # nominalmente, e a segunda precisa passar. Se qualquer uma der o
      # resultado errado, o script falha com "o lint parou de enxergar" e nem
      # avalia o contrato.
      - name: lint de limite de chamada, com as iscas
        run: node infra/verificacao/verificar-limite-de-chamada.mjs api/openapi.yaml

      # BICHUS-125. O passo que faltava no dia em que "sair de todos os
      # aparelhos" nasceu quebrado em `development`.
      #
      # A migracao que acrescentava `logout_all` a restricao de
      # `refresh_tokens.revoked_reason` era a unica do repositorio sem o
      # marcador `-- Up Migration`. Sem ele o node-pg-migrate manda o arquivo
      # INTEIRO como subida: a descida rodava na sequencia da subida e a
      # desfazia. A migracao APLICOU-SE COM SUCESSO -- nenhum erro, nenhum
      # codigo de saida diferente de zero, nada vermelho em lugar nenhum -- e o
      # banco ficou errado em silencio. A esteira inteira ficou verde por um dia
      # com o remedio de quem perde o aparelho respondendo 500.
      #
      # O portao nao casa o texto `-- Up Migration`: ele importa o parser do
      # proprio node-pg-migrate e confere o SQL que ele de fato produz. A
      # expressao real e mais larga que a string (`-- UP MIGRATION` e
      # `---- up  migration` tambem valem), e uma das cinco iscas existe so para
      # provar que essas grafias PASSAM -- portao que reprova quem esta certo e
      # desligado na primeira semana.
      #
      # As iscas rodam DENTRO do comando, antes da varredura: tres precisam
      # reprovar e duas precisam passar. Se qualquer uma der o veredito errado,
      # o script termina em 1 sem nem olhar para `migrations/`.
      #
      # Sem `continue-on-error`: este passo REPROVA a esteira.
      - name: portao de migracao (a descida nao roda com a subida), iscas primeiro
        run: node infra/verificacao/verificar-marcador-de-migracao.mjs migrations

      - run: npm run build

      # BICHUS-55. O portao existia, com teste ao lado, e NENHUM job o
      # executava: nem script no package.json, nem passo aqui. Portao que
      # ninguem roda e a versao pior de um job que fica verde sem verificar --
      # ele nem chega a ocupar o lugar, so consta.
      #
      # O script roda as iscas ANTES do contrato, e nao se contenta com o
      # codigo de saida: cada isca declara no `.esperado` ao lado o que precisa
      # aparecer na saida. O motivo e concreto -- enquanto a assercao de
      # cabecalhos do criterio 5 estiver sem alvo (o ADR-0017 tirou as paginas
      # HTML deste servico), o portao reprova QUALQUER documento, e um passo
      # que so perguntasse "reprovou?" ficaria verde com ele cego para
      # vazamento de campo.
      #
      # ESTE PASSO REPROVA HOJE, e a reprovacao e o portao funcionando: e o
      # achado de escopo do criterio 5, descrito em docs/07-devops.md 5.7.2.
      # Ele nao se conserta em `.github/`, e nao se conserta com
      # `continue-on-error`.
      - name: portao de contrato publico, iscas primeiro
        run: sh infra/verificacao/verificar-contrato-publico.sh api/openapi.yaml

      # BICHUS-188. Mesma historia do portao acima, e por isso o mesmo remedio:
      # ele nasceu com teste ao lado e NENHUM job o executava. A entrega que o
      # criou registrou a lacuna por escrito, e regra escrita com mecanismo
      # ausente e a familia de defeito que este projeto passou o dia
      # catalogando -- ninguem acusa, porque ninguem procura o que acredita ja
      # ter.
      #
      # `created_by_user_id` e "quem convidou": vinculo entre duas pessoas, que
      # o ADR-0011 secao 4 proibe expor. A proibicao valia "em revisao", e
      # revisao humana esquece.
      #
      # ISCAS PRIMEIRO, e aqui elas nao sao zelo: as duas tabelas nasceram sem
      # rota, entao o contrato tem ZERO ocorrencia das colunas marcadas e a
      # varredura real nao tem o que achar. Sem as tres iscas este passo ficaria
      # verde por nao ter olhado para nada -- e continuaria verde no dia em que
      # quebrasse. Elas cobrem o vazamento no contrato, o vazamento em codigo, e
      # o apagamento da marca no COMMENT ON COLUMN, que e o pior dos tres porque
      # deixa o portao sem lista e ele passa a aprovar tudo calado.
      #
      # Sem `continue-on-error`: este passo REPROVA a esteira.
      - name: portao de saida (colunas que nao saem), iscas primeiro
        run: sh infra/verificacao/verificar-colunas-que-nao-saem.sh .

      # BICHUS-13 criterio 12, parte que NAO depende de rede. O comando roda o
      # autoteste das iscas antes de qualquer outra coisa: se o comparador
      # deixar de enxergar, ele falha dizendo isso.
      #
      # Sem destino nenhum de proposito. Num PR o destino hospedado ainda nao
      # foi implantado com o codigo deste PR, e compara-lo aqui reprovaria por
      # motivo errado -- que e como um portao vira ruido e depois vira
      # `continue-on-error`. O que ESTE passo confere e a lista fechada: todo
      # servico com `profiles:` no compose precisa estar declarado como ausente
      # no destino hospedado, com motivo, e toda declaracao precisa corresponder
      # ao arquivo. A comparacao entre os dois enderecos roda em
      # `.github/workflows/dois-destinos.yml`, agendada, e o comando imprime em
      # voz alta que ela NAO rodou aqui.
      - name: a divergencia entre destinos esta declarada em lista fechada
        run: node dist/tools/comparar-destinos.js

      - name: compatibilidade contra main
        if: github.event_name == 'pull_request'
        run: |
          # ESTE TRECHO TINHA A MESMA FORMA DO DEFEITO DO SONARCLOUD, e por
          # isso mudou em 22/09/2026. Ele era:
          #
          #     git show origin/<base>:api/openapi.yaml > /tmp/base.yaml 2>/dev/null || {
          #       echo "::notice::sem versao anterior da spec"; exit 0; }
          #
          # "o arquivo nao existe na base" e "a base nao existe neste clone"
          # colapsavam no mesmo codigo de saida, e os dois viravam APROVACAO: o
          # portao inteiro de quebra de contrato saia pela porta do `exit 0`
          # com um `::notice::`, que ninguem le. Uma base nao encontrada -- ref
          # renomeada, `fetch-depth` alterado, fetch parcial -- lia-se como
          # "primeira introducao da spec", e nenhuma quebra seria detectada.
          #
          # Agora sao DUAS perguntas, nesta ordem, e elas tem desfechos
          # diferentes: a base existe? (nao existir REPROVA, nomeando a ref) e
          # o arquivo existe nela? (nao existir e aprovacao legitima).
          ref="origin/${{ github.base_ref }}"
          if ! git rev-parse --verify --quiet "$ref^{commit}" > /dev/null; then
            echo "::error::$ref nao existe neste clone. Sem a base NAO DA PARA SABER se esta spec quebra contrato -- e nao saber nao e o mesmo que nao quebrar. Ou o checkout parou de trazer a base (ver \`fetch-depth: 0\`), ou a branch de destino mudou de nome"
            exit 1
          fi
          if git cat-file -e "$ref:api/openapi.yaml" 2> /tmp/cat-file.err; then
            git show "$ref:api/openapi.yaml" > /tmp/base.yaml
            test -s /tmp/base.yaml
          else
            echo "::notice::$ref existe e nao carrega api/openapi.yaml: primeira introducao da spec"
            cat /tmp/cat-file.err
            exit 0
          fi
          # `oasdiff` e um binario Go. O pacote npm de mesmo nome NAO declara
          # executavel, e `npx --yes oasdiff` morre com "could not determine
          # executable to run" -- o passo reprovava por ferramenta ausente, e
          # nao por incompatibilidade, que e a pior forma de portao vermelho.
          #
          # O passo inteiro so roda em `pull_request`, entao ele estreou no
          # PRIMEIRO PR deste repositorio, meses depois de escrito. E o mesmo
          # padrao do gitleaks e do TAG_CODE_KEY na mesma esteira: passo que
          # nunca executou nao esta funcionando, esta sem noticia.
          #
          # Versao fixada pelo mesmo motivo do spectral acima.
          # As iscas do filtro ANTES de usar o filtro: um comparador que
          # deixou de enxergar aprova tudo em silencio, e este passo existe
          # justamente para nao aprovar em silencio.
          python3 infra/verificacao/verificar_quebras_de_contrato.py --autoteste
          # `--format json` em vez de `--fail-on ERR`: o veredito passa a ser
          # tomado por quem consegue distinguir a quebra dispensada, POR NOME,
          # de qualquer outra. `continue-on-error` aqui desligaria o portao
          # inteiro, e desligamento nao volta atras.
          docker run --rm -v /tmp:/tmp -v "$PWD:/repo" -w /repo tufin/oasdiff:v1.32.1 \
            breaking /tmp/base.yaml api/openapi.yaml --format json > /tmp/quebras.json
          # O VENCIMENTO da dispensa nao e conferido aqui: quem o confere e
          # `verificar_dispensas.py`, no job `rapidos`, de que este job depende.
          # Dispensa vencida derruba `rapidos` e este passo nem executa.
          python3 infra/verificacao/verificar_quebras_de_contrato.py /tmp/quebras.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
          # `tee` mascara o codigo de saida do python. Guardado aqui e usado na
          # ULTIMA linha: sair agora pularia o changelog abaixo, e sair nunca
          # deixaria o passo verde com a reprovacao impressa no resumo -- que e
          # a pior forma de portao, a que parece ter funcionado.
          veredito="${PIPESTATUS[0]}"

          # Campo ACRESCENTADO nao quebra ninguem e por isso passa nas
          # ferramentas -- e e exatamente por ali que a implementacao se afasta
          # do documento sem nenhum alarme. Aviso obrigatorio, nao reprovacao.
          docker run --rm -v /tmp:/tmp -v "$PWD:/repo" -w /repo tufin/oasdiff:v1.32.1 \
            changelog /tmp/base.yaml api/openapi.yaml | tee -a "$GITHUB_STEP_SUMMARY"

          exit "$veredito"

  integracao:
    name: compose, migracao do zero e pilha de pe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [codigo, contrato]
    steps:
      - uses: actions/checkout@v4

      - name: ambiente de teste
        run: |
          cp .env.example .env
          # Valores de ambiente de teste, descartaveis e sem valor fora daqui.
          senha=ci-descartavel
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$senha/" .env
          # DATABASE_URL CARREGA A SENHA. Trocar so POSTGRES_PASSWORD deixava a
          # url com senha vazia, e a api subia e falhava na primeira consulta
          # com "password authentication failed" -- erro de credencial num job
          # que ninguem associa a credencial.
          sed -i "s#^DATABASE_URL=.*#DATABASE_URL=postgres://bichu:$senha@db:5432/bichu#" .env
          sed -i 's/^OBJECT_STORAGE_ACCESS_KEY_ID=.*/OBJECT_STORAGE_ACCESS_KEY_ID=ci-descartavel/' .env
          sed -i 's/^OBJECT_STORAGE_SECRET_ACCESS_KEY=.*/OBJECT_STORAGE_SECRET_ACCESS_KEY=ci-descartavel-segredo/' .env
          # O MinIO exige esta chave para cifrar no servidor, e a politica de
          # upload assinada manda `x-amz-server-side-encryption` (BICHUS-87,
          # criterio 22). Sem ela o `compose.yaml` nem valida -- ele usa
          # `${OBJECT_STORAGE_KMS_KEY:?}`.
          #
          # NAO e coberta pela guarda `nenhuma variavel exigida ficou vazia`: a
          # guarda le os `requireEnv()` do codigo da APLICACAO, e esta variavel
          # e exigida pelo COMPOSE. A guarda continua valendo para o que ela
          # cobre; este comentario existe para a proxima pessoa nao concluir que
          # ela cobre tudo.
          sed -i "s|^OBJECT_STORAGE_KMS_KEY=.*|OBJECT_STORAGE_KMS_KEY=ci-descartavel:$(openssl rand -base64 32)|" .env
          # `SECRET_STORE_PROJECT` so e EXIGIDA em prod/preprod, onde os segredos
          # vem do gerenciador (ADR-0022). Este job roda em `dev` e nunca a le.
          # Ela esta aqui porque a guarda abaixo conta `requireEnv('NOME')` por
          # TEXTO e nao conhece condicional -- e isso e de proposito: ensina-la a
          # entender `if` faria dela uma analise de fluxo, e analise de fluxo
          # incompleta e o tipo de guarda que aprova o que nao entende.
          # Valor descartavel, jamais usado: nenhum segredo e buscado em `dev`.
          sed -i 's|^SECRET_STORE_PROJECT=.*|SECRET_STORE_PROJECT=projeto-de-ci-descartavel|' .env
          grep -q '^SECRET_STORE_PROJECT=' .env || echo 'SECRET_STORE_PROJECT=projeto-de-ci-descartavel' >> .env
          # `FCM_PROJECT` so e EXIGIDA com `PUSH_TRANSPORT=fcm` (ADR-0008). Este
          # job roda em `log`, que e o padrao do .env.example, e nunca a le --
          # com `log` nada sai do processo. Ela esta aqui pelo MESMO motivo de
          # `SECRET_STORE_PROJECT` logo acima: a guarda seguinte conta
          # `requireEnv('NOME')` por TEXTO e nao conhece condicional, e isso e
          # de proposito. Sem esta linha a guarda reprova o job citando
          # FCM_PROJECT, que foi como ela reprovou hoje.
          #
          # Valor descartavel e que NAO PARECE um projeto de verdade: se um dia
          # este job passar a rodar com `fcm`, o envio precisa falhar dizendo
          # que o projeto nao existe -- e nao acertar um projeto de alguem.
          sed -i 's|^FCM_PROJECT=.*|FCM_PROJECT=projeto-de-ci-que-nao-existe|' .env
          grep -q '^FCM_PROJECT=' .env || echo 'FCM_PROJECT=projeto-de-ci-que-nao-existe' >> .env
          # `MAIL_WEBHOOK_SECRET` nasce VAZIA no `.env.example` e e exigida por
          # `requireEnv` -- a guarda antiga nao a via, pelo motivo explicado no
          # passo de baixo. Com a leitura corrigida ela passa a reprovar aqui,
          # que e o comportamento certo: ela e a UNICA autenticacao do webhook
          # de entrega, e `app-config.ts` recusa menos de 32 bytes.
          sed -i "s|^MAIL_WEBHOOK_SECRET=.*|MAIL_WEBHOOK_SECRET=ci-descartavel-$(openssl rand -hex 24)|" .env
          # Chaves geradas NO JOB e jogadas fora com o runner: chave de
          # assinatura de verdade nunca entra em repositorio nem em log.
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/ativa.pem 2>/dev/null
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/rotacao.pem 2>/dev/null
          python3 - <<'FIM'
          import base64, pathlib, re
          env = pathlib.Path('.env')
          texto = env.read_text()
          def trocar(chave, valor):
              global texto
              texto = re.sub(rf'^{chave}=.*$', f'{chave}={valor}', texto, flags=re.M)
          trocar('JWT_ACTIVE_PRIVATE_KEY', base64.b64encode(pathlib.Path('/tmp/ativa.pem').read_bytes()).decode())
          trocar('JWT_NEXT_PRIVATE_KEY', base64.b64encode(pathlib.Path('/tmp/rotacao.pem').read_bytes()).decode())
          trocar('IP_HMAC_KEY', base64.b64encode(b'ci-descartavel-de-32-bytes-no-min').decode())
          # Hex de 64 caracteres: app-config.ts recusa qualquer outro tamanho.
          trocar('TAG_CODE_KEY', 'c1' * 32)
          # DIFERENTE da de cima, e nao por estetica: `app-config.ts` recusa
          # subir com as duas iguais (ADR-0004, Emenda 1).
          trocar('TAG_CODE_INDEX_KEY', 'd2' * 32)
          env.write_text(texto)
          FIM
          docker compose config -q

      - name: nenhuma variavel exigida ficou vazia
        # A ausencia de TAG_CODE_KEY quebrou este job em 17/09 e a causa so
        # aparecia no log da api em loop de restart, dezenas de linhas abaixo
        # do passo que realmente falhou. O passo acima nomeia cada segredo a
        # mao, entao TODA variavel nova quebra a pilha ate alguem lembrar de
        # edita-lo. Esta guarda le as exigencias do PROPRIO CODIGO e falha em
        # segundos com o nome da variavel, em vez de deixar a pilha morrer.
        #
        # A LEITURA MUDOU DE LUGAR EM 22/09, E O MOTIVO IMPORTA.
        # Ela era um script Python inline aqui, e retirava comentario de BLOCO
        # antes de comentario de LINHA. `src/shared/config/app-config.ts:531`
        # tem um `/*` DENTRO de um comentario de linha (`/.well-known/*`), que
        # abre um bloco para a expressao regular e engole o que vem depois.
        # Resultado medido: a guarda enxergava 12 das 23 variaveis exigidas e
        # anunciava "todas preenchidas". Entre as 11 invisiveis estava
        # TAG_CODE_KEY -- a variavel cuja falta motivou escrever esta guarda.
        # Ela era cega justamente para o caso que existia para pegar.
        #
        # Agora a leitura mora em `infra/integracao/variaveis-exigidas.mjs`,
        # com autoteste que REPROVA se a ordem voltar a inverter, e e a MESMA
        # que gera o `.env` da pilha de integracao dos worktrees. Duas copias
        # da mesma leitura divergem, e a que diverge para menos aprova o que
        # nao conferiu.
        run: |
          node --input-type=module -e '
            import { lerVariaveisExigidas, autoteste } from "./infra/integracao/variaveis-exigidas.mjs";
            import { readFileSync } from "node:fs";
            console.log(autoteste());
            const { exigidas, opacas } = lerVariaveisExigidas("src");
            if (opacas.length > 0) {
              console.log("::error::ha chamada de requireEnv cujo nome esta fora do alcance desta "
                + "guarda (variavel ou template literal). Ela NAO esta sendo conferida: " + opacas.join("; "));
              process.exit(1);
            }
            const env = Object.fromEntries(readFileSync(".env", "utf8").split("\n")
              .filter((l) => l.includes("=") && !l.trimStart().startsWith("#"))
              .map((l) => [l.slice(0, l.indexOf("=")), l.slice(l.indexOf("=") + 1)]));
            const faltando = exigidas.filter((v) => (env[v] ?? "").trim() === "");
            if (faltando.length > 0) {
              console.log("::error::o .env deste job nao preenche variavel exigida pelo codigo: "
                + faltando.join(", ") + " -- acrescente um valor descartavel no passo \"ambiente de teste\"");
              process.exit(1);
            }
            console.log(exigidas.length + " variaveis exigidas pelo codigo, todas preenchidas");
          '

      # BICHUS-210. O commit entra por ARGUMENTO DE BUILD e fica gravado na
      # imagem; o Dockerfile REPROVA o build sem ele. Esta linha precisa vir
      # antes de qualquer `docker compose build` deste job.
      #
      # `git rev-parse HEAD` e nao `github.sha`: os dois coincidem em `push`,
      # mas em `pull_request` o `actions/checkout` posiciona o merge commit, e
      # e ELE que esta sendo construido. Perguntar ao repositorio clonado
      # responde sobre o que a imagem de fato carrega; `github.sha` responde
      # sobre o evento, e sao coisas diferentes no dia em que divergem.
      - name: o commit de que esta imagem vai sair
        run: |
          commit=$(git rev-parse HEAD)
          echo "BUILD_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "construindo a partir de $commit"

      # BICHUS-211, contra a configuracao REAL: com o `.env` do passo acima
      # montado, o compose ja interpola tudo, e aqui se confere porta publicada
      # contra as cinco URLs base. Vem ANTES do build e da subida de proposito:
      # o defeito que ele pega nao derruba a pilha -- ela sobe, a sonda passa, e
      # o link gerado e que aponta para porta muda. Depois de `up` seria tarde e
      # verde.
      - name: porta publicada e URL base de acordo
        run: python3 infra/verificacao/verificar_portas.py

      - name: constroi a imagem (dev) e o migrador
        run: docker compose --profile dev build

      # BICHUS-215. ANTES de subir a pilha, de proposito: o defeito que este
      # passo pega nao derruba servico nenhum -- a pilha sobe inteira, a sonda
      # passa, as migracoes aplicam, e a reprovacao so chega no ULTIMO passo do
      # job, `Cannot find module`, depois de dez minutos de runner.
      #
      # Em 22/09 foi exatamente assim (execucao 35725325183): o alvo `dev`
      # copia diretorio NOME A NOME, a BICHUS-204 tinha movido o executor da
      # suite para `infra/integracao/`, e nenhum `COPY` alcancava. O
      # `.dockerignore` nunca teve culpa.
      #
      # O que este passo confere nao e uma lista: ele varre QUEM manda
      # `npm run <script>` dentro de conteiner (esta esteira, o Makefile e
      # `rodar.mjs`), resolve os arquivos que cada script abre -- importacao em
      # cadeia inclusive -- e exige que estejam na imagem. Rodar a suite de um
      # worktree nao substitui isto: `compose.integracao.yaml` monta a arvore
      # por cima de `/app` e tudo aparece pelo volume, com a imagem vazia.
      #
      # As iscas rodam ANTES da imagem real, dentro do proprio script: duas
      # imagens mutiladas derivadas desta, que PRECISAM reprovar.
      - name: a imagem carrega o que a esteira manda rodar dentro dela
        run: node infra/verificacao/verificar-arquivos-no-container.mjs bichu-app:local | tee -a "$GITHUB_STEP_SUMMARY"

      - name: sobe a pilha inteira, do zero
        # `--wait` e o que torna este passo uma verificacao: ele so devolve 0
        # quando toda sonda passou. Sem ele, o job ficaria verde com a api
        # morta e a falha apareceria no `curl` de baixo sem dizer qual servico
        # nao subiu.
        run: docker compose --profile dev up -d --wait

      - name: as seis migracoes rodaram em banco vazio
        # O volume nasce vazio no runner, entao este passo prova o que
        # `make reset` prova na maquina de quem desenvolve. Compara com a
        # CONTAGEM DE ARQUIVOS: numero fixo aqui vira mentira na proxima
        # migracao e ninguem percebe, porque o job continua verde.
        run: |
          esperado=$(find migrations -maxdepth 1 -name '*.sql' | wc -l | tr -d ' ')
          aplicadas=$(docker compose exec -T db psql -U bichu -d bichu -t -A -c 'select count(*) from pgmigrations')
          echo "migracoes em disco: $esperado / aplicadas: $aplicadas"
          if [ "$esperado" != "$aplicadas" ]; then
            echo "::error::migracao nao aplicada. Ver o servico \`migracao\` no compose"
            docker compose logs migracao
            exit 1
          fi

      - name: a sonda responde PELA BORDA, e nao so por dentro
        # Pela porta publicada, atravessando o Caddy: sonda batida de dentro do
        # container passa com BIND_HOST errado, que e justamente o defeito que
        # deixa o servico inalcancavel de fora.
        run: |
          corpo=$(curl -sS --fail --max-time 10 http://localhost:3000/v1/health)
          echo "$corpo"
          echo "$corpo" | grep -q '"status":"ok"'
          echo "$corpo" | grep -q '"database":"ok"'

      # A borda responde o que o contrato promete, PELA PORTA PUBLICADA.
      # `verificar_borda.py` le arquivo; este bate na borda de verdade, e e o
      # unico que pega a regra escrita e nao valendo: em 17/09 o Caddyfile
      # tinha os dois blocos de `/.well-known/` e `/srv/well-known` nao estava
      # montado -- 404 com `Content-Type: application/json`, um 404 que parece
      # um arquivo.
      - name: os quatro /.well-known respondem pela borda, sem redirecionamento
        run: python3 infra/verificacao/verificar_borda_local.py http://localhost:3000 .

      - name: api e worker rodam a MESMA imagem
        # A frase "uma imagem, dois pontos de entrada" (ADR-0001) so vale
        # enquanto for verdade no runtime. Aqui ela vira verificacao.
        run: |
          imagem_api=$(docker inspect bichu-api-1 --format '{{.Image}}')
          imagem_worker=$(docker inspect bichu-worker-1 --format '{{.Image}}')
          echo "api=$imagem_api worker=$imagem_worker"
          if [ "$imagem_api" != "$imagem_worker" ]; then
            echo "::error::api e worker estao em imagens diferentes. Ver o campo \`image\` nos dois servicos"
            exit 1
          fi

      # BICHUS-13 criterio 12. `docker inspect` acima compara a IMAGEM dos dois
      # containers; este passo compara o que cada PROCESSO calcula sobre si
      # mesmo, lendo `dist/` e o contrato de dentro do container.
      #
      # Sao coisas diferentes e as duas importam: a imagem pode ser a mesma e um
      # volume montado por cima trocar o codigo, e a imagem pode ser outra
      # (construida noutro momento, noutro destino) com o mesmo codigo. Entre
      # DESTINOS so a segunda comparacao e possivel sem publicar a imagem num
      # registry, e e ela que viaja na resposta de `/v1/health`.
      - name: a sonda diz QUAL artefato esta no ar
        run: |
          corpo=$(curl -sS --fail --max-time 10 http://localhost:3000/v1/health)
          echo "$corpo"
          artefato=$(printf '%s' "$corpo" | sed -n 's/.*"artifact":"\([0-9a-f]*\)".*/\1/p')
          if [ -z "$artefato" ]; then
            echo "::error::/v1/health respondeu sem \`build.artifact\`. Sem identificador de build na resposta, \"os dois destinos rodam a mesma coisa\" volta a ser palavra (BICHUS-13, criterio 12)"
            exit 1
          fi
          case "$artefato" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "::error::\`build.artifact\` nao tem a forma esperada: $artefato"; exit 1 ;;
          esac
          echo "artefato no ar: $artefato" | tee -a "$GITHUB_STEP_SUMMARY"

      # BICHUS-210. A outra metade da pergunta: o artefato diz O QUE roda, o
      # commit diz DE ONDE ele veio.
      #
      # POR QUE ESTE PASSO NAO E UM `grep '"commit"'`. O campo ja existia no
      # contrato e vinha `null` nos dois ambientes: conferir a presenca ficaria
      # verde com o defeito inteiro de pe. O verificador cobra o VALOR, e cobra
      # que ele seja o commit de que a imagem foi construida -- sem a segunda
      # metade, fixar uma string no codigo deixaria este portao verde
      # reportando a mentira.
      #
      # As iscas rodam ANTES da rede, dentro do proprio script, e uma delas e
      # exatamente o corpo que os dois ambientes respondiam em 22/09.
      - name: a sonda diz de QUAL COMMIT o artefato saiu
        run: |
          node infra/verificacao/verificar-commit-no-health.mjs \
            http://localhost:3000 "$BUILD_COMMIT" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: api e worker calculam o MESMO artefato, de dentro
        # O worker nao fala HTTP, entao o valor e pedido ao modulo diretamente.
        # E a mesma funcao que a api usa para responder a sonda.
        run: |
          calcular="import('/app/dist/shared/artefato/identidade-do-artefato.js').then(m=>console.log(m.resumirArtefato('/app')))"
          artefato_api=$(docker compose exec -T api node -e "$calcular" | tr -d '\r')
          artefato_worker=$(docker compose exec -T worker node -e "$calcular" | tr -d '\r')
          echo "api=$artefato_api worker=$artefato_worker"
          if [ "$artefato_api" != "$artefato_worker" ]; then
            echo "::error::api e worker calculam artefatos diferentes. A imagem pode ser a mesma e o codigo nao: procure volume montado por cima de \`dist\` nos dois servicos"
            exit 1
          fi

      - name: limites de memoria estao valendo de verdade
        run: |
          # `deploy.resources.limits` fora do Swarm e ignorado EM SILENCIO e o
          # arquivo parece correto. Conferir no runtime, nao no YAML.
          docker stats --no-stream --format '{{.Name}} {{.MemUsage}}' | tee -a "$GITHUB_STEP_SUMMARY"
          for c in bichu-db-1 bichu-api-1 bichu-worker-1; do
            limite=$(docker inspect "$c" --format '{{.HostConfig.Memory}}')
            if [ "$limite" = "0" ]; then
              echo "::error::o limite de memoria de $c nao esta valendo. Ver o bloco no topo do compose.yaml"
              exit 1
            fi
            echo "limite de $c aplicado: $limite bytes"
          done

      # BICHUS-213. ESTE PASSO MUDOU DE PROMESSA EM 22/09, E VALE LER O PORQUE.
      #
      # Ate 22/09 ele dizia "constroi e SOBE", e a sonda era a prova. Isso
      # funcionou ate a ADR-0022 entrar na `development`: em
      # `NODE_ENV=production` o boot busca oito segredos no Secret Manager, e
      # num runner do GitHub nao ha metadata server nem projeto -- o `.env`
      # deste job aponta para `projeto-de-ci-descartavel`, que nao existe de
      # proposito. O processo morre antes de ouvir a porta, e nao ha conserto
      # para isso DENTRO da esteira.
      #
      # Medido na execucao 35721851040. E nao foi surpresa de todo: o passo
      # ficou verde pela ultima vez em 19/09 as 16h26, no commit 6b923e2, que
      # e ANTERIOR a ADR-0022. Entre um e outro o job morria mais cedo, entao
      # este passo simplesmente nao chegava a rodar.
      #
      # Tres saidas foram consideradas. Um provedor de segredos falso para
      # `NODE_ENV=production` criaria um caminho que producao nao usa, e um dia
      # alguem confiaria nele. Tirar o passo da esteira deixaria o alvo `prod`
      # sem nenhuma conferencia entre commits. Fica a terceira: o passo
      # exercita o que da para exercitar sem gerenciador, e diz em voz alta o
      # que deixou de provar.
      #
      # O QUE ELE PROVA: que a imagem `prod` constroi, que o processo EXECUTA
      # (carrega o codigo, chega a sequencia de subida) e que ele morre
      # EXATAMENTE no gerenciador de segredos, nomeando a fonte, o projeto que
      # o `.env` declarou e a lista inteira de `SEGREDOS_DE_RUNTIME`.
      #
      # O QUE ELE NAO PROVA MAIS: que o alvo `prod` atende requisicao. Isso
      # passou a ser verificacao de IMPLANTACAO, onde existe gerenciador de
      # verdade -- `infra/verificacao/verificar-commit-no-health.mjs` e
      # `verificar_borda.py` ja batem na sonda do ambiente hospedado.
      #
      # O juizo NAO aprova qualquer morte: morte em outro ponto, morte no
      # adaptador de ambiente, morte parcial, projeto divergente e boot que
      # SOBE sao todos reprovacao. As iscas disso rodam no job `rapidos`, e cada
      # regra tem a sua: desligar uma faz o autoteste cair nomeando o caso.
      - name: o alvo de producao constroi, e morre pelo motivo certo
        env:
          BUILD_TARGET: prod
          IMAGE_TAG: prod
        run: |
          docker compose build api
          docker run -d --name prova-prod --network bichu_default --env-file .env \
            -e NODE_ENV=production -e BIND_HOST=0.0.0.0 -e PORT=3000 bichu-app:prod

          # `docker wait` devolve o codigo de saida do processo. O `timeout`
          # existe porque um container que NAO morre tambem e reprovacao, e
          # precisa ser dita com outras palavras: sem ele o passo ficaria
          # pendurado ate o limite do job e a causa sairia como "cancelado".
          if saida=$(timeout 60 docker wait prova-prod); then :; else saida=nenhuma; fi
          docker logs prova-prod > /tmp/prova-prod.log 2>&1
          echo "saida do processo: $saida"
          cat /tmp/prova-prod.log

          # Lido do `.env` e nao escrito a mao: o portao confere que o boot
          # procurou no projeto que ESTE job declarou. Copiar o nome para ca
          # faria as duas pontas divergirem em silencio no dia em que uma
          # mudasse.
          projeto=$(sed -n 's/^SECRET_STORE_PROJECT=//p' .env | head -1)
          test -n "$projeto" || { echo "::error::SECRET_STORE_PROJECT vazia no .env deste job"; exit 1; }

          python3 infra/verificacao/verificar_boot_do_alvo_prod.py \
            --log /tmp/prova-prod.log --saida "$saida" --projeto "$projeto" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          veredito="${PIPESTATUS[0]}"

          echo "Este passo NAO prova que o alvo \`prod\` atende requisicao: sem gerenciador de segredos no runner, essa prova e de implantacao (BICHUS-213)." \
            | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "$veredito" != "0" ]; then
            echo "::error::o alvo prod nao morreu pelo motivo certo. Ver o veredito acima e o log do container"
          fi
          exit "$veredito"

      # BICHUS-210, nos alvos que a subida acima NAO exercita.
      #
      # O passo do `dev` cobra o commit pela SONDA, que e o caminho real. Aqui a
      # leitura e da IMAGEM, e de proposito: `prod` e `migrador` sao artefatos
      # como o `dev`, e cada um grava o commit pelo SEU proprio `ARG`/`ENV`. Um
      # alvo pode carregar e o outro nao, e o que vai para a VM e justamente o
      # `prod` -- conferir so o `dev` deixaria o defeito onde ele custa mais.
      #
      # Ler a imagem em vez de subir mais um processo tambem evita amarrar esta
      # conferencia ao boot de `prod`, que em `NODE_ENV=production` busca os
      # segredos no gerenciador (ADR-0022) e nao depende desta historia.
      #
      # Sao DUAS leituras por outro caminho cada: o `ENV`, que e o que a
      # aplicacao le, e o arquivo que o estagio de conferencia gravou. Divergir
      # entre os dois significa `ARG` passado em dois lugares com valores
      # diferentes, que e um jeito de a imagem mentir sem ninguem notar.
      - name: os alvos prod e migrador tambem sabem de qual commit sairam
        run: |
          falhou=0
          for imagem in bichu-app:prod bichu-migrador:local; do
            declarado=$(docker run --rm --entrypoint printenv "$imagem" BUILD_COMMIT)
            gravado=$(docker run --rm --entrypoint cat "$imagem" /etc/bichu/commit)
            echo "$imagem: ENV=$declarado arquivo=$gravado" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$declarado" != "$BUILD_COMMIT" ] || [ "$gravado" != "$BUILD_COMMIT" ]; then
              echo "::error::$imagem foi construida de $BUILD_COMMIT e carrega ENV=$declarado, arquivo=$gravado. Um alvo que nao sabe de onde veio responde \`commit: null\` na sonda, e ai um servico rodando codigo antigo fica indistinguivel de um rodando o novo (BICHUS-210)"
              falhou=1
            fi
          done
          exit $falhou

      # Os 17 casos de `tests/integration/` provam BICHUS-19 e BICHUS-56 por
      # consulta ao catalogo do Postgres -- inclusive o banco recusando de fato
      # `UPDATE` e `DELETE` na trilha de auditoria. Eles existiam e rodavam
      # SO quando alguem digitava o comando: `test:integration` nao aparecia em
      # `.github/` em lugar nenhum.
      #
      # Aqui, e nao num job proprio, porque eles precisam de banco com as
      # migracoes aplicadas e este job ja subiu exatamente isso, do zero, no
      # passo acima. Job separado subiria a mesma pilha de novo para provar a
      # mesma coisa.
      #
      # `docker compose run --rm api` e o mesmo caminho de `make test-int`: a
      # imagem `dev` carrega `tests/`, os tsconfig e o node_modules completo.
      # Rodar do runner exigiria publicar a porta do banco, que hoje nao e
      # publicada -- e publicar porta para poder testar e trocar a topologia
      # pelo teste.
      # A suite so roda em banco que se declara descartavel. Quem provisiona
      # declara; quem escreve confere (infra/integracao/guarda-de-banco-descartavel.mjs).
      # Ela CRIA conta, revoga sessao, insere em audit.events e apaga
      # `rate_limit_counters` inteira -- e o `.env` de um job de esteira e um
      # arquivo como outro qualquer, que alguem pode apontar para outro lugar.
      - name: o banco deste job se declara descartavel
        run: |
          docker compose exec -T db psql -v ON_ERROR_STOP=1 -U bichu -d bichu \
            -c "COMMENT ON DATABASE \"bichu\" IS 'bichu:integracao:descartavel'"

      # `test:integration:executar` e nao `test:integration`: o segundo sobe uma
      # PILHA EFEMERA propria (para rodar de dentro de um worktree), e aqui a
      # pilha ja esta de pe, do zero, desde o passo acima. O executor e o mesmo
      # nos dois caminhos, com os mesmos portoes -- inclusive o que reprova
      # quando a suite nao executa nada.
      # `--lcov` E O QUE FALTAVA CHEGAR AO SONARCLOUD.
      #
      # Ate 22/09 esta suite nao emitia cobertura nenhuma e o Sonar era
      # alimentado so pelo lcov de `npm test`. Consequencia medida: 40 arquivos
      # de producao de `src` nao apareciam em relatorio algum, e arquivo de
      # fonte SEM dado de cobertura e, para o Sonar, arquivo com 0%.
      #
      # O `-v` monta `coverage/` do runner por cima do `/app/coverage` do
      # container: `docker compose run --rm` apaga o container no fim, entao
      # `docker cp` depois nao existe, e o arquivo precisa nascer ja do lado de
      # fora. `install -d -m 0777` porque o alvo `dev` roda como o usuario
      # `node` (uid 1000) e o diretorio do runner e do usuario `runner`: sem a
      # permissao o reporter falha ao abrir o arquivo, e o executor REPROVA
      # dizendo que a cobertura foi pedida e nao veio.
      # `ferramentas` E NAO `api`, E A TROCA TEM DATA: 23/09, execucao 35812754457.
      #
      # O executor COMPILA antes de rodar caso nenhum (`npx tsc -p tsconfig.json
      # --outDir dist/_tests`), e a `api` tem `mem_limit: 320m` -- teto
      # dimensionado para RODAR `node dist/bin/api.js`, nao para compilar. O
      # compilador estourava o grupo de controle, o passo reprovava com "a
      # compilacao falhou; a suite de integracao nao chegou a rodar", e o placar
      # saia SEM UM CASO SEQUER. Reproduzido a mao pelas duas vias: por este
      # mesmo comando com `api` (saida 1, a frase identica) e pelo `tsc` cru
      # (saida 137, "Killed").
      #
      # Inflar o teto da `api` era a saida errada, porque o passo `limites de
      # memoria estao valendo de verdade`, alguns passos acima, confere que o
      # teto da `api` ESTA aplicado -- e o que ele aplica e o numero do
      # `compose.yaml`. Subi-lo para caber um compilador faria aquele passo
      # abencoar, em producao, uma api com o dobro do teto de que ela precisa.
      # Ver o bloco do servico `ferramentas` em `compose.yaml`.
      #
      # `ferramentas` nao sobe com a pilha (`profiles: [ferramentas]`), usa a
      # MESMA imagem da api e do worker, e tem teto proprio de 1 GB -- o mesmo
      # do servico `testes` da pilha efemera, que ja separava assim.
      - name: suite de integracao (BICHUS-19, BICHUS-56, BICHUS-15 e BICHUS-178)
        run: |
          install -d -m 0777 coverage placar
          docker compose run --rm -v "$PWD/coverage:/app/coverage" -v "$PWD/placar:/app/placar" ferramentas \
            npm run test:integration:executar -- --lcov coverage/lcov-integracao.info --placar placar

      # O LIVRO DOS CASOS QUE PISCAM. Ver o bloco de mesmo nome no job `codigo`:
      # o motivo e o mesmo e a morada tambem. O `placar/` montado acima existe
      # pelo mesmo motivo do `coverage/`: `docker compose run --rm` apaga o
      # container no fim, `docker cp` depois nao existe, e `dist/` nao pode ser
      # montado por cima sem cobrir o `dist/` compilado da imagem.
      #
      # Esta suite e a que mais importa aqui: foi ela que reprovava 1 vez em 8
      # em 22/09, por impasse de cadeado, sem defeito nenhum atras.
      - name: restaura o livro dos casos que piscam (integracao)
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: .livro
          key: livro-integracao-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            livro-integracao-

      - name: registra esta execucao no livro, e mostra o acumulado
        if: always()
        run: |
          node infra/suite/acumular-reprovados.mjs registrar \
            --livro .livro/integracao.jsonl --tap placar/integracao.tap --suite integracao \
            --rotulo "ci ${{ github.run_id }}/${{ github.run_attempt }} ${{ github.ref_name }}"
          node infra/suite/acumular-reprovados.mjs render \
            --livro .livro/integracao.jsonl --suite integracao | tee -a "$GITHUB_STEP_SUMMARY"

      - name: guarda o livro (integracao)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .livro
          key: livro-integracao-${{ github.run_id }}-${{ github.run_attempt }}

      # O job `sonar` roda noutro runner e nao ve este disco. O artefato e a
      # unica ponte, e ele NAO e condicional: se este passo nao rodar, o job
      # `sonar` reprova no verificador dizendo que o relatorio nao foi
      # encontrado, em vez de analisar com 0% em silencio.
      - name: guarda a cobertura de integracao para o job sonar
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-de-integracao
          path: coverage/lcov-integracao.info
          if-no-files-found: error
          retention-days: 1

      - name: diagnostico quando falha
        if: failure()
        run: docker compose --profile dev logs --tail=200

      - name: derruba
        if: always()
        run: |
          docker rm -f prova-prod 2>/dev/null || true
          docker compose --profile dev down -v

  app:
    name: app Flutter (analise e teste)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: rapidos
    steps:
      - uses: actions/checkout@v4

      # Versao fixa de proposito. `stable` faz a esteira mudar de compilador
      # num dia em que ninguem tocou no codigo, e a primeira suspeita passa a
      # ser o commit errado.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: app

      - run: flutter analyze
        working-directory: app

      # `flutter test` puro so enxerga test/a11y por causa da ponte
      # app/test/a11y_suite_test.dart. Se a ponte sumir, o teste de guarda
      # dentro dela reprova -- em vez de a suite desaparecer em silencio.
      - run: flutter test
        working-directory: app

  # O job `app` acima NAO compila para Android. `flutter analyze` e
  # `flutter test` rodam na maquina virtual do Dart, contra o SDK do Flutter, e
  # nunca tocam no Gradle, no AGP nem no SDK do Android. Enquanto a esteira
  # parou neles, existiu uma classe inteira de defeito sem portao: a dependencia
  # que sobe o PISO da cadeia de ferramentas.
  #
  # Ela custou caro em 22/09/2026. A BICHUS-161 trouxe `permission_handler`, que
  # exige compilar contra a API 37; o projeto compilava contra a 36 e o AGP
  # 9.1.0 nao aceita a 37. Os oito jobs ficaram verdes. Quem descobriu foi o
  # CLIENTE, na hora de gerar o APK para validar camera, splash e acessibilidade
  # de formulario no aparelho -- as tres coisas que simulador nenhum prova.
  #
  # POR QUE EM TODO PUSH, E NAO NUM AGENDADO DIARIO
  #
  # O gatilho deste defeito e a mudanca de dependencia, que chega em um commit
  # qualquer. Num agendado diario a esteira acusaria ate 24 horas depois, com o
  # trabalho do dia ja empilhado em cima do commit culpado, e a bissecao feita a
  # mao. Num filtro por caminho (`pubspec.lock`, `android/**`) o portao pularia,
  # e `skipped` e exatamente o que o job `portao` recusa: portao que nao roda
  # nao aprova.
  #
  # E o custo nao justifica o desconto. O job e PARALELO a `integracao`, que ja
  # constroi duas imagens Docker e sobe a pilha inteira; ele nao entra no caminho
  # critico da esteira, entra ao lado dele. Medido em 22/09 numa maquina de
  # desenvolvimento, com a distribuicao do Gradle e os artefatos do AGP baixados
  # do zero: 4min20 de ponta a ponta. Se um dia passar de 30 minutos no runner,
  # a conversa e sobre cache, e nao sobre deixar a classe descoberta.
  apk:
    name: APK de release (compila de verdade)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: rapidos
    steps:
      - uses: actions/checkout@v4

      # O projeto compila em JVM 17 (`compileOptions` e `jvmTarget` em
      # app/android/app/build.gradle.kts). Declarar aqui evita que a esteira
      # mude de JDK no dia em que a imagem do runner mudar de padrao.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # A PLATAFORMA E NOMEADA A MAO, DE PROPOSITO.
      #
      # A partir da API 37 a plataforma do Android tem versao MENOR: nao existe
      # `platforms;android-37`, existem `android-37.0`, `37.1` e `37.2`. O
      # projeto declara `compileSdk = 37` + `compileSdkMinor = 0`, que resolve
      # para `android-37.0` -- e e esse, e so esse, que precisa estar instalado.
      # Deixar o AGP baixar sozinho tornaria a esteira dependente de aceitacao
      # de licenca na imagem do runner, que muda sem aviso e falha tarde.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      # Sem este cache o job rebaixa a distribuicao do Gradle (cerca de 200 MB)
      # e os artefatos do AGP a cada execucao. A chave inclui os arquivos que
      # determinam o que sera baixado, entao mudanca de AGP ou de wrapper invalida
      # o cache em vez de servir o conteudo errado.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle.kts', 'app/android/gradle/wrapper/gradle-wrapper.properties', 'app/pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: flutter pub get
        working-directory: app

      # ISCAS ANTES DO BUILD, e a ordem importa. O portao confere o que saiu do
      # build (zip, manifesto, dex, libapp.so); se essa conferencia cegar, ela
      # aprovaria qualquer coisa e o job ficaria verde compilando lixo. Este
      # passo nao compila nada e leva segundos: ele monta pacotes defeituosos e
      # exige que cada um seja REPROVADO, mais um pacote completo que precisa ser
      # APROVADO -- porque conferencia que reprova tudo tambem nao diz nada.
      - name: as iscas da conferencia do APK reprovam
        run: sh infra/verificacao/verificar-apk.sh --autoteste

      # O comando e o MESMO que o cliente roda, porque ele mora dentro do script
      # e nao em duas copias. Se `flutter build apk --release` falhar por
      # compileSdk, por metadado de AAR ou por versao de AGP, e porque alguma
      # dependencia subiu o piso da cadeia de ferramentas e o projeto ficou para
      # tras -- que e precisamente a classe que este job existe para pegar.
      - name: compila o APK de release e confere o que saiu
        run: sh infra/verificacao/verificar-apk.sh

      # O APK fica pendurado na execucao. O cliente valida camera, splash e
      # acessibilidade no aparelho a partir daqui, sem precisar de cadeia de
      # ferramentas Android na maquina dele.
      #
      # Assinado com a chave de DEPURACAO (decisao de 22/09: nao vamos as lojas
      # agora). Serve para instalar e validar; nao serve para publicar.
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: bichu-hml-apk-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  tokens:
    name: tokens
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: rapidos
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: app

      # Uma fonte (design/tokens.json), um destino gerado, e um portao que
      # reprova na divergencia -- mesma forma do portao de tipos do contrato.
      # Sem isto, bichu_tokens.g.dart pode ser editado a mao e o token e o
      # codigo divergem SEM QUE O DIFF MOSTRE, porque a proxima geracao desfaz
      # a edicao em silencio.
      - name: o Dart gerado bate com design/tokens.json
        working-directory: app
        run: |
          dart run tool/gen_tokens.dart
          if ! git diff --exit-code -- lib/theme/bichu_tokens.g.dart; then
            echo "::error::lib/theme/bichu_tokens.g.dart divergiu de design/tokens.json. Rode 'dart run tool/gen_tokens.dart' de dentro de app/ e versione o resultado; se o valor gerado esta errado, o errado e o token"
            exit 1
          fi

  contraste:
    name: contraste
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: rapidos
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: app

      # CAMINHO EXPLICITO, e nao `flutter test`, de proposito: este portao nao
      # pode depender da descoberta automatica. A suite mora em test/a11y/ na
      # raiz e chega aqui por link simbolico, e a descoberta do Flutter nao
      # atravessa link simbolico -- um job que confiasse nela ficaria verde sem
      # nunca ter olhado para acessibilidade.
      #
      # Dentro rodam as iscas: fixtures erradas de proposito que o verificador
      # PRECISA reprovar. Isca que passa derruba o job com "o verificador parou
      # de verificar", porque a partir dali todo o resto esta verde por nao
      # estar olhando para nada (docs/06-design-system.md 18.2.1).
      - name: suite de acessibilidade e iscas
        working-directory: app
        run: flutter test test/a11y

      # O verificador do tema mede os mesmos pares por outro angulo: piso e
      # isencao, em vez da razao publicada. Os dois existem e por ora
      # concordam; quando divergirem, um dos dois esta errado e este job diz.
      - name: verificador de contraste do tema
        working-directory: app
        run: flutter test test/tema

      # A ISCA DE PIXEL (21/09/2026). Os dois passos acima leem TEXTO: tokens,
      # tabela de pares, papeis em Dart. A cor da marca tambem vive em 40 PNG
      # que tres geradores assam, e ate hoje nenhum portao os lia -- trocar a
      # semente e esquecer os geradores entregava um produto que abre com
      # splash e icone na cor velha, com a esteira inteira verde.
      #
      # Caminho explicito pelo mesmo motivo dos outros dois: este portao nao
      # pode depender da descoberta automatica. Dentro dele ha uma isca
      # negativa versionada -- o bitmap na semente ANTERIOR, que precisa ser
      # reprovado pelo mesmo codigo que aprova os de producao.
      - name: portao de marca em pixel
        working-directory: app
        run: flutter test test/marca

  # SonarCloud. docs/07-devops.md secao 8.4.
  #
  # O cliente contratou o plano em 17/09/2026 e provisionou `SONAR_TOKEN`. Com
  # o insumo na mao, a dispensa `sonarcloud` saiu de `.github/quality-gates.yml`
  # e este job passou a ser o portao de verdade.
  #
  # Duas coisas sao verificadas aqui, e elas sao diferentes:
  #
  #   1. O RELATORIO DE COBERTURA SERVE? Bloqueante hoje, sem excecao. O
  #      SonarCloud aceita em silencio um lcov que nao casa com arquivo nenhum
  #      e publica 0% como se fosse medicao. Esta e a falha que este job existe
  #      para nao deixar passar.
  #   2. O VEREDITO DO PORTAO DE QUALIDADE. Informativo enquanto houver a
  #      dispensa datada `sonarcloud-veredito` no quality-gates.yml; bloqueante
  #      no instante em que ela for apagada. O motivo esta na secao 8.4: na
  #      PRIMEIRA analise o SonarCloud trata o repositorio inteiro como "codigo
  #      novo", entao os 74% de linha medidos hoje vao de encontro ao piso de
  #      80% do perfil `Sonar way` e o portao reprova -- um veredito sobre
  #      treze dias de codigo acumulado, cobrado de quem abriu o PR. Portao que
  #      reprova tudo no primeiro dia e desligado na primeira semana, e o
  #      desligamento e definitivo. Uma semana de linha de base, e ele passa a
  #      julgar o diff, que e o que ele sabe julgar.
  sonar:
    name: SonarCloud (analise estatica e cobertura)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `integracao` entrou em 22/09: e la que a suite de integracao roda (onde ha
    # banco de pe) e e de la que vem `coverage/lcov-integracao.info`, pelo
    # artefato. Sem essa metade, 40 arquivos de producao de `src` chegam ao
    # Sonar sem dado nenhum -- e sem dado, para ele, e 0%.
    #
    # Se `integracao` reprovar, este job e PULADO, e o job `portao` trata
    # "skipped" como erro ("Portao que nao roda nao aprova"). Nao existe caminho
    # em que a analise desapareca em silencio.
    needs: [codigo, integracao]
    steps:
      - uses: actions/checkout@v4
        with:
          # O Sonar usa o blame do Git para atribuir "codigo novo". Checkout
          # raso faz todo o repositorio parecer novo em toda analise, e o
          # portao passa a cobrar de cada PR o acumulado do projeto.
          fetch-depth: 0

      # SEM `if:`, DE PROPOSITO. `if: secrets.SONAR_TOKEN != ''` e a saida
      # preguicosa que a secao 5.3 proibe: o job sumiria da lista, o `portao`
      # veria apenas "skipped", e a ausencia da analise viraria silencio. Aqui
      # a ausencia do token REPROVA, com o nome da credencial na mensagem.
      - name: o token existe?
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN ausente. A dispensa \`sonarcloud\` saiu de .github/quality-gates.yml quando o plano foi contratado: este portao existe e nao tem como ficar verde sem o token. Ou o segredo volta para Settings > Secrets do repositorio, ou a dispensa volta para o arquivo com motivo, responsavel e data"
            exit 1
          fi
          echo "SONAR_TOKEN presente (o valor nunca e impresso)"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # A cobertura e gerada AQUI, e nao herdada do job `codigo`, porque
      # `npm test` sozinho nao emite lcov.
      #
      # ERA UMA COPIA DO COMANDO DO package.json, e o comentario desta linha
      # registrava a consequencia por escrito: "se o script `test` mudar de
      # forma, esta linha fica medindo outra coisa". A BICHUS-219 mudou o script
      # de forma, e a copia teria ficado medindo outra coisa exatamente como
      # previsto. Agora o lcov e uma BANDEIRA do proprio executor: uma forma so,
      # e os mesmos portoes da suite valem aqui.
      #
      # `--enable-source-maps` continua obrigatoria e agora mora no executor:
      # sem ela o reporter lcov grava o caminho do JavaScript compilado
      # (`dist/_tests/**/*.js`), o Sonar nao casa nenhum arquivo, nao reclama, e
      # publica 0% de cobertura. Uma flag, e a diferenca entre medir e fingir
      # que mediu.
      - name: cobertura em lcov (unitaria)
        run: |
          mkdir -p coverage
          npm test -- --lcov coverage/lcov.info

      # A outra metade da medicao, produzida no job `integracao`. Sem `if:` e
      # sem tolerancia a ausencia: o download que falha derruba o job, e o
      # verificador abaixo reprovaria de qualquer jeito com "relatorio de
      # cobertura nao encontrado".
      - name: cobertura em lcov (integracao), vinda do job `integracao`
        uses: actions/download-artifact@v4
        with:
          name: cobertura-de-integracao
          path: coverage

      # As CINCO iscas de infra/verificacao/iscas/lcov-* rodam ANTES dos
      # relatorios reais, e quatro delas precisam reprovar nominalmente. Isca
      # que passa derruba o job com "o verificador de cobertura parou de
      # verificar".
      #
      # A quinta isca entrou em 22/09 e e a que faltava: relatorio impecavel em
      # forma, que simplesmente NAO MENCIONA um arquivo de `src`. As outras
      # quatro passavam nela, porque todas partem do RELATORIO e so conseguem
      # errar sobre o que esta nele. A regra nova parte do DISCO.
      - name: os relatorios falam de src/**/*.ts, e de TODOS eles; iscas primeiro
        run: |
          node infra/verificacao/verificar-cobertura-lcov.mjs \
            coverage/lcov.info coverage/lcov-integracao.info \
            | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

      # As chaves de organizacao e de projeto, os caminhos de fonte e as
      # exclusoes estao em `sonar-project.properties`, na raiz. Nada de branch
      # nem de PR e passado aqui: o scanner le isso do ambiente do GitHub
      # Actions sozinho, e um valor fixo transformaria toda analise de PR em
      # analise da mesma branch.
      - name: scanner
        uses: SonarSource/sonarqube-scan-action@v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # O QUE MUDOU EM 22/09/2026, E POR QUE.
      #
      # Ate hoje estes dois passos eram: a acao
      # `SonarSource/sonarqube-quality-gate-action@v1.2.1`, marcada
      # `continue-on-error: true`, e um passo de juizo que lia o DESTINO dela.
      #
      # Medido no run 35750052587 da `main`: a acao saiu com HTTP 403 -- o
      # veredito NUNCA FOI OBTIDO -- e o juizo imprimiu "o portao de qualidade
      # do SonarCloud REPROVOU" e deixou a dispensa `sonarcloud-veredito`
      # engolir a reprovacao. O job ficou VERDE com uma indisponibilidade do
      # SonarCloud.
      #
      # Este arquivo ja tinha o ramo escrito contra isso:
      #
      #     *) "nao foi possivel obter o veredito ... Verificacao que nao
      #        consegue verificar reprova, nunca aprova"
      #
      # e ELE ERA INALCANCAVEL. O destino de um passo so assume `success`,
      # `failure`, `skipped` e `cancelled`: "nao consegui falar com o Sonar" e
      # "o portao reprovou de verdade" colapsavam no mesmo `failure`, e a
      # dispensa -- escrita para o segundo -- cobria os dois. O ramo existia,
      # estava certo, e nunca executou.
      #
      # A PROVA DEFINITIVA VEIO NO MESMO DIA, DE GRACA, e vale guardar porque
      # ela e dificil de conseguir de novo. O cliente concedeu permissoes no
      # SonarCloud no fim da tarde, e o MESMO passo, no MESMO commit, passou a
      # obter resposta de verdade:
      #
      #   run 35750052821 (main, 15h57):  curl: (22) ... returned error: 403
      #                                   -> exit 22, veredito NUNCA obtido
      #   run 35750862380 (development, 16h30, reexecucao do mesmo job):
      #                                   "Quality Gate has FAILED"
      #                                   -> exit 1, veredito obtido e NEGATIVO
      #
      # Dois fatos completamente diferentes. E o passo do juizo imprimiu, nas
      # duas execucoes, a MESMA LINHA, byte a byte:
      #
      #   veredito=failure bloqueante=nao
      #   ##[warning]o portao de qualidade do SonarCloud REPROVOU e nao esta
      #   bloqueando, por dispensa datada (sonarcloud-veredito) ...
      #
      # A indisponibilidade e a reprovacao legitima eram indistinguiveis na
      # saida, e as duas foram dispensadas. Nao havia como alguem lendo o log
      # perceber a diferenca, porque nao existia diferenca a ser lida.
      #
      # A correcao separa BUSCAR de JULGAR, que e o que torna os dois desfechos
      # distinguiveis:
      #
      #   - a BUSCA consulta a fila de analise e o portao de qualidade e grava
      #     um envelope JSON com o que aconteceu: `obtido`, `status_http`,
      #     `motivo`, `veredito`. Ela nao decide nada, e por isso nao pode
      #     reprovar por si -- se saisse com 1 no 403, o job cairia com uma
      #     mensagem generica e o juizo, que e quem sabe dizer "o Sonar nao
      #     disse nada" com o codigo HTTP na frase, nunca rodaria. Ela so sai
      #     com codigo diferente de zero quando nem o envelope consegue gravar,
      #     e ai o job cai, que e o desfecho correto;
      #   - o JUIZO le o envelope, com vocabulario fechado (`OK`, `ERROR`,
      #     `WARN`, `NONE`): palavra que ele nao reconhece REPROVA. E SO o
      #     veredito negativo de verdade e dispensavel -- nao obter, `NONE`,
      #     palavra nova e envelope fora de forma reprovam mesmo com a dispensa
      #     escrita, e a mensagem diz por que ela nao cobre.
      #
      # Nao ha `continue-on-error` em passo nenhum desta esteira, e
      # `verificar_consulta_externa.py` (job `rapidos`) impede que ele volte por
      # qualquer workflow.
      #
      # O MODO continua vindo do `quality-gates.yml`, e nao de um `if:` escrito
      # aqui -- agora lido pelo proprio juizo, e nao por um passo separado.
      # Secao 5.3: "Para remover a dispensa: apague a entrada. Nao mexa no
      # workflow." Apagar `sonarcloud-veredito` torna o veredito bloqueante, e
      # a data da dispensa faz o job `rapidos` reprovar sozinho se ninguem
      # apagar.
      - name: busca o veredito do portao de qualidade
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          python3 infra/verificacao/buscar_veredito_do_sonar.py \
            --token "$SONAR_TOKEN" --envelope /tmp/veredito-do-sonar.json

      # As iscas rodam DENTRO deste comando, antes do envelope de verdade, e
      # cada uma isola UMA regra: o autoteste compara CONJUNTOS de regras, e nao
      # "reprovou / nao reprovou". A isca do 403 e a que prova o defeito de
      # hoje: ela precisa reprovar E precisa nao ser coberta pela dispensa. Um
      # autoteste que so olhasse "reprovou?" ficaria verde com o defeito inteiro
      # de pe, porque hoje ele tambem reprova -- e e dispensado.
      - name: o veredito, dito em voz alta, com o motivo
        run: |
          python3 infra/verificacao/verificar_veredito_do_sonar.py \
            --envelope /tmp/veredito-do-sonar.json | tee -a "$GITHUB_STEP_SUMMARY"
          # `tee` mascara o codigo de saida do python, e este passo E o veredito.
          exit "${PIPESTATUS[0]}"

  # ===========================================================================
  # POR QUE ESTE JOB EXISTE, SE A ESTEIRA NAO RODA EM WORKTREE
  # ===========================================================================
  # O job `integracao` acima roda a suite na pilha `bichu` do proprio runner, e
  # nunca usa `compose.integracao.yaml`. Quem usa aquele arquivo e a maquina de
  # desenvolvimento, onde dezenas de worktrees rodam a suite ao mesmo tempo.
  #
  # Em 22/09/2026 aquela pilha isolava projeto, rede, volume e conteiner, e NAO
  # isolava imagem: `bichu-migrador:integracao` era a mesma tag para todos, e
  # cada `compose build` arrancava a tag de quem a tinha. Como o servico
  # `migracao` copia `migrations/` para dentro da imagem, enquanto `testes`
  # monta a arvore do worktree, o desfecho era uma suite rodando o teste da sua
  # branch contra o esquema de OUTRA -- sem uma linha de erro. A tag trocou de
  # dono treze vezes naquele dia, a menor folga sendo de tres segundos.
  #
  # A suite de integracao e o unico mecanismo que pega uma classe inteira de
  # defeito neste projeto: duble aceita qualquer string, so o Postgres recusa.
  # Se ela pode rodar contra o esquema de outra branch, o verde dela nao prova
  # nada. Por isso a regra vira portao aqui, mesmo que o defeito seja local:
  # quem edita `infra/integracao/` edita no PR, e e no PR que a regressao tem
  # de aparecer.
  #
  # SEM FILTRO DE CAMINHO, de proposito. Filtrar por `infra/integracao/**` faria
  # o job sair `skipped` na maioria dos PRs, e `skipped` e exatamente o que o
  # job `portao` recusa. O custo nao justifica: o job e paralelo, constroi so o
  # alvo `migrador` e nao sobe banco nenhum. Medido em 22/09 numa maquina de
  # desenvolvimento com cache quente: 5,3 s de ponta a ponta.
  isolamento:
    name: duas pilhas de integracao nao se enxergam
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: rapidos
    steps:
      # `fetch-depth: 0` e exigencia da isca: ela faz `git worktree add` de duas
      # arvores descartaveis, e worktree precisa de repositorio com historia.
      # Com a profundidade 1 do padrao, `git worktree add` reprova -- e reprovar
      # e o desfecho certo, mas seria uma reprovacao sobre o checkout e nao
      # sobre o isolamento.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A isca prova os dois sentidos e reprova nos dois: se duas pilhas se
      # enxergarem, e tambem se a propria isca deixar de enxergar o defeito
      # quando ele e reposto de proposito
      # (infra/integracao/iscas/compose-defeito-tag-global.yaml).
      - name: isca de isolamento da pilha de integracao
        run: npm run verify:isolamento-da-pilha

  portao:
    name: portao
    runs-on: ubuntu-latest
    needs: [rapidos, codigo, contrato, integracao, isolamento, app, apk, tokens, contraste, sonar]
    if: always()
    steps:
      - name: consolidar
        run: |
          estados="${{ needs.rapidos.result }} ${{ needs.codigo.result }} ${{ needs.contrato.result }} ${{ needs.integracao.result }} ${{ needs.isolamento.result }} ${{ needs.app.result }} ${{ needs.apk.result }} ${{ needs.tokens.result }} ${{ needs.contraste.result }} ${{ needs.sonar.result }}"
          echo "estados: $estados"
          for e in $estados; do
            case "$e" in
              success) ;;
              skipped) echo "::error::um job foi pulado. Portao que nao roda nao aprova"; exit 1 ;;
              *) echo "::error::job em '$e'"; exit 1 ;;
            esac
          done
          echo "portao verde"
