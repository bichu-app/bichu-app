# Dispensas de portao, com dono e data de validade.
# docs/07-devops.md secao 5.3.
#
# Existe porque a saida preguicosa -- `if: secrets.X != ''` -- deixa o job verde
# sem verificar nada, e ninguem procura o que acredita ja ter. Aqui a ausencia e
# visivel, datada, e EXPIRA SOZINHA: dispensa vencida reprova o job `portao`.
#
# Para dispensar um portao: acrescente uma entrada com motivo, responsavel e
# data. Para remover a dispensa: apague a entrada. Nao mexa no workflow.

dispensas:
  # A dispensa `sonarcloud` saiu em 17/09/2026: o cliente contratou o plano e
  # provisionou SONAR_TOKEN. O job `sonar` da esteira passou a existir de
  # verdade, e sem o token ele REPROVA nomeando a credencial.
  #
  # O que continua dispensado e so o VEREDITO do portao de qualidade, e por um
  # motivo estreito: na primeira analise o SonarCloud trata o repositorio
  # inteiro como codigo novo, entao os 74% de linha medidos hoje batem no piso
  # de 80% do perfil `Sonar way` e o portao reprova de saida. Isso e um
  # veredito sobre treze dias de codigo acumulado, cobrado de quem abrir o
  # proximo PR. Portao que reprova tudo no primeiro dia e desligado na
  # primeira semana, e o desligamento nao volta atras.
  #
  # Uma semana depois existe linha de base em `development`, "codigo novo"
  # passa a significar o diff do PR, e o piso de 80% vira uma exigencia sobre
  # o que a pessoa acabou de escrever -- que e o que ele sabe cobrar.
  #
  # Enquanto esta entrada existir, o job `sonar` publica o veredito vermelho
  # no resumo da execucao com `::warning::` e nao derruba o PR. Apagar esta
  # entrada torna o veredito bloqueante, sem tocar no workflow.
  - portao: sonarcloud-veredito
    motivo: "primeira analise trata o repositorio inteiro como codigo novo e reprova os 74% contra o piso de 80% do Sonar way; a janela existe para criar linha de base em development"
    responsavel: squad
    vence_em: 2026-09-24

  # AS DUAS DE BAIXO MUDARAM DE NATUREZA EM 22/09/2026, E NAO SO DE DATA.
  #
  # Ate hoje elas diziam "o insumo nao chegou" -- chave de assinatura, conta
  # Apple -- e isso e a frase de quem ESPERA. O cliente decidiu hoje que o app
  # nao vai para loja nenhuma por ora, e a frase de quem DECIDIU e outra: o que
  # estas duas verificacoes protegem e a submissao a loja, e a submissao saiu do
  # horizonte. Quem ler daqui a um mes precisa encontrar a decisao, nao a espera.
  #
  # O GATILHO DE REATIVACAO E UM EVENTO, NAO UMA DATA: as duas caem no dia em
  # que existir decisao de submeter o app a uma loja. `verificar_dispensas.py`
  # so entende `vence_em`, entao o evento vive no `motivo` -- de proposito, e
  # nao num campo novo: campo que o portao nao le e dispensa inerte com outro
  # nome, que e o defeito que o SonarCloud ja teve em 18/09. A data e curta e
  # nao e arbitraria: 29/09 e a vespera do fim de desenvolvimento (30/09/2026),
  # que e quando a pergunta "vamos submeter?" tem resposta de verdade.
  #
  # O QUE ESTAS DUAS ENTRADAS NAO DISPENSAM, e vale dizer porque o nome engana:
  # `verificar_borda_local.py` tambem as consulta, para tratar `assetlinks.json`
  # e `apple-app-site-association` VAZIOS como aviso em vez de falha. Isso e
  # DEEP LINK (BICHUS-94, 136 e 38), nao e loja, e continua valendo como
  # trabalho futuro: a impressao digital ainda depende do keystore e o `appID`
  # ainda depende do Team ID. A decisao de hoje tira a submissao do caminho
  # critico; ela nao diz que o deep link abre.
  #
  # AS CHAVES CITADAS ABAIXO ESTAO NA NUMERACAO DE HOJE. Ate 22/09/2026 elas
  # diziam `BICHU-15` e `BICHU-14`, que sao pre-migracao: hoje `BICHUS-15` e
  # `BICHUS-14` sao OUTRAS historias, e quem seguisse a citacao caia no lugar
  # errado. Traduzido por `.jarvis/mapa-chaves.json`: BICHU-15 -> BICHUS-106,
  # BICHU-14 -> BICHUS-94.
  #
  # MEDICAO DE 22/09/2026 sobre a impressao digital de DEBUG. A BICHUS-106
  # (Concluida) decidiu: "registrar no assetlinks.json a impressao digital do
  # certificado de debug usado na homologacao, e substitui-la pela de release no
  # dia da publicacao". A regra nunca foi executada, e ESTE COMENTARIO EXISTE
  # PARA DIZER POR QUE -- ausencia sem motivo registrado vira, um mes depois,
  # "ninguem lembrou".
  #
  # Tres medicoes, duas passam e uma reprova:
  #
  # 1. OK - o APK de homologacao E assinado com certificado de debug.
  #    `app/android/app/build.gradle.kts`: `buildTypes.release` usa
  #    `signingConfigs.getByName("debug")`.
  #
  # 2. REPROVA - a digital de debug NAO e estavel fora da maquina que compila.
  #    O keystore e o `~/.android/debug.keystore` que a cadeia de ferramentas
  #    gera sozinha. Ele nao esta versionado (`.gitignore` exclui `*.keystore`
  #    e `*.jks`), a esteira nao constroi APK, e a senha e o DN sao fixos mas
  #    O PAR RSA E SORTEADO A CADA GERACAO. Conferido, e nao deduzido: tres
  #    `keytool -genkeypair` com parametros identicos (RSA 2048, alias
  #    `androiddebugkey`, `CN=Android Debug,O=Android,C=US`) deram tres
  #    digitais diferentes --
  #      5A:A0:22:FF..., 69:7F:68:F5... e 5D:7A:C5:50... (a desta maquina).
  #    Registrar qualquer uma delas aqui daria um `assetlinks.json` que casa com
  #    o APK de UMA maquina e falha em TODAS as outras, sem erro em lugar
  #    nenhum: o link so abre o navegador. Metade de um App Links e pior que
  #    nenhum, e e exatamente o defeito que este arquivo existe para evitar.
  #
  # 3. OK - o arquivo e servido de onde o Android procura. O sistema busca em
  #    `https://<host do link>/.well-known/assetlinks.json`, e o host do link e
  #    `TAG_BASE_URL` = `tag.bichu.app`. Conferido de fora em 22/09: 200,
  #    `application/json`, ZERO redirecionamentos. (Em 19/09 `tag.bichu.app`
  #    ainda nao resolvia; hoje resolve para 35.247.247.16, a VM de
  #    homologacao.)
  #
  # CONCLUSAO: a 106 autorizou um caminho que a realidade nao sustenta na forma
  # em que foi escrita. Ela supos "o keystore de debug gerado automaticamente"
  # como se fosse UM keystore; sao N, um por maquina. Executar a 106 exige
  # primeiro decidir ONDE vive um keystore de debug COMPARTILHADO -- e isso e
  # decisao de quem coordena, nao do portao. O keystore e a senha dele sao
  # segredo e vao para o Secret Manager (ADR-0022); a digital que sai dele NAO
  # e segredo e e justamente o que entra neste repositorio.
  #
  # ENQUANTO ISSO NAO ACONTECER, a lista segue vazia de proposito e o estado e
  # ruidoso, nao silencioso: `verificar_borda_local.py` acusa a lista vazia a
  # cada execucao e REPROVA assim que a dispensa `apk-assinado` vencer (29/09).
  # Conferido em 22/09 contra `https://tag.bichu.app`: com a dispensa valendo
  # sai `[aviso]` e APROVADO; com `vence_em` recuado para 21/09 sai REPROVADO
  # com codigo de saida 1, nomeando o insumo que falta. Nao ha `TODO` nenhum
  # segurando isso, e e de proposito: a troca da digital no dia da publicacao
  # nao pode depender de alguem lembrar.
  - portao: apk-assinado
    motivo: "decisao do cliente em 22/09/2026: o app nao vai para loja por ora, entao nao ha build de release para assinar. CAI QUANDO houver decisao de submeter o app a uma loja; ate la o keystore (BICHUS-106) segue pendente e o assetlinks.json segue sem impressao digital"
    responsavel: cliente
    vence_em: 2026-09-29

  - portao: ios
    motivo: "decisao do cliente em 22/09/2026: o app nao vai para loja por ora, entao o alvo iOS sai do caminho critico. CAI QUANDO houver decisao de submeter o app a uma loja; ate la a conta Apple (BICHUS-94) segue pendente e sem Team ID nao ha Universal Links"
    responsavel: cliente
    vence_em: 2026-09-29

  # A correcao do `logout` (BICHUS-81, commit aca2d33) acrescentou `requestBody`
  # OBRIGATORIO a `POST /v1/auth/logout`, e para o `oasdiff` isso e quebra de
  # contrato: `request-body-added-required`. Medido, nao suposto -- o comando da
  # esteira sai com 1 e acusa exatamente essa mudanca, e so ela.
  #
  # A quebra e o ponto. Enquanto o corpo era opcional, quem seguisse o contrato
  # ao pe da letra saia sem revogar nada e recebia 204: sucesso indistinguivel
  # do nada. Recusar alto e o remedio.
  #
  # A operacao NAO e versionada, e a decisao e do coordenador: nao existe
  # cliente publicado. Nao ha keystore, nao ha app em loja, e as listas de
  # associacao do deep link estao vazias. Versionar criaria uma v2 para uma base
  # de zero instalacoes, e a v1 passaria a carregar para sempre o comportamento
  # que esta correcao existe para tirar de circulacao.
  #
  # A dispensa e ESTREITA e nomeia a mudanca: `verificar_quebras_de_contrato.py`
  # so a aplica ao par regra+operacao escrito em `mudanca`. Qualquer outra
  # quebra reprova o passo, inclusive outra quebra nesta mesma operacao.
  #
  # Ela vence junto com a janela do PR: depois do merge em `development` a base
  # da comparacao ja tem o corpo obrigatorio e o portao fica quieto sozinho.
  # Se a data chegar antes do merge, `rapidos` reprova por dispensa vencida e
  # alguem decide de novo -- que e exatamente o comportamento desejado.
  - portao: oasdiff-logout-corpo-obrigatorio
    mudanca: "request-body-added-required logout"
    motivo: "logout passou a exigir refresh_token no corpo (BICHUS-81): quebra deliberada, e nao ha cliente publicado para versionar a operacao"
    responsavel: squad
    vence_em: 2026-09-28

  # A DISPENSA `documento-secao7` SAIU EM 23/09/2026, E NAO FOI RENOVADA.
  #
  # Ela segurava `test/a11y/documento_secao7_test.dart`, que comparava a tabela
  # e a prosa do paragrafo 7 de `docs/06-design-system.md` com
  # `design/contrast-pairs.json`. Esse teste nunca teve o que ler na esteira:
  # `docs/` esta fora do repositorio desde 17/09/2026, e em 23/09/2026 o
  # cliente reafirmou a decisao com a arquitetura inteira, e nao com uma data
  # nova: documentacao de projeto no Confluence, documentacao de design no
  # Figma, trabalho no Jira. Nao existe data em que o arquivo chegue ao
  # checkout, entao nao existe data que devolva o portao.
  #
  # Dispensa e a forma de registrar ausencia TEMPORARIA, com dono e com saida.
  # Redatar esta aqui seria transformar decisao permanente em dispensa perpetua
  # com aparencia de prazo, que e a saida preguicosa que este arquivo existe
  # para impedir. Por isso o portao foi removido junto com a dispensa.
  #
  # O QUE CONTINUA GUARDADO, e e o ponto: os 86 pares do paragrafo 7 vivem em
  # `design/contrast-pairs.json`, que e rastreado, e
  # `test/a11y/contraste_tokens_test.dart` os RECALCULA a partir de
  # `design/tokens.json` contra a `razao_esperada`, o piso e o veredito de cada
  # um, no job `contraste`. Nenhum valor do paragrafo 7 deixou de ser conferido.
  # O que deixou de ser conferido e a prosa de um arquivo que o repositorio nao
  # tem e nao vai ter.
  #
  # O QUE FICOU SEM PORTAO, dito em voz alta: numero velho na prosa do
  # paragrafo 7, que e o defeito da BICHUS-194, nao e mais pego por ninguem.
  # Isso e a opcao (b) da secao 12 de `.jarvis/DECISOES-PARA-23-09.md`, e ela
  # pede que o texto do paragrafo 7 pare de afirmar que tem portao. Esse texto
  # vive fora do repositorio. O registro fica em `docs/07-devops.md` secao 5.3.
