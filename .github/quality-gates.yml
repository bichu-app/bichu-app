    motivo: "adminReauth sai do security por decisao do cliente de 07/10 (ADR-0027 item 23); requisito a menos, compativel com quem ainda manda o token"
    responsavel: squad
    vence_em: 2026-10-21
  - portao: oasdiff-sem-senha-cancel-admin-network-event
    mudanca: "api-security-removed cancelAdminNetworkEvent"
    motivo: "adminReauth sai do security por decisao do cliente de 07/10 (ADR-0027 item 23); requisito a menos, compativel com quem ainda manda o token"
    responsavel: squad
    vence_em: 2026-10-21
  - portao: oasdiff-sem-senha-change-admin-network-event-access
