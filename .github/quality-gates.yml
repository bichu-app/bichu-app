

  # Escritas do painel sem reautenticacao, 07/10/2026 (decisao do cliente,
  # ADR-0027 item 23). O oasdiff acusa `api-security-removed` (ERR) porque o
  # conjunto `adminCsrf AND adminReauth AND adminSession` vira `adminCsrf AND
  # adminSession` -- e um requisito a MENOS, compativel para quem chama: o
  # painel que ainda mandar `X-Admin-Reauth-Token` continua aceito. Medido com
  # tufin/oasdiff:v1.32.1: sao exatamente estas cinco.
  # Vencem em 21/10/2026: depois do merge a base carrega o contrato novo.
  - portao: oasdiff-sem-senha-retire-admin-store-item
    mudanca: "api-security-removed retireAdminStoreItem"
    motivo: "adminReauth sai do security por decisao do cliente de 07/10 (ADR-0027 item 23); requisito a menos, compativel com quem ainda manda o token"
    responsavel: squad
    vence_em: 2026-10-21
  - portao: oasdiff-sem-senha-remove-admin-network-event
    mudanca: "api-security-removed removeAdminNetworkEvent"
    motivo: "adminReauth sai do security por decisao do cliente de 07/10 (ADR-0027 item 23); requisito a menos, compativel com quem ainda manda o token"
    responsavel: squad
    vence_em: 2026-10-21
