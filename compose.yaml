# Topologia local do Bichu. Um comando sobe tudo: `make up`.
# docs/07-devops.md secoes 2 e 3.
#
# A MESMA pilha roda na e2-small do Compute Engine (2 GB) com outro arquivo de
# ambiente. Dois destinos, um artefato: e o que torna a portabilidade um fato
# verificavel em vez de uma frase.
#
# ===========================================================================
# LIMITES DE MEMORIA: LEIA ANTES DE REMOVER
# ===========================================================================
# Nao sao otimizacao. Na e2-small sao 2 GB, e o worker de imagem aloca
# centenas de megabytes de uma vez para decodificar uma foto de celular.
#
# Quando falta memoria no sistema, o nucleo do Linux escolhe a vitima pela
# memoria residente. O maior residente desta pilha e o POSTGRES. Entao o que
# acontece e isto:
#
#   alguem envia uma foto grande -> o worker aloca -> a memoria acaba ->
#   O BANCO MORRE.
#
# No log aparece "o banco caiu sozinho", sem nenhuma mencao a upload, sem
# relacao aparente com foto, num horario que nao corresponde a nada. Alguem
# passa dois dias investigando o banco.
#
# Com limite por container, o grupo de controle do worker estoura primeiro, o
# nucleo mata dentro daquele grupo, e o Postgres nem fica sabendo. O worker
# morre, reinicia, e o trabalho volta para a tabela `jobs`.
#
# Soma dos limites: 1792 MB, deixando ~256 MB para o sistema operacional.
# Se apertar, e2-medium e REINICIO e nao migracao: parar, trocar o tipo,
# religar. Dura minutos.
#
# CONFIRA COM `docker stats` que os limites aparecem. `deploy.resources` fora
# do Swarm e ignorado em silencio e o arquivo parece correto.
# ===========================================================================

name: bichu

services:
  db:
    # Digest fixado: `latest` em qualquer ambiente e defeito, e versao movel
    # transforma "funciona aqui" em coincidencia.
    image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    mem_limit: 640m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bichu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_DB: ${POSTGRES_DB:-bichu}
      # Proporcional ao limite do container, nunca no padrao da imagem: o
      # padrao supoe uma maquina inteira disponivel.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_buffers=160MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=8MB
      - -c
      - max_connections=40
    volumes:
      - dados_db:/var/lib/postgresql/data
    healthcheck:
      # `-h 127.0.0.1` NAO e enfeite: sem ele, `pg_isready` conecta pelo SOCKET
      # UNIX, e a imagem do Postgres sobe um servidor temporario que escuta so
      # no socket (`listen_addresses=''`) enquanto roda a inicializacao, antes
      # de reiniciar ouvindo em TCP.
      #
      # A sonda passava naquele servidor temporario, o compose dava o `db` como
      # saudavel, a migracao partia para o TCP e levava ECONNREFUSED. Falha
      # intermitente e do pior tipo: verde na maioria das vezes, e quando
      # reprova todo mundo aprende a mandar rodar de novo -- que e como um
      # portao para de valer sem ninguem decidir desliga-lo.
      #
      # Sondar por TCP e sondar o que o cliente usa.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-bichu} -d ${POSTGRES_DB:-bichu}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  objeto:
    # Armazenamento de objeto falando a API S3. Nao e "MinIO no lugar da AWS":
    # e a API S3, que o MinIO implementa e que S3 e GCS tambem atendem.
    #
    # Registro: o MinIO NAO esta mais no Docker Hub (`minio/minio` responde
    # "pull access denied"). A imagem oficial vive no quay.io. Quem for
    # atualizar a tag vai esbarrar nisso e perder tempo achando que e
    # credencial. O que pina de verdade e o digest, nao a tag.
    image: quay.io/minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    mem_limit: 320m
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY_ID:?defina no .env}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?defina no .env}
      # O MinIO assina a URL com o host pelo qual ele se conhece. Se isto
      # divergir do host publico, TODA URL assinada quebra, com erro de
      # assinatura que nao diz que e de host. E o defeito classico de
      # homologacao atras de tunel ou de IP de rede local.
      MINIO_SERVER_URL: ${MEDIA_PUBLIC_BASE_URL:-http://localhost:3001}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_CONSOLE_URL:-http://localhost:9001}
      # CRIPTOGRAFIA NO SERVIDOR. O criterio 22 de BICHUS-87 a exige, e a
      # politica de upload assinada manda `x-amz-server-side-encryption: AES256`.
      #
      # Sem esta variavel o MinIO responde **501 Not Implemented** ao envio -- e
      # nao 400: ele entende o pedido e nao sabe atende-lo, porque SSE-S3 exige
      # um KMS. O KMS embutido (`MINIO_KMS_SECRET_KEY`) atende, e e o caminho
      # que o proprio MinIO documenta para ambiente sem KMS externo.
      #
      # Chave de DESENVOLVIMENTO, descartavel, com valor no `.env`. Em producao
      # isto vira o KMS do provedor, que e configuracao e nao codigo -- o
      # cabecalho que a aplicacao envia e o mesmo nos dois.
      MINIO_KMS_SECRET_KEY: ${OBJECT_STORAGE_KMS_KEY:?defina no .env}
    volumes:
      - dados_objeto:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  objeto_init:
    # Cria os dois buckets do ADR-0007 e aplica a politica. Idempotente: pode
    # rodar em toda subida. O bucket privado NAO recebe politica anonima, e e
    # essa separacao fisica que protege o original com EXIF.
    image: quay.io/minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      objeto:
        condition: service_healthy
    environment:
      OBJECT_BUCKET_PRIVATE: ${OBJECT_BUCKET_PRIVATE:-bichu-media-private}
      OBJECT_BUCKET_PUBLIC: ${OBJECT_BUCKET_PUBLIC:-bichu-media-public}
      CHAVE: ${OBJECT_STORAGE_ACCESS_KEY_ID:?}
      SEGREDO: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set local http://objeto:9000 "$$CHAVE" "$$SEGREDO"
        mc mb --ignore-existing "local/$$OBJECT_BUCKET_PRIVATE"
        mc mb --ignore-existing "local/$$OBJECT_BUCKET_PUBLIC"
        mc anonymous set none "local/$$OBJECT_BUCKET_PRIVATE"
        # NAO use `mc anonymous set download`: o preset concede `s3:GetObject`
        # E `s3:ListBucket`, e a listagem anula a unica protecao que a chave
        # publica tem.
        #
        # A derivada e servida sem assinatura, e o que a protege e nao ser
        # adivinhavel -- e por isso que `chaveDaDerivada` exige 128 bits de
        # CSPRNG (BICHUS-134). Com `ListBucket` anonimo, qualquer um pede a
        # lista e recebe TODAS as chaves: os 128 bits deixam de valer, e a foto
        # do pet de qualquer pessoa fica a uma requisicao de distancia.
        #
        # Descoberto em 19/09 no minimo hospedado, com
        # `GET https://img-hml.bichu.app/bichu-media-public/` devolvendo
        # `ListBucketResult`. O bucket estava vazio; se houvesse foto, estaria
        # tudo listado.
        cat >/tmp/publico.json <<POLITICA
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": { "AWS": ["*"] },
              "Action": ["s3:GetObject"],
              "Resource": ["arn:aws:s3:::$$OBJECT_BUCKET_PUBLIC/*"]
            }
          ]
        }
        POLITICA
        mc anonymous set-json /tmp/publico.json "local/$$OBJECT_BUCKET_PUBLIC"
        echo "buckets prontos: privado sem acesso anonimo, publico so GetObject (sem listagem)"
    restart: "no"

  migracao:
    # As migracoes rodam AQUI, num job proprio, e nao no boot da api.
    #
    # O motivo esta no Dockerfile (alvo `migrador`), em duas linhas: migrar no
    # boot faz N replicas concorrerem e uma migracao ruim derrubar todas de uma
    # vez; e `node-pg-migrate` e devDependency, que no alvo `prod` significaria
    # carregar tsc no runtime.
    #
    # `target` fixo em `migrador` DE PROPOSITO: nao segue BUILD_TARGET, porque
    # a migracao nao muda de forma entre dev e producao. Trocar isso por
    # `${BUILD_TARGET}` faria o alvo `prod` subir sem a ferramenta e o job
    # falhar so no ambiente onde ele importa.
    image: bichu-migrador:${IMAGE_TAG:-local}
    build:
      context: .
      target: migrador
      args:
        # O migrador nao responde sonda, mas passa pela mesma conferencia: um
        # alvo que se constroi sem o commit seria o caminho de build sem portao,
        # e portao que tem desvio nao e portao.
        BUILD_COMMIT: ${BUILD_COMMIT:-}
    mem_limit: 256m
    env_file: [.env]
    depends_on:
      db:
        condition: service_healthy
    # `up` e idempotente: aplica o que falta e sai 0 quando nao falta nada.
    # Pode rodar em toda subida, inclusive com o banco ja migrado.
    command: ["up"]
    restart: "no"

  api:
    # `image` com o MESMO nome nos dois servicos, e nao dois nomes: sem isto o
    # compose constroi `bichu-api` e `bichu-worker` separados, e a frase "a
    # mesma imagem" passa a depender de os dois builds coincidirem. Com um nome
    # so, `docker image ls` mostra UM artefato e a afirmacao vira verificavel.
    image: bichu-app:${IMAGE_TAG:-local}
    build:
      context: .
      target: ${BUILD_TARGET:-dev}
      args:
        # O commit de que esta imagem sai, gravado NELA. O Dockerfile reprova o
        # build quando o valor falta ou nao tem forma de commit -- e por isso o
        # padrao aqui e vazio e nao `${BUILD_COMMIT:?}`: a interpolacao do
        # compose acontece ao LER o arquivo, entao `:?` derrubaria tambem
        # `down`, `logs` e `config`, que nao constroem nada. Quem precisa
        # reprovar e o build, e e la que ele reprova.
        #
        #   BUILD_COMMIT=$(git rev-parse HEAD) docker compose build
        BUILD_COMMIT: ${BUILD_COMMIT:-}
    mem_limit: 320m
    command: ["node", "dist/bin/api.js"]
    env_file: [.env]
    environment:
      PORT: "3000"
      # Dentro do container, ouvir em todas as interfaces. O padrao do codigo e
      # 127.0.0.1 (correto para processo no laptop, errado dentro de container):
      # a borda nao alcancaria a api, e a sonda -- que bate em 127.0.0.1 de
      # DENTRO -- ficaria verde com o servico inalcancavel de fora. O que limita
      # a exposicao real e o mapeamento de porta da borda, nao este valor.
      BIND_HOST: "0.0.0.0"
      # Vem do .env por padrao; `make up PORTA=<n>` sobrescreve pelo ambiente do
      # shell, e as duas pontas (borda e aplicacao) mudam juntas.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      # Separadas de PUBLIC_BASE_URL em 19/09 (ADR-0017 item 2). Precisam estar
      # AQUI e nao so no `.env`: `make up HOST=<ip>` sobrescreve pelo ambiente do
      # shell, e uma base de tag que nao acompanha o resto faz o QR do ambiente
      # de rede local codificar `localhost` -- endereco que o telefone do outro
      # lado da Wi-Fi resolve para ele mesmo. Para um link isso e um erro de
      # teste; para plastico prensado nao ha conserto (ADR-0004).
      TAG_BASE_URL: ${TAG_BASE_URL:-http://localhost:3000}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:3000}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://localhost:3001}
      # `BUILD_COMMIT` NAO ESTA MAIS AQUI, e a ausencia e a correcao.
      #
      # Ate 22/09 ele era declarado como variavel de RUNTIME, com padrao vazio.
      # Duas consequencias, e as duas ruins:
      #
      #  1. Vazio vira ausente (`optionalEnv` mapeia `''` para `undefined`),
      #     entao a sonda respondia `commit: null` em toda subida que nao
      #     lembrasse da variavel -- que eram todas. Nao havia ruido nenhum.
      #  2. O valor ficava FORA da imagem. Promover a imagem entre ambientes
      #     nao promovia o commit junto, e cada destino precisaria declarar o
      #     seu -- que e como um destino declara um commit que nao e o que ele
      #     roda, sem estar mentindo de propriedade.
      #
      # Agora ele entra por `build.args` logo abaixo e fica gravado na imagem.
      # Declara-lo TAMBEM aqui reabriria o defeito pela porta dos fundos:
      # `environment` sobrescreve o `ENV` da imagem, entao o padrao vazio
      # apagaria o valor gravado e a sonda voltaria a `null` com a imagem
      # correta na mao. Ver o bloco "O COMMIT" no Dockerfile.
    depends_on:
      db: {condition: service_healthy}
      objeto: {condition: service_healthy}
      # A api so comeca com o esquema aplicado. Sem isto ela sobe, responde a
      # sonda (que so faz `select 1`) e so quebra na primeira consulta a
      # `users` -- erro de tabela inexistente a dez minutos da subida, sem
      # nenhuma relacao aparente com implantacao.
      migracao: {condition: service_completed_successfully}
      # Os buckets precisam existir antes de alguem tentar escrever neles. E
      # ha um efeito colateral que vale registrar: sem esta linha, `up --wait`
      # ve o `objeto_init` SAIR em vez de ficar de pe e devolve erro -- "exited
      # (0)" derrubando um `make up` em que tudo subiu certo. Declarar a
      # dependencia e o que diz ao compose que essa saida e o fim esperado.
      objeto_init: {condition: service_completed_successfully}
    healthcheck:
      # A sonda e /v1/health, sob o prefixo de versao: /ready nao existe no
      # contrato e nunca existiu, entao a sonda antiga reprovava com 404 e o
      # servico nunca ficava saudavel.
      #
      # /v1/health toca o banco de verdade -- sonda que nao sonda nada sempre
      # responde que esta tudo bem. Ainda NAO toca o armazenamento de objeto:
      # `verificacoes` em src/bin/api.ts tem so `database`. Enquanto for assim,
      # MinIO fora do ar deixa esta sonda verde.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  worker:
    # A MESMA imagem da api, outro ponto de entrada. Nao e outro servico: e o
    # mesmo codigo, o que mantem uma implantacao so e um contrato so.
    image: bichu-app:${IMAGE_TAG:-local}
    build:
      context: .
      target: ${BUILD_TARGET:-dev}
      args:
        # IDENTICO ao da api, e a identidade precisa ser exata. Os dois servicos
        # apontam para o MESMO `image:`, entao um argumento de build diferente
        # aqui produziria duas imagens com um nome so -- e a esteira, que
        # compara `docker inspect` de api e worker, reprovaria por uma
        # divergencia que nao e de codigo.
        BUILD_COMMIT: ${BUILD_COMMIT:-}
    mem_limit: 448m
    command: ["node", "dist/bin/worker.js"]
    env_file: [.env]
    environment:
      # UMA imagem por vez. Duas fotos grandes em paralelo estouram 448 MB com
      # folga, e ai o limite protege o Postgres mas o worker morre em toda
      # foto. Processar em serie e mais lento e e o que cabe em 2 GB.
      WORKER_IMAGE_CONCURRENCY: "1"
    depends_on:
      db: {condition: service_healthy}
      objeto: {condition: service_healthy}
      migracao: {condition: service_completed_successfully}
      # Os buckets precisam existir antes de alguem tentar escrever neles. E
      # ha um efeito colateral que vale registrar: sem esta linha, `up --wait`
      # ve o `objeto_init` SAIR em vez de ficar de pe e devolve erro -- "exited
      # (0)" derrubando um `make up` em que tudo subiu certo. Declarar a
      # dependencia e o que diz ao compose que essa saida e o fim esperado.
      objeto_init: {condition: service_completed_successfully}
    # O QUE ESTA SONDA PROVA, E O QUE ELA NAO PROVA.
    #
    # Prova: o processo esta vivo (ele e o PID 1 -- se morrer, o container
    # morre) e o banco esta alcancavel de dentro deste container.
    #
    # NAO prova que o laco de expurgo esta progredindo. Para isso o worker
    # precisaria gravar um batimento (ultima execucao bem-sucedida) que a sonda
    # lesse, e isso e codigo em `src/`. Enquanto nao existir, um worker que
    # pare de trabalhar sem morrer aparece saudavel aqui. Esta escrito para que
    # ninguem confunda "saudavel" com "trabalhando".
    healthcheck:
      test: ["CMD", "node", "-e", "const{Client}=require('pg');const c=new Client({connectionString:process.env.DATABASE_URL});c.connect().then(()=>c.query('select 1')).then(()=>c.end()).then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    restart: unless-stopped

  # ===========================================================================
  # COMPILAR NAO E SERVIR, E POR ISSO ESTE SERVICO EXISTE
  # ===========================================================================
  # A esteira roda a suite de integracao com `docker compose run --rm <servico>
  # npm run test:integration:executar`, e a PRIMEIRA coisa que o executor faz e
  # compilar (`infra/integracao/executar-suite.mjs`, `npx tsc -p tsconfig.json
  # --outDir dist/_tests`).
  #
  # Ate 23/09 o servico escolhido era `api`, que tem `mem_limit: 320m`. Esse
  # teto foi dimensionado para RODAR `node dist/bin/api.js`, nao para compilar o
  # projeto inteiro. Resultado medido na execucao 35812754457 e reproduzido aqui
  # (`docker compose run --rm --no-deps api npx tsc ...`, saida 137, "Killed"):
  # o compilador estoura o grupo de controle, o executor reprova com "a
  # compilacao falhou; a suite de integracao nao chegou a rodar", e NENHUM caso
  # roda. Placar sem caso nenhum, job `portao` vermelho por agregacao.
  #
  # A saida errada seria inflar o teto da `api`. Duas razoes:
  #
  #  1. O passo `limites de memoria estao valendo de verdade` (ci.yml) confere
  #     que o limite da `api` ESTA aplicado, e o que ele aplica e o numero que
  #     estiver aqui. Subir 320m para caber um compilador faz o portao passar a
  #     abencoar, em producao, uma api com o dobro do teto que ela precisa -- e
  #     ele existe justamente para o teto ser real.
  #  2. A soma no topo deste arquivo (1792 MB, ~256 MB para o sistema) e o
  #     orcamento da e2-small de 2 GB. `api` em 700m levaria a soma a 2172 MB, e
  #     o limite deixaria de caber na maquina que ele protege.
  #
  # Entao a compilacao sai do servico com teto de runtime e ganha o seu.
  # Nao e desenho novo: `infra/integracao/compose.integracao.yaml` ja separa
  # assim, com o servico `testes` em `mem_limit: 1g`. Este aqui e o mesmo
  # servico para a pilha da raiz, e o MESMO numero de proposito -- duas formas
  # para a mesma coisa divergem, e a que diverge para menos morre primeiro.
  #
  # PICO MEDIDO do `tsc` neste worktree, com `dist/_tests` APAGADO a cada
  # rodada: ver o comentario `mem_limit` abaixo.
  #
  # `profiles: [ferramentas]` e o que mantem a soma de cima verdadeira: este
  # servico NUNCA sobe junto com a pilha. `make up`, `--profile dev up` e
  # `--profile qa up` nao o enxergam; `docker compose run ferramentas` liga o
  # perfil sozinho, que e o unico jeito de ele existir.
  ferramentas:
    # A MESMA imagem da api e do worker. O que muda e o teto e o fato de este
    # servico nao ficar de pe: o artefato conferido pela esteira continua sendo
    # um so.
    image: bichu-app:${IMAGE_TAG:-local}
    build:
      context: .
      target: ${BUILD_TARGET:-dev}
      args:
        # IDENTICO ao da api e ao do worker. Os tres apontam para o mesmo
        # `image:`, e `infra/verificacao/verificar_commit_de_build.py` exige
        # que todo servico que constroi declare este argumento.
        BUILD_COMMIT: ${BUILD_COMMIT:-}
    # 1 GB, o mesmo do servico `testes` da pilha efemera.
    #
    # MEDIDO neste worktree em 23/09/2026, `dist/_tests` apagado a cada rodada
    # (apagado, e nao `touch`: o `COPY` do Docker casa por CONTEUDO, e tocar
    # arquivo nao invalida camada nem cache):
    #
    #   teto 320m (o da api)   -> saida 137, "Killed", nenhum caso roda
    #   teto 1g                -> compila, saida 0, e o pico do grupo de
    #                             controle (`/sys/fs/cgroup/memory.peak`) fica
    #                             em 548, 556 e 550 MiB em tres rodadas
    #
    # A folga entre o pico e o teto e deliberada: o pico do `tsc` varia com o
    # tamanho do grafo de tipos, e esse grafo cresce a cada arquivo novo. Teto
    # colado no pico de hoje e uma reprovacao marcada para o mes que vem, num
    # passo que nao tem nada a ver com quem a causou.
    mem_limit: 1g
    profiles: [ferramentas]
    env_file: [.env]
    environment:
      # O alvo `dev` da imagem ja traz `NODE_ENV=development`, e a suite depende
      # disso: o `reset()` do contador de limite recusa rodar em producao, de
      # proposito. Declarado aqui para a dependencia ficar visivel de fora da
      # imagem, como em `compose.integracao.yaml`.
      NODE_ENV: development
    # AS MESMAS dependencias da api, e nao menos: a suite de integracao fala com
    # o banco migrado e com o armazenamento de objeto. Com a pilha de pe (que e
    # o caso da esteira) elas ja estao satisfeitas e nada sobe a mais.
    depends_on:
      db: {condition: service_healthy}
      objeto: {condition: service_healthy}
      migracao: {condition: service_completed_successfully}
      objeto_init: {condition: service_completed_successfully}
    # Nada por padrao. Este servico existe para `docker compose run --rm`, e um
    # comando util aqui seria um servico a mais de pe no dia em que alguem
    # esquecer o perfil.
    command: ["node", "-e", "console.error('servico de ferramenta: use `docker compose run --rm ferramentas <comando>`'); process.exit(1)"]
    restart: "no"

  mail:
    # Captura SMTP em dev e qa. NAO prova entregabilidade: isso e reputacao de
    # dominio, SPF, DKIM e DMARC, e so existe com provedor real. No perfil de
    # homologacao este servico nao sobe e MAIL_TRANSPORT vira `log`, porque o
    # adaptador do Postmark ainda nao existe (ADR-0009). Dizia `postmark` ate
    # 19/09, e esse valor mata a subida desde que a validacao entrou.
    image: axllent/mailpit:v1.20@sha256:7eef0f38dbc85e4e264f2edf5d70fbb694826791e05cb2cae4fc9e3282f968f5
    mem_limit: 64m
    profiles: [dev, qa]
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  edge:
    # Duas origens distintas desde o primeiro dia, porque o ADR-0007 proibe
    # servir midia de usuario na origem da aplicacao. Se a separacao so
    # aparecer em producao, ela nunca e exercitada e o erro aparece tarde.
    #
    # Sao duas PORTAS e nao dois subdominios de localhost: `app.bichu.localhost`
    # resolveria no laptop e NAO resolve no telefone de ninguem, e o teste com
    # segundo aparelho depende disso (secao 3.10).
    image: caddy:2.8-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    mem_limit: 64m
    # Porta do hospedeiro IGUAL a porta de dentro, e nao um mapeamento cruzado:
    # o Caddy escuta na porta que esta em PUBLIC_BASE_URL, entao 3100:3000
    # publicaria um endereco que o proprio servidor nao atende.
    #
    # O numero e variavel porque em maquina compartilhada a 3000 e disputada --
    # e na maquina onde este produto e desenvolvido ela ja e de outro projeto,
    # junto com a 3001 (medido em 22/09, BICHUS-211). Por isso o par NAO vem
    # mais so daqui: `portas.local.mk`, gerado por maquina e fora do git, fixa o
    # primeiro par livre, e `make up` sem argumento passa a funcionar.
    #
    # `PORTA_APP` e `PORTA_MIDIA` trocam porta publicada e URL base JUNTAS --
    # trocar so uma faz o app gerar link para uma porta que nao responde, e isso
    # e pior do que nao subir porque nao falha na hora: falha no telefone de
    # quem leu o QR, e o que o QR guarda nao se corrige depois (ADR-0004).
    #
    # Ate 22/09 esse acordo era mantido por este comentario e pela disciplina de
    # lembrar do `PORTA=`. Comentario nao reprova nada. Agora quem reprova e
    # `make verificar-portas`, que le a configuracao RENDERIZADA por este
    # arquivo e confere porta publicada contra as cinco URLs base, com as iscas
    # em `infra/verificacao/iscas/portas-*.json`. Ele roda dentro de `make up`,
    # antes do docker.
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORTA_APP:-3000}:${PORTA_APP:-3000}"
      - "${BIND_HOST:-127.0.0.1}:${PORTA_MIDIA:-3001}:${PORTA_MIDIA:-3001}"
      # A 443 PRECISA estar aqui, e a falta dela derrubou a primeira subida do
      # minimo hospedado em 19/09 de um jeito que engana: com `PUBLIC_BASE_URL`
      # em https, o Caddy EMITE o certificado normalmente -- o desafio ACME usa
      # a 80, que esta publicada -- e o log diz "certificate obtained". So que
      # emitir nao e servir: ele passa a escutar TLS na 443, que ninguem
      # publicava, e a maquina recusa conexao em https com todos os certificados
      # no lugar.
      #
      # `PORTA_APP` sozinha nao resolve: em ambiente hospedado sao DUAS portas,
      # 80 para o redirecionamento e o desafio, 443 para o trafego. Com uma
      # variavel so, escolher 443 tira a 80 e a emissao para de funcionar.
      #
      # O padrao e 8443 e nao 443 de proposito: em `localhost` o Caddy nao faz
      # TLS e a porta fica sem uso, entao mapear 443 seria pedir privilegio que
      # o desenvolvimento nao precisa. Em homologacao o `.env` poe 443.
      - "${BIND_HOST:-127.0.0.1}:${PORTA_TLS:-8443}:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Os arquivos de associacao de deep link. O Caddyfile ja tinha os dois
      # blocos apontando para `/srv/well-known` e este diretorio NAO ESTAVA
      # MONTADO: a regra estava escrita e nao estava valendo, e o `file_server`
      # respondia 404 com `Content-Type: application/json` -- um 404 que parece
      # um arquivo, que e o jeito mais dificil de perceber que falta alguma
      # coisa. Ver infra/caddy/well-known/LEIA-ME.md.
      - ./infra/caddy/well-known:/srv/well-known:ro
      - caddy_dados:/data
      - caddy_config:/config
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://localhost:3001}
      OBJECT_BUCKET_PUBLIC: ${OBJECT_BUCKET_PUBLIC:-bichu-media-public}
      # O Caddyfile le `{$HOSTS_EXTRA_APP}` e `{$HOSTS_EXTRA_MIDIA}` desde a
      # BICHUS-146, para o apex entrar AO LADO de homologacao em vez de no
      # lugar dela. Sem a declaracao aqui as duas chegam vazias ao container,
      # os dois espacos reservados colapsam, e o Caddy sobe conhecendo so
      # `hml` e `img-hml` -- configuracao valida, apex mudo, e nada acusa.
      # Medido em 21/09: `caddy adapt` listava dois hosts onde deviam ser
      # quatro. O `.env` alimenta a interpolacao do compose, nao o processo.
      #
      # O padrao vazio e deliberado: em desenvolvimento a linha do Caddyfile
      # colapsa para a base sozinha e nada muda.
      HOSTS_EXTRA_APP: ${HOSTS_EXTRA_APP:-}
      HOSTS_EXTRA_MIDIA: ${HOSTS_EXTRA_MIDIA:-}
    depends_on: [api, objeto]
    restart: unless-stopped

volumes:
  dados_db:
  dados_objeto:
  caddy_dados:
  caddy_config:
