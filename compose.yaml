# Topologia local do Bichu. Um comando sobe tudo: `make up`.
# docs/07-devops.md secoes 2 e 3.
#
# A MESMA pilha roda na e2-small do Compute Engine (2 GB) com outro arquivo de
# ambiente. Dois destinos, um artefato: e o que torna a portabilidade um fato
# verificavel em vez de uma frase.
#
# ===========================================================================
# LIMITES DE MEMORIA: LEIA ANTES DE REMOVER
# ===========================================================================
# Nao sao otimizacao. Na e2-small sao 2 GB, e o worker de imagem aloca
# centenas de megabytes de uma vez para decodificar uma foto de celular.
#
# Quando falta memoria no sistema, o nucleo do Linux escolhe a vitima pela
# memoria residente. O maior residente desta pilha e o POSTGRES. Entao o que
# acontece e isto:
#
#   alguem envia uma foto grande -> o worker aloca -> a memoria acaba ->
#   O BANCO MORRE.
#
# No log aparece "o banco caiu sozinho", sem nenhuma mencao a upload, sem
# relacao aparente com foto, num horario que nao corresponde a nada. Alguem
# passa dois dias investigando o banco.
#
# Com limite por container, o grupo de controle do worker estoura primeiro, o
# nucleo mata dentro daquele grupo, e o Postgres nem fica sabendo. O worker
# morre, reinicia, e o trabalho volta para a tabela `jobs`.
#
# Soma dos limites: 1792 MB, deixando ~256 MB para o sistema operacional.
# Se apertar, e2-medium e REINICIO e nao migracao: parar, trocar o tipo,
# religar. Dura minutos.
#
# CONFIRA COM `docker stats` que os limites aparecem. `deploy.resources` fora
# do Swarm e ignorado em silencio e o arquivo parece correto.
# ===========================================================================

name: bichu

services:
  db:
    # Digest fixado: `latest` em qualquer ambiente e defeito, e versao movel
    # transforma "funciona aqui" em coincidencia.
    image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    mem_limit: 640m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bichu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_DB: ${POSTGRES_DB:-bichu}
      # Proporcional ao limite do container, nunca no padrao da imagem: o
      # padrao supoe uma maquina inteira disponivel.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_buffers=160MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=8MB
      - -c
      - max_connections=40
    volumes:
      - dados_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bichu} -d ${POSTGRES_DB:-bichu}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  objeto:
    # Armazenamento de objeto falando a API S3. Nao e "MinIO no lugar da AWS":
    # e a API S3, que o MinIO implementa e que S3 e GCS tambem atendem.
    #
    # Registro: o MinIO NAO esta mais no Docker Hub (`minio/minio` responde
    # "pull access denied"). A imagem oficial vive no quay.io. Quem for
    # atualizar a tag vai esbarrar nisso e perder tempo achando que e
    # credencial. O que pina de verdade e o digest, nao a tag.
    image: quay.io/minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    mem_limit: 320m
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY_ID:?defina no .env}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?defina no .env}
      # O MinIO assina a URL com o host pelo qual ele se conhece. Se isto
      # divergir do host publico, TODA URL assinada quebra, com erro de
      # assinatura que nao diz que e de host. E o defeito classico de
      # homologacao atras de tunel ou de IP de rede local.
      MINIO_SERVER_URL: ${MEDIA_PUBLIC_BASE_URL:-http://localhost:3001}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_CONSOLE_URL:-http://localhost:9001}
    volumes:
      - dados_objeto:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  objeto_init:
    # Cria os dois buckets do ADR-0007 e aplica a politica. Idempotente: pode
    # rodar em toda subida. O bucket privado NAO recebe politica anonima, e e
    # essa separacao fisica que protege o original com EXIF.
    image: quay.io/minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      objeto:
        condition: service_healthy
    environment:
      OBJECT_BUCKET_PRIVATE: ${OBJECT_BUCKET_PRIVATE:-bichu-media-private}
      OBJECT_BUCKET_PUBLIC: ${OBJECT_BUCKET_PUBLIC:-bichu-media-public}
      CHAVE: ${OBJECT_STORAGE_ACCESS_KEY_ID:?}
      SEGREDO: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set local http://objeto:9000 "$$CHAVE" "$$SEGREDO"
        mc mb --ignore-existing "local/$$OBJECT_BUCKET_PRIVATE"
        mc mb --ignore-existing "local/$$OBJECT_BUCKET_PUBLIC"
        mc anonymous set none     "local/$$OBJECT_BUCKET_PRIVATE"
        mc anonymous set download "local/$$OBJECT_BUCKET_PUBLIC"
        echo "buckets prontos: privado sem acesso anonimo, publico somente leitura"
    restart: "no"

  migracao:
    # As migracoes rodam AQUI, num job proprio, e nao no boot da api.
    #
    # O motivo esta no Dockerfile (alvo `migrador`), em duas linhas: migrar no
    # boot faz N replicas concorrerem e uma migracao ruim derrubar todas de uma
    # vez; e `node-pg-migrate` e devDependency, que no alvo `prod` significaria
    # carregar tsc no runtime.
    #
    # `target` fixo em `migrador` DE PROPOSITO: nao segue BUILD_TARGET, porque
    # a migracao nao muda de forma entre dev e producao. Trocar isso por
    # `${BUILD_TARGET}` faria o alvo `prod` subir sem a ferramenta e o job
    # falhar so no ambiente onde ele importa.
    image: bichu-migrador:${IMAGE_TAG:-local}
    build:
      context: .
      target: migrador
    mem_limit: 256m
    env_file: [.env]
    depends_on:
      db:
        condition: service_healthy
    # `up` e idempotente: aplica o que falta e sai 0 quando nao falta nada.
    # Pode rodar em toda subida, inclusive com o banco ja migrado.
    command: ["up"]
    restart: "no"

  api:
    # `image` com o MESMO nome nos dois servicos, e nao dois nomes: sem isto o
    # compose constroi `bichu-api` e `bichu-worker` separados, e a frase "a
    # mesma imagem" passa a depender de os dois builds coincidirem. Com um nome
    # so, `docker image ls` mostra UM artefato e a afirmacao vira verificavel.
    image: bichu-app:${IMAGE_TAG:-local}
    build:
      context: .
      target: ${BUILD_TARGET:-dev}
    mem_limit: 320m
    command: ["node", "dist/bin/api.js"]
    env_file: [.env]
    environment:
      PORT: "3000"
      # Dentro do container, ouvir em todas as interfaces. O padrao do codigo e
      # 127.0.0.1 (correto para processo no laptop, errado dentro de container):
      # a borda nao alcancaria a api, e a sonda -- que bate em 127.0.0.1 de
      # DENTRO -- ficaria verde com o servico inalcancavel de fora. O que limita
      # a exposicao real e o mapeamento de porta da borda, nao este valor.
      BIND_HOST: "0.0.0.0"
      # Vem do .env por padrao; `make up PORTA=<n>` sobrescreve pelo ambiente do
      # shell, e as duas pontas (borda e aplicacao) mudam juntas.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:3000}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://localhost:3001}
    depends_on:
      db: {condition: service_healthy}
      objeto: {condition: service_healthy}
      # A api so comeca com o esquema aplicado. Sem isto ela sobe, responde a
      # sonda (que so faz `select 1`) e so quebra na primeira consulta a
      # `users` -- erro de tabela inexistente a dez minutos da subida, sem
      # nenhuma relacao aparente com implantacao.
      migracao: {condition: service_completed_successfully}
      # Os buckets precisam existir antes de alguem tentar escrever neles. E
      # ha um efeito colateral que vale registrar: sem esta linha, `up --wait`
      # ve o `objeto_init` SAIR em vez de ficar de pe e devolve erro -- "exited
      # (0)" derrubando um `make up` em que tudo subiu certo. Declarar a
      # dependencia e o que diz ao compose que essa saida e o fim esperado.
      objeto_init: {condition: service_completed_successfully}
    healthcheck:
      # A sonda e /v1/health, sob o prefixo de versao: /ready nao existe no
      # contrato e nunca existiu, entao a sonda antiga reprovava com 404 e o
      # servico nunca ficava saudavel.
      #
      # /v1/health toca o banco de verdade -- sonda que nao sonda nada sempre
      # responde que esta tudo bem. Ainda NAO toca o armazenamento de objeto:
      # `verificacoes` em src/bin/api.ts tem so `database`. Enquanto for assim,
      # MinIO fora do ar deixa esta sonda verde.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  worker:
    # A MESMA imagem da api, outro ponto de entrada. Nao e outro servico: e o
    # mesmo codigo, o que mantem uma implantacao so e um contrato so.
    image: bichu-app:${IMAGE_TAG:-local}
    build:
      context: .
      target: ${BUILD_TARGET:-dev}
    mem_limit: 448m
    command: ["node", "dist/bin/worker.js"]
    env_file: [.env]
    environment:
      # UMA imagem por vez. Duas fotos grandes em paralelo estouram 448 MB com
      # folga, e ai o limite protege o Postgres mas o worker morre em toda
      # foto. Processar em serie e mais lento e e o que cabe em 2 GB.
      WORKER_IMAGE_CONCURRENCY: "1"
    depends_on:
      db: {condition: service_healthy}
      objeto: {condition: service_healthy}
      migracao: {condition: service_completed_successfully}
      # Os buckets precisam existir antes de alguem tentar escrever neles. E
      # ha um efeito colateral que vale registrar: sem esta linha, `up --wait`
      # ve o `objeto_init` SAIR em vez de ficar de pe e devolve erro -- "exited
      # (0)" derrubando um `make up` em que tudo subiu certo. Declarar a
      # dependencia e o que diz ao compose que essa saida e o fim esperado.
      objeto_init: {condition: service_completed_successfully}
    # O QUE ESTA SONDA PROVA, E O QUE ELA NAO PROVA.
    #
    # Prova: o processo esta vivo (ele e o PID 1 -- se morrer, o container
    # morre) e o banco esta alcancavel de dentro deste container.
    #
    # NAO prova que o laco de expurgo esta progredindo. Para isso o worker
    # precisaria gravar um batimento (ultima execucao bem-sucedida) que a sonda
    # lesse, e isso e codigo em `src/`. Enquanto nao existir, um worker que
    # pare de trabalhar sem morrer aparece saudavel aqui. Esta escrito para que
    # ninguem confunda "saudavel" com "trabalhando".
    healthcheck:
      test: ["CMD", "node", "-e", "const{Client}=require('pg');const c=new Client({connectionString:process.env.DATABASE_URL});c.connect().then(()=>c.query('select 1')).then(()=>c.end()).then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    restart: unless-stopped

  mail:
    # Captura SMTP em dev e qa. NAO prova entregabilidade: isso e reputacao de
    # dominio, SPF, DKIM e DMARC, e so existe com provedor real. No perfil de
    # homologacao este servico nao sobe e MAIL_TRANSPORT vira `postmark`.
    image: axllent/mailpit:v1.20@sha256:7eef0f38dbc85e4e264f2edf5d70fbb694826791e05cb2cae4fc9e3282f968f5
    mem_limit: 64m
    profiles: [dev, qa]
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  edge:
    # Duas origens distintas desde o primeiro dia, porque o ADR-0007 proibe
    # servir midia de usuario na origem da aplicacao. Se a separacao so
    # aparecer em producao, ela nunca e exercitada e o erro aparece tarde.
    #
    # Sao duas PORTAS e nao dois subdominios de localhost: `app.bichu.localhost`
    # resolveria no laptop e NAO resolve no telefone de ninguem, e o teste com
    # segundo aparelho depende disso (secao 3.10).
    image: caddy:2.8-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    mem_limit: 64m
    # Porta do hospedeiro IGUAL a porta de dentro, e nao um mapeamento cruzado:
    # o Caddy escuta na porta que esta em PUBLIC_BASE_URL, entao 3100:3000
    # publicaria um endereco que o proprio servidor nao atende.
    #
    # O numero e variavel porque em maquina compartilhada a 3000 e disputada.
    # `make up PORTA=3100` troca porta e URL base juntas -- trocar so uma faz o
    # app gerar link para uma porta que nao responde.
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORTA_APP:-3000}:${PORTA_APP:-3000}"
      - "${BIND_HOST:-127.0.0.1}:${PORTA_MIDIA:-3001}:${PORTA_MIDIA:-3001}"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Os arquivos de associacao de deep link. O Caddyfile ja tinha os dois
      # blocos apontando para `/srv/well-known` e este diretorio NAO ESTAVA
      # MONTADO: a regra estava escrita e nao estava valendo, e o `file_server`
      # respondia 404 com `Content-Type: application/json` -- um 404 que parece
      # um arquivo, que e o jeito mais dificil de perceber que falta alguma
      # coisa. Ver infra/caddy/well-known/LEIA-ME.md.
      - ./infra/caddy/well-known:/srv/well-known:ro
      - caddy_dados:/data
      - caddy_config:/config
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://localhost:3001}
      OBJECT_BUCKET_PUBLIC: ${OBJECT_BUCKET_PUBLIC:-bichu-media-public}
    depends_on: [api, objeto]
    restart: unless-stopped

volumes:
  dados_db:
  dados_objeto:
  caddy_dados:
  caddy_config:
