  # resolver contra o contrato.
  #
  # `updateNetworkEvent`, logo acima, FICA: a tela de editar e de outro
  # despacho, e dizer que ela existe seria falso.
  - operationId: createNetworkEventCoverUploadIntent
    resolucao: "RESOLVIDO 19/10/2026: a tela existe e chama esta operacao"
    nota: "a autorizacao de envio da capa; o app reusa o envio direto que ja tem para foto de pet. RESOLVIDO EM 19/10/2026, por pedido do cliente ('a foto que eu estou falando para criar do evento e a da capa do evento'): `app/lib/telas/rede/criar_encontro.dart` pergunta a capa e chama esta operacao por `RedeApi.intencaoDeCapaDoEncontro`, e a capa e confirmada no MESMO `POST /v1/network/events`, em `cover_image.upload_id`. A linha FICA aqui, com a data, porque o historico de por que a tela nasceu depois do backend e o que explica a forma do contrato -- esta secao e o registro de operacao de contrato sem tela, e esta deixou de ser uma. Medido contra a homologacao: `image/heic` -> 400 (`field: content_type`, `code: enum`), `image/jpeg` -> 201 com a chave em `events/original/`, e o `POST` da criacao -> 201"
  # 18/10/2026. A LEITURA DE UM ITEM da fila de moderacao, e ela esta AQUI e nao
  # em `telas` porque a tela de verdade nao a chama -- e a ausencia e declarada,
  # nao esquecida.
  #
  # `listAdminModerationReports` ja devolve o item inteiro: conteudo, relato,
  # motivos, as duas contagens e a decisao. A tela abre o dialogo com a linha
  # que ja tem na mao, e uma segunda viagem ao servidor para reler o que acabou
  # de chegar seria trafego por nada.
  #
  # Ela existe no contrato porque a fila VAI precisar dela: quando a origem
  # `conversation` ganhar o que mostrar, ou quando houver tela de item com
  # endereco proprio (recarregar a pagina sobre uma decisao em andamento), a
  # leitura e por onde isso entra. Inventa-la depois mudaria o contrato; deixa-la
  # declarada agora nao custa nada e nao e quebra.
  - operationId: getAdminModerationReport
    resolucao: "tela: resolvido quando a tela de item existir"
    nota: "a listagem ja devolve o item inteiro e a tela usa a linha que tem na mao; a leitura existe para a tela de item com endereco proprio, que e do despacho seguinte"
