# ======================================================================
# O que existe no contrato e NENHUMA tela usa. Decisao da coordenacao, 23/09:
# todas as operacoes abaixo sao funcionalidade de verdade e GANHAM TELA. Cada
# uma fica aqui ate a tela existir no prototipo, e sai daqui para `telas` no
# mesmo commit em que o prototipo a desenhar ("resolvido quando a tela
# existir").
# ======================================================================

contrato_sem_tela:
  - operationId: createAdminStorePartner
    resolucao: "tela: resolvido quando a tela existir"
    nota: "nao ha tela de parceiros; o select so lista os cadastrados. Ou a tela nasce, ou parceiro entra por comando de linha"
  - operationId: getAdminStorePartner
    resolucao: "tela: resolvido quando a tela existir"
    nota: "tela de parceiros (lista, cadastro e edicao)"
  - operationId: updateAdminStorePartner
    resolucao: "tela: resolvido quando a tela existir"
    nota: "tela de parceiros (lista, cadastro e edicao)"
  - operationId: updateAdminStoreTag
    resolucao: "tela: resolvido quando a tela existir"
    nota: "nao ha tela de vocabulario: renomear e desativar tag nao tem onde acontecer"
  - operationId: closeAllAdminSessions
    resolucao: "tela: resolvido quando a tela existir"
    nota: "sair de todas as sessoes administrativas nao tem botao"
  - operationId: withdrawNetworkEventJoinRequest
    situacao: pendente
    onde: "ADR-0027 12.11 (BICHUS-251)"
    resolucao: "tela: resolvido quando a tela existir"
    nota: "o app ganha o gesto de desistir do pedido, com texto a aprovar pela UX"
  - campo: "AdminStorePartner.sort_order, AdminStoreItem.sort_order"
    nota: "a ordem de curadoria nao e editavel em tela"
  - campo: "listAdminStoreItems query:publication_state=retired"
    nota: "a lista nao tem o chip Retirados"
  - campo: "listAdminNetworkEvents query:publication_status, query:visibility, query:city"
    nota: "a lista do painel nao filtra por cancelado, removido, visibilidade nem cidade"
  - campo: "JoinRequestAppState withdrawn, expired"
    nota: "o filtro 'Situacao do pedido' do app so tem Enviado e Aprovado"
