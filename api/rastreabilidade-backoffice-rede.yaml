  # ====================================================================
  # `StoreCategory` SAIU DAQUI EM 17/10/2026, E A SAIDA E A DECISAO
  # ====================================================================
  #
  # Havia aqui uma correspondencia `um_para_um` com seis codigos e seis
  # rotulos, `fonte_do_rotulo: app/lib/api/modelos_loja.dart`. Ela nao tem
  # mais do que falar:
  #
  # - **o rotulo deixou de morar no cliente.** A `20261017000003` o poe em
  #   `store_categories.label`, e ele chega na resposta
  #   (`category_label`/`subcategory_label`). Nao ha mais dois lugares para
  #   divergirem, que era exatamente o que esta secao cobrava;
  # - **`StoreCategory` deixou de ser `enum`.** Sem lista fechada no contrato,
  #   `um_para_um` nao tem contra o que ser conferido -- e foi por isso que
  #   este portao reprovou os seis codigos como "fora da lista fechada".
  #
  # O PLURAL que o cliente pediu no mesmo dia (`toy` -> "Brinquedos",
  # `accessory` -> "Roupas e acessorios") nao se perdeu: ele e semente da
  # `20261017000003`, e quem o guarda agora e
  # `tests/integration/taxonomia-da-loja-em-dois-niveis.test.ts`. Os CODIGOS
  # continuam `toy` e `accessory`, porque trocar o codigo quebraria o APK
  # instalado.
  #
  # `rotulosLegadosDaCategoria` em `app/lib/api/modelos_loja.dart` sobreviveu
  # como reserva de UMA versao, para servidor sem `category_label`. Nao e
  # correspondencia: ele cobre so os seis antigos, e de proposito.
