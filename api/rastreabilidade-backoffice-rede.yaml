# Matriz de rastreabilidade: telas do backoffice e da Rede contra api/openapi.yaml
#
# Status: rascunho
# Atualizado: 2026-09-28
# Dono: arquitetura (ADR-0027 item 18)
#
# POR QUE ESTE ARQUIVO EXISTE, EM UMA FRASE: regra do cliente de 23/09, "tudo
# segue o api/openapi.yaml; backend, app, backoffice e site usam os mesmos
# campos, valores e funcionalidades". Esta matriz liga cada tela e estado dos
# prototipos a operacao que ela chama e a cada campo, filtro e valor de lista
# fechada que ela mostra ou envia. Ela e dado para portao, e nao prosa.
#
# Prototipos lidos (locais, em docs/, fora do git):
#   docs/prototipos/backoffice.html     (06-design-system.md secao 25)
#   docs/prototipos/rede-encontro.html  (06-design-system.md secao 24)
#
# COMO LER UMA REFERENCIA DE CAMPO. Cada item de `usa` e uma das formas:
#   req:<caminho>      propriedade do corpo da requisicao (a.b, a[] para item de lista)
#   resp:<caminho>     propriedade do corpo da resposta de sucesso (200 ou 201)
#   query:<nome>       parametro de consulta da operacao
#   path:<nome>        parametro de caminho da operacao
#   header:<nome>      cabecalho declarado da operacao
#   problem:<slug>     tipo de problema de x-problem-types
#   enum:<Schema>.<v>  valor de lista fechada de components/schemas
#
# `situacao` de uma operacao:
#   contrato   existe em api/openapi.yaml desta branch, e o portao resolve tudo
#   pendente   ainda nao esta nesta branch; `onde` diz onde ela esta decidida.
#              O portao lista, nao resolve, e reprova se `onde` faltar.
#
# O PORTAO (src/tools/portao-rastreabilidade.ts, ADR-0027 item 18): le este arquivo e api/openapi.yaml e
# reprova quando (1) um operationId de situacao `contrato` nao existe; (2) uma
# referencia `req`, `resp`, `query`, `path`, `header`, `problem` ou `enum` nao
# resolve (seguindo $ref, allOf, oneOf e itens de lista); (3) uma lacuna de
# `tela_sem_contrato` com `resolucao: contrato` passou a resolver e continua
# listada (lacuna fechada que ninguem tirou daqui); (4) uma operacao do
# contrato sob /admin/ ou uma operacao da Rede nao aparece nem em `telas` nem em
# `contrato_sem_tela` (operacao nova que ninguem classificou). E reprova se o
# arquivo tiver zero telas, porque um portao sem o que conferir nao aprova.

versao: 1
contrato: api/openapi.yaml

telas:

  # ====================================================================
  # Backoffice (docs/prototipos/backoffice.html)
  # ====================================================================

  - tela: "1 · Login"
    prototipo: backoffice.html
    estados: [repouso, entrando, recusada, tentativas, bloqueado, vazada, expirada, verif_recusada, verif_falhou, sem_conexao, saiu]
    operacoes:
      - operationId: openAdminSession
        situacao: contrato
        usa:
          - req:email
          - req:password
          - header:X-Captcha-Token
          - resp:display_name
          - resp:roles
          - resp:csrf_token
          - resp:idle_expires_at
          - resp:absolute_expires_at
          - enum:AdminRole.admin
          # 1.3 recusada, mensagem unica. Desde o item 20 do ADR-0027 a senha
          # vazada (1.6) e a conta bloqueada respondem este MESMO 401 (D43):
          # `password-reset-required` saiu do contrato do painel.
          - problem:invalid-credentials
          - problem:rate-limited             # 1.4 tentativas e 1.5 bloqueado
          - problem:captcha-rejected         # 1.8 verif_recusada
          - problem:validation-failed
      # `requestPasswordReset` saiu desta tela (ADR-0027 item 20.4): a conta do
      # painel nao tem redefinicao por e-mail. O botao vira o texto "Fale com o
      # responsavel pelo painel para redefinir a senha."
      - operationId: closeAdminSession
        situacao: contrato
        nota: "1.11 saiu, e o botao Sair da navegacao"
        usa: []
    estados_sem_operacao:
      verif_falhou: "o script do reCAPTCHA nao carregou no navegador; nenhuma chamada sai"
      sem_conexao: "falha de rede; nenhuma resposta do contrato"
      expirada: "resposta 401 token-expired de qualquer operacao administrativa"

  - tela: "Nao fui eu (/nao-fui-eu)"
    prototipo: admin/src/naoFuiEu/NaoFuiEu.tsx
    nota: "ADR-0027 item 20.5 e D62: o token vem no fragmento do link do e-mail de sessao aberta, sai da barra de endereco e so vai ao servidor por POST depois do clique"
    estados: [confirmar, enviando, feito, vencido, incompleto, recusado, sem_conexao]
    operacoes:
      - operationId: disavowAdminSessionAlert
        situacao: contrato
        usa:
          - req:token
          - problem:token-expired            # 410 vencido, usado ou inexistente
          - problem:validation-failed        # 400 incompleto
          - problem:forbidden                # 403 Origin fora do painel
    estados_sem_operacao:
      confirmar: "o link foi aberto; nada sai antes do clique"
      incompleto: "sem token no fragmento, ou fora do formato de 43 caracteres base64url; nenhuma chamada sai"
      sem_conexao: "falha de rede; nenhuma resposta do contrato"

  - tela: "Casca e navegacao (todas as telas)"
    prototipo: backoffice.html
    estados: [sessao28, sessao12h]
    operacoes:
      - operationId: getAdminSession
        situacao: contrato
        nota: "nome na navegacao e os prazos que alimentam S.1 (aviso de 28 min) e S.2 (teto de 12 h)"
        usa:
          - resp:display_name
          - resp:idle_expires_at
          - resp:absolute_expires_at
          - resp:csrf_token
          - problem:unauthenticated
          - problem:token-expired

  - tela: "3 · Loja: lista"
    prototipo: backoffice.html
    estados: [dados, paginada, carregando, vazia, semres, erro, salvo, sessao28, sessao12h]
    operacoes:
      - operationId: listAdminStoreItems
        situacao: contrato
        usa:
          - query:q
          - query:category
          - query:species
          - query:publication_state
          - query:price_status
          - query:sort
          - query:page
          - query:limit
          - resp:items[].slug
          - resp:items[].title
          - resp:items[].partner.name
          - resp:items[].target_url
          - resp:items[].category
          - resp:items[].species
          - resp:items[].images
          - resp:items[].price.amount
          - resp:items[].price.checked_at
          - resp:items[].price.valid_until
          - resp:items[].price_status
          - resp:items[].publication_state
          - resp:items[].updated_at
          - resp:total
          - resp:effective_sort
          - enum:AdminStoreItemPublicationState.draft
          - enum:AdminStoreItemPublicationState.published
          - enum:StorePriceStatus.vigente
          - enum:StorePriceStatus.vencido
          - enum:StorePriceStatus.sem_preco
          - enum:Species.dog
          - enum:Species.cat
          - enum:Species.other
        correspondencia_de_ordem:
          upd: atualizado
          nome: nome
          venc: validade   # "Preco vencido primeiro" = menor valid_until primeiro
      - operationId: publishAdminStoreItem
        situacao: contrato
        nota: "item de menu Publicar"
        usa:
          - header:If-Match
      - operationId: retireAdminStoreItem
        situacao: contrato
        nota: "item de menu Despublicar; sem senha desde 07/10 (ADR-0027 item 23)"
        usa:
          - header:If-Match
          - problem:reauthentication-required
      - operationId: updateAdminStoreItem
        situacao: contrato
        nota: "dialogo Renovar consulta de preco"
        usa:
          - req:price.amount
          - req:price.checked_at
          - header:If-Match
      - operationId: reauthenticateAdmin
        situacao: contrato
        usa:
          - req:password
          - req:scope
          - resp:reauth_token
          - resp:csrf_token
          - problem:invalid-credentials

  - tela: "3 · Loja: formulario"
    prototipo: backoffice.html
    estados: [novo, vencido, erros, salvando, imagens, limite]
    operacoes:
      - operationId: getAdminStoreItem
        situacao: contrato
        usa:
          - resp:slug
          - resp:version
      - operationId: createAdminStoreItem
        situacao: contrato
        nota: "Salvar rascunho; Publicar e esta operacao seguida de publishAdminStoreItem"
        usa:
          - req:title
          - req:summary
          - req:category
          - req:species
          - req:tag_slugs
          - req:images[].upload_id
          - req:images[].alt_text
          - req:partner_slug
          - req:target_url
          - req:price.amount
          - req:price.checked_at
          - req:price.currency
          - req:subcategory
          # OS SEIS `enum:StoreCategory.*` SAIRAM DAQUI EM 17/10/2026.
          #
          # A `20261017000003` trocou o `CHECK` de seis literais por chave
          # estrangeira para `store_categories`, e `StoreCategory` deixou de
          # ser `enum` no contrato (virou `string` com padrao, precedente de
          # `breed_code`). Referencia `enum:` a schema que nao e mais `enum`
          # nao resolve, e foi assim que este portao reprovou -- pela terceira
          # vez em que esta matriz nao acompanhou o contrato.
          #
          # O vocabulario que o select oferece passou a vir de
          # `getStoreTaxonomy`, declarada abaixo. Nao ha o que enumerar aqui:
          # a lista fechada mora em LINHAS, e e o portao de integracao
          # (`taxonomia-da-loja-em-dois-niveis.test.ts`) que a conta.
          - problem:validation-failed
          - problem:slug-taken
      - operationId: getStoreTaxonomy
        situacao: contrato
        nota: "os dois selects: o vocabulario dos dois niveis, que deixou de ser `enum` em 17/10"
        usa:
          - resp:categories[].code
          - resp:categories[].label
          - resp:categories[].subcategories[].code
          - resp:categories[].subcategories[].label
      - operationId: updateAdminStoreItem
        situacao: contrato
        nota: "Salvar alteracoes"
        usa:
          - req:title
          - req:summary
          - req:category
          - req:subcategory
          - req:species
          - req:tag_slugs
          - req:images[].upload_id
          - req:images[].alt_text
          - req:partner_slug
          - req:target_url
          - req:price.amount
          - req:price.checked_at
          - header:If-Match
          - problem:precondition-failed
      - operationId: listAdminStorePartners
        situacao: contrato
        nota: "select de parceiro: 'so aparecem parceiros ja cadastrados'"
        usa:
          - query:active
          - resp:items[].slug
          - resp:items[].name
          - resp:items[].host
      - operationId: listAdminStoreTags
        situacao: contrato
        nota: "chips de tag, ate 5"
        usa:
          - query:active
          - resp:items[].slug
          - resp:items[].label
      - operationId: createAdminStoreTag
        situacao: contrato
        nota: "dialogo Criar tag (2 a 24 caracteres, ate 40 ativas)"
        usa:
          - req:label
          - resp:slug
          - problem:slug-taken
          - problem:validation-failed
      - operationId: createAdminCatalogImageIntent
        situacao: contrato
        nota: "galeria: JPG, PNG ou WebP, ate 5 MB, minimo 800 x 800"
        usa:
          - req:purpose
          - req:content_type
          - req:byte_size
          - resp:upload_id
          - resp:url
          - resp:method
          - resp:fields
          - enum:AdminCatalogImageIntentInput.purpose.store_item
          - problem:unsupported-media-type

  - tela: "4 · Rede: lista"
    prototipo: backoffice.html
    estados: [dados, carregando, vazia, semres, erro, salvo]
    operacoes:
      - operationId: listAdminNetworkEvents
        situacao: contrato
        usa:
          - query:q
          - query:timing
          - query:sort
          - resp:items[].slug
          - resp:items[].title
          - resp:items[].place.place_name
          - resp:items[].place.neighborhood
          - resp:items[].place.city
          - resp:items[].starts_at
          - resp:items[].ends_at
          - resp:items[].timing
          - resp:items[].visibility
          - resp:items[].admission.kind
          - resp:items[].admission.price.amount
          - resp:items[].admission.price.unit
          - resp:items[].pending_request_count
          - resp:items[].images
          - resp:items[].updated_at
          - enum:AdminNetworkEventTiming.upcoming
          - enum:AdminNetworkEventTiming.happening
          - enum:AdminNetworkEventTiming.ended
          - enum:NetworkEventVisibility.public
          - enum:NetworkEventVisibility.private
        correspondencia_de_ordem:
          data: agenda
          upd: atualizado
      - operationId: removeAdminNetworkEvent
        situacao: contrato
        nota: "item de menu Excluir; sem senha desde 07/10 (ADR-0027 item 23)"
        usa:
          - header:If-Match
          - problem:reauthentication-required
      - operationId: cancelAdminNetworkEvent
        situacao: contrato
        nota: "item de menu Cancelar, com motivo; sem senha desde 07/10 (ADR-0027 item 23); o cancelado segue no app ate o fim previsto"
        usa:
          - req:note
          - header:If-Match
          - resp:publication_status
          - resp:cancellation_note
          - enum:AdminNetworkEventPublicationStatus.cancelled
          - problem:reauthentication-required

  - tela: "4 · Rede: formulario"
    prototipo: backoffice.html
    estados: [novo, editando, pago, erros, salvando, encerrado, mapa_falha]
    operacoes:
      - operationId: getAdminNetworkEvent
        situacao: contrato
        usa:
          - resp:slug
          - resp:version
          - resp:place.point.lat
          - resp:place.point.lon
      - operationId: createAdminNetworkEvent
        situacao: contrato
        nota: "Publicar encontro: criar e publicar (12.9)"
        usa:
          - req:title
          - req:summary
          - req:images[].upload_id
          - req:images[].alt_text
          - req:starts_at
          - req:ends_at
          - req:place.point.lat
          - req:place.point.lon
          - req:place.place_name
          - req:place.neighborhood
          - req:place.city
          - req:visibility
          - req:admission.kind
          - req:admission.price.amount
          - req:admission.price.unit
          - req:bring_items
          - req:notes
          - req:accepted_sizes
          - req:dog_age
          - req:vaccination_required
          - req:fenced_off_leash_area
          - req:amenities
          - enum:EventPriceUnit.per_pet
          - enum:EventPriceUnit.per_person
          - enum:EventPriceUnit.per_pair
          - enum:EventPriceUnit.per_two_people
          - req:ticket_url
          - req:instagram_url
          - enum:PetSize.P
          - enum:PetSize.M
          - enum:PetSize.G
          - enum:PetSize.GG
          - enum:NetworkEventDogAge.any
          - enum:NetworkEventDogAge.from_4_months
          - enum:NetworkEventDogAge.from_1_year
          - enum:NetworkEventDogAge.up_to_1_year
          - enum:NetworkEventAmenity.level_ground_or_ramp
          - enum:NetworkEventAmenity.accessible_restroom
          - enum:NetworkEventAmenity.public_restroom_nearby
          - enum:NetworkEventAmenity.shade
          - enum:NetworkEventAmenity.benches
          - enum:NetworkEventAmenity.dog_water_fountain
          - enum:NetworkEventAmenity.parking_nearby
          - enum:NetworkEventBringItem.water
          - enum:NetworkEventBringItem.water_bowl
          - enum:NetworkEventBringItem.leash
          - enum:NetworkEventBringItem.poop_bags
          - enum:NetworkEventBringItem.treats
          - enum:NetworkEventBringItem.towel
          - enum:NetworkEventBringItem.vaccination_card
          - enum:NetworkEventBringItem.toy
          - problem:validation-failed
      - operationId: updateAdminNetworkEvent
        situacao: contrato
        nota: "Salvar alteracoes, para titulo, descricao, fotos, o que levar, observacoes e detalhes"
        usa:
          - req:title
          - req:summary
          - req:images[].upload_id
          - req:images[].alt_text
          - req:bring_items
          - req:notes
          - req:accepted_sizes
          - req:dog_age
          - req:vaccination_required
          - req:fenced_off_leash_area
          - req:amenities
          - req:ticket_url
          - req:instagram_url
          - header:If-Match
      - operationId: relocateAdminNetworkEvent
        situacao: contrato
        nota: "dialogo 'Salvar a mudanca de local?'; sem senha desde 07/10 (ADR-0027 item 23)"
        usa:
          - req:place.point.lat
          - req:place.point.lon
          - req:place.place_name
          - req:starts_at
          - req:ends_at
          - req:reason
          - header:If-Match
      - operationId: changeAdminNetworkEventAccess
        situacao: contrato
        nota: "dialogo 'Salvar a mudanca de acesso?'; sem senha desde 07/10 (ADR-0027 item 23)"
        usa:
          - req:visibility
          - req:admission.kind
          - req:admission.price.amount
          - req:admission.price.unit
          - req:reason
          - header:If-Match
      - operationId: createAdminCatalogImageIntent
        situacao: contrato
        nota: "fotos: JPG, PNG ou WebP, ate 5 MB, minimo 1600 x 900; a primeira e a capa"
        usa:
          - req:purpose
          - req:content_type
          - req:byte_size
          - enum:AdminCatalogImageIntentInput.purpose.network_event

  - tela: "4 · Rede: pedidos para participar"
    prototipo: backoffice.html
    estados: [pend, apr, rec, vazio, carregando, erro, publico]
    operacoes:
      - operationId: listAdminNetworkJoinRequests
        situacao: contrato
        nota: "abas Pendentes, Aprovados e Recusados, com a contagem de cada uma (uma chamada por aba, `total`)"
        usa:
          - query:status
          - query:event
          - resp:items[].ref
          - resp:items[].requester.display_name
          - resp:items[].requester.member_since
          - resp:items[].requester.email_verified
          - resp:items[].requested_at
          - resp:items[].status
          - resp:items[].event.title
          - resp:total
          - enum:AdminJoinRequestStatus.pending
          - enum:AdminJoinRequestStatus.approved
          - enum:AdminJoinRequestStatus.declined
      - operationId: approveAdminNetworkJoinRequest
        situacao: contrato
        nota: "Aprovar, inclusive a partir da aba Recusados"
        usa:
          - path:requestRef
      - operationId: declineAdminNetworkJoinRequest
        situacao: contrato
        nota: "Recusar, so a partir de Pendentes"
        usa:
          - path:requestRef
      - operationId: getAdminNetworkEvent
        situacao: contrato
        nota: "cabecalho: titulo, data, horario, local, bairro, status e visibilidade"
        usa:
          - resp:title
          - resp:starts_at
          - resp:ends_at
          - resp:place.place_name
          - resp:place.neighborhood
          - resp:timing
          - resp:visibility

  # ====================================================================
  # App, secao Rede (docs/prototipos/rede-encontro.html)
  # ====================================================================

  # SO EVENTO ABERTO, E A AGENDA PERDEU UMA ABA (cliente, 19/10/2026):
  # "vamos deixar apenas os eventos abertos por enquanto, no futuro analisamos
  # a necessidade de ter eventos privados tambem".
  #
  # A aba `Meus pedidos` saiu, e com ela `listMyNetworkEventJoinRequests` (que
  # desceu para `contrato_sem_tela`) e o filtro `query:visibility` -- a agenda
  # agora FIXA `visibility=public` em toda chamada, e o parametro deixou de
  # ser escolha de quem usa. Ele continua declarado e continua sendo enviado:
  # por isso `query:visibility` FICA nesta lista, com a nota.
  - tela: "Agenda: abas Proximos e Encerrados"
    prototipo: rede-encontro.html
    estados: [normal, carregando, erro, vazio, vazio_com_busca, vazio_com_filtro]
    operacoes:
      - operationId: listNetworkEvents
        situacao: pendente
        onde: "feat/secao-rede (BICHUS-251), emenda em ADR-0027 12.10 e 12.14"
        nota: "19/10/2026: `visibility` deixou de ser filtro de quem usa e passou a ser FIXO em `public` (`RecorteDaRede.queryDaAgenda`); a resposta ainda e filtrada de novo em `PaginaDaRede.doJson`, porque pedir nao e garantir"
        usa:
          - query:q
          - query:when
          - query:admission
          - query:visibility
          - query:city
          - query:size
          - query:sort
          - resp:items
          - resp:applied_filters
          - resp:effective_sort
      - operationId: listNearbyNetworkEvents
        situacao: pendente
        onde: "ADR-0027 12.14"
        usa:
          - query:max_km
          - query:sort
          - resp:items[].distance_m

  # A TELA "Pagina do encontro" SAIU DESTA MATRIZ em 19/10/2026, porque a tela
  # saiu do app: "você deve mostrar apenas a foto e o titulo do evento, sem
  # informações adicionais ou pagina de detalhes do evento". As cinco
  # operacoes dela desceram para `contrato_sem_tela`, com o registro da
  # decisao. Nenhuma foi removida do contrato.

  # ====================================================================
  # App, `Perfil` > `Meus eventos` (19/10/2026)
  # ====================================================================
  #
  # ESTA TELA EXISTE EM CODIGO E NAO EM PROTOTIPO, como a do diretorio de
  # `Perto`: ela nasceu em `app/lib/telas/perfil/meus_eventos.dart` no mesmo
  # despacho das duas operacoes novas, e nao passou por
  # `docs/prototipos/rede-encontro.html` -- por isso `prototipo: nenhum`, e nao
  # um arquivo que ninguem escreveu. O desenho foi autorizado sem Figma (decisao
  # do cliente de 23/09: sem cota, o prototipo e HTML ou e codigo).
  #
  # POR QUE ELA EXISTE: `cancelNetworkEvent` entrou no contrato em 17/10 e NAO
  # TINHA CAMINHO NENHUM -- nada na resposta da agenda diz de quem e o encontro,
  # e `NetworkEventPublic` nao pode ganhar campo de autoria (item 7 do
  # ADR-0010). O cliente escolheu o lugar em 19/10: *"uma tela com os eventos
  # que voce criou, e o cancelar mora la"*.
  #
  # `cancelNetworkEvent` SAIU DE `contrato_sem_tela` por causa desta entrada, e
  # a saida nao e redatacao: a `resolucao` dela era "tela: resolvido quando a
  # tela existir", e a tela existe. Em `telas` o portao cobra MAIS -- cada `usa`
  # tem de resolver contra o contrato --, e `contrato_sem_tela` so pedia uma
  # nota. `updateNetworkEvent` FICA la: a tela de editar e de outro despacho.

  - tela: "Perfil > Meus eventos"
    prototipo: nenhum
    estados: [lista, vazio, carregando, erro, deslogado, capa_recusada, confirmando, conflito_de_versao, saiu_da_conta]
    operacoes:
      - operationId: listMyNetworkEvents
        situacao: contrato
        usa:
          - query:page
          - query:limit
          - resp:items
          - resp:total
          - resp:items[].slug
          - resp:items[].title
          - resp:items[].starts_at
          - resp:items[].ends_at
          - resp:items[].time_zone
          - resp:items[].status
          - resp:items[].cover
          - resp:items[].cover.status
          - resp:items[].cover.url
          - resp:items[].cover.rejection_reason
          - enum:NetworkEventStatus.cancelled
          - problem:unauthenticated
      # A FONTE DO `ETag` DA SECAO. A tela a chama ao abrir a folha de
      # confirmacao, e manda o valor recebido no `If-Match` do cancelamento.
      - operationId: getMyNetworkEvent
        situacao: contrato
        usa:
          - path:eventSlug
          - resp:slug
          - resp:status
          - problem:not-found
