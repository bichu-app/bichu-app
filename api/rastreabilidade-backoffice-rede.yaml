  # A MODERACAO DAS AVALIACOES DO DIRETORIO (18/10/2026). O backend entra junto
  # da funcionalidade, e a TELA do painel nao: a sessao Backoffice e dona dela.
  #
  # A operacao nasce AGORA, e nao no despacho da tela, porque a avaliacao
  # PUBLICA NA HORA (decisao do cliente de 18/10, "como acontece na
  # playstore") e isto fala de negocio real com nome e endereco. Publicacao
  # imediata sem caminho de remocao e uma funcionalidade que nao se pode
  # desligar -- entao a remocao entra na mesma fatia, mesmo sem tela.
  #
  # ENQUANTO A TELA NAO EXISTIR, o administrador remove por `reviewRef`, que ele
  # obtem pela leitura publica da pagina do local. Funciona, e nao e uma tela.
  #
  # O QUE A TELA VAI PRECISAR, e nao existe no contrato ainda: LISTAR as
  # denuncias (a fila, com `repeat_count` e o motivo) e LISTAR as avaliacoes de
  # um local com o `reviewRef` a vista. As duas sao leitura de pessoa, entao
  # entram com `x-audit` de leitura e teto por `rows_returned` (D55/D56), como
  # `listAdminNetworkJoinRequests`. Sem elas o painel nao tem como DESCOBRIR o
  # que moderar -- so como agir sobre o que alguem ja achou.
  - operationId: removeAdminDirectoryReview
    resolucao: "tela: resolvido quando a tela existir"
    nota: "remove a avaliacao do ar com o motivo na trilha (exclusao logica: status='removed' + moderation_reason). A tela de moderacao do diretorio e da sessao Backoffice e ainda nao existe; faltam tambem as DUAS operacoes de leitura que ela exige (fila de denuncias e avaliacoes de um local com o reviewRef). Nao ha rota de restaurar: status aceita 'published' de volta, entao restaurar nao exige migracao, so a rota"
  - operationId: closeAllAdminSessions
    resolucao: "tela: resolvido quando a tela existir"
    nota: "sair de todas as sessoes administrativas nao tem botao"
  # ====================================================================
  # AS SETE OPERACOES DA REDE APOSENTADAS EM 19/10/2026
  # ====================================================================
  #
  # DUAS decisoes do cliente, no mesmo dia, e a frase de cada uma esta
  # repetida na `nota` de cada operacao de proposito -- quem abre uma linha
  # sozinha precisa ler o motivo sem subir ate aqui.
  #
  #   (1) "a pagina perto e rede tem que ser unificado e você deve mostrar
  #       apenas a foto e o titulo do evento, sem informações adicionais ou
  #       pagina de detalhes do evento e sem aparecer o telefone quando for
  #       profissionais/clinicas"
  #   (2) "vamos deixar apenas os eventos abertos por enquanto, no futuro
  #       analisamos a necessidade de ter eventos privados tambem"
  #
  # AS SETE FICAM NO CONTRATO, E AS ROTAS DO SERVIDOR FICAM DE PE. Elas nao
  # estao em `OPERACOES_AINDA_SEM_ROTA` (`src/shared/http/rotas-registradas-contra-o-contrato.test.ts`)
  # porque aquela lista e de operacao SEM ROTA, e estas sete tem rota: o que
  # falta a elas e CONSUMIDOR no app. `contrato_sem_tela` e o lugar que o
  # projeto ja tem para isso, e o portao `src/tools/portao-rastreabilidade.ts`
  # confere que cada `operationId` daqui existe no contrato.
  #
  # POR QUE FICAM, e nao saem: ele disse "no futuro analisamos", e nao
  # "nunca". Aposentada com data e com a frase dele e diferente de esquecida.
  #
  # O QUE FOI REMOVIDO foi o caminho de tela, e nada no contrato: a pagina de
  # detalhe do evento, a aba `Meus pedidos`, os filtros `Público ou privado` e
  # `Situação do pedido`, e `RecorteDaRede.queryDePedidos`.
  - operationId: getNetworkEvent
    resolucao: "tela: resolvido quando a pagina do evento voltar a existir"
    nota: "APOSENTADA 19/10/2026 sem consumidor no app. Era a leitura da pagina de detalhe do evento, removida por decisao do cliente: 'você deve mostrar apenas a foto e o titulo do evento, sem informações adicionais ou pagina de detalhes do evento'. A agenda usa `listNetworkEvents`, que traz titulo e `cover_image_url`, e o cartao nao precisa de mais nada. A rota do servidor continua de pe"
  - operationId: getNetworkEventLocation
    resolucao: "tela: resolvido quando a pagina do evento voltar a existir"
    nota: "APOSENTADA 19/10/2026 sem consumidor no app. Era o ponto do mapa estatico da pagina de detalhe (ADR-0027 12.5), e `rede/local_do_encontro.dart` foi apagado com ela. Nenhuma outra tela pede coordenada de evento"
  - operationId: getNetworkEventPrivateDetails
    resolucao: "tela: resolvido quando o evento privado voltar"
    nota: "APOSENTADA 19/10/2026 sem consumidor no app. Decisao do cliente: 'vamos deixar apenas os eventos abertos por enquanto, no futuro analisamos a necessidade de ter eventos privados tambem'. Era o conteudo oculto que o pedido aprovado liberava, na pagina de detalhe"
  - operationId: requestToJoinNetworkEvent
    resolucao: "tela: resolvido quando o evento privado voltar"
    nota: "APOSENTADA 19/10/2026 sem consumidor no app. 'vamos deixar apenas os eventos abertos por enquanto'. Era `Pedir para participar`, na pagina de detalhe do evento privado; a guarda de acao que mandava o pedido depois do login (`pedido_de_participacao_como_intencao.dart`) foi apagada junto"
  - operationId: getMyNetworkEventJoinRequest
    resolucao: "tela: resolvido quando o evento privado voltar"
    nota: "APOSENTADA 19/10/2026 sem consumidor no app. 'vamos deixar apenas os eventos abertos por enquanto'. Era a leitura que decidia o estado da caixa do privado (nenhum, enviado, aprovado) na pagina de detalhe"
  - operationId: withdrawNetworkEventJoinRequest
    resolucao: "tela: resolvido quando o evento privado voltar"
    nota: "APOSENTADA 19/10/2026 sem consumidor no app. 'vamos deixar apenas os eventos abertos por enquanto'. Era `Desistir do pedido` (ADR-0027 12.11), e esta linha existia aqui desde BICHUS-251 com `situacao: pendente` e a nota 'o app ganha o gesto de desistir do pedido, com texto a aprovar pela UX' -- o gesto chegou em 19/10 e saiu no MESMO dia, com a pagina que o hospedava. `situacao: pendente` saiu daqui porque a operacao existe no contrato desta branch"
  - operationId: listMyNetworkEventJoinRequests
    resolucao: "tela: resolvido quando o evento privado voltar"
    nota: "APOSENTADA 19/10/2026 sem consumidor no app. 'vamos deixar apenas os eventos abertos por enquanto, no futuro analisamos a necessidade de ter eventos privados tambem'. Era a aba `Meus pedidos` da agenda da Rede, com os filtros `q`, `state` e `sort`. A aba existia porque havia pedido de participacao; o pedido nascia na pagina de detalhe, a pagina saiu em 19/10 e a aba ficou sem origem. Esta decisao e o veredito sobre isso: nao volta por ora. Nenhum caminho do app le esta operacao -- `RecorteDaRede.queryDePedidos` e `RedeApi.meusPedidos` nao tem chamador (o metodo fica, aposentado com registro no cabecalho de `app/lib/api/rede_api.dart`)"
  # ADR-0025 emenda 3 (17/10/2026): o backend do encontro criado pela
  # comunidade. Ele PUBLICA DIRETO -- nao ha fila de moderacao, e por isso nao
  # ha operacao de painel aqui. As telas do app sao do despacho seguinte, e por
  # isso as quatro operacoes entram aqui e nao em `telas`.
  - operationId: createNetworkEvent
    resolucao: "tela: resolvido quando a tela existir"
    nota: "a tela de criar encontro no app (com capa) e o despacho seguinte; o backend nasce antes de proposito, para a tela nao nascer contra um contrato inventado"
  - operationId: updateNetworkEvent
    resolucao: "tela: resolvido quando a tela existir"
    nota: "quem criou administra o proprio encontro (decisao do cliente de 17/10); a tela de editar e do mesmo despacho da de criar"
  # `cancelNetworkEvent` SAIU DAQUI EM 19/10/2026, e nao foi redatada: a
  # `resolucao` dela era "tela: resolvido quando a tela existir", e a TELA
  # EXISTE -- `app/lib/telas/perfil/meus_eventos.dart`, construida junto das
  # duas operacoes de leitura do dono. O motivo dela CADUCOU pelo unico desfecho
  # que ela mesma previa. Ela passou para `telas`, na entrada
