    operacoes:
      - operationId: getNetworkEvent
        situacao: pendente
        onde: "feat/secao-rede (BICHUS-251), ADR-0027 12.10"
        usa:
          - resp:title
          - resp:local_date
          - resp:visibility
          - resp:status
      - operationId: getNetworkEventLocation
        situacao: pendente
        onde: "ADR-0027 12.5"
        usa:
          - resp:point
      - operationId: getNetworkEventPrivateDetails
        situacao: pendente
        onde: "ADR-0027 12.11"
        usa:
          - resp:place
          - resp:summary
          - resp:images
          - resp:admission
          - resp:accepted_sizes
          - resp:dog_age
          - resp:vaccination_required
          - resp:fenced_off_leash_area
          - resp:amenities
          - resp:bring_items
          - resp:notes
      - operationId: requestToJoinNetworkEvent
        situacao: pendente
        onde: "ADR-0027 12.11"
        usa:
          - resp:state
      - operationId: getMyNetworkEventJoinRequest
        situacao: pendente
        onde: "ADR-0027 12.11"
        usa:
          - resp:state

# ======================================================================
# Correspondencias codigo -> rotulo. Os rotulos ficam no cliente; o que o
# portao cobra e que a correspondencia seja 1 para 1 e que todo codigo exista.
# ======================================================================

correspondencias:
  StoreCategory:
    fonte_do_rotulo: app/lib/api/modelos_loja.dart
    um_para_um: true
    valores:
      food: Alimentação
      toy: Brinquedo
      hygiene: Higiene
      accessory: Acessório
      health: Saúde
      bed: Cama e conforto
    nota: "conferido em 23/09: seis codigos, seis rotulos, nenhum sobrando. O backoffice (CATS/CAT_CODE) usa os mesmos seis."
  Species:
    um_para_um: true
    valores: { dog: Cão, cat: Gato, other: Outros animais }
  PetSize:
    um_para_um: true
    valores: { P: Pequeno, M: Médio, G: Grande, GG: Gigante }
  NetworkEventDogAge:
    um_para_um: true
    valores: { any: Qualquer idade, from_4_months: A partir de 4 meses, from_1_year: A partir de 1 ano, up_to_1_year: Até 1 ano }
  EventPriceUnit:
    um_para_um: true
    valores: { per_dog: por cão, per_person: por pessoa, per_pair: por dupla }
  NetworkEventBringItem:
    um_para_um: true
    valores: { water: Água, water_bowl: Pote de água, leash: Guia, poop_bags: Saquinho, treats: Petisco, towel: Toalha, vaccination_card: Carteira de vacinação, toy: Brinquedo }
  NetworkEventAmenity:
    um_para_um: true
    valores: { level_ground_or_ramp: Piso plano ou rampa, accessible_restroom: Banheiro acessível, public_restroom_nearby: Banheiro público próximo, shade: Sombra, benches: Bancos, dog_water_fountain: Bebedouro para cães, parking_nearby: Estacionamento próximo }
  JoinRequestAppState:
    um_para_um: false
    valores: { requested: Pedido enviado, approved: Pedido aprovado }
    nota: "nao ha `declined` no app, de proposito (ADR-0027 12.11). `withdrawn` e `expired` nao tem rotulo no app desde a §24.17.5/6 de 06-design-system.md (28/09): o pedido desistido e o do encontro que passou saem da tela, e nao ganham selo"

# ======================================================================
# O que a tela usa e NAO existe no contrato. `resolucao` diz quem muda.
#   tela      o prototipo muda para caber no contrato
#   contrato  o contrato mudou (ou muda) para caber na tela
#   decidir   precisa de decisao antes de alguem mudar
# ======================================================================

tela_sem_contrato:
  - id: BO-1
    tela: "Casca e navegacao"
    o_que: "e-mail do administrador no rodape da navegacao"
    resolucao: tela
    motivo: "AdminSession nao tem e-mail, e openAdminSession e alcancavel sem conta: o portao de contrato publico reprova `email` ali. A navegacao mostra so o nome de exibicao."
  - id: BO-2
    tela: "3 · Loja: lista"
    o_que: "item de menu Excluir produto, com senha"
    resolucao: tela
    motivo: "nao ha exclusao de item (ADR-0027 item 14); o gesto e retirar (retireAdminStoreItem), reversivel"
  - id: BO-3
    tela: "3 · Loja: lista e formulario"
    o_que: "Despublicar sem senha, e o texto 'volta a ser rascunho'"
    resolucao: tela
