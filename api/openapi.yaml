  # ---------------------------- Rede ------------------------------------

  /admin/network/events:
    get:
      operationId: listAdminNetworkEvents
      tags: [admin]
      x-effects: []
      summary: Encontros da Rede, em todos os estados
      description: |
        A lista do painel, com o estado temporal calculado no servidor.
        **Removido nao aparece por padrao**: removido some da lista (a UX o
        trata como apagado para quem opera), e so volta quando pedido pelo
        filtro fechado `publication_status=removed`, que devolve so os
        removidos. Sem filtro vem publicado e cancelado.
      security:
        - adminSession: []
      x-admin-roles: [admin]
      parameters:
        - name: q
          in: query
          description: Busca em titulo, resumo e nome do lugar, no servidor.
          schema: { type: string, minLength: 2, maxLength: 80 }
        - name: publication_status
          in: query
          description: 'Sem ele, `published` e `cancelled`. `removed` so aparece quando pedido aqui.'
          schema: { $ref: '#/components/schemas/AdminNetworkEventPublicationStatus' }
        - name: timing
          in: query
          schema: { $ref: '#/components/schemas/AdminNetworkEventTiming' }
        - name: visibility
          in: query
          description: |
            Sem ele, **publico e privado**: o painel ve todo encontro. O esquema
            e inline, e nao `NetworkEventVisibility`, de proposito: aquele tem
            `default: public` (o padrao de quem CRIA), e num filtro esse
            default vira "so publicos" para o cliente gerado do contrato, que
            tirava o encontro privado da lista do painel (QA, 28/09).
          schema: { type: string, enum: [public, private] }
        - name: city
          in: query
          schema: { type: string, minLength: 2, maxLength: 60 }
        - name: sort
          in: query
          description: '`agenda` e por inicio, do mais proximo; `atualizado` poe o que mudou por ultimo primeiro.'
          schema: { type: string, enum: [agenda, atualizado], default: agenda }
        - $ref: '#/components/parameters/AdminPage'
        - $ref: '#/components/parameters/AdminLimit'
      responses:
        '200':
          description: Pagina de encontros.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminNetworkEventPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
    post:
      operationId: createAdminNetworkEvent
      tags: [admin]
      x-effects: [notifies]
      summary: Cria e publica um encontro
      description: |
        **Criar e publicar** (ADR-0027 12.9): o encontro nao tem rascunho, e
        nasce `published`, com `origin: admin`. Por isso esta operacao conta no
        teto de publicacoes e **avisa todos os administradores** por e-mail com
        o que foi criado (D52).

        O lugar sao tres rotulos obrigatorios e um ponto **opcional**, marcado
        no mapa (`geo_source = map_pin`, ADR-0006). O local e **logradouro
        publico, nunca residencia**, e o formulario diz isso (ADR-0027 item
        13). O ponto sai para o tutor autenticado em
        `getNetworkEventLocation` (ADR-0010 emenda 1).

        Recusas de regra, todas `400 validation-failed` com o campo: fim antes
        do inicio; encontro que ja terminou (`code: event_in_past`); fuso que
        nao existe; ponto fora dos limites do Brasil; encontro pago sem valor
        (`code: admission_incomplete`); imagem sem texto alternativo.
        **Nao ha limite de vagas** (decisao do cliente).

        `visibility: private` faz o encontro aparecer no app **so com titulo
        e data** ate a conta ter o pedido aprovado na fila
        (`listAdminNetworkJoinRequests`). **O Bichu nao cobra**: o valor e so
        informativo, numero mais unidade fechada (ADR-0027 item 17).
      security:
        - adminSession: []
          adminCsrf: []
      x-admin-roles: [admin]
      x-audit: { action: admin.network_event.created, resource_kind: network_event }
      x-rate-limit:
        - dimension: [account]
          limit: 30
          window: 1h
          on_exceed: deny_429
          note: "balde compartilhado admin_publication (D52): publicacao de item e criacao de evento"
        - dimension: [account]
          limit: 120
          window: 10m
          on_exceed: deny_429
          note: "balde compartilhado admin_write (D52)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminNetworkEventInput' }
            examples:
              encontro:
                $ref: '#/components/examples/AdminNetworkEventInputPraca'
      responses:
        '201':
          description: Encontro criado e publicado.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminNetworkEvent' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '409': { $ref: '#/components/responses/SlugTaken' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/network/events/{eventSlug}:
    parameters:
      - $ref: '#/components/parameters/EventSlug'
    get:
      operationId: getAdminNetworkEvent
      tags: [admin]
      x-effects: []
      summary: Um encontro, em qualquer estado
      description: O encontro com o ponto do mapa, quando houver, e sem autor.
      security:
        - adminSession: []
      x-admin-roles: [admin]
      responses:
        '200':
          description: O encontro.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminNetworkEvent' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateAdminNetworkEvent
      tags: [admin]
      x-effects: [notifies]
      summary: Altera titulo, resumo, capa ou endereco publico de um encontro
      description: |
        **Data, horario, fuso e lugar nao mudam aqui**, porque todo encontro
        esta publicado desde a criacao: mudar onde e quando as pessoas levam
        os caes e `relocateAdminNetworkEvent`, com aviso a todos os
        administradores. **Visibilidade e condicao de acesso
        tambem nao**: sao `changeAdminNetworkEventAccess`, pelo mesmo motivo.
        O corpo nao tem esses campos. Encontro `removed` responde `400`
        (`code: event_removed`).

        **Mudar `notes` avisa todos os administradores** com o antes e o
        depois (D60), sem reautenticacao: o detector de D59 ja tira o valor do
        golpe, e o aviso cobre o resto. **Encontro privado nao troca de
        `slug`** (`400`, `code: private_slug_is_generated`).
      security:
        - adminSession: []
          adminCsrf: []
      x-admin-roles: [admin]
      x-audit: { action: admin.network_event.updated, resource_kind: network_event }
      x-rate-limit:
        - dimension: [account]
          limit: 120
          window: 10m
          on_exceed: deny_429
          note: "balde compartilhado admin_write (D52)"
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminNetworkEventPatch' }
      responses:
        '200':
          description: Encontro alterado.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminNetworkEvent' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SlugTaken' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      operationId: removeAdminNetworkEvent
      tags: [admin]
      x-effects: [irreversible_write]
      summary: Remove um encontro, sem volta
      description: |
        Estado terminal `removed`: some do app e do painel de leitura publica,
        a linha continua no banco para a trilha. Sem reautenticacao desde 07/10/2026 (decisao do cliente, ADR-0027 item 23): basta a sessao com CSRF e o `If-Match`. Para
        desmarcar um encontro que as pessoas precisam saber que nao vai
        acontecer, a operacao certa e `cancelAdminNetworkEvent`.
      security:
        - adminSession: []
          adminCsrf: []
      x-admin-roles: [admin]
      x-audit: { action: admin.network_event.removed, resource_kind: network_event }
      x-rate-limit:
        - dimension: [account]
          limit: 120
          window: 10m
          on_exceed: deny_429
          note: "balde compartilhado admin_write (D52)"
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204': { description: Encontro removido. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/network/events/{eventSlug}/relocation:
    parameters:
      - $ref: '#/components/parameters/EventSlug'
    post:
      operationId: relocateAdminNetworkEvent
      tags: [admin]
      x-effects: [notifies]
      summary: Muda data, horario ou lugar de um encontro publicado
      description: |
        E a operacao que um invasor com a sessao usaria para reunir caes num
        lugar e horario escolhidos por ele (T11). Ficam duas travas: aviso por
        e-mail a **todos** os administradores com o antes e o depois (D52), e
        linha na trilha (sem a coordenada bruta: a trilha grava
        `point_changed`). Sem reautenticacao desde 07/10/2026 (decisao do cliente, ADR-0027 item 23): basta a sessao com CSRF e o `If-Match`. O risco de uma sessao
        sequestrada mover o encontro sem senha foi aceito pelo cliente.

        **Compatibilidade (01/10/2026):** o painel deixou de usar o mapa, e o
        `place.point` desta rota fica so por compatibilidade. A rota continua
        sendo o UNICO caminho para mudar o lugar de um encontro existente,
        inclusive o `street_address`: mudar onde e T11, e o aviso e a trilha
        valem para o endereco como valem para o ponto.

        Pelo menos um de `place`, `street_address`, `starts_at`, `ends_at` e
        `time_zone`. O `reason` e obrigatorio e vai no aviso. Encontro cancelado ou removido
        responde `400` (`code: event_not_published`).
      security:
        - adminSession: []
          adminCsrf: []
      x-admin-roles: [admin]
      x-audit: { action: admin.network_event.relocated, resource_kind: network_event }
      x-rate-limit:
        - dimension: [account]
          limit: 120
          window: 10m
          on_exceed: deny_429
          note: "balde compartilhado admin_write (D52)"
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminNetworkEventRelocation' }
            examples:
              chuva:
                value:
                  starts_at: '2026-10-11T12:00:00Z'
                  ends_at: '2026-10-11T14:00:00Z'
                  reason: Previsao de chuva no sabado; o encontro passa para domingo.
      responses:
        '200':
          description: Encontro movido.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminNetworkEvent' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/network/events/{eventSlug}/cancellation:
