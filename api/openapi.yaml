          window: 1h
          on_exceed: serve_cache
      summary: A conversa do achador, resolvida pelo token
      security:
        - finderToken: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Conversa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '410':
          description: |
            Caso encerrado. A resposta traz o desfecho, porque quem ajudou
            merece saber que deu certo.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /finder/conversation/messages:
    post:
      operationId: postFinderMessage
      tags: [conversations]
      x-effects: [notifies, human_work]
      summary: Envia mensagem no canal mediado, sem conta
      security:
        - finderToken: []
      x-rate-limit:
        - dimension: [finder_token]
          limit: 30
          window: 1h
          on_exceed: deny_429
        - dimension: [finder_token]
          limit: 200
          window: 24h
          on_exceed: hold_for_review
          note: "o token tem escopo de uma conversa so, entao nao ha dimensao de casos distintos deste lado"
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '201':
          description: Mensagem enviada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '410':
          description: Conversa encerrada ou bloqueada.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /finder/conversation/block:
    post:
      operationId: blockFinderConversation
      tags: [conversations]
      x-effects: []
      x-rate-limit:
        - dimension: [finder_token]
          limit: 10
          window: 24h
          on_exceed: accept_and_deduplicate
      summary: Bloqueia a outra parte
      security:
        - finderToken: []
      responses:
        '204': { description: Bloqueada. }
        '403': { $ref: '#/components/responses/Forbidden' }

  /finder/conversation/report:
    post:
      operationId: reportFinderConversation
      tags: [conversations]
      x-effects: [human_work]
      x-rate-limit:
        - dimension: [finder_token]
          limit: 3
          window: 24h
          on_exceed: accept_and_deduplicate
          note: "mesma razao do lado autenticado: a tela confirma normal, e acima do teto a denuncia e anexada ao item de fila ja aberto"
        - dimension: [report_target]
          counts: distinct_reporters
          limit: 3
          window: 24h
          on_exceed: raise_queue_priority
      summary: Denuncia abuso
      security:
        - finderToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [extortion, harassment, spam, impersonation, other]
                detail: { type: string, maxLength: 1000 }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ----------------------------------------------------------------------
  # Casos de perdido
  # ----------------------------------------------------------------------

  /pets/{petId}/lost-case-preview:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      operationId: previewLostCaseReach
      tags: [lost]
      x-effects: [expensive_query]
      x-rate-limit:
        - dimension: [account]
          limit: 30
          window: 1h
          on_exceed: deny_429
          note: "roda a consulta geoespacial de 5 km: leitura autenticada, mas nao barata"
        - dimension: [pet]
          limit: 10
          window: 1h
          on_exceed: serve_cache
      summary: Quantos tutores o alerta alcanca (F3.2)
      description: |
        Calcula o alcance **antes** de abrir o caso. A resposta distingue
        explicitamente "zero tutores" de "nao foi possivel calcular": a tela
        nunca pode mostrar zero quando o que houve foi falha.

        Devolve tambem os bloqueios que impedem a abertura, para que a folha de
        bloqueio tenha o texto certo sem uma segunda chamada.
      parameters:
        - name: lat
          in: query
          required: false
          schema: { type: number, format: double, minimum: -34, maximum: 6 }
          description: Ultima posicao conhecida do pet. Ausente, usa a do tutor.
        - name: lon
          in: query
          required: false
          schema: { type: number, format: double, minimum: -74, maximum: -32 }
      responses:
        '200':
          description: Previa do alcance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LostCaseReachPreview' }
              examples:
                baseVazia:
                  summary: Variante A — nenhum tutor por perto
                  value:
                    reach_status: computed
                    reachable_tutors: 0
                    radius_m: 5000
                    area_label: Vila Madalena
                    blockers: []
                naoCalculou:
                  summary: Variante D — nao foi possivel calcular
                  value:
                    reach_status: unavailable
                    reachable_tutors: null
                    radius_m: 5000
                    area_label: null
                    blockers: []
                bloqueado:
                  summary: Contato nao verificado
                  value:
                    reach_status: computed
                    reachable_tutors: 46
                    radius_m: 5000
                    area_label: Vila Madalena
                    blockers: [contact_channel_unverified]
        '403': { $ref: '#/components/responses/Forbidden' }

  /pets/{petId}/lost-cases:
    parameters:
      - $ref: '#/components/parameters/PetId'
    post:
      operationId: openLostCase
      tags: [lost]
      x-effects: [notifies, expensive_query, human_work]
      x-rate-limit:
        - dimension: [account]
          limit: 5
          window: 24h
          on_exceed: accept_and_defer_dispatch
          note: "O CASO SEMPRE ABRE. O que e retido acima do teto e o disparo do alerta, nunca a criacao: portao aberto com tres caes na casa e um evento, nao abuso, e recusar o terceiro caso seria o produto falhando exatamente no dia em que existe para funcionar"
        - dimension: [account]
          limit: 20
          window: 24h
          on_exceed: hold_for_review
          note: "acima disso a conta vai para revisao, e o caso continua aberto"
      summary: Marca o pet como perdido e dispara o alerta
      description: |
        Dois bloqueios, e so dois: **canal de contato verificado** e **pet com
        foto pronta**. Ambos respondem 409 com `type` proprio, porque a folha
        de bloqueio tem texto diferente para cada um.

        Abrir o caso com alcance zero e permitido e desejado: o caso continua
        util pela tag e pela lista de perdidos.

        **Limite de chamadas nunca impede abrir um caso.** Acima do teto o caso
        e criado normalmente e o **disparo do alerta** e que fica retido, com
        `alert.reach_status: queued`; a tela diz que o aviso aos vizinhos esta
        em analise, e nao que o caso falhou.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LostCaseInput' }
      responses:
        '201':
          description: Caso aberto e alerta enfileirado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LostCase' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/LostCaseBlocked' }

  /lost-cases/{caseId}:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      operationId: getLostCase
      tags: [lost]
      x-effects: []
      summary: Detalhe do caso
      responses:
        '200':
          description: Caso.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LostCase' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateLostCase
      tags: [lost]
      x-effects: []
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
      summary: Atualiza onde e quando o pet foi visto pela ultima vez
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LostCaseInput' }
      responses:
        '200':
          description: Caso atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LostCase' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /lost-cases/{caseId}/alerts:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      operationId: resendLostCaseAlert
      tags: [lost]
      x-effects: [notifies, expensive_query]
      x-rate-limit:
        - dimension: [case]
          limit: 1
          window: 24h
          on_exceed: deny_429
          note: "ja declarado na descricao; aqui fica verificavel"
      summary: Reenvia o alerta
      description: No maximo um reenvio a cada 24 h por caso.
      responses:
        '202':
          description: Alerta enfileirado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertDispatch' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /lost-cases/{caseId}/candidates:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      operationId: listLostCaseCandidates
      tags: [lost]
      x-effects: []
      x-rate-limit:
        - dimension: [account]
          limit: 120
          window: 1h
          on_exceed: deny_429
      summary: Possiveis correspondencias
      description: |
        **Leitura de linhas ja calculadas**, e por isso `x-effects: []`. O
        cruzamento **nao roda aqui**: ele e um job na fila, disparado quando um
        achado e criado e quando um caso e aberto, e grava em `match_candidates`
        (regra completa na secao 4.10 de `docs/03-arquitetura.md`). Esta
        operacao le e ordena o que ja esta gravado.

        A observacao estava certa e a ambiguidade era real: `score`,
        `matched_attributes` e `distance_m` tem a forma de resultado computado, e
        nada na spec dizia quem computa. Se algum dia esta operacao passar a
        calcular na requisicao, ela vira `expensive_query` e ganha teto — mas
        entao a mudanca e de desenho, e o marcador acompanha em vez de encobrir.

        Lista vazia e um estado legitimo e frequente, distinto de erro. **Nada e
        confirmado sem decisao humana do tutor.**
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Candidatos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidatePage' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /lost-cases/{caseId}/candidates/{candidateId}/decision:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/CandidateId'
    post:
      operationId: decideLostCaseCandidate
      tags: [lost]
      x-effects: [notifies]
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
      summary: Confirma ou descarta uma correspondencia
      description: Confirmar abre a conversa mediada com quem registrou o achado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [confirmed, rejected] }
      responses:
        '200':
          description: Decisao registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchCandidate' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /lost-cases/{caseId}/close:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      operationId: closeLostCase
      tags: [lost]
      x-effects: [notifies]
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
      summary: Encerra o caso com desfecho declarado
      description: |
        O desfecho e o instrumento de medicao do produto: sem ele a metrica de
        reencontro nao existe. Encerrar e reversivel por **7 dias**.

        Ao encerrar, toda conversa aberta recebe a mensagem de sistema que avisa
        quem ajudou.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LostCaseClosure' }
      responses:
        '200':
          description: Caso encerrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LostCase' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /lost-cases/{caseId}/reopen:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      operationId: reopenLostCase
      tags: [lost]
      x-effects: [notifies]
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
      summary: Reabre um caso encerrado por engano
      description: Permitido ate 7 dias apos o encerramento.
      responses:
        '200':
          description: Caso reaberto.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LostCase' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '410':
          description: Passou dos 7 dias.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /lost-cases/{caseId}/snooze:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      operationId: snoozeLostCaseReminder
      tags: [lost]
      x-effects: []
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
      summary: Adia o lembrete de desfecho por 48 h ("ainda estou procurando")
      description: Nao e desfecho e nao conta como caso encerrado.
      responses:
        '204': { description: Lembrete adiado. }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ----------------------------------------------------------------------
  # Conversa mediada
  # ----------------------------------------------------------------------

  /conversations:
    get:
      operationId: listConversations
      tags: [conversations]
