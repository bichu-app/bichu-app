      operationId: getPet
      security:
        - bearerAuth: []
      tags: [pets]
      x-effects: []
      summary: Detalhe do pet (visao do dono)
      responses:
        '200':
          description: Pet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updatePet
      security:
        - bearerAuth: []
      tags: [pets]
      x-effects: []
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
      summary: Edita o pet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PetInput' }
      responses:
        '200':
          description: Pet atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deletePet
      security:
        - bearerAuth: []
      tags: [pets]
      x-effects: [irreversible_write]
      x-rate-limit:
        - dimension: [account]
          limit: 10
          window: 24h
          on_exceed: deny_429
      summary: Exclui o pet
      description: |
        Exclusao logica. Revoga todas as tags do pet e encerra caso aberto. A
        rota publica do codigo passa a responder "tag desativada", nunca 404 —
        a diferenca importa para quem esta com o animal na mao.
      responses:
        '204': { description: Excluido. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /pets/{petId}/photos:
    parameters:
      - $ref: '#/components/parameters/PetId'
    post:
      operationId: confirmPetPhoto
      security:
        - bearerAuth: []
      tags: [pets]
      x-effects: [irreversible_write]
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
      summary: Confirma o upload de uma foto ja enviada ao armazenamento
      description: |
        Chamada depois que o cliente enviou os bytes direto ao armazenamento de
        objeto com as credenciais de `photo-upload-intent`. **E esta chamada que
        enfileira o processamento**: o produto nao depende de notificacao de
        bucket, que e recurso que varia de provedor. Upload nunca confirmado e
        varrido pela expiracao da intencao.

        O backend valida os bytes reais, remove todo o EXIF (inclusive GPS) e
        gera as derivadas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [upload_id]
              properties:
                upload_id: { type: string, format: uuid }
                set_as_primary: { type: boolean, default: true }
      responses:
        '202':
          description: |
            Aceita para processamento. A foto nasce com
            `status: processing` e so serve a rota publica quando vira `ready`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PetPhoto' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/UploadNotReceived' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }

  # ----------------------------------------------------------------------
  # Midia: o unico prefixo que existe para ser extraido (ADR-0016)
  # ----------------------------------------------------------------------
  #
  # As tres operacoes abaixo sao midia PURA: emitir credencial de upload
  # assinada, e nada alem disso. Elas moram sob `/v1/media/` para que a borda
  # possa rotea-las por prefixo no dia em que o modulo for extraido — trocar um
  # upstream numa linha do Caddyfile, sem versao nova do app.
  #
  # O que NAO esta aqui, de proposito: `POST /v1/pets/{petId}/photos` e
  # `DELETE /v1/pets/{petId}/photos/{photoId}`. Elas sao a lista de fotos de um
  # pet, que e trabalho do dominio `pets`, e nao saem com o servico de midia.
  # Quem ler "media e a primeira fronteira extraivel" e imaginar que todo o
  # assunto foto sai daqui vai se surpreender, entao esta escrito.
  #
  # O id do alvo esta no CORPO e nao no caminho. Nao e estilo: e o que permite
  # o prefixo unico. A autorizacao (esta conta e dona deste pet?) acontece no
  # servico, exatamente como aconteceria com o id no caminho.

  /media/pet-photo-intents:
    post:
      operationId: createPetPhotoUploadIntent
      security:
        - bearerAuth: []
      tags: [pets]
      x-effects: [irreversible_write]
      summary: Pede as credenciais de upload direto para o armazenamento
      description: |
        O backend nunca recebe os bytes da imagem: ele assina a requisicao de
        upload para o armazenamento privado, com tipo e tamanho limitados.

        `method` diz a forma: `POST` com `fields` (politica de formulario, que
        e o caminho de hoje em MinIO e S3) ou `PUT` com `headers` assinados,
        para o provedor que nao suportar politica de POST. O cliente **le o
        campo** em vez de presumir a forma.
      x-rate-limit:
        - dimension: [account]
          limit: 20
          window: 1h
          on_exceed: deny_429
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/UploadIntentInput'
