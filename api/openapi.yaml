      summary: Minhas conversas
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Conversas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /conversations/{conversationId}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      operationId: getConversation
      tags: [conversations]
      x-effects: []
      summary: Conversa e mensagens
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Conversa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /conversations/{conversationId}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      operationId: postConversationMessage
      tags: [conversations]
      x-effects: [notifies, human_work]
      summary: Envia mensagem no canal mediado
      description: |
        O servidor inspeciona o texto em busca de telefone, e-mail e endereco e
        **redige** o trecho antes de entregar, devolvendo `redactions` para que
        a interface explique o que foi retirado e por que. Contato direto e
        exatamente o que o canal mediado existe para evitar: e por ali que o
        golpe do falso achador opera.
      security:
        - bearerAuth: []
      x-rate-limit:
        - dimension: [conversation_participant]
          limit: 30
          window: 1h
          on_exceed: deny_429
        - dimension: [conversation_participant]
          limit: 200
          window: 24h
          on_exceed: hold_for_review
          note: "acima de 200 a conversa inteira e retida para revisao"
        - dimension: [account]
          counts: distinct_cases
          limit: 3
          window: 24h
          on_exceed: hold_for_review
          note: "falso achador em serie: uma conta que aborda tutores de casos diferentes e o padrao nomeado no modelo de ameaca. Retem SEM notificar os tutores, porque notificar e ajudar o golpe a chegar"
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '201':
          description: Mensagem enviada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '410':
          description: Conversa encerrada ou bloqueada.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /conversations/{conversationId}/block:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      operationId: blockConversation
      tags: [conversations]
      x-effects: []
      x-rate-limit:
        - dimension: [account]
          limit: 20
          window: 24h
          on_exceed: accept_and_deduplicate
          note: "bloquear e idempotente e e a outra acao que a pessoa executa com medo. Recusar nao protege nada e responde com limite de chamadas a quem esta se protegendo"
      summary: Bloqueia a outra parte
      security:
        - bearerAuth: []
      responses:
        '204': { description: Bloqueada. }
        '403': { $ref: '#/components/responses/Forbidden' }

  /conversations/{conversationId}/report:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      operationId: reportConversation
      tags: [conversations]
      x-effects: [human_work]
      x-rate-limit:
        - dimension: [account]
          limit: 3
          window: 24h
          on_exceed: accept_and_deduplicate
          note: "a denuncia carrega a conversa inteira, entao a quarta nao acrescenta prova. Mas RECUSAR e inaceitavel: quem toca em Denunciar a cada mensagem esta com medo, e responder com texto sobre limite de chamadas a quem pede ajuda e o pior erro possivel desta tela"
        - dimension: [report_target]
          counts: distinct_reporters
          limit: 3
          window: 24h
          on_exceed: raise_queue_priority
          note: "e esta a dimensao que pega denuncia em laco de verdade, que e o ataque do concorrente: muitos denunciantes contra o mesmo alvo. Eleva prioridade na fila e NUNCA age sobre o alvo"
      summary: Denuncia abuso
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [extortion, harassment, spam, impersonation, other]
                detail: { type: string, maxLength: 1000 }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ----------------------------------------------------------------------
  # Superficie publica
  # ----------------------------------------------------------------------

  /public/lost-pets:
    get:
      operationId: listPublicLostPets
      tags: [public]
      x-effects: [expensive_query]
      summary: Pets perdidos da regiao
      description: |
        **Publica e deslogada.** Devolve foto, especie, raca, porte, cor, data e
        **bairro**. Nunca devolve coordenada, nem aproximada, nem arredondada,
        em nenhum filtro e em nenhum zoom: um ponto por caso permite montar o
        mapa que a regra de privacidade existe para impedir.

        Por isso o filtro geografico e por **cidade e bairro digitados**, e nao
        por latitude e longitude. Paginacao numerada com total, porque a tela
        precisa dizer "1 a 20 de 87" e permitir chegar ao fim da lista.
      security: []
      x-rate-limit:
        - dimension: [ip]
          limit: 120
          window: 1h
          on_exceed: challenge
        - dimension: [ip]
          limit: 600
          window: 24h
          on_exceed: challenge
        - dimension: [ip, q]
          limit: 30
          window: 1h
          on_exceed: challenge
          note: "busca por texto tem teto proprio"
      parameters:
        - name: city
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 80 }
        - name: neighborhood
          in: query
          schema: { type: string, maxLength: 80 }
        - name: species
          in: query
          schema: { $ref: '#/components/schemas/Species' }
        - name: size
          in: query
          schema: { $ref: '#/components/schemas/PetSize' }
        - name: period
          in: query
          description: Janela desde a abertura do caso.
          schema: { type: string, enum: [24h, 7d, 30d], default: 30d }
        - name: q
          in: query
          description: |
            Busca parcial por **nome do pet**, tolerante a acento e a caixa.
            Nao busca por codigo de tag: quando o texto digitado tiver a forma
            de um codigo, o cliente chama `GET /v1/tags/{code}`, que leva direto
            ao pet. Aceitar codigo aqui transformaria a listagem publica num
            oraculo de existencia de codigo, com limite de listagem em vez do
            limite estrito da rota da tag.
          schema: { type: string, maxLength: 60 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      responses:
        '200':
          description: |
            Pagina de perdidos. `total` alimenta "Mostrando 1 a 20 de 87" e
            `applied_filters` alimenta a linha que explica o recorte.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicLostPetPage' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /public/pets/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Slug' }
    get:
      operationId: getPublicPetBySlug
      tags: [public]
      x-effects: []
      summary: Perfil publico do pet por endereco (@slug)
      description: |
        Responde 404 quando o tutor nao ligou o perfil publico. Slug trocado
        responde 301 para o atual, para nao quebrar link ja compartilhado.
      security: []
      x-rate-limit:
        - dimension: [ip]
          limit: 60
          window: 1h
          on_exceed: challenge
      responses:
        '200':
          description: Perfil publico.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicPetProfile' }
        '301': { description: Slug trocado. `Location` aponta para o atual. }
        '404': { $ref: '#/components/responses/NotFound' }

  /public/lost-cases/{shareToken}:
    parameters:
      - $ref: '#/components/parameters/ShareToken'
    get:
      operationId: getPublicLostCase
      tags: [public]
      x-effects: []
      summary: Visao publica de um caso, pelo token compartilhavel
      description: |
        **E o destino do toque no push do alerta.** O vizinho que recebeu o
        aviso e autenticado, mas nao e dono do caso: `GET /v1/lost-cases/{id}`
        responde 404 para ele, de proposito. Esta e a operacao que ele abre.

        Devolve a mesma projecao publica da listagem: foto, sinais, **bairro** e
        data. Nunca contato, endereco, ponto exato nem UUID interno.
      security:
        - bearerAuth: []
        - []
      x-rate-limit:
        - dimension: [ip]
          limit: 120
          window: 1h
          on_exceed: challenge
      responses:
        '200':
          description: Caso.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicLostCase' }
        '410':
          description: Caso encerrado.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /public/reference-data:
    get:
      operationId: getReferenceData
      tags: [public]
      x-effects: []
      x-rate-limit:
        - dimension: [ip]
          limit: 60
          window: 1h
          on_exceed: serve_cache
          note: "cacheavel por 24h; o limite quase nunca e alcancado por cliente legitimo"
      summary: Especies, racas, portes e cores
      description: |
        Lista fechada, versionada e cacheavel por 24 h. Existe para que o
        cruzamento por atributos nao dependa de texto livre: raca digitada a
        mao produz falso negativo justamente no caso que importa.
      security: []
      responses:
        '200':
          description: Dados de referencia.
          headers:
            Cache-Control: { schema: { type: string }, example: 'public, max-age=86400' }
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceData' }

  # ----------------------------------------------------------------------
  # Rotas HTML servidas pelo backend (fora do prefixo /v1)
  # ----------------------------------------------------------------------

  /t/{code}:
    servers:
      - url: https://{dominio}
        variables: { dominio: { default: dominio-a-definir.com.br } }
    parameters:
      - $ref: '#/components/parameters/TagCode'
    get:
      operationId: webTagPage
      tags: [web]
      x-effects: [irreversible_write]
      summary: "Pagina publica da tag: achei este pet"
      description: |
        HTML renderizado pelo backend, com o conteudo critico embutido para
        carregar no primeiro pacote util. Sem dependencia de JavaScript para o
        botao funcionar.

        Cabecalhos obrigatorios: `X-Robots-Tag: noindex, nofollow`,
        `Referrer-Policy: no-referrer`, `Cache-Control: no-store`. O codigo e
        uma credencial ao portador: ele nao vai para indice de busca, nao vaza
        pelo referenciador e o caminho completo nao entra no log de acesso em
        claro.
      security: []
      x-rate-limit:
        - dimension: [ip, code]
          limit: 30
          window: 1h
          on_exceed: serve_cache
          note: "par: imune ao CGNAT"
        - dimension: [ip]
          limit: 300
          window: 1h
          on_exceed: challenge
          note: "nunca 429 para codigo valido"
        - dimension: [ip_24]
          limit: 2000
          window: 1h
          on_exceed: log_and_alert
        - dimension: [code]
          limit: 100
          window: 24h
          on_exceed: notify_owner
        - dimension: [finder_identity]
          limit: 5
          window: 10m
          on_exceed: deny_429
          applies_to: invalid_attempts
          note: "adivinhacao de codigo: unica recusa do fluxo. Retry-After 600, e a tela oferece o achado avulso"
        - dimension: [ip]
          limit: 20
          window: 1h
          on_exceed: deny_429
          applies_to: invalid_attempts
      responses:
        '200':
          description: Pagina do pet em modo achado.
          content:
            text/html: { schema: { type: string } }
        '404':
          description: Codigo inexistente (tela com campo para digitar de novo).
          content:
            text/html: { schema: { type: string } }
        '410':
          description: Tag desativada (tela com o caminho do achado avulso).
          content:
            text/html: { schema: { type: string } }

  /t/{code}/avisar:
    servers:
      - url: https://{dominio}
        variables: { dominio: { default: dominio-a-definir.com.br } }
    parameters:
      - $ref: '#/components/parameters/TagCode'
    post:
      operationId: webNotifyOwner
      tags: [web]
      x-effects: [notifies, irreversible_write]
      summary: Envio do aviso pelo formulario HTML, sem JavaScript
      x-rate-limit:
        - dimension: [code, finder_identity]
          limit: 1
          window: 6h
          on_exceed: group_notification
        - dimension: [code]
          counts: distinct_identities
          limit: 3
          window: 1h
          on_exceed: group_notification
        - dimension: [code]
          counts: distinct_identities
          limit: 10
          window: 24h
          when: pet_not_lost
          on_exceed: notify_once_and_review
          note: "dez pessoas escaneando a plaquinha de um pet que ninguem deu por falta e a plaquinha circulando sem o animal"
        - dimension: [code]
          counts: distinct_identities
          limit: 30
          window: 24h
          when: pet_lost
          on_exceed: notify_once_and_review
          note: "PET PERDIDO: onze pessoas escaneando a coleira de um cao solto num bairro movimentado e a rede funcionando, nao abuso. Reter ai faz o tutor receber um resumo em vez de saber que ha gente em cima do animal dele, no momento de maior chance de reencontro, e o comportamento e indistinguivel de uma protecao funcionando"
        - dimension: [ip, code]
          limit: 5
          window: 1h
          on_exceed: challenge
        - dimension: [ip]
          limit: 40
          window: 1h
          on_exceed: challenge
        - dimension: [ip_24]
          limit: 200
          window: 1h
          on_exceed: log_and_alert
          note: "identico a POST /v1/tags/{code}/found-reports: e o mesmo aviso, e esta e a rota que o achador sem app usa de verdade"
      description: |
        `application/x-www-form-urlencoded` vindo de um `<form method="post">`.
        O campo oculto `nonce`, emitido na pagina, serve de protecao contra
        falsificacao de requisicao e de chave de idempotencia.
        Responde 303 para `/c/{finderToken}`.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [nonce]
              properties:
                nonce: { type: string }
      responses:
        '303':
          description: Aviso enviado; redireciona para a conversa do achador.
          headers:
            Location: { schema: { type: string, format: uri-reference } }

  /transferencia/{cancelToken}:
    servers:
      - url: https://{dominio}
        variables: { dominio: { default: PUBLIC_BASE_URL } }
    parameters:
      - name: cancelToken
        in: path
        required: true
        schema: { type: string, minLength: 20, maxLength: 256 }
    get:
      operationId: webTransferCancelPage
      tags: [web]
      x-effects: [verifies_secret]
      x-rate-limit:
        - dimension: [ip]
          limit: 30
          window: 1h
          on_exceed: deny_429
          applies_to: invalid_attempts
      summary: Pagina de cancelamento da transferencia, sem login
      description: |
        **Precisa funcionar sem conta, e o motivo e o cenario de uso.** O e-mail
        que avisa "voce transferiu o Thor" e lido justamente por quem talvez
        tenha **perdido o acesso a conta** — se cancelar exigisse login, a defesa
        nao existiria na unica situacao em que ela importa.

        O link vai nos dois e-mails da janela de 24 h (aviso de inicio e aviso de
        aceite), com token assinado de 256 bits, uso unico, valido ate
        `effective_at`. Confirma por `POST`, nunca por `GET`, pela mesma razao do
        SEC-005: varredor de link consumiria o cancelamento antes da pessoa.
      security: []
      responses:
        '200':
          description: Pagina com o botao de cancelar.
          content:
            text/html: { schema: { type: string } }
        '410':
          description: Ja consumada, ja cancelada, ou token expirado.
          content:
            text/html: { schema: { type: string } }
    post:
      operationId: webCancelTransfer
      tags: [web]
      x-effects: [verifies_secret, notifies]
      x-rate-limit:
        - dimension: [ip]
          limit: 30
          window: 1h
          on_exceed: deny_429
          applies_to: invalid_attempts
      summary: Cancela a transferencia pelo link do e-mail
      description: |
        Cancela e avisa os dois lados. **Nao exige senha**: cancelar e a direcao
        segura, e quem chegou aqui tem a caixa de entrada do tutor, que e a mesma
        prova que a recuperacao de senha aceita.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '303':
          description: Cancelada. Nenhuma tag foi revogada.
          headers:
            Location: { schema: { type: string, format: uri-reference } }
        '410':
          description: Ja consumada ou token invalido.
          content:
            text/html: { schema: { type: string } }

  /c/{finderToken}:
    servers:
      - url: https://{dominio}
        variables: { dominio: { default: dominio-a-definir.com.br } }
    parameters:
      - name: finderToken
        in: path
        required: true
