  /health:
    get:
      operationId: health
      tags: [ops]
      x-effects: []
      summary: Sonda de saude
      description: |
        **Unica operacao publica sem `x-rate-limit`, e a ausencia e deliberada:**
        quem chama e a sonda do balanceador e do orquestrador. Limitar a sonda
        faz o servico ser tirado de rotacao justamente sob carga, que e quando
        ele precisa continuar respondendo. A protecao aqui e nao expor nada:
        a resposta nao traz versao de dependencia, nome de host, string de
        conexao nem contagem de registro.
      security: []
      responses:
        '200':
          description: Saudavel.
          content:
            application/json:
              schema:
                type: object
                required: [status, version, build]
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  version: { type: string }
                  build:
                    type: object
                    required: [artifact, commit]
                    description: |
                      Identidade do BUILD que esta respondendo. Ela existe para o
                      criterio 12 de BICHUS-13: portabilidade **provada por
                      execucao** nos dois destinos, e nao afirmada em documento.

                      `version` nao serve para isso -- ela vem do `package.json`
                      e e o mesmo valor em qualquer build desde que alguem
                      escreveu aquele numero.

                      Obrigatoria, e nao opcional: uma sonda que responde sem
                      dizer qual artefato esta no ar e exatamente o estado que o
                      QA reprovou. Campo opcional aqui deixaria o destino que o
                      omitisse passar calado pela comparacao.
                    properties:
                      artifact:
                        type: string
                        pattern: '^[0-9a-f]{16}$'
                        description: |
                          Resumo SHA-256 truncado sobre `dist/**/*.js`, o proprio
                          contrato e o `package.json`, CALCULADO NA SUBIDA a
                          partir do disco de dentro do container. E evidencia, e
                          nao afirmacao: ninguem o declara.

                          Dois destinos com o mesmo valor rodam o mesmo codigo
                          compilado e o mesmo contrato. Ele NAO e o digest da
                          imagem Docker -- base e `node_modules` ficam de fora --
                          e por isso nao distingue o alvo `dev` do alvo `prod`,
                          que copiam o mesmo `dist`.
                      commit:
                        type: [string, 'null']
                        pattern: '^[0-9a-f]{7,40}$'
                        description: |
                          Commit DECLARADO por quem construiu, pela variavel
                          `BUILD_COMMIT`. Vale o que vale uma afirmacao, e o nome
                          do campo separa as duas coisas de proposito.

                          `null` quando ninguem declarou -- silencio honesto em
                          vez de um valor inventado. Desde a BICHUS-210 o
                          `ARG BUILD_COMMIT` existe no `Dockerfile` e o commit
                          VIAJA dentro da imagem: o build REPROVA sem ele, entao
                          imagem construida pela esteira nunca responde `null`
                          aqui. O tipo continua aceitando `null` porque nada
                          impede um `docker build` feito a mao noutro lugar, e
                          um alvo que nao sabe de onde veio precisa dizer isso
                          em vez de inventar.
                  checks:
                    type: object
                    additionalProperties: { type: string, enum: [ok, fail] }
        '503':
          description: Nao saudavel.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

# ==========================================================================
# Componentes
# ==========================================================================
  # ----------------------------------------------------------------------
  # Backoffice (ADR-0027)
  # ----------------------------------------------------------------------
  #
  # Tudo abaixo so existe em `admin.bichu.app`: a borda responde 404 da borda a
  # `/v1/admin/*` em qualquer outro host, e a aplicacao responde 404 a toda
  # requisicao sem `X-Internal-Surface: admin` (D33). Nenhuma operacao daqui
  # aceita `bearerAuth`: com JWT valido de qualquer conta do app a resposta e
  # 401 (D36). As contas do painel sao cadastro proprio (ADR-0027 item 20). A credencial e a sessao em cookie `__Host-bichu_adm`
  # (`adminSession`), e todo metodo nao seguro exige tambem `X-CSRF-Token`
  # (`adminCsrf`) e `Origin` exato (D39).
  #
  # Extensoes proprias desta superficie, e cada uma vira portao (ADR-0027 item 7):
  #
  # - `x-admin-roles`: papel minimo. Na v1, so `admin`.
  # - `x-audit`: acao e tipo de recurso gravados em `audit.events` NA MESMA
  #   transacao da escrita. Falha da trilha desfaz a escrita (D49).
  # - `x-admin-reauth-scope`: exige `X-Admin-Reauth-Token` do escopo nomeado.

  /admin/auth/login:
    post:
      operationId: openAdminSession
      tags: [admin]
      x-effects: [verifies_secret, notifies]
      summary: Abre a sessao administrativa
      description: |
        O login do painel. **Nao e o login do app**: contas do painel e do app
        sao cadastros separados (ADR-0027 item 20, D42). Esta operacao so le
        as contas do painel, e a credencial de uma conta do app recebe aqui o
        mesmo 401 de qualquer e-mail sem conta.

        **Ordem, e ela importa:**

        1. `X-Captcha-Token` e **obrigatorio** aqui, ao contrario do login do
           tutor (ADR-0020). Ausente, ou com nota abaixo de 0,5: `403
           captcha-rejected`. Sao poucas pessoas conhecidas, sem emergencia, e
           a faixa cinzenta vai para o alerta (D41). A pagina que colhe o token
           e o documento `/entrar`, isolado da origem da sessao.
        2. Os tetos de `x-rate-limit` sao conferidos **antes** de derivar o hash
           (D44).
        3. E-mail sem conta do painel, senha errada, senha certa de conta
           desativada ou bloqueada, e senha certa que aparece numa base de
           senhas vazadas respondem **o mesmo 401, no mesmo tempo** (hash de
           descarte, e a base consultada em toda tentativa): o login nao conta a
           ninguem quem e administrador nem que a senha confere (D43, D44).
        4. Senha vazada nao tem resposta propria: a recusa vai para a trilha e
           **todos** os administradores recebem um e-mail dizendo que a conta
           precisa de `conta-admin redefinir-senha`. Nao ha redefinicao por
           link: a senha do painel so e definida pelo comando, no servidor
           (item 20.4, D61).

        **Sucesso:** `Set-Cookie: __Host-bichu_adm=...; Path=/; Secure;
        HttpOnly; SameSite=Strict`, sem `Domain` e sem `Max-Age`. O corpo traz
        o `csrf_token` e os dois prazos da sessao. Um e-mail vai para o dono da
        conta a cada sessao aberta, com o link "nao fui eu" do proprio painel,
        que chama `disavowAdminSessionAlert` (D46, D62).
      security: []
      x-audit: { action: admin.session.opened, resource_kind: admin_session }
      parameters:
        - name: X-Captcha-Token
          in: header
          required: true
          description: Token do reCAPTCHA v3 colhido em `/entrar`. Obrigatorio nesta operacao.
          schema: { type: string, minLength: 20, maxLength: 4096 }
      x-rate-limit:
        - dimension: [email]
          limit: 5
          window: 15m
          on_exceed: deny_429
          applies_to: invalid_attempts
          note: "D44: bloqueio de 15 min por conta"
        - dimension: [email]
          limit: 10
          window: 24h
          on_exceed: deny_429
          applies_to: invalid_attempts
          note: "D44: o bloqueio so cai com `conta-admin redefinir-senha`, e nao com o fim da janela"
        - dimension: [ip]
          limit: 20
          window: 1h
          on_exceed: deny_429
          applies_to: invalid_attempts
        - dimension: [ip_24]
          limit: 50
          window: 10m
          on_exceed: log_and_alert
          applies_to: invalid_attempts
          note: "observacao. O alerta global de D44 (mais de 50 falhas em 10 min somando todas as origens) e metrica, nao balde"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminLoginRequest' }
            examples:
              entrar:
                value: { email: operacao@exemplo.com.br, password: uma frase longa de verdade }
      responses:
        '200':
          description: Sessao aberta. O cookie vai no `Set-Cookie`; o corpo traz o que o painel precisa guardar em memoria.
          headers:
            Set-Cookie:
              description: '`__Host-bichu_adm=<256 bits>; Path=/; Secure; HttpOnly; SameSite=Strict`'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSession' }
              examples:
                aberta:
                  $ref: '#/components/examples/AdminSessionAberta'
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401':
          description: |
            Credencial invalida. **Identica** para e-mail sem conta do painel
            (inclusive o de uma conta do app), senha errada, conta desativada ou
            bloqueada, e senha certa que esta numa base de vazadas.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                naoConfere:
                  value:
                    type: https://dominio-a-definir.com.br/problems/invalid-credentials
                    title: E-mail ou senha nao conferem
                    status: 401
                    correlation_id: 018f7c1e-7a2b-7c3d-9e4f-2b1a0c9d8e7f
        '403':
          description: |
            Dois motivos, com o mesmo `type` para os dois: `captcha-rejected`
            (tente de outra rede e fale com o responsavel), ou `Origin` que nao
            e o do painel (`forbidden`). Senha vazada **nao** responde aqui: e
            o 401 de cima, pelo motivo do passo 4.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                desafio:
                  value:
                    type: https://dominio-a-definir.com.br/problems/captcha-rejected
                    title: Nao conseguimos confirmar este acesso
                    status: 403
                    detail: Tente de outra rede. Se continuar, fale com o responsavel pelo painel.
                    correlation_id: 018f7c1e-7a2b-7c3d-9e4f-2b1a0c9d8e7f
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/session:
    get:
      operationId: getAdminSession
      tags: [admin]
      x-effects: []
      summary: A sessao administrativa corrente
      description: |
        O que o painel pede ao carregar e depois de um F5: quem esta na sessao,
        os papeis, os prazos e o `csrf_token` (D39). O token anti-CSRF vem
        **no corpo**, nunca em cookie, e o painel o guarda em memoria.

        Sessao ausente, vencida por inatividade ou pelo teto, revogada, ou
        anterior a `sessions_invalid_before`: `401`. O painel decide pelo
        `type`: `unauthenticated` manda entrar; `token-expired` diz que a
        sessao venceu e manda entrar. Conta desativada: `403` na proxima
        requisicao, e todas as sessoes dela caem junto (D37, D38).
      security:
        - adminSession: []
      x-admin-roles: [admin]
