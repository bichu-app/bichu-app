  # ----------------------------------------------------------------------
  # A secao `Rede`: os encontros da comunidade (ADR-0025)
  # ----------------------------------------------------------------------

  /network/events:
    get:
      operationId: listNetworkEvents
      tags: [network]
      x-effects: [expensive_query]
      summary: A agenda de encontros da Rede
      description: |
        A secao `Rede`: os encontros que a comunidade marca em praca e parque.

        **LEIA O ADR-0025 E A SECAO 12 DO ADR-0027 ANTES DE MEXER NESTA
        OPERACAO.**

        ## Nao ha pessoa nenhuma nesta resposta

        Check-in e galeria sairam desta versao por decisao do cliente (ADR-0027
        12.4). Quando voltarem, voltam pelas decisoes 1 a 3 do ADR-0025: a
        presenca e da PESSOA e nunca do pet, sai como numero e nunca como lista,
        e a foto nao tem autor na saida. O motivo e o item 7 do ADR-0010: uma
        lista de presenca num encontro de bairro publica, de graca, que dois
        animais sao do mesmo tutor.

        ## Encontro privado sai como teaser, e nao entra em recorte oculto

        O privado aparece com **so titulo, data local e estado**
        (`NetworkEventPrivateTeaser`, ADR-0027 12.10). Ele casa `q` so pelo
        titulo e **fica fora** de `city`, `admission` e `size`: aparecer num
        recorte que so casa pelo valor oculto entregaria o valor (P19).

        ## Nao ha coordenada nesta resposta, nem ordem por distancia

        O encontro pode ter ponto marcado no mapa (ADR-0027 12.2), e **o ponto
        nao sai aqui**: esta operacao e alcancavel sem conta. Ele sai so em
        `getNetworkEventLocation`, com `bearerAuth` obrigatorio (emenda 1 do
        ADR-0010). O lugar nesta resposta sao tres rotulos de texto --
        `place_name`, `neighborhood`, `city`/`state` --, que e o teto de
        precisao que o ADR-0010 permite em superficie publica.

        **A ordem por distancia nao existe aqui.** Ela e
        `listNearbyNetworkEvents`, com conta. O filtro de lugar e por `city`
        digitada, como a listagem publica de perdidos.

        ## A agenda nao mistura passado e futuro sem dizer qual e qual

        `when` tem default `upcoming`: a lista abre com o que ainda vai
        acontecer. `past` traz o que passou, `all` traz os dois e **nao e o
        default**.

        **`status` e calculado no SERVIDOR**, nunca no aplicativo. O encontro
        CANCELADO continua na agenda ate o fim previsto, com `status`
        `cancelled`; depois do fim, segue a regra do encerrado e sai `ended`
        (ADR-0027 12.6, decisao do cliente de 23/09/2026).

        ## NAO EXISTE OPERACAO DE ESCRITA DE EVENTO NESTA SECAO

        A escrita e do backoffice, em `/admin/network/events` (ADR-0027), e nao
        daqui.
      security: []
      x-rate-limit:
        - dimension: [ip]
          limit: 300
          window: 1h
          on_exceed: deny_429
          note: "agenda publica: nao ha conta para contar, entao o teto e por IP, e generoso porque a aba recarrega a cada troca de filtro"
      parameters:
        - $ref: '#/components/parameters/NetworkEventQuery'
        - $ref: '#/components/parameters/NetworkEventCity'
        - $ref: '#/components/parameters/NetworkEventWhenParam'
        - $ref: '#/components/parameters/NetworkEventSortParam'
        - $ref: '#/components/parameters/NetworkEventAdmissionParam'
        - $ref: '#/components/parameters/NetworkEventVisibilityParam'
        - $ref: '#/components/parameters/NetworkEventSizeParam'
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      responses:
        '200':
          description: |
            Pagina da agenda. `total` alimenta a linha de resumo da barra de
            listagem e `applied_filters` alimenta a distincao entre "a Rede
            ainda nao tem encontro" e "o seu recorte esvaziou a agenda".
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkEventPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

    post:
      operationId: createNetworkEvent
      tags: [network]
      x-effects: [irreversible_write]
      summary: Criar um encontro da Rede
      description: |
        A comunidade cria encontro, e ele **ja aparece em publico** (decisao do
        cliente de 17/10/2026, ADR-0025 emenda 3): nasce `published`, com
        `origin: community`, e a resposta e o proprio encontro, na forma de
        `getNetworkEvent`. **Nao ha fila de revisao e nao ha decisao de
        painel.**

        ## Quem pode criar, que e a unica regua

        **Canal de contato verificado**, a MESMA regua de abrir caso de pet
        perdido: sem ele, `409 contact-channel-unverified` com
        `next_action: verify_email`. Na pratica isso e **e-mail confirmado**,
        porque nao existe operacao que verifique telefone.

        **Teto de 3 encontros ATIVOS por conta** (ainda nao encerrados):
        `409 community-event-limit-reached`. Encontro que terminou sai da conta
        sozinho. Sem revisao humana, este teto e o teto de chamada desta
        operacao sao a unica contencao de volume, e por isso os dois existem.

        ## O que esta operacao NAO aceita, e por que

        Sem `visibility` (todo encontro da comunidade e publico: o privado tem
        fila de pedidos, que e trabalho de moderacao do painel), sem
        `admission` (o Bichu nao cobra, e valor escrito por terceiro vira
        moderacao de dinheiro), sem `slug` (derivado do titulo, como no item da
        `Loja`), sem `point` e sem `street_address` (ADR-0006: nao ha mapa nem
        busca de endereco, e nao ha geocodificacao em nenhum ponto deste
        caminho) e sem `ticket_url` nem `instagram_url` (link em texto de
        terceiro e o vetor que D59 fecha).

        **A capa entra**, por `cover_image.upload_id`, e o envio dos bytes e
        autorizado antes por `createNetworkEventCoverUploadIntent`. A imagem de
        capa e **publica** (decisao do cliente de 17/10/2026): o
        `cover_image_url` sai na agenda, sem conta, assim que o processamento
        terminar -- antes dele, nulo.

        ## O que o servidor confere no texto, porque ninguem mais confere

        Sem revisao humana, estas conferencias sao a unica protecao, e por isso
        elas sao mais duras aqui que na escrita do painel:

        - **`place.place_name` recusa endereco embutido**, com
          `code: address_in_place_name`: CEP, numero de porta depois de
          separador (`, 200`, `- 200`, `nº 200`), `s/n`, marcador de
          quilometro, sequencia de quatro digitos ou mais, palavra de
          logradouro junto de numero que nao e parte do nome dela, e
          complemento residencial (`bloco 2`, `apto 51`, `condominio`).
          Palavra de logradouro sozinha ("Avenida Paulista") e numero que e
          parte do nome ("Rua 25 de Marco", "Praca 14 de Janeiro", "Quadra 302
          Norte") **passam**. O motivo e medido: `place_name` sai na agenda
          publica, sem conta, e o endereco escrito dentro dele contorna a
          protecao de `street_address`, que sai so em
          `getNetworkEventLocation`.
        - **`title`, `summary`, `notes` e `cover_image.alt_text` recusam
          contato e pagamento** (D59), com `code: contact_or_payment_detected`:
          telefone, e-mail, link, encurtador, perfil `@usuario`, chave PIX e
          dados bancarios. E a mesma conferencia que as observacoes do painel
          ja aplicam, aqui estendida a todo texto que a pessoa escreve.
      security:
        - bearerAuth: []
      x-rate-limit:
        - dimension: [account]
          limit: 5
          window: 24h
          on_exceed: deny_429
          note: "criar encontro e raro e publica direto; com a fila de revisao fora, este teto e o de 3 ativos sao a unica contencao de volume. O teto de 3 e do caso de uso, porque a porta de teto conta requisicoes e nao linhas"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityNetworkEventInput' }
      responses:
        '201':
          description: |
            O encontro criado, na mesma forma de `getNetworkEvent`.
            `cover_image_url` sai nulo enquanto a derivada publica nao existe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkEventPublic' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: |
            Sem canal de contato verificado (`contact-channel-unverified`) ou
            teto de encontros ativos atingido
            (`community-event-limit-reached`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /network/events/{eventSlug}:
    get:
      operationId: getNetworkEvent
      tags: [network]
      x-effects: []
      summary: Um encontro
      description: |
        **Um corpo so, e esse corpo e o publico** (ADR-0021). A autenticacao e
        opcional porque a `Rede` e navegavel deslogado, e o corpo e identico nos
        dois casos: nada nesta resposta e derivado de quem chama.

        **Sem coordenada.** Autenticacao opcional e, para o portao de contrato
        publico, operacao publica (P5 de `04-seguranca.md`). O ponto do encontro
        sai em `getNetworkEventLocation`, que exige conta (ADR-0027 12.5).

        **Encontro privado sai como teaser** (`NetworkEventPrivateTeaser`: so
        titulo, data local e estado) para qualquer chamador, inclusive o
        aprovado: o conteudo dele sai em `getNetworkEventPrivateDetails`
        (ADR-0027 12.10). A forma vem do evento, e nao de quem pergunta.

        Encontro que nao existe, que espera revisao (`pending_review`) ou que
        foi retirado (`removed`) responde **404 nos tres casos**, com o mesmo
        corpo: distinguir contaria a um estranho que aquele `slug` existiu. O
        encontro cancelado e visivel, com `status` `cancelled` ate o fim
        previsto.
      security:
        - bearerAuth: []
        - {}
      x-rate-limit:
        - dimension: [ip]
          limit: 600
          window: 1h
          on_exceed: deny_429
          note: "leitura de um evento: teto por IP porque a operacao e alcancavel sem conta, e o dobro da listagem porque abrir a galeria de varios encontros seguidos e uso normal"
      parameters:
        - name: eventSlug
          in: path
          required: true
          description: O endereco publico do encontro. UUID nao sai nesta secao.
          schema: { type: string, minLength: 3, maxLength: 30 }
      responses:
        '200':
          description: O encontro.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkEvent' }
        # `eventSlug` tem forma declarada, entao a validacao de parametro pode
        # recusar -- e operacao que pode recusar declara 400. Sem esta linha a
        # aplicacao NAO SOBE: `rotas-registradas-contra-o-contrato` compara o que
        # o registro instala com o que o contrato promete, e reprova nominalmente.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

    patch:
      operationId: updateNetworkEvent
      tags: [network]
      x-effects: [irreversible_write]
      summary: Editar o proprio encontro
      description: |
        **Quem criou o encontro administra aquele encontro** (decisao do cliente
        de 17/10/2026, ADR-0025 emenda 3). Esta operacao edita **somente**
        encontro de `origin: community` criado pela propria conta.

        **Encontro de outra pessoa NAO EXISTE para quem pede** (ADR-0021): a
        condicao de autoria mora na clausula `WHERE` da mesma leitura que
        carrega o encontro, e a resposta e **404**, identica a de `slug` que
        nunca existiu. Nunca 403, nunca corpo diferente. Encontro do painel
        (`origin: admin`) tambem responde 404 aqui -- ele se edita pelo painel.

        `If-Match` e obrigatorio, com a versao da ultima leitura: ausente, 428;
        diferente da atual, 412, e nada e gravado. O leitor tolera o `W/` e o
        sufixo de codificacao que a borda acrescenta (`"1-zstd"`).

        ## O que o autor NAO muda, e por que

        `visibility` e `admission` (encontro privado tem fila de pedidos e valor
        e moderacao de dinheiro: as duas sao decisao de administracao, e seguem
        so em `changeAdminNetworkEventAccess`), `slug` (ele ja circulou),
        `street_address` e `point` (ADR-0006, e o endereco e campo do painel),
        `ticket_url` e `instagram_url` (link em texto de terceiro),
        `publication_status` (cancelar tem operacao propria) e `origin`.

        **Data, horario, fuso e lugar ENTRAM aqui**, e isso e a unica diferenca
        deliberada em relacao ao `PATCH` do painel, que os manda para
        `relocateAdminNetworkEvent`: aquela operacao existe pela cerimonia de
        T11 (motivo e aviso a todos os administradores), que nao se aplica a
        quem esta corrigindo o proprio encontro. Sem eles, consertar a hora
        errada exigiria cancelar e criar de novo, gastando o teto de 3.

        ## As conferencias de texto valem IGUAL aqui

        `place_name` recusa endereco embutido e `title`, `summary`, `notes` e
        `cover_image.alt_text` recusam contato e pagamento (D59), com os mesmos
        codigos de `createNetworkEvent`. Sem isso a pessoa criaria limpo e
        editaria metendo o endereco, e a protecao seria decorativa.

        **Encontro que ja terminou nao se edita** (`400`, `code: event_ended`):
        editar o passado reescreve o que aconteceu, e o encerrado nao volta a
        aparecer na agenda. O encontro que **ja comecou** e que ainda nao
        terminou continua editavel, porque e justamente ali que o aviso de
        ultima hora importa.
      security:
        - bearerAuth: []
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
          note: "escrita por conta; mais folgado que criar porque corrigir um texto e comum e nao publica nada novo"
      parameters:
        - $ref: '#/components/parameters/NetworkEventSlugParam'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityNetworkEventPatch' }
      responses:
        '200':
          description: O encontro depois da edicao, na forma de `getNetworkEvent`.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkEventPublic' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /network/events/nearby:
    get:
      operationId: listNearbyNetworkEvents
      tags: [network]
      x-effects: [expensive_query]
      summary: A agenda por distancia, pela regiao cadastrada de quem chama
      description: |
        **So com conta, sem alternativa vazia** (ADR-0027 12.14): a ordem que
        depende da regiao de quem chama e uma resposta que muda conforme o
        chamador, que o ADR-0021 proibe na leitura publica.

        **A posicao do tutor nao vai na requisicao.** A operacao usa a regiao de
        referencia ja gravada (`user_reference_locations`, quantizada em 100 m),
        como `Perto`. Nenhuma coordenada sai do aparelho a cada busca, e nada de
        localizacao entra em URL.

        **Encontro privado nao entra**, aprovado ou nao: a posicao dele numa
        lista por distancia ja e localizacao. `distance_m` sai arredondada a
        100 m so para encontro publico com ponto; encontro sem ponto vem no fim,
        com distancia nula. Sem regiao cadastrada, a lista sai em ordem de data,
        toda `distance_m` sai nula e `effective_sort` diz `proximos`.
        `sort=proximos` pede a ordem de data mesmo com regiao, e a distancia
        continua no cartao (APP-2 da matriz).

        Aceita os filtros da leitura publica e `max_km` (2, 5 ou 10), que
        exclui encontro sem ponto e so recorta com regiao cadastrada. **O
        caminho `nearby` e reservado**: nenhum encontro pode ter esse `slug`.
      security:
        - bearerAuth: []
      x-rate-limit:
        - dimension: [account]
          limit: 300
          window: 1h
          on_exceed: deny_429
          note: "exige conta, entao o teto e por conta; o mesmo numero da agenda publica por IP"
      parameters:
        - $ref: '#/components/parameters/NetworkEventQuery'
        - $ref: '#/components/parameters/NetworkEventCity'
        - $ref: '#/components/parameters/NetworkEventWhenParam'
        - $ref: '#/components/parameters/NetworkEventAdmissionParam'
        - $ref: '#/components/parameters/NetworkEventSizeParam'
        - name: sort
          in: query
          schema: { $ref: '#/components/schemas/NetworkEventNearbySort' }
        - name: max_km
          in: query
          schema: { type: integer, enum: [2, 5, 10] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      responses:
        '200':
          description: Pagina da agenda por distancia, so com encontros publicos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkEventNearbyPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /network/events/{eventSlug}/location:
    get:
      operationId: getNetworkEventLocation
      tags: [network]
      x-effects: []
      summary: O ponto e o endereco do encontro, so para quem tem conta
      description: |
        **Endereco (01/10/2026):** `street_address` sai AQUI e em nenhuma
        leitura sem conta, pela mesma regra do ponto (emenda 1 do ADR-0010,
        emenda de 01/10 do ADR-0027). O app abre o texto no aplicativo de
        mapas do aparelho, por intent; o Bichu nao geocodifica (ADR-0006).

        O ponto marcado no mapa pelo administrador (`geo_source = map_pin`,
        ADR-0006), para o aplicativo desenhar o encontro no mapa. E a emenda 1
        do ADR-0010, com escopo fechado: **ponto de evento publicado, em
        resposta autenticada**. Coordenada de pessoa, de pet, de caso e de
        achado continua proibida em qualquer superficie.

        **So com conta, e sem alternativa vazia.** `listNetworkEvents` e
        publica e `getNetworkEvent` tem autenticacao opcional; nenhuma das duas
        pode carregar o ponto, porque o portao de contrato publico trata
        autenticacao opcional como publica e o ADR-0021 proibe a resposta que
        muda conforme o chamador (ADR-0027 12.5). Sem conta, a tela mostra os
        rotulos do lugar e nao mostra mapa.

        `point` e **nulo** quando o encontro nao tem ponto marcado: o ponto e
        opcional (ADR-0027 12.2), e a ausencia e estado normal.

        **Lugar publico, nunca residencia** (ADR-0027 secao 13): quem cria o
        encontro e o administrador, o formulario do painel diz que o local e
        logradouro publico, e criar, mover e cancelar avisam todos os
        administradores. Nenhuma restricao de banco distingue uma praca de uma
        casa, e este contrato nao afirma que distingue.

        O encontro e visivel para esta operacao sob a mesma regra de
        `getNetworkEvent` (publicado ou cancelado), com a autorizacao na
        clausula `WHERE`: encontro que nao existe, que espera revisao ou que
        foi retirado responde 404, com o mesmo corpo. **Encontro privado so
        devolve o ponto para conta com pedido aprovado**; as outras recebem o
        mesmo 404 (ADR-0027 12.11). O 401 vem antes de qualquer consulta: sem
        conta nao se descobre nem se o `slug` existe.

        Responde com `Cache-Control: private, no-store`.
      security:
        - bearerAuth: []
      x-rate-limit:
        - dimension: [account]
          limit: 600
          window: 1h
          on_exceed: deny_429
          note: "a operacao EXIGE conta, entao o teto e por conta (ADR-0027 12.5) -- e no Brasil um teto por `ip` pegaria vizinho inocente atras do CGNAT. O mesmo numero do detalhe, porque a tela do encontro chama as duas a cada abertura; o que ele segura e a raspagem dos pontos de todos os encontros por uma conta so"
      parameters:
        - name: eventSlug
          in: path
          required: true
          description: O endereco publico do encontro.
          schema: { type: string, minLength: 3, maxLength: 30 }
      responses:
        '200':
          description: O ponto do encontro, ou `point` nulo quando nao ha ponto marcado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkEventLocation' }
        # Mesma razao de `getNetworkEvent`: `eventSlug` tem forma declarada.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /network/events/{eventSlug}/private-details:
    get:
      operationId: getNetworkEventPrivateDetails
      tags: [network]
      x-effects: []
      summary: O conteudo oculto do encontro privado, so para conta aprovada
      description: |
        Lugar, horario, resumo, imagens, valor, portes, idade, regras,
        estrutura, "o que levar" e observacoes do encontro **privado**, para a
        conta com pedido **aprovado** (ADR-0027 12.11). A autorizacao e um
        `EXISTS` sobre o pedido na clausula `WHERE`.

        **404, com o mesmo corpo, nos tres casos**: o encontro nao e privado,
        nao existe (ou nao e visivel), ou a conta nao tem pedido aprovado. Nao
        ha corpo menor para quem nao foi aprovado: nao ha corpo nenhum.

        Responde com `Cache-Control: private, no-store`.
      security:
        - bearerAuth: []
      x-rate-limit:
        - dimension: [account]
          limit: 600
          window: 1h
          on_exceed: deny_429
          note: "exige conta; o mesmo teto do detalhe e do ponto, porque a tela do encontro chama as tres"
      parameters:
        - $ref: '#/components/parameters/NetworkEventSlugParam'
      responses:
        '200':
          description: O conteudo oculto do encontro.
          headers:
            Cache-Control:
              schema: { type: string, enum: ['private, no-store'] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkEventPrivateDetails' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /network/events/{eventSlug}/join-request:
    post:
      operationId: requestToJoinNetworkEvent
      tags: [network]
      x-effects: []
      summary: Pedir para participar de um encontro privado
      description: |
        Cria o pedido **da conta** (nunca do pet; sem corpo, sem texto livre) e
        responde **200** com o estado que o app ve. Encontro publico, inexistente
        ou nao visivel responde 404.

        **Idempotente, e a recusa e invisivel** (ADR-0027 12.11): pedir de novo
        nunca cria linha nova. Sobre pedido recusado, devolve `requested` e nao o
        recoloca na fila. Nenhuma resposta difere entre recusado e pendente.
        Encontro que ja terminou responde 400 (`code: event_ended`), para o
        pendente e para o recusado igualmente.
      security:
        - bearerAuth: []
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
          note: "escrita por conta; baixo porque pedir e raro"
      parameters:
        - $ref: '#/components/parameters/NetworkEventSlugParam'
      responses:
        '200':
          description: O estado do pedido, no vocabulario do app.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkEventJoinRequest' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    get:
      operationId: getMyNetworkEventJoinRequest
      tags: [network]
      x-effects: []
      summary: O estado do pedido da propria conta
      description: |
        O estado do pedido **da propria conta**, no vocabulario do app
        (`JoinRequestAppState`, sem `declined`). Sem pedido, 404.

        **A desistencia nao deixa rastro legivel.** O pendente desistido e
        apagado (D54) e o recusado desistido e guardado so para nao lavar a
        recusa; os dois respondem 404 aqui. Se o recusado desistido respondesse
        `withdrawn` e o pendente desistido respondesse 404, a desistencia
        separaria o recusado do pendente.
      security:
        - bearerAuth: []
      x-rate-limit:
        - dimension: [account]
          limit: 600
          window: 1h
          on_exceed: deny_429
      parameters:
        - $ref: '#/components/parameters/NetworkEventSlugParam'
      responses:
        '200':
          description: O estado do pedido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkEventJoinRequest' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      operationId: withdrawNetworkEventJoinRequest
      tags: [network]
      x-effects: []
      summary: Desistir do pedido
      description: |
        Desiste enquanto o app ve `requested`, e responde 200 com `withdrawn`.
        Aprovado ou encontro encerrado respondem 400 (`code:
        join_request_final`). Sem pedido (inclusive o ja desistido), 404.

        Pedido **pendente** e apagado na hora (D54). Pedido **recusado** grava a
        desistencia e continua recusado: apaga-lo faria o proximo pedido nascer
        pendente e lavaria a recusa. A resposta e a mesma nos dois casos.
      security:
        - bearerAuth: []
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
      parameters:
        - $ref: '#/components/parameters/NetworkEventSlugParam'
      responses:
        '200':
          description: A desistencia foi registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkEventJoinRequest' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /network/events/{eventSlug}/cancellation:
    post:
      operationId: cancelNetworkEvent
      tags: [network]
      x-effects: [irreversible_write]
      summary: Cancelar o proprio encontro
      description: |
        **Cancelar nao e apagar**, e o desenho e o mesmo do cancelamento do
        painel (`cancelAdminNetworkEvent`): `publication_status` vira
        `cancelled`, o instante fica gravado, e **o encontro continua visivel no
        app como cancelado ate o fim previsto** -- quem ia precisa descobrir que
        nao vai mais acontecer, e um encontro que desaparece nao conta isso. A
        `note` e o motivo, e ela fica **so na trilha**: o app nao mostra motivo
        de cancelamento (nem o do painel), porque e texto livre.

        Vale **somente** para encontro de `origin: community` da propria conta,
        e encontro de outra pessoa ou do painel responde **404** (ADR-0021), o
        mesmo 404 de `slug` inexistente.

        So encontro `published` se cancela (`400`,
        `code: event_not_published`), e so o que **ainda nao terminou**
        (`400`, `code: event_ended`): cancelar o que ja aconteceu nao muda nada
        para ninguem. Cancelar de novo cai no primeiro caso.

        `If-Match` obrigatorio, como na edicao. O encontro cancelado **sai do
        teto de 3 ativos** da conta.
      security:
        - bearerAuth: []
      x-rate-limit:
        - dimension: [account]
          limit: 30
          window: 1h
          on_exceed: deny_429
      parameters:
        - $ref: '#/components/parameters/NetworkEventSlugParam'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityNetworkEventCancellation' }
      responses:
        '200':
          description: O encontro cancelado, na forma de `getNetworkEvent`.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkEventPublic' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /network/join-requests:
    get:
      operationId: listMyNetworkEventJoinRequests
      tags: [network]
      x-effects: []
      summary: Meus pedidos para participar
      description: |
        Os encontros privados em que **a propria conta** pediu para participar,
        cada um com o teaser e o `JoinRequestAppState`. Nao devolve conteudo
        oculto nem para aprovado: o conteudo continua em `private-details`.

        Aceita `q` (**so titulo**), `state` e `sort=proximos`. **Nao aceita
        `admission` nem `size`**: filtrar por valor oculto entregaria o valor.
        Pedidos desistidos nao aparecem, pela mesma razao de
        `getMyNetworkEventJoinRequest`, e por isso `state=withdrawn` devolve a
        lista vazia.
      security:
        - bearerAuth: []
      x-rate-limit:
        - dimension: [account]
          limit: 300
          window: 1h
          on_exceed: deny_429
      parameters:
        - name: q
          in: query
          description: Busca so no titulo.
          schema: { type: string, minLength: 2, maxLength: 80 }
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/JoinRequestAppState' }
        - name: sort
          in: query
          schema: { type: string, enum: [proximos], default: proximos }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      responses:
        '200':
          description: Pagina dos pedidos da conta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyNetworkEventJoinRequestPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ----------------------------------------------------------------------
  # Superficie publica
  # ----------------------------------------------------------------------

  /public/lost-pets:
    get:
      operationId: listPublicLostPets
      tags: [public]
      x-effects: [expensive_query]
      summary: Pets perdidos da regiao
      description: |
        **Publica e deslogada.** Devolve foto, especie, raca, porte, cor, data e
        **bairro**. Nunca devolve coordenada, nem aproximada, nem arredondada,
        em nenhum filtro e em nenhum zoom: um ponto por caso permite montar o
        mapa que a regra de privacidade existe para impedir.

        Por isso o filtro geografico e por **cidade e bairro digitados**, e nao
        por latitude e longitude. Paginacao numerada com total, porque a tela
        precisa dizer "1 a 20 de 87" e permitir chegar ao fim da lista.
      security: []
      x-rate-limit:
        - dimension: [ip]
          limit: 120
          window: 1h
          on_exceed: challenge
        - dimension: [ip]
          limit: 600
          window: 24h
          on_exceed: challenge
        - dimension: [ip, q]
          limit: 30
          window: 1h
          on_exceed: challenge
          note: "busca por texto tem teto proprio"
      parameters:
        - name: city
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 80 }
        - name: neighborhood
          in: query
          schema: { type: string, maxLength: 80 }
        - name: species
          in: query
          schema: { $ref: '#/components/schemas/Species' }
        - name: size
          in: query
          schema: { $ref: '#/components/schemas/PetSize' }
        - name: period
          in: query
          description: Janela desde a abertura do caso.
          schema: { type: string, enum: [24h, 7d, 30d], default: 30d }
        - name: q
          in: query
          description: |
            Busca parcial por **nome do pet**, tolerante a acento e a caixa.
            Nao busca por codigo de tag: quando o texto digitado tiver a forma
            de um codigo, o cliente chama `GET /v1/tags/{code}`, que leva direto
            ao pet. Aceitar codigo aqui transformaria a listagem publica num
            oraculo de existencia de codigo, com limite de listagem em vez do
            limite estrito da rota da tag.
          schema: { type: string, maxLength: 60 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      responses:
        '200':
          description: |
            Pagina de perdidos. `total` alimenta "Mostrando 1 a 20 de 87" e
            `applied_filters` alimenta a linha que explica o recorte.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicLostPetPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /public/pets/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Slug' }
    get:
      operationId: getPublicPetBySlug
      tags: [public]
      x-effects: []
      summary: Perfil publico do pet por endereco (@slug)
      description: |
        Responde 404 quando o tutor nao ligou o perfil publico. Slug trocado
        responde 301 para o atual, para nao quebrar link ja compartilhado.
      security: []
      x-rate-limit:
        - dimension: [ip]
          limit: 60
          window: 1h
          on_exceed: challenge
      responses:
        '200':
          description: Perfil publico.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicPetProfile' }
        '301': { description: Slug trocado. `Location` aponta para o atual. }
        '400':
          $ref: '#/components/responses/ValidationFailed'
          # `Slug` declara `pattern`: um endereco fora do formato e recusado
          # antes do manipulador, e nao vira 404. A diferenca nao vaza nada:
          # o formato do slug e publico, esta neste documento.
        '404': { $ref: '#/components/responses/NotFound' }
        '429':
          $ref: '#/components/responses/TooManyRequests'
          # `challenge` degenera em `deny_429` com `Retry-After` quando o pedido
          # nao traz `X-Captcha-Token` (secao de `x-rate-limit`, ADR-0020), o
          # mesmo motivo por que `listPublicLostPets` declara 429.

  /public/lost-cases/{shareToken}:
    parameters:
      - $ref: '#/components/parameters/ShareToken'
    get:
      operationId: getPublicLostCase
      tags: [public]
      x-effects: []
      summary: Visao publica de um caso, pelo token compartilhavel
      description: |
        **E o destino do toque no push do alerta.** O vizinho que recebeu o
        aviso e autenticado, mas nao e dono do caso: `GET /v1/lost-cases/{id}`
        responde 404 para ele, de proposito. Esta e a operacao que ele abre.

        Devolve a mesma projecao publica da listagem: foto, sinais, **bairro** e
        data. Nunca contato, endereco, ponto exato nem UUID interno.

        **A autenticacao e opcional e decide um campo so**, `can_report_sighting`,
        que e falso para o tutor do caso. Sem `Authorization`, a leitura e a
        anonima. **Com `Authorization` presente e invalido, a resposta e 401**,
        e nao a leitura anonima: rebaixar em silencio esconderia do app que a
        sessao acabou, e o toque seguinte em "vi este pet" falharia sem
        explicacao. E a mesma regra de `GET /tags/{code}`.

        A resposta varia com quem chama, e por isso sai com
        `Cache-Control: no-store`: um cache compartilhado que guardasse a versao
        do tutor serviria `can_report_sighting: false` ao vizinho.
      security:
        - bearerAuth: []
        - {}
      x-rate-limit:
        - dimension: [ip]
          limit: 120
          window: 1h
          on_exceed: challenge
      responses:
        '200':
          description: Caso aberto.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicLostCase' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
          # `ShareToken` declara `minLength` e `maxLength`: fora da faixa nao e
          # token de caso nenhum, e a recusa vem antes do manipulador. Nao vaza
          # nada, porque a faixa e publica; token dentro da faixa e
          # desconhecido continua sendo 410, como o encerrado.
        '401':
          $ref: '#/components/responses/Unauthorized'
          # So com `Authorization` presente e invalido (ver a descricao).
        '410': { $ref: '#/components/responses/LostCaseClosed' }
        '429':
          $ref: '#/components/responses/TooManyRequests'
          # `challenge` degenera em `deny_429` com `Retry-After` quando o pedido
          # nao traz `X-Captcha-Token` (secao de `x-rate-limit`, ADR-0020).

  # ----------------------------------------------------------------------
  # As quatro que o front web de outro time passou a precisar (ADR-0017)
  # ----------------------------------------------------------------------
  #
  # As oito paginas publicas em HTML sairam deste servico. A maior parte delas
  # sempre foi uma casca sobre uma operacao que ja existia (a pagina da tag sobre
  # `GET /v1/tags/{code}`, a do caso sobre `GET /v1/public/lost-cases/...`), mas
  # quatro nao tinham equivalente em JSON. Sao estas.
  #
  # Todas respondem `application/problem+json` no caminho de erro, e o front web
  # decide pelo `type` e pelo `next_action`, exatamente como o app. Nao ha um
  # segundo contrato para a web.

  /public/lost-cases/{shareToken}/poster:
    parameters:
      - $ref: '#/components/parameters/ShareToken'
    get:
      operationId: getLostCasePoster
      tags: [public]
      x-effects: []
      summary: Os dados do cartaz do pet perdido
      description: |
        O cartaz **nao e a pagina do caso**. Ele e feito para ser impresso em
        uma folha e colado em poste, e lido de longe por quem esta passando:
        traz o que cabe nesse formato e traz o link curto que vira o QR do papel.

        Existe separado por isso, e nao por organizacao: a pagina do caso pode
        ganhar campo sem que o cartaz caiba em uma folha, e o dia em que os dois
        forem o mesmo recurso, um dos dois vai piorar.

        Nunca traz contato, endereco, ponto exato nem UUID interno, a mesma
        regra da projecao publica.

        **Sem autenticacao.** O papel colado no poste e igual para todo mundo, e
        a resposta nao pode variar com quem pede. Ate 23/09/2026 esta operacao
        declarava autenticacao opcional sem que o token decidisse coisa alguma;
        o servidor ignora `Authorization` aqui, e por isso nao ha 401.

        **Nao ha 429.** O unico teto e `serve_cache`, que responde do cache e
        nao recusa, como em `getFinderConversation`.
      security: []
      x-rate-limit:
        - dimension: [ip]
          limit: 60
          window: 1h
          on_exceed: serve_cache
      responses:
        '200':
          description: Dados do cartaz.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LostCasePoster' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
          # `ShareToken` fora da faixa de tamanho. Ver `getPublicLostCase`.
        '410': { $ref: '#/components/responses/LostCaseClosed' }

  /public/password-reset/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: checkPasswordResetToken
      tags: [auth]
      x-effects: []
      summary: Diz se o link de redefinicao ainda vale
      description: |
        Existe para a tela saber **antes** de a pessoa digitar a senha nova.
        Sem esta operacao, quem clica num link vencido escolhe uma senha,
        confirma, e so entao descobre que precisa pedir outro link — que e o
        pior momento possivel para dar essa noticia, e o momento em que a pessoa
        desiste.

        Nao revela nada sobre a conta: 200 com `{ "valid": true }` ou 410. Nao
        diz de quem e o link, nem se existe conta com aquele e-mail.
      security: []
      x-no-challenge: true
      x-rate-limit:
        - dimension: [ip]
          limit: 30
          window: 1h
          on_exceed: log_and_alert
          note: "chamada ao abrir a pagina, sem ninguem para responder a um desafio; teto existe para o laco, e o alerta e o que importa"
      responses:
        '200':
          description: O link vale.
          content:
            application/json:
              schema:
                type: object
                required: [valid]
                properties:
                  valid: { type: boolean, enum: [true] }
        '410': { $ref: '#/components/responses/TokenExpired' }


  /public/session-alerts/{alertToken}/disavow:
    parameters:
      - name: alertToken
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: disavowSessionAlert
      tags: [auth]
      x-effects: [verifies_secret, notifies, irreversible_write]
      summary: '"Nao fui eu": derruba todas as sessoes pelo link do aviso'
      description: |
        O aviso de reuso de refresh chega por e-mail, e quem o le pode ser
        justamente quem **perdeu** a conta: o invasor ja trocou o que precisava
        trocar, ou o celular ficou no bolso de outra pessoa. Um botao que exija
        login e inutil para essa pessoa, e e por isso que esta operacao nao pede
        conta. Mesmo desenho, e pelo mesmo motivo, de
        `cancelTransferByToken`: a operacao existe para **desfazer**, e um
        obstaculo aqui e o dano consumado.

        O que ela faz, e so isto: revoga todas as familias de refresh da conta e
        empurra `users.sessions_invalid_before`, o que derruba tambem o token de
        acesso ja emitido em menos de um segundo (SEC-006). Ela **nao troca a
        senha** e nao mexe em mais nada: quem tem o link nao provou ser o
        titular, e uma troca de senha a partir daqui trancaria o titular para
        fora com o link que existe para protege-lo. O e-mail que sai em seguida
        convida a redefinir a senha pelo fluxo que exige a caixa de entrada.

        E **POST, sem GET equivalente**, e isso e defesa: cliente de e-mail e
        antivirus de borda pre-carregam link por GET, e uma revogacao disparada
        por pre-carga derrubaria a sessao de quem nunca clicou.

        O token e de uso unico, vale 7 dias e e consumido **depois** de a
        revogacao concluir. A ordem e deliberada: revogar duas vezes tem o mesmo
        efeito de revogar uma, entao gastar o token antes deixaria uma falha
        passageira do banco queimar o unico remedio da vitima.

        Responde 204 tambem quando a conta ja estava sem sessao nenhuma. O
        pedido e o que importa, nao o numero de linhas que caiu.
      security: []
      x-no-challenge: true
      x-rate-limit:
        - dimension: [ip]
          limit: 10
          window: 1h
          on_exceed: log_and_alert
          note: "recusar aqui trabalharia contra quem a rota protege; o teto existe para o laco, e o alerta e o que importa. O token de 256 bits e a defesa real"
      responses:
        '204': { description: Todas as sessoes da conta foram encerradas. }
        '410':
          description: |
            O link nao vale mais: inexistente, vencido ou ja usado. O corpo e o
            mesmo nos tres casos, porque distinguir contaria a um estranho que
            aquele token existiu.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /public/transfers/{cancelToken}:
    parameters:
      - name: cancelToken
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getTransferByCancelToken
      tags: [pets]
      x-effects: []
      summary: A transferencia pendente, pelo token que chegou por e-mail
      description: |
        O tutor atual tem 24 h para cancelar depois do aceite, e o caminho e um
        link no e-mail. Ele pode estar em outro aparelho, deslogado, com o app
        desinstalado — e este e o momento em que **nao** se pede que ele entre
        na conta: a operacao existe para desfazer a coisa mais destrutiva do
        produto, e um obstaculo aqui e um pet transferido por engano.

        `POST /v1/pets/transfers/{transferId}/cancel` continua existindo e
        continua exigindo conta: e o caminho de dentro do app.

        Devolve o minimo para a tela dizer o que sera desfeito: o nome do pet e
        quando a transferencia se consuma. Nunca o e-mail do destinatario nem
        UUID interno.
      security: []
      x-no-challenge: true
      x-rate-limit:
        - dimension: [ip]
          limit: 30
          window: 1h
          on_exceed: log_and_alert
      responses:
        '200':
          description: A transferencia pendente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferCancelView' }
        '410':
          description: |
            Ja consumada, ja cancelada, ou o token nao vale mais. O corpo e o
            mesmo nos tres casos: dizer qual deles ocorreu entregaria a quem
            tem um token velho o estado atual de uma transferencia alheia.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /public/transfers/{cancelToken}/cancel:
    parameters:
      - name: cancelToken
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: cancelTransferByToken
      tags: [pets]
      x-effects: [irreversible_write, notifies]
      summary: Cancela a transferencia pelo token do e-mail, sem conta
      description: |
        Desfaz a transferencia dentro da janela de 24 h. O token e de uso unico
        e e consumido aqui.

        **Nao exige reautenticacao**, e e deliberado: as quatro camadas que
        protegem a transferencia (reautenticacao com senha, vinculo com o e-mail
        verificado do destinatario, token de 256 bits so por e-mail, e esta
        janela de 24 h) protegem o ato de TRANSFERIR. Cancelar e a operacao
        segura: ela devolve ao estado anterior. Exigir credencial para desfazer
        e o desenho que faz a protecao trabalhar contra quem ela protege.
      security: []
      x-no-challenge: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      x-rate-limit:
        - dimension: [ip]
          limit: 10
          window: 1h
          on_exceed: log_and_alert
      responses:
        '204': { description: Transferencia cancelada. O pet continua com o tutor atual. }
        '410':
          description: Ja consumada, ja cancelada, ou o token nao vale mais.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

