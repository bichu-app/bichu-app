      summary: Chaves publicas de verificacao do token
      description: |
        **Sempre duas chaves**, a ativa e a de rotacao, cada uma com `kid`
        (ADR-0002). Publicar so a ativa impede rotacionar sem derrubar sessao: o
        consumidor precisa conhecer a proxima antes de ela comecar a assinar.

        Contem apenas material publico. Cacheavel por 1 hora, e quem consome
