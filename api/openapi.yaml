        '204': { description: Encontro removido. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AdminReauthRequired' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/network/events/{eventSlug}/relocation:
    parameters:
      - $ref: '#/components/parameters/EventSlug'
    post:
      operationId: relocateAdminNetworkEvent
      tags: [admin]
      x-effects: [notifies]
      summary: Muda data, horario ou lugar de um encontro publicado
      description: |
        E a operacao que um invasor com a senha usaria para reunir caes num
        lugar e horario escolhidos por ele (T11), e por isso ela tem as tres
        travas: `X-Admin-Reauth-Token` do escopo `network_event_relocation`
        (D40), aviso por e-mail a **todos** os administradores com o antes e o
        depois (D52), e linha na trilha (sem a coordenada bruta: a trilha grava
        `point_changed`).

        Pelo menos um de `place`, `starts_at`, `ends_at` e `time_zone`. O
        `reason` e obrigatorio e vai no aviso. Encontro cancelado ou removido
        responde `400` (`code: event_not_published`).
      security:
        - adminSession: []
          adminCsrf: []
          adminReauth: []
      x-admin-roles: [admin]
      x-admin-reauth-scope: network_event_relocation
      x-audit: { action: admin.network_event.relocated, resource_kind: network_event }
      x-rate-limit:
        - dimension: [account]
          limit: 120
          window: 10m
          on_exceed: deny_429
          note: "balde compartilhado admin_write (D52)"
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminNetworkEventRelocation' }
            examples:
              chuva:
                value:
                  starts_at: '2026-10-11T12:00:00Z'
                  ends_at: '2026-10-11T14:00:00Z'
                  reason: Previsao de chuva no sabado; o encontro passa para domingo.
      responses:
        '200':
          description: Encontro movido.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminNetworkEvent' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AdminReauthRequired' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/network/events/{eventSlug}/cancellation:
    parameters:
      - $ref: '#/components/parameters/EventSlug'
    post:
      operationId: cancelAdminNetworkEvent
      tags: [admin]
      x-effects: [notifies]
      summary: Cancela um encontro publicado
      description: |
        O encontro passa a `cancelled` e **continua visivel no app como
        cancelado** ate o fim previsto (decisao do cliente, 23/09). Exige `X-Admin-Reauth-Token` do escopo
        `network_event_cancellation` e avisa todos os administradores. Sem
        volta: um encontro cancelado que vai acontecer de novo e um encontro
        novo.
      security:
        - adminSession: []
