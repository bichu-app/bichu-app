        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SlugTaken' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      operationId: removeAdminNetworkEvent
      tags: [admin]
      x-effects: [irreversible_write]
      summary: Remove um encontro, sem volta
      description: |
        Estado terminal `removed`: some do app e do painel de leitura publica,
        a linha continua no banco para a trilha. Exige
        `X-Admin-Reauth-Token` do escopo `network_event_removal` (D40). Para
        desmarcar um encontro que as pessoas precisam saber que nao vai
        acontecer, a operacao certa e `cancelAdminNetworkEvent`.
      security:
        - adminSession: []
          adminCsrf: []
          adminReauth: []
      x-admin-roles: [admin]
