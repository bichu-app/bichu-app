              schema: { $ref: '#/components/schemas/LostCase' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateLostCase
      security:
        - bearerAuth: []
      tags: [lost]
      x-effects: []
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
      summary: Atualiza onde e quando o pet foi visto pela ultima vez
      requestBody:
        required: true
        content:
