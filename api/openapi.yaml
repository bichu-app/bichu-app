          note: "balde compartilhado admin_write (D52)"
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminNetworkEventAccessChange' }
            examples:
              pago:
                value:
                  admission:
                    kind: paid
                    price: { amount: 2000, currency: BRL, unit: per_dog }
                  reason: O parque passou a cobrar pela area cercada.
      responses:
        '200':
          description: Condicao de acesso alterada.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminNetworkEvent' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
