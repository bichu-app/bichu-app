          schema: { $ref: '#/components/schemas/Slug' }
        - $ref: '#/components/parameters/AdminPage'
        - name: limit
          in: query
          description: D56. Teto de 50 por pagina, e nao 100 como nas outras listas.
          schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
      responses:
        '200':
          description: Pagina da fila.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminJoinRequestPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/network/join-requests/{requestRef}/approval:
    parameters:
      - $ref: '#/components/parameters/JoinRequestRef'
    post:
      operationId: approveAdminNetworkJoinRequest
      tags: [admin]
      x-effects: [notifies]
      summary: Aprova o pedido, e o tutor passa a ver o encontro inteiro
      description: |
        A partir de `pending` sem desistencia, **ou de `declined`** (o painel
        pode reverter uma recusa; o tutor nunca soube dela, e a aprovacao
        chega como a primeira noticia). Aprovado nao volta a recusado: o tutor
        ja viu o lugar, e recusar depois seria uma segunda decisao que ele
        sabe que existiu (`400`, `code: request_not_pending`, nos outros
        casos). Encontro cancelado, removido ou que ja terminou responde `409`
        (`event-not-open`). O tutor recebe push **so com
        o titulo do encontro**, nunca lugar nem horario: o conteudo passa pelo
        provedor de push e aparece na tela bloqueada (22.10.1). A partir daqui
        `getNetworkEventPrivateDetails` e `getNetworkEventLocation` respondem
        para a conta dele.
      security:
        - adminSession: []
          adminCsrf: []
      x-admin-roles: [admin]
      x-audit: { action: admin.network_join_request.approved, resource_kind: network_join_request }
      x-rate-limit:
        - dimension: [account]
          limit: 120
          window: 10m
          on_exceed: deny_429
          note: "balde compartilhado admin_write (D52)"
      responses:
        '200':
          description: Pedido aprovado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminJoinRequest' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/EventNotOpen' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ----------------------------------------------------------------------
  # A moderacao das avaliacoes do diretorio
  # ----------------------------------------------------------------------
  #
  # Entra na MESMA fatia que a avaliacao, e nao depois, porque a publicacao e
  # imediata (decisao do cliente de 18/10) e isto fala de negocio real com nome
  # e endereco. Publicacao imediata sem remocao e uma funcionalidade que nao se
  # pode desligar.
  #
  # O QUE O PAINEL AINDA NAO TEM, e esta declarado para nao ser descoberto
  # depois: nao ha operacao de LISTAR as denuncias nem as avaliacoes. O
  # administrador remove por `reviewRef`, que ele obtem hoje pela leitura
  # publica da pagina do local. Uma fila de moderacao navegavel e a continuacao
  # natural e nao cabia nesta fatia.

  /admin/directory/reviews/{reviewRef}:
    parameters:
      - $ref: '#/components/parameters/DirectoryReviewRef'
    delete:
      operationId: removeAdminDirectoryReview
      tags: [admin]
      x-effects: []
      summary: Remove uma avaliacao do ar, com o motivo na trilha
      description: |
        **Remocao e EXCLUSAO LOGICA**: `status` vai para `'removed'` e
        `moderation_reason` guarda o motivo. A linha fica. O ADR-0011 manda a
        remocao ser "decisao de moderacao nossa, registrada na trilha com o
        motivo", e trilha que aponta para uma linha apagada nao e trilha.

        A avaliacao sai imediatamente da lista, da media e da contagem --
        porque as tres leem `status = 'published'` na mesma clausula.

        **O motivo e OBRIGATORIO**, e e a diferenca entre moderacao e
        arbitrio: quem remove escreve por que, e isso fica legivel para quem
        auditar depois. Ele **nunca sai para o app**: nenhuma resposta de
        leitura publica projeta `moderation_reason`.

        **Nao ha rota de restaurar nesta fatia.** Ela e a continuacao obvia e
        ficou de fora conscientemente; `status` aceita `'published'` de volta,
        entao restaurar nao exige migracao nova.
      security:
        - adminSession: []
          adminCsrf: []
      x-admin-roles: [admin]
      x-audit: { action: admin.directory_review.removed, resource_kind: professional_review }
      x-rate-limit:
        - dimension: [account]
          limit: 120
          window: 10m
          on_exceed: deny_429
          note: "balde compartilhado admin_write (D52)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DirectoryReviewRemovalInput' }
      responses:
        '204': { description: A avaliacao saiu do ar e o motivo esta na trilha. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/network/join-requests/{requestRef}/decline:
    parameters:
      - $ref: '#/components/parameters/JoinRequestRef'
    post:
      operationId: declineAdminNetworkJoinRequest
      tags: [admin]
      x-effects: []
      summary: Recusa o pedido, sem avisar o tutor
      description: |
        So a partir de `pending` sem desistencia; aprovado nao volta a
        recusado. Encontro cancelado, removido ou que ja terminou responde
        `409` (`event-not-open`). **O tutor nao e avisado**, e
        para ele o pedido continua "aguardando" ate o encontro passar (decisao
        do cliente, 23/09): o app recebe `requested`, nunca `declined`. A
        recusa e final e invisivel: pedir de novo devolve o mesmo `requested`
        e nao recoloca o pedido na fila (ADR-0027 item 17 e 12.11). Sem motivo escrito: motivo e mensagem, e mensagem e v2.
      security:
        - adminSession: []
          adminCsrf: []
      x-admin-roles: [admin]
      x-audit: { action: admin.network_join_request.declined, resource_kind: network_join_request }
      x-rate-limit:
        - dimension: [account]
          limit: 120
          window: 10m
          on_exceed: deny_429
          note: "balde compartilhado admin_write (D52)"
      responses:
        '200':
          description: Pedido recusado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminJoinRequest' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/EventNotOpen' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ----------------------------------------------------------------------
  # Escrita administrativa do diretorio de `Perto` (BICHUS-189)
  # ----------------------------------------------------------------------
  #
  # O aplicativo SO LE o diretorio (`listDirectoryEntries`). Ate 17/10/2026 nao
  # havia escrita nenhuma em lugar nenhum: as entradas que existem em qualquer
  # destino vieram de `src/bin/seed.ts`, e nao de uma tela. Estas quatro
  # operacoes sao o menu que faltava no painel.
  #
  # **ELAS NAO CADASTRAM ONG**, e a ausencia e decisao pendente do cliente
  # (`api/contrato-de-escrita-do-diretorio.md`, 9.1): `professionals` nao tem
  # `entity_kind` e `professionals.kind` nao tem valor para organizacao.
  # Acrescentar um aqui decidiria, por conta propria, que ONG e um tipo de
  # profissional -- que e justamente a pergunta aberta. A migracao
  # `20260922000021` ja recusou isso, com o motivo.
  #
  # **O enderecamento e por `slug`**, como em `Loja` e `Rede`, e nunca por UUID:
  # a resposta administrativa tambem nao carrega `id`. Duas formas de enderecar
  # o mesmo registro no mesmo painel e a que divergiria, e o ADR-0010 item 6
  # proibe o UUID interno em saida.
  #
  # **Nao ha reautenticacao por senha em nenhuma delas** (decisao do cliente,
  # ADR-0027 item 23): basta a sessao em cookie com CSRF, mais o `If-Match` na
  # edicao. Reintroduzi-la aqui desfaria aquela decisao.

  /admin/directory/entries:
    get:
      operationId: listAdminDirectoryEntries
      tags: [admin, directory]
      x-effects: []
      summary: Entradas do diretorio de Perto, em qualquer situacao
      description: |
        A lista do painel. Diferente de `listDirectoryEntries`, que serve o
        aplicativo, esta traz **rascunho, oculta e removida** junto com a
        publicada: quem administra precisa achar o que ainda nao esta no ar.

        **Nao ha ordem por distancia aqui.** Distancia depende da localizacao
        de referencia de quem chama (ADR-0006), e o painel e operado de uma
        mesa que nao tem relacao nenhuma com onde a entrada atende. A ordem e
        por nome ou por ultima alteracao.
      security:
        - adminSession: []
      x-admin-roles: [admin]
      parameters:
        - name: q
          in: query
          description: Busca por nome, no servidor. Sem acento e sem caixa, pelo indice trigrama de `professionals`.
          schema: { type: string, minLength: 3, maxLength: 80 }
        - name: kind
          in: query
          description: Filtra pela atividade. Sem o parametro, vem todas.
          schema: { $ref: '#/components/schemas/ProfessionalKind' }
        - name: status
          in: query
          description: Filtra pela situacao. Sem o parametro, vem todas, inclusive as removidas.
          schema: { $ref: '#/components/schemas/DirectoryEntryStatus' }
        - name: city
          in: query
          description: Filtra pela cidade, igualdade exata.
          schema: { type: string, minLength: 2, maxLength: 80 }
        - name: state
          in: query
          description: Filtra pela UF, duas letras.
          schema: { type: string, minLength: 2, maxLength: 2 }
        - name: sort
          in: query
          description: '`name` e a ordem alfabetica; `updated` poe a ultima alteracao em cima.'
          schema: { type: string, enum: [name, updated], default: name }
        - $ref: '#/components/parameters/AdminPage'
        - $ref: '#/components/parameters/AdminLimit'
      responses:
        '200':
          description: Pagina de entradas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDirectoryEntryPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
    post:
      operationId: createAdminDirectoryEntry
      tags: [admin, directory]
      x-effects: []
      summary: Cadastra uma entrada do diretorio
      description: |
        **A entrada nasce RASCUNHO** (`professionals.status` tem
        `DEFAULT 'draft'`), e so aparece em `Perto` depois de um `PATCH` com
        `status: published`. Nao e zelo: o cadastro de um estabelecimento tem
        campos que o operador costuma buscar em duas sessoes, e publicar na
        criacao faria o diretorio mostrar meia clinica.

        **`source` e `import`, e `claim_status` e `unclaimed`.** Nao e atalho:
        sao os unicos valores que o `CHECK professionals_aceite_antes_do_perfil`
        admite para uma entrada sem titular, e e exatamente o que esta
        acontecendo -- o painel cadastrou a entidade, e ninguem do outro lado
        reivindicou o perfil ainda. `self` e `invited` sao os caminhos que
        passam por aceite de quem o perfil descreve, e dizer um deles aqui
        seria gravar um aceite que nao houve.

        **Nenhum documento e pedido.** `cnpj`, `crmv_number` e `crmv_uf`
        existem na tabela e **nao estao neste corpo**: um profissional pode ser
        pessoa fisica, e o painel nao precisa de documento dele para publicar
        uma entrada de diretorio. Quem prova o que, e com qual evidencia, e
        `entity_verifications`, que tem fluxo proprio e nao passa por aqui.

        **`verification_level` tambem nao esta aqui**, e o corpo e fechado
        (`additionalProperties: false`), entao manda-lo e `400` e nao campo
        ignorado em silencio: o nivel deriva da verificacao aprovada mais forte
        da entidade, e um perfil que declarasse o proprio nivel tornaria a
        verificacao decorativa.

        **`geo` nao esta aqui** (decisao 9.4 pendente): nao ha geocodificacao
        neste produto (ADR-0006), entao cidade e bairro digitados nunca viram
        ponto. A entrada e publicavel sem coordenada e simplesmente nao
        participa da ordenacao por distancia, que `distance_available: false`
        ja sabe dizer.
      security:
        - adminSession: []
          adminCsrf: []
      x-admin-roles: [admin]
      x-audit: { action: admin.directory_entry.created, resource_kind: directory_entry }
      x-rate-limit:
        - dimension: [account]
          limit: 120
          window: 10m
          on_exceed: deny_429
          note: "balde compartilhado admin_write (D52): a chave e (conta, admin_write), somando todas as escritas administrativas"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminDirectoryEntryInput' }
            examples:
              clinica:
                summary: Um estabelecimento
                value:
                  slug: clinica-sao-jorge
                  kind: clinic
                  display_name: Clinica Veterinaria Sao Jorge
                  city: Sao Paulo
                  state: SP
                  neighborhood: Vila Mariana
                  phone_e164: '+551130612200'
              profissional:
                summary: Uma pessoa que atende
                value:
                  slug: passeios-da-bia
                  kind: walker
                  display_name: Passeios da Bia
      responses:
        '201':
          description: Entrada criada, em rascunho.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDirectoryEntry' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '409': { $ref: '#/components/responses/SlugTaken' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/directory/entries/{entrySlug}:
    parameters:
      - $ref: '#/components/parameters/EntrySlug'
    get:
      operationId: getAdminDirectoryEntry
      tags: [admin, directory]
      x-effects: []
      summary: Uma entrada do diretorio
      description: A entrada em qualquer situacao, com o `ETag` para a proxima escrita.
      security:
        - adminSession: []
      x-admin-roles: [admin]
      responses:
        '200':
          description: A entrada. O `ETag` e o que o `PATCH` apresenta em `If-Match`.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDirectoryEntry' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateAdminDirectoryEntry
      tags: [admin, directory]
      x-effects: []
      summary: Altera, publica ou retira uma entrada do diretorio
      description: |
        `If-Match` obrigatorio: dois administradores editando a mesma entrada
        nao se sobrescrevem em silencio.

        **Editar NAO despublica.** Uma entrada publicada continua publicada
        depois de uma edicao de campo. Se editar derrubasse para rascunho, o
        operador corrigiria um telefone e a clinica sumiria de `Perto` sem
        ninguem ser avisado -- o modo de falhar mais caro que um diretorio tem,
        porque e silencioso e do lado de quem nao consegue ver.

        **O que a edicao nao pode fazer e QUEBRAR a publicacao.** Se o corpo
        deixaria uma entrada publicada sem `city`, sem `state` ou sem nenhum
        canal de contato, a escrita e recusada com `400` nomeando os campos, e
        nao aceita e despublicada em silencio. A mesma regua vale para a
        transicao `draft -> published` (ADR-0023 secao 2, camada 2): duas
        definicoes de "completo" e exatamente o que aquela secao proibe. Toda
        leitura da entrada ja traz a lista em `missing_to_publish`, para a tela
        dizer o que falta antes de alguem clicar em publicar.

        **Despublicar e ato explicito**, com `status: hidden` ou `removed`, e
        nunca efeito colateral de outra coisa.

        `phone_e164` passa a ser **escrito** por aqui. Ele continua sendo o
        telefone COMERCIAL de quem aceitou aparecer para ser contratado
        (ADR-0011 secao 4), e o formato e E.164 (`+` e 8 a 15 digitos): o painel
        recebe o numero com mascara brasileira e manda E.164.
      security:
        - adminSession: []
          adminCsrf: []
      x-admin-roles: [admin]
      x-audit: { action: admin.directory_entry.updated, resource_kind: directory_entry }
      x-rate-limit:
        - dimension: [account]
          limit: 120
          window: 10m
          on_exceed: deny_429
          note: "balde compartilhado admin_write (D52)"
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminDirectoryEntryPatch' }
            examples:
              corrigeTelefone:
                summary: Correcao de campo numa entrada publicada
                value:
                  phone_e164: '+551130612200'
              publica:
                summary: Tira do rascunho
                value:
                  status: published
              retira:
                summary: Retirada temporaria, por moderacao
                value:
                  status: hidden
      responses:
        '200':
          description: A entrada depois da edicao.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDirectoryEntry' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SlugTaken' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ----------------------------------------------------------------------
  # A BUSCA DE CEP -- UMA integracao, e ela e NOSSA
  # ----------------------------------------------------------------------
  #
  # Decisao do cliente de 18/10/2026: *"voce deve usar sempre a mesma camada de
  # servico que ja fez a integracao com as plataformas, reaproveitamento dos
  # nossos endpoints"*. Antes disso o aplicativo falava com o ViaCEP direto
  # (`app/lib/api/busca_de_cep.dart`), e o painel nao tinha busca nenhuma. Um
  # segundo cliente de CEP em TypeScript seria a terceira implementacao da mesma
  # regra -- ordem dos servicos, prazo, `{"erro":"true"}` com `true` como texto,
  # HTML com 400 em CEP torto -- e tres copias divergem na primeira base que
  # mudar de formato.
  #
  # A integracao vive em `src/modules/addresses/adapters/external/`, atras da
  # porta `BuscaDeCep`. **Esta operacao e so a borda dela.**
  #
  # POR QUE ELA NASCE NA SUPERFICIE ADMINISTRATIVA, E NAO PUBLICA NEM NO APP --
  # os tres caminhos foram medidos em 18/10 antes de escolher:
  #
  # 1. **`security: []` nao e exprimivel.** `src/tools/portao-contrato-publico.ts`
  #    reprova `street`, `postal_code`, `street_number`, `address`, `cep` e `zip`
  #    em QUALQUER resposta alcancavel sem conta (ADR-0010, "o que a rota publica
  #    jamais exibe", item 2). A resposta desta operacao e exatamente um
  #    logradouro, entao uma versao publica dela reprovaria nominalmente -- e
  #    renomear os campos para escapar do portao seria trapaca, nao desenho.
  # 2. **`bearerAuth` nao serve ao painel.** A guarda de `/v1/admin` recusa com
  #    401 qualquer requisicao que traga `Authorization` (ADR-0027 item 2, D36),
  #    e a conta do painel nao e conta do app: ela nao tem, e nao pode ter, um
  #    Bearer. Uma operacao so com `bearerAuth` seria inalcancavel pelo unico
  #    chamador que existe hoje.
  # 3. **O chamador que existe hoje e o painel.** O formulario de entrada do
  #    diretorio e o que passa a coletar CEP nesta entrega.
  #
  # O APP CONTINUA COMO ESTA NESTA ENTREGA, e a migracao dele e uma linha de
  # fiacao: a mesma porta registrada numa `GET /v1/postal-codes/{postalCode}`
  # com `security: [bearerAuth]`, sem tocar no adaptador. Ela NAO entra aqui
  # porque operacao declarada sem chamador e divida de contrato, e porque o
  # arquivo do app esta sendo editado por outra frente agora.
  # ----------------------------------------------------------------------

  /admin/postal-codes/{postalCode}:
    get:
      operationId: lookupAdminPostalCode
      tags: [admin, directory]
      # Nenhum efeito do catalogo do ADR-0016 cabe: nao notifica, nao gera
      # trabalho humano, nao e consulta cara nossa, nao confere segredo, nao
      # revela credencial e nao escreve nada. O teto existe assim mesmo, e por
      # isso ele esta declarado abaixo -- mesma forma de `getReferenceData`,
      # que tambem e leitura com `x-effects: []` e teto proprio.
      x-effects: []
      summary: O endereco de um CEP, para poupar digitacao no cadastro
      description: |
        Troca um CEP por **rua, bairro, cidade e UF -- texto**, que e exatamente
        o que o operador digitaria. Serve o formulario de entrada do diretorio
        de `Perto`, e serve qualquer formulario nosso com campo de CEP.

        **ISTO NAO E GEOCODIFICACAO, e a distincao e o que autoriza a
        operacao.** A ADR-0006 proibe transformar endereco em COORDENADA; aqui
        o caminho e o contrario. A reserva (BrasilAPI) devolve
        `location.coordinates` com latitude e longitude -- medido em 17/10/2026
        --, e o adaptador le quatro campos e **ignora o resto de proposito**.
        Nenhuma latitude, nenhuma longitude, nenhum ponto, nenhum indice
        espacial, e nenhuma coluna onde guardar.

        **O que sai do nosso servidor para o terceiro e so o CEP.** Oito
        digitos, que sao um codigo postal publico e nao o endereco de ninguem:
        sem numero e sem nome, ele aponta para um trecho de rua, nao para uma
        casa. Nem conta, nem sessao, nem nome, nem token vao na chamada de
        saida.

        **Nenhum desfecho desta operacao impede um cadastro.** `404` quer dizer
        "este CEP nao existe nas bases" e `503` quer dizer "nao conseguimos
        consultar agora"; nos dois a tela continua inteira, com os campos
        editaveis e o botao de salvar vivo. CEP e conveniencia de digitacao, e
        servico de terceiro fora do ar nao pode travar o cadastro de uma
        clinica.

        **Nada e guardado aqui.** A operacao nao escreve linha nenhuma: quem
        grava o endereco e `createAdminDirectoryEntry` /
        `updateAdminDirectoryEntry`, com o que o operador confirmou na tela.
      security:
        - adminSession: []
      x-admin-roles: [admin]
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
          note: "60 por hora por conta do painel. O teto aqui NAO protege o nosso banco -- protege a cota de um servico gratuito de terceiro, consumida pelo nosso IP: sem teto, a rota e uma porta aberta para gastar a cota alheia em nome da casa, e o bloqueio que vem depois quebra a busca de CEP para todos de uma vez. 60 e numero de tela e nao de planilha: um cadastro usa um CEP, e sessenta cadastros numa hora numa unica conta ja e mais do que uma mesa faz. Por `account` e nao por `ip` porque a operacao exige sessao administrativa -- a conta existe e e exata -- e porque o painel inteiro sai de poucos enderecos, onde um teto por IP puniria a mesa toda pelo uso de uma pessoa. A chave e `admin:<conta>`, que nunca divide balde com o app (ADR-0027 item 20.2)"
      parameters:
        - name: postalCode
          in: path
          required: true
          description: |
            CEP com oito digitos, **sem mascara e sem hifen** -- o mesmo
            formato de `CollarTagShippingAddress.postal_code`, copiado dele.
            A mascara vive na tela.

            CEP torto responde `400` e nao viaja: o ViaCEP devolve **HTML com
            status 400** nesse caso (medido em 17/10/2026), e deixar a forma
            ser conferida aqui poupa a chamada de saida inteira.
          schema: { type: string, pattern: '^[0-9]{8}$' }
      responses:
        '200':
          description: O endereco do CEP, em texto.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostalCodeAddress' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: |
            Os dois servicos falharam ou nao responderam no prazo de 4 s cada.
            **A tela nao trava**: quem cadastra digita o endereco.
          content:
            application/problem+json:
              # SEM `example`, e a ausencia e medida. O exemplo que estava aqui
              # carregava o `type` por extenso
              # (`https://<dominio>/problems/postal-code-lookup-unavailable`), e
              # `openapi-typescript` o copia como comentario para os TRES
              # gerados -- `src/`, `admin/` e `web/`. Medido em 18/10/2026: o
              # portao de portabilidade saiu de 10 para 13 achados por causa
              # dele, um por arquivo gerado. O slug ja esta declarado em
              # `x-problem-types`, que e a fonte do enum, entao o exemplo nao
              # acrescentava informacao -- so o hostname literal.
              schema: { $ref: '#/components/schemas/Problem' }

  # ----------------------------------------------------------------------
  # A FILA DE REVISAO DAS INDICACOES DO `Perto` (a queixa de 18/10/2026)
  # ----------------------------------------------------------------------
  #
  # `suggestDirectoryEntry` existe desde 17/10 e grava em
  # `directory_suggestions` com `review_status = 'pending'`. **Nao havia
  # operacao administrativa nenhuma que lesse essa fila**: a indicacao pelo
  # aplicativo e os quatro menus do diretorio no painel nasceram em duas frentes
  # paralelas, e as duas subiram sem que ninguem fizesse a tela que le o que a
  # comunidade indicou. O cliente mediu isso no painel, com estas palavras: "no
  # backoffice nao tem um menu para aprovar os profissionais que as pessoas
  # estao indicando".
  #
  # **O enderecamento e por `ref`**, o identificador opaco de 128 bits que a
  # propria `20261017000004` ja grava, e nunca por UUID (ADR-0010 item 6).
  # A indicacao nao tem `slug` -- `slug` e da ENTRADA, e a entrada so passa a
  # existir na aprovacao. Mesmo desenho de `AdminJoinRequest.ref` e de
  # `AdminCollarTagRequest.ref`, que sao as outras duas filas do painel.
  #
  # **O campo do estado se chama `review_status` e nao `state`**, pelo motivo
  # que a migracao escreveu por extenso: `state` aqui e a Unidade Federativa, na
  # mesma linha. `DirectorySuggestionReceipt` pode chamar o seu de `state`
  # porque o recibo do aplicativo nao devolve a UF; esta projecao devolve as
  # duas coisas, e duas chaves com o mesmo nome nao caberiam.
  #
  # **QUEM INDICOU NAO SAI AQUI, EM NENHUMA DAS QUATRO OPERACOES.** A coluna que
  # guarda a autoria leva a marca `NUNCA sai do servidor` no `COMMENT ON COLUMN`
  # da `20261017000004` (ADR-0011 secao 4, BICHUS-174): nem o nome, nem contagem
  # por entidade, nem a existencia. Por isso **nao ha `x-audit` nos dois `GET`**:
  # `x-audit` em leitura administrativa e da leitura de PESSOA (D55/D56), e esta
  # fila nao le pessoa nenhuma -- a projecao e so da entidade indicada.
  #
  # **Indicacao de conta desabilitada nao aparece aqui**, e nao em um lugar so:
  # a listagem, a leitura e a contagem de `pending_total` filtram pelo mesmo
  # predicado (`conta_habilitada`, migracao `20261017000013`). Filtrar em um
  # lugar so e o defeito que a fila da Rede ja produziu: o painel diz
  # "1 pendente" e quem abre encontra fila vazia.
  #
  # **Nao ha reautenticacao por senha** (ADR-0027 item 23), e **nao ha
  # `If-Match`**: as outras duas filas do painel tambem nao tem. `If-Match`
  # protege edicao concorrente de recurso que se reescreve campo a campo; aqui a
  # decisao e uma transicao de `pending` para `approved` ou `declined`, e decidir
  # duas vezes responde `400` com `code: suggestion_not_pending` -- que e a
  # resposta certa, e nao um conflito de versao.

  /admin/directory/suggestions:
    get:
      operationId: listAdminDirectorySuggestions
      tags: [admin, directory]
      x-effects: []
      summary: A fila de indicacoes que a comunidade mandou para o Perto
      description: |
        So existe no painel: nenhuma operacao do aplicativo lista indicacao de
