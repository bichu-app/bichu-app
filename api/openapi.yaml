  # ----------------------------------------------------------------------
  # O diretorio de `Perto` -- a leitura
  # ----------------------------------------------------------------------
  #
  # A operacao abaixo e a proposta de `api/diretorio.proposta.yaml` trazida
  # para o contrato em vigor, com uma diferenca de MENOS e uma decisao que foi
  # tomada depois, as duas declaradas:
  #
  # 1. `getDirectoryEntry` e `getDirectoryReferenceData` NAO entraram. As duas
  #    continuam na proposta. Este contrato ja carrega 42 operacoes declaradas
  #    e sem implementacao, e acrescentar duas para nao as implementar hoje
  #    aumenta exatamente a divida que essa conta mede.
  # 2. O parametro `q` e a entrada de teto `[account, q]` ficaram de fora ate
  #    22/09 porque `q` nao estava em `DIMENSOES_CONHECIDAS` de
  #    `src/shared/http/aplicacao-de-teto.ts`, e dimensao nova e decisao de
  #    politica e nao detalhe de rota. A decisao foi tomada e os dois entraram.
  #    O que `q` significa como dimensao esta escrito por extenso naquele
  #    arquivo; o resumo e que ela NAO e o termo digitado, e sim "esta
  #    requisicao traz busca por texto". Fosse o termo, cada termo novo abriria
  #    um balde novo, e quem enumera o diretorio -- que por definicao varia o
  #    termo a cada chamada -- nunca encostaria no teto.

  /directory/entries:
    get:
      operationId: listDirectoryEntries
      tags: [directory]
      x-effects: [expensive_query]
      summary: Profissionais e estabelecimentos da regiao
      description: |
        O diretorio de `Perto`. Devolve apenas entradas publicadas.

        **EXIGE CONTA, e isso e o que torna a resposta possivel.**
        `src/tools/portao-contrato-publico.ts` reprova `phone_e164` e
        `distance_m` em qualquer operacao alcancavel sem conta, e reprova com
        razao. Telefone comercial e distancia sao o conteudo util do diretorio;
        numa rota publica eles nao podem existir. Afrouxar este `security` para
        `[bearerAuth, {}]` faz o portao reprovar os dois, nominalmente.

        **Ordenacao por distancia usa a localizacao de referencia de quem
        chama**, que o servidor ja guarda (BICHUS-92). Ela NAO e enviada na
        requisicao: coordenada em URL vai para log de acesso, para o historico
        do aparelho e para o cabecalho `Referer`.

        Sem localizacao conhecida, ou com mais de 30 dias (ADR-0006), a
        resposta traz `distance_available: false`, a ordenacao cai para `name`
        e `distance_m` vem nulo em todos os itens. **Falha de calculo nao vira
        zero e nao vira ordem aleatoria**: a tela diz que nao consegue ordenar
        por distancia e oferece ligar a localizacao. E a mesma regra do
        `reach_status: unavailable` do alerta.

        **Entrada sem coordenada aparece por ultimo, com `distance_m` nulo, e
        nao some.** A proposta original a excluia de `sort=distance`; excluir
        esconderia uma entrada publicada por causa de um campo que hoje NINGUEM
        consegue preencher -- nao ha painel de cadastro --, que e a mesma classe
        de defeito do zero silencioso, um nivel acima.

        Nao ha geocodificacao neste produto (ADR-0006): `city`, `state` e
        `neighborhood` sao rotulo de exibicao e filtro de texto, jamais fonte
        de coordenada. Quem alimenta o diretorio informa o ponto, e o painel
        precisa captura-lo com **mapa de toque** -- ninguem sabe a propria
        coordenada, e um par de campos de latitude e longitude nao serve.

        Paginacao numerada com total, como a listagem publica de perdidos,
        porque a tela precisa dizer "1 a 20 de 87" e chegar ao fim da lista.
      security:
        - bearerAuth: []
      x-rate-limit:
        - dimension: [account]
          limit: 120
          window: 1h
          on_exceed: deny_429
          note: "consulta geoespacial: teto por conta, nao por IP, porque a rota exige conta"
        - dimension: [account, q]
          limit: 60
          window: 1h
          on_exceed: deny_429
          note: "busca por texto tem teto proprio, e ele e por CONTA. `q` marca presenca de busca, nao o termo: teto por termo nunca pega enumeracao, que e justamente variar o termo"
      parameters:
        - name: q
          in: query
          description: |
            **Busca parcial pelo NOME da entrada**, tolerante a acento e a
            caixa: `veterinaria` acha `Veterinária`.

            **So o nome, e a escolha e de produto.** Todo outro campo que o
            cartao mostra ja tem controle proprio no topo da mesma tela --
            `city`, `state`, `neighborhood`, `kind` e `verification_level`.
            Fazer `q` casar tambem neles poria dois controles disputando o
            mesmo trabalho e deixaria `applied_filters` ambiguo: a tela nao
            teria como escrever por que uma linha entrou. `about` e o candidato
            conhecido para uma segunda fase, e ele custa um indice proprio
            sobre texto bem maior.

            **`minLength: 3` nao e gosto.** O indice que atende esta busca e
            GIN de trigrama, e um padrao com menos de tres caracteres nao
            produz trigrama nenhum: a consulta deixa de usar o indice e volta a
            varrer a tabela inteira. O piso e o ponto em que o indice deixa de
            existir. **A tela nao deve enviar `q` antes do terceiro caractere**,
            sob pena de levar 400 no que a pessoa le como o app quebrado.

            Casa somente sobre `status = 'published'`, como todo o resto da
            operacao. Quem busca por um nome especifico esta testando se ele
            existe, entao um rascunho ou um oculto que aparecesse aqui seria
            resposta a uma pergunta que ninguem tem direito de fazer.
          schema: { type: string, minLength: 3, maxLength: 60 }
        - name: city
          in: query
          description: |
            **Opcional**, e aqui esta proposta e o contrato divergem de
            proposito. A busca de perdidos comeca com alguem digitando onde
            perdeu; `Perto` e uma aba que abre sozinha, e exigir cidade a
            deixaria vazia ate a pessoa digitar algo. O recorte que falta e
            suprido pela ordenacao por distancia, que e o que a secao promete.
            Sem cidade e sem localizacao valida, `applied_filters` diz
            `scope: all` e a tela sabe que nao esta mostrando "perto" coisa
            nenhuma.
          schema: { type: string, minLength: 2, maxLength: 80 }
        - name: state
          in: query
          description: UF, duas letras.
          schema: { type: string, minLength: 2, maxLength: 2 }
        - name: neighborhood
          in: query
          schema: { type: string, minLength: 2, maxLength: 80 }
        - name: kind
          in: query
          description: Filtra por atividade.
          schema: { $ref: '#/components/schemas/ProfessionalKind' }
        - name: verification_level
          in: query
          description: |
            Piso, nao igualdade: `contact_verified` traz tambem
            `document_verified`. Filtro por igualdade esconderia o registro
            mais forte de quem pediu o mais fraco.
          schema: { $ref: '#/components/schemas/VerificationLevel' }
        - name: sort
          in: query
          description: |
            `distance` exige localizacao de referencia valida de quem chama.
            Sem ela, a resposta usa `name` e diz isso em `distance_available`.
          schema: { type: string, enum: [distance, name], default: distance }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      responses:
        '200':
          description: |
            Pagina do diretorio. `total` alimenta "Mostrando 1 a 20 de 87" e
            `applied_filters` alimenta a linha que explica o recorte.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectoryEntryPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /directory/suggestions:
    get:
      operationId: listMyDirectorySuggestions
      tags: [directory]
      x-effects: []
      summary: Minhas indicações
      description: |
        As indicações que **a propria conta** fez para o `Perto`, com o estado
        de cada uma. Pedido literal do cliente em 18/10/2026: *"e a aba de
        minhas indicacoes, com o status se esta pendente ou se ja foi aprovado
        pelo administrador?"*.

        ## O LADO QUE FALTAVA, e o que ele desfaz

        `suggestDirectoryEntry` existe desde 17/10 e devolve um recibo com
        `reference`, `state` e `created_at` -- e nada mais depois disso. A
        `20261017000016` deu ao PAINEL as quatro operacoes da fila; nenhuma
        operacao deste contrato lia `directory_suggestions` do lado de **quem
        indicou**, e por isso a pessoa nao tinha como saber se alguem olhou.

        **Isto REVERTE uma frase, e a reversao esta declarada.** O
        `COMMENT ON COLUMN` de `decline_reason` dizia "nao chega a quem
        indicou", e `AdminDirectorySuggestion.decline_reason` repetia. A partir
        de 18/10/2026 **o motivo da recusa chega a quem indicou**, por esta
        operacao: recusa sem motivo faz a mesma clinica ser indicada outra vez,
        e e a unica forma de resposta que nao ensina nada a ninguem. A migracao
        `20261018000003` reescreve aquele `COMMENT` e justifica a troca; quem
        recusa passa a escrever **para a pessoa**, e nao so para o proximo
        revisor.

        ## A autorizacao esta no `WHERE`, e por isso nao ha `403`

        A consulta passa pela funcao `indicacoes_do_autor(uuid)` da migracao
        `20261018000003`, que tem a conta na propria clausula `WHERE`. Nao e um
        filtro aplicado depois de ler e nao e um `if` sobre a linha lida: a
        indicacao de outra conta **nao existe** para quem chama. Nao ha `403`
        nesta operacao, e nao ha por que haver (ADR-0021).

        **Conta desabilitada devolve lista vazia**, pela mesma funcao, que
        delega a `conta_habilitada(uuid)` (`20261017000013`) -- o ponto unico da
        definicao, nao copiado aqui.

        ## Nada de quem indicou sai na resposta

        **Nenhum identificador interno** (ADR-0010): sem `id`, e o enderecamento
        e por `reference`, o mesmo opaco de 128 bits que o recibo devolveu. A
        coluna da autoria leva a marca `NUNCA sai do servidor` no
        `COMMENT ON COLUMN` da `20261017000004` (ADR-0011 secao 4, BICHUS-174) e
        **nao e projetada** pela funcao: ela e parametro e filtro, nunca saida.

        ## `entry_slug` SO VEM PUBLICADO, e o nulo tem significado

        Aprovada **nao** quer dizer no ar. Uma entrada nascida de indicacao cujo
        contato publico e `website` ou `instagram` nasce `draft` -- ela nao tem
        `phone_e164`, que e o canal unico de `professionals` --, e `Perto` so
        lista `status = 'published'`. Por isso `entry_slug` e devolvido
        **apenas quando a entrada esta publicada**: devolver o `slug` do
        rascunho faria a tela oferecer um caminho para uma pagina que nao esta
        no `Perto`.

        Entao `review_status: approved` com `entry_slug: null` e um estado com
        nome, e a tela o diz com palavras em vez de prometer link: aprovada,
        ainda nao no `Perto`.

        ## `state` existe e `q` NAO, e as duas decisoes sao medidas

        O padrao de listagem do projeto poe filtro e ordenacao no corpo da
        tela -- e os poe **sobre o que o contrato aceita**. Um filtro aplicado
        so na pagina carregada mentiria no `total` e no paginador: com `limit`
        de 20 e uma lista que cresce 5 por dia (o teto de
        `suggestDirectoryEntry`), "pendentes" filtrado no aplicativo mostraria
        as pendentes **da pagina 1** e diria que sao todas. Entao `state` e do
        SERVIDOR, e `total` passa a ser o do recorte.

        **`q` nao existe, e a ausencia e a mesma medida ao contrario:** buscar
        por nome numa lista de poucas dezenas de itens que a pessoa mesma
        escreveu e um campo a mais para manter em troca de nada -- e seria a
        unica busca do projeto sem indice por tras. Ordenacao tambem nao: a
        ordem e uma so, e e a unica que faz sentido aqui (a mais recente
        primeiro, porque e sobre ela que a pessoa quer noticia).
      security:
        - bearerAuth: []
      x-rate-limit:
        - dimension: [account]
          limit: 300
          window: 1h
          on_exceed: deny_429
          note: "mesmo teto de `listMyNetworkEventJoinRequests`, que e a mesma pergunta na `Rede`: leitura da propria lista, aberta e reaberta a cada noticia"
      parameters:
        - name: state
          in: query
          description: |
            Filtra pelo estado da revisao. Ausente, devolve **todos** os
            estados -- que e a pergunta de quem abre a tela.

            Do SERVIDOR e nao do aplicativo: filtrar a pagina carregada
            mentiria no `total` e no paginador. Com o filtro, `total` e o do
            recorte.
          schema: { $ref: '#/components/schemas/DirectorySuggestionState' }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      responses:
        '200':
          description: |
            Pagina das indicacoes da conta, **da mais recente para a mais
            antiga** -- ao contrario da fila do painel, que e trabalho humano e
            se atende do mais antigo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyDirectorySuggestionPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      operationId: suggestDirectoryEntry
      tags: [directory]
      x-effects: [human_work]
      summary: Sugerir um estabelecimento ou profissional para o `Perto`
      description: |
        A comunidade **sugere** uma entrada do diretorio. A sugestao nasce
        `pending` e **NAO publica nada**, nem agora nem automaticamente depois.

        ## Por que esta operacao nao publica, ao contrario de `createNetworkEvent`

        Criar encontro e a pessoa falando **dela mesma**: ela escolheu o lugar,
        marcou a hora e responde pelo que escreveu. Sugerir uma clinica e
        publicar sobre um **TERCEIRO** que nao pediu, nao sabe e pode
        discordar -- do texto, da categoria e de aparecer. O encontro publica
        direto porque o autor e o assunto sao a mesma pessoa; aqui eles nao
        sao, e nao existe no produto quem represente o assunto.

        Isso nao e zelo novo: e a **emenda 1 do ADR-0011**, escrita no `CHECK`
        de `professionals.source`, que **nao tem** o valor `'community'` --
        *"nenhum perfil nasce sem o aceite de quem ele descreve; a comunidade
        convida e avalia, nunca cria"*. Uma rota da comunidade que inserisse em
        `professionals` desfaria aquela decisao em vez de implementar esta.

        **Esta operacao nao escreve em `professionals`.** Ela grava em
        `directory_suggestions`, que e fila de revisao e nada mais. Quem cria a
        entrada do diretorio continua sendo o painel, a partir da sugestao, e
        pelo caminho de convite e aceite do ADR-0011.

        ## O que a resposta NAO devolve

        Sem `id` (ADR-0010 item 6): o recibo e `reference`, 128 bits aleatorios
        em base64url, pelo mesmo desenho de `AdminJoinRequest.ref`. Sem o nome
        de quem sugeriu, sem contagem de sugestoes da mesma entidade e sem o
        proprio texto sugerido: o conteudo so volta a existir em publico se o
        painel aprovar, e devolve-lo aqui faria o recibo parecer publicacao.

        ## Dado pessoal: o minimo, e so de entidade

        `display_name`, `kind`, `city`/`state`, `neighborhood`, `postal_code` e
        **um contato publico** -- o que a entidade ja divulga para ser
        contratada. **Nao ha campo de documento** (CRMV, CNPJ) e **nao ha
        campo de pessoa fisica**: documento e prova de verificacao, mora em
        `entity_verifications` e so entra por quem o apresenta; pedi-lo aqui
        seria coletar o documento de um terceiro pela mao de um estranho.

        **Sem coordenada e sem logradouro** (ADR-0006): nao ha mapa nem
        geocodificacao neste caminho. `city`, `state`, `neighborhood` e
        `postal_code` sao texto, e o CEP **nao** e convertido em ponto -- nem
        aqui nem no app, que ignora de proposito a coordenada que o servico de
        CEP devolve. O ponto do mapa e trabalho do painel, com mapa de toque,
        como a propria `listDirectoryEntries` descreve.

        **O CEP e guardado para o REVISOR** (cliente, 18/10: "pode armazenar o
        cep sim!") e **nunca publicado**: ver `DirectorySuggestionInput.
        postal_code`. Nao ha operacao de leitura de `directory_suggestions`
        neste contrato, e o recibo abaixo nao o devolve.

        ## As conferencias de texto, porque ninguem mais confere antes da fila

        `display_name` e `note` recusam contato e pagamento (D59,
        `code: contact_or_payment_detected`) e controle bidirecional
        (`code: bidi_control`), como todo texto que a pessoa escreve. O contato
        publico e a UNICA posicao em que telefone, site ou perfil pode entrar,
        e ele e conferido pelo formato do proprio `public_contact.kind`.

        ## Moderacao de palavras (`code: inappropriate_language`)

        `display_name` e `note` recusam tambem xingamento e injuria, **na hora
        da escrita** (pedido do cliente, 18/10/2026). A trava e do SERVIDOR: um
        aviso de formulario evita que a pessoa perca o texto digitado, mas nao
        protege nada, porque esta operacao atende chamada direta.

        A recusa **nao devolve a palavra encontrada** e **nao devolve a lista**,
        nem em `errors[]` nem em `detail`: devolve-la transformaria o `400` em
        oraculo de quem quer descobrir o filtro. A mensagem e sempre a mesma e
        diz o que fazer.

        **Isto nao e a prova de contorno, e nao substitui a revisao.** A lista
        pega palavra escrita por extenso; frase ofensiva sem palavra proibida,
        palavra grudada em outra e troca de caractere nao prevista passam. A
        protecao de fundo continua sendo a remocao pelo painel e a denuncia.

        Pelo mesmo juizo de falso positivo, a lista **nao tem** palavra que seja
        tambem nome proprio ou termo do dominio: `Clinica Pinto`, `cadela`
        (femea de cao) e `cavalo crioulo` passam, e isso e requisito, nao
        tolerancia. `city`, `state` e `neighborhood` nao passam pela moderacao.
      security:
        - bearerAuth: []
      x-rate-limit:
        - dimension: [account]
          limit: 5
          window: 24h
          on_exceed: deny_429
          note: "sugerir cria trabalho humano de revisao: o teto por CONTA e o orcamento da fila, e e o mesmo numero de `createNetworkEvent`. Por conta e nao por IP porque a rota exige conta, e o CGNAT das operadoras faria um teto por IP pegar vizinho inocente"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DirectorySuggestionInput' }
      responses:
        '201':
          description: |
            A sugestao foi registrada e esta **na fila de revisao**. A tela diz
            isso com estas palavras: nada aparece no `Perto` ate alguem olhar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectorySuggestionReceipt' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: |
            Sem canal de contato verificado (`contact-channel-unverified`): so
            conta VALIDADA sugere. O tipo e o mesmo de `createNetworkEvent` e de
            `openLostCase`, porque a pergunta e a mesma; o texto muda. A trava e
            do SERVIDOR: a tela esconde o botao de quem nao validou, e o botao
            escondido nao recusa quem chama a rota direto.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ----------------------------------------------------------------------
  # A pagina de um local do diretorio, e a avaliacao dele
  # ----------------------------------------------------------------------
  #
  # Pedido literal do cliente em 18/10/2026: "os locais indicados devem ser
  # clicados, para visualizar mais informacoes e para que os usuarios possam
  # dar pontuacao e fazer recomendacoes em texto, onde ficara disponivel para
  # outros usuarios, como acontece na playstore".
  #
  # `getDirectoryEntry` ERA UMA DAS DUAS OPERACOES QUE O COMENTARIO ACIMA
  # DECLAROU FORA. Ela entra agora porque o motivo de ter ficado fora -- "nao a
  # vamos implementar hoje" -- deixou de valer: ela E a tela pedida, e entra
  # COM implementacao. A outra (`getDirectoryReferenceData`) continua fora.
  #
  # O MODELO DE AVALIACAO NAO FOI INVENTADO AQUI. O ADR-0011 ja o especifica,
  # tabela por tabela, na secao "O que acontece com as avaliacoes quando o
  # profissional assume o perfil": `professional_reviews` com `rating 1..5`,
  # `body`, `status`, `moderation_reason` e `UNIQUE (professional_id,
  # author_user_id)`. A secao 5.4 daquele ADR dizia que a tabela "nao foi
  # autorizada"; em 18/10/2026 ela foi, e e esta operacao. Nada aqui contraria
  # o ADR; o que entra e a execucao da parte dele que estava esperando a
  # decisao.
  #
  # O QUE DO ADR-0011 **NAO** ENTRA NESTA FATIA, e a ausencia e declarada:
  # `professional_review_replies` -- o direito de resposta publica do
  # profissional, uma por avaliacao. Ele depende de reivindicacao de perfil
  # (`professional_claims`), que tambem nao existe: hoje nenhuma entrada do
  # diretorio tem dono que possa responder. Enquanto nao houver, uma rota de
  # resposta nao teria quem a chamasse.
  #
  # TRES REGRAS DE PUBLICACAO QUE SE CONFUNDEM COM FACILIDADE:
  #
  # 1. **A avaliacao de um local que JA EXISTE aparece na hora**, sem fila de
  #    aprovacao (decisao do cliente, 18/10: "como acontece na playstore").
  # 2. **A INDICACAO de um local NOVO continua passando por revisao do
  #    administrador.** Sao coisas diferentes e a primeira nao afrouxa a
  #    segunda. Nenhuma operacao desta secao cria entrada de diretorio.
  # 3. **Avaliar exige e-mail confirmado**, a mesma regua de criar encontro
  #    (`estadoParaCriarEncontro`). Ler nao exige nada alem de conta -- que a
  #    rota de leitura ja exige pelo motivo de sempre (`phone_e164`).

  /directory/entries/{slug}:
    parameters:
      - $ref: '#/components/parameters/DirectoryEntrySlug'
    get:
      operationId: getDirectoryEntry
      tags: [directory]
      x-effects: []
      summary: A pagina de um profissional ou estabelecimento
      description: |
        A tela de detalhe que o cartao de `Perto` passou a abrir. Mesmos campos
        do cartao, mais a pontuacao agregada.

        **EXIGE CONTA, pelo mesmo motivo de `listDirectoryEntries`** e nao por
        um motivo novo: ela devolve `phone_e164`, e
        `src/tools/portao-contrato-publico.ts` reprova esse campo em qualquer
        operacao alcancavel sem conta. Afrouxar o `security` daqui reprova
        nominalmente, igual lá.

        **So entrada publicada.** `slug` de rascunho, oculto ou removido
        responde `404`, e nao `403`: a autorizacao mora na clausula `WHERE`
        (ADR-0021) e um `403` confirmaria que aquele endereco existe. Quem
        chega por link de um perfil que saiu do ar le "nao encontramos",
        que e a verdade que ele tem direito de saber.

        **Nenhum campo novo de cadastro apareceu aqui.** Site, e-mail,
        WhatsApp, redes sociais, horario de funcionamento e foto **nao
        existem** em `professionals` -- nao ha coluna e nao ha painel que as
        preencha. Esta operacao devolve o que ha. Declarar campo que ninguem
        pode preencher produziria uma tela com seis linhas vazias permanentes,
        que e pior do que uma tela curta.

        ## A distancia, e por que ela e NULA aqui com mais frequencia

        Mesma regra de `listDirectoryEntries`: `distance_m` arredondada a 100 m
        (ADR-0006), nula quando a entrada nao tem coordenada ou quando quem
        chama nao tem localizacao de referencia valida. **A coordenada nao
        entra pela requisicao** -- o servidor usa a que ja guarda (BICHUS-92).
        Nao ha geocodificacao neste produto: `city`, `state` e `neighborhood`
        sao rotulo e filtro, jamais fonte de ponto.
      security:
        - bearerAuth: []
      x-rate-limit:
        - dimension: [account]
          limit: 300
          window: 1h
          on_exceed: deny_429
          note: "leitura de uma linha, com teto por CONTA porque a rota exige conta. Mais generoso que a listagem (120/h) porque navegar entre locais e o uso normal da secao, e mais barato: uma linha, sem recorte geoespacial"
      responses:
        '200':
          description: A entrada publicada, com a pontuacao agregada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectoryEntryDetail' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /directory/entries/{slug}/reviews:
    parameters:
      - $ref: '#/components/parameters/DirectoryEntrySlug'
    get:
      operationId: listDirectoryEntryReviews
      tags: [directory]
      x-effects: []
      summary: As avaliacoes que outras pessoas escreveram
      description: |
        A lista que a pagina do local mostra, no formato que o cliente pediu:
        quem escreveu, a nota, a data e o texto.

        **A avaliacao de quem desabilitou a conta NAO E LISTADA, e nao vira
        anonima.** O predicado e `conta_habilitada(uuid)` (migracao
        `20261017000013`), que e o ponto unico da definicao e trata o NULO como
        habilitado. A contagem e a media de `getDirectoryEntry` usam o MESMO
        predicado, entao "128 avaliacoes" e a lista nunca discordam -- que e o
        defeito que aparece quando a agregacao e o filtro da lista sao escritos
        em dois lugares.

        **`author_display_name` e nulavel**, e nulo nao e falha: conta sem nome
        de exibicao e estado normal, e a tela escreve "Alguem da comunidade".
        **Nenhuma outra coisa sobre o autor sai daqui** -- nem conta, nem
        quantos pets tem, nem as outras avaliacoes dele. A BICHUS-174 proibe
        expor vinculo entre duas pessoas, e uma lista de avaliacoes que
        identificasse o autor de forma navegavel seria exatamente isso.

        **A minha avaliacao tambem aparece nesta lista**, marcada com
        `mine: true`, e nao em um bloco separado do servidor: a tela e que
        decide tirá-la do fluxo e por o campo de edicao no lugar. Isso evita a
        resposta em que a mesma avaliacao vem duas vezes.

        **Texto vazio e normal.** Quem deu so a nota tem `body` nulo, e a lista
        o inclui -- a nota e a avaliacao, e o texto e o opcional (decisao do
        cliente, 18/10).
      security:
        - bearerAuth: []
      x-rate-limit:
        - dimension: [account]
          limit: 300
          window: 1h
          on_exceed: deny_429
          note: "mesma folha da pagina do local, e paginada: quem rola a lista gasta mais de uma chamada por local"
      parameters:
        - name: sort
          in: query
          description: |
            `recent` e o padrao, e e o padrao de proposito: numa pagina sem
            historico a avaliacao de ontem informa mais do que a melhor de
            2026. `rating_desc` e `rating_asc` existem porque o cliente pediu o
            formato da Play Store, e la a ordenacao e um controle visivel.

            **Nao ha ordenacao por "mais util"**: nao ha voto de utilidade
            neste produto, e oferecer a ordem sem o voto ordenaria por nada.
          schema: { type: string, enum: [recent, rating_desc, rating_asc], default: recent }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        '200':
          description: Uma pagina de avaliacoes publicadas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectoryReviewPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /directory/entries/{slug}/reviews/me:
    parameters:
      - $ref: '#/components/parameters/DirectoryEntrySlug'
    put:
      operationId: putMyDirectoryEntryReview
      tags: [directory]
      x-effects: []
      summary: Grava a minha avaliacao deste local, ou atualiza a que ja escrevi
      description: |
        **`PUT` e nao `POST`, e a escolha e a regra de produto escrita no
        metodo.** O cliente decidiu "uma avaliacao por pessoa por local, que
        ela possa editar e apagar; enviar de novo ATUALIZA a dela, nao cria
        segunda". Com `POST` o segundo envio seria `409` e a tela precisaria de
        um segundo caminho ("ja existe, agora chame o outro verbo"); com `PUT`
        o segundo envio e a propria edicao. O banco cobra o mesmo com
        `UNIQUE (professional_id, author_user_id)`, entao a regra vale mesmo se
        esta prosa for ignorada.

        O corpo da resposta diz qual dos dois aconteceu em `created`, para a
        tela escolher entre "Avaliacao publicada" e "Avaliacao atualizada".

        ## Quem pode avaliar

        **Conta com E-MAIL CONFIRMADO**, a mesma regua que o cliente definiu
        para criar evento ("so usuarios com os dados validados conseguem criar
        eventos"). Sem canal verificado: **`409`
        `contact-channel-unverified`**, que e **o mesmo tipo de problema que
        criar encontro devolve** -- reusado de proposito, e nao um codigo novo:
        a regra e a mesma regra, e dois tipos para um conceito fariam o app
        decidir por dois caminhos onde ha um. O que muda e o texto, e ele
        precisa mudar ("confirme seu e-mail para propor um encontro" numa tela
        de avaliar local manda a pessoa para o lugar errado).

        **Este 409 e sobre QUEM CHAMA, nao sobre o recurso**, e por isso ele
        nao contradiz o ADR-0021. A regra de `404` daquele ADR protege a
        EXISTENCIA do recurso; aqui o recurso ja foi confirmado como existente
        pela leitura, e o que falta e um atributo da propria conta de quem
        pede. Responder `404` esconderia de alguem a razao pela qual o proprio
        botao dele nao funciona.

        **Na pratica isso e e-mail**, porque nada em `src/` grava
        `phone_verified_at`: a coluna existe e so e zerada. O predicado e o
        mesmo `OR` de `estadoParaCriarEncontro` (e-mail OU telefone
        verificado), copiado dele e nao escolhido aqui.

        **Visitante sem conta nao escreve e nao e surpreendido**: `401`, e a
        tela nem oferece o campo (ela sabe se ha sessao antes de desenhar).

        **A avaliacao APARECE NA HORA.** Nao ha fila de aprovacao, e a ausencia
        e decisao do cliente de 18/10, pedida com estas palavras: "onde ficara
        disponivel para outros usuarios, como acontece na playstore". **Nao
        confundir com a INDICACAO de um local novo**, que continua passando por
        revisao do administrador: aquela cria um negocio com nome e endereco,
        esta opina sobre um que ja esta no ar.

        O contrapeso de a publicacao ser imediata e a denuncia
        (`reportDirectoryEntryReview`) e a remocao pelo administrador
        (`removeAdminDirectoryReview`), que entram junto nesta mesma fatia
        exatamente porque isto fala de negocio real com nome e endereco.

        ## O TETO QUE NAO EXISTE, e a lacuna e declarada

        O teto acima e por CONTA (20/h). Ele impede uma conta de escrever em
        massa, e a unicidade `(local, autor)` ja limita a UMA avaliacao por
        pessoa por local -- entao uma conta so nao consegue empilhar notas
        contra um negocio.

        **O que ele NAO cobre e o ataque por MUITAS contas contra UM local.**
        Para isso o balde precisaria ser por ALVO, e nao por quem chama -- uma
        entrada `[directory_entry]` em `x-rate-limit`. Ela nao entrou porque
        `directory_entry` nao esta em `DIMENSOES_CONHECIDAS` de
        `src/shared/http/aplicacao-de-teto.ts`, e aquele arquivo e explicito
        sobre o que isso significa: **dimensao nova e decisao de politica, nao
        detalhe de rota.** Foi a mesma razao que manteve `q` fora do contrato
        ate 22/09.

        Inventar a dimensao aqui decidiria sozinho uma politica de plataforma
        -- e um teto por alvo tem um custo de produto real que precisa ser
        aceito por quem decide: um local que vira assunto legitimo (uma boa
        indicacao que circula num grupo) passa a recusar avaliacao de gente de
        boa-fe. **Fica relatado e nao resolvido.** Enquanto nao houver, a
        contencao desse caso e a denuncia e a remocao pelo administrador, que e
        humana e posterior.

        ## Avaliar perfil nao reivindicado e permitido

        Regra do ADR-0011, e nao uma brecha: "Avaliacao de perfil nao
        reivindicado e permitida e fica visivel: e o que da valor ao diretorio
        antes de os profissionais chegarem". Como hoje NENHUMA entrada e
        reivindicada, este e o unico caso que existe.
      security:
        - bearerAuth: []
      x-rate-limit:
        - dimension: [account]
          limit: 20
          window: 1h
          on_exceed: deny_429
          note: "VINTE por hora por conta, e o numero e baixo de proposito: isto escreve na reputacao publica de um negocio real, com nome e endereco. Uma pessoa honesta avalia um ou dois locais por sessao e reeditando o texto chega a cinco; quem quiser usar a rota como canal de spam contra um concorrente encosta no teto na primeira dezena. O balde e por CONTA e nao por IP porque a rota exige conta, e a conta exige e-mail confirmado -- o custo de conseguir um balde novo e um e-mail novo confirmado"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DirectoryReviewInput' }
      responses:
        '200':
          description: |
            A avaliacao gravada, ja publicada. `created` distingue a primeira
            da edicao.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectoryReviewWritten' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Sem canal de contato verificado
            (`contact-channel-unverified`). **O mesmo tipo e o mesmo status de
            `createNetworkEvent`**, porque e a mesma regra do cliente: so
            quem tem os dados validados escreve. Declarado em linha e nao como
            componente novo pelo mesmo motivo -- e assim que a operacao de
            encontro o declara, e um componente aqui criaria a segunda forma de
            dizer a mesma coisa.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

    delete:
      operationId: deleteMyDirectoryEntryReview
      tags: [directory]
      x-effects: []
      summary: Apaga a minha avaliacao deste local
      description: |
        **So a minha**, e o dono e resolvido na clausula `WHERE` e nao num
        ramo de permissao: a consulta apaga onde `author_user_id` e quem chama.
        Nao ha caminho em que esta rota alcance a avaliacao de outra pessoa,
        nem com o identificador dela na mao -- ela nao aceita identificador de
        avaliacao nenhum.

        **Apagar e do AUTOR, nunca do avaliado.** O ADR-0011 e explicito: o
        profissional "ganha direito de resposta publica, uma por avaliacao, e
        nunca o direito de apagar". Quem contesta denuncia, e quem remove e a
        moderacao, com o motivo na trilha. Esta rota nao abre aquela porta: o
        avaliado nao e o autor.

        **Idempotente.** Nao ter avaliacao e chamar isto devolve `204`, e nao
        `404`: o estado pedido ("eu nao tenho avaliacao aqui") e o estado
        final, e um erro aqui faria a tela tratar como falha um toque duplo no
        botao. O `404` fica reservado para o local que nao existe ou nao esta
        publicado.

        A media e a contagem do local caem junto, porque sao calculadas na
        consulta e nao guardadas (ver `DirectoryRating`).
      security:
        - bearerAuth: []
      x-rate-limit:
        - dimension: [account]
          limit: 20
          window: 1h
          on_exceed: deny_429
          note: "mesmo orcamento do PUT: apagar e regravar nao pode ser o caminho que contorna o teto de escrita"
      responses:
        '204': { description: Nao ha mais avaliacao minha neste local. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /directory/entries/{slug}/reviews/{reviewRef}/reports:
    parameters:
      - $ref: '#/components/parameters/DirectoryEntrySlug'
      - $ref: '#/components/parameters/DirectoryReviewRef'
    post:
      operationId: reportDirectoryEntryReview
      tags: [directory]
      x-effects: []
      summary: Denuncia uma avaliacao para a moderacao
      description: |
        O contrapeso de a avaliacao aparecer na hora. Sem ela, a unica resposta
        a uma avaliacao caluniosa sobre um negocio com nome e endereco seria
        esperar que alguem da equipe passasse por ali.

        **A denuncia NAO esconde a avaliacao**, e isso e deliberado: se
        esconder, uma denuncia e todo o custo de apagar a avaliacao de um
        concorrente, e o primeiro uso que alguem daria a esta rota seria esse.
        Ela enfileira para a moderacao, que decide e registra o motivo
        (ADR-0011). Quem remove e `removeAdminDirectoryReview`.

        **`202` e nao `200`**: o que esta rota promete e que o pedido foi
        recebido, nao que alguem ja olhou. Prometer decisao seria mentir sobre
        o que existe -- nao ha equipe de moderacao de plantao.

        **Denunciar duas vezes a mesma avaliacao nao duplica a fila** e
        tambem nao devolve erro: a segunda chamada responde `202` e incrementa
        a contagem de repeticao, igual a `conversation_reports` (migracao
        `20260928000009`). Erro aqui ensinaria a quem denuncia que ele ja
        denunciou, o que nao e informacao dele e nao muda nada.

        **A propria avaliacao nao pode ser denunciada por quem a escreveu**
        (`400`, `code: own_review`): quem quer tirar a sua do ar usa o
        `DELETE`, que e a porta certa e imediata.
      security:
        - bearerAuth: []
      x-rate-limit:
        - dimension: [account]
          limit: 20
          window: 24h
          on_exceed: deny_429
          note: "VINTE POR DIA por conta. Denuncia e um pedido de atencao humana, e um recurso escasso: vinte por dia e mais do que qualquer pessoa de boa-fe encontra, e pouco o bastante para que uma conta nao consiga encher a fila da moderacao sozinha. Janela de 24h e nao de 1h de proposito -- o abuso aqui e volume no dia, nao rajada no minuto"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DirectoryReviewReportInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /store/items:
    get:
      operationId: listStoreItems
      tags: [store]
      x-effects: [expensive_query]
      summary: A vitrine curada da Loja
      description: |
        A secao `Loja`: uma vitrine curada de produtos de parceiro, cada um com
        o link que abre a loja do parceiro. **A compra acontece la, nao aqui.**

        **E PUBLICA, e a divergencia em relacao a `listDirectoryEntries` e
        deliberada.** `Perto` exige conta porque `phone_e164` e `distance_m`
        sao o conteudo util dela, e o portao de contrato publico reprova os
        dois em operacao alcancavel sem conta. **A Loja nao tem nenhum dos
        dois.** Um item e titulo, resumo, imagem, preco de referencia e o link
        publico do parceiro -- tudo ja publicado no site dele. O criterio 24 da
        BICHUS-185 pede esta operacao publica por extenso, e a BICHUS-189
        repete: "a Loja e navegavel deslogado, entao a operacao nao exige
        conta". Autorizacao na clausula `WHERE` (ADR-0021), sem ramo
        privilegiado.

        **Nenhum UUID sai daqui.** A chave do item e a do parceiro sao o
        `slug`, e nao ha campo de UUID nesta resposta -- nem opcional, nem
        nulavel. O ADR-0010 item 6 proibe UUID interno em saida publica, e
        quem impede o engano nao e a boa vontade de quem escreve a consulta:
        `src/tools/portao-contrato-publico.ts` reprova qualquer campo
        `format: uuid` em operacao alcancavel sem conta (SEC-001).

        As tabelas tem, sim, identidade interna (`store_partners.id`,
        `store_items.id`), e ela e o alvo da chave estrangeira entre as duas
        (ADR-0024). Ela nunca e projetada. Separar as duas identidades e o
        desenho de `pets` e de `professionals`, e existe porque chave
        estrangeira sobre endereco publico e o que o criterio 2 da BICHUS-19
        proibe -- endereco publico e valor que muda e que sai impresso.

        **NAO EXISTE OPERACAO DE ESCRITA DE CATALOGO NESTE CONTRATO**, e a
        ausencia e o criterio 20 da BICHUS-185. A entrada de dados e a decisao
        9.6 de `api/contrato-de-escrita-do-diretorio.md`, pendente do cliente:
        catalogo versionado no repositorio (BICHUS-189) ou backoffice de outra
        esteira. Nos dois caminhos o esquema e o mesmo; no segundo a escrita
        nasce em `/v1/admin/...` como manda o ADR-0023.

        ## O preco de referencia, e o vencimento que o SERVIDOR aplica

        `price_amount` e **inteiro em centavos**, nunca ponto flutuante.
        Ele e **opcional**, e item sem preco e estado normal, nao lacuna.

        Quando ha preco, `price_currency` e `price_checked_at` vem junto,
        sempre -- e `price_checked_at` e a data em que uma PESSOA abriu a
        pagina do parceiro e leu aquele numero.

        **Passados 30 dias da consulta, o servidor OMITE o valor** e
        `price_status` vem `vencido`. Nao e a tela que esconde: se a regra
        morasse no aplicativo, um aparelho com build antigo mostraria preco
        vencido para sempre, e nao haveria como parar isso sem passar pela loja
        de aplicativos. O item **continua na vitrine**; o que some e o numero.

        **Nao ha preco riscado, "de/por", desconto nem comparacao** (criterio
        19): nao ha campo para nenhum deles, e um portao reprova se algum
        nascer.
      security: []
      x-rate-limit:
        - dimension: [ip]
          limit: 300
          window: 1h
          on_exceed: deny_429
          note: "vitrine publica: nao ha conta para contar, entao o teto e por IP, e generoso porque a aba recarrega a cada troca de filtro"
      parameters:
        - name: q
          in: query
          description: |
            Busca por texto em titulo e resumo, **no servidor**. A tela declara
            alcance de servidor por causa disto; filtrar em memoria os itens da
            pagina seria uma busca que funciona com 10 registros e mente com
            200.
          schema: { type: string, minLength: 2, maxLength: 80 }
        - name: category
          in: query
          description: |
            Filtra pelo PRIMEIRO nivel. Categoria inexistente ou inativa
            devolve a lista vazia, nao `400`: mesma regra de `tag`, para o
            link antigo continuar abrindo.
          schema: { $ref: '#/components/schemas/StoreCategory' }
        - name: subcategory
          in: query
          description: |
            Filtra pelo SEGUNDO nivel. **Independe de `category`**: mandar so
            `subcategory` e valido, e o par `(category, subcategory)` do item ja
            garante a coerencia. Subcategoria inexistente, inativa ou de outra
            categoria devolve lista vazia, nao `400`.
          schema: { $ref: '#/components/schemas/StoreSubcategory' }
        - name: species
          in: query
          description: |
            Itens que servem a esta especie, entre outras (ADR-0027 item 16).
            Declarado antes do codigo; o app so oferece o filtro depois de a
            implementacao existir.
          schema: { $ref: '#/components/schemas/Species' }
        - name: tag
          in: query
          description: '`slug` de uma tag ativa. Tag inexistente ou inativa devolve a lista vazia, nao 400: a tag some do vocabulario e o link antigo continua abrindo.'
          schema: { $ref: '#/components/schemas/Slug' }
        - name: sort
          in: query
          description: |
            `curadoria` e a ordem da vitrine, escolhida a mao, e e o default: a
            Loja e uma lista curada e a primeira coisa que ela comunica e a
            escolha. **Nao ha ordem por preco**, porque o preco e opcional e
            vence: a lista se reordenaria sozinha, e "do mais barato" e uma
            afirmacao comparativa que o criterio 19 proibe.
          schema: { type: string, enum: [curadoria, nome], default: curadoria }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      responses:
        '200':
          description: |
            Pagina da vitrine. `total` alimenta a linha de resumo da barra de
            listagem e `applied_filters` alimenta a distincao entre "a vitrine
            esta vazia" e "o seu recorte esvaziou a vitrine".
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreItemPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /store/tags:
    get:
      operationId: listStoreTags
      tags: [store]
      x-effects: []
      summary: As tags que o filtro da Loja oferece
      description: |
        As opcoes do grupo de filtro de tags do app: so tags **ativas** com
        pelo menos um item publicado, em ordem alfabetica, ate 40. O filtro e
        de lista fechada, sem campo digitavel (ADR-0027 item 16).
      security: []
      x-rate-limit:
        - dimension: [ip]
          limit: 300
          window: 1h
          on_exceed: deny_429
      responses:
        '200':
          description: O vocabulario visivel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreTagPage' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /store/taxonomy:
    get:
      operationId: getStoreTaxonomy
      tags: [store]
      x-effects: []
      summary: As categorias e subcategorias da Loja
      description: |
        O vocabulario dos DOIS niveis da categoria do produto: o codigo e o
        rotulo de cada categoria ativa, e as subcategorias ativas de cada uma,
        na ordem em que as telas devem oferece-las.

        **Existe porque categoria e subcategoria sao DADO, e nao `enum` do
        contrato** (decisao do cliente de 17/10: "dois niveis, com
        subcategorias como a petlove"). Com 14 categorias e 83 subcategorias,
        um `enum` aqui faria cada ajuste de vocabulario ser mudanca de contrato
        das quatro aplicacoes mais um APK novo, e nao teria onde expressar que
        a subcategoria pertence a uma categoria.

        **Mesma forma de `listStoreTags`, e nao de `getReferenceData`.** As duas
        servem vocabulario fechado da Loja, com o mesmo teto por `ip` e sem
        conta; `reference-data` e do modulo de pets, e lista fechada da Loja
        servida por ele cruzaria a fronteira de modulo que
        `src/architecture.rules.mjs` cobra.

        Cacheavel por 24 h, com `ETag`: a lista so muda por migracao, entao o
        revalidador barato existe de graca e o app deixa de rebaixar a mesma
        carga a cada abertura da aba.
      security: []
      x-rate-limit:
        - dimension: [ip]
          limit: 300
          window: 1h
          on_exceed: deny_429
      responses:
        '200':
          description: O vocabulario dos dois niveis.
          headers:
            Cache-Control: { schema: { type: string }, example: 'public, max-age=86400' }
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreTaxonomy' }
        '304': { description: O vocabulario nao mudou desde o `ETag` enviado. }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /store/items/{itemSlug}:
    parameters:
      - name: itemSlug
        in: path
        required: true
        description: O endereco publico do item.
        schema: { $ref: '#/components/schemas/Slug' }
    get:
      operationId: getStoreItem
      tags: [store]
      x-effects: []
      summary: Um item da vitrine, com todas as imagens
      description: |
        O detalhe do item: o mesmo `StoreItemSummary` da lista, mais **todas as
        imagens prontas**, na ordem do painel (ADR-0027 item 16).

        **A lista TAMBEM traz as imagens desde 17/10/2026**, em
        `StoreItemSummary.images` (campo aditivo e opcional, com `image_url`
        intocado), e a vitrine desenha carrossel com elas. O que este detalhe
        acrescenta ao resumo e `images` deixar de ser opcional -- aqui ele
        sempre sai. O paragrafo que estava aqui dizia que a lista trazia so a
        principal "para nao pesar a vitrine"; o peso real esta em BAIXAR as
        imagens, e nao em receber os enderecos delas, e quem resolve isso e o
        carregamento sob demanda no cliente.

        Publica, pela mesma razao de `listStoreItems`, e com as mesmas regras:
        nenhum UUID sai, e o preco vencido **sai sem valor**, com
        `price_status: vencido`. Item em rascunho, retirado, inexistente ou de
        parceiro inativo responde **404 nos quatro casos**, com o mesmo corpo
        (ADR-0021).
      security: []
      x-rate-limit:
        - dimension: [ip]
          limit: 300
          window: 1h
          on_exceed: deny_429
          note: "mesmo teto da lista: quem abre o detalhe veio dela"
      responses:
        '200':
          description: O item.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreItemDetail' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ADR-0025 emenda 3: a capa do encontro da comunidade. O encontro publica
  # direto e a capa e PUBLICA, entao a intencao de envio precisa existir fora do
  # painel. Mesma forma de `/media/pet-photo-intents`: o backend assina e nunca
  # recebe os bytes.
  /media/my-photo-intents:
    post:
      operationId: createMyPhotoUploadIntent
      security:
        - bearerAuth: []
      tags: [me]
      x-effects: [irreversible_write]
      summary: Pede as credenciais de upload direto da foto do proprio usuario
      description: |
        O backend assina a autorizacao de envio direto e **nunca recebe os
        bytes** (ADR-0007). O objeto nasce no armazenamento PRIVADO, com o
        prefixo `people/`, que e proprio e nao compartilhado com a `Loja`, a
        `Rede` nem o diretorio: foto de pessoa e foto de estabelecimento tem
        regimes de privacidade diferentes (ADR-0010), e prefixos separados sao o
        que permite uma politica de balde valer para uma e nao para a outra.

        `method` diz a forma: `POST` com `fields` ou `PUT` com `headers`
        assinados. O cliente **le o campo** em vez de presumir -- e o mesmo
        contrato de `createPetPhotoUploadIntent`, e o app reusa o envio que ja
        tem.

        **O envio e da CONTA.** `updateMe` so confirma `upload_id` cuja intencao
        e da propria conta (a conferencia esta na clausula `WHERE`), e
        `upload_id` de outra pessoa, de outro proposito, ja usado ou vencido e
        recusado com `400` (`code: upload_not_usable`), sem dizer qual dos casos
        ocorreu.

        **O teto e 5 MB e ele vale no SERVIDOR**: `byte_size` acima dele e
        recusado aqui, antes de qualquer assinatura, e a politica assinada leva o
        mesmo numero dentro dela -- e ela que impede o envio direto ao
        armazenamento de passar por cima da recusa. A tela diz o numero tambem,
        mas a tela nao e a regra.

        Dimensao minima 300 x 300: `width`/`height` sao opcionais e, quando vem
        abaixo dela, respondem `422 image-too-small` **antes** de assinar. Quem
        decide de verdade e o worker, nos bytes.

        **Autorizar nao reserva nada.** A intencao que ninguem confirma vence em
        dez minutos e o varredor a recolhe; conta sem foto e estado normal
        (`Me.photo` nulo).

        **Quem ve a foto: so o dono.** Ela sai em `getMe` e em nenhuma outra
        resposta. O selo de validado nao e enviado nem escolhido aqui -- ele e
        `Me.email_verified`.
      x-rate-limit:
        - dimension: [account]
          limit: 20
          window: 1h
          on_exceed: deny_429
          note: "o mesmo teto de createPetPhotoUploadIntent: assinar e barato, mas cada assinatura e uma autorizacao de escrita que nao se desfaz"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MyPhotoIntentInput' }
      responses:
        '201':
          description: Credenciais de upload, validas por 10 minutos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadIntent' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '422': { $ref: '#/components/responses/ImageTooSmall' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /media/network-event-cover-intents:
    post:
      operationId: createNetworkEventCoverUploadIntent
      security:
        - bearerAuth: []
      tags: [network]
      x-effects: [irreversible_write]
      summary: Pede as credenciais de upload direto da capa do encontro
      description: |
        O backend assina a autorizacao de envio direto e **nunca recebe os
        bytes** (ADR-0007). O objeto nasce no armazenamento PRIVADO, com o
        prefixo `events/` que a superficie administrativa ja usa; a derivada
