# Contrato da API do Bichu. Escrito ANTES do codigo: e ele que destrava backend
# e mobile para correrem em paralelo. Mudanca incompativel exige /v2, nunca
# alteracao silenciosa.
#
# Status: em revisao
# Atualizado: 2026-09-17
openapi: 3.1.0

info:
  title: Bichu API
  version: 1.0.0-rc.1
  summary: Identidade digital do pet, tag QR e rede local de perdido e achado.
  description: |
    Contrato unico entre o app Flutter, a rota publica HTML e o backend.

    ## Regra de acesso

    O app e navegavel deslogado; as **acoes** e que exigem conta. Cada operacao
    declara `security` explicitamente:

    - `security: []` — publica, sem token.
    - `bearerAuth` — exige conta.
    - `bearerAuth` + `[]` — autenticacao **opcional**: a resposta muda se houver
      token (por exemplo, o dono da tag ve o modo dono).
    - `tagCode` — a posse do codigo impresso na tag e a credencial. Nao exige
      conta. E a excecao permanente: quem esta com a plaquinha na mao esta com
      o animal.
    - `finderToken` — token opaco entregue a quem avisou o tutor sem ter conta,
      para voltar a mesma conversa. Escopo de uma conversa so.

    **Regra que vale para toda resposta a chamador com `tagCode` ou
    `finderToken`: nenhum UUID interno sai** (SEC-001). Nesses contextos os
    campos `id` sao omitidos, e o endereco e o token. UUIDv7 e ordenavel e
    carrega o instante de criacao em milissegundos: publicar dois deles entrega
    de graca a taxa de criacao de registros da plataforma inteira. As rotas do
    achador ficam sob `/finder/...` e **nao tem id no caminho**, o que elimina
    o arranjo de BOLA em vez de depender de a verificacao estar correta.

    ## Erros

    Todo erro responde `application/problem+json` conforme a RFC 9457. O campo
    `type` e uma URI estavel sob `https://{dominio}/problems/`; o app decide o
    comportamento por ele, **nunca** pelo texto de `title` ou `detail`.

    ## Idempotencia

    Operacoes de criacao com efeito colateral aceitam o cabecalho
    `Idempotency-Key`. Repetir a mesma chave dentro de 24 h devolve a resposta
    original em vez de criar de novo. E obrigatorio no aviso do achador, que e
    reenviado por fila offline.

    ## Paginacao

    Dois padroes, deliberadamente diferentes:

    - Listagem publica de perdidos: **paginacao numerada** com total, porque a
      tela precisa dizer "1 a 20 de 87" e permitir chegar ao fim.
    - Listagens internas de volume aberto (mensagens, eventos): **cursor**.

    ## Limite de chamadas

    Declarado por operacao na extensao `x-rate-limit`, **estruturada**, com a
    politica de `docs/04-seguranca.md` como fonte. Cada entrada tem:

    - `dimension`: **lista** de chaves que compoem o balde. Uma lista com dois
      itens e um **par**: `[ip, code]` conta por combinacao de IP e codigo, e
      nao por IP nem por codigo isoladamente. A dimensao de par nao e detalhe:
      o CGNAT das operadoras moveis brasileiras faz centenas de assinantes sem
      relacao nenhuma compartilharem o mesmo IPv4, entao teto por IP numa rota
      acessada da rua bloquearia o achador legitimo por causa do vizinho. O par
      mede o que interessa, que e a mesma pessoa insistindo no mesmo pet, e e
      imune ao CGNAT.
    - `limit` e `window`.
    - `counts`: **o que** e contado. `requests` (padrao),
      `distinct_identities`, `distinct_cases`, `distinct_emails`. Sem este
      campo, `limit: 3` numa dimensao de conta se leria como tres mensagens
      quando o que a politica quer dizer e tres **casos distintos**.
    - `applies_to`: **quais** requisicoes entram na conta. Padrao, todas;
      `invalid_attempts` conta so as que falharam.
    - `on_exceed`: o que acontece ao estourar. **E este campo que separa
      orcamento de requisicao de orcamento de efeito.**

    Valores de `on_exceed`:

    | Valor | Aceita e grava? | Notifica? | Revisao humana? |
    |---|---|---|---|
    | `serve_cache` | responde do cache, sem consultar o banco e sem nova linha de trilha | — | nao |
    | `challenge` | sim, com desafio reCAPTCHA v3 na proxima carga | normal | nao |
    | `log_and_alert` | sim | normal | nao, mas alerta o plantao |
    | `group_notification` | sim | **agrupa**, anexando ao aviso ou a conversa existente | nao |
    | `notify_once_and_review` | sim | **uma vez, em resumo** | **sim** |
    | `notify_owner` | sim | avisa o tutor, com a opcao de revogar o codigo | nao |
    | `hold_for_review` | sim | **nao notifica ninguem** | **sim** |
    | `accept_and_deduplicate` | sim | a tela confirma **normalmente** | sim, anexado ao item de fila ja aberto |
    | `accept_and_defer_dispatch` | sim, o recurso e criado | **o disparo fica retido**, e a tela diz isso | sim |
    | `raise_queue_priority` | sim | — | **sim, com prioridade**, e **nunca age sobre o alvo** |
    | `deny_429` | **nao**: recusa com `Retry-After` | — | nao |

    **`challenge` so existe onde ha uma pessoa diante de uma tela.** Operacao
    chamada em segundo plano, por biblioteca ou pelo sistema operacional —
    renovacao de token, arquivo de associacao, JWKS — leva `log_and_alert`,
    nunca `challenge` nem `deny_429`. Nao ha quem responda ao desafio, entao o
    efeito real nao e desafiar: **e a sessao morrer em silencio**, e o usuario
    descobre no dia em que abre o app com o pet sumido. Essas operacoes
    declaram `x-no-challenge: true`.

    **`when`** restringe a entrada a um estado do recurso (`pet_lost`,
    `pet_not_lost`). Existe porque o mesmo numero pode ser protecao num estado e
    dano no outro: muita gente lendo a plaquinha de um pet **perdido** e a rede
    funcionando.

    **`notify_once_and_review` e `hold_for_review` existem separados de
    proposito, e a confusao entre os dois ja aconteceu neste contrato.** Um
    alerta e nenhum alerta sao resultados diferentes, e o teste que verifica
    "o tutor recebeu um resumo" reprova contra o codigo que nao notificou
    ninguem. Os dois casos do produto sao mesmo diferentes: muita gente
    avisando sobre **o mesmo pet** e sinal de que o animal apareceu, entao o
    tutor precisa saber, uma vez; **uma conta abordando tutores diferentes em
    serie** e o padrao do falso achador, e ai avisar os tutores e ajudar o
    golpe a chegar.

    **Dois invariantes do produto, e eles valem sobre qualquer numero desta
    especificacao:**

    1. **Nenhum aviso ao tutor e descartado por limite.** O que se agrupa e o
       push. Um `429` no unico toque que o produto existe para receber e um
       defeito pior do que o abuso que evitaria.
    2. **O primeiro aviso de uma identidade para um codigo passa sempre**, sem
       excecao e sem desafio.

    O limite e aplicado na borda e **revalidado no servico**: o servico nunca
    confia que o gateway ja filtrou.
  contact:
    name: Squad Bichu
  license:
    name: Proprietario

servers:
  - url: https://api.{dominio}/v1
    description: Producao
    variables:
      dominio:
        default: dominio-a-definir.com.br
  - url: https://api.hml.{dominio}/v1
    description: Homologacao
    variables:
      dominio:
        default: dominio-a-definir.com.br
  - url: http://localhost:3000/v1
    description: Ambiente local

tags:
  - name: auth
    description: Conta, sessao, verificacao de e-mail e senha.
  - name: me
    description: Perfil do usuario autenticado, aparelhos e localizacao.
  - name: pets
    description: Pets do tutor, fotos, slug e transferencia.
  - name: tags
    description: Codigos de tag QR — emissao, revogacao e resolucao publica.
  - name: lost
    description: Casos de pet perdido, alerta e encerramento.
  - name: found
    description: Avisos vindos da tag e achados avulsos.
  - name: conversations
    description: Contato mediado entre tutor e achador.
  - name: public
    description: Superficie publica, listagem de perdidos e dados de referencia.
  - name: web
    description: Rotas HTML servidas pelo proprio backend.
  - name: ops
    description: Saude, versao e metadados de identidade.

security:
  - bearerAuth: []

paths:

  # ----------------------------------------------------------------------
  # Identidade
  # ----------------------------------------------------------------------

  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      x-effects: [notifies, verifies_secret]
      summary: Cria a conta com e-mail e senha
      description: |
        A conta nasce **incompleta de proposito**: e-mail ainda nao verificado e
        telefone ausente. Exigir verificacao antes de cadastrar o pet derruba a
        conversao do unico cadastro que importa.

        Responde ja com o par de tokens, porque a intencao pendente do usuario
        precisa ser executada logo apos o cadastro.
      security: []
      x-rate-limit:
        - dimension: [ip]
          limit: 5
          window: 1h
          on_exceed: challenge
        - dimension: [ip_24]
          limit: 30
          window: 1h
          on_exceed: challenge
          note: "SEC-003, o desafio e verificado ANTES da consulta de unicidade"
        - dimension: [origin]
          counts: distinct_emails
          limit: 50
          window: 24h
          on_exceed: log_and_alert
          note: "acima de 200 a origem e bloqueada"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            examples:
              minimo:
                summary: O minimo aceito
                value: { email: "marina@exemplo.com.br", password: "girassol-de-agosto-9" }
      responses:
        '201':
          description: Conta criada e sessao aberta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '409':
          description: Ja existe conta com este e-mail.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                emailEmUso:
                  value:
                    type: https://dominio-a-definir.com.br/problems/email-already-registered
                    title: E-mail ja cadastrado
                    status: 409
                    detail: Existe uma conta com este e-mail. Entre em vez de criar outra.
                    correlation_id: 018f7c1e-7a2b-7c3d-9e4f-2b1a0c9d8e7f
        '422': { $ref: '#/components/responses/WeakPassword' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      x-effects: [verifies_secret]
      summary: Abre sessao
      security: []
      x-rate-limit:
        - dimension: [email]
          limit: 5
          window: 1h
          on_exceed: challenge
        - dimension: [ip]
          limit: 10
          window: 1h
          on_exceed: challenge
        - dimension: [ip_24]
          limit: 100
          window: 1h
          on_exceed: log_and_alert
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sessao aberta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401':
          description: |
            Credencial invalida. A resposta e **identica** para e-mail
            inexistente e senha errada: nao revela se a conta existe.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      x-effects: [verifies_secret]
      summary: Renova o par de tokens
      x-rate-limit:
        - dimension: [token_family]
          limit: 10
          window: 1m
          on_exceed: deny_429
          note: "a dimensao certa e a credencial, nao a rede: rotacao normal e uma a cada 15 min, e rajada na mesma familia e corrida ou reuso"
        - dimension: [ip]
          limit: 500
          window: 1h
          on_exceed: log_and_alert
          applies_to: invalid_attempts
          note: "APENAS tentativas invalidas, e APENAS alerta. A defesa real contra reuso e a deteccao por familia, que revoga; teto por IP aqui so acerta quem esta atras do mesmo CGNAT"
        - dimension: [ip]
          limit: 2000
          window: 1h
          on_exceed: log_and_alert
          note: "teto de observacao sobre renovacoes validas, alto de proposito e sem acao: centenas de assinantes moveis dividem o mesmo IPv4"

      x-no-challenge: true
      description: |
        Rotacao obrigatoria: cada refresh token vale **uma** vez e a resposta
        traz um novo. Apresentar um token ja consumido revoga a familia inteira
        e responde 401 — e assim que o roubo de token e detectado.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string, minLength: 20, maxLength: 512 }
      responses:
        '200':
          description: Novo par emitido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401':
          description: Token invalido, expirado ou reutilizado.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      x-effects: []
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
      summary: Encerra a sessao e revoga a familia de refresh
      responses:
        '204': { description: Sessao encerrada. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/email-verification:
    post:
      operationId: requestEmailVerification
      tags: [auth]
      x-effects: [notifies]
      summary: Reenvia o e-mail de verificacao
      description: Responde sempre 202, exista ou nao a conta.
      security:
        - bearerAuth: []
        - {}
      x-rate-limit:
        - dimension: [account]
          limit: 3
          window: 1h
          on_exceed: deny_429
        - dimension: [ip]
          limit: 10
          window: 1h
          on_exceed: challenge
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/email-verification/confirm:
    post:
      operationId: confirmEmailVerification
      tags: [auth]
      x-effects: [verifies_secret]
      x-rate-limit:
        - dimension: [ip]
          limit: 20
          window: 1h
          on_exceed: deny_429
          applies_to: invalid_attempts
          note: "o token tem 256 bits e nao e adivinhavel; o limite existe por defesa em profundidade e para nao servir de oraculo"
      summary: Confirma o e-mail pelo token recebido
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 20
                  maxLength: 256
                  description: |
                    256 bits de CSPRNG, guardado apenas como SHA-256, **uso
                    unico consumido atomicamente**, validade de **24 horas**
                    (SEC-005). A confirmacao e sempre `POST` disparado por um
                    botao numa pagina, nunca `GET` na URL do e-mail: varredor de
                    link de antivirus e previsualizacao de mensageiro consomem o
                    token antes da pessoa.
      responses:
        '200':
          description: |
            E-mail verificado. Devolve a sessao quando a requisicao veio sem
            token de acesso, para que a intencao pendente execute em seguida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '410': { $ref: '#/components/responses/TokenExpired' }

  /auth/password-reset:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      x-effects: [notifies]
      summary: Pede o e-mail de redefinicao de senha
      description: |
        Responde **sempre** 202 com o mesmo corpo, exista ou nao a conta. Pedir
        de novo invalida o token anterior.
      security: []
      x-rate-limit:
        - dimension: [email]
          limit: 3
          window: 1h
          on_exceed: deny_429
        - dimension: [ip]
          limit: 10
          window: 1h
          on_exceed: challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [auth]
      x-effects: [verifies_secret, notifies, irreversible_write]
      x-rate-limit:
        - dimension: [ip]
          limit: 20
          window: 1h
          on_exceed: deny_429
          applies_to: invalid_attempts
          note: "o token tem 256 bits e nao e adivinhavel; o limite existe por defesa em profundidade e para nao servir de oraculo"
      summary: Define a nova senha pelo token
      description: Revoga todas as sessoes ativas da conta.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token:
                  type: string
                  minLength: 20
                  maxLength: 256
                  description: |
                    256 bits de CSPRNG, guardado apenas como SHA-256, **uso
                    unico consumido atomicamente**, validade de **30 minutos**
                    (SEC-005). Sempre `POST`, nunca `GET` na URL do e-mail.
                new_password: { $ref: '#/components/schemas/Password' }
      responses:
        '204':
          description: |
            Senha alterada. **Todas as sessoes sao invalidadas em menos de um
            segundo** (SEC-006), nao em 15 minutos, e um e-mail de aviso vai
            para o endereco da conta: e o unico canal pelo qual o dono legitimo
            descobre uma tomada de conta.
        '410': { $ref: '#/components/responses/TokenExpired' }
        '422': { $ref: '#/components/responses/WeakPassword' }

  /auth/reauth:
    post:
      operationId: reauthenticate
      tags: [auth]
      x-effects: [verifies_secret]
      summary: Reautentica com a senha e abre a janela de operacao destrutiva
      description: |
        As quatro operacoes destrutivas do produto — excluir a conta, exportar
        os dados, transferir o pet e revogar a tag — exigem a senha de novo, e
        **nao a pedem cada uma do seu jeito**. Esta e a unica operacao do
        sistema que verifica a senha de um usuario ja autenticado, e devolve um
        `reauth_token` de **5 minutos** que as outras aceitam no cabecalho
        `X-Reauth-Token`.

        Concentrar aqui tem tres consequencias, e as tres sao o motivo do
        desenho: a senha trafega para **um** endpoint em vez de quatro; o limite
        contra forca bruta existe em **um** lugar; e `DELETE /me` nao precisa de
        corpo, o que evita a requisicao com corpo em DELETE que proxy e
        biblioteca tratam de formas diferentes.

        O token e opaco, guardado como hash, preso ao usuario e a sessao, e
        invalidado por troca de senha, logout e `sessions_invalid_before`.
      x-rate-limit:
        - dimension: [account]
          limit: 10
          window: 1h
          on_exceed: deny_429
        - dimension: [account]
          limit: 5
          window: 1h
          on_exceed: deny_429
          applies_to: invalid_attempts
          note: "senha errada cinco vezes fecha a janela destrutiva por uma hora, sem derrubar a sessao normal"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, scope]
              properties:
                password: { type: string, maxLength: 256 }
                scope:
                  type: string
                  enum: [account_deletion, data_export, pet_transfer, tag_revocation]
                  description: |
                    A finalidade unica deste token. Apresenta-lo em operacao de
                    outro escopo responde 401, e nao 403: a janela para aquela
                    finalidade simplesmente nao foi aberta.
      responses:
        '200':
          description: Janela aberta.
          content:
            application/json:
              schema:
                type: object
                required: [reauth_token, expires_in]
                properties:
                  reauth_token: { type: string }
                  expires_in: { type: integer, example: 300 }
                  scope: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password:
    put:
      operationId: changePassword
      tags: [auth]
      x-effects: [verifies_secret, notifies]
      x-rate-limit:
        - dimension: [account]
          limit: 10
          window: 1h
          on_exceed: deny_429
          note: "verifica `current_password`: sem limite, um token de acesso roubado vira oraculo de senha"
        - dimension: [account]
          limit: 5
          window: 1h
          on_exceed: deny_429
          applies_to: invalid_attempts
      summary: Troca a senha com a senha atual
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, maxLength: 256 }
                new_password: { $ref: '#/components/schemas/Password' }
      responses:
        '204': { description: Senha alterada. Demais sessoes revogadas. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/WeakPassword' }

  # ----------------------------------------------------------------------
  # Perfil, aparelhos, localizacao
  # ----------------------------------------------------------------------

  /me:
    get:
      operationId: getMe
      tags: [me]
      x-effects: []
      summary: Perfil do usuario autenticado
      description: |
        `pending_profile_fields` alimenta o aviso persistente de cadastro
        incompleto. `can_open_lost_case` resume, em um booleano, a regra de
        bloqueio: so abre caso quem tem um canal de contato verificado.
      responses:
        '200':
          description: Perfil.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      operationId: updateMe
      tags: [me]
      x-effects: []
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
      summary: Completa ou corrige os dados do perfil
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeUpdate' }
      responses:
        '200':
          description: Perfil atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: deleteMyAccount
      tags: [me]
      x-effects: [irreversible_write, verifies_secret, notifies]
      x-rate-limit:
        - dimension: [account]
          limit: 3
          window: 24h
          on_exceed: deny_429
      summary: Pede a exclusao da conta (LGPD, art. 18)
      description: |
        Exclusao logica imediata, expurgo definitivo em 30 dias. Casos abertos
        sao encerrados e as tags, revogadas.
      security:
        - bearerAuth: []
          reauth: []
      x-reauth-scope: account_deletion
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/email-change:
    post:
      operationId: requestEmailChange
      tags: [me]
      x-effects: [notifies]
      summary: Pede a troca do e-mail da conta
      description: |
        **Responde sempre 202**, esteja o novo endereco em uso ou nao (SEC-003):
        aceitar a troca em `PATCH /me` faria a resposta revelar se um endereco ja
        tem conta, anulando a opacidade que o login e a recuperacao mantem.

        A verificacao vai para o **endereco novo**; o e-mail da conta so muda
        quando ela e confirmada. Um aviso vai tambem para o endereco antigo.
      x-rate-limit:
        - dimension: [account]
          limit: 5
          window: 24h
          on_exceed: deny_429
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_email]
              properties:
                new_email: { type: string, format: email, maxLength: 254 }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /me/data-export:
    post:
      operationId: requestDataExport
      tags: [me]
      x-effects: [verifies_secret, human_work]
      summary: Pede a copia dos dados pessoais (LGPD, art. 18, V)
      x-rate-limit:
        - dimension: [account]
          limit: 1
          window: 24h
          on_exceed: deny_429
      security:
        - bearerAuth: []
          reauth: []
      x-reauth-scope: data_export
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '401': { $ref: '#/components/responses/ReauthRequired' }

  /me/devices:
    get:
      operationId: listDevices
      tags: [me]
      x-effects: []
      summary: Aparelhos registrados para push
      responses:
        '200':
          description: Lista de aparelhos.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: registerDevice
      tags: [me]
      x-effects: []
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
      summary: Registra ou atualiza o token de push do aparelho
      description: |
        Idempotente por `push_token`. Quando o usuario negou a permissao, o
        aparelho e registrado assim mesmo com `push_permission: denied` — e
        esse registro que permite contar quantos tutores sao de fato
        alcancaveis, que e a metrica que decide se o alerta toca em alguem.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceRegistration' }
      responses:
        '200':
          description: Aparelho registrado ou atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/devices/{deviceId}:
    delete:
      operationId: deleteDevice
      tags: [me]
      x-effects: []
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
      summary: Remove o aparelho (usado no logout)
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '204': { description: Removido. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/location:
    get:
      operationId: getMyLocation
      tags: [me]
      x-effects: []
      summary: Ultima localizacao de referencia conhecida
      responses:
        '200':
          description: |
            Localizacao quantizada. `null` quando nunca foi informada ou quando
            ja expirou.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserLocation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: putMyLocation
      tags: [me]
      x-effects: []
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
      summary: Informa a localizacao de referencia
      description: |
        O servidor **quantiza para uma grade de cerca de 100 m** antes de
        gravar e nao guarda historico: existe uma linha por usuario, sempre a
        ultima. Precisao maior nao melhora um raio de 5 km e so aumenta o dano
        de um vazamento.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserLocationInput' }
      responses:
        '200':
          description: Localizacao gravada (ja quantizada na resposta).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserLocation' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: deleteMyLocation
      tags: [me]
      x-effects: []
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
      summary: Apaga a localizacao de referencia
      description: Deixa de receber alerta geolocalizado a partir da proxima consulta.
      responses:
        '204': { description: Apagada. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ----------------------------------------------------------------------
  # Pets
  # ----------------------------------------------------------------------

  /pets:
    get:
      operationId: listMyPets
      tags: [pets]
      x-effects: []
      summary: Meus pets
      responses:
        '200':
          description: Lista completa, sem paginacao. O teto e 20 pets por conta.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Pet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createPet
      tags: [pets]
      x-effects: []
      x-rate-limit:
        - dimension: [account]
          limit: 10
          window: 24h
          on_exceed: deny_429
      summary: Cadastra um pet
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PetInput' }
            examples:
              nina:
                value:
                  name: Nina
                  species: dog
                  size: M
                  primary_color: caramelo
                  sex: female
                  neutered: true
                  distinctive_marks: Mancha branca no peito e coleira vermelha.
      responses:
        '201':
          description: Pet criado.
          headers:
            Location: { schema: { type: string, format: uri-reference } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/PetLimitReached' }

  /pets/{petId}:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      operationId: getPet
      tags: [pets]
      x-effects: []
      summary: Detalhe do pet (visao do dono)
      responses:
        '200':
          description: Pet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updatePet
      tags: [pets]
      x-effects: []
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
      summary: Edita o pet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PetInput' }
      responses:
        '200':
          description: Pet atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deletePet
      tags: [pets]
      x-effects: [irreversible_write]
      x-rate-limit:
        - dimension: [account]
          limit: 10
          window: 24h
          on_exceed: deny_429
      summary: Exclui o pet
      description: |
        Exclusao logica. Revoga todas as tags do pet e encerra caso aberto. A
        rota publica do codigo passa a responder "tag desativada", nunca 404 —
        a diferenca importa para quem esta com o animal na mao.
      responses:
        '204': { description: Excluido. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /pets/{petId}/photos:
    parameters:
      - $ref: '#/components/parameters/PetId'
    post:
      operationId: confirmPetPhoto
      tags: [pets]
      x-effects: [irreversible_write]
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
      summary: Confirma o upload de uma foto ja enviada ao armazenamento
      description: |
        Chamada depois que o cliente enviou os bytes direto ao armazenamento de
        objeto com as credenciais de `photo-upload-intent`. **E esta chamada que
        enfileira o processamento**: o produto nao depende de notificacao de
        bucket, que e recurso que varia de provedor. Upload nunca confirmado e
        varrido pela expiracao da intencao.

        O backend valida os bytes reais, remove todo o EXIF (inclusive GPS) e
        gera as derivadas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [upload_id]
              properties:
                upload_id: { type: string, format: uuid }
                set_as_primary: { type: boolean, default: true }
      responses:
        '202':
          description: |
            Aceita para processamento. A foto nasce com
            `status: processing` e so serve a rota publica quando vira `ready`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PetPhoto' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }

  /pets/{petId}/photo-upload-intent:
    parameters:
      - $ref: '#/components/parameters/PetId'
    post:
      operationId: createPetPhotoUploadIntent
      tags: [pets]
      x-effects: [irreversible_write]
      summary: Pede as credenciais de upload direto para o armazenamento
      description: |
        O backend nunca recebe os bytes da imagem: ele assina a requisicao de
        upload para o armazenamento privado, com tipo e tamanho limitados.

        `method` diz a forma: `POST` com `fields` (politica de formulario, que
        e o caminho de hoje em MinIO e S3) ou `PUT` com `headers` assinados,
        para o provedor que nao suportar politica de POST. O cliente **le o
        campo** em vez de presumir a forma.
      x-rate-limit:
        - dimension: [account]
          limit: 20
          window: 1h
          on_exceed: deny_429
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadIntentInput' }
      responses:
        '201':
          description: Credenciais de upload, validas por 10 minutos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadIntent' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }

  /pets/{petId}/photos/{photoId}:
    parameters:
      - $ref: '#/components/parameters/PetId'
      - $ref: '#/components/parameters/PhotoId'
    delete:
      operationId: deletePetPhoto
      tags: [pets]
      x-effects: [irreversible_write]
      x-rate-limit:
        - dimension: [account]
          limit: 30
          window: 1h
          on_exceed: deny_429
      summary: Remove a foto
      responses:
        '204': { description: Removida. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            E a unica foto de um pet com caso aberto. Sem foto o alerta nao
            funciona, entao a remocao e barrada enquanto o caso existir.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /pets/{petId}/public-profile:
    parameters:
      - $ref: '#/components/parameters/PetId'
    put:
      operationId: updatePetPublicProfile
      tags: [pets]
      x-effects: []
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
      summary: Liga ou desliga o perfil publico e define o endereco (@slug)
      description: |
        O perfil publico e **opt-in** e nasce desligado. Desligar nao apaga o
        slug: ele continua reservado para o pet, e a rota responde 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                slug: { $ref: '#/components/schemas/Slug' }
                public_enabled: { type: boolean }
      responses:
        '200':
          description: Perfil publico atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Slug ja usado ou reservado.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /pets/{petId}/transfer:
    parameters:
      - $ref: '#/components/parameters/PetId'
    post:
      operationId: startPetTransfer
      tags: [pets]
      x-effects: [notifies, verifies_secret]
      summary: Inicia a transferencia do pet para outro tutor
      description: |
        **Transferir e a operacao mais destrutiva do produto**: consumar revoga
        **todas** as tags do pet, e a plaquinha que esta na coleira deixa de
        resolver. Por isso a credencial que a autoriza nao pode ser um codigo
        curto protegido por limite de chamadas. Limite de chamadas e a defesa
        errada para isso, e trata-lo como defesa e o que mantem a credencial
        fraca.

        Quatro camadas, e nenhuma delas e o teto de requisicoes:

        1. **Reautenticacao com senha** (`X-Reauth-Token`).
        2. **Vinculo com o destinatario**: o tutor informa o e-mail de quem vai
           receber, e so a conta com aquele e-mail **verificado** consegue
           aceitar. O token nao serve a quem o encontrar.
        3. **Token de 256 bits**, entregue **somente por e-mail** ao
           destinatario, guardado como hash, uso unico, validade de 72 h. Ele
           nao aparece nesta resposta.
        4. **Janela de 24 h cancelavel**: aceitar nao consuma. Os dois lados sao
           avisados, o tutor atual pode cancelar, e so depois a posse muda e as
           tags sao revogadas.
      security:
        - bearerAuth: []
          reauth: []
      x-reauth-scope: pet_transfer
      x-rate-limit:
        - dimension: [account]
          limit: 5
          window: 24h
          on_exceed: deny_429
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient_email]
              properties:
                recipient_email:
                  type: string
                  format: email
                  description: |
                    Precisa ser de uma conta com e-mail verificado. A resposta e
                    a mesma exista ou nao a conta, para nao virar oraculo de
                    cadastro; se nao existir, o convite explica como criar.
      responses:
        '202':
          description: |
            Convite enviado ao destinatario. **A resposta nao traz o token**: ele
            vai por e-mail, para que a posse do aparelho do tutor atual nao
            baste para transferir o pet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PetTransfer' }
        '401': { $ref: '#/components/responses/ReauthRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Pet com caso aberto, ou transferencia ja em andamento.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /pets/transfers/{transferId}/cancel:
    parameters:
      - name: transferId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: cancelPetTransfer
      tags: [pets]
      x-effects: [notifies]
      summary: Cancela a transferencia antes de ela se consumar
      description: |
        Disponivel para o **tutor atual** durante toda a janela: do convite ate
        as 24 h seguintes ao aceite. Cancelar e a direcao segura, entao **nao
        exige reautenticacao** — o que exige senha e transferir, nao desistir.
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
      responses:
        '200':
          description: Cancelada. Nenhuma tag foi revogada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PetTransfer' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Ja consumada. Depois disso o caminho e transferir de volta.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /pets/transfers/accept:
    post:
      operationId: acceptPetTransfer
      tags: [pets]
      x-effects: [verifies_secret, notifies]
      x-rate-limit:
        - dimension: [account]
          limit: 10
          window: 1h
          on_exceed: deny_429
        - dimension: [ip]
          limit: 20
          window: 1h
          on_exceed: deny_429
          applies_to: invalid_attempts
          note: "o token tem 256 bits e vinculo com o destinatario; o teto aqui e higiene, nao a defesa"
      summary: Aceita a transferencia e inicia a janela de 24 h
      description: |
        Exige conta autenticada **cujo e-mail verificado seja o destinatario do
        convite**. Token valido apresentado por outra conta responde **403, nao
        410**: o token nao esta errado, quem apresenta e que nao e o
        destinatario.

        Aceitar **nao consuma**: abre a janela de 24 h. A posse so muda, e as
        tags so sao revogadas, quando ela fecha sem cancelamento.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 20
                  maxLength: 256
                  description: 256 bits de CSPRNG, uso unico, recebido por e-mail.
      responses:
        '200':
          description: |
            Aceite registrado. `effective_at` diz quando a posse muda; ate la
            nada foi revogado e o tutor atual pode cancelar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PetTransfer' }
        '403':
          description: O token e valido, mas nao e para esta conta.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '410': { $ref: '#/components/responses/TokenExpired' }

  # ----------------------------------------------------------------------
  # Tags QR
  # ----------------------------------------------------------------------

  /pets/{petId}/tags:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      operationId: listPetTags
      tags: [tags]
      x-effects: []
      summary: Tags do pet
      description: |
        **Nunca devolve o codigo em claro**, nem para o dono: apenas os quatro
        ultimos caracteres, para que ele consiga identificar a plaquinha fisica.
        Para reimprimir, use `qr.png`.
      responses:
        '200':
          description: Lista de tags.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PetTag' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: issuePetTag
      tags: [tags]
      x-effects: [reveals_credential, irreversible_write]
      summary: Emite um codigo de tag novo
      description: |
        Gera 128 bits de aleatoriedade criptografica, sem relacao com nenhum id
        do sistema. **Esta e a unica resposta que traz o codigo em claro.** O
        cliente nao deve persistir o valor: para reimprimir, chame `qr.png`.
      x-rate-limit:
        - dimension: [pet]
          limit: 10
          window: 24h
          on_exceed: deny_429
      responses:
        '201':
          description: Codigo emitido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PetTagIssued' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Teto de tags ativas por pet atingido (5).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /pets/{petId}/tags/{tagId}/qr.png:
    parameters:
      - $ref: '#/components/parameters/PetId'
      - $ref: '#/components/parameters/TagId'
    get:
      operationId: getPetTagQrImage
      tags: [tags]
      x-effects: [reveals_credential]
      x-rate-limit:
        - dimension: [account]
          limit: 30
          window: 1h
          on_exceed: deny_429
          note: "renderiza imagem e e a unica superficie que revela o codigo em claro: leitura autenticada, mas nem barata nem inocua"
      summary: Imagem do QR para impressao
      description: |
        PNG com margem de silencio e correcao de erro nivel Q, com a URL
        legivel impressa abaixo do codigo: e o unico caminho de recuperacao
        quando o scan falha.
      responses:
        '200':
          description: Imagem.
          content:
            image/png:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '410':
          description: Tag revogada. O QR nao e reimpresso.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /pets/{petId}/tags/{tagId}/revoke:
    parameters:
      - $ref: '#/components/parameters/PetId'
      - $ref: '#/components/parameters/TagId'
    post:
      operationId: revokePetTag
      security:
        - bearerAuth: []
          reauth: []
      x-reauth-scope: tag_revocation
      tags: [tags]
      x-effects: [irreversible_write, verifies_secret]
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
      summary: Revoga o codigo da tag
      description: |
        Irreversivel. A partir daqui o codigo responde "tag desativada" na rota
        publica, e o texto cifrado guardado para reimpressao e apagado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { $ref: '#/components/schemas/TagRevocationReason' }
      responses:
        '200':
          description: Tag revogada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PetTag' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tags/{code}:
    parameters:
      - $ref: '#/components/parameters/TagCode'
    get:
      operationId: resolveTagCode
      tags: [tags]
      x-effects: [irreversible_write]
      summary: Resolve o codigo da tag (F2 e F4)
      description: |
        **Publica.** A posse do codigo e a credencial. Com token de acesso do
        dono, devolve `viewer: owner` e o app abre o modo dono.

        O corpo devolvido e a visao publica minima: nada de telefone, e-mail,
        endereco, CEP, sobrenome do tutor, ponto exato, id interno do pet ou
        lista dos outros pets do mesmo tutor.

        O acesso e registrado com o IP **hasheado**, nunca em claro.
      security:
        - bearerAuth: []
        - {}
      x-rate-limit:
        - dimension: [ip, code]
          limit: 30
          window: 1h
          on_exceed: serve_cache
          note: "par: imune ao CGNAT"
        - dimension: [ip]
          limit: 300
          window: 1h
          on_exceed: challenge
          note: "nunca 429 para codigo valido"
        - dimension: [ip_24]
          limit: 2000
          window: 1h
          on_exceed: log_and_alert
        - dimension: [code]
          limit: 100
          window: 24h
          on_exceed: notify_owner
        - dimension: [finder_identity]
          limit: 5
          window: 10m
          on_exceed: deny_429
          applies_to: invalid_attempts
          note: "adivinhacao de codigo: unica recusa do fluxo. Retry-After 600, e a tela oferece o achado avulso. Conta 400 e 404 igualmente"
        - dimension: [ip]
          limit: 20
          window: 1h
          on_exceed: deny_429
          applies_to: invalid_attempts
      responses:
        '200':
          description: Codigo valido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagResolution' }
              examples:
                perdido:
                  summary: Pet marcado como perdido
                  value:
                    viewer: anonymous
                    pet:
                      display_name: Thor
                      species: dog
                      size: M
                      primary_color: preto e branco
                      distinctive_marks: Coleira vermelha.
                      photo_url: https://img.dominio-a-definir.com.br/p/9f3a.../card.webp
                    lost:
                      is_lost: true
                      since: '2026-09-16T18:20:00Z'
                    already_notified: false
        '400':
          description: |
            O texto **nao normaliza para um codigo**: tem tamanho diferente de
            26 depois da normalizacao, ou contem caractere fora do alfabeto
            (`U`, por exemplo). E erro de digitacao, e a tela pede para conferir
            e digitar de novo.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: |
            **Normalizou para um codigo bem formado que nao existe.** Este e o
            caso de codigo invalido, e nao de erro de formato: a pessoa digitou
            algo plausivel e nao ha tag com esse valor. **Diferente de
            revogado**, que e 410 e tem outra tela.

            Para quem esta na rua, a diferenca entre 400 e 404 e util e nao
            vaza nada: um diz "confira o que voce digitou", o outro diz "nao
            encontramos este codigo". Os dois contam igualmente para o limite de
            tentativas invalidas, que e a unica recusa do fluxo.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '410':
          description: |
            Tag revogada pelo tutor. A resposta traz o caminho alternativo, para
            que quem esta com o animal no colo nao chegue a um beco sem saida.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                revogada:
                  value:
                    type: https://dominio-a-definir.com.br/problems/tag-revoked
                    title: Tag desativada
                    status: 410
                    detail: Esta tag foi desativada pelo tutor.
                    next_action: register_stray_found_report
                    correlation_id: 018f7c1e-7a2b-7c3d-9e4f-2b1a0c9d8e7f
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ----------------------------------------------------------------------
  # Avisos do achador e achados avulsos
  # ----------------------------------------------------------------------

  /tags/{code}/found-reports:
    parameters:
      - $ref: '#/components/parameters/TagCode'
    post:
      operationId: createFoundReportFromTag
      tags: [found]
      x-effects: [notifies, irreversible_write]
      summary: Avisa o tutor a partir do codigo da tag
      description: |
        **A excecao permanente: nao exige conta.** E a operacao mais critica do
        produto e ela precisa funcionar com **corpo vazio** — um toque, zero
        campos. Data e hora sao do servidor; o codigo ja veio no caminho.

        Detalhes (onde, foto, recado, contato) chegam depois, por
        `PATCH /found-reports/{foundReportId}` com o `finder_token`.

        `Idempotency-Key` e **obrigatorio**: a pagina publica reenvia o pedido
        por fila do service worker quando a rede cai, e o tutor nao pode
        receber o mesmo aviso tres vezes.
      security:
        - tagCode: []
        - bearerAuth: []
      x-rate-limit:
        - dimension: [code, finder_identity]
          limit: 1
          window: 6h
          on_exceed: group_notification
          note: "anexa a conversa existente; o aviso nunca e descartado"
        - dimension: [code]
          counts: distinct_identities
          limit: 3
          window: 1h
          on_exceed: group_notification
        - dimension: [code]
          counts: distinct_identities
          limit: 10
          window: 24h
          when: pet_not_lost
          on_exceed: notify_once_and_review
          note: "dez pessoas escaneando a plaquinha de um pet que ninguem deu por falta e a plaquinha circulando sem o animal"
        - dimension: [code]
          counts: distinct_identities
          limit: 30
          window: 24h
          when: pet_lost
          on_exceed: notify_once_and_review
          note: "PET PERDIDO: onze pessoas escaneando a coleira de um cao solto num bairro movimentado e a rede funcionando, nao abuso. Reter ai faz o tutor receber um resumo em vez de saber que ha gente em cima do animal dele, no momento de maior chance de reencontro, e o comportamento e indistinguivel de uma protecao funcionando"
          note: "o tutor recebe UM alerta em vez de dez, e o codigo entra em revisao. Muita gente avisando sobre o mesmo pet costuma significar que o animal apareceu"
        - dimension: [ip, code]
          limit: 5
          window: 1h
          on_exceed: challenge
        - dimension: [ip]
          limit: 40
          window: 1h
          on_exceed: challenge
        - dimension: [ip_24]
          limit: 200
          window: 1h
          on_exceed: log_and_alert
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FoundReportFromTagInput' }
            examples:
              umToque:
                summary: Um toque, nada digitado
                value: {}
      responses:
        '201':
          description: |
            Tutor avisado. `finder_token` e `conversation_url` permitem voltar a
            conversa sem conta; o cliente guarda no armazenamento local.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FoundReportCreated' }
        '410':
          description: Tag revogada ou pet excluido.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: |
            Excesso de avisos para o mesmo codigo. A interface publica **nao**
            mostra erro tecnico a um achador real: ela confirma o aviso e a
            moderacao trata o abuso depois.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /found-reports:
    post:
      operationId: createStrayFoundReport
      tags: [found]
      x-effects: [notifies, human_work, expensive_query]
      x-rate-limit:
        - dimension: [account]
          limit: 10
          window: 24h
          on_exceed: deny_429
        - dimension: [account]
          limit: 30
          window: 30d
          on_exceed: hold_for_review
      summary: Registra um achado avulso, sem QR
      description: |
        **Exige conta** (regra fechada no briefing). O cruzamento com casos
        abertos e por atributos e por distancia, e toda correspondencia passa
        por confirmacao humana do tutor.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StrayFoundReportInput' }
      responses:
        '201':
          description: Achado registrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FoundReport' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      operationId: listMyFoundReports
      tags: [found]
      x-effects: []
      summary: Achados que eu registrei
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Lista.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FoundReportPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /found-reports/{foundReportId}:
    parameters:
      - $ref: '#/components/parameters/FoundReportId'
    get:
      operationId: getFoundReport
      tags: [found]
      x-effects: []
      summary: Detalhe do achado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Achado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FoundReport' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: enrichFoundReport
      tags: [found]
      x-effects: [notifies]
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
      summary: Acrescenta detalhes ao aviso, para quem tem conta
      description: |
        Versao autenticada de `PATCH /v1/finder/found-report`, autorizada por
        **propriedade** (o aviso e de quem chama), nao por posse de token. Quem
        avisou sem conta usa a rota do achador, que nao tem id no caminho.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FoundReportEnrichment' }
      responses:
        '200':
          description: Aviso complementado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FoundReport' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '410':
          description: Caso ja encerrado.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /found-reports/{foundReportId}/photo-upload-intent:
    parameters:
      - $ref: '#/components/parameters/FoundReportId'
    post:
      operationId: createFoundReportPhotoUploadIntent
      tags: [found]
      x-effects: [irreversible_write]
      summary: Credenciais de upload da foto do achador
      description: |
        A foto do achador **nunca** aparece em rota publica: ela e vista pelo
        tutor dentro da conversa mediada, e so.
      security:
        - bearerAuth: []
      x-rate-limit:
        - dimension: [found_report]
          limit: 3
          window: lifetime
          on_exceed: deny_429
          note: "SEC-009: 3 fotos e 2 MB por foto no aviso do achador"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadIntentInput' }
      responses:
        '201':
          description: Credenciais de upload.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadIntent' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }

  # ----------------------------------------------------------------------
  # O achador sem conta: rotas enderecadas pelo token, sem id no caminho
  # ----------------------------------------------------------------------
  #
  # Existem separadas das rotas com id por decisao de seguranca (SEC-001): o par
  # "id no caminho + token no cabecalho" e o arranjo classico de BOLA, em que
  # basta a verificacao checar "token valido" em vez de "token pertence a este
  # objeto" para um achador ler a conversa de outro. Sem id no caminho, nao ha o
  # que adulterar, e o achador nunca recebe UUID interno nenhum.

  /finder/found-report:
    patch:
      operationId: enrichFinderFoundReport
      tags: [found]
      x-effects: [notifies]
      summary: Acrescenta onde, foto, recado e contato ao aviso ja enviado
      description: |
        E a operacao da tela "Contar mais". Todos os campos sao opcionais e a
        falha aqui nao e grave: o aviso principal ja saiu.
      security:
        - finderToken: []
      x-rate-limit:
        - dimension: [finder_token]
          limit: 10
          window: 1h
          on_exceed: deny_429
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FoundReportEnrichment' }
      responses:
        '200':
          description: Aviso complementado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinderFoundReportView' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '410':
          description: Caso ja encerrado.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /finder/found-report/photo-upload-intent:
    post:
      operationId: createFinderPhotoUploadIntent
      tags: [found]
      x-effects: [irreversible_write]
      summary: Credenciais de upload da foto do achador
      description: |
        A foto do achador **nunca** aparece em rota publica: ela e vista pelo
        tutor dentro da conversa mediada, e so.

        Limites proprios, mais estreitos que os do tutor (SEC-009), porque quem
        envia nao tem identidade nenhuma: **2 MB por foto e no maximo 3 fotos por
        aviso**, e o **arquivo original e apagado assim que a derivada e gerada**.
        O original do achador nao e retido e nao e servido a ninguem, nem por URL
        assinada, nem ao tutor.
      security:
        - finderToken: []
      x-rate-limit:
        - dimension: [finder_token]
          limit: 3
          window: lifetime
          on_exceed: deny_429
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/UploadIntentInput'
                - type: object
                  properties:
                    byte_size: { type: integer, minimum: 1, maximum: 2097152 }
      responses:
        '201':
          description: Credenciais de upload.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadIntent' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }

  /finder/conversation:
    get:
      operationId: getFinderConversation
