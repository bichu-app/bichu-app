  /.well-known/assetlinks.json:
    servers:
      - url: https://{dominio}
        variables: { dominio: { default: TAG_BASE_URL } }
    get:
      operationId: wellKnownAssetLinks
      tags: [web]
      x-effects: []
      x-rate-limit:
        - dimension: [ip]
          limit: 600
          window: 1h
          on_exceed: log_and_alert
          note: "NUNCA challenge nem deny_429: quem busca este arquivo e o sistema operacional ou uma biblioteca, que nao resolve desafio e nao repete depois de um 429. Recusar aqui quebra a verificacao de dominio e a validacao de token em silencio"
      summary: Associacao de dominio do Android (App Links)
      description: |
        Servido pelo backend a partir de configuracao, nunca de arquivo fixo no
        repositorio: a impressao digital SHA-256 muda com a chave de assinatura
        e por ambiente.

        Exigencias que o sistema operacional impoe, e que sao motivo de falha
        silenciosa quando erradas: **HTTPS sem nenhum redirecionamento**,
        `Content-Type: application/json`, e servido pelo mesmo dominio que
        aparece na URL impressa na tag.
      security: []
      responses:
        '200':
          description: Arquivo de associacao.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    relation:
                      type: array
                      items: { type: string }
                    target:
                      type: object
                      properties:
                        namespace: { type: string }
                        package_name: { type: string }
                        sha256_cert_fingerprints:
                          type: array
                          items: { type: string }
        '503':
          description: |
            A impressao digital ainda nao foi configurada. **Responde 503, nunca
            um arquivo vazio ou um 200 com lista vazia**: um arquivo valido e
            errado faz o sistema operacional cachear a associacao quebrada.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /.well-known/apple-app-site-association:
    servers:
      - url: https://{dominio}
        variables: { dominio: { default: TAG_BASE_URL } }
    get:
      operationId: wellKnownAppleAppSiteAssociation
      tags: [web]
      x-effects: []
      x-rate-limit:
        - dimension: [ip]
          limit: 600
          window: 1h
          on_exceed: log_and_alert
          note: "NUNCA challenge nem deny_429: quem busca este arquivo e o sistema operacional ou uma biblioteca, que nao resolve desafio e nao repete depois de um 429. Recusar aqui quebra a verificacao de dominio e a validacao de token em silencio"
      summary: Associacao de dominio do iOS (Universal Links)
      description: |
        **Sem extensao `.json` no caminho**, `Content-Type: application/json`,
        HTTPS sem redirecionamento. Depende do Team ID da conta Apple
