      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ----------------------------------------------------------------------
  # Casos de perdido
  # ----------------------------------------------------------------------

  /pets/{petId}/lost-case-preview:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      operationId: previewLostCaseReach
      security:
        - bearerAuth: []
      tags: [lost]
      x-effects: [expensive_query]
      x-rate-limit:
        - dimension: [account]
          limit: 30
          window: 1h
          on_exceed: deny_429
          note: "roda a consulta geoespacial de 5 km: leitura autenticada, mas nao barata"
        - dimension: [pet]
          limit: 10
          window: 1h
          on_exceed: serve_cache
      summary: Quantos tutores o alerta alcanca (F3.2)
      description: |
        Calcula o alcance **antes** de abrir o caso. A resposta distingue
        explicitamente "zero tutores" de "nao foi possivel calcular": a tela
        nunca pode mostrar zero quando o que houve foi falha.

        Devolve tambem os bloqueios que impedem a abertura, para que a folha de
        bloqueio tenha o texto certo sem uma segunda chamada.
      parameters:
        - name: lat
          in: query
          required: false
          schema: { type: number, format: double, minimum: -34, maximum: 6 }
          description: Ultima posicao conhecida do pet. Ausente, usa a do tutor.
        - name: lon
          in: query
          required: false
          schema: { type: number, format: double, minimum: -74, maximum: -32 }
      responses:
        '200':
          description: Previa do alcance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LostCaseReachPreview' }
              examples:
                baseVazia:
                  summary: Variante A — nenhum tutor por perto
                  value:
                    reach_status: computed
                    reachable_tutors: 0
                    radius_m: 5000
                    area_label: Vila Madalena
                    blockers: []
                naoCalculou:
                  summary: Variante D — nao foi possivel calcular
                  value:
                    reach_status: unavailable
                    reachable_tutors: null
                    radius_m: 5000
                    area_label: null
                    blockers: []
                bloqueado:
                  summary: Contato nao verificado
                  value:
                    reach_status: computed
                    reachable_tutors: 46
                    radius_m: 5000
                    area_label: Vila Madalena
                    blockers: [contact_channel_unverified]
        # `petId` no caminho e `lat`/`lon` na query podem ser recusados, e desde
        # a BICHUS-199 a borda os valida contra este documento -- um `petId` que
        # nao e UUID, ou uma latitude fora da faixa, respondem 400 antes de o
        # manipulador rodar. Declarar o status que a rota de fato devolve nao e
        # burocracia: quem le o contrato precisa ver a recusa que existe.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /pets/{petId}/lost-cases:
    parameters:
      - $ref: '#/components/parameters/PetId'
    post:
      operationId: openLostCase
      security:
        - bearerAuth: []
      tags: [lost]
      x-effects: [notifies, expensive_query, human_work]
      x-rate-limit:
        - dimension: [account]
          limit: 5
          window: 24h
          on_exceed: accept_and_defer_dispatch
          note: "O CASO SEMPRE ABRE. O que e retido acima do teto e o disparo do alerta, nunca a criacao: portao aberto com tres caes na casa e um evento, nao abuso, e recusar o terceiro caso seria o produto falhando exatamente no dia em que existe para funcionar"
        - dimension: [account]
          limit: 20
          window: 24h
          on_exceed: hold_for_review
          note: "acima disso a conta vai para revisao, e o caso continua aberto"
      summary: Marca o pet como perdido e dispara o alerta
      description: |
        Dois bloqueios, e so dois: **canal de contato verificado** e **pet com
        foto pronta**. Ambos respondem 409 com `type` proprio, porque a folha
        de bloqueio tem texto diferente para cada um.

        Abrir o caso com alcance zero e permitido e desejado: o caso continua
        util pela tag e pela lista de perdidos.

        **Limite de chamadas nunca impede abrir um caso.** Acima do teto o caso
        e criado normalmente e o **disparo do alerta** e que fica retido, com
        `alert.reach_status: queued`; a tela diz que o aviso aos vizinhos esta
        em analise, e nao que o caso falhou.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LostCaseInput' }
      responses:
        '201':
          description: Caso aberto e alerta enfileirado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LostCase' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/LostCaseBlocked' }

  /lost-cases/{caseId}:
    parameters:
