      summary: Eventos de entrega do provedor de e-mail
      description: |
        Atualiza `notification_deliveries` com entrega, devolucao e marcacao de
        spam. **E por este caminho que a lista de supressao do provedor chega
        ate nos**: quem marcou uma mensagem como spam entra em supressao, e sem
