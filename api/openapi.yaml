  schemas:

    Problem:
      type: object
      description: RFC 9457. O cliente decide por `type`, nunca pelo texto.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        correlation_id:
          type: string
          format: uuid
          description: Mesmo identificador propagado no log e no trace.
        next_action:
          type: string
          description: Caminho alternativo, quando existe um.
          enum: [register_stray_found_report, verify_email, upload_pet_photo, sign_in, retry_later]
        errors:
          type: array
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }

    Password:
      type: string
      minLength: 10
      maxLength: 256
      description: |
        Politica alinhada ao NIST SP 800-63B: minimo de 10 caracteres, sem
        exigencia de composicao, sem expiracao periodica, e recusa por lista de
        senhas vazadas e por semelhanca com o e-mail e o nome. Regra de
        composicao empurra o usuario para `Senha@123`, que e pior.

    Slug:
      type: string
      pattern: '^[a-z0-9](?:[a-z0-9-]{1,28}[a-z0-9])$'
      minLength: 3
      maxLength: 30

    Species:
      type: string
      enum: [dog, cat, other]

    PetSize:
      type: string
      enum: [P, M, G, GG]

    Sex:
      type: string
      enum: [male, female, unknown]

    Handle:
      type: string
      minLength: 5
      maxLength: 20
      pattern: '^[a-z0-9][a-z0-9-]{3,18}[a-z0-9]$'
      description: |
        O **apelido (`@`)**: identificador escolhido pela pessoa, unico, que
        **nao deriva** do nome, do e-mail nem do telefone. Decisao do cliente
        de 18/10/2026: *"o apelido esta livre, vai estar no cadastro do usuario
        e na pagina de edicao do perfil"*, e antes dela *"slug nao tem relacao
        com informacoes pessoais, e um id que o usuario escolhe e voce deve
        verificar para garantir que nao tem dois iguais"*.

        **A FAIXA AQUI E A MESMA DO BANCO E DA TELA, caractere a caractere.**
        `minLength: 5` / `maxLength: 20` / `pattern` espelham o `CHECK` de
        `handles.handle` (`20261018000021`) e o regex de
        `app/lib/formato/apelido.dart`. Isto esta escrito porque esta casa ja
        pagou pela divergencia: o recado do achado aceitava **1000** no
        contrato e a coluna recusava acima de **500**, e a pessoa recebia erro
        de servidor em vez de recusa explicada.

        **O teto de 20 e do apelido NORMALIZADO, e por construcao ele e
        identico ao digitado**: o conjunto e ASCII restrito, normalizar e so
        minusculo e aparo, e maiuscula para minuscula e um para um. Nao ha
        como digitado e normalizado divergirem em comprimento -- ganho direto
        de ter recusado acento.

        **Um separador so: o hifen.** Ponto e sublinhado foram recusados de
        proposito: com os tres, `@maria.silva`, `@maria_silva` e
        `@maria-silva` conviveriam.

        **Guardado minusculo.** `@Leandro` e `@leandro` sao o mesmo apelido, e
        quem garante e o indice (`citext`), nao o cliente.

        **NAO EXISTE ROTA DE "ESTE APELIDO ESTA DISPONIVEL?"**, e a ausencia e
        a decisao: ela deixaria varrer a base. A disponibilidade e decidida
        **no envio**, pelo indice unico -- quem repetir recebe 400
        `validation-failed` com `code: taken`, e a tela oferece tres sugestoes
        derivadas do que foi digitado. Nenhum cliente deve conferir antes e
        confiar: a janela entre conferir e gravar e onde a corrida mora.

        **O espaco de nomes e COMPARTILHADO com `pets.slug`**: o site publica o
        pet em `/@{slug}` (ADR-0028) e o `@` e um simbolo so para quem le.
        Apelido de pessoa e slug de pet **nao coexistem iguais**, e quem
        garante e a tabela `handles`.

        **Parecidos nao coexistem.** `@maria-silva`, `@mariasilva` e
        `@mar1a-silva` sao o mesmo apelido para o indice de esqueleto, que
        colapsa `{0,o}`, `{1,i,l}`, `{5,s}` e `{3,e}` e tira o hifen.

        **Palavras reservadas sao recusadas** com `code: reserved`. Para
        `bichu` a regra e **CONTEM**, em qualquer posicao e sobre o esqueleto:
        `@suporte-bichu` e `@b1chu-suporte` sao a forma real do golpe.

    RegisterRequest:
      type: object
      required: [email, password, display_name, birth_date]
      description: |
        **DUAS EXIGENCIAS NOVAS, do mesmo dia (18/10/2026), e as duas sao do
        cliente.** `display_name` veio de *"o campo de nome no cadastro do
        usuario e obrigatorio"* e `birth_date` de *"coloque maiores de 16
        anos"*. Elas nasceram em ramos separados e se encontraram aqui: o
        `required` desta operacao carrega **as duas**, e nenhuma substitui a
        outra.

        **As duas sao quebra de contrato, e as duas tem dispensa datada em
        `.github/quality-gates.yml`** -- quatro entradas no total, porque o
        juizo casa um par regra+operacao por entrada. O APK em campo nao tem
        nenhum dos dois campos e deixa de criar conta ate sair APK novo; o
        cliente aceitou esse custo nos dois casos.

        **`display_name` e obrigatorio desde 18/10/2026**, por queixa do
        cliente: *"o campo de nome no cadastro do usuario e obrigatorio, hoje
        ele esta cadastrando sem esse campo"*.

        **Isto e mudanca quebradora e esta declarada como tal**: cliente antigo
        que nao manda a chave passa a receber 400 `validation-failed` com
        `errors[].field: display_name` e `code: required`. O APK em campo que
        nao preenche o nome deixa de criar conta -- a correcao e APK novo, e nao
        afrouxar o campo.

        **`minLength: 1` nao esgota a regra, e de proposito.** O caso que escapa
        do schema e o nome **so com espaco em branco** (`"   "`), que tem
        comprimento 1 e nao tem nome nenhum dentro. Quem recusa esse e o
        servidor, depois de `trim`, com o mesmo `code: required`: JSON Schema
        nao tem como exprimir "sobra caractere depois de aparar", e inventar
        `pattern` aqui faria a recusa do schema e a do servidor divergirem.

        **`birth_date` e obrigatorio desde 18/10/2026**, por decisao do cliente:
        *"coloque maiores de 16 anos"*.

        **Isto e mudanca quebradora e esta declarada como tal**: cliente antigo
        que nao manda a chave passa a receber 400 `validation-failed` com
        `errors[].field: birth_date` e `code: required`. O APK em campo que nao
        tem o campo **deixa de criar conta** -- a correcao e APK novo, e nao
        afrouxar a exigencia. E o mesmo custo que `display_name` cobrou no
        mesmo dia, e o cliente o aceitou nos dois casos.

        **O `format: date` nao esgota a regra, e de proposito.** O schema recusa
        o que nao e data (`"ontem"`, `"32/13/2010"`), e **nao recusa**:

        - data no **futuro** (`2030-01-01` e data valida);
        - data **absurda** (`1203-04-05` e data valida);
        - quem tem **menos de 16 anos**, que e a regra que motivou o campo.

        Os tres sao recusados pelo **servidor**, em
        `src/shared/idade/idade-minima.ts`, com `code: 'invalid'` e
        `code: 'too_young'`. A idade e calculada **no servidor**, no fuso
        `America/Sao_Paulo`, e **nunca lida de um campo de idade enviado pelo
        cliente** -- nao existe campo de idade neste contrato, e nao e descuido:
        idade que o cliente informa e idade que o cliente escolhe.

        `minimum`/`maximum` de data nao existem em JSON Schema, e um `pattern`
        aqui faria a recusa do schema e a do servidor divergirem -- a mesma
        divisao de trabalho que `display_name` ja usa.

        **A data de nascimento NAO VOLTA em resposta nenhuma**, nem para o
        proprio dono: `Me`, `MeUpdate` e `RegisterResponse` nao a declaram. Com
        idade minima de 16 o titular pode ser adolescente, e a data existe para
        ser **conferida** no cadastro, nao para ser exibida.
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { $ref: '#/components/schemas/Password' }
        # `minLength: 1` vem de `feat/nome-obrigatorio-cadastro`: sem o piso,
        # `required` aceitaria `display_name: ""` e a conta nasceria sem nome
        # com o campo preenchido. O caso so com espaco (`"   "`) passa pelo
        # schema de qualquer forma e quem o recusa e o servidor, depois do trim.
        display_name: { type: string, minLength: 1, maxLength: 80 }
        birth_date:
          type: string
          format: date
          description: |
            A data de nascimento de quem esta criando a conta, em `YYYY-MM-DD`.

            Quem tem **menos de 16 anos nao cria conta** (cliente, 18/10/2026).
            A conta precisa ter **16 anos ou mais no dia de hoje**, contado no
            fuso `America/Sao_Paulo`: quem completa 16 anos hoje **passa**, e
            quem os completa amanha nao. O limite de um dia aqui e a diferenca
            entre recusar e aceitar alguem no proprio aniversario, e por isso o
            calculo e civil (ano/mes/dia no fuso do produto) e nao uma subtracao
            de instantes em UTC.
        # **OPCIONAL no cadastro, e a escolha e deliberada.** O cliente disse
        # que o apelido *"vai estar no cadastro"* -- que ele ESTA la, nao que
        # ele seja exigido. Tres razoes para nao entrar em `required`:
        #
        # 1. o desenho fechado (plano 4-C.8) diz que a coluna e anulavel e que
        #    **nenhum fluxo obriga a escolher apelido**; exigi-lo aqui
        #    contradiria o proprio desenho que esta sendo seguido;
        # 2. `required` seria uma SEGUNDA quebra de contrato no mesmo dia, com
        #    uma segunda dispensa datada -- e `birth_date` ja custou o APK em
        #    campo. Campo acrescentado e opcional **nao quebra ninguem**;
        # 3. sem rota de disponibilidade, a pessoa descobre que o apelido esta
        #    tomado so no envio. Exigi-lo no cadastro transformaria "escolher
        #    um apelido livre" em pre-requisito para ter conta.
        #
        # O custo, dito em voz alta: quem nao preencher fica sem identificador
        # ate editar o perfil, e a tela cai para o nome de exibicao -- que e o
        # que ela ja faz hoje.
        handle:
          $ref: '#/components/schemas/Handle'
        accepted_terms_version: { type: string, maxLength: 20 }
        stay_signed_in:
          $ref: '#/components/schemas/StaySignedIn'

    StaySignedIn:
      type: boolean
      default: false
      description: |
        Escolha explicita da pessoa, **desmarcada por padrao**, com o efeito
        dito em texto na tela. Ela governa a **janela de inatividade** do
        refresh, e so ela (secao 7.5 de `docs/04-seguranca.md`):

        | | Inatividade | Teto absoluto desde a autenticacao com senha |
        |---|---|---|
        | `false` | **30 dias** | **180 dias** |
        | `true` | **180 dias** | **180 dias** |

        Tres coisas que este campo **nao** faz, e que e o que torna aceitavel
        alonga-lo: nao mexe no token de acesso, que continua com 15 minutos;
        nao move o teto absoluto, que vale igual nos dois casos e existe
        justamente para que a rotacao a cada uso nao transforme um refresh
        roubado em acesso permanente; e nao dispensa a reautenticacao com senha
        das seis acoes sensiveis. A conveniencia fica na navegacao e o custo
        fica no ato destrutivo.

        Vale nas duas operacoes que abrem sessao, cadastro e login. **No
        cadastro ela e mais decisiva que no login**, e o ADR-0019 registra por
        que: a conta recem-criada e a que passa mais tempo sem ser aberta, e o
        dia em que ela e aberta de novo costuma ser o dia do sumico.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, maxLength: 256 }
        stay_signed_in:
          $ref: '#/components/schemas/StaySignedIn'

    SessionResponse:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, example: 900 }
        refresh_token: { type: string }
        refresh_expires_in:
          type: integer
          example: 2592000
          description: |
            Janela de **inatividade** do refresh, em segundos, decidida por
            `stay_signed_in`: 2592000 (30 dias) quando falso, 15552000 (180
            dias) quando verdadeiro. Como o token e rotacionado a cada uso,
            este numero e janela, nao teto. O teto absoluto, de 180 dias desde
            a autenticacao com senha, vale nos dois casos e **nao** aparece
            aqui: o cliente nao o administra, o servidor o aplica.
        user: { $ref: '#/components/schemas/Me' }

    Me:
      type: object
      required: [id, email, email_verified, pending_profile_fields, can_open_lost_case]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        email_verified: { type: boolean }
        pending_email:
          type: string
          format: email
          nullable: true
          description: |
            Endereco novo aguardando confirmacao, quando existe troca em curso.
            O e-mail da conta so muda quando a verificacao e concluida.
        email_deliverable:
          type: boolean
          default: true
          description: |
            Falso apos devolucao definitiva do provedor. Alimenta o aviso
            persistente com a oferta de corrigir o endereco: sem isto, o tutor
            de e-mail invalido nunca descobre que ninguem consegue avisa-lo.
        display_name: { type: string, nullable: true }
        handle:
          type: string
          nullable: true
          example: 'maria-silva'
          description: |
            O apelido (`@`) da **propria conta**, ou `null` quando ela nao
            escolheu nenhum.

            **O destinatario e sempre o DONO, e as rotas sao CINCO e nao
            uma** -- medido resolvendo `$ref` sobre o contrato inteiro, e nao
            suposto. `getMe` e `updateMe` exigem conta; e
            `SessionResponse.user` aponta para este schema, entao o apelido
            viaja tambem em `registerUser`, `login`, `refreshSession` e
            `confirmEmailVerification`. Essas quatro tem `security: []`, **mas
            nao sao anonimas**: cada uma entrega a sessao a quem acabou de
            provar identidade com senha, com refresh ou com token de e-mail --
            e sao exatamente as quatro que `portao-contrato-publico` dispensa
            da varredura de campos, por este motivo escrito la.

            Ele precisa sair por uma razao concreta: a **pagina de edicao do
            perfil** mostra o apelido atual para a pessoa poder trocar de
            apelido, e um campo que nao volta e um campo que a tela abre vazio
            e sobrescreve com o que a pessoa digitar.

            **`birth_date` nao sai em resposta nenhuma** -- zero, pela mesma
            medicao. A assimetria e a decisao: o apelido *"nao tem relacao com
            informacoes pessoais"* (cliente, 18/10/2026) e o dono precisa dele
            de volta; a data existe para ter sido conferida no cadastro.

            **Nenhuma rota de TERCEIRO declara este campo**, e a dependencia
            esta registrada no plano 4-C: *"o apelido nao pode aparecer para
            outra pessoa antes da fatia E"*. Esta fatia nao abre superficie
            nenhuma -- nao existe `/@{apelido}` de pessoa, e nenhuma listagem,
            nenhum teaser e nenhuma conversa o devolvem.

            `null` e um estado legitimo e permanente: **nenhum fluxo obriga a
            escolher apelido** (plano 4-C.8), e a tela cai para
            `display_name` -- que e o que ela ja faz.
        photo:
          oneOf:
            - $ref: '#/components/schemas/MyPhoto'
            - type: 'null'
          description: |
            A foto que a PROPRIA pessoa cadastrou (cliente, 18/10/2026).

            **Esta e a unica resposta do contrato que a traz.** Quem a ve e o
            dono, porque `getMe` exige `bearerAuth` sem alternativa vazia.
            Nenhuma superficie publica, nenhuma listagem, nenhuma resposta de
            terceiro: o `checkin_count` da `Rede` continua sendo um inteiro sem
            pessoas (ADR-0025 item 2, que proibe avatar por nome) e
            `Conversation.participants` continua dizendo por extenso que nunca
            traz foto de perfil. Mostrar a foto a outra pessoa e exposicao de
            pessoa fisica e **depende de decisao do cliente**, nao de
            implementacao.

            Nula quando nao ha foto, e nulo e o estado normal: a conta funciona
            inteira sem foto.
        phone_e164: { type: string, nullable: true, example: '+5511999998888' }
        phone_verified: { type: boolean, default: false }
        reference_area:
          type: object
          nullable: true
          properties:
            postal_code: { type: string, nullable: true, example: '05435-000' }
            neighborhood: { type: string, nullable: true }
            city: { type: string, nullable: true }
            state: { type: string, nullable: true, maxLength: 2 }
        pending_profile_fields:
          type: array
          description: Alimenta o aviso persistente de cadastro incompleto.
          items:
            type: string
            enum: [email_verification, phone, display_name, reference_area]
        can_open_lost_case:
          type: boolean
          description: Falso quando nenhum canal de contato esta verificado.
        created_at: { type: string, format: date-time }

    MeUpdate:
      type: object
      description: |
        **Nao aceita `email`** (SEC-003): trocar o e-mail e operacao propria,
        assincrona, em `POST /v1/me/email-change`. Aceitar aqui faria a
        resposta revelar se um endereco ja tem conta.
      properties:
        # **`minLength: 1` desde 18/10/2026**, por decisao do cliente: *"nao
        # permitir atualizar o cadastro, se nao tiver algum nome cadastrado"*.
        #
        # Antes desta linha `display_name: ""` era aceito e APAGAVA o nome, e a
        # tela de `Meus dados` oferecia isso em texto ("deixe o campo vazio
        # para tira-lo"). Conta sem nome aparece aos outros como "Tutor" ou
        # "Quem achou" (`conversa-mediada.ts`), o que prejudica o
        # reconhecimento do pet -- era a razao da decisao.
        #
        # Mesma divisao de trabalho do cadastro: o schema recusa `""`, e o
        # **servidor** recusa o nome so com espaco (`"   "`), que passa por
        # `minLength` e nao tem nome dentro. O servidor tambem recusa o PATCH
        # que **omite** o nome quando a conta ainda nao tem nenhum -- e aceita
        # o PATCH que o PREENCHE, que e a saida de quem esta nesse estado.
        display_name: { type: string, minLength: 1, maxLength: 80 }
        # A FOTO DA PROPRIA PESSOA (cliente, 18/10/2026). `null` TIRA a foto,
        # ausente nao mexe, `upload_id` novo TROCA. Tirar nao apaga objeto no
        # balde: o que sai e o ponteiro da conta.
        photo_upload_id:
          type: [string, 'null']
          format: uuid
          description: |
            O `upload_id` de `createMyPhotoUploadIntent`, **da propria conta**:
            envio de outra pessoa, de outro proposito, ja usado ou vencido e
            recusado com `400` (`code: upload_not_usable`), sem dizer qual dos
            casos ocorreu -- a conferencia da conta esta na clausula `WHERE`.
        # **O apelido na edicao do perfil** (cliente, 18/10/2026: *"vai estar
        # no cadastro do usuario e na pagina de edicao do perfil"*).
        #
        # Opcional como todo campo de `PATCH`: ausente significa "nao mexer".
        # **E `nullable: false` de proposito** -- nao ha como APAGAR o apelido
        # mandando `null`, e a ausencia dessa porta e a regra: soltar um
        # apelido de volta ao pool e o furo que o plano 4-C.7 descreve, porque
        # quem o pegasse herdaria o que a vizinhanca associava a quem o tinha.
        # Trocar e permitido (1 vez a cada 60 dias); abandonar nao e.
        handle:
          $ref: '#/components/schemas/Handle'
        phone_e164: { type: string, pattern: '^\+55\d{10,11}$' }
        reference_area:
          type: object
          properties:
            postal_code: { type: string, pattern: '^\d{5}-?\d{3}$' }
            neighborhood: { type: string, maxLength: 80 }
            city: { type: string, maxLength: 80 }
            state: { type: string, minLength: 2, maxLength: 2 }

    Device:
      type: object
      required: [id, platform, push_permission]
      properties:
        id: { type: string, format: uuid }
        platform: { type: string, enum: [android, ios] }
        push_permission: { type: string, enum: [granted, denied, not_asked] }
        app_version: { type: string }
        last_seen_at: { type: string, format: date-time }

    DeviceRegistration:
      type: object
      required: [platform, push_permission]
      properties:
        platform: { type: string, enum: [android, ios] }
        push_token: { type: string, maxLength: 512, nullable: true }
        push_permission: { type: string, enum: [granted, denied, not_asked] }
        app_version: { type: string, maxLength: 20 }
        os_version: { type: string, maxLength: 20 }

    UserLocationInput:
      type: object
      required: [lat, lon, source]
      properties:
        lat: { type: number, format: double, minimum: -34, maximum: 6 }
        lon: { type: number, format: double, minimum: -74, maximum: -32 }
        source:
          type: string
          enum: [device_gps, map_pin]
          description: |
            `map_pin` e o toque unico no mapa durante o cadastro. Existe para
            que quem nega a permissao de localizacao continue no raio do
            alerta, que e o que sustenta a metrica de alcance.

    UserLocation:
      type: object
      nullable: true
      required: [lat, lon, precision_m, expires_at]
      properties:
        lat: { type: number, format: double }
        lon: { type: number, format: double }
        precision_m:
          type: integer
          example: 100
          description: Grade de quantizacao aplicada antes de gravar.
        source: { type: string, enum: [device_gps, map_pin] }
        captured_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          description: 30 dias apos a captura. Expirada, sai do raio de alerta.

    PetInput:
      type: object
      required: [name, species, size]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        species: { $ref: '#/components/schemas/Species' }
        breed_code:
          type: string
          maxLength: 40
          description: |
            Codigo de `GET /v1/public/reference-data`, **sempre**. E a unica
            coisa que o cruzamento de perdido e achado le, e por isso ele
            precisa ser um valor comparavel: "vira-lata", "vira lata", "SRD" e
            "sem raca definida" sao quatro textos para um animal so, e texto
            livre como chave de cruzamento significa que o cruzamento nao
            acontece exatamente no caso mais comum do Brasil.

            Quando a raca nao esta na lista, o codigo e `outro_dog`,
            `outro_cat` ou `outro_other`, e o nome vai em `breed_free_text`.
        breed_free_text:
          type: string
          maxLength: 40
          nullable: true
          description: |
            A raca como a pessoa escreveu, **aceita e guardada** (BICHUS-90,
            criterio 3). Aparece na ficha, no cartaz e no perfil publico.

            **Nao entra no cruzamento e nao e filtro em lugar nenhum.** Ela
            descreve; quem compara e `breed_code`. Sao dois campos porque sao
            duas funcoes, e junta-las obriga a escolher entre uma lista que
            mente ("Akita" virando "SRD") e um cruzamento que nao cruza.

            **So e aceita com `breed_code` em `outro_dog`/`outro_cat`/
            `outro_other`.** Enviada junto de uma raca da lista, a resposta e
            `validation-failed`: "Shih Tzu" no codigo e "poodle" no texto sao
            duas respostas para uma pergunta, e a divergencia nao tem como ser
            resolvida depois.
        ref_data_version:
          type: string
          nullable: true
          description: |
            A `version` da lista que o cliente tinha em maos quando a pessoa
            escolheu (o campo `version` de `reference-data`). Gravada junto do
            registro (BICHUS-90, criterio 5).

            `ref_data_versions` guarda uma versao corrente **global**, que
            responde "qual e a lista de hoje" e nao responde "de qual lista
            este pet foi escolhido" — e e a segunda pergunta que importa
            quando um codigo sai da lista ou muda de rotulo. O cliente pode
            estar com uma copia antiga em cache, entao quem sabe a versao usada
            e ele; sem o campo, o servidor grava a corrente no momento da
            escrita, que e uma aproximacao e nao o fato.
        size: { $ref: '#/components/schemas/PetSize' }
        primary_color_code: { type: string, maxLength: 30 }
        secondary_color_code: { type: string, maxLength: 30 }
        sex: { $ref: '#/components/schemas/Sex' }
        neutered: { type: boolean, nullable: true }
        birth_date_approx: { type: string, format: date, nullable: true }
        distinctive_marks: { type: string, maxLength: 500 }
        care_notes:
          type: string
          maxLength: 280
          nullable: true
          description: |
            **O que alguem que acabou de encontrar o animal precisa saber nos
            proximos cinco minutos**, em uma frase. Exemplos do que serve:
            "toma remedio de uso continuo", "e medroso, nao corra atras",
            "nao consegue subir escada", "reage mal a outros caes".

            O limite de 280 caracteres e desenho, nao economia: o destinatario
            le de pe, com uma mao, com o animal se mexendo. Um paragrafo nao e
            lido, e um campo que aceita paragrafo convida a escrever um.

            **Este campo e publico por definicao**, e nao tem interruptor de
            visibilidade. Ele existe para uma unica finalidade, que e aparecer
            para quem encontrou o pet; guardado sem aparecer, ele seria dado
            retido sem proposito. Quem nao quer publicar **deixa em branco**,
            e essa e a forma de nao publicar.

            **Onde aparece:** na pagina do achador (`/t/{code}`), na pagina
            publica do caso e no cartaz. **Onde nunca aparece:** no perfil
            publico por `@slug`, que e indexavel por buscador e permanente.
            Mostrar a quem esta com o animal na mao que ele toma medicacao e
            util; deixar isso indexado para sempre e outra coisa.

            **Conteudo esperado:** manejo e saude do animal. O servidor aplica a
            **mesma redacao das mensagens do canal mediado** (telefone, e-mail,
            endereco e link externo) antes de gravar, e devolve o que retirou em
            `care_notes_redactions`, para a tela explicar. Nome de clinica,
            nome do tutor e endereco nao pertencem a este campo: o contato com o
            tutor e mediado, e o campo nao e um atalho para furar essa regra.
        microchip_number: { type: string, maxLength: 20, nullable: true }
        sinpatinhas_id:
          type: string
          maxLength: 40
          nullable: true
          description: |
            RG Animal do registro federal. Campo livre e **sem validacao
            automatica**: o SinPatinhas nao tem API publica.

    Pet:
      allOf:
        - $ref: '#/components/schemas/PetInput'
        - type: object
          required: [id, status, created_at]
          properties:
            id: { type: string, format: uuid }
            breed_label:
              type: string
              nullable: true
              description: |
                O rotulo pronto para a tela, resolvido pelo servidor: o `label`
                de `ref_breeds` quando `breed_code` esta na lista, e
                `breed_free_text` quando o codigo e `outro_*`. O cliente exibe
                este campo e nao precisa saber qual dos dois caminhos gerou.
            status:
              type: string
              enum: [active, lost, deceased, archived]
            slug: { type: string, nullable: true }
            public_profile_enabled: { type: boolean, default: false }
            care_notes_redactions:
              type: array
              description: |
                O que a redacao retirou de `care_notes` ao gravar. Vazio quando
                nada foi retirado. Existe para a tela dizer o que aconteceu, em
                vez de o tutor achar que o texto sumiu sozinho.
              items:
                type: object
                properties:
                  kind: { type: string, enum: [phone, email, address, external_link] }
                  hint: { type: string }
            photos:
              type: array
              items: { $ref: '#/components/schemas/PetPhoto' }
            active_tag_count: { type: integer }
            open_case_id: { type: string, format: uuid, nullable: true }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    PetPhoto:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [processing, ready, rejected]
          description: |
            `rejected` quando os bytes reais nao sao imagem aceita. O tipo
            declarado no upload nunca e a fonte da verdade.
        rejection_reason:
          type: string
          nullable: true
          description: |
            O MOTIVO da recusa, em texto pronto para a tela, quando `status` e
            `rejected`. Nulo em `processing` e em `ready`.

            Ele e gravado desde a BICHUS-87 e **nao chegava a ninguem**: o
            campo nao existia neste schema, entao a tela dizia "recusada" e a
            pessoa nao tinha como saber se o problema era o formato, o tamanho,
            a dimensao minima ou um arquivo truncado -- e portanto nao tinha
            como consertar.

            Nao e codigo de erro e nao e estavel: e texto para ler. Cliente que
            precise ramificar por causa ramifica por `status`.
        is_primary: { type: boolean }
        thumb_url:
          type: string
          format: uri
          nullable: true
          description: |
            Derivada de 176 x 194 px, cortada na proporcao da moldura (1 : 1,1),
            para o cartao da lista, que desenha 56 x 61,6 dp. Pesa dezenas de
            kB: o peso de uma TELA e a soma das derivadas que ela desenha, e a
            lista desenha muitas.
        card_url:
          type: string
          format: uri
          nullable: true
          description: |
            Derivada de 1024 x 1126 px, cortada na proporcao da moldura
            (1 : 1,1), sem EXIF, em JPEG, servida pelo dominio de midia.

            Ela e a imagem GRANDE do pet: o perfil do pet no app, a pagina
            publica do caso e o cartaz impresso (`LostCasePoster.photo_url`)
            usam esta mesma derivada. Teto de 500 KB, com alvo de 300 a 500 KB
            (pedido do cliente de 17/10/2026), alcancado por escada de
            qualidade -- a qualidade e escolhida medindo os bytes, e nao fixada.

            **O arquivo original nunca sai do armazenamento privado**, e nenhuma
            rota o serve: o leitor de midia publica aceita apenas chave com a
            forma de derivada, e toda chave de original tem `original` no lugar
            onde ela exige `thumb`, `card` ou `banner`.
        created_at: { type: string, format: date-time }

    UploadIntentInput:
      type: object
      required: [content_type, byte_size]
      description: |
        **O teto de 5 MiB vale para TODO envio de imagem da aplicacao** -- foto
        de pet, foto de achado, capa de encontro e imagem de produto --, para
        usuario e para administrador (decisao do cliente de 17/10/2026: "as
        imagens devem conter no maximo 5mb ... em toda a aplicacao"). Antes
        eram tres numeros: 10 MiB aqui, 2 MiB no servidor da foto de achado e
        5 MiB no catalogo, com este schema emprestando o seu para a operacao do
        achado por composicao.

        O teto vai para a POLITICA ASSINADA, e e por isso que ele vale: o
        backend nao recebe os bytes, e recusar depois seria recusar o que ja foi
        gravado.
      properties:
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/heic, image/webp]
          description: |
            **A lista da ENTRADA, e ela nao e a do que guardamos.** O que
            guardamos e servimos e sempre JPEG (`.jpeg`): o worker reescreve a
            imagem a partir dos pixels. HEIC esta aqui porque e o que o iPhone
            produz, e recusa-lo na entrada tiraria o produto da mao de metade
            dos aparelhos.

            O tipo declarado aqui e DIAGNOSTICO, nunca verdade: quem decide o
            formato sao os bytes, por numero magico, no worker. SVG nunca entra
            nesta lista -- e documento com script, nao imagem.
        byte_size: { type: integer, minimum: 1, maximum: 5242880 }

    UploadIntent:
      type: object
      required: [upload_id, method, url, expires_at]
      properties:
        upload_id: { type: string, format: uuid }
        method:
          type: string
          enum: [POST, PUT]
          default: POST
          description: |
            A forma da requisicao de upload. Existe para que a troca do
            provedor de armazenamento seja configuracao: nem todo provedor
            compativel com S3 aceita politica de POST.
        url: { type: string, format: uri }
        fields:
          type: object
          additionalProperties: { type: string }
          description: Campos do formulario assinado. Presente quando `method` e POST.
        headers:
          type: object
          additionalProperties: { type: string }
          description: |
            Cabecalhos assinados que o cliente precisa enviar sem alterar
            (inclusive `Content-Type` e `Content-Length`). Presente quando
            `method` e PUT.
        expires_at: { type: string, format: date-time }
        max_bytes: { type: integer }

    PetTag:
      type: object
      required: [id, status, code_suffix, created_at]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [active, revoked] }
        code_suffix:
          type: string
          maxLength: 4
          description: Quatro ultimos caracteres, para identificar a plaquinha.
        label: { type: string, nullable: true, maxLength: 40 }
        scan_count: { type: integer }
        last_scanned_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        revocation_reason: { $ref: '#/components/schemas/TagRevocationReason' }
        created_at: { type: string, format: date-time }

    PetTagIssueInput:
      type: object
      description: |
        Todos os campos opcionais; corpo vazio e o caminho comum. `label` e o
        apelido que distingue uma plaquinha da outra na tela do tutor, e nao
        viaja no QR nem aparece na rota publica.
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 40
          description: |
            Faixa identica ao CHECK `pet_tags_label_tamanho` da tabela. O
            `minLength` nao e enfeite: string vazia viola o CHECK, e sem ele a
            recusa sairia como 500.

    PetTagIssued:
      allOf:
        - $ref: '#/components/schemas/PetTag'
        - type: object
          required: [code, url]
          properties:
            code:
              type: string
              description: |
                **Unica resposta que traz o codigo em claro.** O cliente nao
                persiste este valor.
            url: { type: string, format: uri }
            qr_png_url: { type: string, format: uri }

    TagRevocationReason:
      type: string
      nullable: true
      enum: [lost_tag, suspected_clone, owner_request, pet_transferred, pet_deceased, pet_deleted]

    TagResolution:
      type: object
      required: [viewer, pet]
      properties:
        viewer:
          type: string
          enum: [owner, authenticated_other, anonymous]
          description: |
            `owner` faz o app abrir o modo dono. Os outros dois veem a mesma
            coisa: a excecao permanente nao distingue quem esta logado.

            **E sinal de navegacao, nao chave que destranca campo.** O corpo e
            identico nos tres casos. Com `owner`, o app busca os
            identificadores em `GET /tags/{code}/owner-context`, que exige
            `bearerAuth`.
        pet:
          type: object
          required: [display_name, species, size]
          description: |
            Visao publica minima. **Nao contem** id interno, dados do tutor,
            outros pets, historico nem localizacao.
          properties:
            display_name: { type: string }
            species: { $ref: '#/components/schemas/Species' }
            breed_label: { type: string, nullable: true }
            size: { $ref: '#/components/schemas/PetSize' }
            primary_color: { type: string, nullable: true }
            distinctive_marks: { type: string, nullable: true }
            care_notes:
              type: string
              nullable: true
              description: |
                O cartao de manejo, ja redigido. Muda o que o achador faz agora:
                "e medroso, nao corra atras" evita a perseguicao que faz o
                animal fugir de novo.
            photo_url: { type: string, format: uri, nullable: true }
        lost:
          type: object
          properties:
            is_lost: { type: boolean }
            since: { type: string, format: date-time, nullable: true }
        already_notified:
          type: boolean
          description: |
            Verdadeiro quando este mesmo dispositivo ja avisou nas ultimas 24 h.
            Muda o texto do botao; nao impede avisar de novo.
    TagOwnerContext:
      type: object
      required: [pet_id, tag_id]
      description: |
        Os identificadores internos da tag e do pet dela. **So sai por
        `bearerAuth`**, e por isso vive num schema proprio: enquanto estes dois
        campos moraram dentro de `TagResolution`, eles estavam no corpo
        declarado de uma operacao com caminho anonimo, protegidos apenas por
        uma frase de descricao.
      properties:
        pet_id: { type: string, format: uuid }
        tag_id: { type: string, format: uuid }

    FoundReportFromTagInput:
      type: object
      description: Todos os campos opcionais. Corpo vazio e o caminho principal.
      properties:
        found_at: { type: string, format: date-time }
        client_note: { type: string, maxLength: 500 }

    FoundReportCreated:
      type: object
      required: [finder_token, conversation_url, owner_notified]
      description: |
        **Nao devolve identificador interno** (SEC-001). A URL ja endereca e o
        token ja autoriza; devolver UUIDv7 a quem nao tem conta entregaria de
        graca o instante de criacao e a posicao do registro na base.
      properties:
        finder_token: { type: string }
        conversation_url: { type: string, format: uri }
        owner_notified:
          type: boolean
          description: |
            Falso apenas quando a notificacao foi **agrupada** a um aviso
            recente. O aviso em si nunca e descartado, e a tela do achador
            continua dizendo a verdade.
        pet_display_name: { type: string }

    FoundReportEnrichment:
      type: object
      properties:
        message:
          type: string
          maxLength: 500
          description: |
            500, o mesmo teto de `found_reports.notes` no banco
            (`found_reports_notes_tamanho`). O contrato dizia 1000, e o texto
            entre 501 e 1000 passava pela validacao e morria no banco como erro
            de servidor -- o recado se perdia com o animal na mao de quem ajuda.
            Mesmo alinhamento que `StrayFoundReportInput.notes` ja tinha.
        photo_upload_ref:
          type: string
          pattern: '^[A-Za-z0-9_-]{22}$'
          description: |
            O `upload_ref` devolvido por `POST /v1/media/finder-photo-intents`
            (`createFinderPhotoUploadIntent`). Opaco de proposito: este corpo
            vem de quem nao tem conta (SEC-001).
        location:
          type: object
          description: |
            Sem faixa e sem obrigatoriedade, como estava antes de 23/09/2026.
            A versao do achador sem conta (`FinderFoundReportEnrichment`) usa
            `GeoPoint`; se o app tambem deve passar a `GeoPoint` e decisao
            pendente do app, porque mudar aqui quebra quem ja envia.
          properties:
            lat: { type: number, format: double }
            lon: { type: number, format: double }
            accuracy_m: { type: integer }
        finder_contact:
          type: object
          description: |
            Opcional e nunca exibido a ninguem alem do canal mediado. Usado so
            para avisar a resposta do tutor e o desfecho do caso.
          properties:
            display_name: { type: string, maxLength: 60 }
            email: { type: string, format: email }

    FinderFoundReportEnrichment:
      type: object
      description: |
        O corpo de `enrichFinderFoundReport`, do achador sem conta. Mesmos
        campos de `FoundReportEnrichment`, com uma diferenca: `location` e
        `GeoPoint`, com a faixa do territorio e `lat`/`lon` obrigatorios
        juntos. Existe separado porque `FoundReportEnrichment` e tambem o corpo
        de `enrichFoundReport`, que o app ja usa, e apertar la quebraria esse
        consumidor (13 quebras no `oasdiff` do commit 19ee222).
      properties:
        message:
          type: string
          maxLength: 1000
          description: |
            **1000 de proposito, e nao os 500 da rota com conta.** Este `message`
            NAO e gravado em `found_reports.notes`: ele entra na conversa mediada
            como mensagem do achador (`aviso-do-achador.ts`, "para onde vai cada
            campo"), isto e em `mediated_messages.body`, cujo CHECK aceita 4000.
            O numero casa com `body` de `postFinderMessage`, que e o mesmo
            destino. Apertar aqui para 500 nao corrigiria descasamento nenhum e
            cortaria pela metade o recado de quem avisa SEM CONTA.
        photo_upload_ref:
          type: string
          pattern: '^[A-Za-z0-9_-]{22}$'
          description: |
            O `upload_ref` devolvido por `POST /v1/media/finder-photo-intents`
            (`createFinderPhotoUploadIntent`). Opaco de proposito: este corpo
            vem de quem nao tem conta (SEC-001).
        location:
          $ref: '#/components/schemas/GeoPoint'
          # Latitude sem longitude nao e ponto, e por isso as duas sao
          # obrigatorias quando `location` vem.
        finder_contact:
          type: object
          description: |
            Opcional e nunca exibido a ninguem alem do canal mediado. Usado so
            para avisar a resposta do tutor e o desfecho do caso.
          properties:
            display_name: { type: string, maxLength: 60 }
            email: { type: string, format: email }

    StrayFoundReportInput:
      type: object
      description: |
        **Coordenada nao e obrigatoria**, pelo mesmo motivo do caso: quem negou
        a permissao informa `area`. Sem coordenada o cruzamento perde o
        criterio de distancia e passa a valer dentro da mesma cidade; a regra
        completa esta na secao 4.10 de `docs/03-arquitetura.md`.

        `share_token` existe para o vizinho que **chegou pelo push de um caso
        especifico** e esta dizendo "vi este pet": o achado e vinculado
        diretamente aquele caso, sem depender do cruzamento por atributos.
      required: [species, size, found_at]
      anyOf:
        - required: [location]
        - required: [area]
      properties:
        species: { $ref: '#/components/schemas/Species' }
        breed_code:
          type: string
          maxLength: 40
          description: |
            Mesma regra do pet: codigo de `reference-data`, e e ele que o
            cruzamento le. Quem acha um animal na rua raramente sabe a raca, e
            e por isso que este campo nao e obrigatorio aqui.
        breed_free_text:
          type: string
          maxLength: 40
          nullable: true
          description: |
            A raca como o achador escreveu. Descreve, nao cruza. So com
            `breed_code` em `outro_*`, pela mesma razao de `PetInput`.
        ref_data_version: { type: string, nullable: true }
        size: { $ref: '#/components/schemas/PetSize' }
        primary_color_code: { type: string, maxLength: 30 }
        sex: { $ref: '#/components/schemas/Sex' }
        found_at: { type: string, format: date-time }
        location: { $ref: '#/components/schemas/GeoPoint' }
        area: { $ref: '#/components/schemas/Area' }
        share_token:
          type: string
          description: |
            Opcional. Vincula o achado a um caso conhecido em vez de deixar o
            cruzamento descobrir. O candidato nasce com `status: suggested` e
            **continua exigindo confirmacao humana do tutor**.
        notes:
          type: string
          maxLength: 500
          description: |
            500, o mesmo teto de `found_reports.notes` no banco
            (`found_reports_notes_tamanho`). O contrato dizia 1000, e o texto
            entre 501 e 1000 passava pela validacao e morria no banco como 500.
        photo_upload_id: { type: string, format: uuid }

    FoundReport:
      type: object
      required: [id, origin, status, created_at]
      properties:
        id: { type: string, format: uuid }
        origin: { type: string, enum: [tag_scan, stray_report] }
        status: { type: string, enum: [open, matched, closed] }
        species: { $ref: '#/components/schemas/Species' }
        size: { $ref: '#/components/schemas/PetSize' }
        area_label:
          type: string
          nullable: true
          description: Bairro. O ponto exato nunca sai desta forma.
        found_at: { type: string, format: date-time }
        photo_url: { type: string, format: uri, nullable: true }
        notes: { type: string, nullable: true }
        conversation_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }

    FinderFoundReportView:
      type: object
      description: |
        O que o achador sem conta ve do proprio aviso. Sem id interno, sem dado
        do tutor e sem coordenada de volta.
      required: [status, found_at]
      properties:
        status: { type: string, enum: [open, matched, closed] }
        found_at: { type: string, format: date-time }
        has_photo: { type: boolean }
        has_location: { type: boolean }
        message: { type: string, nullable: true }
        pet_display_name: { type: string }
        conversation_url: { type: string, format: uri }

    # ----------------------------------------------------------------------
    # As tres vistas do achador sem conta (SEC-001)
    # ----------------------------------------------------------------------
    #
    # A prosa deste contrato diz, desde o inicio, que nenhum UUID interno sai
    # para quem chega pelo codigo da tag ou por `finderToken`. As tres de
    # `finderToken` devolviam `Conversation`, `Message` e `UploadIntent`, que
    # sao os schemas do lado autenticado e declaram `id`, `case_id` e
    # `upload_id`. Uma descricao dizendo "omitido nas respostas ao achador" nao
    # e contrato: nenhum gerador de tipo, nenhum mock e nenhum teste de contrato
    # le prosa, e o cliente gerado nasce com o campo. Schema separado e a unica
    # forma de a regra existir para a maquina.
    #
    # O que se perde publicando um UUIDv7: ele e ordenavel e carrega o instante
    # de criacao em milissegundos. Dois deles entregam a taxa de criacao de
    # registros da plataforma inteira, de graca, a qualquer pessoa com um
    # celular e uma plaquinha na mao.

    FinderConversation:
      type: object
      description: |
        A conversa como o achador sem conta a ve. Sem `id` e sem `case_id`: o
        endereco e o token, e a rota nao tem id no caminho.
      required: [status, participants, messages]
      properties:
        pet_display_name: { type: string }
        status: { type: string, enum: [open, blocked, closed] }
        participants:
          type: array
          items:
            type: object
            required: [role, display_name]
            properties:
              role: { type: string, enum: [tutor, finder, system] }
              display_name:
                type: string
                description: |
                  Primeiro nome ou apelido. **Nunca** sobrenome completo,
                  telefone, e-mail nem foto de perfil.
        messages:
          type: array
          items: { $ref: '#/components/schemas/FinderMessage' }
        next_cursor: { type: string, nullable: true }

    FinderMessage:
      type: object
      description: |
        Mensagem sem `id`. O achador nao precisa dele: ele nao edita, nao apaga
        e nao responde a uma mensagem especifica. A ordem e `created_at` e a
        paginacao e `next_cursor`.
      required: [sender_role, body, created_at]
      properties:
        sender_role: { type: string, enum: [tutor, finder, system] }
        body: { type: string }
        redactions:
          type: array
          description: |
            O que foi retirado do texto antes de entregar, para que a interface
            explique em vez de o remetente achar que foi censurado sem motivo.
            Telefone e e-mail trocados em claro sao a porta do golpe.
          items:
            type: object
            properties:
              kind: { type: string, enum: [phone, email, address, external_link] }
              hint: { type: string }
        photo_url: { type: string, format: uri, nullable: true }
        created_at: { type: string, format: date-time }

    FinderUploadIntent:
      type: object
      description: |
        Credenciais de upload para quem nao tem conta. O identificador do
        upload existe, porque o achador precisa devolve-lo em
        `PATCH /v1/finder/found-report`, mas ele e **opaco**: 128 bits
        aleatorios em base64url, sem ordem e sem instante de criacao dentro.
      required: [upload_ref, method, url, expires_at]
      properties:
        upload_ref:
          type: string
          pattern: '^[A-Za-z0-9_-]{22}$'
          description: |
            Referencia opaca do upload. **Nao e UUID e nao substitui um**: e
            uma etiqueta sem informacao, que o servidor resolve para o upload
            real. Trocar um caractere leva a `validation-failed`; nao ha o que
            enumerar.
        method: { type: string, enum: [POST, PUT], default: POST }
        url: { type: string, format: uri }
        fields:
          type: object
          additionalProperties: { type: string }
          description: Campos do formulario assinado. Presente quando `method` e POST.
        headers:
          type: object
          additionalProperties: { type: string }
          description: |
            Cabecalhos assinados que o cliente precisa enviar sem alterar
            (inclusive `Content-Type` e `Content-Length`). Presente quando
            `method` e PUT.
        expires_at: { type: string, format: date-time }
        max_bytes: { type: integer }

    FoundReportPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FoundReport' }
        next_cursor: { type: string, nullable: true }

    Area:
      type: object
      description: |
        Localizacao por texto, o caminho de quem nao concedeu a permissao e nao
        marcou ponto no mapa. **Bairro e cidade sao o nivel maximo de precisao
        que sai em superficie publica** de qualquer forma (ADR-0010), entao esta
        representacao nao perde nada na exibicao; ela perde no alerta, que
        precisa de um centro para ter raio.
      required: [city]
      properties:
        city: { type: string, minLength: 2, maxLength: 80 }
        neighborhood: { type: string, maxLength: 80 }
        state: { type: string, minLength: 2, maxLength: 2 }

    GeoPoint:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number, format: double, minimum: -34, maximum: 6 }
        lon: { type: number, format: double, minimum: -74, maximum: -32 }
        accuracy_m: { type: integer }

    LostCaseInput:
      type: object
      description: |
        **Coordenada nao e obrigatoria.** Quem negou a permissao de localizacao
        e nao marcou ponto no mapa informa `last_seen_area`, e o caso existe do
        mesmo jeito. O que muda esta descrito em `AlertDispatch.reach_status`:
        sem centro nao ha raio, entao **o alerta de 5 km nao dispara** — e a
        tela precisa dizer isso, em vez de mostrar sucesso.

        O caso sem coordenada continua util, e por dois caminhos que nao
        dependem de raio: ele **entra na lista publica de perdidos** da cidade e
        do bairro, e a tag continua levando qualquer pessoa direto ao tutor.
      required: [last_seen_at]
      anyOf:
        - required: [last_seen_location]
        - required: [last_seen_area]
      properties:
        last_seen_at: { type: string, format: date-time }
        last_seen_location: { $ref: '#/components/schemas/GeoPoint' }
        last_seen_area: { $ref: '#/components/schemas/Area' }
        description: { type: string, maxLength: 1000 }
        share_to_public_list: { type: boolean, default: true }

    LostCase:
      type: object
      required: [id, pet_id, status, opened_at, alert]
      properties:
        id: { type: string, format: uuid }
        pet_id: { type: string, format: uuid }
        status:
          type: string
          enum: [open, closed_reunited, closed_not_found, closed_false_alarm]
        opened_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        area_label: { type: string, nullable: true }
        has_location:
          type: boolean
          description: |
            Falso quando o caso foi aberto sem coordenada. A tela do caso usa
            isto para explicar por que nao houve alerta, em vez de deixar a
            secao de alcance vazia.
        description: { type: string, nullable: true }
        alert: { $ref: '#/components/schemas/AlertDispatch' }
        candidate_count: { type: integer }
        unread_message_count: { type: integer }
        share_url: { type: string, format: uri }
        poster_url: { type: string, format: uri }
        reopen_deadline: { type: string, format: date-time, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true }
        resolution: { $ref: '#/components/schemas/LostCaseClosure' }

    LostCaseClosure:
      type: object
      nullable: true
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [reunited, not_found, false_alarm]
          description: |
            `false_alarm` e o caso aberto por engano, em que o animal nunca
            esteve perdido. **Nao e tela nova**: e uma terceira opcao na mesma
            pergunta de encerramento, oferecida **somente** quando o caso tem
            menos de 6 horas e nenhum aviso ou candidato. Existe porque a
            alternativa e pior: sem ele o tutor responde "voltou" e um caso que
            nunca foi perdido entra na metrica de reencontro, que e o
            instrumento de medicao do produto. Caso encerrado assim **sai do
            numerador e do denominador** dessa metrica, e quem recebeu o alerta
            e avisado do cancelamento.
        reunion_channel:
          type: string
          nullable: true
          description: |
            So faz sentido com `outcome: reunited`. E o que torna a metrica de
            reencontro atribuivel a um canal.
          enum: [tag_scan, bichu_alert, poster_or_link, on_my_own, other]
        note: { type: string, maxLength: 500, nullable: true }

    AlertDispatch:
      type: object
      required: [reach_status]
      properties:
        reach_status:
          type: string
          enum: [computed, unavailable, queued, no_location]
          description: |
            Quatro estados, e eles nao se confundem: `computed` com
            `recipients_total: 0` e "nao ha ninguem num raio de 5 km";
            `unavailable` e "nao conseguimos calcular"; **`no_location` e "nao
            existe raio, porque o caso nao tem coordenada"**. A tela tem texto
            diferente para cada um, e mostrar zero no lugar de `unavailable` ou
            de `no_location` e mentir para alguem em panico.
        recipients_total: { type: integer, nullable: true }
        radius_m: { type: integer, example: 5000 }
        dispatched_at: { type: string, format: date-time, nullable: true }
        next_resend_allowed_at: { type: string, format: date-time, nullable: true }

    LostCaseReachPreview:
      type: object
      required: [reach_status, radius_m, blockers]
      properties:
        reach_status:
          type: string
          enum: [computed, unavailable, no_location]
          description: |
            `unavailable` e obrigatorio quando o calculo falhou ou estourou o
            tempo. `no_location` quando nao ha coordenada nem do pet nem do
            tutor: **nao ha raio, e portanto nao havera alerta**, e o caso
            continua valendo pela lista publica e pela tag. Mostrar zero em
            qualquer um dos dois casos e mentir para quem esta em panico.
        reachable_tutors:
          type: integer
          nullable: true
          description: |
            Conta apenas tutores com localizacao valida **e** push concedido.
            Nulo quando `reach_status` e `unavailable`.
        radius_m: { type: integer, example: 5000 }
        area_label: { type: string, nullable: true }
        blockers:
          type: array
          description: |
            O que impede abrir o caso. **Falta de coordenada nao e bloqueio**:
            ela reduz o alcance, nao a existencia do caso.
          items:
            type: string
            enum: [contact_channel_unverified, pet_photo_missing, pet_already_lost]

    MatchCandidate:
      type: object
      required: [id, found_report, score, status]
      properties:
        id: { type: string, format: uuid }
        found_report: { $ref: '#/components/schemas/FoundReport' }
        score:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: |
            Ordena a lista. **Nunca** confirma sozinho: nenhum caso e fechado
            sem decisao humana do tutor.
        matched_attributes:
          type: array
          items: { type: string }
        distance_m:
          type: integer
          nullable: true
          description: Nulo quando caso ou achado nao tem coordenada.
        link_origin:
          type: string
          enum: [attribute_match, share_token]
          description: |
            `share_token` e o vizinho que chegou pelo push e disse "vi este
            pet": o vinculo e direto, nao veio do cruzamento. Continua exigindo
            confirmacao humana.
        strategy_version:
          type: string
          description: |
            Versao da regra de cruzamento que produziu este candidato (secao
            4.10 do documento de arquitetura). Sem ela, mudar os pesos torna
            impossivel saber por que um candidato antigo apareceu.
        status: { type: string, enum: [suggested, confirmed, rejected] }
        created_at: { type: string, format: date-time }

    CandidatePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MatchCandidate' }
        next_cursor: { type: string, nullable: true }

    Conversation:
      type: object
      required: [status, participants, messages]
      description: |
        Vista do chamador **autenticado**. O achador sem conta recebe
        `FinderConversation`, que e outro schema e nao tem `id` nem `case_id`
        (SEC-001). A omissao e por schema, nao por comportamento em tempo de
        execucao: campo que so some quando o codigo lembra de tira-lo volta na
        primeira refatoracao.
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid, nullable: true }
        pet_display_name: { type: string }
        status: { type: string, enum: [open, blocked, closed] }
        participants:
          type: array
          items:
            type: object
            required: [role, display_name]
            properties:
              role: { type: string, enum: [tutor, finder, system] }
              display_name:
                type: string
                description: |
                  Primeiro nome ou apelido. **Nunca** sobrenome completo,
                  telefone, e-mail nem foto de perfil.
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        next_cursor: { type: string, nullable: true }

    ConversationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Conversation' }
        next_cursor: { type: string, nullable: true }

    Message:
      type: object
      required: [sender_role, body, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: |
            Existe apenas nesta vista, a do chamador autenticado. A do achador
            e `FinderMessage`, sem `id` (SEC-001).
        sender_role: { type: string, enum: [tutor, finder, system] }
        body: { type: string }
        redactions:
          type: array
          description: |
            O que foi retirado do texto antes de entregar, para que a interface
            explique em vez de o remetente achar que foi censurado sem motivo.
            Telefone e e-mail trocados em claro sao a porta do golpe.
          items:
            type: object
            properties:
              kind: { type: string, enum: [phone, email, address, external_link] }
              hint: { type: string }
        photo_url: { type: string, format: uri, nullable: true }
        created_at: { type: string, format: date-time }

    PublicLostPet:
      type: object
      required: [share_token, pet_display_name, species, size, lost_since, area_label]
      description: |
        Projecao publica. Nao possui, e nunca deve possuir, `pet_id`, `case_id`,
        `user_id`, coordenada, dado do tutor nem endereco (SEC-002). A chave
        estavel da lista e o `share_token` opaco, que e o mesmo que o link de
        compartilhamento ja carrega.
      properties:
        share_token:
          type: string
          description: Opaco, o mesmo do `share_url`. Nao e UUID e nao e ordenavel.
        pet_display_name: { type: string }
        species: { $ref: '#/components/schemas/Species' }
        breed_label: { type: string, nullable: true }
        size: { $ref: '#/components/schemas/PetSize' }
        primary_color: { type: string, nullable: true }
        lost_since:
          type: string
          format: date-time
          description: |
            **Quando o animal foi visto pela ultima vez**, como o tutor informou
            (`lost_cases.last_seen_at`), e nao quando o caso foi aberto. Quem
            abre o caso no dia seguinte ao sumico precisa que a pagina diga "desde
            ontem", e e esse o numero que orienta quem esta procurando. O nome do
            campo fica, porque e o que a tela mostra ("perdido desde").
        area_label:
          type: string
          nullable: true
          description: |
            Bairro e cidade. Este e o nivel maximo de precisao publica.

            **Nulo quando o caso foi aberto so com coordenada** (BICHUS-21
            criterio 5). A coordenada nunca sai e nao ha geocodificacao no MVP,
            entao nao ha rotulo verdadeiro para dar. O texto que a tela mostra
            nesse caso ("Regiao nao informada") e do cliente: rotulo fixo dentro
            de um campo de dado e indistinguivel de um bairro com esse nome. E a
            mesma regra de `LostCaseReachPreview.area_label`.
        photo_url: { type: string, format: uri, nullable: true }
        share_url: { type: string, format: uri }

    LostCasePoster:
      type: object
      description: |
        O cartaz. Mesma regra de privacidade da projecao publica (SEC-002): sem
        `pet_id`, sem `case_id`, sem coordenada, sem dado do tutor e sem
        endereco. O contato acontece pelo canal mediado, e o papel so carrega o
        endereco curto que leva ate ele.
      required: [pet_display_name, species, size, area_label, lost_since, short_url]
      properties:
        pet_display_name: { type: string }
        species: { $ref: '#/components/schemas/Species' }
        breed_label: { type: string, nullable: true }
        size: { $ref: '#/components/schemas/PetSize' }
        primary_color: { type: string, nullable: true }
        distinctive_marks: { type: string, nullable: true }
        lost_since:
          type: string
          format: date-time
          description: |
            Quando o animal foi visto pela ultima vez (`lost_cases.last_seen_at`),
            e nao quando o caso foi aberto. Mesmo significado de
            `PublicLostPet.lost_since`.
        area_label:
          type: string
          nullable: true
          description: |
            Bairro e cidade. Nivel maximo de precisao publica. Nulo quando o caso
            so tem coordenada, pela mesma regra de `PublicLostPet.area_label`.
        photo_url:
          type: string
          format: uri
          nullable: true
          description: |
            A derivada `card` da foto principal, **1024 px de largura**. Em meia
            folha A4 (cerca de 17 cm) isso da uns 150 dpi, o bastante para um
            cartaz lido a dois metros. Nunca a `thumb` (160 px): a miniatura
            impressa vira uma mancha, e o cartaz deixa de servir para a unica
            coisa que ele faz. Nao ha derivada so para impressao, e ela so se
            paga se a medida de 150 dpi se mostrar insuficiente no papel.
        short_url:
          type: string
          format: uri
          description: |
            O endereco que o QR do papel codifica: a pagina do caso,
            `{WEB_BASE_URL}/p/{shareToken}`, o mesmo valor de
            `PublicLostCase.share_url`. E por ele que quem viu o animal chega ao
            canal mediado, sem telefone e sem endereco no cartaz.

            **Nao ha encurtador**, e o contrato nao promete um. "Curto" quer
            dizer apenas que e o endereco mais curto que leva ao caso; o nome
            fica porque renomear agora nao muda o que o QR carrega. Um encurtador proprio seria
            mais um servico e mais um dominio para manter, e um de terceiro
            colocaria outra empresa entre o cartaz e o caso.

        # `reward_note` saiu em 23/09/2026, antes de a operacao ter qualquer
        # consumidor. O ADR-0010 proibe recompensa intermediada "em nenhuma
        # forma", e o A.1 da UX proibe recompensa no cartaz: um valor em papel
        # colado no poste e a isca do golpe do falso achador. O campo nao tinha
        # coluna nem operacao que o gravasse. Nao volta sem revogar o ADR-0010.

    TransferCancelView:
      type: object
      description: |
        O minimo para a tela dizer o que sera desfeito. Sem `pet_id`, sem
        `transfer_id` e **sem o e-mail do destinatario**: quem tem o link e o
        tutor atual, que ja sabe para quem transferiu, e imprimir o endereco de
        outra pessoa numa pagina publica nao acrescenta nada a decisao dele.
      required: [pet_display_name, effective_at]
      properties:
        pet_display_name: { type: string }
        effective_at:
          type: string
          format: date-time
          description: |
            Quando a transferencia se consuma, se ninguem cancelar. E o unico
            numero que a tela precisa: ate aqui da para desfazer.
        requested_at: { type: string, format: date-time }

    PublicLostCase:
      allOf:
        - $ref: '#/components/schemas/PublicLostPet'
        - type: object
          properties:
            description:
              type: string
              nullable: true
              description: Texto do tutor. Passa pela mesma redacao de contato das mensagens.
            care_notes:
              type: string
              nullable: true
              description: O mesmo cartao de manejo da pagina do achador.
            can_report_sighting:
              type: boolean
              description: |
                Falso **so** para o proprio tutor. Verdadeiro para qualquer outra
                conta **e para quem chama sem conta**: e o botao "vi este pet", e
                ele existe para quem viu o animal, tenha conta ou nao.

                O toque leva a `POST /found-reports` (`createStrayFoundReport`)
                com o `share_token` do caso, que vincula o achado direto a ele.
                Aquela operacao exige conta, entao para o anonimo o toque passa
                antes pela entrada: **a conta e pedida no toque, nao na leitura**.
                Esconder o botao de quem nao entrou esconderia justamente de
                quem chegou pelo cartaz.
            poster_url: { type: string, format: uri }

    ProfessionalKind:
      type: string
      description: |
        A atividade. Espelha `professionals.kind` e a entrada
        `public.professionals.professionals_kind_check` do teste de conjunto
        exato. **Nao ha valor para ONG**, e a ausencia e decisao pendente do
        modelo, nao esquecimento: `professionals` nao tem `entity_kind` e
        `kind` nao tem valor para organizacao. A porta das ONGs em `Perto` leva
        hoje a lista de pets filtrada em adocao (UX 27.2.4), que e outra coisa.
      enum: [vet, groomer, walker, sitter, trainer, clinic]

    VerificationLevel:
      type: string
      description: |
        O que foi provado, derivado da verificacao aprovada mais forte da
        entidade. `none` e estado legitimo e publicavel: passeador, hospedagem,
        tosa e adestramento nao tem conselho nem registro obrigatorio
        (ADR-0011). Selo generico e proibido: a interface diz O QUE foi
        verificado, e foi por isso que a BICHUS-165 nao passou.
      enum: [none, contact_verified, document_verified]

    EvidenceKind:
      type: string
      description: |
        O tipo de prova aceita. A resposta devolve o TIPO, nunca o numero: a
        interface precisa dizer o que foi verificado e nao precisa publicar o
        numero de registro de um terceiro para isso.
      enum: [crmv, cnpj, phone_callback, document]

    DirectoryVerification:
      type: object
      description: |
        O que sustenta o selo. `evidence_kinds` e a lista dos tipos de prova
        APROVADOS daquela entidade. Vazia quando `level` e `none`.
      required: [level, evidence_kinds]
      properties:
        level: { $ref: '#/components/schemas/VerificationLevel' }
        evidence_kinds:
          type: array
          items: { $ref: '#/components/schemas/EvidenceKind' }

    DirectoryEntrySummary:
      type: object
      description: |
        O cartao da listagem. **Nao tem `id`**: o endereco e o `slug` (ADR-0010
        item 6). Nao tem coordenada, nao tem quem convidou a entidade e nao tem
        quem e o titular dela -- as duas colunas ligam a entrada a uma conta de
        pessoa, e a BICHUS-174 proibe expor vinculo entre duas pessoas inclusive
        como contagem e como existencia. A primeira e vigiada pelo portao de
        colunas que nao saem; a segunda, por nenhuma consulta de leitura a
        selecionar.
      required: [slug, kind, display_name, verification]
      properties:
        slug: { $ref: '#/components/schemas/Slug' }
        kind: { $ref: '#/components/schemas/ProfessionalKind' }
        display_name: { type: string, maxLength: 120 }
        city: { type: string, nullable: true }
        state: { type: string, nullable: true, minLength: 2, maxLength: 2 }
        neighborhood: { type: string, nullable: true }
        about: { type: string, nullable: true, maxLength: 2000 }
        phone_e164:
          type: string
          nullable: true
          description: |
            Telefone **comercial**, publicado de proposito pela entidade que
            aceitou aparecer para ser contratada (ADR-0011 secao 4). Formato
            internacional (`+` e 8 a 15 digitos), deliberadamente diferente do
            telefone de conta de usuario, que aceita so Brasil.

            **Este campo so pode existir porque a operacao exige conta.** Ele
            esta na lista de campos proibidos de
            `src/tools/portao-contrato-publico.ts`.
        rating:
          $ref: '#/components/schemas/DirectoryRating'
          description: |
            A pontuacao agregada, **para o cartao da lista mostrar a media e a
            quantidade** -- o cliente pediu os dois "na lista e na pagina"
            (18/10/2026).

            **OPCIONAL, e a opcionalidade e deliberada e nao timidez.** O APK
            publicado le esta resposta e nao conhece este campo; tornar o campo
            obrigatorio seria mudanca de contrato para ele. Alem disso, uma
            resposta que nao conseguiu agregar e melhor sem o campo do que com
            media zero -- zero se le como "pessimo", e um local sem avaliacao
            nao e pessimo. **O cartao sem `rating` nao desenha estrela
            nenhuma**, e nao desenha "0,0".

            **O custo da agregacao e por PAGINA e nao por entrada**, e isso
            importa porque esta operacao ja carrega `x-effects:
            [expensive_query]`: a contagem sai de um unico `GROUP BY` sobre
            `professional_reviews (professional_id, status, created_at DESC)`
            restrito aos no maximo 20 `professional_id` da pagina, e nao de 20
            chamadas a `pontuacao_do_local`. Vinte chamadas a funcao seriam o
            N+1 que uma lista paginada convida a escrever.

            O recorte e o MESMO da pagina do local e da lista de avaliacoes
            (`status = 'published'` e `conta_habilitada(author_user_id)`), para
            a media do cartao e a da pagina nunca discordarem.
        logo_url:
          type: string
          format: uri
          nullable: true
          description: |
            A LOGO da entidade, liberada para o aplicativo pelo cliente em
            18/10/2026 ("pode liberar as imagens do profissional no app"). E
            ela que o cartao desenha ao lado do nome.

            **E a URL da DERIVADA publica, nunca do original.** O original mora
            no armazenamento privado e nao e servido a cliente nenhum; a chave
            da derivada tem 128 bits aleatorios no nome e a forma
            `directory/{card|thumb}/{nome}.jpeg`. A URL e montada na leitura a
            partir de `MEDIA_PUBLIC_BASE_URL` (ADR-0007 §11.1 proibicao 9).

            **Nula e o estado normal**, em tres casos que a tela trata igual:
            a entrada nao tem logo; a logo foi enviada e o worker ainda nao
            terminou; a logo foi recusada nos bytes. Em nenhum deles o cartao
            deixa de existir -- ele desenha o nome sem imagem.

            **A FOTO EM FAIXA NAO ESTA AQUI, e a ausencia e medida.** Ela e
            1280 x 720 e pertence a pagina do local (`DirectoryEntryDetail.
            photo_url`): mandar a faixa em lista de ate 20 cartoes multiplicaria
            o peso da primeira pintura, que neste projeto ja chegou a 9,8 MB por
            excesso de imagem em lista. Logo na lista, foto no detalhe.
        verification: { $ref: '#/components/schemas/DirectoryVerification' }
        distance_m:
          type: integer
          nullable: true
          description: |
            Distancia ate a localizacao de referencia de quem chama,
            **arredondada a 100 m**. Nulo quando a entrada nao tem coordenada
            ou quando o chamador nao tem localizacao valida.

            Os 100 m nao sao arredondamento defensivo: e a propria grade em que
            o produto quantiza a localizacao do usuario (ADR-0006), entao
            precisao maior nao existe na origem. **Nunca sai o ponto**: um
            ponto por entrada permite montar o mapa que o ADR-0010 item 4
            existe para impedir.

            Mesmo aviso do `phone_e164`: so pode existir porque a operacao
            exige conta.

    DirectoryEntryPage:
      type: object
      required: [items, page, limit, total, distance_available]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DirectoryEntrySummary' }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        distance_available:
          type: boolean
          description: |
            `false` quando o chamador nao tem localizacao de referencia valida,
            ou quando `sort=name`. Com `false`, todo `distance_m` vem nulo e a
            ordenacao foi por nome. **A tela diz isso.** Devolver zero ou
            ordenar por outra coisa em silencio e a forma mais barata de mentir
            sobre proximidade.
        applied_filters:
          type: object
          description: |
            O recorte que de fato valeu. Traz `scope: all` quando nenhum filtro
            foi informado, porque "nada filtrado" e uma informacao e nao uma
            ausencia.
          additionalProperties: { type: string }
    DirectorySuggestionContactKind:
      type: string
      description: |
        Que tipo de contato **publico** da entidade foi informado. O tipo e
        declarado e nao adivinhado: o servidor confere o formato de `value`
        contra ele, e um palpite por heuristica aceitaria um telefone no campo
        de site e vice-versa.
      enum: [phone, website, instagram]

    DirectorySuggestionContact:
      type: object
      description: |
        **Um** contato publico da entidade, e so um. Ele e o que o painel usa
        para convidar quem a sugestao descreve (ADR-0011: convite e aceite);
        sem ele a sugestao e um nome que ninguem consegue checar.

        **E contato de ENTIDADE, divulgado por ela para ser contratada.** Nunca
        o telefone de uma pessoa fisica, nunca o contato de quem sugeriu -- a
        conta de quem sugeriu o servidor ja conhece, e ela nao entra no corpo.
      required: [kind, value]
      additionalProperties: false
      properties:
        kind: { $ref: '#/components/schemas/DirectorySuggestionContactKind' }
        value:
          type: string
          minLength: 3
          maxLength: 120
          description: |
            Conforme `kind`: `phone` e E.164 (`+5511...`), `website` e URL
            `https://` completa (a mesma regua dos campos de site do painel) e
            `instagram` e o perfil com `@`. Formato errado responde `400` com o
            campo `public_contact.value` nomeado.

    DirectorySuggestionInput:
      type: object
      description: |
        A sugestao da comunidade. **O minimo que permite checar**, e nada alem:
        nome, atividade, cidade, bairro e CEP opcionais, um contato publico e
        um recado curto para quem revisa.

        **Nao tem** `crmv_number`, `cnpj`, `verification_level`, `status`,
        `slug`, `about`, `geo`, `street_address`, `source` nem
        `claim_status` -- a sugestao nao e a entrada, e nenhum desses campos e
        de quem sugere. Verificacao e prova de quem a apresenta
        (`entity_verifications`); publicacao, nivel e ponto do mapa sao do
        painel.

        **`postal_code` entrou em 18/10/2026 e `street_address` NAO**, e a
        diferenca nao e descuido. O CEP e opcional, aponta para um trecho de
        rua e nao para uma porta, e tem destinatario: o revisor do painel, que
        precisa achar o estabelecimento para convida-lo. Logradouro e numero
        apontam para a porta de um terceiro que nao pediu nada, e nao tem
        destinatario nenhum -- o endereco publico da entrada continua sendo
        trabalho do painel (ADR-0011). Nenhum dos dois sai em superficie
        publica (ADR-0010).
      required: [display_name, kind, city, state, public_contact]
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 2
          maxLength: 120
          description: |
            O nome do estabelecimento ou do profissional, como ele se anuncia.
            Mesmo teto de `professionals.display_name`.
        kind: { $ref: '#/components/schemas/ProfessionalKind' }
        city: { type: string, minLength: 2, maxLength: 80 }
        state: { type: string, pattern: '^[A-Z]{2}$' }
        neighborhood: { type: string, minLength: 2, maxLength: 80 }
        postal_code:
          type: string
          pattern: '^[0-9]{8}$'
          description: |
            O CEP do estabelecimento, **oito digitos, sem mascara e sem
            hifen** -- a MESMA forma de `TagRequestInput.postal_code`, e nao
            uma segunda redacao dela. O campo do app so aceita digito, e uma
            forma canonica no banco e o que faz duas sugestoes do mesmo lugar
            serem comparaveis; `05435-000` e `05435000` guardados lado a lado
            nao sao.

            **OPCIONAL, e nao e exigencia nova.** Quem indica uma clinica de
            outro bairro quase sempre nao sabe o CEP dela, e cobra-lo trocaria
            uma indicacao por um campo inventado -- o mesmo juizo de
            `neighborhood`. `required` nao mudou.

            O app tambem o usa para BUSCAR bairro, cidade e estado em servico
            publico (ViaCEP, com BrasilAPI de reserva) e preencher os campos,
            **que seguem editaveis** -- decisao do cliente de 17/10. Isso e
            texto e nao coordenada: **nada aqui e geocodificado** (ADR-0006),
            e o servidor nao participa da busca nem a repete.

            ## Guardado para o REVISOR, e nunca publicado

            O cliente autorizou guardar em 18/10 ("pode armazenar o cep
            sim!"), e o destinatario e a fila de revisao do painel: ela precisa
            achar o estabelecimento para convida-lo (ADR-0011, convite e
            aceite).

            **Guardar para quem revisa nao e mostrar em publico, e a regra de
            superficie publica continua inteira:** rua e CEP nao saem no
            diretorio (ADR-0010, itens 4 e 5 -- bairro e cidade sao o teto).
            `postal_code` ja esta nas duas listas de campo proibido em
            resposta sem conta (`src/tools/portao-contrato-publico.ts` e
            `src/shared/http/vazamento-publico.ts`), e nao ha operacao de
            LEITURA de `directory_suggestions` neste contrato -- nem publica
            nem com conta. O recibo desta operacao e
            `additionalProperties: false` e nao o traz de volta.
        public_contact: { $ref: '#/components/schemas/DirectorySuggestionContact' }
        note:
          type: string
          minLength: 2
          maxLength: 280
          description: |
            Opcional, **para quem revisa** e nao para o diretorio: por que a
            pessoa recomenda. Nao e publicado, nem se a sugestao for aprovada --
            avaliacao da comunidade e outro modelo, e ele nao existe
            (ADR-0011 secao 5.4). Texto puro: contato e pagamento sao recusados
            (D59), porque o canal do contato e o campo acima.

    DirectorySuggestionState:
      type: string
      description: |
        O estado da sugestao. Nasce sempre `pending`, e so o painel a move.
        `approved` **nao** quer dizer que a entrada esta no ar: quer dizer que a
        revisao aceitou seguir com o convite do ADR-0011.
      enum: [pending, approved, declined]

    DirectorySuggestionReceipt:
      type: object
      description: |
        O recibo. **Nao e o recurso sugerido**, de proposito: devolver o texto
        de volta faria a tela parecer que algo foi publicado.
      required: [reference, state, created_at]
      additionalProperties: false
      properties:
        reference:
          type: string
          minLength: 20
          maxLength: 32
          pattern: '^[A-Za-z0-9_-]+$'
          description: |
            O identificador opaco da sugestao: 128 bits aleatorios em
            base64url. **Nao e UUID** (ADR-0010 item 6), e nao carrega o
            instante de criacao dentro, ao contrario de um UUIDv7.
        state: { $ref: '#/components/schemas/DirectorySuggestionState' }
        created_at: { type: string, format: date-time }
    MyDirectorySuggestion:
      type: object
      description: |
        Uma indicacao, como **quem a fez** a ve.

        ## Nao e `AdminDirectorySuggestion`, e a diferenca nao e de organizacao

        Sao duas audiencias com direitos diferentes sobre a mesma linha. O
        painel ve `note` -- o recado PARA QUEM REVISA --, e esta projecao
        **nao**: ele nao e conteudo da pessoa sobre a entidade, e devolve-lo
        aqui faria a tela parecer um rascunho guardado. Esta projecao devolve
        `entry_slug` **so publicado**; a do painel devolve sempre, porque o
        painel precisa pular para o rascunho que ele mesmo vai completar.

        Um `allOf` sobre a do painel acoplaria as duas: o dia em que o painel
        ganhar um campo, a pessoa o receberia junto. A duplicacao aqui e
        deliberada e e a fronteira.

        ## Nada de identificador interno, e nada da autoria

        **Sem `id`** (ADR-0010 item 6): o enderecamento e por `reference`. A
        coluna da autoria leva a marca `NUNCA sai do servidor` e nao e
        projetada pela funcao que serve esta operacao.

        **O estado da revisao e `review_status`, e nao `state`** -- `state`
        aqui e a UF, na mesma projecao, exatamente como na tabela e como em
        `AdminDirectorySuggestion`.
      required: [reference, display_name, kind, city, state, public_contact, review_status, created_at]
      additionalProperties: false
      properties:
        reference:
          type: string
          minLength: 20
          maxLength: 32
          pattern: '^[A-Za-z0-9_-]+$'
          description: O identificador opaco, 128 bits em base64url. O MESMO que o recibo de `suggestDirectoryEntry` devolveu.
        display_name: { type: string, minLength: 2, maxLength: 120 }
        kind: { $ref: '#/components/schemas/ProfessionalKind' }
        city:
          type: string
          minLength: 2
          maxLength: 80
          description: Rotulo de texto, nunca endereco e nunca origem de ponto (ADR-0006).
        state:
          type: string
          pattern: '^[A-Z]{2}$'
          description: 'A UF. **Nao e o estado da revisao**: esse e `review_status`.'
        neighborhood: { type: [string, 'null'], minLength: 2, maxLength: 80 }
        public_contact: { $ref: '#/components/schemas/DirectorySuggestionContact' }
        review_status: { $ref: '#/components/schemas/DirectorySuggestionState' }
        created_at: { type: string, format: date-time }
        decided_at:
          type: [string, 'null']
          format: date-time
          description: Nulo enquanto `pending`. Anda junto de `review_status` por `CHECK`, e nao por combinado.
        decline_reason:
          type: [string, 'null']
          maxLength: 280
          description: |
            **O motivo da recusa, e ele CHEGA a quem indicou** -- decisao de
            18/10/2026, que reverte a frase anterior deste contrato e o
            `COMMENT ON COLUMN` da `20261017000016` (ver a descricao de
            `listMyDirectorySuggestions` e o cabecalho da `20261018000003`).

            Nulo em tudo que nao foi recusado. Continua fora da entrada do
            diretorio e continua nao publicado para terceiros: quem o le e a
            conta que indicou.
        entry_slug:
          type: [string, 'null']
          description: |
            O endereco da entrada no `Perto`, **e so quando ela esta
            publicada**.

            Nulo com `review_status: approved` **tem significado**: a entrada
            existe mas esta `draft`, e nao esta no `Perto`. Isso acontece
            quando a indicacao foi aprovada sem telefone -- entrada nascida de
            contato `website` ou `instagram` nasce rascunho, porque
            `professionals` tem `phone_e164` como canal unico. A tela diz isso
            com palavras e **nao oferece link**, porque link para rascunho leva
            a pagina que nao esta la.

    MyDirectorySuggestionPage:
      type: object
      description: |
        A pagina, **da mais recente para a mais antiga**. Sem `pending_total`:
        aquele numero e o aviso do menu do PAINEL ("quanto trabalho esta
        esperando"), e nao tem sentido na tela de quem indicou -- aqui o que
        importa e o estado de cada uma, nao o tamanho de uma fila alheia.
      required: [items, page, limit, total]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MyDirectorySuggestion' }
        page: { type: integer }
        limit: { type: integer }
        total:
          type: integer
          description: |
            Quantas indicacoes o RECORTE desta chamada tem -- todas, quando
            `state` esta ausente. Alimenta "Mostrando 1 a 20 de 87" e o
            paginador, e e por isso que ele acompanha o filtro: um total que
            ignorasse `state` faria o paginador oferecer paginas vazias.

    AdminDirectorySuggestion:
      type: object
      description: |
        Uma indicacao da comunidade, como a FILA DO PAINEL a ve.

        **Nada de quem indicou**, em campo nenhum: nem nome, nem contagem por
        entidade, nem a existencia de uma conta por tras. A coluna da autoria
        leva a marca `NUNCA sai do servidor` no `COMMENT ON COLUMN` da migracao
        `20261017000004` (ADR-0011 secao 4, BICHUS-174), e o que nao chega ao
        tipo do servidor nao tem como sair daqui. **Nada de `id`** (ADR-0010
        item 6): o enderecamento e por `reference`.

        **O estado da revisao e `review_status`, e nao `state`** -- `state` aqui
        e a UF, na mesma projecao, exatamente como na tabela.
        `DirectorySuggestionReceipt` pode chamar o seu de `state` porque o
        recibo do aplicativo nao devolve a UF.
      required: [reference, display_name, kind, city, state, public_contact, review_status, created_at]
      additionalProperties: false
      properties:
        reference:
          type: string
          minLength: 20
          maxLength: 32
          pattern: '^[A-Za-z0-9_-]+$'
          description: O identificador opaco, 128 bits em base64url. O mesmo que o aplicativo recebeu no recibo.
        display_name: { type: string, minLength: 2, maxLength: 120 }
        kind: { $ref: '#/components/schemas/ProfessionalKind' }
        city:
          type: string
          minLength: 2
          maxLength: 80
          description: Rotulo de texto, nunca endereco e nunca origem de ponto (ADR-0006).
        state:
          type: string
          pattern: '^[A-Z]{2}$'
          description: 'A UF. **Nao e o estado da revisao**: esse e `review_status`.'
        neighborhood: { type: [string, 'null'], minLength: 2, maxLength: 80 }
        public_contact: { $ref: '#/components/schemas/DirectorySuggestionContact' }
        note:
          type: [string, 'null']
          maxLength: 280
          description: |
            O recado PARA QUEM REVISA. Sai aqui porque esta fila e justamente
            quem revisa; ele **nao** e copiado para a entrada do diretorio na
            aprovacao, e nao e publicado em lugar nenhum (ADR-0011 secao 5.4).
        review_status: { $ref: '#/components/schemas/DirectorySuggestionState' }
        created_at: { type: string, format: date-time }
        decided_at:
          type: [string, 'null']
          format: date-time
          description: Nulo enquanto `pending`. Anda junto de `review_status` por `CHECK`, e nao por combinado.
        decline_reason:
          type: [string, 'null']
          maxLength: 280
          description: |
            O motivo da recusa, escrito pelo administrador para o PROXIMO
            revisor. Nulo em tudo que nao foi recusado. Nao e publicado e nao
            chega a quem indicou.
        entry_slug:
          type: [string, 'null']
          description: |
            O endereco publico da entrada do diretorio que a aprovacao produziu
            -- ou da entrada que **ja existia** e a que a indicacao foi ligada.
            Nulo em tudo que nao foi aprovado. E por ele que o painel pula da
            fila para a entrada.

    AdminDirectorySuggestionPage:
      type: object
      required: [items, page, limit, total, pending_total]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminDirectorySuggestion' }
        page: { type: integer }
        limit: { type: integer }
        total:
          type: integer
          description: Quantas linhas o recorte desta chamada tem, com o filtro aplicado.
        pending_total:
          type: integer
          description: |
            **A contagem do aviso do menu**, e ela IGNORA o filtro de proposito:
            o numero que o item da navegacao mostra responde "quanto trabalho
            esta esperando". Passa pelo mesmo filtro de conta desabilitada da
            listagem e da leitura -- os tres lugares, porque filtrar em um so
            faz o painel dizer "1 pendente" sobre fila vazia, que e o defeito
            que a fila da Rede ja produziu.

    AdminDirectorySuggestionApproval:
      type: object
      description: |
        O corpo da aprovacao. **`slug` e o endereco publico da entrada**, e e
        ele que resolve a duplicata: se ja existir entrada com esse `slug`, nada
        e criado, nada na entrada existente e alterado, e a indicacao e ligada
        aquela entrada (`entry_created: false`).

        **Nao ha `city`, `state`, `kind` nem `display_name` aqui**: esses vem da
        indicacao, e deixar o operador reescreve-los faria a aprovacao ser um
        formulario de cadastro com outro nome -- para isso existe
        `createAdminDirectoryEntry`. Corrigir a entrada depois de aprovada e
        `updateAdminDirectoryEntry`.

        **Nao ha `status`.** Publicar nao e parametro: a entrada vai ao ar
        quando estiver completa pela regua de `missing_to_publish`, e fica em
        `draft` quando nao estiver.
      required: [slug]
      additionalProperties: false
      properties:
        slug: { $ref: '#/components/schemas/Slug' }
        phone_e164:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
          description: |
            O telefone COMERCIAL da entidade (ADR-0011 secao 4), opcional, e so
            usado quando a entrada e criada agora. Existe porque
            `professionals` so tem `phone_e164` como canal de contato: a
            indicacao cujo contato publico e `website` ou `instagram` nao tem o
            que copiar, e sem telefone a entrada nasce `draft` e nao aparece no
            `Perto`. Informado, a entrada nasce no ar. Ignorado quando a
            indicacao e ligada a uma entrada que ja existe -- alterar a entrada
            existente e `updateAdminDirectoryEntry`, que tem `If-Match`.

    AdminDirectorySuggestionApproved:
      type: object
      description: A indicacao aprovada, a entrada do diretorio, e qual dos dois caminhos aconteceu.
      required: [suggestion, entry, entry_created]
      additionalProperties: false
      properties:
        suggestion: { $ref: '#/components/schemas/AdminDirectorySuggestion' }
        entry: { $ref: '#/components/schemas/AdminDirectoryEntry' }
        entry_created:
          type: boolean
          description: |
            `true` quando a entrada nasceu desta aprovacao; `false` quando a
            indicacao foi ligada a uma entrada que ja existia, que e a
            duplicata. A tela diz as duas coisas com palavras diferentes:
            "entrada criada" e "ligada a entrada que ja estava no Perto".

    AdminDirectorySuggestionDecline:
      type: object
      description: |
        O corpo da recusa. **O motivo e obrigatorio**, ao contrario das outras
        duas filas do painel: ele e para o PROXIMO revisor, porque a mesma
        entidade vai ser indicada outra vez. Nao e publicado e nao chega a quem
        indicou.
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 2
          maxLength: 280
          description: |
            Por que a indicacao foi recusada. Texto puro, com o mesmo teto do
            recado da indicacao: contato e pagamento sao recusados (D59) e
            controle bidirecional tambem, como todo texto que uma pessoa
            escreve neste produto.

    PostalCodeAddress:
      type: object
      description: |
        O que a busca de CEP devolve: **texto, nunca coordenada** (ADR-0006).

        Os quatro campos sao os que um formulario preenche, e sao os mesmos
        quatro que `app/lib/api/busca_de_cep.dart` ja lia das duas bases desde
        17/10/2026 -- esta forma espelha a dele e nao inventa uma segunda.

        **O que foi deixado de fora, e cada ausencia e deliberada:**

        - `location.coordinates` da BrasilAPI (latitude e longitude). Ler isso
          transformaria uma busca de texto num geocodificador, que e o que a
          ADR-0006 proibe. Nao ha campo aqui, nao ha coluna no banco e o
          adaptador nunca o le.
        - `ibge`, `timezoneName` e `service`: nenhum tem campo em formulario
          nenhum, e guardar dado sem finalidade e o oposto da minimizacao.
        - `complemento` do ViaCEP. **Ele NAO e o complemento de quem preenche**:
          vem como "ate 609 - lado impar" e descreve a FAIXA da rua. Jogar isso
          num campo de complemento poria o conjunto de ninguem no endereco de
          uma clinica.
      required: [street, neighborhood, city, state]
      additionalProperties: false
      properties:
        street:
          type: string
          description: |
            O logradouro. **Pode vir vazio**, e isso nao e erro: CEP de cidade
            inteira ("CEP geral") nao aponta para uma rua. A tela deixa o campo
            para quem preenche.
        neighborhood:
          type: string
          description: O bairro. Vazio pelo mesmo motivo de `street`.
        city: { type: string, minLength: 2, maxLength: 80 }
        state:
          type: string
          minLength: 2
          maxLength: 2
          description: |
            A UF, duas letras maiusculas. Quando a base nao devolve cidade ou
            devolve UF que nao tem dois caracteres, a resposta nao e `200`: o
            adaptador trata como "nao encontrado" em vez de entregar endereco
            pela metade, que apagaria o que a pessoa ja tinha digitado.

    DirectoryEntryStatus:
      type: string
      description: |
        A situacao da entrada. Espelha `professionals.status` e a entrada
        `public.professionals.professionals_status_check` do teste de conjunto
        exato. So `published` aparece em `Perto`.

        `hidden` e retirada temporaria (moderacao, estabelecimento fechado para
        reforma) e `removed` e retirada definitiva **sem apagar a linha**: a
        entrada sai do diretorio e continua existindo para a trilha.
      enum: [draft, published, hidden, removed]

    DirectoryEntryOrigin:
      type: string
      description: |
        Como a linha nasceu. Espelha `professionals.source`. **Somente
        leitura**: nao ha campo para enviar `source`, e o painel grava sempre
        `import`, que e o unico valor que o `CHECK
        professionals_aceite_antes_do_perfil` admite para uma entrada sem
        titular. `self` e `invited` sao os caminhos que passam pelo aceite de
        quem o perfil descreve, e o painel nao tem como produzir esse aceite.
      enum: [self, invited, import]

    DirectoryEntryClaimStatus:
      type: string
      description: |
        Quem responde pelo perfil. Espelha `professionals.claim_status`.
        **Somente leitura.** A entrada cadastrada pelo painel nasce
        `unclaimed`: a entidade existe no diretorio e ninguem do outro lado
        reivindicou o perfil. **Isto nao e um vinculo entre pessoas** -- quem
        reivindicou nunca sai do servidor, e esta resposta nao o carrega.
      enum: [unclaimed, claim_pending, claimed, disputed]

    AdminDirectoryEntryMissingField:
      type: string
      description: |
        Um campo que falta para a entrada poder ir ao ar. `slug` esta na lista
        porque `DirectoryEntrySummary.slug` e `required` na listagem do
        aplicativo: uma entrada publicada sem endereco publico nao teria como
        ser serializada, e o defeito apareceria como erro de serializacao em
        producao, longe de quem o causou.

        `phone_e164` e hoje o **unico** canal de contato que a tabela tem: nao
        existe coluna para site, e-mail, WhatsApp nem rede social. Quando
        existirem, "ao menos um canal" passa a ser uma disjuncao.
      enum: [slug, city, state, phone_e164]

    AdminDirectoryEntryInput:
      type: object
      required: [slug, kind, display_name]
      additionalProperties: false
      description: |
        O cadastro de uma entrada, **em rascunho**. Ver
        `createAdminDirectoryEntry` para o que deliberadamente nao esta aqui:
        documento (`cnpj`, `crmv_*`), nivel de verificacao, coordenada, e
        qualquer coisa de ONG.
      properties:
        slug:
          allOf:
            - $ref: '#/components/schemas/Slug'
          description: |
            O endereco publico da entrada, e tambem como o painel a endereca.
            **Obrigatorio ja no rascunho**, e nao so na publicacao: a
            unicidade e global sobre nao-nulo desde a `20260922000021`, e
            exigir o endereco no cadastro move a recusa de conflito de nome
            para quem esta cadastrando, com o formulario na tela, em vez de
            para o momento de publicar.
        kind: { $ref: '#/components/schemas/ProfessionalKind' }
        display_name:
          type: string
          minLength: 2
          maxLength: 120
          description: O nome do estabelecimento ou de quem atende, como aparece em `Perto`.
        about:
          type: string
          minLength: 2
          maxLength: 2000
          description: Texto puro, renderizado como texto no app (D47). Nenhuma marcacao.
        city: { type: string, minLength: 2, maxLength: 80 }
        state:
          type: string
          minLength: 2
          maxLength: 2
          description: A UF, duas letras.
        # ---------------------------------------------------------------
        # A LOGO E A FOTO (cliente, 18/10/2026)
        # ---------------------------------------------------------------
        # *"coloque um campo no backoffice para subir uma imagem do logo e foto
        # dos profissionais recomendados"*. Quem sobe e o ADMINISTRADOR, no
        # painel, pelo caminho que a `Loja` e a `Rede` ja usam: o envio e
        # autorizado por `createAdminCatalogImageUploadIntent`, os bytes vao
        # direto ao armazenamento, e aqui chega apenas o `upload_id`.
        #
        # OS DOIS SAO OPCIONAIS, e isso e requisito e nao conveniencia:
        # profissional sem logo e sem foto continua sendo cadastrado, publicado
        # e listado exatamente como antes.
        logo_upload_id:
          type: string
          format: uuid
          description: |
            O `upload_id` de um envio com `purpose: directory_logo` desta mesma
            sessao do painel. Envio de outro proposito, ja usado em outra
            entrada ou vencido e recusado com `400`
            (`code: upload_not_usable`), sem dizer qual dos casos ocorreu.
        photo_upload_id:
          type: string
          format: uuid
          description: |
            O `upload_id` de um envio com `purpose: directory_photo`. Mesma
            regra de recusa da logo.
        # ---------------------------------------------------------------
        # O ENDERECO DE RUA, e por que ele existe aqui a partir de 18/10/2026
        # ---------------------------------------------------------------
        # A decisao 9.2 de `api/contrato-de-escrita-do-diretorio.md` --
        # "endereco de rua e numero entra no diretorio?" -- foi respondida pelo
        # cliente: *"pode colocar o campo cep sim, ele e um usuario
        # administrador, responsavel por cadastrar varias informacoes
        # publicas"*.
        #
        # ELE AUTORIZOU QUEM PREENCHE, E NAO O QUE APARECE EM PUBLICO -- e as
        # duas coisas sao diferentes. Os quatro campos entram aqui, no corpo do
        # PAINEL, e **nenhum deles entrou em `DirectoryEntrySummary`**, que e o
        # cartao que o aplicativo le em `Perto`. Exibir endereco completo e
        # decisao de produto que nao foi tomada, e um profissional autonomo --
        # adestrador, passeador, veterinario que atende em casa -- tem como
        # "endereco" a casa dele.
        #
        # **TODOS OPCIONAIS**, e nenhum em `AdminDirectoryEntryMissingField`:
        # quem nao tem endereco fixo continua cadastravel e publicavel.
        neighborhood: { type: string, minLength: 2, maxLength: 80 }
        postal_code:
          type: string
          pattern: '^[0-9]{8}$'
          description: |
            CEP com oito digitos, **sem mascara e sem hifen** -- mesmo formato
            de `CollarTagShippingAddress.postal_code`, copiado dele. O painel
            recebe com mascara e manda assim.

            `GET /v1/admin/postal-codes/{postalCode}` o troca por rua, bairro,
            cidade e UF **para poupar digitacao**, e o resultado e editavel: o
            servidor nao refaz a busca e nao confere o endereco contra o CEP.
            Quem cadastra manda o que conferiu na tela.
        street: { type: string, minLength: 2, maxLength: 120 }
        street_number:
          type: string
          minLength: 1
          maxLength: 20
          description: Texto, e nao inteiro - `s/n`, `120A` e `KM 32` sao numeros de porta. Mesma decisao de `CollarTagShippingAddress.street_number`.
        complement: { type: string, minLength: 1, maxLength: 80 }
        phone_e164:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
          description: |
            Telefone **comercial** em E.164, publicado de proposito pela
            entidade que aceitou aparecer para ser contratada (ADR-0011 secao
            4). Deliberadamente diferente do telefone de conta de usuario, que
            aceita so Brasil. O painel recebe o numero com mascara brasileira e
            manda E.164.

    AdminDirectoryEntryPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        A edicao. `null` **apaga** o campo e ausente **nao mexe** -- a
        distincao e o que separa "limpar o bairro" de "editar so o telefone".
        `slug`, `kind` e `display_name` nao aceitam `null`: a entrada nao
        existe sem eles.
      properties:
        slug:
          allOf:
            - $ref: '#/components/schemas/Slug'
          description: Trocar o endereco publico e permitido, e todo link ja compartilhado para o antigo deixa de resolver.
        kind: { $ref: '#/components/schemas/ProfessionalKind' }
        display_name: { type: string, minLength: 2, maxLength: 120 }
        about: { type: string, nullable: true, minLength: 2, maxLength: 2000 }
        city: { type: string, nullable: true, minLength: 2, maxLength: 80 }
        state: { type: string, nullable: true, minLength: 2, maxLength: 2 }
        neighborhood: { type: string, nullable: true, minLength: 2, maxLength: 80 }
        # A LOGO e a FOTO (18/10/2026). `null` TIRA a imagem, ausente nao mexe,
        # `upload_id` novo TROCA -- o mesmo idioma de `price` e de
        # `image_upload_id` na `Loja`. Tirar a imagem nao apaga objeto nenhum do
        # balde: o que sai e o ponteiro da entrada.
        logo_upload_id: { type: [string, 'null'], format: uuid }
        photo_upload_id: { type: [string, 'null'], format: uuid }
        # Os quatro do endereco de rua (decisao 9.2, respondida em 18/10). `null`
        # APAGA e ausente NAO MEXE, como os demais: e a distincao que separa
        # "limpar o CEP" de "editar so o telefone". Nenhum deles e exigido para
        # publicar -- ver o comentario em `AdminDirectoryEntryInput`.
        postal_code: { type: string, nullable: true, pattern: '^[0-9]{8}$' }
        street: { type: string, nullable: true, minLength: 2, maxLength: 120 }
        street_number: { type: string, nullable: true, minLength: 1, maxLength: 20 }
        complement: { type: string, nullable: true, minLength: 1, maxLength: 80 }
        phone_e164:
          type: string
          nullable: true
          pattern: '^\+[1-9][0-9]{7,14}$'
          description: Ver `AdminDirectoryEntryInput.phone_e164`. `null` apaga o telefone, e uma entrada publicada sem nenhum canal de contato e recusada.
        status:
          allOf:
            - $ref: '#/components/schemas/DirectoryEntryStatus'
          description: |
            **Sem este campo o estado nao muda.** E assim que "editar nao
            despublica" deixa de ser uma frase: nao existe caminho que mexa em
            `status` sem o corpo ter pedido.

    AdminDirectoryEntry:
      type: object
      description: |
        A entrada como o painel a ve. **Nao tem `id`** (ADR-0010 item 6, e o
        painel endereca por `slug` como em `Loja` e `Rede`), nao tem coordenada,
        nao tem quem convidou a entidade e nao tem quem a reivindicou: as duas
        ultimas ligam a entrada a uma conta de pessoa, e a BICHUS-174 proibe
        expor vinculo entre duas pessoas inclusive como contagem e como
        existencia.

        **`cnpj`, `crmv_number` e `crmv_uf` tambem nao saem aqui.** Eles existem
        na tabela, o painel nao os escreve, e devolve-los faria uma tela de
        cadastro mostrar documento de terceiro sem nenhuma necessidade.
      required:
        [slug, kind, display_name, status, verification, source, claim_status,
         missing_to_publish, created_at, updated_at, version]
      properties:
        slug: { $ref: '#/components/schemas/Slug' }
        kind: { $ref: '#/components/schemas/ProfessionalKind' }
        display_name: { type: string, maxLength: 120 }
        about: { type: string, nullable: true, maxLength: 2000 }
        city: { type: string, nullable: true }
        state: { type: string, nullable: true, minLength: 2, maxLength: 2 }
        neighborhood: { type: string, nullable: true }
        # O endereco de rua SAI AQUI, nesta resposta do painel, e **nao sai em
        # `DirectoryEntrySummary`**: a tela de edicao precisa mostrar o que
        # gravou, e o aplicativo continua recebendo so bairro, cidade e UF.
        postal_code: { type: string, nullable: true }
        street: { type: string, nullable: true }
        street_number: { type: string, nullable: true }
        complement: { type: string, nullable: true }
        phone_e164: { type: string, nullable: true }
        # A LOGO e a FOTO (cliente, 18/10/2026). Nulas quando a entrada nao tem,
        # e nulo e o estado normal. **Sem `upload_id` e sem `id` de imagem**: o
        # painel escreve por `logo_upload_id`/`photo_upload_id` e LE a URL da
        # derivada, e nenhum UUID interno sai aqui (ADR-0010 item 6).
        logo:
          oneOf:
            - $ref: '#/components/schemas/AdminCatalogImage'
            - type: 'null'
          description: |
            A logo da entidade, quadrada. `status: processing` enquanto o worker
            nao terminou, e `url` nula nesse intervalo: a tela mostra o lugar da
            imagem, nao um erro.
        photo:
          oneOf:
            - $ref: '#/components/schemas/AdminCatalogImage'
            - type: 'null'
          description: |
            A foto da fachada ou do ambiente, em faixa 16:9. Mesma regra de
            `status` e `url` da logo.
        status: { $ref: '#/components/schemas/DirectoryEntryStatus' }
        verification:
          allOf:
            - $ref: '#/components/schemas/DirectoryVerification'
          description: |
            **Somente leitura**, derivada de `entity_verifications`. Esta aqui
            para a tela poder dizer O QUE foi verificado, e nao para ser
            escrita: nao ha campo de verificacao em nenhum corpo desta secao.
        source: { $ref: '#/components/schemas/DirectoryEntryOrigin' }
        claim_status: { $ref: '#/components/schemas/DirectoryEntryClaimStatus' }
        missing_to_publish:
          type: array
          description: |
            O que falta para a entrada ir ao ar, **vazio quando nada falta**. A
            tela mostra isso antes de alguem clicar em publicar; a mesma regua
            recusa a publicacao com `400` se tentarem de outro jeito.
          items: { $ref: '#/components/schemas/AdminDirectoryEntryMissingField' }
        published_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Desde quando a entrada esta no ar. Nulo enquanto ela nunca foi
            publicada. **Nao e `created_at`**: a entrada nasce rascunho e pode
            ser publicada meses depois, e uma correcao de telefone numa entrada
            ja publicada nao muda esta resposta.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }

    AdminDirectoryEntryPage:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminDirectoryEntry' }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        applied_filters:
          type: object
          description: |
            O recorte que de fato valeu. Traz `scope: all` quando nenhum filtro
            foi informado, porque "nada filtrado" e uma informacao e nao uma
            ausencia. Mesma forma de `DirectoryEntryPage.applied_filters`.
          additionalProperties: { type: string }
    DirectoryRating:
      type: object
      description: |
        A pontuacao agregada de um local, no formato que a Play Store tornou
        legivel: a media, quantas pessoas avaliaram e como as notas se
        distribuem.

        **CALCULADA NA CONSULTA, nao materializada.** Nao ha coluna
        `rating_average` em `professionals` e nao ha gatilho que a mantenha. O
        motivo e consistencia e nao preguica: media guardada tem quatro
        caminhos de invalidacao (criar, editar, apagar, remover pela moderacao)
        mais um quinto invisivel -- o autor desabilitar a conta, que muda a
        media de todo local que ele avaliou sem tocar em nenhuma avaliacao. Um
        gatilho em `professional_reviews` nao enxerga esse quinto caminho, e a
        media ficaria errada em silencio, que e o pior defeito desta classe.
        Com `AVG` sobre o indice de `(professional_id, status)` a conta sai da
        mesma consulta da pagina, e a pagina le UM local.

        **O recorte da conta e identico ao da lista** (`status = 'published'` e
        `conta_habilitada(author_user_id)`), e isso e o que impede "128
        avaliacoes" sobre uma lista que mostra 126.

        **`average` e nulo quando `count` e zero**, e nao zero: zero e uma nota
        possivel de se ler como "pessimo", e um local sem avaliacao nao e
        pessimo. A tela escreve "Ainda sem avaliacoes" e nao desenha estrela
        nenhuma.
      required: [count, histogram]
      properties:
        average:
          type: number
          format: double
          nullable: true
          minimum: 1
          maximum: 5
          description: |
            A media das notas publicadas, **com uma casa decimal** (o servidor
            arredonda; a tela nao decide). Nula quando `count` e zero.
        count:
          type: integer
          minimum: 0
          description: Quantas avaliacoes publicadas o local tem.
        histogram:
          type: object
          description: |
            Quantas avaliacoes em cada nota. **As cinco chaves vem sempre**,
            inclusive com zero: a barra de uma nota que ninguem deu precisa
            existir vazia, senao o grafico muda de forma e deixa de ser
            comparavel entre locais.
          required: ['1', '2', '3', '4', '5']
          properties:
            '1': { type: integer, minimum: 0 }
            '2': { type: integer, minimum: 0 }
            '3': { type: integer, minimum: 0 }
            '4': { type: integer, minimum: 0 }
            '5': { type: integer, minimum: 0 }
          additionalProperties: false

    DirectoryEntryDetail:
      type: object
      description: |
        A pagina do local. **Os mesmos campos de `DirectoryEntrySummary`**,
        mais `rating` e `my_review_ref`.

        Ela repete os campos em vez de usar `allOf` com o resumo porque o
        gerador de tipos de `src/`, `admin/` e `web/` produz uniao de
        interseccao para `allOf`, e um campo nulavel atravessa isso perdendo a
        nulabilidade. Os tres geradores leem este arquivo.

        **A FOTO E A LOGO PASSARAM A EXISTIR**, e esta frase substitui a
        anterior, que dizia que "foto nao e coluna de `professionals`". Era
        verdade e deixou de ser: a migracao `20261018000008` criou
        `logo_image_id` e `photo_image_id`, e o cliente liberou as duas para o
        aplicativo em 18/10/2026. Site, e-mail, WhatsApp, redes sociais e
        horario continuam sem coluna e continuam fora -- declarar campo que
        ninguem pode preencher produziria uma tela com linhas vazias
        permanentes.

        **Nao tem `id`, nao tem coordenada, nao tem quem convidou e nao tem
        quem e o titular** -- exatamente como o resumo, e pelos mesmos motivos
        (ADR-0010 item 6 e BICHUS-174).
      required: [slug, kind, display_name, verification, rating]
      properties:
        slug: { $ref: '#/components/schemas/Slug' }
        kind: { $ref: '#/components/schemas/ProfessionalKind' }
        display_name: { type: string, maxLength: 120 }
        city: { type: string, nullable: true }
        state: { type: string, nullable: true, minLength: 2, maxLength: 2 }
        neighborhood: { type: string, nullable: true }
        about: { type: string, nullable: true, maxLength: 2000 }
        phone_e164:
          type: string
          nullable: true
          description: |
            Telefone **comercial** (ADR-0011 secao 4), e a unica acao de
            contato que a pagina oferece. Mesmo aviso de
            `DirectoryEntrySummary`: este campo so pode existir porque a
            operacao exige conta -- ele esta na lista de proibidos de
            `src/tools/portao-contrato-publico.ts`.
        logo_url:
          type: string
          format: uri
          nullable: true
          description: |
            A LOGO, a MESMA de `DirectoryEntrySummary.logo_url` e com a mesma
            regra: derivada publica, nunca o original, nula quando nao ha, quando
            ainda processa e quando foi recusada. A pagina a desenha ao lado do
            nome, como o cartao.
        photo_url:
          type: string
          format: uri
          nullable: true
          description: |
            A FOTO do lugar -- fachada ou ambiente --, liberada para o
            aplicativo pelo cliente em 18/10/2026. Faixa 16:9, derivada
            `banner` de 1280 x 720, e e a imagem que a pessoa olha GRANDE antes
            de decidir se leva o animal ali.

            **So no detalhe, e nunca na listagem.** Ela nao existe em
            `DirectoryEntrySummary` de proposito: a faixa em ate 20 cartoes
            multiplicaria o peso da primeira pintura, e a lista desenha a logo.

            **E a URL da DERIVADA publica, nunca do original**, com a forma
            `directory/{banner|card}/{nome}.jpeg`. Nula quando nao ha foto,
            quando o worker ainda nao terminou e quando os bytes foram
            recusados -- nos tres a pagina existe sem a faixa.
        verification: { $ref: '#/components/schemas/DirectoryVerification' }
        distance_m:
          type: integer
          nullable: true
          description: |
            Arredondada a 100 m, que e a grade do ADR-0006. Nula quando a
            entrada nao tem coordenada ou quando quem chama nao tem localizacao
            de referencia valida. **Nunca sai o ponto.**
        rating: { $ref: '#/components/schemas/DirectoryRating' }
        my_review_ref:
          type: string
          nullable: true
          minLength: 20
          maxLength: 32
          pattern: '^[A-Za-z0-9_-]+$'
          description: |
            O `ref` da MINHA avaliacao deste local, ou nulo se eu nao avaliei.

            Existe para a tela saber, **antes de montar**, se desenha o campo
            vazio ou a minha avaliacao com `Editar` e `Apagar`. Sem ele a tela
            teria de varrer a paginacao inteira das avaliacoes procurando
            `mine: true`, e a minha pode estar na pagina 7.
        can_review:
          type: boolean
          description: |
            **Se EU posso avaliar agora**, e nao se a funcionalidade existe. E
            falso para conta sem e-mail confirmado -- a mesma regua de criar
            encontro.

            Ele existe para a tela nao oferecer um campo que vai levar `403`.
            **Nao substitui a checagem do servidor**: `putMyDirectoryEntryReview`
            reavalia a condicao, porque um campo de resposta e uma dica de
            interface e nunca a autorizacao.
        review_blocked_reason:
          type: string
          nullable: true
          enum: [unverified_channel]
          description: |
            Por que `can_review` e falso, para a tela escrever a frase certa e
            oferecer a acao certa (confirmar o e-mail) em vez de um "nao e
            possivel" sem saida. Nulo quando `can_review` e verdadeiro.

            Enum de um valor so hoje, e aberto de proposito: quando houver
            bloqueio por moderacao ele entra aqui e nao em um segundo booleano.

    DirectoryReview:
      type: object
      description: |
        Uma avaliacao, como a lista e a pagina a mostram.

        **Nao ha identificador do autor, de nenhuma forma.** Nem conta, nem
        `slug`, nem ref opaco estavel entre locais. `ref` identifica a
        AVALIACAO e e sorteado por linha: duas avaliacoes da mesma pessoa em
        locais diferentes nao tem nada em comum na resposta. A BICHUS-174
        proibe expor vinculo entre duas pessoas "inclusive como contagem e como
        existencia", e um ref de autor permitiria montar o historico de
        qualquer um.
      required: [ref, rating, created_at, mine]
      properties:
        ref:
          type: string
          minLength: 20
          maxLength: 32
          pattern: '^[A-Za-z0-9_-]+$'
          description: |
            O identificador opaco da avaliacao, usado por
            `reportDirectoryEntryReview` e pela remocao do painel. **Nao e
            UUID** (ADR-0010 item 6) e nao e derivado do autor.
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: |
            A nota, inteira de 1 a 5. Nunca nula: a nota E a avaliacao.
        body:
          type: string
          nullable: true
          maxLength: 1500
          description: |
            A recomendacao em texto. **Nula e estado normal e frequente**: o
            cliente decidiu que o texto e opcional, e dar so a nota tem de
            funcionar. A tela mostra o item com as estrelas e sem paragrafo.

            **Texto puro, sem HTML e sem marcacao.** O servidor recusa `<` e
            `>` no corpo (`400`) em vez de escapar na saida: escapar depende de
            toda tela futura lembrar de escapar, e recusar na entrada vale uma
            vez. Quem escrever "nota 10 <3" leva `400` -- custo aceito e
            preferivel ao inverso.
        author_display_name:
          type: string
          nullable: true
          maxLength: 60
          description: |
            O nome de exibicao de quem escreveu, **ou nulo**. Nulo e estado
            normal (conta sem nome), e a tela escreve "Alguem da comunidade" em
            vez de deixar a linha muda.
        created_at:
          type: string
          format: date-time
          description: Quando a avaliacao foi publicada pela primeira vez.
        edited_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Quando o autor a editou pela ultima vez, ou nulo se nunca editou.
            **A tela diz "editada"**: uma avaliacao reescrita depois de quem
            respondeu a ela ter lido a primeira versao e um formato conhecido
            de ma-fe, e marcar a edicao e o que o torna visivel.
        mine:
          type: boolean
          description: |
            Verdadeiro na avaliacao de quem chama. A tela a tira do fluxo e a
            mostra no bloco de edicao, com `Editar` e `Apagar`.

    DirectoryReviewPage:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DirectoryReview' }
        page: { type: integer }
        limit: { type: integer }
        total:
          type: integer
          description: |
            O total de avaliacoes publicadas do local, **o mesmo numero de
            `DirectoryRating.count`**, porque as duas consultas usam o mesmo
            recorte. Dois numeros diferentes na mesma tela e o defeito que a
            duplicacao de recorte produz.

    DirectoryReviewInput:
      type: object
      description: O corpo de `putMyDirectoryEntryReview`.
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: |
            **Inteira de 1 a 5**, e obrigatoria. Nota fora da faixa e `400`, e
            o `CHECK` da tabela cobra o mesmo no banco -- duas recusas, porque
            uma delas e a que sobra se a outra for contornada.

            Nao ha meia estrela: o cliente pediu nota de 1 a 5 e meia estrela
            mudaria o tipo da coluna depois de haver dado gravado.
        body:
          type: string
          nullable: true
          maxLength: 1500
          description: |
            **Opcional.** Enviar so a nota funciona, e e o caso comum.

            O limite de 1500 e o limite da coluna, nao um numero de tela: o
            `CHECK` em `professional_reviews.body` recusa 1501. Texto maior e
            `400`.

            **Sem HTML**: `<` e `>` sao recusados (`400`,
            `code: html_not_allowed`). String vazia ou so com espaco e tratada
            como ausente e grava nulo -- gravar `''` criaria duas
            representacoes de "sem texto" e toda tela teria de conhecer as
            duas.
      additionalProperties: false

    DirectoryReviewWritten:
      type: object
      description: A resposta de `putMyDirectoryEntryReview`.
      required: [review, created, rating]
      properties:
        review: { $ref: '#/components/schemas/DirectoryReview' }
        created:
          type: boolean
          description: |
            Verdadeiro quando esta foi a PRIMEIRA avaliacao desta pessoa neste
            local; falso quando o envio atualizou a que ja existia.

            A tela escolhe entre "Avaliacao publicada" e "Avaliacao
            atualizada" com este campo. Sem ele ela teria de adivinhar pelo
            estado que tinha antes, que e exatamente o estado que pode estar
            velho.
        rating:
          $ref: '#/components/schemas/DirectoryRating'
          description: |
            A pontuacao do local **ja com esta avaliacao dentro**. Vem na mesma
            resposta para a tela nao precisar de uma segunda chamada so para
            atualizar a media que o proprio toque acabou de mudar -- e porque
            uma segunda chamada deixaria a media velha na tela se ela falhasse.

    DirectoryReviewReportInput:
      type: object
      description: |
        O corpo de `reportDirectoryEntryReview`.

        **Motivo de lista fechada e nao texto livre**, pelo mesmo desenho de
        `conversation_reports` (migracao `20260928000009`): a fila de moderacao
        precisa ser triada, e campo livre nao tria. O `detail` existe para o
        caso que a lista nao cobre, e e opcional.
      required: [reason]
      properties:
        reason:
          type: string
          enum: [spam, offensive, false_information, not_about_this_place, other]
          description: |
            `not_about_this_place` existe porque e o caso mais comum e mais
            facil de verificar num diretorio: a pessoa avaliou o lugar errado.
            `false_information` e o caso que motiva a rota existir -- negocio
            real com nome e endereco, e uma afirmacao falsa sobre ele tem
            consequencia fora do app.
        detail:
          type: string
          nullable: true
          maxLength: 1000
          description: |
            Opcional, e o mesmo limite de `conversation_reports.detail`. Sem
            HTML, como o corpo da avaliacao.
      additionalProperties: false

    DirectoryReviewRemovalInput:
      type: object
      description: O corpo de `removeAdminDirectoryReview`.
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
          description: |
            **Obrigatorio**: e a diferenca entre moderacao e arbitrio. Vai para
            `professional_reviews.moderation_reason` e para a trilha, e **nunca
            sai para o app** -- nenhuma leitura publica projeta esta coluna.
      additionalProperties: false

    StoreCategory:
      type: string
      pattern: '^[a-z][a-z0-9_]{1,29}$'
      minLength: 2
      maxLength: 30
      description: |
        O **codigo** da categoria do produto, primeiro dos dois niveis
        (decisao do cliente de 17/10: "dois niveis, com subcategorias como a
        petlove").

        **Deixou de ser `enum` em 17/10/2026, e a troca e deliberada.** A lista
        continua FECHADA; o que mudou e quem a fecha: ela mora em
        `store_categories` e sai por `GET /v1/store/taxonomy`, com o rotulo e
        as subcategorias de cada uma. Mesma forma de `breed_code`, que tambem e
        `string` aqui e tem a lista em `ref_breeds`, servida por
        `GET /v1/public/reference-data`.

        Com 14 categorias e 83 subcategorias, `enum` aqui faria cada ajuste de
        vocabulario ser mudanca de contrato das QUATRO aplicacoes mais um APK
        novo -- e nao teria onde expressar que a subcategoria pertence a uma
        categoria, nem que a arvore varia por especie.

        **Os seis codigos anteriores continuam validos e com o mesmo
        significado de linha**: `food`, `toy`, `hygiene`, `accessory`, `health`
        e `bed` sao os codigos canonicos de seis das 14 categorias. O APK
        publicado filtra e le por eles, e nenhum item teve o codigo trocado. O
        que mudou neles e o ROTULO (`food` agora se chama "Racoes", porque
        existe `treats` ao lado), e rotulo e dado.

        Codigo desconhecido ou inativo na escrita administrativa e `400`
        (`code: unknown_category`); no filtro de leitura ele devolve lista
        vazia, e nao erro, pela mesma razao de `tag`: o link antigo continua
        abrindo.

    StoreSubcategory:
      type: string
      pattern: '^[a-z][a-z0-9_]{1,39}$'
      minLength: 2
      maxLength: 40
      description: |
        O **codigo** da subcategoria, segundo nivel. Unico DENTRO da categoria,
        nao globalmente: quem identifica e o par `(category, subcategory)`, e e
        esse par que `store_items` referencia por chave estrangeira composta --
        "a subcategoria pertence a categoria escolhida" e invariante de banco, e
        nao conferencia de aplicacao.

        **Nunca `enum`**, pela razao do campo acima elevada ao quadrado: sao 83
        valores hoje, so da arvore de cachorro, e as de gato, passaro, peixe e
        outros ainda nao foram levantadas.

        A lista sai por `GET /v1/store/taxonomy`, agrupada pela categoria.

    StorePartnerRef:
      type: object
      description: |
        O parceiro que vende o item. **Sem UUID**: `slug` e a unica chave do
        parceiro que sai daqui. A identidade interna (`store_partners.id`)
        existe no esquema, e o ADR-0024 registra por que ela e separada do
        endereco publico -- ela nunca e projetada, e o portao de contrato
        publico reprova quem tentar.
      required: [slug, name, host]
      properties:
        slug: { type: string }
        name: { type: string }
        host:
          type: string
          description: |
            Apenas o host, sem esquema, caminho nem consulta. E o que permite a
            tela nomear o destino ANTES da saida ("Abrir na Cobasi"), como manda
            a consequencia 1 da BICHUS-185.

    StorePriceStatus:
      type: string
      description: |
        **Tres estados, e nao dois.** `sem_preco` e `vencido` produzem a mesma
        ausencia de numero e pedem textos diferentes: item que nunca teve preco
        nao mostra a linha (ausencia de preco e estado normal); item com preco
        vencido diz que o preco nao esta confirmado e aponta o parceiro. Um
        booleano faria a tela escolher uma frase so para os dois casos.
      enum: [vigente, vencido, sem_preco]

    StoreItemSummary:
      type: object
      required: [slug, title, summary, category, target_url, partner, price_status]
      properties:
        slug:
          type: string
          description: O endereco publico do item. Nao ha UUID nesta tabela.
        title: { type: string }
        summary:
          type: string
          description: |
            A descricao do produto, texto puro. **Pode ter quebra de linha** e
            **chega a 3000 caracteres** desde 17/10/2026, quando o campo do
            painel virou area de texto e o cliente alargou o teto (era 180). A
            quebra conta como caractere.

            **Quem desenha precisa decidir o corte.** O cartao da vitrine do
            app mostra os 500 primeiros caracteres, no ultimo espaco antes do
            corte, com um botao para expandir no lugar; a quebra de linha e
            preservada nos dois estados. Nada aqui garante uma linha so, nem um
            tamanho que caiba num cartao.
        category: { $ref: '#/components/schemas/StoreCategory' }
        category_label:
          type: string
          description: |
            O rotulo da categoria, **ja resolvido pelo servidor**. Acompanha o
            codigo e nao o substitui: o codigo e o que o filtro manda de volta,
            o rotulo e o que a tela escreve.

            Vem na resposta em vez de a tela guardar o seu proprio mapa
            `codigo -> rotulo` porque o vocabulario agora e DADO: um mapa em
            codigo no aplicativo faria renomear "Alimentacao" para "Racoes"
            exigir um APK. Mesma forma de `breed_label` no pet.

            **Opcional ate a implementacao chegar a todos os clientes**: o APK
            publicado antes de 17/10 nao le este campo e mostra o rotulo que
            carrega em codigo.
        subcategory:
          oneOf:
            - $ref: '#/components/schemas/StoreSubcategory'
            - type: 'null'
          description: |
            O segundo nivel, **opcional**. Nulo e estado normal: produto sem
            subcategoria continua valido, e exigi-la invalidaria todo cadastro
            anterior. A tela nao preenche a linha quando falta.
        subcategory_label:
          type: string
          nullable: true
          description: O rotulo da subcategoria. Nulo junto com `subcategory`.
        image_url:
          type: string
          format: uri
          nullable: true
          description: |
            Sempre https. **A imagem principal** (a primeira de
            `StoreItemDetail.images`). Nulo e estado normal, e o cartao sabe se
            desenhar sem imagem.
        image_alt_text:
          type: string
          nullable: true
          description: |
            O texto alternativo da imagem principal, quando o painel o
            escreveu. **Nulo e estado normal**: o texto virou opcional na
            escrita em 17/10/2026, e quem desenha cai no `title` do item em vez
            de deixar a imagem sem nome acessivel.
        images:
          type: array
          maxItems: 8
          description: |
            Todas as imagens prontas do item, na ordem do painel; a primeira e
            a mesma de `image_url`. A vitrine desenha carrossel quando ha mais
            de uma.

            **ADITIVO, e `image_url` NAO foi tocado** (17/10/2026). O APK
            instalado le `image_url` e nada mais; renomear ou remover aquele
            campo quebraria o app que esta no bolso das pessoas, e isso ja
            aconteceu neste produto com a unidade de preco. A licao esta
            aplicada aqui: campo novo ao lado, o antigo intacto, e o cliente
            velho continua desenhando uma imagem sem saber que ha oito.

            **OPCIONAL de proposito.** Nao entra em `required`: resposta sem o
            campo continua valida, e e o que permite ao servidor passar a
            emiti-lo sem sincronizar a publicacao das quatro aplicacoes.

            **`maxItems: 8` e o MESMO teto de `StoreItemDetail.images`, e a
            igualdade e obrigatoria, nao estetica.** `StoreItemDetail` e
            `allOf: [StoreItemSummary, {required: [images]}]`, e `allOf` e
            intersecao: um teto menor aqui valeria TAMBEM para o detalhe e
            encolheria a galeria do produto de 8 para o numero escrito aqui,
            calado, sem ninguem ter pedido. Quem quiser limitar quantas imagens
            o RESUMO devolve limita no servidor, que e onde a decisao nao
            atravessa para a outra tela.

            **Peso: a vitrine carrega SOB DEMANDA.** A derivada de produto e
            uma so (`card`, 1024 px, teto de 500 KB), e nao ha miniatura de
            produto no contrato nem no pipeline. Uma pagina cheia (20 itens)
            que baixasse as 8 de cada cartao pediria ate 80 MB; o app desenha a
            primeira imagem de cada cartao e so busca as seguintes quando a
            pessoa arrasta, o que mantem a primeira pintura no peso de hoje.
            `thumb_url` em `StoreItemImage` foi considerado e recusado: o
            pipeline de produto nao emite `thumb`, e o campo sairia nulo em
            toda imagem -- o endereco de um objeto que ninguem gravou.
          items: { $ref: '#/components/schemas/StoreItemImage' }
        target_url:
          type: string
          format: uri
          description: |
            O destino no site do parceiro. **Nenhum identificador de pessoa
            entra aqui, em codificacao nenhuma** (consequencia 3 da
            BICHUS-185). A tela abre no navegador do sistema, nunca em webview
            embutida: webview com a nossa moldura em volta faz o Bichu parecer
            o vendedor.
        partner: { $ref: '#/components/schemas/StorePartnerRef' }
        species:
          type: array
          items: { $ref: '#/components/schemas/Species' }
          description: |
            A que especies o produto serve (ADR-0027 item 16). Declarado em
            23/09 antes do codigo: **opcional ate a implementacao**, e o app
            trata ausencia como "nao informado", nunca como "serve a todas".
        tags:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/StoreTagRef' }
          description: So tags ativas. Opcional ate a implementacao, como `species`.
        price_amount:
          type: integer
          nullable: true
          description: |
            **Centavos, inteiro.** Ponto flutuante para dinheiro erra na soma e
            o erro aparece meses depois. Nulo quando nao ha preco **e tambem
            quando o preco venceu** -- `price_status` distingue os dois.
        price_currency:
          type: string
          nullable: true
          enum: [BRL, null]
        price_checked_at:
          type: string
          format: date
          nullable: true
          description: |
            A data em que uma PESSOA leu aquele numero na pagina do parceiro.
            Nunca a data do commit, do deploy nem `now()`. **Sai junto com o
            valor quando o preco vence**: manter a data sem o valor entregaria
            ao aplicativo o que ele precisa para reconstruir o preco antigo.
        price_status: { $ref: '#/components/schemas/StorePriceStatus' }

    StoreItemPage:
      type: object
      required: [items, page, limit, total, effective_sort]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StoreItemSummary' }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        effective_sort:
          type: string
          enum: [curadoria, nome]
          description: |
            **A ordem em que a lista de fato saiu**, e nao a que foi pedida. A
            barra de listagem mostra a ordem REAL; uma tela que lesse a ordem do
            proprio estado local afirmaria a pedida sobre uma lista que o
            servidor pode ter ordenado de outro jeito.
        applied_filters:
          type: object
          description: |
            O recorte que de fato valeu. Traz `scope: all` quando nada foi
            recortado, porque "nada filtrado" e uma informacao e nao uma
            ausencia.
          additionalProperties: { type: string }

    NetworkEventWhen:
      type: string
      enum: [upcoming, past, all, today, weekend, next_30_days]
      default: upcoming
      description: |
        O recorte no tempo da agenda, calculado no servidor e no fuso de cada
        encontro. `all` existe e **nao e o default**. `today`, `weekend` e
        `next_30_days` sao os sub-menus da agenda (ADR-0027 12.14).

    NetworkEventSort:
      type: string
      enum: [proximos, recentes]
      description: |
        `proximos` e a data em ordem crescente; `recentes` e decrescente. **A
        leitura publica nao ordena por distancia**: essa ordem e
        `listNearbyNetworkEvents`, com conta.

    NetworkEventNearbySort:
      type: string
      enum: [distancia, proximos]
      default: distancia
      description: |
        `distancia` usa a regiao cadastrada de quem chama; sem regiao, a ordem
        efetiva e `proximos`, e `effective_sort` diz isso.

    NetworkEventStatus:
      type: string
      enum: [upcoming, happening, ended, cancelled]
      description: |
        **Calculado no servidor, sempre.** `cancelled` prevalece sobre o estado
        temporal ate o fim previsto, para as pessoas confirmarem o
        cancelamento: **com `ends_at`, ate o `ends_at`; sem `ends_at`, ate
        23:59:59 do dia do encontro no `time_zone` dele** (decisoes do cliente
        de 23/09 e 28/09/2026). Depois disso sai `ended`. No encontro
        publicado sem `ends_at` nada muda: ele e `upcoming` ate comecar e
        `ended` a partir dai (ADR-0025 item 6). O recorte `when=upcoming` segue a
        mesma regra. Cliente que nao conhece um valor precisa trata-lo sem
        quebrar.

    NetworkEventVisibility:
      type: string
      description: |
        `private`: para quem nao tem pedido aprovado, o app recebe so titulo e
        data; o resto sai em operacao separada, so para conta aprovada
        (ADR-0027 item 17 e 12.10 a 12.12).
      enum: [public, private]
      default: public

    NetworkEventPlace:
      type: object
      required: [place_name, neighborhood, city, state]
      description: |
        O lugar, em rotulo e **nunca em coordenada**. `place_name` e o nome do
        lugar publico como as pessoas o chamam, e nao logradouro, numero nem
        CEP -- os tres sao endereco, e o ADR-0010 item 2 os proibe aqui.

        **Nao ha campo de latitude, de longitude nem de distancia neste objeto,
        em nenhuma precisao.** Ele sai em operacoes alcancaveis sem conta, e o
        ponto do encontro so sai em `getNetworkEventLocation`, com conta
        (ADR-0027 12.5). Acrescentar `lat` aqui faz o portao de contrato
        publico reprovar, e a isca
        `infra/verificacao/iscas/deve-reprovar-ponto-do-encontro-no-detalhe-publico.yaml`
        existe para provar isso.
      properties:
        place_name: { type: string, example: 'Praça Benedito Calixto' }
        neighborhood: { type: string, example: 'Pinheiros' }
        city: { type: string, example: 'São Paulo' }
        state: { type: string, example: 'SP' }

    EventPriceUnit:
      type: string
      description: |
        A que o valor se refere (decisao do cliente de 01/10/2026). Lista
        fechada por `CHECK`; o rotulo e do cliente:

        - `per_pet`: por pet;
        - `per_person`: por humano;
        - `per_pair`: dupla, 1 humano + 1 pet;
        - `per_two_people`: dupla de humanos, 2 humanos;
        - `per_dog`: **legado**, ainda valido e devolvido nos encontros que o
          tem, exibido como "por pet". O painel nao o oferece mais, e a
          aposentadoria esta no ADR-0027 item 22. Mudanca aditiva: nenhuma
          linha foi renomeada.

        O app trata valor desconhecido mostrando so o numero, sem unidade
        (`UnidadeDoPreco.porCodigo` devolve nulo).
      enum: [per_dog, per_pet, per_person, per_pair, per_two_people]

    NetworkEventTicketUrl:
      type: string
      format: uri
      maxLength: 500
      pattern: '^https://'
      description: |
        O link de compra ou inscricao do encontro (ADR-0027 item 22). `https`
        obrigatorio, ate 500, sem usuario e senha, sem IP literal e sem host
        local (`localhost`, `.local`, nome sem ponto): recusados com `400`
        (`code: ticket_url_not_https`, `ticket_url_has_credentials`,
        `ticket_url_ip_literal`, `ticket_url_local_host`, `ticket_url_invalid`).
        **Excecao explicita ao D59, so neste campo e em `instagram_url`**:
        as observacoes continuam recusando link.

    NetworkEventInstagramUrlInput:
      type: string
      minLength: 1
      maxLength: 120
      pattern: '^https://(?:www\.|m\.)?instagram\.com/[A-Za-z0-9._]{1,30}/?$'
      description: |
        **A URL COMPLETA do perfil**, com `https://`. Substituiu
        `instagram_handle` em 17/10/2026, pelo padrao do cliente: "todo campo de
        site/url, o usuario deve preencher completo o endereco completo,
        inclusive com o https".

        `@usuario` e `usuario` **nao sao mais aceitos** (`400`,
        `code: instagram_url_invalid`), e nada e completado em silencio: o
        servidor nao acrescenta `a base do perfil do Instagram` ao que chegou.

        Aceita `instagram.com`, `www.instagram.com` e `m.instagram.com`, com ou
        sem barra final. Recusa, com `code` proprio para cada motivo:
        `instagram_url_not_https` (sem `https://`, ou com `http://`),
        `instagram_url_not_instagram` (outro dominio),
        `instagram_url_has_credentials`, `instagram_url_ip_literal`,
        `instagram_url_local_host`, `instagram_url_length`,
        `instagram_url_invalid`.

        **O ARMAZENAMENTO NAO MUDOU:** o servidor continua guardando o handle e
        continua devolvendo `instagram_handle` e `instagram_url` na leitura,
        esta ultima montada a partir de `INSTAGRAM_PROFILE_BASE_URL` -- a
        configuracao segue em uso. Guardar o handle mantem a forma canonica:
        `instagram.com/x`, `www.instagram.com/x` e `m.instagram.com/x/` sao o
        mesmo perfil.

    NetworkEventPrice:
      type: object
      description: |
        O valor que o organizador informa, **informativo**: o Bichu nao cobra e
        nao guarda forma de pagar (decisao do cliente de 23/09).
      required: [amount, currency, unit]
      additionalProperties: false
      properties:
        amount: { type: integer, minimum: 1, maximum: 100000000, description: Centavos. }
        currency: { type: string, enum: [BRL] }
        unit: { $ref: '#/components/schemas/EventPriceUnit' }

    NetworkEventAdmission:
      type: object
      required: [kind, price]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [free, paid]
          description: |
            **Valor novo aqui exige PRIMEIRO um APK tolerante.** O app publicado
            lanca `FormatException` para `kind` desconhecido
            (`EntradaDoEncontro.doJson`, `app/lib/api/modelos_rede.dart`), e o
            encontro inteiro deixa de abrir. Ao contrario de `unit`, que o app
            tolera, acrescentar um valor a esta lista quebra o app em uso
            (ADR-0027 item 22).
        price:
          oneOf:
            - $ref: '#/components/schemas/NetworkEventPrice'
            - type: 'null'

    NetworkEventAcceptedSizes:
      type: array
      minItems: 1
      maxItems: 4
      uniqueItems: true
      default: [P, M, G, GG]
      description: |
        Portes aceitos, um ou mais, com os valores de `PetSize` (`ref_sizes`),
        os do cadastro de pet. O padrao e todos; o app escreve "Todos os
        portes" quando os quatro estao marcados.
      items: { $ref: '#/components/schemas/PetSize' }

    NetworkEventDogAge:
      type: string
      description: Idade dos caes, uma escolha. Lista fechada por `CHECK`.
      enum: [any, from_4_months, from_1_year, up_to_1_year]
      default: any

    NetworkEventAmenity:
      type: string
      description: |
        Acessibilidade e estrutura do local. Lista fechada por `CHECK` em
        `network_event_amenities`; acrescentar valor e tres arquivos no mesmo
        commit (ADR-0023 secao 3).
      enum: [level_ground_or_ramp, accessible_restroom, public_restroom_nearby, shade, benches, dog_water_fountain, parking_nearby]

    NetworkEventAmenities:
      type: array
      maxItems: 7
      uniqueItems: true
      items: { $ref: '#/components/schemas/NetworkEventAmenity' }

    NetworkEventBringItem:
      type: string
      description: |
        O que levar, na parte fechada: o que se repete em todo encontro, com
        icone e texto do app. Lista fechada por `CHECK` em
        `network_event_bring_items`; acrescentar valor e tres arquivos no mesmo
        commit (ADR-0023 secao 3).
      enum: [water, water_bowl, leash, poop_bags, treats, towel, vaccination_card, toy]

    NetworkEventBringItems:
      type: array
      maxItems: 8
      uniqueItems: true
      items: { $ref: '#/components/schemas/NetworkEventBringItem' }

    NetworkEventNotes:
      type: string
      minLength: 2
      maxLength: 500
      description: |
        Observacoes, so como complemento, ate 500 caracteres (o numero da
        designer, e o mesmo em que o detector e medido). **Texto puro, sem
        canal de contato nem de pagamento** (D59): telefone, e-mail, URL,
        endereco, CEP e chave PIX sao **recusados** com `400` (`code:
        contact_or_payment_detected`), pelo detector do canal mediado, com
        normalizacao NFKC e remocao de largura zero. Caractere de controle
        bidirecional (U+202A a U+202E, U+2066 a U+2069) e recusado em todo
        texto administrativo (`code: bidi_control`). O app nao transforma nada
        em link. Mudar as observacoes avisa todos os administradores (D60).

    NetworkEventImage:
      type: object
      required: [url, alt_text]
      additionalProperties: false
      description: |
        Uma imagem da galeria do encontro. A primeira da lista e a capa.
        `url` e `thumb_url` sao compostas na leitura a partir das chaves da
        imagem: o banco nao guarda URL (`docs/07-devops.md` 3.6).
      properties:
        url:
          type: string
          format: uri
          description: |
            A derivada de 1024 x 576 px (16:9), para o cartao da agenda, que
            desenha ~328 dp de largura.
        thumb_url:
          type: string
          format: uri
          nullable: true
          description: |
            A derivada de 480 x 360 px (4:3), para a GALERIA do detalhe, que
            desenha 144 dp. **E ela que a galeria deve pedir**: com `url` a
            galeria baixava 1024 px para pintar 432 px, cinco vezes o dado que
            ela usa, e uma galeria de oito imagens pesava mais que o resto da
            tela somado.

            Nula na imagem gravada antes desta derivada existir, e na imagem de
            produto da Loja (que tem uma derivada so). Quem recebe nulo cai em
            `url`, que e o comportamento de antes.
        alt_text: { type: string, minLength: 2, maxLength: 150 }

    NetworkEventImages:
      type: array
      maxItems: 8
      description: Ate 8, na ordem do painel; a primeira e a capa. Vazia e estado normal.
      items: { $ref: '#/components/schemas/NetworkEventImage' }

    NetworkEventPublic:
      type: object
      required: [slug, title, summary, place, starts_at, time_zone, status, visibility, admission, accepted_sizes, dog_age, vaccination_required, fenced_off_leash_area, amenities, bring_items, images, ticket_url, instagram_handle, instagram_url]
      description: |
        O encontro **publico**: o cartao da agenda e o detalhe. **Nao ha
        nenhum campo com pessoas**, nao ha coordenada e nao ha UUID.
      properties:
        slug: { type: string }
        title: { type: string, maxLength: 120 }
        summary:
          type: string
          maxLength: 200
          description: A descricao do encontro, ate 200 caracteres (pedido do cliente de 01/10; antes, 180).
        place: { $ref: '#/components/schemas/NetworkEventPlace' }
        starts_at:
          type: string
          format: date-time
          description: O instante absoluto. A hora de PAREDE sai de `time_zone`.
        ends_at: { type: string, format: date-time, nullable: true }
        time_zone:
          type: string
          example: 'America/Sao_Paulo'
          description: O nome IANA da zona do evento. Sem ele a hora de parede sai errada.
        status: { $ref: '#/components/schemas/NetworkEventStatus' }
        visibility: { type: string, enum: [public] }
        cover_image_url:
          type: string
          format: uri
          nullable: true
          description: |
            A `url` da imagem de posicao 0 (derivada de 1024 x 576), derivada na
            leitura e nunca gravada no banco. **E a do CARTAO da agenda**, que
            desenha ~328 dp. Nula sem imagem; o cartao sabe se desenhar sem ela.
        cover_banner_url:
          type: string
          format: uri
          nullable: true
          description: |
            A derivada de 1280 x 720 da imagem de posicao 0, para a capa de
            borda a borda do DETALHE, que desenha 360 a 430 dp (1080 a 1290 px
            a 3x) e borrava de leve com 1024.

            Uma derivada separada e nao um `cover_image_url` maior: o cartao da
            agenda usa a mesma imagem, e subir aquela derivada para 1280
            engordaria **cada** cartao da listagem em metade do peso para ganhar
            nitidez numa tela que desenha uma so.

            Nula sem imagem e nula na imagem gravada antes desta derivada
            existir; quem recebe nulo cai em `cover_image_url`.
        images: { $ref: '#/components/schemas/NetworkEventImages' }
        admission: { $ref: '#/components/schemas/NetworkEventAdmission' }
        accepted_sizes: { $ref: '#/components/schemas/NetworkEventAcceptedSizes' }
        dog_age: { $ref: '#/components/schemas/NetworkEventDogAge' }
        vaccination_required: { type: boolean }
        fenced_off_leash_area:
          type: boolean
          description: O local tem area cercada para caes soltos. Atributo do lugar, nao permissao.
        amenities: { $ref: '#/components/schemas/NetworkEventAmenities' }
        bring_items: { $ref: '#/components/schemas/NetworkEventBringItems' }
        notes:
          oneOf:
            - $ref: '#/components/schemas/NetworkEventNotes'
            - type: 'null'
        ticket_url:
          oneOf:
            - $ref: '#/components/schemas/NetworkEventTicketUrl'
            - type: 'null'
          description: Publico (ADR-0027 item 22). Nulo quando nao ha.
        instagram_handle:
          type: [string, 'null']
          pattern: '^[a-z0-9._]{1,30}$'
          description: O handle, sem `@`. Publico. Nulo quando nao ha.
        instagram_url:
          type: [string, 'null']
          format: uri
          description: 'A URL do perfil, montada na saida com a base da configuracao (`INSTAGRAM_PROFILE_BASE_URL`) e o handle. Nula sem handle ou sem base configurada.'

    NetworkEventPrivateTeaser:
      type: object
      required: [slug, title, local_date, visibility, status]
      additionalProperties: false
      description: |
        O encontro **privado**, para quem nao tem pedido aprovado: **so titulo e
        data** (decisao do cliente, ADR-0027 12.10). **Lista permitida**: estas
        cinco propriedades e nenhuma outra, e o portao P19
        (`src/tools/portao-teaser-do-privado.ts`) reprova propriedade nova.

        `local_date` e a data local no fuso do encontro, no lugar de
        `starts_at`, `ends_at` e `time_zone`: o nome do fuso entregaria o
        estado. Sem capa: a foto de um encontro costuma ser a foto do lugar. O
        `slug` do privado e gerado pelo servidor, aleatorio, e nao diz o lugar.
      properties:
        slug: { type: string }
        title: { type: string, maxLength: 120 }
        local_date: { type: string, format: date }
        visibility: { type: string, enum: [private] }
        status: { $ref: '#/components/schemas/NetworkEventStatus' }

    NetworkEventSummary:
      description: |
        O cartao da agenda: o encontro publico inteiro, ou o teaser do privado.
        A forma vem da propriedade do **evento** (`visibility`), igual para
        qualquer chamador, e nao de quem pergunta (ADR-0021).
      oneOf:
        - $ref: '#/components/schemas/NetworkEventPublic'
        - $ref: '#/components/schemas/NetworkEventPrivateTeaser'
      discriminator:
        propertyName: visibility
        mapping:
          public: '#/components/schemas/NetworkEventPublic'
          private: '#/components/schemas/NetworkEventPrivateTeaser'

    NetworkEvent:
      description: |
        O encontro, na leitura do detalhe. Mesma regra do cartao: publico
        inteiro, ou teaser do privado para todo mundo, inclusive o aprovado. O
        conteudo do privado sai em `getNetworkEventPrivateDetails`.
      oneOf:
        - $ref: '#/components/schemas/NetworkEventPublic'
        - $ref: '#/components/schemas/NetworkEventPrivateTeaser'
      discriminator:
        propertyName: visibility
        mapping:
          public: '#/components/schemas/NetworkEventPublic'
          private: '#/components/schemas/NetworkEventPrivateTeaser'

    NetworkEventPage:
      type: object
      required: [items, page, limit, total, effective_sort, effective_when, applied_filters]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/NetworkEventSummary' }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        effective_sort:
          allOf:
            - $ref: '#/components/schemas/NetworkEventSort'
          description: A ordem em que a lista de fato saiu.
        effective_when:
          allOf:
            - $ref: '#/components/schemas/NetworkEventWhen'
          description: O recorte de tempo que valeu.
        applied_filters:
          type: object
          description: |
            O recorte que de fato valeu. Traz `scope: all` quando nada foi
            recortado.
          additionalProperties: { type: string }

    NetworkEventNearby:
      description: O encontro publico com a distancia de quem chama. Privado nao entra nesta lista.
      allOf:
        - $ref: '#/components/schemas/NetworkEventPublic'
        - type: object
          required: [distance_m]
          properties:
            distance_m:
              type: integer
              nullable: true
              description: Metros, arredondados a 100. Nula sem ponto ou sem regiao cadastrada.

    NetworkEventNearbyPage:
      type: object
      required: [items, page, limit, total, effective_sort, effective_when, applied_filters]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/NetworkEventNearby' }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        effective_sort: { $ref: '#/components/schemas/NetworkEventNearbySort' }
        effective_when: { $ref: '#/components/schemas/NetworkEventWhen' }
        applied_filters:
          type: object
          additionalProperties: { type: string }

    NetworkEventPrivateDetails:
      type: object
      required: [slug, title, summary, place, starts_at, time_zone, status, images, admission, accepted_sizes, dog_age, vaccination_required, fenced_off_leash_area, amenities, bring_items, ticket_url, instagram_handle, instagram_url]
      description: |
        O conteudo oculto do encontro privado, so para conta aprovada. A mesma
        forma dos campos do encontro publico, sem `visibility`.
      properties:
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        place: { $ref: '#/components/schemas/NetworkEventPlace' }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time, nullable: true }
        time_zone: { type: string }
        status: { $ref: '#/components/schemas/NetworkEventStatus' }
        cover_image_url: { type: string, format: uri, nullable: true }
        # A derivada de 1280 px da capa, para o detalhe de borda a borda. Ver
        # `NetworkEventPublic.cover_banner_url`.
        cover_banner_url: { type: string, format: uri, nullable: true }
        images: { $ref: '#/components/schemas/NetworkEventImages' }
        admission: { $ref: '#/components/schemas/NetworkEventAdmission' }
        accepted_sizes: { $ref: '#/components/schemas/NetworkEventAcceptedSizes' }
        dog_age: { $ref: '#/components/schemas/NetworkEventDogAge' }
        vaccination_required: { type: boolean }
        fenced_off_leash_area: { type: boolean }
        amenities: { $ref: '#/components/schemas/NetworkEventAmenities' }
        bring_items: { $ref: '#/components/schemas/NetworkEventBringItems' }
        notes:
          oneOf:
            - $ref: '#/components/schemas/NetworkEventNotes'
            - type: 'null'
        ticket_url:
          oneOf:
            - $ref: '#/components/schemas/NetworkEventTicketUrl'
            - type: 'null'
          description: Publico (ADR-0027 item 22). Nulo quando nao ha.
        instagram_handle:
          type: [string, 'null']
          pattern: '^[a-z0-9._]{1,30}$'
          description: O handle, sem `@`. Publico. Nulo quando nao ha.
        instagram_url:
          type: [string, 'null']
          format: uri
          description: 'A URL do perfil, montada na saida com a base da configuracao (`INSTAGRAM_PROFILE_BASE_URL`) e o handle. Nula sem handle ou sem base configurada.'

    JoinRequestAppState:
      type: string
      description: |
        O estado do pedido **que o tutor ve**. **Nao ha `declined`** (decisao do
        cliente, ADR-0027 12.11): o recusado aparece como `requested` ate o
        encontro passar e como `expired` depois, igual a um pendente que ninguem
        decidiu. `requested` e nao `pending`, de proposito: `pending` e a decisao
        guardada, e `requested` e o que o tutor sabe.
      enum: [requested, approved, withdrawn, expired]

    NetworkEventJoinRequest:
      type: object
      required: [state, requested_at]
      additionalProperties: false
      properties:
        state: { $ref: '#/components/schemas/JoinRequestAppState' }
        requested_at: { type: string, format: date-time }

    MyNetworkEventJoinRequest:
      type: object
      required: [event, state, requested_at]
      additionalProperties: false
      properties:
        event: { $ref: '#/components/schemas/NetworkEventPrivateTeaser' }
        state: { $ref: '#/components/schemas/JoinRequestAppState' }
        requested_at: { type: string, format: date-time }

    CommunityNetworkEventPlaceInput:
      type: object
      description: |
        O lugar como a comunidade o descreve: **tres rotulos, e nada mais**.

        **Sem `point` e sem `street_address`**, e nenhum dos dois e
        esquecimento: o ADR-0006 nao tem mapa nem busca de endereco nesta
        superficie, e nao ha geocodificacao em nenhum ponto deste caminho; o
        endereco por extenso e campo do painel e sai so em
        `getNetworkEventLocation`. **Logradouro publico, nunca residencia**
        (ADR-0027 item 13).
      required: [place_name, neighborhood, city, state]
      additionalProperties: false
      properties:
        place_name:
          type: string
          minLength: 2
          maxLength: 80
          description: |
            O NOME do lugar, como as pessoas o chamam. O servidor recusa
            endereco embutido com `code: address_in_place_name` -- ver a
            descricao de `createNetworkEvent`.
        neighborhood: { type: string, minLength: 2, maxLength: 60 }
        city: { type: string, minLength: 2, maxLength: 60 }
        state: { type: string, pattern: '^[A-Z]{2}$' }

    CommunityNetworkEventInput:
      type: object
      description: |
        O encontro proposto pela comunidade. **E um subconjunto deliberado de
        `AdminNetworkEventInput`**, e o que falta esta explicado na descricao de
        `createNetworkEvent`: visibilidade, condicao de acesso, `slug`, ponto,
        endereco, links e imagens nao entram.
      required: [title, summary, place, starts_at]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 2, maxLength: 120 }
        summary: { type: string, minLength: 2, maxLength: 200 }
        place: { $ref: '#/components/schemas/CommunityNetworkEventPlaceInput' }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        time_zone:
          allOf:
            - $ref: '#/components/schemas/TimeZoneName'
          default: America/Sao_Paulo
        accepted_sizes: { $ref: '#/components/schemas/NetworkEventAcceptedSizes' }
        dog_age: { $ref: '#/components/schemas/NetworkEventDogAge' }
        vaccination_required: { type: boolean, default: true }
        fenced_off_leash_area: { type: boolean, default: false }
        amenities: { $ref: '#/components/schemas/NetworkEventAmenities' }
        bring_items: { $ref: '#/components/schemas/NetworkEventBringItems' }
        notes: { $ref: '#/components/schemas/NetworkEventNotes' }
        cover_image: { $ref: '#/components/schemas/CommunityNetworkEventCoverInput' }

    MyPhoto:
      type: object
      description: |
        A foto do proprio usuario, como o DONO a ve (cliente, 18/10/2026).

        **Nao tem `id` nem `upload_id`** (ADR-0010 item 6): o app grava por
        `MeUpdate.photo_upload_id` e le a URL da derivada. Nao tem `original_url`
        tambem: o original fica no armazenamento privado e nunca e servido ao
        cliente, aqui como na foto de pet.

        **O SELO DE VALIDADO NAO ESTA AQUI.** Ele e `Me.email_verified`, que ja
        existia e e o MESMO conceito que o resto do produto usa. A moldura do app
        desenha o selo em cima da foto quando `email_verified` e verdadeiro, e
        nao desenha quando e falso. Gravar o selo dentro do JPEG faria a imagem
        mentir no dia em que a pessoa trocasse de e-mail.
      required: [status]
      properties:
        status:
          type: string
          enum: [processing, ready, rejected]
          description: |
            `processing` enquanto o worker nao terminou -- `url` e nula nesse
            intervalo, e a tela mostra o lugar da foto em vez de um erro.
        url:
          type: string
          format: uri
          nullable: true
          description: |
            A derivada `card` (512 x 512, JPEG), no armazenamento publico com 128
            bits aleatorios no nome. Nula enquanto processa e quando recusada.
        rejection_reason:
          type: string
          nullable: true
          description: O motivo medido nos bytes reais, quando `status` e `rejected`.

    MyPhotoIntentInput:
      type: object
      required: [content_type, byte_size]
      additionalProperties: false
      description: |
        O pedido de autorizacao de envio da foto do proprio usuario. **Sem
        `purpose`**, pelo mesmo motivo de `NetworkEventCoverIntentInput`: esta
        operacao existe para um proposito so (`user_photo`), e deixar o cliente
        escolhe-lo seria deixa-lo pedir uma autorizacao de imagem de produto por
        uma rota do app.
      properties:
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/heic, image/webp]
          description: |
            **HEIC entra aqui**, e nao entra em `AdminCatalogImageIntentInput`:
            esta foto sai de um celular, metade dos celulares e iPhone, e o
            cliente autorizou HEIC na entrada por causa disso (18/10/2026). A
            conversao para JPEG e nossa, no servidor. SVG nunca, e por
            IGUALDADE, nunca por prefixo `image/`.
        # 5 MiB: o teto unico de toda a aplicacao (cliente, 17/10/2026). Ele vale
        # AQUI, no servidor, e dentro da politica assinada -- nao so na tela.
        byte_size: { type: integer, minimum: 1, maximum: 5242880 }
        width:
          type: integer
          minimum: 1
          maximum: 20000
          description: Opcional, como o cliente a le. Abaixo de 300 responde 422 antes de assinar.
        height: { type: integer, minimum: 1, maximum: 20000 }

    NetworkEventCoverIntentInput:
      type: object
      required: [content_type, byte_size]
      additionalProperties: false
      description: |
        O pedido de autorizacao de envio da capa. **Sem `purpose`**, ao
        contrario de `AdminCatalogImageIntentInput`: esta operacao existe para
        um proposito so (`network_event`), e deixar o cliente escolhe-lo seria
        deixa-lo pedir uma autorizacao de imagem de produto por uma rota do app.
      properties:
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
          description: |
            SVG nunca (D50), e por IGUALDADE, nunca por prefixo. HEIC fica de
            fora porque a derivada de catalogo e processada pelo mesmo caminho
            do painel, que nao o aceita -- e por isso este enum NAO e o de
            `UploadIntentInput`, que e da foto de pet.
        # 5 MiB: o teto unico de toda a aplicacao (cliente, 17/10/2026).
        byte_size: { type: integer, minimum: 1, maximum: 5242880 }
        width:
          type: integer
          minimum: 1
          maximum: 20000
          description: Opcional, como o navegador a le. Abaixo de 600 responde 422 antes de assinar.
        height: { type: integer, minimum: 1, maximum: 20000 }

    CommunityNetworkEventCoverInput:
      type: object
      required: [upload_id, alt_text]
      additionalProperties: false
      description: |
        A capa, pelo `upload_id` de `createNetworkEventCoverUploadIntent`. O
        `alt_text` e **obrigatorio** em toda posicao, igual a galeria do painel:
        a imagem sem texto alternativo e a imagem que nao existe para quem usa
        leitor de tela.
      properties:
        upload_id: { type: string, format: uuid }
        alt_text: { type: string, minLength: 2, maxLength: 150 }

    CommunityNetworkEventPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        O que o AUTOR muda no proprio encontro. Campo ausente nao muda; as
        listas substituem o conjunto; `notes: null` tira as observacoes e
        `cover_image: null` tira a capa.

        **Nao tem** `visibility`, `admission`, `slug`, `street_address`,
        `point`, `ticket_url`, `instagram_url`, `publication_status` nem
        `origin` -- ver a descricao de `updateNetworkEvent`.
      properties:
        title: { type: string, minLength: 2, maxLength: 120 }
        summary: { type: string, minLength: 2, maxLength: 200 }
        place: { $ref: '#/components/schemas/CommunityNetworkEventPlaceInput' }
        starts_at: { type: string, format: date-time }
        ends_at:
          description: '`null` tira o fim previsto.'
          oneOf:
            - { type: string, format: date-time }
            - type: 'null'
        time_zone: { $ref: '#/components/schemas/TimeZoneName' }
        cover_image:
          description: '`null` tira a capa.'
          oneOf:
            - $ref: '#/components/schemas/CommunityNetworkEventCoverInput'
            - type: 'null'
        accepted_sizes: { $ref: '#/components/schemas/NetworkEventAcceptedSizes' }
        dog_age: { $ref: '#/components/schemas/NetworkEventDogAge' }
        vaccination_required: { type: boolean }
        fenced_off_leash_area: { type: boolean }
        amenities: { $ref: '#/components/schemas/NetworkEventAmenities' }
        bring_items: { $ref: '#/components/schemas/NetworkEventBringItems' }
        notes:
          oneOf:
            - $ref: '#/components/schemas/NetworkEventNotes'
            - type: 'null'

    CommunityNetworkEventCancellation:
      type: object
      required: [note]
      additionalProperties: false
      properties:
        note:
          type: string
          minLength: 2
          maxLength: 280
          description: |
            O motivo, **so para a trilha**. Nao sai no app, pela mesma regra do
            cancelamento do painel: e texto livre, e o cliente nao decidiu
            mostrar motivo de cancelamento.

    MyNetworkEventJoinRequestPage:
      type: object
      required: [items, page, limit, total, effective_sort, applied_filters]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MyNetworkEventJoinRequest' }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        effective_sort: { type: string, enum: [proximos] }
        applied_filters:
          type: object
          additionalProperties: { type: string }

    NetworkEventPoint:
      type: object
      required: [lat, lon]
      additionalProperties: false
      description: |
        O ponto do encontro, marcado no mapa (`map_pin`, ADR-0006). Sem campo de
        origem nem de precisao: a origem e sempre `map_pin`. Os limites sao os
        de `GeoPoint` e os de `AdminMapPin`.
      properties:
        lat: { type: number, format: double, minimum: -34, maximum: 6 }
        lon: { type: number, format: double, minimum: -74, maximum: -32 }

    NetworkEventLocation:
      type: object
      required: [point, street_address]
      additionalProperties: false
      description: |
        A resposta de `getNetworkEventLocation`. **So sai com conta** (emenda 1
        do ADR-0010). `point` nulo e o encontro sem ponto marcado: a tela mostra
        os rotulos e nao mostra mapa. Desde 01/10/2026 o painel nao marca mais
        ponto (o `point` fica so por compatibilidade) e escreve o endereco.
      properties:
        point:
          oneOf:
            - $ref: '#/components/schemas/NetworkEventPoint'
            - type: 'null'
        street_address:
          type: [string, 'null']
          maxLength: 200
          description: |
            O endereco por extenso, como o painel o escreveu. Nulo quando nao
            ha. O app o abre no aplicativo de mapas do aparelho, por intent com
            o TEXTO; o Bichu nao geocodifica (ADR-0006). **Nunca** sai na
            agenda nem no detalhe publico (emenda de 01/10 do ADR-0027).

    PublicLostPetPage:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PublicLostPet' }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        applied_filters:
          type: object
          description: Devolvido para a tela poder dizer o que esta filtrado.
          additionalProperties: { type: string }

    PublicPetProfile:
      type: object
      required: [slug, display_name, species]
      properties:
        slug: { type: string }
        display_name: { type: string }
        species: { $ref: '#/components/schemas/Species' }
        breed_label: { type: string, nullable: true }
        size: { $ref: '#/components/schemas/PetSize' }
        primary_color: { type: string, nullable: true }
        distinctive_marks: { type: string, nullable: true }
        photo_url: { type: string, format: uri, nullable: true }
        is_lost: { type: boolean }

    ReferenceData:
      type: object
      required: [version, species, breeds, colors, sizes]
      properties:
        version: { type: string }
        species:
          type: array
          items:
            type: object
            properties:
              code: { $ref: '#/components/schemas/Species' }
              label: { type: string }
        breeds:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              label: { type: string }
              species: { $ref: '#/components/schemas/Species' }
        colors:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              label: { type: string }
        sizes:
          type: array
          items:
            type: object
            properties:
              code: { $ref: '#/components/schemas/PetSize' }
              label: { type: string }
              weight_hint: { type: string }

    PetTransfer:
      type: object
      required: [id, status, expires_at]
      description: |
        **Nao contem o token em nenhuma hipotese.** Ele existe apenas na caixa de
        entrada do destinatario, e e isso que separa "o tutor quer transferir" de
        "quem pegou o celular do tutor transferiu".
      properties:
        id: { type: string, format: uuid }
        pet_id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending_acceptance, accepted, effective, cancelled, expired]
        recipient_email_masked: { type: string, example: 'ma****@exemplo.com.br' }
        expires_at:
          type: string
          format: date-time
          description: Fim do prazo para aceitar (72 h).
        accepted_at: { type: string, format: date-time, nullable: true }
        effective_at:
          type: string
          format: date-time
          nullable: true
          description: |
            24 h apos o aceite. **Ate este instante nada foi revogado.**
        cancelled_at: { type: string, format: date-time, nullable: true }

    # ------------------------------------------------------------------
    # Backoffice (ADR-0027)
    # ------------------------------------------------------------------

    AdminRole:
      type: string
      description: |
        Papel que abre sessao administrativa. Na v1 so `admin` (decisao do
        cliente de 23/09). `moderator` existe em `user_roles` e entra aqui
        quando a moderacao entrar, como valor novo, pelo caminho de lista
        fechada do ADR-0023 secao 3.
      enum: [admin]

    AdminLoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          maxLength: 256
          description: |
            Sem `minLength` de proposito: o login nao ensina a politica a quem
            testa senha. O minimo de 15 da conta administrativa (D43) e cobrado
            na definicao, pelo comando `conta-admin` no servidor (D61).

    AdminDisavowRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: O valor do fragmento `#t=` do link, 256 bits em base64url sem preenchimento.

    AdminSession:
      type: object
      description: |
        O que o painel guarda em memoria. **Sem e-mail, sem UUID, sem
        telefone** (D51). `csrf_token` vai em `X-CSRF-Token` em todo metodo
        nao seguro.
      required: [display_name, roles, csrf_token, idle_expires_at, absolute_expires_at]
      properties:
        display_name: { type: string }
        roles:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/AdminRole' }
        csrf_token: { type: string, minLength: 32 }
        idle_expires_at:
          type: string
          format: date-time
          description: Quando a sessao vence se nada acontecer. Renova com o uso, ate o teto.
        absolute_expires_at:
          type: string
          format: date-time
          description: O teto de 12 horas desde a senha. O uso nao o empurra.

    AdminReauthScope:
      type: string
      description: |
        As operacoes sensiveis do backoffice (D40). Um token de um escopo nao
        abre operacao de outro. `network_event_access_change` e a troca de
        visibilidade (publico/privado) de encontro publicado (ADR-0027 item 5).
      enum: [store_item_retirement, network_event_relocation, network_event_cancellation, network_event_removal, network_event_access_change]

    AdminReauthRequest:
      type: object
      description: |
        Um escopo (`scope`) ou uma lista de um ou dois escopos distintos
        (`scopes`), nunca os dois. A lista existe para a tela que grava duas
        operacoes sensiveis juntas (lugar e acesso do encontro): cada
        reautenticacao rotaciona a sessao, e duas seguidas deixavam o token da
        primeira preso a uma sessao ja revogada.
      required: [password]
      additionalProperties: false
      oneOf:
        - required: [scope]
        - required: [scopes]
      properties:
        password: { type: string, maxLength: 256 }
        scope: { $ref: '#/components/schemas/AdminReauthScope' }
        scopes:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { $ref: '#/components/schemas/AdminReauthScope' }

    AdminReauthGrant:
      type: object
      required: [reauth_token, expires_in, scope, csrf_token, tokens]
      properties:
        reauth_token:
          type: string
          description: O token do primeiro escopo pedido. Igual a `tokens[0].reauth_token`.
        expires_in: { type: integer, example: 300 }
        scope:
          $ref: '#/components/schemas/AdminReauthScope'
        tokens:
          type: array
          minItems: 1
          maxItems: 2
          description: |
            Um token por escopo pedido, na ordem do pedido. Cada um e de uso
            unico, vale so para o seu escopo e esta preso a sessao nova; todos
            vencem juntos em `expires_in`.
          items:
            type: object
            required: [scope, reauth_token]
            additionalProperties: false
            properties:
              scope: { $ref: '#/components/schemas/AdminReauthScope' }
              reauth_token: { type: string }
        csrf_token:
          type: string
          description: O token anti-CSRF novo. A sessao foi rotacionada, e o anterior deixou de valer.

    HttpsUrl:
      type: string
      format: uri
      maxLength: 2048
      pattern: '^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[^\s]*)?$'
      description: |
        So `https:`, sem `userinfo`, ate 2048 caracteres (D47). Query e
        fragmento SAO aceitos: loja de verdade identifica SKU e variacao por
        parametro (`/p?idsku=1197673`), e a expressao os admite em `[^\s]*`.
        Host que seja IP literal e recusado pelo servidor com `400`, porque a
        expressao nao tem como separar `10.0.0.1` de um nome.

    AdminCatalogImage:
      type: object
      description: |
        A imagem de um item ou de um encontro, como o painel a ve. `external`
        so aparece em dado da massa (URL do parceiro); o painel nao escreve
        URL externa.
      required: [source, status]
      properties:
        source: { type: string, enum: [uploaded, external] }
        status:
          type: string
          enum: [processing, ready, rejected]
          description: So `ready` e servido pelo app. `external` e sempre `ready`.
        url:
          type: string
          format: uri
          nullable: true
          description: A derivada publica, quando pronta.
        rejection_reason:
          type: string
          nullable: true

    AdminCatalogImageIntentInput:
      type: object
      required: [purpose, content_type, byte_size]
      additionalProperties: false
      properties:
        purpose:
          type: string
          enum: [store_item, network_event, directory_logo, directory_photo]
          description: |
            Fica gravado no envio. A escrita que confirma o envio exige o mesmo
            proposito, e recusa foto de pet, de achador ou de outro proposito
            (T9).

            `directory_logo` e `directory_photo` entraram em 18/10/2026, com a
            logo e a foto do profissional recomendado. Sao DOIS propositos e nao
            um: a logo e quadrada e pequena (minima 256 x 256, derivadas 512 x
            512 e 176 x 176), e a foto e da fachada ou do ambiente (minima 600 x
            600, derivadas 1280 x 720 e 1024 x 576). Confirmar um no campo do
            outro e `400 upload_not_usable`.

            **`user_photo` nao esta aqui, de proposito**: a foto da propria
            pessoa e autorizada por `createMyPhotoUploadIntent`, com conta do
            app, e nao pelo painel.
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
          description: SVG nunca. HEIC nao, porque a origem e um computador de mesa.
        byte_size:
          type: integer
          minimum: 1
          maximum: 5242880
          description: |
            Ate 5 MiB, o **teto unico de toda a aplicacao** (cliente,
            17/10/2026), e o numero que o painel mostra em tela. Dimensao minima: 800 x 800
            pixels para `store_item`, 600 x 600 para `network_event` (pedido do
            cliente de 01/10; antes, 1600 x 900). Duas conferencias: a
            DECLARADA, em `width`/`height` deste pedido, recusada aqui com
            `422` (`image-too-small`) antes de assinar; e a REAL, que o worker
            faz nos bytes e que marca a imagem `rejected` com o motivo, porque
            a declarada e do navegador e pode mentir.
        width:
          type: integer
          minimum: 1
          maximum: 20000
          description: |
            Largura em pixels, como o navegador a le do arquivo antes de
            enviar. Opcional (o painel atual nao a manda); quando vem, abaixo
            da minima do `purpose` recusa com `422` (`image-too-small`).
        height:
          type: integer
          minimum: 1
          maximum: 20000
          description: Altura em pixels. Mesma regra de `width`.

    AdminStorePartnerInput:
      type: object
      required: [slug, name, site_url]
      additionalProperties: false
      properties:
        slug: { $ref: '#/components/schemas/Slug' }
        name: { type: string, minLength: 2, maxLength: 80 }
        site_url:
          allOf:
            - $ref: '#/components/schemas/HttpsUrl'
          maxLength: 261
          description: |
            **O endereco COMPLETO do site do parceiro**, com `https://`
            (`https://parceiro.exemplo.test`). Substituiu `host` em 17/10/2026, pelo
            padrao do cliente: todo campo de site recebe o endereco completo. O
            nome pelado (`cobasi.com.br`) e recusado com `400`,
            `code: site_url_not_https`, e nada e completado em silencio.

            **A COLUNA CONTINUA GUARDANDO O HOST**, e o servidor o extrai
            deste campo: a leitura compoe `https://<host><caminho>` e
            `target_url` do item e conferido contra ele. Caminho no fim e
            aceito e descartado (`https://parceiro.exemplo.test/` e
            `https://parceiro.exemplo.test` dao o mesmo host).

            **Escolher `https://www.parceiro.exemplo.test` em vez de
            `https://parceiro.exemplo.test` muda o que os produtos aceitam**: os links
            passam a ter de estar em `www.cobasi.com.br` ou abaixo dele.
            Recusas com `code` proprio: `site_url_not_https`,
            `site_url_has_credentials`, `site_url_ip_literal`,
            `site_url_local_host`, `site_url_length`, `site_url_invalid`.
        sort_order: { type: integer, minimum: -32768, maximum: 32767, default: 0 }

    AdminStorePartnerPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        slug: { $ref: '#/components/schemas/Slug' }
        name: { type: string, minLength: 2, maxLength: 80 }
        site_url:
          allOf:
            - $ref: '#/components/schemas/HttpsUrl'
          maxLength: 261
          description: O endereco completo, com `https://`. Ver `AdminStorePartnerInput.site_url`.
        sort_order: { type: integer, minimum: -32768, maximum: 32767 }
        active:
          type: boolean
          description: Parceiro inativo tira todos os itens dele da vitrine publica, sem mudar o estado de cada item.

    AdminStorePartner:
      type: object
      required: [slug, name, host, active, sort_order, item_count, created_at, updated_at, version]
      properties:
        slug: { type: string }
        name: { type: string }
        host: { type: string }
        active: { type: boolean }
        sort_order: { type: integer }
        item_count:
          type: integer
          description: Itens do parceiro em qualquer estado.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }

    AdminStorePartnerPage:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminStorePartner' }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }

    AdminPriceInput:
      type: object
      description: |
        O preco de referencia, **inteiro ou ausente**: os tres campos andam
        juntos, e "preco sem data" nao cabe neste corpo (o `CHECK`
        `store_items_preco_anda_completo` diz o mesmo no banco).
      required: [amount, currency, checked_at]
      additionalProperties: false
      properties:
        amount:
          type: integer
          minimum: 1
          maximum: 100000000
          description: Centavos, inteiro. Nunca ponto flutuante.
        currency: { type: string, enum: [BRL] }
        checked_at:
          type: string
          format: date
          description: |
            A data em que uma PESSOA leu o numero na pagina do parceiro. Data
            futura e recusada com `400`.

    AdminPrice:
      type: object
      description: |
        O preco como o painel o ve: **com o valor mesmo vencido**, para quem
        reconfere comparar. `valid_until` e o ultimo dia em que o app mostra o
        valor (`checked_at` + 30 dias, `DIAS_DE_VALIDADE_DO_PRECO`). Depois dele
        o app recebe `price_amount` nulo e `price_status: vencido`
        (`listStoreItems`); esta resposta continua trazendo `amount`.
      required: [amount, currency, checked_at, valid_until]
      properties:
        amount: { type: integer }
        currency: { type: string, enum: [BRL] }
        checked_at: { type: string, format: date }
        valid_until: { type: string, format: date }

    AdminStoreItemPublicationState:
      type: string
      description: |
        Derivado no servidor: `draft` nunca foi publicado; `published` esta na
        vitrine; `retired` foi publicado e esta fora. Ha rascunho no item e nao
        ha no encontro (ADR-0027, itens 12.9 e 14).
      enum: [draft, published, retired]

    AdminStoreItemInput:
      type: object
      required: [title]
      additionalProperties: false
      description: |
        **O item nasce RASCUNHO, e desde 17/10/2026 so `title` e obrigatorio**
        (pedido do cliente: "se e rascunho, nao deveria ser obrigatorio...
        justamente porque pode ser que eu esteja aguardando ou buscando por
        alguma informacao adicional").

        **Sao duas reguas, e nao uma.** A desta entrada e a do rascunho: o
        titulo, porque sem ele nao ha registro para a pessoa reencontrar na
        lista. O que falta para o produto aparecer no app e cobrado em
        `publishAdminStoreItem`, que responde `400 validation-failed` com um
        erro POR CAMPO (`code: <campo>_required`); toda leitura do item ja
        traz a mesma lista em `missing_to_publish`, para o painel dizer o que
        falta antes de alguem clicar em publicar.

        O que a pessoa JA escreveu continua conferido pela forma (descricao de
        um caractere e erro de digitacao, nao rascunho), e `target_url` sem
        `partner_slug` e recusado (`400`, `code: partner_required`): o banco
        guarda so o caminho do destino e compoe o endereco com o host do
        parceiro.
      properties:
        slug:
          allOf:
            - $ref: '#/components/schemas/Slug'
          description: |
            Opcional. Sem ele, o servidor deriva do titulo (sem acento,
            minusculo, espaco vira hifen, com sufixo curto se ja existir). O
            formulario do painel nao pede `slug` (matriz de rastreabilidade).
        partner_slug: { $ref: '#/components/schemas/Slug' }
        title: { type: string, minLength: 2, maxLength: 120 }
        summary:
          type: string
          minLength: 2
          maxLength: 3000
          description: |
            A "Descricao" do painel, que desde 17/10/2026 e uma area de texto
            de varias linhas (pedido do cliente). Texto puro, renderizado como
            texto no app (D47); **a quebra de linha e aceita e conta no teto**.
            Nenhuma marcacao: o app desenha com `Text`, e `**` apareceria
            literal.

            **O teto era 180 e passou a 3000 em 17/10/2026** (decisao do
            cliente, no mesmo dia em que o campo virou area de texto). O
            `CHECK store_items_resumo_tem_tamanho` acompanha
            (`20261017000002`). **`network_events.summary` NAO acompanhou**: o
            encontro da `Rede` tem teto proprio de 200 desde 01/10, e o pedido
            foi sobre o produto.

            O cartao da vitrine do app mostra **os 500 primeiros caracteres**,
            cortados no ultimo espaco, com um botao para expandir no lugar
            (decisao do cliente de 17/10/2026). Nao ha tela de detalhe de
            produto: o cartao expandido e o unico lugar onde o texto inteiro
            aparece.
        category: { $ref: '#/components/schemas/StoreCategory' }
        subcategory:
          oneOf:
            - $ref: '#/components/schemas/StoreSubcategory'
            - type: 'null'
          description: |
            **Opcional.** Ausente ou nula cria produto sem segundo nivel, que e
            estado valido. Quando vem, tem de ser uma subcategoria ATIVA **da
            `category` enviada**: subcategoria de outra categoria e `400`,
            `code: subcategory_not_in_category`, e codigo inexistente ou
            inativo e `400`, `code: unknown_subcategory`.
        target_url:
          allOf:
            - $ref: '#/components/schemas/HttpsUrl'
          description: |
            Precisa estar no host do parceiro **ou num subdominio dele**
            (`www.cobasi.com.br` para o parceiro `cobasi.com.br`); qualquer
            outro host e `400`, `code: host_mismatch`. A comparacao e por
            sufixo COM FRONTEIRA DE ROTULO: `malcobasi.com.br` NAO e
            subdominio de `cobasi.com.br` e e recusado.

            **Query e fragmento sao aceitos** (`/p?idsku=1197673`): o banco
            guarda o caminho com os dois. Ate 17/10/2026 eles eram recusados, e
            a recusa bloqueava link legitimo de loja sem proteger o que dizia
            proteger -- o aplicativo abre `target_url` como o servidor a
            mandou, sem acrescentar parametro, e e la que a consequencia 3 da
            BICHUS-185 e garantida.

            Nenhum identificador de pessoa, em codificacao nenhuma.

            Cada recusa tem `code` PROPRIO, e isso e requisito: `url_not_https`,
            `url_has_credentials`, `url_ip_literal`, `url_too_long`,
            `host_mismatch` e `invalid_url` (texto que nao e endereco). Um
            `code` generico para todas fez o painel dizer "precisa comecar com
            https://" sobre um link que comecava com `https://`, e o cliente
            passou a procurar o defeito no proprio link.
        price:
          allOf:
            - $ref: '#/components/schemas/AdminPriceInput'
        species: { $ref: '#/components/schemas/StoreItemSpeciesSet' }
        tag_slugs: { $ref: '#/components/schemas/StoreItemTagSlugs' }
        images: { $ref: '#/components/schemas/StoreCatalogImagesInput' }
        sort_order: { type: integer, minimum: -32768, maximum: 32767, default: 0 }

    AdminStoreItemPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Nao muda o estado de publicacao (isso e `publication`). `price: null`
        tira o preco; `image_upload_id: null` tira a imagem.

        **`null` LIMPA**, no mesmo idioma de `price`, em `partner_slug`,
        `summary`, `category` e `target_url`: ausente nao mexe, `null` apaga,
        valor troca. Limpar cabe porque o rascunho pode estar incompleto
        (17/10/2026); o item publicado que perde um dos quatro **nao** e
        aceito, porque a publicacao exige o conjunto. Tirar `partner_slug`
        tira `target_url` junto: o destino e guardado como caminho e so tem
        endereco com o host do parceiro.
      properties:
        slug: { $ref: '#/components/schemas/Slug' }
        partner_slug:
          oneOf:
            - $ref: '#/components/schemas/Slug'
            - type: 'null'
        title: { type: string, minLength: 2, maxLength: 120 }
        summary: { type: [string, 'null'], minLength: 2, maxLength: 3000 }
        category:
          oneOf:
            - $ref: '#/components/schemas/StoreCategory'
            - type: 'null'
        subcategory:
          oneOf:
            - $ref: '#/components/schemas/StoreSubcategory'
            - type: 'null'
          description: |
            `null` tira a subcategoria; ausente nao mexe nela. **Trocar
            `category` sem mandar `subcategory` e `400`, `code:
            subcategory_not_in_category`**, quando a subcategoria guardada nao
            pertence a categoria nova: aceitar em silencio gravaria o par que a
            chave estrangeira do banco recusa, e a recusa chegaria como erro de
            banco em vez de erro de campo.

            **Limpar `category` com subcategoria de pe tambem e `400`, `code:
            subcategory_without_category`** (17/10/2026, na mescla dos dois
            lotes): `category` passou a ser anulavel no rascunho, e a chave
            estrangeira COMPOSTA e `MATCH SIMPLE` -- com `category` nula ela
            NAO e cobrada, e o par ficaria solto. Quem recusa no banco e o
            `CHECK store_items_subcategoria_exige_categoria`; aqui a recusa
            chega como erro de campo. Mandar os dois `null` no mesmo patch
            limpa os dois niveis.
        target_url:
          oneOf:
            - $ref: '#/components/schemas/HttpsUrl'
            - type: 'null'
        price:
          oneOf:
            - $ref: '#/components/schemas/AdminPriceInput'
            - type: 'null'
        species: { $ref: '#/components/schemas/StoreItemSpeciesSet' }
        tag_slugs: { $ref: '#/components/schemas/StoreItemTagSlugs' }
        images: { $ref: '#/components/schemas/StoreCatalogImagesInput' }
        sort_order: { type: integer, minimum: -32768, maximum: 32767 }

    AdminStoreItem:
      type: object
      required: [slug, partner, title, summary, category, species, tags, images, target_url, missing_to_publish, price_status, publication_state, sort_order, created_at, updated_at, version]
      description: |
        **Os quatro campos que a publicacao exige sao anulaveis aqui, e so no
        rascunho**: `partner`, `summary`, `category` e `target_url`. Eles
        continuam presentes na resposta (com `null`), e `missing_to_publish`
        diz quais faltam. Em `publication_state: published` nenhum dos quatro
        e nulo -- quem garante isso e o `CHECK
        store_items_publicado_esta_completo`, e nao a boa vontade do painel.
      properties:
        slug: { type: string }
        partner:
          oneOf:
            - $ref: '#/components/schemas/StorePartnerRef'
            - type: 'null'
        title: { type: string }
        summary: { type: [string, 'null'] }
        category:
          oneOf:
            - $ref: '#/components/schemas/StoreCategory'
            - type: 'null'
        category_label:
          type: [string, 'null']
          description: |
            O rotulo da categoria, resolvido pelo servidor. A tabela do painel o
            mostra.

            **Nulo quando `category` e nula**, o que o rascunho incompleto de
            17/10/2026 permite: o rotulo acompanha o codigo e nao tem o que
            resolver sem ele.
        subcategory:
          oneOf:
            - $ref: '#/components/schemas/StoreSubcategory'
            - type: 'null'
          description: O segundo nivel, opcional. Nulo e estado normal.
        subcategory_label:
          type: [string, 'null']
          description: O rotulo da subcategoria. Nulo junto com `subcategory`.
        target_url: { type: [string, 'null'], format: uri }
        missing_to_publish:
          type: array
          description: |
            O que ainda falta para publicar, **na ordem dos campos da tela**.
            Vazia quer dizer "da para publicar". E a MESMA conta que o `400` de
            `publishAdminStoreItem` faz: o painel pode dizer o que falta sem
            pedir, e nunca promete uma publicacao que o servidor recusa.

            **`subcategory` NAO entra nesta lista**, e a ausencia e deliberada:
            o segundo nivel e opcional, e item publicado sem subcategoria e
            estado normal. O que a publicacao exige dos dois niveis e a
            COERENCIA deles, e quem cobra isso e o `CHECK
            store_items_subcategoria_exige_categoria`, em rascunho e em
            publicado.
          items:
            type: string
            enum: [summary, category, species, partner_slug, target_url]
        species:
          type: array
          items: { $ref: '#/components/schemas/Species' }
        tags:
          type: array
          items: { $ref: '#/components/schemas/AdminStoreTagRef' }
        images:
          type: array
          maxItems: 8
          description: Na ordem do app. `position` 0 e a principal. Vazia e estado normal.
          items: { $ref: '#/components/schemas/AdminCatalogGalleryImage' }
        price:
          description: Nulo quando o item nao tem preco. **Presente mesmo vencido.**
          oneOf:
            - $ref: '#/components/schemas/AdminPrice'
            - type: 'null'
        price_status: { $ref: '#/components/schemas/StorePriceStatus' }
        publication_state: { $ref: '#/components/schemas/AdminStoreItemPublicationState' }
        published_at:
          type: [string, 'null']
          format: date-time
          description: A primeira publicacao. Nao e reescrita.
        sort_order: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }

    AdminStoreItemPage:
      type: object
      required: [items, page, limit, total, effective_sort]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminStoreItem' }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        effective_sort:
          type: string
          enum: [curadoria, nome, atualizado, validade]
        applied_filters:
          type: object
          additionalProperties: { type: string }

    AdminNetworkEventPlaceInput:
      type: object
      description: |
        **Logradouro publico, nunca residencia** (ADR-0027 item 13). Os tres
        rotulos sao obrigatorios; o ponto e opcional, como tolerancia (D.4), e
        desde 01/10/2026 fica so por compatibilidade: o painel nao usa mais
        mapa. Logradouro, numero e CEP vivem em `street_address`, fora deste
        objeto.
      required: [place_name, neighborhood, city, state]
      additionalProperties: false
      properties:
        place_name: { type: string, minLength: 2, maxLength: 80 }
        neighborhood: { type: string, minLength: 2, maxLength: 60 }
        city: { type: string, minLength: 2, maxLength: 60 }
        state: { type: string, pattern: '^[A-Z]{2}$' }
        point:
          oneOf:
            - $ref: '#/components/schemas/NetworkEventPoint'
            - type: 'null'

    AdminNetworkEventPlace:
      type: object
      required: [place_name, neighborhood, city, state, point]
      properties:
        place_name: { type: string }
        neighborhood: { type: string }
        city: { type: string }
        state: { type: string }
        point:
          oneOf:
            - $ref: '#/components/schemas/NetworkEventPoint'
            - type: 'null'

    TimeZoneName:
      type: string
      pattern: '^[A-Za-z]+/[A-Za-z_]+$'
      description: Nome IANA da zona. Que a zona exista de verdade e conferido no servidor.
      example: America/Sao_Paulo

    AdminNetworkEventInput:
      type: object
      required: [title, summary, place, starts_at]
      additionalProperties: false
      properties:
        slug:
          allOf:
            - $ref: '#/components/schemas/Slug'
          description: |
            Opcional no encontro **publico**: sem ele, o servidor deriva do
            titulo, como no item da `Loja`. No **privado** ele e sempre gerado
            pelo servidor, aleatorio, e mandar um e recusado com `400`
            (`code: private_slug_is_generated`): o `slug` sai no teaser para
            todo mundo, e um `slug` digitado como `caminhada-rua-das-flores`
            entregaria o lugar pelo identificador.
        title: { type: string, minLength: 2, maxLength: 120 }
        summary:
          type: string
          minLength: 2
          maxLength: 200
          description: |
            A descricao do encontro ("Descricao" no painel), ate 200 caracteres.
            O teto vale so na escrita: o `CHECK` do banco foi alargado de 180
            para 200 sem tocar linha existente.
        place: { $ref: '#/components/schemas/AdminNetworkEventPlaceInput' }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        time_zone:
          allOf:
            - $ref: '#/components/schemas/TimeZoneName'
          description: Opcional, padrao `America/Sao_Paulo` (o painel diz "Horario de Brasilia").
          default: America/Sao_Paulo
        images: { $ref: '#/components/schemas/CatalogImagesInput' }
        accepted_sizes: { $ref: '#/components/schemas/NetworkEventAcceptedSizes' }
        dog_age: { $ref: '#/components/schemas/NetworkEventDogAge' }
        vaccination_required: { type: boolean, default: true }
        fenced_off_leash_area:
          type: boolean
          default: false
          description: |
            O local **tem area cercada para caes soltos**. E um atributo do
            lugar, e nao uma permissao dada pelo Bichu (ADR-0027 item 17).
        amenities: { $ref: '#/components/schemas/NetworkEventAmenities' }
        visibility: { $ref: '#/components/schemas/NetworkEventVisibility' }
        admission: { $ref: '#/components/schemas/AdminNetworkEventAdmissionInput' }
        bring_items: { $ref: '#/components/schemas/NetworkEventBringItems' }
        notes: { $ref: '#/components/schemas/NetworkEventNotes' }
        street_address: { $ref: '#/components/schemas/AdminNetworkEventStreetAddress' }
        ticket_url: { $ref: '#/components/schemas/NetworkEventTicketUrl' }
        instagram_url: { $ref: '#/components/schemas/NetworkEventInstagramUrlInput' }

    AdminNetworkEventStreetAddress:
      type: string
      minLength: 5
      maxLength: 200
      description: |
        O endereco por extenso do encontro (decisao do cliente de 01/10/2026),
        de 5 a 200 caracteres contados em code points, aparado. Logradouro
        publico, nunca residencia (ADR-0027 item 13). Endereco e CEP sao o
        conteudo do campo e NAO sao recusados; link, e-mail, perfil
        `@usuario`, telefone, chave PIX e dados de pagamento sao, com `400`
        (`code: contact_or_payment_detected`), e controle bidirecional com
        `code: bidi_control`. No app, sai SO em `getNetworkEventLocation`.

    AdminNetworkEventPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        **Sem data, horario, fuso nem lugar, e sem `street_address`**: mudar
        onde e quando e `relocateAdminNetworkEvent`, que exige reautenticacao
        (T11); sem visibilidade nem condicao de acesso:
        `changeAdminNetworkEventAccess`. `images` substitui a galeria inteira
        (a posicao 0 e a capa); `notes: null` tira as observacoes; as listas
        substituem o conjunto.
      properties:
        slug: { $ref: '#/components/schemas/Slug' }
        title: { type: string, minLength: 2, maxLength: 120 }
        summary: { type: string, minLength: 2, maxLength: 200 }
        images: { $ref: '#/components/schemas/CatalogImagesInput' }
        accepted_sizes: { $ref: '#/components/schemas/NetworkEventAcceptedSizes' }
        dog_age: { $ref: '#/components/schemas/NetworkEventDogAge' }
        vaccination_required: { type: boolean }
        fenced_off_leash_area: { type: boolean }
        amenities: { $ref: '#/components/schemas/NetworkEventAmenities' }
        bring_items: { $ref: '#/components/schemas/NetworkEventBringItems' }
        notes:
          oneOf:
            - $ref: '#/components/schemas/NetworkEventNotes'
            - type: 'null'
        ticket_url:
          description: '`null` tira o link.'
          oneOf:
            - $ref: '#/components/schemas/NetworkEventTicketUrl'
            - type: 'null'
        instagram_url:
          description: '`null` tira o Instagram. A URL completa do perfil; ver `NetworkEventInstagramUrlInput`.'
          oneOf:
            - $ref: '#/components/schemas/NetworkEventInstagramUrlInput'
            - type: 'null'

    AdminNetworkEventRelocation:
      type: object
      required: [reason]
      additionalProperties: false
      minProperties: 2
      description: '`reason` e pelo menos um de `place`, `street_address`, `starts_at`, `ends_at` e `time_zone`.'
      properties:
        place: { $ref: '#/components/schemas/AdminNetworkEventPlaceInput' }
        street_address:
          description: O endereco novo; `null` tira o endereco.
          oneOf:
            - $ref: '#/components/schemas/AdminNetworkEventStreetAddress'
            - type: 'null'
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, 'null'], format: date-time }
        time_zone: { $ref: '#/components/schemas/TimeZoneName' }
        reason:
          type: string
          minLength: 2
          maxLength: 280
          description: Vai no aviso a todos os administradores.

    AdminNetworkEventCancellation:
      type: object
      required: [note]
      additionalProperties: false
      properties:
        note:
          type: string
          minLength: 2
          maxLength: 280
          description: |
            O motivo, **so para o painel e para a trilha**. Nao sai no app: e
            texto livre do administrador, e o cliente nao decidiu mostrar
            motivo (se um dia existir, a UX recomenda lista fechada).

    AdminNetworkEventPublicationStatus:
      type: string
      description: |
        `published` desde a criacao, **tanto pelo painel quanto pela
        comunidade** (nao ha rascunho, ADR-0027 12.9, e nao ha revisao,
        ADR-0025 emenda 3); `cancelled` continua visivel no app como cancelado;
        `removed` e terminal.

        **`pending_review` nao existe mais**: ele era o estado da fila de
        moderacao do encontro da comunidade, e a decisao do cliente de
        17/10/2026 trocou a fila pela publicacao direta de quem tem canal de
        contato verificado. A migracao `20261001000005` tirou o valor do
        `CHECK` do banco, com o `CHECK` que o amarrava a origem.
      enum: [published, cancelled, removed]

    AdminNetworkEventTiming:
      type: string
      description: |
        Calculado no servidor pelo relogio dele (ADR-0025 item 6). Mesmos
        valores de `NetworkEventStatus` da leitura da `Rede`, sem `cancelled`,
        que aqui e estado de publicacao.
      enum: [upcoming, happening, ended]

    AdminNetworkEvent:
      type: object
      description: |
        O encontro como o painel o ve. **Sem autor**: `created_by_user_id` nunca
        e projetado (ADR-0025 secao 3, ADR-0027 item 10).
      required: [slug, title, summary, place, starts_at, time_zone, images, accepted_sizes, dog_age, vaccination_required, fenced_off_leash_area, amenities, origin, visibility, admission, bring_items, notes, street_address, ticket_url, instagram_handle, instagram_url, pending_request_count, publication_status, timing, published_at, created_at, updated_at, version]
      properties:
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        place: { $ref: '#/components/schemas/AdminNetworkEventPlace' }
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, 'null'], format: date-time }
        time_zone: { type: string }
        images:
          type: array
          maxItems: 8
          description: A galeria da equipe, em ordem. A posicao 0 e a capa. Vazia e estado normal (banner da marca no app).
          items: { $ref: '#/components/schemas/AdminCatalogGalleryImage' }
        accepted_sizes:
          type: array
          items: { $ref: '#/components/schemas/PetSize' }
        dog_age: { $ref: '#/components/schemas/NetworkEventDogAge' }
        vaccination_required: { type: boolean }
        fenced_off_leash_area: { type: boolean }
        amenities:
          type: array
          items: { $ref: '#/components/schemas/NetworkEventAmenity' }
        origin:
          type: string
          description: |
            Quem criou: `admin` (o painel) ou `community` (proposto por uma
            conta do app, ADR-0025 emenda 3). **Nao e o autor** --
            `created_by_user_id` e `created_by_admin_id` nunca saem do
            servidor, nem aqui (ADR-0027 apendice A.4). Isto e so a origem, e
            e o que faz a fila de moderacao distinguir o que ela esta
            revisando.
          enum: [admin, community]
        visibility: { $ref: '#/components/schemas/NetworkEventVisibility' }
        admission: { $ref: '#/components/schemas/AdminNetworkEventAdmission' }
        bring_items:
          type: array
          items: { $ref: '#/components/schemas/NetworkEventBringItem' }
        notes: { type: [string, 'null'] }
        street_address:
          type: [string, 'null']
          description: O endereco por extenso. Nulo nos encontros anteriores a 01/10/2026 e em quem nao o informou.
        ticket_url: { type: [string, 'null'], format: uri }
        instagram_handle: { type: [string, 'null'] }
        instagram_url: { type: [string, 'null'], format: uri }
        pending_request_count:
          type: integer
          description: Pedidos pendentes na fila. Sempre 0 em encontro publico. So existe no painel.
        publication_status: { $ref: '#/components/schemas/AdminNetworkEventPublicationStatus' }
        timing: { $ref: '#/components/schemas/AdminNetworkEventTiming' }
        published_at: { type: string, format: date-time }
        cancelled_at: { type: [string, 'null'], format: date-time }
        cancellation_note: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }

    AdminNetworkEventPage:
      type: object
      required: [items, page, limit, total, effective_sort]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminNetworkEvent' }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        effective_sort:
          type: string
          enum: [agenda, atualizado]
        applied_filters:
          type: object
          additionalProperties: { type: string }

    StoreItemSpeciesSet:
      type: array
      minItems: 1
      maxItems: 3
      uniqueItems: true
      description: |
        A que especies o produto serve, uma ou mais. Os valores sao os de
        `Species` (`ref_species`), os mesmos do cadastro de pet: e o que deixa o
        app filtrar a vitrine pela especie dos pets do tutor sem traduzir uma
        lista na outra. `other` e "outros pets", generico de proposito
        (ADR-0027 item 16).
      items: { $ref: '#/components/schemas/Species' }

    StoreItemTagSlugs:
      type: array
      maxItems: 5
      uniqueItems: true
      description: |
        Ate 5 tags do vocabulario curado (`createAdminStoreTag`). Tag que nao
        existe e recusada com `400` (`code: unknown_tag`): tag nao nasce por
        digitacao no formulario do item.

        **O teto de 5 conta todas as tags ligadas, ativas e desativadas.** Tag
        desativada continua ligada ao item por dentro e some da leitura publica;
        contar so as ativas faria reativar uma tag empurrar um item para 6 em
        silencio, ou obrigaria a reativacao a falhar. Assim, reativar sempre
        funciona e o item nunca passa de 5. Ligar **de novo** uma tag
        desativada e recusado (`400`, `code: inactive_tag`); manter na lista
        uma desativada que ja estava ligada e permitido, e e o que preserva o
        vinculo.
      items: { $ref: '#/components/schemas/Slug' }

    CatalogImagesInput:
      type: array
      maxItems: 8
      description: |
        Ate 8 imagens, **na ordem em que o app as mostra**. A primeira e a
        principal (a da lista da `Loja`; a capa do encontro). Cada uma e um
        envio de `createAdminCatalogImageIntent` com o `purpose` do recurso, e
        **cada uma tem texto alternativo obrigatorio, ate 150 caracteres**, em
        toda posicao: a obrigacao da principal acompanha a imagem que vira
        principal numa reordenacao, sem regra a parte. A lista substitui a
        anterior inteira: reordenar e mandar a ordem nova, remover e omitir,
        `[]` tira todas. `upload_id` repetido e recusado com `400`
        (ADR-0027 itens 16 e 17).
      items: { $ref: '#/components/schemas/CatalogImageInput' }

    CatalogImageInput:
      type: object
      required: [upload_id, alt_text]
      additionalProperties: false
      properties:
        upload_id: { type: string, format: uuid }
        alt_text: { $ref: '#/components/schemas/ImageAltText' }

    StoreCatalogImagesInput:
      type: array
      maxItems: 8
      description: |
        A galeria do produto: ate 8 imagens, **na ordem em que o app as
        mostra**. A primeira e a capa (a imagem do cartao da vitrine). Cada uma
        e um envio de `createAdminCatalogImageIntent` com `purpose:
        store_item`. A lista substitui a anterior inteira: **reordenar e mandar
        a ordem nova, escolher a capa e por a imagem em primeiro lugar**,
        remover e omitir, `[]` tira todas. `upload_id` repetido e recusado com
        `400` (ADR-0027 itens 16 e 17).

        **`alt_text` e OPCIONAL aqui** (pedido do cliente de 17/10/2026), e e a
        unica diferenca em relacao a `CatalogImagesInput`, que a `Rede`
        continua usando com o texto obrigatorio. Quando vem, vale de 2 a 150
        caracteres; quando nao vem, a imagem fica sem texto alternativo e o app
        cai no nome do produto. **Campo presente e vazio e recusado**: o painel
        OMITE o campo em vez de mandar `""`.
      items: { $ref: '#/components/schemas/StoreCatalogImageInput' }

    StoreCatalogImageInput:
      type: object
      required: [upload_id]
      additionalProperties: false
      properties:
        upload_id: { type: string, format: uuid }
        alt_text: { $ref: '#/components/schemas/ImageAltText' }

    ImageAltText:
      type: string
      minLength: 2
      maxLength: 150
      description: O que a foto mostra, para quem usa leitor de tela. Texto puro.

    AdminCatalogGalleryImage:
      allOf:
        - $ref: '#/components/schemas/AdminCatalogImage'
        - type: object
          required: [upload_id, position, alt_text]
          properties:
            upload_id:
              type: [string, 'null']
              format: uuid
              description: |
                O identificador que o painel devolve em `images` para manter,
                reordenar ou remover esta imagem. **Nulo** quando a conta que
                enviou a imagem foi apagada: a imagem continua no produto ou no
                encontro (`catalog_images.upload_intent_id` e `ON DELETE SET
                NULL`), e o painel so a mantem reenviando a galeria sem ela ou
                com uma imagem nova.
            position: { type: integer, minimum: 0, maximum: 7 }
            alt_text:
              type: [string, 'null']
              description: |
                **Nulo** quando a imagem foi gravada sem texto alternativo, o
                que a `Loja` passou a permitir em 17/10/2026
                (`StoreCatalogImagesInput`). Na `Rede` o texto continua
                obrigatorio na escrita, e por isso nunca e nulo ali.

    AdminStoreTagRef:
      type: object
      required: [slug, label, active]
      properties:
        slug: { type: string }
        label: { type: string }
        active:
          type: boolean
          description: Tag inativa continua ligada ao item, e some do app.

    AdminStoreTagInput:
      type: object
      required: [label]
      additionalProperties: false
      properties:
        label:
          type: string
          minLength: 2
          maxLength: 24
          description: |
            Como o app mostra. Letras (com acento e cedilha), digitos, espaco e
            a pontuacao de nome de marca -- `&`, hifen, apostrofo (reto ou
            curvo) e `+` --, e nada mais (conferido no servidor, `code:
            tag_charset`). `N&D`, `Hill's` e `Farmina N&D Ocean` sao rotulos
            validos. **`.` e `/` NAO entram**: num rotulo que a Loja publica
            eles sao o que deixa escrever `bit.ly/x` ou `loja.com.br`, e o
            alfabeto e o que fecha essa porta aqui (D59 vale no modulo da Rede,
            nao neste).

            Caractere invisivel ou de controle -- controle, marca de direcao
            bidirecional, espaco de largura zero -- e recusado em separado, com
            `code: tag_invisible_char`: e o que permite um nome que PARECE uma
            coisa e e outra. Nao e o mesmo erro que o alfabeto.

            O servidor apara as pontas e junta espacos repetidos. O `slug` e
            derivado: sem acento, minusculo, espaco, `&` e `+` viram hifen, e o
            apostrofo sai (`N&D` -> `n-d`, `Hill's` -> `hills`). Entao o `&`
            nunca chega ao `slug`, e o filtro `tag` continua recebendo so
            `[a-z0-9-]`. O `slug` derivado precisa caber em `Slug` (3 a 30): o
            rotulo de um ou dois caracteres (`N`, `Pé`) e recusado com `code:
            tag_slug_invalid`. **Dois rotulos que dao o mesmo `slug` sao a mesma
            tag** (`Racao` e `racao` e `Ração`): o segundo e recusado com
            `409 slug-taken`.

    AdminStoreTagPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        label:
          type: string
          minLength: 2
          maxLength: 24
          description: |
            Trocar o rotulo troca o `slug` junto, e o novo nao pode colidir. O
            mesmo alfabeto de `AdminStoreTagInput.label`.
        active: { type: boolean }

    AdminStoreTag:
      type: object
      required: [slug, label, active, item_count, created_at, updated_at, version]
      properties:
        slug: { type: string }
        label: { type: string }
        active: { type: boolean }
        item_count: { type: integer, description: Itens ligados a tag, em qualquer estado. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }

    AdminStoreTagPage:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminStoreTag' }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }

    StoreTagRef:
      type: object
      required: [slug, label]
      properties:
        slug: { type: string }
        label: { type: string }

    StoreItemImage:
      type: object
      required: [url, alt_text]
      properties:
        alt_text:
          type: [string, 'null']
          description: |
            Texto alternativo. Item da massa com imagem externa traz o titulo
            do item. **Nulo** quando o painel gravou a imagem sem texto
            (opcional desde 17/10/2026): o app cai no nome do produto.
        url:
          type: string
          format: uri
          description: A derivada publica, sempre pronta. Imagem em processamento ou recusada nunca aparece aqui.

    StoreTaxonomy:
      type: object
      description: |
        Os dois niveis juntos, aninhados: a subcategoria chega DENTRO da
        categoria a que pertence. Duas listas irmas obrigariam a tela a cruzar
        `category_code` por conta propria, e e justamente essa relacao que o
        `enum` nao sabia expressar.
      required: [categories]
      properties:
        categories:
          type: array
          items: { $ref: '#/components/schemas/StoreTaxonomyCategory' }
          description: So as ATIVAS, em ordem de exibicao (`sort_order`, depois o codigo).

    StoreTaxonomyCategory:
      type: object
      required: [code, label, subcategories]
      properties:
        code: { $ref: '#/components/schemas/StoreCategory' }
        label: { type: string }
        subcategories:
          type: array
          description: |
            So as ATIVAS da categoria, em ordem. **Vazia e estado normal e
            esperado**: a arvore de 17/10 e a de CACHORRO da petlove, e as de
            gato, passaro, peixe e outros ainda nao foram levantadas. Uma
            categoria sem subcategoria apenas nao oferece o segundo nivel.
          items: { $ref: '#/components/schemas/StoreTaxonomySubcategory' }

    StoreTaxonomySubcategory:
      type: object
      required: [code, label]
      properties:
        code: { $ref: '#/components/schemas/StoreSubcategory' }
        label: { type: string }
        species:
          type: array
          items: { $ref: '#/components/schemas/Species' }
          description: |
            As especies para as quais esta subcategoria foi LEVANTADA. Vazia
            quer dizer "vale para todas", e nao "para nenhuma".

            **Nenhuma tela filtra por isto ainda**, e a ausencia e deliberada:
            o recorte pedido em 17/10 e "subcategoria filtrada pela categoria
            escolhida". O campo existe para a arvore de gato ter onde chegar
            sem mudanca de contrato.

    StoreItemDetail:
      allOf:
        - $ref: '#/components/schemas/StoreItemSummary'
        - type: object
          required: [images]
          properties:
            images:
              type: array
              maxItems: 8
              description: |
                Todas as imagens prontas, na ordem do painel; a primeira e a
                mesma de `image_url`. Vazia e estado normal.

                **O que este bloco acrescenta ao resumo e so `required`.**
                Desde 17/10/2026 `StoreItemSummary` tambem declara `images`,
                com o MESMO `maxItems: 8`; aqui o campo deixa de ser opcional,
                porque o detalhe sempre o emite. A repeticao do teto e
                deliberada: `allOf` e intersecao, e dois numeros diferentes nos
                dois lugares fariam valer o menor nas duas telas.
              items: { $ref: '#/components/schemas/StoreItemImage' }

    AdminNetworkEventAdmissionInput:
      type: object
      description: |
        Gratuito ou pago, e **pago e so o valor, informativo** (decisao do
        cliente, 23/09). Pago exige `price` (`400`, `code:
        admission_incomplete`); gratuito o recusa. **O Bichu nao cobra, nao tem
        provedor de pagamento e nao guarda forma de pagar.** O link de compra
        do organizador, quando ha, vive em `ticket_url` (ADR-0027 item 22), e
        nao aqui.
      required: [kind]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [free, paid], default: free }
        price:
          oneOf:
            - $ref: '#/components/schemas/AdminEventPrice'
            - type: 'null'

    AdminEventPrice:
      type: object
      description: |
        O valor que o organizador informa, informativo. Sem vencimento, porque
        nao e preco de referencia de terceiro. Numero mais unidade de lista
        fechada, para o app escrever sempre no mesmo formato ("R$ 15 por
        cao"), sem texto livre.
      required: [amount, currency, unit]
      additionalProperties: false
      properties:
        amount: { type: integer, minimum: 1, maximum: 100000000, description: Centavos. }
        currency: { type: string, enum: [BRL] }
        unit: { $ref: '#/components/schemas/EventPriceUnit' }

    AdminNetworkEventAdmission:
      type: object
      required: [kind, price]
      properties:
        kind: { type: string, enum: [free, paid] }
        price:
          oneOf:
            - $ref: '#/components/schemas/AdminEventPrice'
            - type: 'null'

    AdminNetworkEventAccessChange:
      type: object
      required: [reason]
      additionalProperties: false
      minProperties: 2
      description: '`reason` e pelo menos um de `visibility` e `admission`. `admission` substitui a condicao inteira.'
      properties:
        visibility: { $ref: '#/components/schemas/NetworkEventVisibility' }
        admission: { $ref: '#/components/schemas/AdminNetworkEventAdmissionInput' }
        reason:
          type: string
          minLength: 2
          maxLength: 280
          description: Vai no aviso a todos os administradores.

    AdminJoinRequestStatus:
      type: string
      description: |
        A decisao, como o painel a ve. **O app nunca ve `declined`, e esta
        regra nao e para ser "corrigida"**: para o tutor, o pedido recusado
        aparece como **`requested`** (aguardando) ate o encontro passar, e
        depois como `expired`, exatamente como um pedido que ninguem decidiu
        (decisao do cliente, 23/09). O estado do app (`JoinRequestAppState`:
        `requested`, `approved`, `withdrawn`, `expired`) e derivado na leitura e
        nao tem `declined`. Desistencia nao e estado aqui, e `withdrawn_at`
        (ADR-0027 item 17 e 12.11).
      enum: [pending, approved, declined]

    AdminJoinRequest:
      type: object
      description: |
        Um pedido para participar de encontro privado. **O pedido e da conta,
        nunca do pet** (ADR-0010 item 7). Do solicitante sai **so** o nome de
        exibicao, o mes em que a conta foi criada e se o e-mail foi
        confirmado: sem e-mail, telefone, pets, UUID, identificador estavel nem
        historico (D53). E a unica leitura de pessoa no backoffice v1, coberta
        pelo RA-01 por decisao do cliente de 23/09 (ADR-0027 item 17). O pedido
        some 30 dias depois do fim do encontro (D54).
      required: [ref, event, requester, status, requested_at]
      additionalProperties: false
      properties:
        ref:
          type: string
          description: Identificador opaco do pedido, 128 bits aleatorios. Nao e o UUID.
        event:
          type: object
          required: [slug, title, starts_at, time_zone]
          properties:
            slug: { type: string }
            title: { type: string }
            starts_at: { type: string, format: date-time }
            time_zone: { type: string }
        requester:
          type: object
          description: D53. Projecao minima fechada, e nada alem destes tres campos.
          required: [display_name, member_since, email_verified]
          additionalProperties: false
          properties:
            display_name:
              type: [string, 'null']
              description: |
                O nome de exibicao que a pessoa escolheu, ou `null` quando a
                conta nao tem um. O rotulo do nulo e do painel ("Conta sem nome
                de exibicao"), e o servidor **nunca** preenche o nulo com o
                e-mail nem parte dele (D53).
            email_verified:
              type: boolean
              description: Se a conta confirmou o e-mail. So o booleano, nunca o endereco nem a data.
            member_since:
              type: string
              pattern: '^[0-9]{4}-[0-9]{2}$'
              description: Ano e mes de criacao da conta, no horario de Brasilia (`America/Sao_Paulo`), e nada mais fino.
        status: { $ref: '#/components/schemas/AdminJoinRequestStatus' }
        requested_at: { type: string, format: date-time }
        decided_at: { type: [string, 'null'], format: date-time }
        withdrawn_at:
          type: [string, 'null']
          format: date-time
          description: O tutor desistiu. Pedido desistido nao aparece na fila de pendentes e nao pode ser decidido.

    AdminJoinRequestPage:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminJoinRequest' }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }

    CollarTagRequestInput:
      type: object
      description: |
        O corpo do pedido da plaquinha. O **endereco de entrega e
        obrigatorio** (decisao do cliente, 17/10): sem ele a administracao nao
        cumpre o pedido, e um pedido que nao se cumpre nao deveria poder
        existir. `notes` segue opcional.

        **Valor e cobranca continuam fora**, por decisao do cliente: nao ha
        preco, nao ha forma de pagamento e nao ha status de cobranca.
      additionalProperties: false
      required: [delivery_address]
      properties:
        delivery_address: { $ref: '#/components/schemas/DeliveryAddress' }
        notes:
          type: string
          maxLength: 500
          description: Observacao livre do tutor. Opcional; pedir sem dizer nada e o caminho comum.

    DeliveryAddress:
      type: object
      description: |
        O endereco para onde a plaquinha e enviada. **Dado pessoal**, e o
        tratamento vai junto da definicao:

        - **nao sai em superficie publica**. Ele aparece para quem pediu e para
          a administracao, e mais ninguem. Nenhuma resposta sem conta o
          projeta;
        - **nao entra na trilha de auditoria**. `audit.events` registra que
          houve pedido e qual foi a decisao, pelo `ref`; o endereco nunca e
          copiado para la;
        - **nao e geocodificado, e o CEP nao e resolvido**. A ADR-0006 proibe,
          e nao ha mapa nem busca de endereco neste produto. Todo campo e
          DIGITADO, e nenhum servico externo completa nenhum outro: o servidor
          nao tem como saber se o bairro confere com o CEP;
        - **so o necessario para entregar**. Sem documento e sem data de
          nascimento. `recipient_phone` entrou em 17/10 por decisao do
          cliente: transportadora costuma exigir um telefone para entregar.

        `state` e a sigla de dois caracteres, no mesmo formato de `Area.state`
        -- **sem `enum`**, porque o conjunto das 27 siglas nao existe no
        servidor e declara-lo aqui criaria a segunda fonte para divergir da
        lista do app.
      additionalProperties: false
      required: [recipient_name, recipient_phone, postal_code, street, street_number, neighborhood, city, state]
      properties:
        recipient_name:
          type: string
          minLength: 2
          maxLength: 120
          description: Quem recebe, como vai na etiqueta.
        recipient_phone:
          type: string
          pattern: '^\+55\d{10,11}$'
          example: '+5511987654321'
          description: |
            E.164, **o mesmo padrao de `MeUpdate.phone_e164`** e nao uma
            segunda forma dele. O app mostra mascarado e envia assim.
        postal_code:
          type: string
          pattern: '^[0-9]{8}$'
          description: |
            CEP com oito digitos, **sem mascara e sem hifen**.

            O app o usa para BUSCAR rua, bairro, cidade e estado em servico
            publico (ViaCEP, com BrasilAPI de reserva) e preencher os campos,
            **que seguem editaveis** -- decisao do cliente de 17/10. Isso e
            texto e nao coordenada: nada aqui e geocodificado (ADR-0006), e o
            servidor nao participa da busca nem a repete.
        street: { type: string, minLength: 2, maxLength: 120 }
        street_number:
          type: string
          minLength: 1
          maxLength: 20
          description: Texto, e nao inteiro - `s/n`, `120A` e `KM 32` sao numeros de porta.
        complement:
          type: string
          minLength: 1
          maxLength: 80
          description: O UNICO campo opcional do endereco; casa sem complemento e o caso comum.
        neighborhood: { type: string, minLength: 2, maxLength: 80 }
        city: { type: string, minLength: 2, maxLength: 80 }
        state: { type: string, minLength: 2, maxLength: 2 }

    CollarTagRequestStatus:
      type: string
      enum: [pending, fulfilled, declined]
      description: |
        A DECISAO do painel, e so ela: `pending` ate alguem decidir, `fulfilled`
        quer dizer que o pedido foi ACEITO, `declined` que foi recusado.

        **Nao diz onde a encomenda esta** -- isso e `delivery_state`, que e o
        eixo da entrega e carrega os passos que o tutor acompanha.

        `fulfilled` NAO quer dizer que o codigo foi emitido: emitir e
        `issuePetTag`, e o codigo e irreversivel (ADR-0004).

    CollarTagDeliveryState:
      type: string
      enum: [requested, in_transit, arrived]
      description: |
        O EIXO DA ENTREGA, e os tres passos que o cliente nomeou em 18/10:

        | valor | passo, nas palavras dele |
        | --- | --- |
        | `requested` | solicitado |
        | `in_transit` | em transporte |
        | `arrived` | chegou |

        **Nunca nulo e nunca ausente**: a coluna e `NOT NULL DEFAULT
        'requested'`, entao todo pedido tem um passo escrito -- inclusive os
        criados antes de a entrega existir. A tela le UM campo e desenha UM
        passo, e nao infere "solicitado" de uma ausencia.

        ## Por que e um eixo separado de `status`, e nao mais um valor dele

        O desenho de UM eixo so -- `delivered` acrescentado a
        `CollarTagRequestStatus` -- foi escrito primeiro e **reprovado por
        `oasdiff`**: acrescentar valor a `enum` de RESPOSTA e quebra de contrato
        pela regra `response-property-enum-value-added`, e ela saiu em nivel
        `error` quatro vezes, uma por operacao que projeta o estado. Campo
        ACRESCENTADO nao quebra ninguem; valor acrescentado a `enum` existente
        quebra. O eixo separado e o desenho que nao precisa de dispensa.

        ## E as combinacoes impossiveis?

        Os dois eixos **nao sao independentes**, e quem garante isso e o banco:
        `collar_tag_requests_entrega_exige_atendimento` proibe sair de
        `requested` sem o pedido estar `fulfilled`. Com isso
        recusado-que-chegou e pendente-em-transporte deixam de existir, e nao ha
        par a conferir na aplicacao.

    CollarTagRequest:
      type: object
      description: |
        O pedido da plaquinha como o APP o ve.

        **`ref` PASSOU A SAIR AQUI, em 18/10.** Ate entao esta projecao nao o
        trazia, e o motivo escrito era que o app "nao tem o que fazer com
        ele". O cliente deu o que fazer: a pessoa acompanha o pedido e precisa
        de um numero para pedir ajuda sobre ele. Continua sendo o MESMO `ref`
        opaco de 128 bits da fila do painel -- **nao ha identificador novo, e
        nenhum UUID interno sai** (ADR-0010 item 6). O pet e o do caminho.

        **Sem endereco de entrega**: dado pessoal, ja digitado por quem pede, e
        a unica superficie que o projeta e `AdminCollarTagRequest`.
      required: [ref, status, requested_at]
      additionalProperties: false
      properties:
        ref:
          type: string
          description: |
            O identificador opaco do pedido, 128 bits em base64url. O MESMO
            valor de `AdminCollarTagRequest.ref`, e nao um segundo
            identificador. Nao e UUID.
        status: { $ref: '#/components/schemas/CollarTagRequestStatus' }
        requested_at: { type: string, format: date-time }
        decided_at:
          type: string
          format: date-time
          nullable: true
          description: Quando o painel decidiu, ou nulo enquanto `pending`.
        notes:
          type: string
          nullable: true
          description: A observacao que o tutor escreveu, ou nulo.
        # COSTURA DA MESCLA 18/10: `tracking_code` estava declarado DUAS vezes
        # neste schema -- a frente do aplicativo o descrevia como "HOJE E SEMPRE
        # NULO ... nao ha coluna que o guarde", e a do painel o redeclarava
        # abaixo depois de criar a coluna pela `20261018000004`. A uniao por
        # linha fechava a contagem mas o YAML NAO PARSEAVA (chave de mapa
        # repetida). Ficou UMA, a do painel, que e a que diz a verdade.
        delivery_state: { $ref: '#/components/schemas/CollarTagDeliveryState' }
        tracking_code:
          type: string
          nullable: true
          minLength: 3
          maxLength: 64
          description: |
            O codigo de rastreio da encomenda, ou nulo. **Sai para o DONO do
            pedido**, que e quem acompanha a entrega, e nunca em superficie sem
            conta.

            Nulo e o caso comum e NAO e defeito: nem todo envio tem rastreio
            (entrega em maos, correio simples), e nenhum pedido tem rastreio
            antes de sair. A tela mostra o passo sem o codigo em vez de mostrar
            um campo vazio.

            **Sem validacao de formato de transportadora**: ver
            `AdminCollarTagDeliveryUpdate.tracking_code`.
        shipped_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Quando a plaquinha SAIU, o carimbo do passo "em transporte". Nulo
            enquanto `delivery_state` e `requested`.

            Coluna propria, e **nao `decided_at` reaproveitado**: `decided_at`
            guarda tambem o instante da RECUSA, e chamar aquilo de "saiu" seria
            mentir sobre uma plaquinha que nunca foi despachada. Nao volta a
            nulo quando a encomenda chega -- `arrived` tambem ja saiu.
        delivered_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Quando a plaquinha CHEGOU, o carimbo do passo "chegou". Nulo em tudo
            que nao chegou.

            Com `requested_at` e `shipped_at`, fecha os TRES carimbos dos tres
            passos -- a pagina privada do aplicativo nao precisa derivar nenhuma
            data de nenhum estado.

    CollarTagRequestPage:
      type: object
      description: |
        Os pedidos da plaquinha de UM pet, do mais recente para o mais antigo.
        Sem paginacao: o teto de 3 pedidos por conta por dia e o indice parcial
        de um pendente por pet mantem a lista curta por construcao.
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CollarTagRequest' }

    AdminCollarTagRequestStatus:
      type: string
      enum: [pending, fulfilled, declined]
      description: |
        Os mesmos tres valores de `CollarTagRequestStatus`, que e o eixo da
        DECISAO. Como filtro de `listAdminCollarTagRequests`, e a aba que o
        painel abre; para recortar por passo da ENTREGA o filtro e
        `delivery_state`, e os dois podem ser combinados.

    AdminCollarTagRequest:
      type: object
      description: |
        Um pedido da plaquinha na fila do painel. O pedido e de um PET, e a
        projecao do pet e minima e fechada: sai o nome de exibicao e a
        especie, que e o que identifica qual plaquinha prensar.

        **O ENDERECO DE ENTREGA SAI AQUI**, e e o que o administrador le para
        enviar a plaquinha (decisao do cliente, 17/10). Ele e o unico dado
        pessoal desta resposta, e vem como `DeliveryAddress` -- a mesma forma
        que o tutor digitou, sem geocodificacao e sem resolucao de CEP
        (ADR-0006).

        **Nenhum PERFIL do solicitante sai aqui**: nem e-mail, nem telefone,
        nem UUID, nem identificador estavel, nem historico. O nome que aparece
        e `delivery_address.recipient_name`, que e quem recebe a encomenda e
        nao uma leitura de conta -- a unica leitura de pessoa do backoffice v1
        segue sendo a outra fila (D53 a D57).

        Tambem **nao traz o codigo da plaquinha**, que e credencial ao portador
        (ADR-0004).
      required: [ref, pet, delivery_address, status, requested_at]
      additionalProperties: false
      properties:
        ref:
          type: string
          description: Identificador opaco do pedido, 128 bits aleatorios. Nao e o UUID.
        pet:
          type: object
          required: [display_name, species]
          additionalProperties: false
          properties:
            display_name: { type: string }
            species: { type: string }
        delivery_address: { $ref: '#/components/schemas/DeliveryAddress' }
        notes:
          type: string
          nullable: true
        status: { $ref: '#/components/schemas/AdminCollarTagRequestStatus' }
        requested_at: { type: string, format: date-time }
        decided_at:
          type: string
          format: date-time
          nullable: true
        delivery_state: { $ref: '#/components/schemas/CollarTagDeliveryState' }
        tracking_code:
          type: string
          nullable: true
          minLength: 3
          maxLength: 64
          description: |
            O codigo de rastreio que o administrador digitou, ou nulo. O mesmo
            valor que o dono do pedido le em `CollarTagRequest.tracking_code`.
        shipped_at:
          type: string
          format: date-time
          nullable: true
          description: Quando a plaquinha saiu. Nulo enquanto `delivery_state` e `requested`.
        delivered_at:
          type: string
          format: date-time
          nullable: true
          description: Quando a plaquinha chegou. Nulo em tudo que nao chegou.

    AdminCollarTagDeliveryUpdate:
      type: object
      description: |
        A ATUALIZACAO DA ENTREGA: o passo e o codigo de rastreio, numa escrita
        so. Palavras do cliente (18/10): "mudar o status da entrega e inserir o
        codigo de rastreio e atualizar a entrega" -- uma operacao, e nao duas.

        ## As transicoes que esta operacao aceita

        | de | para | o que e |
        | --- | --- | --- |
        | `requested` | `in_transit` | a plaquinha saiu |
        | `in_transit` | `arrived` | a plaquinha chegou |
        | `in_transit` | `in_transit` | so o rastreio mudou |
        | `arrived` | `arrived` | so o rastreio mudou |

        Qualquer outra responde `400` com `code: invalid_delivery_transition`.

        **O pedido precisa estar `fulfilled`.** Nao se despacha o que o painel
        nao aceitou: pedido em `pending` responde `400` com
        `code: request_not_fulfilled`, e o caminho e `fulfillAdminCollarTagRequest`
        antes. Pedido `declined` responde o mesmo -- recusado nao anda. Isto nao
        e uma conferencia escrita a mao em paralelo ao banco: e a mesma regra do
        `CHECK` `collar_tag_requests_entrega_exige_atendimento`, traduzida para
        uma resposta que diz qual e o proximo passo em vez de estourar.

        **Nao se volta atras**: `arrived` nao vira `in_transit`, e nada volta a
        `requested`. Desfazer uma chegada marcada por engano nao e uma
        transicao: e um pedido novo, ou um ajuste por quem opera o banco.

        **`requested` -> `arrived` nao e aceito**, apesar de ser "para frente".
        O passo "em transporte" e o que carrega o rastreio e o carimbo de
        despacho, e pular direto para a chegada deixaria a entrega sem registro
        de que ela saiu. Sao dois cliques, e o painel os oferece em sequencia.

        **Nada aqui APAGA pedido.** Nao existe exclusao nesta superficie; o que
        o cliente chamaria de cancelar e `declined`, que e estado e e da outra
        operacao.
      additionalProperties: false
      required: [delivery_state]
      properties:
        delivery_state:
          type: string
          enum: [in_transit, arrived]
          description: |
            O passo desejado. So os dois passos que se alcanca: `requested` e o
            inicial e ninguem volta a ele.

            Repetir o passo atual (`in_transit` sobre `in_transit`, `arrived`
            sobre `arrived`) e aceito de proposito: e o caminho de corrigir so o
            rastreio, e e por isso que o campo e obrigatorio em vez de opcional
            -- um corpo sem passo faria a operacao adivinhar.
        tracking_code:
          type: string
          nullable: true
          minLength: 3
          maxLength: 64
          description: |
            O codigo de rastreio, TEXTO que o administrador digita.

            Tres casos, e os tres sao diferentes:

            - **ausente**: o rastreio nao muda. E o que acontece quando so se
              marca a chegada de uma encomenda que ja tinha codigo;
            - **texto**: passa a ser este. Espaco nas bordas e removido antes de
              gravar;
            - **`null`**: o rastreio e APAGADO. Existe para o engano -- codigo da
              encomenda errada -- e nao para uso comum.

            **Sem validacao de formato de transportadora**, de proposito:
            Correios tem 13 simbolos, FedEx de 12 a 22, DHL 10, e transportadora
            regional tem o que quiser e muda. Um formato cravado aqui recusaria,
            em producao e sem aviso, o rastreio legitimo de amanha. Recusa-se so
            o claramente invalido: de 3 a 64 simbolos, e texto que seja **so
            espaco** responde `400` com `code: blank_tracking_code`.

            **Nao ha integracao com transportadora.** Nada neste projeto consulta
            Correios nem ninguem: seria custo recorrente, e a decisao e do
            cliente.

    AdminCollarTagRequestPage:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminCollarTagRequest' }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }

    StoreTagPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 40
          items: { $ref: '#/components/schemas/StoreTagRef' }
