        falha aqui nao e grave: o aviso principal ja saiu.
      security:
        - finderToken: []
      x-rate-limit:
        - dimension: [finder_token]
          limit: 10
          window: 1h
          on_exceed: deny_429
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinderFoundReportEnrichment' }
      responses:
        '200':
          description: Aviso complementado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinderFoundReportView' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/FinderLinkInvalid' }
        '410': { $ref: '#/components/responses/FinderAccessEnded' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /media/finder-photo-intents:
    post:
      operationId: createFinderPhotoUploadIntent
      tags: [found]
      x-effects: [irreversible_write]
      summary: Credenciais de upload da foto do achador
      description: |
        A foto do achador **nunca** aparece em rota publica: ela e vista pelo
        tutor dentro da conversa mediada, e so.

        **No maximo 3 fotos por aviso, para sempre** (SEC-009), e 5 MiB por
        foto -- o teto unico de toda a aplicacao (cliente, 17/10/2026). O teto
        desta rota era 2 MB no SEC-009, e a unificacao o afrouxa: o que continua
        contendo volume aqui e o teto de tres fotos por aviso, que nao reabre.

        O arquivo enviado nunca e servido a ninguem -- nem por URL assinada,
        nem ao tutor. O que o tutor ve dentro da conversa mediada e uma
        derivada **higienizada**: reescrita a partir dos pixels, em JPEG,
        **sem metadado nenhum**. Isso importa aqui mais que em qualquer outro
        caminho: foto de celular carrega coordenada de GPS no EXIF, e num
        produto de pet perdido isso entregaria onde quem achou o animal estava.

        **O arquivo enviado e SUBSTITUIDO pela derivada higienizada** assim que
        ela esta gravada, e so depois disso (cliente, 17/10/2026). A foto
        continua existindo e continua a mesma imagem; o que deixa de existir e
        a copia que carregava a coordenada de GPS. Nenhuma informacao do pet
        e perdida.

        Historico desta descricao, porque ela ja mentiu nos dois sentidos: ela
        prometeu "o arquivo original e apagado assim que a derivada e gerada"
        quando nenhum worker fazia isso; foi corrigida para "o original e
        guardado, inteiro" quando o worker passou a existir sem apagar; e agora
        diz a substituicao, que e a decisao do cliente de 17/10/2026.
      security:
        - finderToken: []
      x-rate-limit:
        - dimension: [finder_token]
          limit: 3
          window: lifetime
          on_exceed: deny_429
      requestBody:
        required: true
        content:
          application/json:
            schema:
              # Sem sobrescrever `byte_size`: o teto e o unico da aplicacao,
              # 5 MiB, e esta rota o herda de `UploadIntentInput`. Era 2 MiB
              # aqui, 2 MiB no servidor e 10 MiB no que o app conferia.
              $ref: '#/components/schemas/UploadIntentInput'
      responses:
        '201':
          description: Credenciais de upload.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinderUploadIntent' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/FinderLinkInvalid' }
        '410': { $ref: '#/components/responses/FinderAccessEnded' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '429':
          $ref: '#/components/responses/TooManyRequests'
          # `deny_429` em `finder_token`, 3 por aviso para sempre (SEC-009).
          # Janela `lifetime`: o corpo nao promete reabertura.

