  /webhooks/postmark:
    servers:
      - url: https://api.{dominio}
        variables: { dominio: { default: PUBLIC_BASE_URL } }
    post:
      operationId: postmarkWebhook
      tags: [ops]
      x-effects: [verifies_secret]
      x-rate-limit:
        - dimension: [ip]
          limit: 600
          window: 1h
          on_exceed: log_and_alert
        - dimension: [ip]
          limit: 20
          window: 1h
          on_exceed: deny_429
          applies_to: invalid_attempts
          note: "requisicao sem assinatura valida: forca verificacao de assinatura a custo do servidor"
      summary: Eventos de entrega do provedor de e-mail
      description: |
        Atualiza `notification_deliveries` com entrega, devolucao e marcacao de
        spam. **E por este caminho que a lista de supressao do provedor chega
        ate nos**: quem marcou uma mensagem como spam entra em supressao, e sem
        ler o evento todo envio seguinte falha em silencio para sempre.

        Autenticado por **assinatura verificada** no cabecalho, com segredo em
        `MAIL_WEBHOOK_SECRET`, comparada em tempo constante; requisicao sem
        assinatura valida responde 401 e nao e processada. Idempotente por
        `MessageID` mais tipo de evento: o provedor reenvia.

        Devolucao definitiva marca o endereco como nao entregavel e aciona o
        aviso persistente no app, com a oferta de corrigir o e-mail.
      security:
        - webhookSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [RecordType, MessageID]
              properties:
                RecordType:
                  type: string
                  enum: [Delivery, Bounce, SpamComplaint, Open, SubscriptionChange]
                MessageID: { type: string }
                Recipient: { type: string }
                Type: { type: string }
                Description: { type: string }
                DeliveredAt: { type: string, format: date-time }
      responses:
        '204': { description: Evento processado ou ignorado por duplicidade. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401':
          description: Assinatura ausente ou invalida.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

