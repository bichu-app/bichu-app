  # ----------------------------------------------------------------------
  #
  # As oito paginas publicas em HTML sairam deste servico. A maior parte delas
  # sempre foi uma casca sobre uma operacao que ja existia (a pagina da tag sobre
  # `GET /v1/tags/{code}`, a do caso sobre `GET /v1/public/lost-cases/...`), mas
  # quatro nao tinham equivalente em JSON. Sao estas.
