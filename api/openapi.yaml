          description: Perfil publico.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicPetProfile' }
        '301': { description: Slug trocado. `Location` aponta para o atual. }
        '400':
          $ref: '#/components/responses/ValidationFailed'
          # `Slug` declara `pattern`: um endereco fora do formato e recusado
          # antes do manipulador, e nao vira 404. A diferenca nao vaza nada:
          # o formato do slug e publico, esta neste documento.
        '404': { $ref: '#/components/responses/NotFound' }
        '429':
          $ref: '#/components/responses/TooManyRequests'
          # `challenge` degenera em `deny_429` com `Retry-After` quando o pedido
          # nao traz `X-Captcha-Token` (secao de `x-rate-limit`, ADR-0020), o
          # mesmo motivo por que `listPublicLostPets` declara 429.

  /public/lost-cases/{shareToken}:
    parameters:
      - $ref: '#/components/parameters/ShareToken'
    get:
      operationId: getPublicLostCase
      tags: [public]
      x-effects: []
      summary: Visao publica de um caso, pelo token compartilhavel
      description: |
        **E o destino do toque no push do alerta.** O vizinho que recebeu o
        aviso e autenticado, mas nao e dono do caso: `GET /v1/lost-cases/{id}`
        responde 404 para ele, de proposito. Esta e a operacao que ele abre.

        Devolve a mesma projecao publica da listagem: foto, sinais, **bairro** e
        data. Nunca contato, endereco, ponto exato nem UUID interno.

        **A autenticacao e opcional e decide um campo so**, `can_report_sighting`,
        que e falso para o tutor do caso. Sem `Authorization`, a leitura e a
        anonima. **Com `Authorization` presente e invalido, a resposta e 401**,
        e nao a leitura anonima: rebaixar em silencio esconderia do app que a
        sessao acabou, e o toque seguinte em "vi este pet" falharia sem
        explicacao. E a mesma regra de `GET /tags/{code}`.

        A resposta varia com quem chama, e por isso sai com
        `Cache-Control: no-store`: um cache compartilhado que guardasse a versao
        do tutor serviria `can_report_sighting: false` ao vizinho.
      security:
        - bearerAuth: []
        - {}
      x-rate-limit:
        - dimension: [ip]
          limit: 120
          window: 1h
          on_exceed: challenge
      responses:
        '200':
          description: Caso aberto.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicLostCase' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
          # `ShareToken` declara `minLength` e `maxLength`: fora da faixa nao e
          # token de caso nenhum, e a recusa vem antes do manipulador. Nao vaza
          # nada, porque a faixa e publica; token dentro da faixa e
          # desconhecido continua sendo 410, como o encerrado.
        '401':
          $ref: '#/components/responses/Unauthorized'
          # So com `Authorization` presente e invalido (ver a descricao).
        '410': { $ref: '#/components/responses/LostCaseClosed' }
        '429':
          $ref: '#/components/responses/TooManyRequests'
          # `challenge` degenera em `deny_429` com `Retry-After` quando o pedido
          # nao traz `X-Captcha-Token` (secao de `x-rate-limit`, ADR-0020).

