          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserLocation' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: deleteMyLocation
      security:
        - bearerAuth: []
