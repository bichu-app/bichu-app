            examples:
              localNovo:
                summary: O lugar nao estava no diretorio, e o contato indicado era telefone
                value:
                  slug: clinica-sao-jorge
              localNovoSemTelefone:
                summary: O contato indicado era um site, e o operador digitou o telefone comercial
                value:
                  slug: passeios-da-bia
                  phone_e164: '+5511999990000'
              localQueJaExiste:
                summary: Duplicata -- a indicacao e ligada a entrada que ja esta la
                value:
                  slug: clinica-sao-jorge
      responses:
        '200':
          description: |
            A indicacao aprovada e a entrada do diretorio. `entry_created` diz
            se a entrada nasceu agora ou se a indicacao foi ligada a uma que ja
            existia.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDirectorySuggestionApproved' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/directory/suggestions/{suggestionRef}/decline:
    parameters:
      - $ref: '#/components/parameters/DirectorySuggestionRef'
    post:
