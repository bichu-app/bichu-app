    post:
      operationId: resendLostCaseAlert
      security:
        - bearerAuth: []
      tags: [lost]
      x-effects: [notifies, expensive_query]
      x-rate-limit:
        - dimension: [case]
          limit: 1
          window: 24h
          on_exceed: deny_429
          note: "ja declarado na descricao; aqui fica verificavel"
      summary: Reenvia o alerta
      description: No maximo um reenvio a cada 24 h por caso.
      responses:
        '202':
          description: Alerta enfileirado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertDispatch' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /lost-cases/{caseId}/candidates:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      operationId: listLostCaseCandidates
      security:
        - bearerAuth: []
      tags: [lost]
      x-effects: []
      x-rate-limit:
        - dimension: [account]
          limit: 120
          window: 1h
          on_exceed: deny_429
      summary: Possiveis correspondencias
      description: |
        **Leitura de linhas ja calculadas**, e por isso `x-effects: []`. O
        cruzamento **nao roda aqui**: ele e um job na fila, disparado quando um
        achado e criado e quando um caso e aberto, e grava em `match_candidates`
        (regra completa na secao 4.10 de `docs/03-arquitetura.md`). Esta
        operacao le e ordena o que ja esta gravado.

        A observacao estava certa e a ambiguidade era real: `score`,
        `matched_attributes` e `distance_m` tem a forma de resultado computado, e
        nada na spec dizia quem computa. Se algum dia esta operacao passar a
        calcular na requisicao, ela vira `expensive_query` e ganha teto — mas
        entao a mudanca e de desenho, e o marcador acompanha em vez de encobrir.

        Lista vazia e um estado legitimo e frequente, distinto de erro. **Nada e
        confirmado sem decisao humana do tutor.**
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Candidatos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidatePage' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /lost-cases/{caseId}/candidates/{candidateId}/decision:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/CandidateId'
    post:
      operationId: decideLostCaseCandidate
      security:
        - bearerAuth: []
      tags: [lost]
      x-effects: [notifies]
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
      summary: Confirma ou descarta uma correspondencia
      description: Confirmar abre a conversa mediada com quem registrou o achado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [confirmed, rejected] }
      responses:
        '200':
          description: Decisao registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchCandidate' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /lost-cases/{caseId}/close:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      operationId: closeLostCase
      security:
        - bearerAuth: []
      tags: [lost]
      x-effects: [notifies]
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
      summary: Encerra o caso com desfecho declarado
      description: |
        O desfecho e o instrumento de medicao do produto: sem ele a metrica de
        reencontro nao existe. Encerrar e reversivel por **7 dias**.

        Ao encerrar, toda conversa aberta recebe a mensagem de sistema que avisa
        quem ajudou.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LostCaseClosure' }
      responses:
        '200':
          description: Caso encerrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LostCase' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /lost-cases/{caseId}/reopen:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      operationId: reopenLostCase
      security:
        - bearerAuth: []
      tags: [lost]
      x-effects: [notifies]
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
      summary: Reabre um caso encerrado por engano
      description: Permitido ate 7 dias apos o encerramento.
      responses:
        '200':
          description: Caso reaberto.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LostCase' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '410':
          description: Passou dos 7 dias.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /lost-cases/{caseId}/snooze:
    parameters:
