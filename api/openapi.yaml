  /media/found-report-photo-intents:
    post:
      operationId: createFoundReportPhotoUploadIntent
      tags: [found]
      x-effects: [irreversible_write]
      summary: Credenciais de upload da foto do achador
      description: |
        A foto do achador **nunca** aparece em rota publica: ela e vista pelo
        tutor dentro da conversa mediada, e so.

        Teto de 5 MiB, herdado de `UploadIntentInput` -- o teto unico de toda a
        aplicacao. O servidor impunha 2 MiB aqui enquanto o contrato prometia
        10 MiB e o app conferia 10 MiB: tres numeros para a mesma regra, e o
        envio de 3 MiB era aceito pelo app, prometido pelo contrato e recusado
        pelo servidor.

        O que a conversa mediada serve e uma derivada **sem metadado nenhum**
        (o EXIF de foto de celular carrega coordenada de GPS). O arquivo
        enviado e **substituido** por essa derivada assim que ela existe: a
        foto continua a mesma, e o que deixa de existir e a coordenada de onde
        quem fotografou estava (cliente, 17/10/2026).
      security:
        - bearerAuth: []
      x-rate-limit:
        - dimension: [found_report]
          limit: 3
          window: lifetime
          on_exceed: deny_429
          note: "SEC-009: 3 fotos e 2 MB por foto no aviso do achador"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/UploadIntentInput'
                - type: object
                  required: [found_report_id]
                  properties:
                    found_report_id: { type: string, format: uuid }
      responses:
        '201':
          description: Credenciais de upload.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadIntent' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }

  # ----------------------------------------------------------------------
