          window: 1h
          on_exceed: log_and_alert
          note: "NUNCA challenge nem deny_429: quem busca este arquivo e o sistema operacional ou uma biblioteca, que nao resolve desafio e nao repete depois de um 429. Recusar aqui quebra a verificacao de dominio e a validacao de token em silencio"
      summary: Associacao de dominio do Android (App Links)
      description: |
        Servido pelo backend a partir de configuracao, nunca de arquivo fixo no
        repositorio: a impressao digital SHA-256 muda com a chave de assinatura
        e por ambiente.

        Exigencias que o sistema operacional impoe, e que sao motivo de falha
        silenciosa quando erradas: **HTTPS sem nenhum redirecionamento**,
        `Content-Type: application/json`, e servido pelo mesmo dominio que
        aparece na URL impressa na tag.
      security: []
      responses:
        '200':
          description: Arquivo de associacao.
