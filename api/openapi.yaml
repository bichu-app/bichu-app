        - bearerAuth: []
      x-rate-limit:
        - dimension: [found_report]
          limit: 3
          window: lifetime
          on_exceed: deny_429
          note: "SEC-009: 3 fotos e 2 MB por foto no aviso do achador"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/UploadIntentInput'
                - type: object
                  required: [found_report_id]
                  properties:
                    found_report_id: { type: string, format: uuid }
      responses:
        '201':
          description: Credenciais de upload.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadIntent' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }

  # ----------------------------------------------------------------------
  # O achador sem conta: rotas enderecadas pelo token, sem id no caminho
  # ----------------------------------------------------------------------
  #
  # Existem separadas das rotas com id por decisao de seguranca (SEC-001): o par
  # "id no caminho + token no cabecalho" e o arranjo classico de BOLA, em que
  # basta a verificacao checar "token valido" em vez de "token pertence a este
  # objeto" para um achador ler a conversa de outro. Sem id no caminho, nao ha o
  # que adulterar, e o achador nunca recebe UUID interno nenhum.

  /finder/found-report:
    patch:
      operationId: enrichFinderFoundReport
      tags: [found]
      x-effects: [notifies]
      summary: Acrescenta onde, foto, recado e contato ao aviso ja enviado
      description: |
        E a operacao da tela "Contar mais". Todos os campos sao opcionais e a
        falha aqui nao e grave: o aviso principal ja saiu.
      security:
        - finderToken: []
      x-rate-limit:
        - dimension: [finder_token]
          limit: 10
          window: 1h
          on_exceed: deny_429
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FoundReportEnrichment' }
      responses:
        '200':
          description: Aviso complementado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinderFoundReportView' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '410':
          description: Caso ja encerrado.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /media/finder-photo-intents:
    post:
      operationId: createFinderPhotoUploadIntent
      tags: [found]
      x-effects: [irreversible_write]
      summary: Credenciais de upload da foto do achador
      description: |
        A foto do achador **nunca** aparece em rota publica: ela e vista pelo
        tutor dentro da conversa mediada, e so.

        Limites proprios, mais estreitos que os do tutor (SEC-009), porque quem
        envia nao tem identidade nenhuma: **2 MB por foto e no maximo 3 fotos por
        aviso**, e o **arquivo original e apagado assim que a derivada e gerada**.
        O original do achador nao e retido e nao e servido a ninguem, nem por URL
        assinada, nem ao tutor.
      security:
        - finderToken: []
      x-rate-limit:
        - dimension: [finder_token]
          limit: 3
          window: lifetime
          on_exceed: deny_429
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/UploadIntentInput'
                - type: object
                  properties:
                    byte_size: { type: integer, minimum: 1, maximum: 2097152 }
      responses:
        '201':
          description: Credenciais de upload.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinderUploadIntent' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }

  /finder/conversation:
    get:
      operationId: getFinderConversation
      tags: [conversations]
      x-effects: []
      x-rate-limit:
        - dimension: [finder_token]
          limit: 120
          window: 1h
          on_exceed: serve_cache
      summary: A conversa do achador, resolvida pelo token
      security:
        - finderToken: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Conversa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinderConversation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '410':
          description: |
            Caso encerrado. A resposta traz o desfecho, porque quem ajudou
            merece saber que deu certo.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /finder/conversation/messages:
    post:
      operationId: postFinderMessage
      tags: [conversations]
      x-effects: [notifies, human_work]
      summary: Envia mensagem no canal mediado, sem conta
      security:
        - finderToken: []
      x-rate-limit:
        - dimension: [finder_token]
          limit: 30
          window: 1h
          on_exceed: deny_429
        - dimension: [finder_token]
          limit: 200
          window: 24h
          on_exceed: hold_for_review
          note: "o token tem escopo de uma conversa so, entao nao ha dimensao de casos distintos deste lado"
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '201':
          description: Mensagem enviada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinderMessage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '410':
          description: Conversa encerrada ou bloqueada.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /finder/conversation/block:
    post:
      operationId: blockFinderConversation
      tags: [conversations]
      x-effects: []
      x-rate-limit:
        - dimension: [finder_token]
          limit: 10
          window: 24h
          on_exceed: accept_and_deduplicate
      summary: Bloqueia a outra parte
      security:
        - finderToken: []
      responses:
        '204': { description: Bloqueada. }
        '403': { $ref: '#/components/responses/Forbidden' }

  /finder/conversation/report:
    post:
      operationId: reportFinderConversation
      tags: [conversations]
      x-effects: [human_work]
      x-rate-limit:
        - dimension: [finder_token]
          limit: 3
          window: 24h
          on_exceed: accept_and_deduplicate
          note: "mesma razao do lado autenticado: a tela confirma normal, e acima do teto a denuncia e anexada ao item de fila ja aberto"
        - dimension: [report_target]
          counts: distinct_identities
          limit: 3
          window: 24h
          on_exceed: raise_queue_priority
          note: "mesma dimensao do lado autenticado: conta denunciantes distintos contra o mesmo alvo, que e a forma da denuncia em laco. Eleva prioridade na fila e NUNCA age sobre o alvo"
      summary: Denuncia abuso
      security:
        - finderToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [extortion, harassment, spam, impersonation, other]
