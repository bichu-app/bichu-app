  /pets/{petId}/transfer:
    parameters:
      - $ref: '#/components/parameters/PetId'
    post:
      operationId: startPetTransfer
      tags: [pets]
      x-effects: [notifies, verifies_secret]
      summary: Inicia a transferencia do pet para outro tutor
      description: |
        **Transferir e a operacao mais destrutiva do produto**: consumar revoga
        **todas** as tags do pet, e a plaquinha que esta na coleira deixa de
        resolver. Por isso a credencial que a autoriza nao pode ser um codigo
        curto protegido por limite de chamadas. Limite de chamadas e a defesa
        errada para isso, e trata-lo como defesa e o que mantem a credencial
        fraca.

        Quatro camadas, e nenhuma delas e o teto de requisicoes:

        1. **Reautenticacao com senha** (`X-Reauth-Token`).
        2. **Vinculo com o destinatario**: o tutor informa o e-mail de quem vai
           receber, e so a conta com aquele e-mail **verificado** consegue
           aceitar. O token nao serve a quem o encontrar.
        3. **Token de 256 bits**, entregue **somente por e-mail** ao
           destinatario, guardado como hash, uso unico, validade de 72 h. Ele
           nao aparece nesta resposta.
        4. **Janela de 24 h cancelavel**: aceitar nao consuma. Os dois lados sao
           avisados, o tutor atual pode cancelar, e so depois a posse muda e as
           tags sao revogadas.
      security:
        - bearerAuth: []
          reauth: []
      x-reauth-scope: pet_transfer
      x-rate-limit:
        - dimension: [account]
          limit: 5
          window: 24h
          on_exceed: deny_429
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient_email]
              properties:
                recipient_email:
                  type: string
                  format: email
                  description: |
                    Precisa ser de uma conta com e-mail verificado. A resposta e
                    a mesma exista ou nao a conta, para nao virar oraculo de
                    cadastro; se nao existir, o convite explica como criar.
      responses:
        '202':
          description: |
            Convite enviado ao destinatario. **A resposta nao traz o token**: ele
            vai por e-mail, para que a posse do aparelho do tutor atual nao
            baste para transferir o pet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PetTransfer' }
        # BICHUS-66: `petId` e `format: uuid`, entao a borda recusa o malformado
        # com 400 antes de qualquer autorizacao. Sem esta linha a subida morre em
        # `vigiarParametrosDasRotas`: o servidor emitia um status que o contrato
        # nao declarava. Mesma forma de `getPet` e `deletePet`.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/ReauthRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Pet com caso aberto, ou transferencia ja em andamento.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /pets/transfers/{transferId}/cancel:
    parameters:
      - name: transferId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: cancelPetTransfer
      security:
        - bearerAuth: []
      tags: [pets]
      x-effects: [notifies]
      summary: Cancela a transferencia antes de ela se consumar
      description: |
        Disponivel para o **tutor atual** durante toda a janela: do convite ate
        as 24 h seguintes ao aceite. Cancelar e a direcao segura, entao **nao
        exige reautenticacao** — o que exige senha e transferir, nao desistir.
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
      responses:
        '200':
          description: Cancelada. Nenhuma tag foi revogada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PetTransfer' }
        # BICHUS-66: mesmo motivo do 400 de `startPetTransfer`. `transferId` e
        # `format: uuid`.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Ja consumada. Depois disso o caminho e transferir de volta.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /pets/transfers/accept:
    post:
      operationId: acceptPetTransfer
      security:
        - bearerAuth: []
      tags: [pets]
      x-effects: [verifies_secret, notifies]
      x-rate-limit:
        - dimension: [account]
          limit: 10
          window: 1h
          on_exceed: deny_429
        - dimension: [ip]
          limit: 20
          window: 1h
          on_exceed: deny_429
          applies_to: invalid_attempts
          note: "o token tem 256 bits e vinculo com o destinatario; o teto aqui e higiene, nao a defesa"
      summary: Aceita a transferencia e inicia a janela de 24 h
      description: |
        Exige conta autenticada **cujo e-mail verificado seja o destinatario do
        convite**. Token valido apresentado por outra conta responde **403, nao
        410**: o token nao esta errado, quem apresenta e que nao e o
        destinatario.

        Aceitar **nao consuma**: abre a janela de 24 h. A posse so muda, e as
        tags so sao revogadas, quando ela fecha sem cancelamento.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 20
                  maxLength: 256
                  description: 256 bits de CSPRNG, uso unico, recebido por e-mail.
      responses:
        '200':
          description: |
            Aceite registrado. `effective_at` diz quando a posse muda; ate la
            nada foi revogado e o tutor atual pode cancelar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PetTransfer' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403':
          description: O token e valido, mas nao e para esta conta.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '410': { $ref: '#/components/responses/TokenExpired' }

  # ----------------------------------------------------------------------
  # Tags QR
  # ----------------------------------------------------------------------

  /pets/{petId}/tags:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      operationId: listPetTags
      security:
        - bearerAuth: []
      tags: [tags]
      x-effects: []
      summary: Tags do pet
      description: |
        **Nunca devolve o codigo em claro**, nem para o dono: apenas os quatro
        ultimos caracteres, para que ele consiga identificar a plaquinha fisica.
        Para reimprimir, use `qr.png`.
      responses:
        '200':
          description: Lista de tags.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PetTag' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: issuePetTag
      security:
        - bearerAuth: []
      tags: [tags]
      x-effects: [reveals_credential, irreversible_write]
      summary: Emite um codigo de tag novo
      description: |
        Gera 128 bits de aleatoriedade criptografica, sem relacao com nenhum id
        do sistema. **Esta e a unica resposta que traz o codigo em claro.** O
        cliente nao deve persistir o valor: para reimprimir, chame `qr.png`.

        O corpo e **opcional**: emitir plaquinha sem apelido e o caminho comum.
        Ate esta declaracao existir, o manipulador lia `label` de um corpo que
        este documento dizia nao existir, e `label` chegava ao banco sem
        nenhuma conferencia de tamanho — um rotulo de 41 caracteres, ou uma
        string vazia, passava a borda e morria no CHECK da tabela, virando
        **500** onde a resposta certa e 400.
      x-rate-limit:
        - dimension: [pet]
          limit: 10
          window: 24h
          on_exceed: deny_429
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PetTagIssueInput' }
            examples:
              semApelido:
                summary: Sem apelido, o caminho comum
                value: {}
              comApelido:
                summary: Com apelido, para quem tem mais de uma plaquinha
                value: { label: Coleira azul }
      responses:
        '201':
          description: Codigo emitido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PetTagIssued' }
        # Duas causas, uma resposta, e `400` so pode aparecer uma vez aqui:
        #  - CORPO: `label` fora da faixa aceita. Os limites sao os mesmos do
        #    CHECK da tabela, de proposito -- a borda recusa o que o banco
        #    recusaria, e a pessoa recebe 400 em vez de 500 (wt-logout).
        #  - PARAMETRO: `petId` que nao e UUID, que ate a BICHUS-199 chegava
        #    torto ao Postgres (wt-params).
        # `ValidationFailed` diz "Corpo ou parametro invalido" e cobre as duas.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Teto de tags ativas por pet atingido (5).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ----------------------------------------------------------------------
  # Pedido da plaquinha da coleira (o OBJETO FISICO)
  #
  # SOLICITAR NAO E EMITIR. `issuePetTag` cria o CODIGO, que e irreversivel
  # (ADR-0004); esta operacao pede o plastico. O tutor que chega aqui ja tem o
  # codigo -- a tela de `Pet cadastrado` emite a tag antes de oferecer o botao
  # --, e o que falta e alguem prensar e entregar.
  #
  # **Sem endereco de entrega e sem valor**, e as duas ausencias sao
  # deliberadas: as duas sao decisao de produto do cliente e nao foram tomadas.
  # Sem endereco o administrador recebe um pedido que nao consegue cumprir; com
  # valor entra cobranca, fora de escopo por decisao dele. O que entra no lugar
  # e `notes`, texto livre e opcional.
  # ----------------------------------------------------------------------

  /pets/{petId}/tag-requests:
    parameters:
      - $ref: '#/components/parameters/PetId'
    post:
      operationId: requestCollarTag
      tags: [tags]
      x-effects: []
      summary: Pedir a plaquinha da coleira de um pet
      description: |
        Cria o pedido do tutor para UM pet dele e responde **200** com o estado
        que o app ve. Pet de outra pessoa **nao existe**: a autorizacao esta na
        clausula `WHERE` e a resposta e `404`, nunca `403` (ADR-0021).

        **Idempotente sem chave de idempotencia**: ha no maximo um pedido
        `pending` por pet (indice parcial unico no banco), e pedir de novo
        devolve o pedido que ja existe em vez de encher a fila com a mesma
        coisa. Depois de atendido, um pedido novo e aceito -- a segunda
        plaquinha e um pedido legitimo.

        **O `ref` do pedido SAI aqui desde 18/10**, para que a pessoa saia
        desta tela com o numero que identifica o pedido dela. Ele e o mesmo
        `ref` opaco da fila do painel, e **nenhum UUID interno sai**
        (ADR-0010 item 6).

        **O endereco e obrigatorio e nao volta na resposta.** Ele e dado
        pessoal, quem o enviou acabou de digita-lo, e devolve-lo seria uma
        copia a mais numa resposta que nao precisa dela. Campo de endereco
        faltando ou malformado responde `400` apontando **qual** campo, pelo
        `errors[].field` de `validation-failed`: e isso que deixa o formulario
        dizer o que falta, campo por campo, em vez de recusar calado.
      security:
        - bearerAuth: []
      x-rate-limit:
        - dimension: [account]
          limit: 3
          window: 24h
          on_exceed: deny_429
          note: "tres por conta por dia, o mesmo numero das outras acoes de peso. Cada pedido vira trabalho fisico de alguem, e um teto alto aqui transforma a fila do painel em porta de abuso"
      requestBody:
        # OBRIGATORIO desde 17/10: o endereco de entrega entrou, e sem corpo
        # nao ha endereco. Era `false` quando o unico campo era `notes`.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CollarTagRequestInput' }
      responses:
        '200':
          description: O estado do pedido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollarTagRequest' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    get:
      operationId: listCollarTagRequests
      tags: [tags]
      x-effects: []
      summary: Os pedidos da plaquinha deste pet
      description: |
        A leitura que sustenta a PAGINA DE ACOMPANHAMENTO do app (decisao do
        cliente, 18/10): privada, exige sessao, e a pessoa ve **so as
        plaquinhas dela**.

        **A autorizacao esta na clausula `WHERE`, e por isso a resposta de pet
        de outra conta e `404` e nunca `403`** (ADR-0021): o `SELECT` carrega
        `pets.owner_user_id = <chamador>` e simplesmente nao encontra linha.
        Um `403` confirmaria que o pet existe.

        **Nenhum endereco de entrega sai aqui.** Ele e dado pessoal, ja foi
        digitado por quem pede, e a unica superficie que o projeta segue sendo
        a fila do painel (`AdminCollarTagRequest`).

        Ordenado do pedido mais recente para o mais antigo. Um pet costuma ter
        um pedido; a lista existe porque a segunda plaquinha e um pedido
        legitimo depois do primeiro ser atendido.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Os pedidos deste pet, do mais recente para o mais antigo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollarTagRequestPage' }
        # `petId` e `format: uuid` e a validacao de parametro pode recusa-lo
        # antes de qualquer leitura. Sem este `400` declarado a aplicacao nao
        # sobe: o portao de rotas registradas cobra que toda operacao que PODE
        # recusar parametro diga isso no contrato.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /pets/{petId}/tags/{tagId}/qr.png:
    parameters:
      - $ref: '#/components/parameters/PetId'
      - $ref: '#/components/parameters/TagId'
    get:
      operationId: getPetTagQrImage
      security:
        - bearerAuth: []
      tags: [tags]
      x-effects: [reveals_credential]
      x-rate-limit:
        - dimension: [account]
          limit: 30
          window: 1h
          on_exceed: deny_429
          note: "renderiza imagem e e a unica superficie que revela o codigo em claro: leitura autenticada, mas nem barata nem inocua"
      summary: Imagem do QR para impressao
      description: |
        PNG com margem de silencio e correcao de erro nivel Q, com a URL
        legivel impressa abaixo do codigo: e o unico caminho de recuperacao
        quando o scan falha.
      responses:
        '200':
          description: Imagem.
          content:
            image/png:
              schema: { type: string, format: binary }
        # `petId` e `tagId` declaram `format: uuid`, entao a borda PODE recusar o
        # parametro -- e `vigiarParametrosDasRotas` derruba a subida quando uma
        # operacao nessa situacao nao declara 400. Nao e escolha de estilo: sem
        # esta linha a aplicacao nao sobe (BICHUS-63).
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '410':
          description: Tag revogada. O QR nao e reimpresso.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /pets/{petId}/tags/{tagId}/revoke:
    parameters:
      - $ref: '#/components/parameters/PetId'
      - $ref: '#/components/parameters/TagId'
    post:
      operationId: revokePetTag
      security:
        - bearerAuth: []
          reauth: []
      x-reauth-scope: tag_revocation
      tags: [tags]
      x-effects: [irreversible_write, verifies_secret]
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
      summary: Revoga o codigo da tag
      description: |
        Irreversivel. A partir daqui o codigo responde "tag desativada" na rota
        publica, e o texto cifrado guardado para reimpressao e apagado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { $ref: '#/components/schemas/TagRevocationReason' }
      responses:
        '200':
          description: Tag revogada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PetTag' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tags/{code}:
    parameters:
      - $ref: '#/components/parameters/TagCode'
    get:
      operationId: resolveTagCode
      tags: [tags]
      x-effects: [irreversible_write]
      summary: Resolve o codigo da tag (F2 e F4)
      description: |
        **Publica.** A posse do codigo e a credencial. Com token de acesso do
        dono, devolve `viewer: owner` e o app abre o modo dono.

        **O corpo e o mesmo nos tres valores de `viewer`.** Ele e a visao
        publica minima: nada de telefone, e-mail, endereco, CEP, sobrenome do
        tutor, ponto exato, id interno de pet ou de tag, nem lista dos outros
        pets do mesmo tutor. `viewer` diz ao app **qual tela abrir** e nao
        acrescenta campo nenhum a resposta.

        O modo dono precisa de `pet_id` e `tag_id`, e eles **nao saem por
        aqui**: estao em `GET /tags/{code}/owner-context`, que exige
        `bearerAuth` e nao tem caminho anonimo. Um corpo que crescesse na
        presenca de token colocaria UUID do banco na resposta declarada de uma
        operacao alcancavel sem conta, o que o item 6 do ADR-0010 proibe **sem
        excecao** para esta rota e para qualquer JSON que a sirva. A condicao
        "so quando `viewer` e `owner`" so pode ser escrita em prosa: validador,
        cliente gerado, simulador e portao leem o campo como presente, e nenhum
        deles cumpre a frase. Ver SEC-001.

        O acesso e registrado com o IP **hasheado**, nunca em claro.
      security:
        - bearerAuth: []
        - {}
      x-credential: tag_code_in_path
      x-rate-limit:
        - dimension: [ip, code]
          limit: 30
          window: 1h
          on_exceed: serve_cache
          note: "par: imune ao CGNAT"
        - dimension: [ip]
          limit: 300
          window: 1h
          on_exceed: challenge
          note: "nunca 429 para codigo valido"
        - dimension: [ip_24]
          limit: 2000
          window: 1h
          on_exceed: log_and_alert
        - dimension: [code]
          limit: 100
          window: 24h
          on_exceed: notify_owner
        - dimension: [finder_identity]
          limit: 5
          window: 10m
          on_exceed: deny_429
          applies_to: invalid_attempts
          note: "adivinhacao de codigo: unica recusa do fluxo. Retry-After 600, e a tela oferece o achado avulso. Conta 400 e 404 igualmente"
        - dimension: [ip]
          limit: 20
          window: 1h
          on_exceed: deny_429
          applies_to: invalid_attempts
      responses:
        '200':
          description: Codigo valido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagResolution' }
              examples:
                perdido:
                  summary: Pet marcado como perdido
                  value:
                    viewer: anonymous
                    pet:
                      display_name: Thor
                      species: dog
                      size: M
                      primary_color: preto e branco
                      distinctive_marks: Coleira vermelha.
                      photo_url: https://img.dominio-a-definir.com.br/p/9f3a.../card.webp
                    lost:
                      is_lost: true
                      since: '2026-09-16T18:20:00Z'
                    already_notified: false
        '400':
          description: |
            O texto **nao normaliza para um codigo**: tem tamanho diferente de
            16 depois da normalizacao, contem caractere fora do alfabeto (`U`,
            por exemplo), ou o **simbolo de verificacao nao bate**. E erro de
            digitacao, e a tela pede para conferir e digitar de novo.

            O terceiro caso e o que mudou: um unico caractere trocado e uma
            transposicao de dois caracteres caem **aqui**, e nao no 404. Antes
            do simbolo de verificacao eles viravam "esse codigo nao e de nenhuma
            tag do Bichu", que acusava a plaquinha quando o que houve foi um
            dedo no lugar errado. Um codigo de **26 caracteres**, do formato
            anterior, tambem e 400: nao ha convivencia de dois tamanhos.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: |
            **Normalizou para um codigo bem formado que nao existe.** Este e o
            caso de codigo invalido, e nao de erro de formato: a pessoa digitou
            algo plausivel e nao ha tag com esse valor. **Diferente de
            revogado**, que e 410 e tem outra tela.

            Para quem esta na rua, a diferenca entre 400 e 404 e util e nao
            vaza nada: um diz "confira o que voce digitou", o outro diz "nao
            encontramos este codigo". Os dois contam igualmente para o limite de
            tentativas invalidas, que e a unica recusa do fluxo.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '410':
          description: |
            Tag revogada pelo tutor. A resposta traz o caminho alternativo, para
            que quem esta com o animal no colo nao chegue a um beco sem saida.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                revogada:
                  value:
                    type: https://dominio-a-definir.com.br/problems/tag-revoked
                    title: Tag desativada
                    status: 410
                    detail: Esta tag foi desativada pelo tutor.
                    next_action: register_stray_found_report
                    correlation_id: 018f7c1e-7a2b-7c3d-9e4f-2b1a0c9d8e7f
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ----------------------------------------------------------------------
  # Avisos do achador e achados avulsos
  # ----------------------------------------------------------------------

  /tags/{code}/owner-context:
    parameters:
      - $ref: '#/components/parameters/TagCode'
    get:
      operationId: getTagOwnerContext
      tags: [tags]
      x-effects: []
      summary: Identificadores da propria tag, para o dono
      description: |
        **Exige conta e nao tem caminho anonimo.** Responde 200 apenas a quem e
        tutor do pet a que esta tag pertence. E a contrapartida autenticada de
        `viewer: owner` em `GET /tags/{code}`.

        Existe porque o modo dono precisa de `pet_id` e `tag_id` para chamar as
        operacoes do tutor, que sao enderecadas por UUID, e porque esses dois
        valores **nao podem viajar no corpo de uma operacao alcancavel sem
        conta** (ADR-0010 item 6; SEC-001). Separar a operacao troca uma
        condicao que so existia em prosa por uma que o `security` declara e que
        qualquer portao consegue conferir.

        O app nao resolve isso sozinho: `GET /pets/{petId}/tags` devolve apenas
        os quatro ultimos caracteres do codigo, de proposito, e
        `POST /pets/{petId}/tags` e a unica resposta que traz o codigo em claro,
        valor que o cliente nao persiste. Sem esta operacao, o unico caminho
        seria varrer os pets e as tags do tutor comparando quatro caracteres,
        que colidem.

        Custa uma ida a mais **so no caminho do dono**, que e o raro: quem
        escaneia a plaquinha na rua e um estranho, e para ele nada muda.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A tag pertence a um pet deste tutor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagOwnerContext' }
              examples:
                dono:
                  value:
                    pet_id: 018f7c1e-7a2b-7c3d-9e4f-2b1a0c9d8e7f
                    tag_id: 018f7c1e-8b3c-7d4e-af50-3c2b1d0e9f80
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            **Um 404 para tres casos**: o codigo nao existe, existe e foi
            revogado, ou existe e e de outro tutor. Distinguir confirmaria a
            existencia de tag alheia a qualquer pessoa com conta (item 9 da
            lista do ADR-0010) e transformaria esta rota num oraculo de
            enumeracao de codigo com um cadastro gratuito na frente. Quem
            precisa da diferenca entre invalido (404) e revogado (410) e o
            achador, e ele a recebe em `GET /tags/{code}`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /tags/{code}/found-reports:
    parameters:
      - $ref: '#/components/parameters/TagCode'
    post:
      operationId: createFoundReportFromTag
      tags: [found]
      x-effects: [notifies, irreversible_write]
      summary: Avisa o tutor a partir do codigo da tag
      description: |
        **A excecao permanente: nao exige conta.** E a operacao mais critica do
        produto e ela precisa funcionar com **corpo vazio** — um toque, zero
        campos. Data e hora sao do servidor; o codigo ja veio no caminho.

        Detalhes (onde, foto, recado, contato) chegam depois, por
        `PATCH /v1/finder/found-report` (`enrichFinderFoundReport`), com o
        `finder_token` em `Authorization: Bearer` e sem id no caminho. A foto
        vem antes, por `POST /v1/media/finder-photo-intents`.

        `Idempotency-Key` e **obrigatorio**: a pagina publica reenvia o pedido
        por fila do service worker quando a rede cai, e o tutor nao pode
        receber o mesmo aviso tres vezes.
      security:
        - bearerAuth: []
        - {}
      x-credential: tag_code_in_path
      x-rate-limit:
        - dimension: [code, finder_identity]
          limit: 1
          window: 6h
          on_exceed: group_notification
          note: "anexa a conversa existente; o aviso nunca e descartado"
        - dimension: [code]
          counts: distinct_identities
          limit: 3
          window: 1h
          on_exceed: group_notification
        - dimension: [code]
          counts: distinct_identities
          limit: 10
          window: 24h
          when: pet_not_lost
          on_exceed: notify_once_and_review
          note: "dez pessoas escaneando a plaquinha de um pet que ninguem deu por falta e a plaquinha circulando sem o animal"
        - dimension: [code]
          counts: distinct_identities
          limit: 30
          window: 24h
          when: pet_lost
          on_exceed: notify_once_and_review
          note: "PET PERDIDO: onze pessoas escaneando a coleira de um cao solto num bairro movimentado e a rede funcionando, nao abuso. Reter ai faz o tutor receber um resumo em vez de saber que ha gente em cima do animal dele, no momento de maior chance de reencontro, e o comportamento e indistinguivel de uma protecao funcionando"
        - dimension: [ip, code]
          limit: 5
          window: 1h
          on_exceed: challenge
        - dimension: [ip]
          limit: 40
          window: 1h
          on_exceed: challenge
        - dimension: [ip_24]
          limit: 200
          window: 1h
          on_exceed: log_and_alert
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FoundReportFromTagInput' }
            examples:
              umToque:
                summary: Um toque, nada digitado
                value: {}
      responses:
        '201':
          description: |
            Tutor avisado. `finder_token` e `conversation_url` permitem voltar a
            conversa sem conta; o cliente guarda no armazenamento local.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FoundReportCreated' }
        '400':
          description: |
            O texto do codigo **nao normaliza para um codigo bem formado**:
            tamanho errado depois da normalizacao, ou caractere fora do
            alfabeto. Responde `tag-code-malformed`, o mesmo tipo de
            `resolveTagCode`, porque e o mesmo erro do mesmo parametro — e o
            app decide a tela pelo `type`, nao pelo status.

            Recusado **na borda**, antes de qualquer leitura: um codigo que nao
            tem a forma de codigo nao chega a virar consulta.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '410':
          description: Tag revogada ou pet excluido.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: |
            Excesso de avisos para o mesmo codigo. A interface publica **nao**
            mostra erro tecnico a um achador real: ela confirma o aviso e a
            moderacao trata o abuso depois.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /found-reports:
