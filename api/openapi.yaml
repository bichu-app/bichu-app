  # ----------------------------------------------------------------------
  # O diretorio de `Perto` -- a leitura
  # ----------------------------------------------------------------------
  #
  # A operacao abaixo e a proposta de `api/diretorio.proposta.yaml` trazida
  # para o contrato em vigor, com uma diferenca de MENOS e uma decisao que foi
  # tomada depois, as duas declaradas:
  #
  # 1. `getDirectoryEntry` e `getDirectoryReferenceData` NAO entraram. As duas
  #    continuam na proposta. Este contrato ja carrega 42 operacoes declaradas
  #    e sem implementacao, e acrescentar duas para nao as implementar hoje
  #    aumenta exatamente a divida que essa conta mede.
  # 2. O parametro `q` e a entrada de teto `[account, q]` ficaram de fora ate
  #    22/09 porque `q` nao estava em `DIMENSOES_CONHECIDAS` de
  #    `src/shared/http/aplicacao-de-teto.ts`, e dimensao nova e decisao de
  #    politica e nao detalhe de rota. A decisao foi tomada e os dois entraram.
  #    O que `q` significa como dimensao esta escrito por extenso naquele
  #    arquivo; o resumo e que ela NAO e o termo digitado, e sim "esta
  #    requisicao traz busca por texto". Fosse o termo, cada termo novo abriria
  #    um balde novo, e quem enumera o diretorio -- que por definicao varia o
  #    termo a cada chamada -- nunca encostaria no teto.

  /directory/entries:
    get:
      operationId: listDirectoryEntries
      tags: [directory]
      x-effects: [expensive_query]
      summary: Profissionais e estabelecimentos da regiao
      description: |
        O diretorio de `Perto`. Devolve apenas entradas publicadas.

        **EXIGE CONTA, e isso e o que torna a resposta possivel.**
        `src/tools/portao-contrato-publico.ts` reprova `phone_e164` e
        `distance_m` em qualquer operacao alcancavel sem conta, e reprova com
        razao. Telefone comercial e distancia sao o conteudo util do diretorio;
        numa rota publica eles nao podem existir. Afrouxar este `security` para
        `[bearerAuth, {}]` faz o portao reprovar os dois, nominalmente.

        **Ordenacao por distancia usa a localizacao de referencia de quem
        chama**, que o servidor ja guarda (BICHUS-92). Ela NAO e enviada na
        requisicao: coordenada em URL vai para log de acesso, para o historico
        do aparelho e para o cabecalho `Referer`.

        Sem localizacao conhecida, ou com mais de 30 dias (ADR-0006), a
        resposta traz `distance_available: false`, a ordenacao cai para `name`
        e `distance_m` vem nulo em todos os itens. **Falha de calculo nao vira
        zero e nao vira ordem aleatoria**: a tela diz que nao consegue ordenar
        por distancia e oferece ligar a localizacao. E a mesma regra do
        `reach_status: unavailable` do alerta.

        **Entrada sem coordenada aparece por ultimo, com `distance_m` nulo, e
        nao some.** A proposta original a excluia de `sort=distance`; excluir
        esconderia uma entrada publicada por causa de um campo que hoje NINGUEM
        consegue preencher -- nao ha painel de cadastro --, que e a mesma classe
        de defeito do zero silencioso, um nivel acima.

        Nao ha geocodificacao neste produto (ADR-0006): `city`, `state` e
        `neighborhood` sao rotulo de exibicao e filtro de texto, jamais fonte
        de coordenada. Quem alimenta o diretorio informa o ponto, e o painel
        precisa captura-lo com **mapa de toque** -- ninguem sabe a propria
        coordenada, e um par de campos de latitude e longitude nao serve.

        Paginacao numerada com total, como a listagem publica de perdidos,
        porque a tela precisa dizer "1 a 20 de 87" e chegar ao fim da lista.
      security:
        - bearerAuth: []
      x-rate-limit:
        - dimension: [account]
          limit: 120
          window: 1h
          on_exceed: deny_429
          note: "consulta geoespacial: teto por conta, nao por IP, porque a rota exige conta"
        - dimension: [account, q]
          limit: 60
          window: 1h
          on_exceed: deny_429
          note: "busca por texto tem teto proprio, e ele e por CONTA. `q` marca presenca de busca, nao o termo: teto por termo nunca pega enumeracao, que e justamente variar o termo"
      parameters:
        - name: q
          in: query
          description: |
            **Busca parcial pelo NOME da entrada**, tolerante a acento e a
            caixa: `veterinaria` acha `Veterinária`.

            **So o nome, e a escolha e de produto.** Todo outro campo que o
            cartao mostra ja tem controle proprio no topo da mesma tela --
            `city`, `state`, `neighborhood`, `kind` e `verification_level`.
            Fazer `q` casar tambem neles poria dois controles disputando o
            mesmo trabalho e deixaria `applied_filters` ambiguo: a tela nao
            teria como escrever por que uma linha entrou. `about` e o candidato
            conhecido para uma segunda fase, e ele custa um indice proprio
            sobre texto bem maior.

            **`minLength: 3` nao e gosto.** O indice que atende esta busca e
            GIN de trigrama, e um padrao com menos de tres caracteres nao
            produz trigrama nenhum: a consulta deixa de usar o indice e volta a
            varrer a tabela inteira. O piso e o ponto em que o indice deixa de
            existir. **A tela nao deve enviar `q` antes do terceiro caractere**,
            sob pena de levar 400 no que a pessoa le como o app quebrado.

            Casa somente sobre `status = 'published'`, como todo o resto da
            operacao. Quem busca por um nome especifico esta testando se ele
            existe, entao um rascunho ou um oculto que aparecesse aqui seria
            resposta a uma pergunta que ninguem tem direito de fazer.
          schema: { type: string, minLength: 3, maxLength: 60 }
        - name: city
          in: query
          description: |
            **Opcional**, e aqui esta proposta e o contrato divergem de
            proposito. A busca de perdidos comeca com alguem digitando onde
            perdeu; `Perto` e uma aba que abre sozinha, e exigir cidade a
            deixaria vazia ate a pessoa digitar algo. O recorte que falta e
            suprido pela ordenacao por distancia, que e o que a secao promete.
            Sem cidade e sem localizacao valida, `applied_filters` diz
            `scope: all` e a tela sabe que nao esta mostrando "perto" coisa
            nenhuma.
          schema: { type: string, minLength: 2, maxLength: 80 }
        - name: state
          in: query
          description: UF, duas letras.
          schema: { type: string, minLength: 2, maxLength: 2 }
        - name: neighborhood
          in: query
          schema: { type: string, minLength: 2, maxLength: 80 }
        - name: kind
          in: query
          description: Filtra por atividade.
          schema: { $ref: '#/components/schemas/ProfessionalKind' }
        - name: verification_level
          in: query
          description: |
            Piso, nao igualdade: `contact_verified` traz tambem
            `document_verified`. Filtro por igualdade esconderia o registro
            mais forte de quem pediu o mais fraco.
          schema: { $ref: '#/components/schemas/VerificationLevel' }
        - name: sort
          in: query
          description: |
            `distance` exige localizacao de referencia valida de quem chama.
            Sem ela, a resposta usa `name` e diz isso em `distance_available`.
          schema: { type: string, enum: [distance, name], default: distance }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      responses:
        '200':
          description: |
            Pagina do diretorio. `total` alimenta "Mostrando 1 a 20 de 87" e
            `applied_filters` alimenta a linha que explica o recorte.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectoryEntryPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /store/items:
    get:
      operationId: listStoreItems
      tags: [store]
      x-effects: [expensive_query]
      summary: A vitrine curada da Loja
      description: |
        A secao `Loja`: uma vitrine curada de produtos de parceiro, cada um com
        o link que abre a loja do parceiro. **A compra acontece la, nao aqui.**

        **E PUBLICA, e a divergencia em relacao a `listDirectoryEntries` e
        deliberada.** `Perto` exige conta porque `phone_e164` e `distance_m`
        sao o conteudo util dela, e o portao de contrato publico reprova os
        dois em operacao alcancavel sem conta. **A Loja nao tem nenhum dos
        dois.** Um item e titulo, resumo, imagem, preco de referencia e o link
        publico do parceiro -- tudo ja publicado no site dele. O criterio 24 da
        BICHUS-185 pede esta operacao publica por extenso, e a BICHUS-189
        repete: "a Loja e navegavel deslogado, entao a operacao nao exige
        conta". Autorizacao na clausula `WHERE` (ADR-0021), sem ramo
        privilegiado.

        **Nenhum UUID sai daqui.** A chave do item e a do parceiro sao o
        `slug`, e nao ha campo de UUID nesta resposta -- nem opcional, nem
        nulavel. O ADR-0010 item 6 proibe UUID interno em saida publica, e
        quem impede o engano nao e a boa vontade de quem escreve a consulta:
        `src/tools/portao-contrato-publico.ts` reprova qualquer campo
        `format: uuid` em operacao alcancavel sem conta (SEC-001).

        As tabelas tem, sim, identidade interna (`store_partners.id`,
        `store_items.id`), e ela e o alvo da chave estrangeira entre as duas
        (ADR-0024). Ela nunca e projetada. Separar as duas identidades e o
        desenho de `pets` e de `professionals`, e existe porque chave
        estrangeira sobre endereco publico e o que o criterio 2 da BICHUS-19
        proibe -- endereco publico e valor que muda e que sai impresso.

        **NAO EXISTE OPERACAO DE ESCRITA DE CATALOGO NESTE CONTRATO**, e a
        ausencia e o criterio 20 da BICHUS-185. A entrada de dados e a decisao
        9.6 de `api/contrato-de-escrita-do-diretorio.md`, pendente do cliente:
        catalogo versionado no repositorio (BICHUS-189) ou backoffice de outra
        esteira. Nos dois caminhos o esquema e o mesmo; no segundo a escrita
        nasce em `/v1/admin/...` como manda o ADR-0023.

        ## O preco de referencia, e o vencimento que o SERVIDOR aplica

        `price_amount` e **inteiro em centavos**, nunca ponto flutuante.
        Ele e **opcional**, e item sem preco e estado normal, nao lacuna.

        Quando ha preco, `price_currency` e `price_checked_at` vem junto,
        sempre -- e `price_checked_at` e a data em que uma PESSOA abriu a
        pagina do parceiro e leu aquele numero.

        **Passados 30 dias da consulta, o servidor OMITE o valor** e
        `price_status` vem `vencido`. Nao e a tela que esconde: se a regra
        morasse no aplicativo, um aparelho com build antigo mostraria preco
        vencido para sempre, e nao haveria como parar isso sem passar pela loja
        de aplicativos. O item **continua na vitrine**; o que some e o numero.

        **Nao ha preco riscado, "de/por", desconto nem comparacao** (criterio
        19): nao ha campo para nenhum deles, e um portao reprova se algum
        nascer.
      security: []
      x-rate-limit:
        - dimension: [ip]
          limit: 300
          window: 1h
          on_exceed: deny_429
          note: "vitrine publica: nao ha conta para contar, entao o teto e por IP, e generoso porque a aba recarrega a cada troca de filtro"
      parameters:
        - name: q
          in: query
          description: |
            Busca por texto em titulo e resumo, **no servidor**. A tela declara
            alcance de servidor por causa disto; filtrar em memoria os itens da
            pagina seria uma busca que funciona com 10 registros e mente com
            200.
          schema: { type: string, minLength: 2, maxLength: 80 }
        - name: category
          in: query
          description: Filtra por categoria do produto.
          schema: { $ref: '#/components/schemas/StoreCategory' }
        - name: species
          in: query
          description: |
            Itens que servem a esta especie, entre outras (ADR-0027 item 16).
            Declarado antes do codigo; o app so oferece o filtro depois de a
            implementacao existir.
          schema: { $ref: '#/components/schemas/Species' }
        - name: tag
          in: query
          description: '`slug` de uma tag ativa. Tag inexistente ou inativa devolve a lista vazia, nao 400: a tag some do vocabulario e o link antigo continua abrindo.'
          schema: { $ref: '#/components/schemas/Slug' }
        - name: sort
          in: query
          description: |
            `curadoria` e a ordem da vitrine, escolhida a mao, e e o default: a
            Loja e uma lista curada e a primeira coisa que ela comunica e a
            escolha. **Nao ha ordem por preco**, porque o preco e opcional e
            vence: a lista se reordenaria sozinha, e "do mais barato" e uma
            afirmacao comparativa que o criterio 19 proibe.
          schema: { type: string, enum: [curadoria, nome], default: curadoria }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      responses:
        '200':
          description: |
            Pagina da vitrine. `total` alimenta a linha de resumo da barra de
            listagem e `applied_filters` alimenta a distincao entre "a vitrine
            esta vazia" e "o seu recorte esvaziou a vitrine".
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreItemPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /store/tags:
    get:
      operationId: listStoreTags
      tags: [store]
      x-effects: []
      summary: As tags que o filtro da Loja oferece
      description: |
        As opcoes do grupo de filtro de tags do app: so tags **ativas** com
        pelo menos um item publicado, em ordem alfabetica, ate 40. O filtro e
        de lista fechada, sem campo digitavel (ADR-0027 item 16).
      security: []
      x-rate-limit:
        - dimension: [ip]
          limit: 300
          window: 1h
          on_exceed: deny_429
      responses:
        '200':
          description: O vocabulario visivel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreTagPage' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /store/items/{itemSlug}:
    parameters:
      - name: itemSlug
        in: path
        required: true
        description: O endereco publico do item.
        schema: { $ref: '#/components/schemas/Slug' }
    get:
      operationId: getStoreItem
      tags: [store]
      x-effects: []
      summary: Um item da vitrine, com todas as imagens
      description: |
        O detalhe do item: o mesmo `StoreItemSummary` da lista, mais **todas as
        imagens prontas**, na ordem do painel (ADR-0027 item 16). A lista
        continua trazendo so a principal, em `image_url`, para nao pesar a
        vitrine.

        Publica, pela mesma razao de `listStoreItems`, e com as mesmas regras:
        nenhum UUID sai, e o preco vencido **sai sem valor**, com
        `price_status: vencido`. Item em rascunho, retirado, inexistente ou de
        parceiro inativo responde **404 nos quatro casos**, com o mesmo corpo
        (ADR-0021).
      security: []
      x-rate-limit:
        - dimension: [ip]
          limit: 300
          window: 1h
          on_exceed: deny_429
          note: "mesmo teto da lista: quem abre o detalhe veio dela"
      responses:
        '200':
          description: O item.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreItemDetail' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ----------------------------------------------------------------------
  # A secao `Rede`: os encontros da comunidade (ADR-0025)
  # ----------------------------------------------------------------------

  /network/events:
    get:
      operationId: listNetworkEvents
      tags: [network]
      x-effects: [expensive_query]
      summary: A agenda de encontros da Rede
      description: |
        A secao `Rede`: os encontros que a comunidade marca em praca e parque.

        **LEIA O ADR-0025 E A SECAO 12 DO ADR-0027 ANTES DE MEXER NESTA
        OPERACAO.**

        ## Nao ha pessoa nenhuma nesta resposta

        Check-in e galeria sairam desta versao por decisao do cliente (ADR-0027
        12.4). Quando voltarem, voltam pelas decisoes 1 a 3 do ADR-0025: a
        presenca e da PESSOA e nunca do pet, sai como numero e nunca como lista,
        e a foto nao tem autor na saida. O motivo e o item 7 do ADR-0010: uma
        lista de presenca num encontro de bairro publica, de graca, que dois
        animais sao do mesmo tutor.

        ## Encontro privado sai como teaser, e nao entra em recorte oculto

        O privado aparece com **so titulo, data local e estado**
        (`NetworkEventPrivateTeaser`, ADR-0027 12.10). Ele casa `q` so pelo
        titulo e **fica fora** de `city`, `admission` e `size`: aparecer num
        recorte que so casa pelo valor oculto entregaria o valor (P19).

        ## Nao ha coordenada nesta resposta, nem ordem por distancia

        O encontro pode ter ponto marcado no mapa (ADR-0027 12.2), e **o ponto
        nao sai aqui**: esta operacao e alcancavel sem conta. Ele sai so em
        `getNetworkEventLocation`, com `bearerAuth` obrigatorio (emenda 1 do
        ADR-0010). O lugar nesta resposta sao tres rotulos de texto --
        `place_name`, `neighborhood`, `city`/`state` --, que e o teto de
        precisao que o ADR-0010 permite em superficie publica.

        **A ordem por distancia nao existe aqui.** Ela e
        `listNearbyNetworkEvents`, com conta. O filtro de lugar e por `city`
        digitada, como a listagem publica de perdidos.

        ## A agenda nao mistura passado e futuro sem dizer qual e qual

        `when` tem default `upcoming`: a lista abre com o que ainda vai
        acontecer. `past` traz o que passou, `all` traz os dois e **nao e o
        default**.

        **`status` e calculado no SERVIDOR**, nunca no aplicativo. O encontro
        CANCELADO continua na agenda ate o fim previsto, com `status`
        `cancelled`; depois do fim, segue a regra do encerrado e sai `ended`
        (ADR-0027 12.6, decisao do cliente de 23/09/2026).

        ## NAO EXISTE OPERACAO DE ESCRITA DE EVENTO NESTA SECAO

        A escrita e do backoffice, em `/admin/network/events` (ADR-0027), e nao
        daqui.
      security: []
      x-rate-limit:
        - dimension: [ip]
          limit: 300
          window: 1h
          on_exceed: deny_429
          note: "agenda publica: nao ha conta para contar, entao o teto e por IP, e generoso porque a aba recarrega a cada troca de filtro"
      parameters:
        - $ref: '#/components/parameters/NetworkEventQuery'
        - $ref: '#/components/parameters/NetworkEventCity'
        - $ref: '#/components/parameters/NetworkEventWhenParam'
        - $ref: '#/components/parameters/NetworkEventSortParam'
        - $ref: '#/components/parameters/NetworkEventAdmissionParam'
        - $ref: '#/components/parameters/NetworkEventVisibilityParam'
        - $ref: '#/components/parameters/NetworkEventSizeParam'
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      responses:
        '200':
          description: |
            Pagina da agenda. `total` alimenta a linha de resumo da barra de
            listagem e `applied_filters` alimenta a distincao entre "a Rede
            ainda nao tem encontro" e "o seu recorte esvaziou a agenda".
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkEventPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /network/events/{eventSlug}:
    get:
      operationId: getNetworkEvent
      tags: [network]
      x-effects: []
      summary: Um encontro
      description: |
        **Um corpo so, e esse corpo e o publico** (ADR-0021). A autenticacao e
        opcional porque a `Rede` e navegavel deslogado, e o corpo e identico nos
        dois casos: nada nesta resposta e derivado de quem chama.

        **Sem coordenada.** Autenticacao opcional e, para o portao de contrato
        publico, operacao publica (P5 de `04-seguranca.md`). O ponto do encontro
        sai em `getNetworkEventLocation`, que exige conta (ADR-0027 12.5).

        **Encontro privado sai como teaser** (`NetworkEventPrivateTeaser`: so
        titulo, data local e estado) para qualquer chamador, inclusive o
        aprovado: o conteudo dele sai em `getNetworkEventPrivateDetails`
        (ADR-0027 12.10). A forma vem do evento, e nao de quem pergunta.

        Encontro que nao existe, que espera revisao (`pending_review`) ou que
        foi retirado (`removed`) responde **404 nos tres casos**, com o mesmo
        corpo: distinguir contaria a um estranho que aquele `slug` existiu. O
        encontro cancelado e visivel, com `status` `cancelled` ate o fim
        previsto.
      security:
        - bearerAuth: []
        - {}
      x-rate-limit:
        - dimension: [ip]
          limit: 600
          window: 1h
          on_exceed: deny_429
          note: "leitura de um evento: teto por IP porque a operacao e alcancavel sem conta, e o dobro da listagem porque abrir a galeria de varios encontros seguidos e uso normal"
      parameters:
        - name: eventSlug
          in: path
          required: true
          description: O endereco publico do encontro. UUID nao sai nesta secao.
          schema: { type: string, minLength: 3, maxLength: 30 }
      responses:
        '200':
          description: O encontro.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkEvent' }
        # `eventSlug` tem forma declarada, entao a validacao de parametro pode
        # recusar -- e operacao que pode recusar declara 400. Sem esta linha a
        # aplicacao NAO SOBE: `rotas-registradas-contra-o-contrato` compara o que
        # o registro instala com o que o contrato promete, e reprova nominalmente.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /network/events/nearby:
    get:
      operationId: listNearbyNetworkEvents
      tags: [network]
      x-effects: [expensive_query]
      summary: A agenda por distancia, pela regiao cadastrada de quem chama
      description: |
        **So com conta, sem alternativa vazia** (ADR-0027 12.14): a ordem que
        depende da regiao de quem chama e uma resposta que muda conforme o
        chamador, que o ADR-0021 proibe na leitura publica.

        **A posicao do tutor nao vai na requisicao.** A operacao usa a regiao de
        referencia ja gravada (`user_reference_locations`, quantizada em 100 m),
        como `Perto`. Nenhuma coordenada sai do aparelho a cada busca, e nada de
        localizacao entra em URL.

        **Encontro privado nao entra**, aprovado ou nao: a posicao dele numa
        lista por distancia ja e localizacao. `distance_m` sai arredondada a
        100 m so para encontro publico com ponto; encontro sem ponto vem no fim,
        com distancia nula. Sem regiao cadastrada, a lista sai em ordem de data,
        toda `distance_m` sai nula e `effective_sort` diz `proximos`.
        `sort=proximos` pede a ordem de data mesmo com regiao, e a distancia
        continua no cartao (APP-2 da matriz).

        Aceita os filtros da leitura publica e `max_km` (2, 5 ou 10), que
        exclui encontro sem ponto e so recorta com regiao cadastrada. **O
        caminho `nearby` e reservado**: nenhum encontro pode ter esse `slug`.
      security:
        - bearerAuth: []
      x-rate-limit:
        - dimension: [account]
          limit: 300
          window: 1h
          on_exceed: deny_429
          note: "exige conta, entao o teto e por conta; o mesmo numero da agenda publica por IP"
      parameters:
        - $ref: '#/components/parameters/NetworkEventQuery'
        - $ref: '#/components/parameters/NetworkEventCity'
        - $ref: '#/components/parameters/NetworkEventWhenParam'
        - $ref: '#/components/parameters/NetworkEventAdmissionParam'
        - $ref: '#/components/parameters/NetworkEventSizeParam'
        - name: sort
          in: query
          schema: { $ref: '#/components/schemas/NetworkEventNearbySort' }
        - name: max_km
          in: query
          schema: { type: integer, enum: [2, 5, 10] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      responses:
        '200':
          description: Pagina da agenda por distancia, so com encontros publicos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkEventNearbyPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /network/events/{eventSlug}/location:
    get:
      operationId: getNetworkEventLocation
      tags: [network]
      x-effects: []
      summary: O ponto do encontro no mapa, so para quem tem conta
      description: |
        O ponto marcado no mapa pelo administrador (`geo_source = map_pin`,
        ADR-0006), para o aplicativo desenhar o encontro no mapa. E a emenda 1
        do ADR-0010, com escopo fechado: **ponto de evento publicado, em
        resposta autenticada**. Coordenada de pessoa, de pet, de caso e de
        achado continua proibida em qualquer superficie.

        **So com conta, e sem alternativa vazia.** `listNetworkEvents` e
        publica e `getNetworkEvent` tem autenticacao opcional; nenhuma das duas
        pode carregar o ponto, porque o portao de contrato publico trata
        autenticacao opcional como publica e o ADR-0021 proibe a resposta que
        muda conforme o chamador (ADR-0027 12.5). Sem conta, a tela mostra os
        rotulos do lugar e nao mostra mapa.

        `point` e **nulo** quando o encontro nao tem ponto marcado: o ponto e
        opcional (ADR-0027 12.2), e a ausencia e estado normal.

        **Lugar publico, nunca residencia** (ADR-0027 secao 13): quem cria o
        encontro e o administrador, o formulario do painel diz que o local e
        logradouro publico, e criar, mover e cancelar avisam todos os
        administradores. Nenhuma restricao de banco distingue uma praca de uma
        casa, e este contrato nao afirma que distingue.

        O encontro e visivel para esta operacao sob a mesma regra de
        `getNetworkEvent` (publicado ou cancelado), com a autorizacao na
        clausula `WHERE`: encontro que nao existe, que espera revisao ou que
        foi retirado responde 404, com o mesmo corpo. **Encontro privado so
        devolve o ponto para conta com pedido aprovado**; as outras recebem o
        mesmo 404 (ADR-0027 12.11). O 401 vem antes de qualquer consulta: sem
        conta nao se descobre nem se o `slug` existe.

        Responde com `Cache-Control: private, no-store`.
      security:
        - bearerAuth: []
      x-rate-limit:
        - dimension: [account]
          limit: 600
          window: 1h
          on_exceed: deny_429
          note: "a operacao EXIGE conta, entao o teto e por conta (ADR-0027 12.5) -- e no Brasil um teto por `ip` pegaria vizinho inocente atras do CGNAT. O mesmo numero do detalhe, porque a tela do encontro chama as duas a cada abertura; o que ele segura e a raspagem dos pontos de todos os encontros por uma conta so"
      parameters:
        - name: eventSlug
          in: path
          required: true
          description: O endereco publico do encontro.
          schema: { type: string, minLength: 3, maxLength: 30 }
      responses:
        '200':
          description: O ponto do encontro, ou `point` nulo quando nao ha ponto marcado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkEventLocation' }
        # Mesma razao de `getNetworkEvent`: `eventSlug` tem forma declarada.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /network/events/{eventSlug}/private-details:
    get:
      operationId: getNetworkEventPrivateDetails
      tags: [network]
      x-effects: []
      summary: O conteudo oculto do encontro privado, so para conta aprovada
      description: |
        Lugar, horario, resumo, imagens, valor, portes, idade, regras,
        estrutura, "o que levar" e observacoes do encontro **privado**, para a
        conta com pedido **aprovado** (ADR-0027 12.11). A autorizacao e um
        `EXISTS` sobre o pedido na clausula `WHERE`.

        **404, com o mesmo corpo, nos tres casos**: o encontro nao e privado,
        nao existe (ou nao e visivel), ou a conta nao tem pedido aprovado. Nao
        ha corpo menor para quem nao foi aprovado: nao ha corpo nenhum.

        Responde com `Cache-Control: private, no-store`.
      security:
        - bearerAuth: []
      x-rate-limit:
        - dimension: [account]
          limit: 600
          window: 1h
          on_exceed: deny_429
          note: "exige conta; o mesmo teto do detalhe e do ponto, porque a tela do encontro chama as tres"
      parameters:
        - $ref: '#/components/parameters/NetworkEventSlugParam'
      responses:
        '200':
          description: O conteudo oculto do encontro.
          headers:
            Cache-Control:
              schema: { type: string, enum: ['private, no-store'] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkEventPrivateDetails' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /network/events/{eventSlug}/join-request:
    post:
      operationId: requestToJoinNetworkEvent
      tags: [network]
      x-effects: []
      summary: Pedir para participar de um encontro privado
      description: |
        Cria o pedido **da conta** (nunca do pet; sem corpo, sem texto livre) e
        responde **200** com o estado que o app ve. Encontro publico, inexistente
        ou nao visivel responde 404.

        **Idempotente, e a recusa e invisivel** (ADR-0027 12.11): pedir de novo
        nunca cria linha nova. Sobre pedido recusado, devolve `requested` e nao o
        recoloca na fila. Nenhuma resposta difere entre recusado e pendente.
        Encontro que ja terminou responde 400 (`code: event_ended`), para o
        pendente e para o recusado igualmente.
      security:
        - bearerAuth: []
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
          note: "escrita por conta; baixo porque pedir e raro"
      parameters:
        - $ref: '#/components/parameters/NetworkEventSlugParam'
      responses:
        '200':
          description: O estado do pedido, no vocabulario do app.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkEventJoinRequest' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    get:
      operationId: getMyNetworkEventJoinRequest
      tags: [network]
      x-effects: []
      summary: O estado do pedido da propria conta
      description: |
        O estado do pedido **da propria conta**, no vocabulario do app
        (`JoinRequestAppState`, sem `declined`). Sem pedido, 404.

        **A desistencia nao deixa rastro legivel.** O pendente desistido e
        apagado (D54) e o recusado desistido e guardado so para nao lavar a
        recusa; os dois respondem 404 aqui. Se o recusado desistido respondesse
        `withdrawn` e o pendente desistido respondesse 404, a desistencia
        separaria o recusado do pendente.
      security:
        - bearerAuth: []
      x-rate-limit:
        - dimension: [account]
          limit: 600
          window: 1h
          on_exceed: deny_429
      parameters:
        - $ref: '#/components/parameters/NetworkEventSlugParam'
      responses:
        '200':
          description: O estado do pedido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkEventJoinRequest' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      operationId: withdrawNetworkEventJoinRequest
      tags: [network]
      x-effects: []
      summary: Desistir do pedido
      description: |
        Desiste enquanto o app ve `requested`, e responde 200 com `withdrawn`.
        Aprovado ou encontro encerrado respondem 400 (`code:
        join_request_final`). Sem pedido (inclusive o ja desistido), 404.

        Pedido **pendente** e apagado na hora (D54). Pedido **recusado** grava a
        desistencia e continua recusado: apaga-lo faria o proximo pedido nascer
        pendente e lavaria a recusa. A resposta e a mesma nos dois casos.
      security:
        - bearerAuth: []
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
      parameters:
        - $ref: '#/components/parameters/NetworkEventSlugParam'
      responses:
        '200':
          description: A desistencia foi registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkEventJoinRequest' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /network/join-requests:
    get:
      operationId: listMyNetworkEventJoinRequests
      tags: [network]
      x-effects: []
      summary: Meus pedidos para participar
      description: |
        Os encontros privados em que **a propria conta** pediu para participar,
        cada um com o teaser e o `JoinRequestAppState`. Nao devolve conteudo
        oculto nem para aprovado: o conteudo continua em `private-details`.

        Aceita `q` (**so titulo**), `state` e `sort=proximos`. **Nao aceita
        `admission` nem `size`**: filtrar por valor oculto entregaria o valor.
        Pedidos desistidos nao aparecem, pela mesma razao de
        `getMyNetworkEventJoinRequest`, e por isso `state=withdrawn` devolve a
        lista vazia.
      security:
        - bearerAuth: []
      x-rate-limit:
        - dimension: [account]
          limit: 300
          window: 1h
          on_exceed: deny_429
      parameters:
        - name: q
          in: query
          description: Busca so no titulo.
          schema: { type: string, minLength: 2, maxLength: 80 }
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/JoinRequestAppState' }
        - name: sort
          in: query
          schema: { type: string, enum: [proximos], default: proximos }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      responses:
        '200':
          description: Pagina dos pedidos da conta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyNetworkEventJoinRequestPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ----------------------------------------------------------------------
  # Superficie publica
  # ----------------------------------------------------------------------

  /public/lost-pets:
    get:
      operationId: listPublicLostPets
      tags: [public]
      x-effects: [expensive_query]
      summary: Pets perdidos da regiao
      description: |
        **Publica e deslogada.** Devolve foto, especie, raca, porte, cor, data e
        **bairro**. Nunca devolve coordenada, nem aproximada, nem arredondada,
        em nenhum filtro e em nenhum zoom: um ponto por caso permite montar o
        mapa que a regra de privacidade existe para impedir.

        Por isso o filtro geografico e por **cidade e bairro digitados**, e nao
        por latitude e longitude. Paginacao numerada com total, porque a tela
        precisa dizer "1 a 20 de 87" e permitir chegar ao fim da lista.
      security: []
      x-rate-limit:
        - dimension: [ip]
          limit: 120
          window: 1h
          on_exceed: challenge
        - dimension: [ip]
          limit: 600
          window: 24h
          on_exceed: challenge
        - dimension: [ip, q]
          limit: 30
          window: 1h
          on_exceed: challenge
          note: "busca por texto tem teto proprio"
      parameters:
        - name: city
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 80 }
        - name: neighborhood
          in: query
          schema: { type: string, maxLength: 80 }
        - name: species
          in: query
          schema: { $ref: '#/components/schemas/Species' }
        - name: size
          in: query
          schema: { $ref: '#/components/schemas/PetSize' }
        - name: period
          in: query
          description: Janela desde a abertura do caso.
          schema: { type: string, enum: [24h, 7d, 30d], default: 30d }
        - name: q
          in: query
          description: |
            Busca parcial por **nome do pet**, tolerante a acento e a caixa.
            Nao busca por codigo de tag: quando o texto digitado tiver a forma
            de um codigo, o cliente chama `GET /v1/tags/{code}`, que leva direto
            ao pet. Aceitar codigo aqui transformaria a listagem publica num
            oraculo de existencia de codigo, com limite de listagem em vez do
            limite estrito da rota da tag.
          schema: { type: string, maxLength: 60 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      responses:
        '200':
          description: |
            Pagina de perdidos. `total` alimenta "Mostrando 1 a 20 de 87" e
            `applied_filters` alimenta a linha que explica o recorte.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicLostPetPage' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /public/pets/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Slug' }
    get:
      operationId: getPublicPetBySlug
      tags: [public]
      x-effects: []
      summary: Perfil publico do pet por endereco (@slug)
      description: |
        Responde 404 quando o tutor nao ligou o perfil publico. Slug trocado
        responde 301 para o atual, para nao quebrar link ja compartilhado.
      security: []
      x-rate-limit:
        - dimension: [ip]
