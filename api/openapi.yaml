# Contrato da API do Bichu. Escrito ANTES do codigo: e ele que destrava backend
# e mobile para correrem em paralelo. Mudanca incompativel exige /v2, nunca
# alteracao silenciosa.
#
# Status: em revisao
# Atualizado: 2026-09-17
openapi: 3.1.0

info:
  title: Bichu API
  version: 1.0.0-rc.1
  summary: Identidade digital do pet, tag QR e rede local de perdido e achado.
  description: |
    Contrato unico entre o app Flutter, o front web que serve as paginas
    publicas (de outro time, desde o ADR-0017) e este backend.

    **Este servico nao renderiza HTML.** Toda resposta e JSON ou
    `application/problem+json`; as oito paginas publicas sairam daqui e sao
    montadas pelo front web a partir destas mesmas operacoes. Nao ha um segundo
    contrato para a web: o 410 com `next_action` chega la do mesmo jeito que
    chega ao app, e as duas pontas decidem pelo `type`, nunca pelo texto.

    ## Regra de acesso

    O app e navegavel deslogado; as **acoes** e que exigem conta. **Todas as 80
    operacoes declaram `security` explicitamente** — nenhuma herda o padrao da
    raiz, que existe so como rede de falha fechada. Rota sem `security`
    declarado nao sobe: a aplicacao derruba na carga do contrato.

    - `security: []` — publica, sem token.
    - `bearerAuth` — exige conta.
    - `bearerAuth` + `[]` — autenticacao **opcional**: a resposta muda se houver
      token (por exemplo, o dono da tag ve o modo dono).
    - `x-credential: tag_code_in_path` — **a posse do codigo impresso na tag e
      a credencial**, e ela viaja no caminho. Nao exige conta. E a excecao
      permanente: quem esta com a plaquinha na mao esta com o animal.

      Isso NAO e um `securityScheme`, e a ausencia e tecnica, nao descuido:
      OpenAPI so admite credencial em cabecalho, consulta ou cookie, e um
      `apiKey` com `in: path` e recusado pelo validador — era o que este
      contrato declarava, e era um dos dois erros que reprovavam o lint. Em
      termos de HTTP a operacao e **publica com autenticacao opcional**
      (`bearerAuth` + `{}`), e o marcador `x-credential` e o que preserva, de
      forma legivel por maquina, a informacao que o `security` nao consegue
      carregar: existe uma credencial, ela e o codigo, e ela esta no caminho.
      Sem o marcador, a revisao de seguranca leria "publica" e pararia ai.
    - `finderToken` — token opaco entregue a quem avisou o tutor sem ter conta,
      para voltar a mesma conversa. Escopo de uma conversa so.

    **Regra que vale para toda resposta a quem chega pelo codigo da tag
    (`x-credential: tag_code_in_path`) ou por `finderToken`: nenhum UUID interno
    sai** (SEC-001). Nesses contextos os
    campos `id` sao omitidos, e o endereco e o token. UUIDv7 e ordenavel e
    carrega o instante de criacao em milissegundos: publicar dois deles entrega
    de graca a taxa de criacao de registros da plataforma inteira. As rotas do
    achador ficam sob `/finder/...` e **nao tem id no caminho**, o que elimina
    o arranjo de BOLA em vez de depender de a verificacao estar correta.

    ## Erros

    Todo erro responde `application/problem+json` conforme a RFC 9457. O campo
    `type` e uma URI estavel sob `https://{dominio}/problems/`; o app decide o
    comportamento por ele, **nunca** pelo texto de `title` ou `detail`.

    ## Idempotencia

    Operacoes de criacao com efeito colateral aceitam o cabecalho
    `Idempotency-Key`. Repetir a mesma chave dentro de 24 h devolve a resposta
    original em vez de criar de novo. E obrigatorio no aviso do achador, que e
    reenviado por fila offline.

    ## Paginacao

    Dois padroes, deliberadamente diferentes:

    - Listagem publica de perdidos: **paginacao numerada** com total, porque a
      tela precisa dizer "1 a 20 de 87" e permitir chegar ao fim.
    - Listagens internas de volume aberto (mensagens, eventos): **cursor**.

    ## Limite de chamadas

    Declarado por operacao na extensao `x-rate-limit`, **estruturada**, com a
    politica de `docs/04-seguranca.md` como fonte. Cada entrada tem:

    - `dimension`: **lista** de chaves que compoem o balde. Uma lista com dois
      itens e um **par**: `[ip, code]` conta por combinacao de IP e codigo, e
      nao por IP nem por codigo isoladamente. A dimensao de par nao e detalhe:
      o CGNAT das operadoras moveis brasileiras faz centenas de assinantes sem
      relacao nenhuma compartilharem o mesmo IPv4, entao teto por IP numa rota
      acessada da rua bloquearia o achador legitimo por causa do vizinho. O par
      mede o que interessa, que e a mesma pessoa insistindo no mesmo pet, e e
      imune ao CGNAT.
    - `limit` e `window`.
    - `counts`: **o que** e contado **dentro do balde**. Sao cinco valores, e
      nao ha um sexto: `requests` (padrao), `distinct_identities`,
      `distinct_cases`, `distinct_emails` e `rows_returned` (linhas devolvidas
      na resposta, e nao requisicoes; entrou com a D56 de `04-seguranca.md`
      para a fila de pedidos do backoffice, onde o que se mede e quanto dado
      de pessoa sai, e nao quantas vezes se pediu). Sem este campo, `limit: 3` numa
      dimensao de conta se leria como tres mensagens quando o que a politica
      quer dizer e tres **casos distintos**.

      `counts` sempre nomeia um atributo **de quem chama ou do que a chamada
      carrega**, nunca da chave do balde. Em `dimension: [report_target]`,
      `counts: distinct_identities` conta **denunciantes distintos contra o
      mesmo alvo** — o alvo e a chave, a identidade e o que se conta. Sinonimo
      por contexto (`distinct_reporters` e o que estava escrito aqui) e o
      caminho pelo qual um vocabulario fechado deixa de ser fechado: o lint
      passa a precisar saber que duas palavras significam a mesma coisa, e a
      terceira palavra entra sem ninguem notar.
    - `applies_to`: **quais** requisicoes entram na conta. Padrao, todas;
      `invalid_attempts` conta so as que falharam.
    - `on_exceed`: o que acontece ao estourar. **E este campo que separa
      orcamento de requisicao de orcamento de efeito.**

    Valores de `on_exceed`:

    | Valor | Aceita e grava? | Notifica? | Revisao humana? |
    |---|---|---|---|
    | `serve_cache` | responde do cache, sem consultar o banco e sem nova linha de trilha | — | nao |
    | `challenge` | sim, com desafio reCAPTCHA v3 na proxima carga | normal | nao |
    | `log_and_alert` | sim | normal | nao, mas alerta o plantao |
    | `group_notification` | sim | **agrupa**, anexando ao aviso ou a conversa existente | nao |
    | `notify_once_and_review` | sim | **uma vez, em resumo** | **sim** |
    | `notify_owner` | sim | avisa o tutor, com a opcao de revogar o codigo | nao |
    | `hold_for_review` | sim | **nao notifica ninguem** | **sim** |
    | `accept_and_deduplicate` | sim | a tela confirma **normalmente** | sim, anexado ao item de fila ja aberto |
    | `accept_and_defer_dispatch` | sim, o recurso e criado | **o disparo fica retido**, e a tela diz isso | sim |
    | `raise_queue_priority` | sim | — | **sim, com prioridade**, e **nunca age sobre o alvo** |
    | `deny_429` | **nao**: recusa com `Retry-After` | — | nao |

    **`challenge` so existe onde ha uma pessoa diante de uma tela.** Operacao
    chamada em segundo plano, por biblioteca ou pelo sistema operacional —
    renovacao de token, arquivo de associacao, JWKS — leva `log_and_alert`,
    nunca `challenge` nem `deny_429`. Nao ha quem responda ao desafio, entao o
    efeito real nao e desafiar: **e a sessao morrer em silencio**, e o usuario
    descobre no dia em que abre o app com o pet sumido. Essas operacoes
    declaram `x-no-challenge: true`.

    **Requisicao sem `X-Captcha-Token` nao e recusada por isso, e `challenge`
    nao se aplica a ela.** Nao ha o que desafiar: o desafio se pede na carga
    seguinte, e a carga seguinte nao vem. O servidor avalia o pedido pelo
    merito dele (a senha confere ou nao confere), grava a ausencia na trilha
    como sinal de moderacao na faixa mais baixa, e **`challenge` degenera em
    `deny_429` com `Retry-After` naquela requisicao**. A regra existe porque a
    alternativa e pior: sem ela, quem esta numa rede que bloqueia o dominio do
    provedor, num aparelho sem os servicos do Google, ou atras de uma extensao
    de privacidade, **nao entra nunca e nao recebe mensagem nenhuma**. Recusa
    com prazo e saida; desafio que nao carrega e parede. Ver `X-Captcha-Token`
    em `components/parameters`, a secao 18.6 de `docs/04-seguranca.md` e o
    ADR-0020.

    **`when`** restringe a entrada a um estado do recurso (`pet_lost`,
    `pet_not_lost`). Existe porque o mesmo numero pode ser protecao num estado e
    dano no outro: muita gente lendo a plaquinha de um pet **perdido** e a rede
    funcionando.

    **`notify_once_and_review` e `hold_for_review` existem separados de
    proposito, e a confusao entre os dois ja aconteceu neste contrato.** Um
    alerta e nenhum alerta sao resultados diferentes, e o teste que verifica
    "o tutor recebeu um resumo" reprova contra o codigo que nao notificou
    ninguem. Os dois casos do produto sao mesmo diferentes: muita gente
    avisando sobre **o mesmo pet** e sinal de que o animal apareceu, entao o
    tutor precisa saber, uma vez; **uma conta abordando tutores diferentes em
    serie** e o padrao do falso achador, e ai avisar os tutores e ajudar o
    golpe a chegar.

    **Dois invariantes do produto, e eles valem sobre qualquer numero desta
    especificacao:**

    1. **Nenhum aviso ao tutor e descartado por limite.** O que se agrupa e o
       push. Um `429` no unico toque que o produto existe para receber e um
       defeito pior do que o abuso que evitaria.
    2. **O primeiro aviso de uma identidade para um codigo passa sempre**, sem
       excecao e sem desafio.

    O limite e aplicado na borda e **revalidado no servico**: o servico nunca
    confia que o gateway ja filtrou.
  contact:
    name: Squad Bichu
  license:
    name: Proprietario

servers:
  - url: https://api.{dominio}/v1
    description: Producao
    variables:
      dominio:
        default: dominio-a-definir.com.br
  - url: https://api.hml.{dominio}/v1
    description: Homologacao
    variables:
      dominio:
        default: dominio-a-definir.com.br
  - url: http://localhost:3000/v1
    description: Ambiente local

tags:
  - name: auth
    description: Conta, sessao, verificacao de e-mail e senha.
  - name: me
    description: Perfil do usuario autenticado, aparelhos e localizacao.
  - name: pets
    description: Pets do tutor, fotos, slug e transferencia.
  - name: tags
    description: Codigos de tag QR — emissao, revogacao e resolucao publica.
  - name: lost
    description: Casos de pet perdido, alerta e encerramento.
  - name: found
    description: Avisos vindos da tag e achados avulsos.
  - name: conversations
    description: Contato mediado entre tutor e achador.
  - name: public
    description: Superficie publica, listagem de perdidos e dados de referencia.
  - name: directory
    description: O diretorio de profissionais e estabelecimentos da secao `Perto`.
  - name: store
    description: A vitrine curada da secao `Loja`.
  - name: admin
    description: |
      O backoffice em `admin.bichu.app` (ADR-0027). So existe naquele host, so
      aceita a sessao administrativa em cookie, e toda escrita grava na trilha
      na mesma transacao.
  - name: web
    description: Rotas HTML servidas pelo proprio backend.
  - name: ops
    description: Saude, versao e metadados de identidade.

# Padrao de falha fechada. **Toda** operacao declara `security` explicitamente
# (o portao de contrato reprova a que nao declarar), entao este bloco nunca e
# usado em operacao nenhuma hoje. Ele fica como rede: se o portao for contornado
# e uma operacao nova subir sem declaracao, ela nasce exigindo token em vez de
# nascer aberta, que e o que aconteceria se a raiz estivesse vazia.
security:
  - bearerAuth: []

# ==========================================================================
# Vocabularios fechados, em forma legivel por maquina
# ==========================================================================
#
# Existem porque um vocabulario que so vive em prosa (aqui, ou na 4.10 de
# `docs/04-seguranca.md`, ou no criterio de uma historia) tem tantas versoes
# quantos forem os lugares onde foi escrito, e elas divergem sem nenhum sinal.
# Foi o que aconteceu: a historia falava em 8 valores de `on_exceed`, a 4.10 em
# 9, e este contrato usa 11.
#
# A partir daqui o contrato e a fonte unica, e ele e verificavel: o lint le
# estas listas e reprova qualquer valor fora delas, em vez de carregar uma copia
# propria que envelhece. Documento que declare valores diferentes destes esta
# errado por definicao, e a correcao e no documento.

x-rate-limit-vocabulary:
  counts:
    - requests
    - distinct_identities
    - distinct_cases
    - distinct_emails
    - rows_returned
  applies_to:
    - all
    - invalid_attempts
  when:
    - pet_lost
    - pet_not_lost
  on_exceed:
    # A semantica de cada um esta na tabela de `info.description`. Aqui fica a
    # linha que o lint precisa e a que separa os pares que ja foram confundidos.
    serve_cache: responde do cache, sem consultar o banco e sem nova linha de trilha
    challenge: aceita, com desafio reCAPTCHA v3 na proxima carga. So onde ha pessoa diante da tela
    log_and_alert: aceita e notifica normal, e alerta o plantao
    group_notification: aceita e AGRUPA a notificacao ao aviso ou a conversa existente. Sem revisao humana
    notify_once_and_review: aceita, notifica UMA vez em resumo, e abre revisao humana
    notify_owner: aceita e avisa o tutor, com a opcao de revogar o codigo. Sem revisao
    hold_for_review: aceita, NAO notifica ninguem, e abre revisao humana
    accept_and_deduplicate: aceita, a tela confirma normalmente, e a revisao e anexada ao item de fila ja aberto
    accept_and_defer_dispatch: aceita e cria o recurso, RETEM o disparo, a tela diz isso, e abre revisao
    raise_queue_priority: aceita, eleva a prioridade na fila de revisao, e NUNCA age sobre o alvo
    deny_429: recusa com `Retry-After`. Unico valor que nao aceita

# DIVIDA REGISTRADA EM 23/09/2026 (BICHUS-41). O limitador do servico
# (`src/shared/http/aplicacao-de-teto.ts`) conta e recusa so `deny_429`. Tres
# valores acima estao DECLARADOS e NAO sao aplicados por ele:
#
#   serve_cache            resolveTagCode, getFinderConversation,
#                          previewLostCaseReach, getLostCasePoster,
#                          getReferenceData
#   accept_and_deduplicate blockFinderConversation, reportFinderConversation,
#                          blockConversation, reportConversation
#   raise_queue_priority   reportFinderConversation, reportConversation
#
# O que existe hoje: a denuncia do achador deduplica pelo indice parcial de
# `conversation_reports` (um item aberto por lado), que cobre parte de
# `accept_and_deduplicate` sem passar pelo limitador. Nada eleva prioridade e
# nada responde do cache. Estouro nessas entradas hoje e atendido como se o
# teto nao existisse. Gatilho para pagar: antes de a primeira dessas operacoes
# ir para producao, ou no primeiro incidente de abuso numa delas. Esta lista
# e mantida a mao; ao pagar um item, tire a operacao daqui.

x-problem-types:
  # `type` e sempre `https://{dominio}/problems/<slug>` e o cliente decide por
  # ele, nunca pelo texto. Esta lista e fechada: tipo novo entra aqui antes de
  # existir no codigo, e o tipo do backend e gerado daqui.
  #
  # `status` e o unico status HTTP com que o tipo pode sair. Tres dos 401 do
  # produto significam coisas diferentes e a tela reage diferente a cada um, por
  # isso sao tres tipos e nao um: `invalid-credentials` mantem a pessoa na tela
  # de entrada, `token-expired` renova em silencio ou manda entrar de novo, e
  # `unauthenticated` manda entrar. `forbidden` NAO serve para nenhum dos tres:
  # ele e 403, e usa-lo em 401 faz o app tratar "sua senha nao confere" com o
  # mesmo caminho de "este recurso nao e seu".
  - { slug: validation-failed,             status: 400 }
  - { slug: unauthenticated,               status: 401, note: "sem token, token ausente ou assinatura invalida" }
  - { slug: invalid-credentials,           status: 401, note: "e-mail ou senha nao conferem. Corpo IDENTICO para conta inexistente e senha errada" }
  - { slug: token-expired,                 status: 401, note: "token de acesso, de renovacao ou de uso unico expirado, ja usado ou revogado" }
  - { slug: reauthentication-required,     status: 401, note: "a sessao continua valida; falta a janela de reautenticacao" }
  - { slug: forbidden,                     status: 403, note: "SOMENTE 403. Recurso de outro tutor responde 404, nao 403" }
  - { slug: not-found,                     status: 404 }
  - { slug: email-already-registered,      status: 409 }
  - { slug: slug-taken,                    status: 409 }
  - { slug: event-not-open,                status: 409, note: "o pedido de participacao nao pode ser decidido porque o encontro foi cancelado, removido ou ja terminou (BICHUS-292). Separado de `validation-failed`/`request_not_pending`: ali o problema e o PEDIDO; aqui e o ENCONTRO, e nenhuma decisao sobre esse pedido vai valer" }
  - { slug: pet-already-lost,              status: 409, note: "este pet ja tem caso aberto. O banco impoe (indice unico parcial), e o tipo existe para a tela dizer 'voce ja marcou' em vez de 'erro'" }
  - { slug: community-event-limit-reached, status: 409, note: "teto de 3 encontros ATIVOS (ainda nao encerrados) criados pela comunidade, por conta (ADR-0025 emenda 3). O mesmo numero de `open-case-limit-reached`, e de proposito: as duas perguntas sao a mesma -- quantas acoes de peso uma conta mantem em aberto -- e dois numeros para ela obrigariam a defender os dois. Sem revisao humana, este teto e o de chamada sao a unica contencao de volume" }
  - { slug: open-case-limit-reached,       status: 409, note: "teto de 3 casos ABERTOS SIMULTANEOS por conta (BICHUS-21 criterio 8). Separado de `pet-already-lost`: um diz 'este pet ja esta perdido' e o outro 'voce ja tem tres animais perdidos'. A saida e diferente -- no primeiro a pessoa abre o caso que ja existe, no segundo ela precisa encerrar um. Alem de produto, e privacidade: a lista publica mostra bairro e data, e sem teto uma conta entregaria uma SERIE de pontos no tempo e no espaco da mesma pessoa" }
  - { slug: pet-limit-reached,             status: 409, note: "teto de pets DA CONTA" }
  - { slug: tag-limit-reached,             status: 409, note: "teto de tags ativas DO PET (ADR-0004). Separado de `pet-limit-reached` porque sao dois tetos diferentes: um app que decida por `type` tratava o teto de plaquinhas como limite de pets da conta, e oferecia a saida errada" }
  - { slug: contact-channel-unverified,    status: 409 }
  - { slug: pet-photo-missing,             status: 409 }
  - { slug: transfer-not-for-this-account, status: 409 }
  - { slug: transfer-already-in-progress,  status: 409, note: "BICHUS-66: este pet ja tem transferencia viva. O banco impoe (indice unico parcial `pet_transfers_uma_viva_por_pet`), e o tipo existe para a tela oferecer a SAIDA -- cancelar a que esta em andamento -- em vez de 'erro'. Separado de `pet-already-lost`, que e o OUTRO 409 da mesma operacao e tem saida oposta: ali a pessoa encerra o caso de perdido, aqui ela cancela um convite" }
  - { slug: transfer-already-effective,    status: 409, note: "BICHUS-66: a transferencia ja se consumou, e depois disso o caminho e transferir de volta, nao cancelar. E 409 e nao 410 de proposito: a rota EXIGE conta e o tutor tem direito de saber em que pe esta a propria transferencia -- o 410 sem distincao e da superficie PUBLICA do token, onde dizer qual dos tres casos ocorreu entregaria a um estranho o estado de uma transferencia alheia" }
  - { slug: conversation-closed,           status: 410, note: "BICHUS-41: nas rotas do achador sem conta, o token existiu e venceu. O corpo e FIXO: nao conta o desfecho do caso, pela mesma regra de `lost-case-closed`" }
  - { slug: lost-case-closed,              status: 410, note: "o link publico do caso (`/p/`, `/cartaz/`, destino do push) nao leva mais a caso aberto: encerrado, pet excluido, falecido ou arquivado, e token desconhecido. Os cinco sao a MESMA resposta de proposito -- distinguir contaria a um estranho o que aconteceu com o animal de outra pessoa, ou se aquele token existiu. Separado de `conversation-closed` porque a tela e outra: quem abre o cartaz nao esta numa conversa, e o site e o app decidem pelo `type`" }
  - { slug: finder-link-invalid,           status: 401, note: "BICHUS-41: token do achador ausente, malformado ou desconhecido, com o MESMO corpo. E 401 porque falta credencial que autentique, e nao `unauthenticated` porque este tipo manda entrar, e quem tem este link nao tem conta. Nunca `forbidden`: nao ha ninguem autenticado para ser recusado" }
  - { slug: tag-revoked,                   status: 410, note: "tag revogada e SEMPRE 410 com `next_action`, nunca 404 (ADR-0004)" }
  - { slug: tag-code-not-found,            status: 404 }
  - { slug: tag-code-malformed,            status: 400 }
  - { slug: unsupported-media-type,        status: 415, note: "quatro operacoes ja respondiam 415 e nenhum slug significava isso: o corpo do problema saia com um `type` fora desta lista fechada, que e exatamente o que ela existe para impedir" }
  - { slug: verification-token-expired,    status: 410, note: "token de USO UNICO (verificacao de e-mail, redefinicao de senha) expirado, ja usado ou inexistente. Separado de `token-expired`, que e 401: as duas operacoes declaram 410 e o slug de 401 nao podia responder por elas. Os tres casos sao a MESMA resposta de proposito -- distinguir contaria a um estranho se aquele token existiu" }
  - { slug: upload-not-received,           status: 409, note: "o cliente confirmou um envio cujos bytes nao chegaram ao armazenamento. Sem este estado, a foto nascia `processing` para sempre: um cartao de pet carregando eternamente, que ninguem sabe explicar" }
  - { slug: precondition-failed,           status: 412, note: "ADR-0027: `If-Match` nao corresponde a versao atual do recurso do backoffice. Outra pessoa salvou depois da leitura, e nada foi gravado" }
  - { slug: captcha-rejected,              status: 403, note: "ADR-0027 / D41: login administrativo sem X-Captcha-Token ou com nota abaixo de 0,5. So existe no login do backoffice; no login do tutor a ausencia do token nunca recusa (ADR-0020)" }
  - { slug: method-not-allowed,            status: 405, note: "ADR-0027 item 20.5: metodo que a rota administrativa nao aceita (o `GET` do \"nao fui eu\", que so existe por `POST`). Vem com `Allow`. So na superficie administrativa, e so com `X-Internal-Surface: admin`: sem ele a resposta continua 404 (D33)" }
  - { slug: weak-password,                 status: 422 }
  - { slug: image-too-small,               status: 422, note: "a imagem de catalogo declarada no pedido de envio e menor que a dimensao minima do proposito (600 x 600 no encontro da Rede, 800 x 800 no produto da Loja). Separado de `validation-failed`: o corpo esta bem formado, e a saida e outra -- escolher outra imagem, nao corrigir o formulario. A dimensao real continua conferida pelo worker nos bytes" }
  - { slug: precondition-required,         status: 428, note: "ADR-0027: escrita sobre recurso existente do backoffice sem `If-Match`" }
  - { slug: rate-limited,                  status: 429 }
  - { slug: internal,                      status: 500 }
  - { slug: postal-code-lookup-unavailable, status: 503, note: "BICHUS-9.2: os dois servicos publicos de CEP (ViaCEP e a reserva BrasilAPI) falharam ou nao responderam no prazo. Separado de `not-found`, que e 404, porque a saida da tela e a MESMA -- digitar o endereco a mao -- e a FRASE nao e: `not-found` diz 'este CEP nao existe' e este diz 'nao conseguimos consultar agora, tente de novo'. Nenhum dos dois impede salvar o cadastro" }

x-edge-limits:
  # A protecao GROSSA que a borda aplica (ADR-0016, item 4). Ela esta declarada
  # aqui, e nao so no `infra/caddy/Caddyfile`, porque numero que vive apenas num
  # arquivo de configuracao e numero sem dono: ninguem o revisa como contrato e
  # ninguem percebe quando ele muda.
  #
  # A esteira confere estes valores contra o Caddyfile e **reprova quando
  # diferirem**. Se o teste nao achar o bloco em um dos dois arquivos, ele falha
  # com o motivo — verificacao que nao consegue verificar precisa reprovar.
  #
  # TETO DE REQUISICOES POR IP NA BORDA: SO NO HOST ADMINISTRATIVO.
  #
  # Para os hosts do app a ausencia continua deliberada (ADR-0016 item 4): os
  # tetos por IP existem em `x-rate-limit`, aplicados no servico, que e onde eles
  # tem a dimensao certa. Declarar aqui um teto que a borda nao impoe seria pior
  # que nao ter: alguem leria a declaracao e pararia de procurar.
  #
  # A excecao e `admin.bichu.app` (ADR-0016 emenda 2, ADR-0027 item 11, D45 de
  # `docs/04-seguranca.md`): o login administrativo e a unica parede depois da
  # recusa de MFA e de restricao de rede, e uma camada que nao depende do codigo
  # da aplicacao cobre o modo de falhar que o repositorio ja teve (teto
  # declarado e nao aplicado ate 21/09). Imposto por imagem propria do Caddy
  # com o plugin de taxa (`infra/caddy/Dockerfile`), estouro com `429` e
  # `Retry-After`. `verificar_borda.py` confere cada numero contra a zona do
  # Caddyfile, reprova zona sem numero aqui e numero sem zona la, reprova
  # teto de taxa em qualquer outro host, e reprova chave desconhecida neste
  # bloco.
  max_request_body_bytes: 12582912   # 12 MiB. O maior upload aceito e de 10 MiB
                                     # (`UploadIntentInput.byte_size`); a folga
                                     # cobre envelope e cabecalho. O upload de
                                     # bytes nao passa por aqui: ele vai direto
                                     # para o armazenamento, assinado.
  max_request_header_bytes: 16384    # 16 KiB
  read_timeout_seconds: 30
  write_timeout_seconds: 30
  admin_login_requests_per_minute_per_ip: 10   # `POST /v1/admin/auth/login`,
                                               # so em `admin.bichu.app`
  admin_requests_per_minute_per_ip: 600        # `/v1/admin/*` inteiro, so em
                                               # `admin.bichu.app`

paths:

  # ----------------------------------------------------------------------
  # Identidade
  # ----------------------------------------------------------------------

  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      x-effects: [notifies, verifies_secret]
      summary: Cria a conta com e-mail e senha
      description: |
        A conta nasce **incompleta de proposito**: e-mail ainda nao verificado e
        telefone ausente. Exigir verificacao antes de cadastrar o pet derruba a
        conversao do unico cadastro que importa.

        Responde ja com o par de tokens, porque a intencao pendente do usuario
        precisa ser executada logo apos o cadastro.

        **A sessao que nasce aqui tem prazo, e quem escolhe o prazo e a
        pessoa.** `stay_signed_in` vale no cadastro pelo mesmo motivo que vale
        no login, e o ADR-0019 registra por que: este e um app de uso raro e
        urgencia maxima, e a conta recem-criada e justamente a que passa mais
        tempo sem ser aberta. Sem o campo aqui, a caixa "Continuar conectado
        neste aparelho" da tela `F1.1` existe, a pessoa a marca, e a escolha
        morre no aparelho.
      security: []
      parameters:
        - $ref: '#/components/parameters/CaptchaToken'
      x-rate-limit:
        - dimension: [ip]
          limit: 5
          window: 1h
          on_exceed: challenge
        - dimension: [ip_24]
          limit: 30
          window: 1h
          on_exceed: challenge
          note: "SEC-003, o desafio e verificado ANTES da consulta de unicidade"
        - dimension: [origin]
          counts: distinct_emails
          limit: 50
          window: 24h
          on_exceed: log_and_alert
          note: "acima de 200 a origem e bloqueada"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            examples:
              minimo:
                summary: O minimo aceito
                value: { email: "marina@exemplo.com.br", password: "girassol-de-agosto-9", display_name: "Marina", birth_date: "1991-03-22" }
              comAEscolhaDaCaixa:
                summary: A tela F1.1 inteira, com a caixa marcada e a versao dos termos
                value:
                  email: "marina@exemplo.com.br"
                  password: "girassol-de-agosto-9"
                  birth_date: "1991-03-22"
                  display_name: "Marina"
                  accepted_terms_version: "2026-09-01"
                  stay_signed_in: true
      responses:
        '201':
          description: Conta criada e sessao aberta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '409':
          description: |
            Ja existe conta com este e-mail.

            **Esta resposta revela que o endereco tem conta, e isso e
            deliberado** (SEC-003). O login e a recuperacao de senha respondem
            de forma opaca; o cadastro, nao. A decisao foi tomada e esta
            registrada: a experiencia esta fechada em cima do 409 ("Este e-mail
            ja tem conta no Bichu. Entrar com este e-mail"), e leva-lo a 202
            obrigaria a um e-mail do tipo "alguem tentou criar uma conta com o
            seu endereco", que e mais superficie e mais confusao para quem nem
            pediu nada.

            O que torna a decisao sustentavel sao tres coisas que o
            `x-rate-limit` acima declara, e **sem as tres o 409 e um oraculo de
            enumeracao**: o desafio reCAPTCHA v3 e verificado **antes** da
            consulta de unicidade, de modo que o 409 so existe para quem passou;
            ha teto de 30 por /24 por hora, contra pool de proxies; e e-mails
            distintos por origem em 24 h sao contados, com alerta acima de 50 e
            bloqueio da origem acima de 200.

            **O que o ADR-0020 muda aqui, e eu escrevo em vez de deixar
            implicito.** Como pedido sem `X-Captcha-Token` passa a ser atendido,
            a primeira das tres coisas acima deixa de valer para ele: quem omite
            o cabecalho chega ao 409 sem ter passado por desafio nenhum. Duas
            razoes pelas quais isso nao e uma protecao perdida, e sim uma que
            nunca existiu contra este atacante:

            - **o enumerador ja chamava esta operacao sem token**, porque nunca
              carregou a pagina que geraria um (secao 18.1). O desafio antes da
              consulta de unicidade so barrava quem carregava a pagina, isto e,
              gente legitima;
            - **as outras duas continuam inteiras**, e sao as que enxergam
              volume: 30 por /24 por hora, e e-mails distintos por origem em
              24 h com alerta em 50 e bloqueio em 200. E o pedido sem token
              perde o acesso a `challenge`: o estouro recusa com `Retry-After`,
              que e mais duro que desafiar, nao menos.

            Fica o risco residual de enumeracao de baixo volume, abaixo dos
            tetos, por quem omite o cabecalho. **O remedio ja esta escrito e e o
            gatilho abaixo**, e ele nao precisa de mecanismo novo.

            **Gatilho para inverter:** duas disparadas do detector nos primeiros
            30 dias e o cadastro passa a 202 sempre, com a experiencia mudando
            junto.

            `PATCH /v1/me` **nao aceita** `email`, e `POST /v1/me/email-change`
            responde 202 sempre: e a outra metade do SEC-003, e ela ja esta
            fechada.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                emailEmUso:
                  value:
                    type: https://dominio-a-definir.com.br/problems/email-already-registered
                    title: E-mail ja cadastrado
                    status: 409
                    detail: Existe uma conta com este e-mail. Entre em vez de criar outra.
                    correlation_id: 018f7c1e-7a2b-7c3d-9e4f-2b1a0c9d8e7f
        '422': { $ref: '#/components/responses/WeakPassword' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      x-effects: [verifies_secret]
      summary: Abre sessao
      description: |
        **Esta operacao nao pode ter porta unica.** O desafio antiabuso e um
        servico de terceiro, e ele falha para uma fatia previsivel de gente
        legitima: rede que bloqueia o dominio do provedor, aparelho sem os
        servicos do Google, extensao de privacidade. Se a ausencia do token
        recusasse, essa fatia **nao entraria nunca**, e entrar e o unico
        caminho para o tutor chegar ao pet perdido.

        O desenho esta no ADR-0020, e sao tres camadas:

        1. **Sem `X-Captcha-Token` o pedido e atendido**, avaliado pela senha,
           com a ausencia registrada na trilha como sinal de moderacao;
        2. **`challenge` degenera em `deny_429` com `Retry-After`** para o
           pedido sem token, porque desafiar quem nao tem como responder e
           recusar sem dizer quando voltar;
        3. **a segunda saida da tela e `POST /auth/password-reset`**, que e o
           link por e-mail que ja existe, e que a camada 1 torna alcancavel
           para a mesma pessoa. Nao ha operacao nova de entrada por link: o
           ADR-0020 diz por que ela foi recusada e qual gatilho a traz de volta.

        **Contas do painel e do app sao cadastros separados** (ADR-0027 item
        20, D42). Esta operacao so le as contas do app: a credencial de uma
        conta do painel recebe aqui o mesmo 401 de qualquer e-mail sem conta,
        porque para esta porta ela nao existe. O login do painel e
        `openAdminSession`.
      security: []
      parameters:
        - $ref: '#/components/parameters/CaptchaToken'
      x-rate-limit:
        - dimension: [email]
          limit: 5
          window: 1h
          on_exceed: challenge
          note: "sem X-Captcha-Token este estouro resolve como deny_429, nao como desafio"

        - dimension: [ip]
          limit: 10
          window: 1h
          on_exceed: challenge
        - dimension: [ip_24]
          limit: 100
          window: 1h
          on_exceed: log_and_alert
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sessao aberta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401':
          description: |
            Credencial invalida. A resposta e **identica** para e-mail
            inexistente e senha errada: nao revela se a conta existe.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                naoConfere:
                  value:
                    type: https://dominio-a-definir.com.br/problems/invalid-credentials
                    title: E-mail ou senha nao conferem
                    status: 401
                    correlation_id: 018f7c1e-7a2b-7c3d-9e4f-2b1a0c9d8e7f
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      x-effects: [verifies_secret]
      summary: Renova o par de tokens
      x-rate-limit:
        - dimension: [token_family]
          limit: 10
          window: 1m
          on_exceed: deny_429
          note: "a dimensao certa e a credencial, nao a rede: rotacao normal e uma a cada 15 min, e rajada na mesma familia e corrida ou reuso"
        - dimension: [ip]
          limit: 500
          window: 1h
          on_exceed: log_and_alert
          applies_to: invalid_attempts
          note: "APENAS tentativas invalidas, e APENAS alerta. A defesa real contra reuso e a deteccao por familia, que revoga; teto por IP aqui so acerta quem esta atras do mesmo CGNAT"
        - dimension: [ip]
          limit: 2000
          window: 1h
          on_exceed: log_and_alert
          note: "teto de observacao sobre renovacoes validas, alto de proposito e sem acao: centenas de assinantes moveis dividem o mesmo IPv4"

      x-no-challenge: true
      description: |
        Rotacao obrigatoria: cada refresh token vale **uma** vez e a resposta
        traz um novo. Apresentar um token ja consumido revoga a familia inteira
        e responde 401 — e assim que o roubo de token e detectado.

      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string, minLength: 20, maxLength: 512 }
      responses:
        '200':
          description: Novo par emitido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401':
          description: Token invalido, expirado ou reutilizado.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/logout:
    post:
      operationId: logout
      security:
        - bearerAuth: []
      tags: [auth]
      x-effects: []
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
      summary: Encerra a sessao e revoga a familia de refresh
      description: |
        **Sair deste aparelho e revogacao no servidor, sempre** (ADR-0002,
        emenda 1). O corpo e obrigatorio: sem o `refresh_token` nao ha o que
        revogar, e a operacao recusa com **400** em vez de responder 204.
        Enquanto o corpo era opcional, um cliente que seguisse este contrato ao
        pe da letra saia sem revogar nada e recebia 204 — sucesso
        indistinguivel do nada.

        O que esta operacao **nao** faz: ela nao empurra
        `users.sessions_invalid_before`. Essa coluna e por pessoa, e usa-la aqui
        derrubaria os outros aparelhos da mesma conta, tornando `logout`
        identico a "sair de todos os aparelhos" — que e OUTRO verbo, com outro
        mecanismo, e que ainda **nao tem operacao declarada neste contrato**
        (BICHUS-125). O alcance desta operacao e uma familia de refresh, quer
        dizer, um aparelho.

        **Janela residual declarada:** o token de acesso ja emitido continua
        sendo aceito ate o `exp`, no maximo 15 minutos, e nao pode ser renovado
        porque o refresh que o renovaria acabou de ser revogado. Fechar essa
        janela em menos de um segundo e trabalho de "sair de todos os
        aparelhos", que e o remedio de quem teve o aparelho levado.

        **Idempotente:** chamada com uma familia ja revogada, responde 204 e nao
        erra. O app que so consegue enviar a revogacao atrasada nao e punido por
        isso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  minLength: 20
                  maxLength: 512
                  description: |
                    O refresh da sessao **deste** aparelho. A familia dele e o
                    que morre. Token que nao pertence a conta do `bearerAuth`
                    nao revoga nada e recebe a mesma resposta de token
                    inexistente, de proposito: distinguir os dois contaria a
                    quem pergunta se aquele token existe.
      responses:
        '204': { description: Sessao encerrada e familia de refresh revogada. }
        '400':
          description: |
            Sem `refresh_token`, ou com um que nao pertence a esta conta. **E
            erro de proposito**: um logout que nao revogou nao pode se parecer
            com um que revogou.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                semRefresh:
                  summary: O corpo nao trouxe o refresh
                  value:
                    type: https://dominio-a-definir.com.br/problems/validation-failed
                    title: Confira os dados
                    status: 400
                    detail: Um ou mais campos nao passaram na validacao.
                    correlation_id: 018f7c1e-7a2b-7c3d-9e4f-2b1a0c9d8e7f
                    errors:
                      - field: refresh_token
                        code: required
                        message: Envie o refresh desta sessao para que ela seja revogada.
                refreshDesconhecido:
                  summary: Refresh inexistente ou de outra conta — resposta identica
                  value:
                    type: https://dominio-a-definir.com.br/problems/validation-failed
                    title: Confira os dados
                    status: 400
                    detail: Um ou mais campos nao passaram na validacao.
                    correlation_id: 018f7c1e-7a2b-7c3d-9e4f-2b1a0c9d8e7f
                    errors:
                      - field: refresh_token
                        code: unknown
                        message: Este refresh nao pertence a esta sessao.
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout-all:
    post:
      operationId: logoutAllDevices
      security:
        - bearerAuth: []
          reauth: []
      x-reauth-scope: session_revocation
      tags: [auth]
      x-effects: [notifies]
      x-rate-limit:
        - dimension: [account]
          limit: 10
          window: 1h
          on_exceed: deny_429
          note: "derruba a conta inteira: sem teto, um token roubado vira negacao de servico contra o titular"
      summary: Sai de todos os aparelhos e revoga todas as sessoes da conta
      description: |
        O outro verbo da emenda 1 do ADR-0002. `POST /auth/logout` encerra **este**
        aparelho revogando a familia de refresh apresentada; esta operacao encerra
        **todos**: empurra `users.sessions_invalid_before` e revoga **todas** as
        familias de refresh da conta.

        As duas metades sao necessarias e nenhuma substitui a outra. A barreira
        derruba os tokens de acesso em menos de um segundo; a revogacao das
        familias impede que um refresh copiado antes continue renovando. Sem a
        segunda, as linhas ficam vivas no banco ate vencerem por inatividade.

        E o remedio de quem perdeu o aparelho, e o unico que fecha a janela de ate
        15 minutos que o logout comum deixa aberta.

        **Reautenticacao:** esta operacao exige `X-Reauth-Token` no escopo
        `session_revocation`, e a exigencia esta aplicada em `src/` desde a
        BICHUS-48 -- o cabecalho foi declarado aqui junto com o codigo que o
        impoe, e nao antes dele. O escopo e proprio e nao reaproveita nenhum dos
        outros: um token aberto para excluir a conta nao derruba as sessoes, e
        vice-versa.

        O escopo tambem e o que mantem a operacao utilizavel por quem acabou de
        perder o aparelho. Derrubar as sessoes e a acao de REMEDIO, e ela e a
        unica da lista que a propria pessoa precisa conseguir fazer as pressas:
        os 5 minutos da janela valem a partir da senha conferida, e nao a partir
        do login.

        Idempotente: chamada com a conta ja sem sessao nenhuma, responde 204.
      responses:
        '204': { description: Todas as sessoes da conta foram encerradas. }
        '401': { $ref: '#/components/responses/ReauthRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/email-verification:
    post:
      operationId: requestEmailVerification
      tags: [auth]
      x-effects: [notifies]
      summary: Reenvia o e-mail de verificacao
      description: |
        Responde sempre 202, exista ou nao a conta.

        Leva `X-Captcha-Token` porque **dispara envio pago** (secao 18.5 de
        `docs/04-seguranca.md`). A ausencia do cabecalho nao recusa: vale a
        degradacao descrita em `info.description`.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/CaptchaToken'
      x-rate-limit:
        - dimension: [account]
          limit: 3
          window: 1h
          on_exceed: deny_429
        - dimension: [ip]
          limit: 10
          window: 1h
          on_exceed: challenge
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/email-verification/confirm:
    post:
      operationId: confirmEmailVerification
      tags: [auth]
      x-effects: [verifies_secret]
      x-rate-limit:
        - dimension: [ip]
          limit: 20
          window: 1h
          on_exceed: deny_429
          applies_to: invalid_attempts
          note: "o token tem 256 bits e nao e adivinhavel; o limite existe por defesa em profundidade e para nao servir de oraculo"
      summary: Confirma o e-mail pelo token recebido
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 20
                  maxLength: 256
                  description: |
                    256 bits de CSPRNG, guardado apenas como SHA-256, **uso
                    unico consumido atomicamente**, validade de **24 horas**
                    (SEC-005). A confirmacao e sempre `POST` disparado por um
                    botao numa pagina, nunca `GET` na URL do e-mail: varredor de
                    link de antivirus e previsualizacao de mensageiro consomem o
                    token antes da pessoa.
      responses:
        '200':
          description: |
            E-mail verificado. **Devolve sempre a sessao**, nos dois propositos
            do token (verificacao e troca de endereco), para que a intencao
            pendente execute em seguida: quem abre o link esta na pagina
            `/verificar-email`, que nao carrega token de acesso, e sem sessao
            aqui a pessoa confirma o e-mail e precisa entrar de novo.

            A redacao anterior dizia "devolve a sessao quando a requisicao veio
            sem token de acesso", e a condicional nao tinha como valer: o 200
            tem um corpo so. Ela sobreviveu ate 29/09/2026 com a implementacao
            devolvendo `Me` em vez de `SessionResponse`, medido em homologacao.

            A sessao nasce com `stay_signed_in` FALSO e nao conta como
            autenticacao por senha para o teto absoluto de 180 dias: a prova
            apresentada aqui e a posse da caixa de entrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '410': { $ref: '#/components/responses/TokenExpired' }

  /auth/password-reset:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      x-effects: [notifies]
      summary: Pede o e-mail de redefinicao de senha
      description: |
        Responde **sempre** 202 com o mesmo corpo, exista ou nao a conta. Pedir
        de novo invalida o token anterior.

        **Esta e a segunda saida de `C.2 Entrar`.** Quem nao consegue concluir o
        desafio antiabuso chega aqui pelo botao "Receber um link por e-mail", e
        o link o devolve a conta. A operacao so cumpre esse papel por causa da
        regra de degradacao de `info.description`: se a ausencia de
        `X-Captcha-Token` recusasse aqui tambem, a saida apontaria para a mesma
        porta fechada e nao seria saida nenhuma. O ADR-0020 registra a decisao
        e o que ela custa: a pessoa define uma senha nova e as sessoes ativas
        caem, que e o preco de nao criar uma segunda classe de credencial.
      security: []
      parameters:
        - $ref: '#/components/parameters/CaptchaToken'
      x-rate-limit:
        - dimension: [email]
          limit: 3
          window: 1h
          on_exceed: deny_429
        - dimension: [ip]
          limit: 10
          window: 1h
          on_exceed: challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [auth]
      x-effects: [verifies_secret, notifies, irreversible_write]
      x-rate-limit:
        - dimension: [ip]
          limit: 20
          window: 1h
          on_exceed: deny_429
          applies_to: invalid_attempts
          note: "o token tem 256 bits e nao e adivinhavel; o limite existe por defesa em profundidade e para nao servir de oraculo"
      summary: Define a nova senha pelo token
      description: |
        Revoga todas as sessoes ativas da conta.

        So alcanca contas do app. A conta do painel e outro cadastro, e a senha
        dela so e definida pelo comando `conta-admin` no servidor (ADR-0027
        item 20.4, D61).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token:
                  type: string
                  minLength: 20
                  maxLength: 256
                  description: |
                    256 bits de CSPRNG, guardado apenas como SHA-256, **uso
                    unico consumido atomicamente**, validade de **30 minutos**
                    (SEC-005). Sempre `POST`, nunca `GET` na URL do e-mail.
                new_password: { $ref: '#/components/schemas/Password' }
      responses:
        '204':
          description: |
            Senha alterada. **Todas as sessoes sao invalidadas em menos de um
            segundo** (SEC-006), nao em 15 minutos, e um e-mail de aviso vai
            para o endereco da conta: e o unico canal pelo qual o dono legitimo
            descobre uma tomada de conta.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '410': { $ref: '#/components/responses/TokenExpired' }
        '422': { $ref: '#/components/responses/WeakPassword' }

  /auth/reauth:
    post:
      operationId: reauthenticate
      security:
        - bearerAuth: []
      tags: [auth]
      x-effects: [verifies_secret]
      summary: Reautentica com a senha e abre a janela de operacao destrutiva
      description: |
        As operacoes destrutivas do produto exigem a senha de novo, e **nao a
        pedem cada uma do seu jeito**. Esta e a unica operacao do sistema que
        verifica a senha de um usuario ja autenticado, e devolve um
        `reauth_token` de **5 minutos** que as outras aceitam no cabecalho
        `X-Reauth-Token`.

        Quem exige o cabecalho esta declarado em `x-reauth-scope`, operacao por
        operacao, e o valor de `scope` aqui precisa ser o mesmo da operacao que
        vai receber o token. Sao seis, e a lista e a da secao 7.5 de
        `docs/04-seguranca.md` acrescida da revogacao de sessao:
        `account_deletion`, `email_change`, `data_export`, `pet_transfer`,
        `tag_revocation` e `session_revocation`. **Trocar a senha fica de fora**,
        e a ausencia e deliberada: `PUT /auth/password` ja conferia
        `current_password` no proprio corpo antes desta operacao existir, entao
        exigir as duas coisas pediria a mesma senha duas vezes na mesma
        requisicao. A divergencia contra a secao 7.5, que lista trocar senha
        entre as seis, esta registrada na BICHUS-48.

        Concentrar aqui tem tres consequencias, e as tres sao o motivo do
        desenho: a senha trafega para **um** endpoint em vez de seis; o limite
        contra forca bruta existe em **um** lugar; e `DELETE /me` nao precisa de
        corpo, o que evita a requisicao com corpo em DELETE que proxy e
        biblioteca tratam de formas diferentes.

        O token e opaco, guardado como hash, preso ao usuario e a sessao, e
        invalidado por troca de senha, logout e `sessions_invalid_before`.
      x-rate-limit:
        - dimension: [account]
          limit: 10
          window: 1h
          on_exceed: deny_429
        - dimension: [account]
          limit: 5
          window: 1h
          on_exceed: deny_429
          applies_to: invalid_attempts
          note: "senha errada cinco vezes fecha a janela destrutiva por uma hora, sem derrubar a sessao normal"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, scope]
              properties:
                password: { type: string, maxLength: 256 }
                scope:
                  type: string
                  enum:
                    - account_deletion
                    - email_change
                    - data_export
                    - pet_transfer
                    - tag_revocation
                    - session_revocation
                  description: |
                    A finalidade unica deste token. Apresenta-lo em operacao de
                    outro escopo responde 401, e nao 403: a janela para aquela
                    finalidade simplesmente nao foi aberta.

                    `email_change` estava faltando aqui enquanto
                    `POST /me/email-change` ja declarava
                    `x-reauth-scope: email_change`: nenhum token podia ser
                    emitido para aquela operacao, entao ela era inalcancavel por
                    contrato. `session_revocation` entra com a exigencia nova de
                    `POST /auth/logout-all`.
      responses:
        '200':
          description: Janela aberta.
          content:
            application/json:
              schema:
                type: object
                required: [reauth_token, expires_in]
                properties:
                  reauth_token: { type: string }
                  expires_in: { type: integer, example: 300 }
                  scope: { type: string }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password:
    put:
      operationId: changePassword
      security:
        - bearerAuth: []
      tags: [auth]
      x-effects: [verifies_secret, notifies]
      x-rate-limit:
        - dimension: [account]
          limit: 10
          window: 1h
          on_exceed: deny_429
          note: "verifica `current_password`: sem limite, um token de acesso roubado vira oraculo de senha"
        - dimension: [account]
          limit: 5
          window: 1h
          on_exceed: deny_429
          applies_to: invalid_attempts
      summary: Troca a senha com a senha atual
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, maxLength: 256 }
                new_password: { $ref: '#/components/schemas/Password' }
      responses:
        '204': { description: Senha alterada. Demais sessoes revogadas. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/WeakPassword' }

  # ----------------------------------------------------------------------
  # Perfil, aparelhos, localizacao
  # ----------------------------------------------------------------------

  /me:
    get:
      operationId: getMe
      security:
        - bearerAuth: []
      tags: [me]
      x-effects: []
      summary: Perfil do usuario autenticado
      description: |
        `pending_profile_fields` alimenta o aviso persistente de cadastro
        incompleto. `can_open_lost_case` resume, em um booleano, a regra de
        bloqueio: so abre caso quem tem um canal de contato verificado.
      responses:
        '200':
          description: Perfil.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      operationId: updateMe
      security:
        - bearerAuth: []
      tags: [me]
      x-effects: []
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
      summary: Completa ou corrige os dados do perfil
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeUpdate' }
      responses:
        '200':
          description: Perfil atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: deleteMyAccount
      tags: [me]
      x-effects: [irreversible_write, verifies_secret, notifies]
      x-rate-limit:
        - dimension: [account]
          limit: 3
          window: 24h
          on_exceed: deny_429
      summary: Pede a exclusao da conta (LGPD, art. 18)
      description: |
        Exclusao logica imediata, expurgo definitivo em 30 dias. Casos abertos
        sao encerrados e as tags, revogadas.
      security:
        - bearerAuth: []
          reauth: []
      x-reauth-scope: account_deletion
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/email-change:
    post:
      operationId: requestEmailChange
      security:
        - bearerAuth: []
          reauth: []
      x-reauth-scope: email_change
      tags: [me]
      x-effects: [notifies]
      summary: Pede a troca do e-mail da conta
      description: |
        **Responde sempre 202**, esteja o novo endereco em uso ou nao (SEC-003):
        aceitar a troca em `PATCH /me` faria a resposta revelar se um endereco ja
        tem conta, anulando a opacidade que o login e a recuperacao mantem.

        A verificacao vai para o **endereco novo**; o e-mail da conta so muda
        quando ela e confirmada. Um aviso vai tambem para o endereco antigo.
      x-rate-limit:
        - dimension: [account]
          limit: 5
          window: 24h
          on_exceed: deny_429
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_email]
              properties:
                new_email: { type: string, format: email, maxLength: 254 }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /me/data-export:
    post:
      operationId: requestDataExport
      tags: [me]
      x-effects: [verifies_secret, human_work]
      summary: Pede a copia dos dados pessoais (LGPD, art. 18, V)
      x-rate-limit:
        - dimension: [account]
          limit: 1
          window: 24h
          on_exceed: deny_429
      security:
        - bearerAuth: []
          reauth: []
      x-reauth-scope: data_export
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '401': { $ref: '#/components/responses/ReauthRequired' }

  /me/devices:
    get:
      operationId: listDevices
      security:
        - bearerAuth: []
      tags: [me]
      x-effects: []
      summary: Aparelhos registrados para push
      responses:
        '200':
          description: Lista de aparelhos.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: registerDevice
      security:
        - bearerAuth: []
      tags: [me]
      x-effects: []
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
      summary: Registra ou atualiza o token de push do aparelho
      description: |
        Idempotente por `push_token`. Quando o usuario negou a permissao, o
        aparelho e registrado assim mesmo com `push_permission: denied` — e
        esse registro que permite contar quantos tutores sao de fato
        alcancaveis, que e a metrica que decide se o alerta toca em alguem.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceRegistration' }
      responses:
        '200':
          description: Aparelho registrado ou atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/devices/{deviceId}:
    delete:
      operationId: deleteDevice
      security:
        - bearerAuth: []
      tags: [me]
      x-effects: []
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
      summary: Remove o aparelho (usado no logout)
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '204': { description: Removido. }
        # `deviceId` e `format: uuid`, entao a borda pode recusar o parametro --
        # e `vigiarParametrosDasRotas` derruba a SUBIDA de uma operacao que pode
        # recusar sem declarar 400. Erro e contrato tambem: responder um status
        # que a especificacao nao promete e a mesma divergencia que nao validar,
        # na direcao oposta. Malformado responde 400 e bem formado que nao e seu
        # responde 404, pelo argumento escrito em
        # src/shared/http/validacao-de-parametros.ts.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/location:
    get:
      operationId: getMyLocation
      security:
        - bearerAuth: []
      tags: [me]
      x-effects: []
      summary: Ultima localizacao de referencia conhecida
      responses:
        '200':
          description: |
            Localizacao quantizada. `null` quando nunca foi informada ou quando
            ja expirou.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserLocation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: putMyLocation
      security:
        - bearerAuth: []
      tags: [me]
      x-effects: []
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
      summary: Informa a localizacao de referencia
      description: |
        O servidor **quantiza para uma grade de cerca de 100 m** antes de
        gravar e nao guarda historico: existe uma linha por usuario, sempre a
        ultima. Precisao maior nao melhora um raio de 5 km e so aumenta o dano
        de um vazamento.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserLocationInput' }
      responses:
        '200':
          description: Localizacao gravada (ja quantizada na resposta).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserLocation' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: deleteMyLocation
      security:
        - bearerAuth: []
      tags: [me]
      x-effects: []
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
      summary: Apaga a localizacao de referencia
      description: Deixa de receber alerta geolocalizado a partir da proxima consulta.
      responses:
        '204': { description: Apagada. }
        '401': { $ref: '#/components/responses/Unauthorized' }

