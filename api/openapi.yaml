      x-rate-limit:
        - dimension: [ip]
          limit: 600
          window: 1h
          on_exceed: log_and_alert
          note: "NUNCA challenge nem deny_429: quem busca este arquivo e o sistema operacional ou uma biblioteca, que nao resolve desafio e nao repete depois de um 429. Recusar aqui quebra a verificacao de dominio e a validacao de token em silencio"
      summary: Documento de descoberta OIDC
      description: |
        Existe desde o MVP, ainda que o emissor seja o proprio backend
        (ADR-0003). E o que faz a chegada futura do Keycloak ser troca de
        `issuer` no cliente, em vez de mudanca de app publicado: o app aprende
        a descobrir, nao a presumir.

        Cacheavel por 1 hora.
      security: []
      responses:
        '200':
          description: Documento de descoberta.
          headers:
            Cache-Control: { schema: { type: string }, example: 'public, max-age=3600' }
          content:
            application/json:
              schema:
                type: object
                required: [issuer, jwks_uri]
                properties:
                  issuer: { type: string, format: uri }
                  jwks_uri: { type: string, format: uri }
                  token_endpoint: { type: string, format: uri }
                  id_token_signing_alg_values_supported:
                    type: array
                    items: { type: string }
                    example: [RS256]
                  grant_types_supported:
                    type: array
                    items: { type: string }
                    example: [password, refresh_token]
                  response_types_supported:
                    type: array
                    items: { type: string }

  /.well-known/jwks.json:
    servers:
      - url: https://api.{dominio}
        variables: { dominio: { default: API_BASE_URL } }
    get:
      operationId: jwks
      tags: [ops]
      x-effects: []
      x-rate-limit:
        - dimension: [ip]
          limit: 600
          window: 1h
          on_exceed: log_and_alert
          note: "NUNCA challenge nem deny_429: quem busca este arquivo e o sistema operacional ou uma biblioteca, que nao resolve desafio e nao repete depois de um 429. Recusar aqui quebra a verificacao de dominio e a validacao de token em silencio"
      summary: Chaves publicas de verificacao do token
      description: |
        **Sempre duas chaves**, a ativa e a de rotacao, cada uma com `kid`
        (ADR-0002). Publicar so a ativa impede rotacionar sem derrubar sessao: o
        consumidor precisa conhecer a proxima antes de ela comecar a assinar.

        Contem apenas material publico. Cacheavel por 1 hora, e quem consome
        deve rebuscar quando encontrar um `kid` desconhecido, em vez de recusar.
      security: []
      responses:
        '200':
          description: Conjunto de chaves.
          headers:
            Cache-Control: { schema: { type: string }, example: 'public, max-age=3600' }
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    minItems: 2
                    items:
                      type: object
                      required: [kty, kid, use, alg, n, e]
                      properties:
                        kty: { type: string, example: RSA }
                        kid: { type: string }
                        use: { type: string, example: sig }
                        alg: { type: string, example: RS256 }
                        n: { type: string }
                        e: { type: string }

  /health:
    get:
      operationId: health
      tags: [ops]
      x-effects: []
      summary: Sonda de saude
      description: |
        **Unica operacao publica sem `x-rate-limit`, e a ausencia e deliberada:**
        quem chama e a sonda do balanceador e do orquestrador. Limitar a sonda
        faz o servico ser tirado de rotacao justamente sob carga, que e quando
        ele precisa continuar respondendo. A protecao aqui e nao expor nada:
        a resposta nao traz versao de dependencia, nome de host, string de
        conexao nem contagem de registro.
      security: []
      responses:
        '200':
          description: Saudavel.
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  version: { type: string }
                  checks:
                    type: object
                    additionalProperties: { type: string, enum: [ok, fail] }
        '503':
          description: Nao saudavel.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

# ==========================================================================
# Componentes
# ==========================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token JWT assinado em RS256, 15 minutos de validade. `sub` e o
        UUID interno do usuario. A chave publica vem de
        `/.well-known/jwks.json`, selecionada pelo `kid` do cabecalho.
    tagCode:
      type: apiKey
      in: path
      name: code
      description: |
        A posse do codigo impresso na tag e a credencial. Nao exige conta e nao
        concede nada alem do pet daquele codigo.
    reauth:
      type: apiKey
      in: header
      name: X-Reauth-Token
      description: |
        Segunda credencial das operacoes destrutivas, obtida em
        `POST /v1/auth/reauth`. Tres propriedades, e sem as tres os 5 minutos
        nao valem nada:

        - **uso unico**: consumido na primeira operacao que o apresenta;
        - **escopo por operacao**: emitido para **uma** finalidade declarada, e
          recusado nas demais. Sem isso, o tutor que reautentica para revogar uma
          plaquinha emite, sem saber, uma autorizacao para excluir a conta dele;
        - **vinculo com a sessao**: preso ao `jti` do token de acesso que o
          pediu, e invalidado por logout, troca de senha e
          `sessions_invalid_before`.

        A finalidade exigida por cada operacao esta em `x-reauth-scope`, porque
        requisito de seguranca de esquema `apiKey` nao aceita escopo na propria
        lista de `security`.
    webhookSignature:
      type: apiKey
      in: header
      name: X-Postmark-Signature
      description: |
        Assinatura do provedor, verificada com `MAIL_WEBHOOK_SECRET` em
        comparacao de tempo constante. Nao e credencial de usuario.
    finderToken:
      type: http
      scheme: bearer
      description: |
        Token opaco de 256 bits entregue a quem avisou o tutor sem ter conta.
        Escopo de **uma** conversa, valido enquanto o caso estiver aberto mais
        30 dias. Nao e JWT e nao carrega dado pessoal.

  parameters:
    PetId:
      name: petId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PhotoId:
      name: photoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TagId:
      name: tagId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CaseId:
      name: caseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CandidateId:
      name: candidateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FoundReportId:
      name: foundReportId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TagCode:
      name: code
      in: path
      required: true
      description: |
        Codigo da tag. **A forma canonica** e Crockford Base32, **26
        caracteres**, maiusculas, sem separador: e ela que e hasheada e
        guardada. A forma **impressa** e a mesma em grupos de quatro separados
        por hifen, porque digito agrupado se le e se confere melhor.

        **O que o servidor aceita na entrada e mais largo do que a forma
        canonica**, porque existe um caminho em que a pessoa digita em vez de
        escanear: sem sinal, QR danificado, impressao ruim, ou lendo da URL
        legivel impressa na plaquinha. A normalizacao e parte do contrato, nao
        decisao de quem implementa, e a ordem dos passos importa:

        1. remover tudo que nao for letra ou digito (hifen **em qualquer
           posicao**, espaco, ponto);
        2. passar para maiusculas;
        3. aplicar as substituicoes do proprio Crockford: **`I` e `L` viram
           `1`**, **`O` vira `0`**;
        4. o resultado precisa ter exatamente 26 caracteres, todos do alfabeto
           `0-9 A-H J K M N P-T V-Z` (sem `I`, `L`, `O`, `U`);
        5. buscar pelo SHA-256 desse resultado.

        A mesma normalizacao e aplicada na emissao, entao ela e idempotente: o
        codigo emitido normaliza para ele mesmo.

        **Nenhuma outra substituicao e aceita, e isso e decisao, nao omissao.**
        Confusoes de leitura como `5`/`S`, `8`/`B` e `2`/`Z` **nao** sao
        corrigidas: o alfabeto de Crockford foi desenhado justamente para
        excluir os pares ambiguos, e acrescentar substituicao mapearia dois
        codigos validos e distintos um no outro. O resultado nao seria "nao
        encontrado": seria **abrir a pagina do pet errado**, o que e pior do que
        pedir para digitar de novo. `U` nao tem substituicao e e caractere
        invalido.
      schema:
        type: string
        pattern: '^[0-9A-Za-z][0-9A-Za-z-]{25,39}$'
      example: 7K2F-9QJB-3XR0-5TWD-8MNC-VH
    ShareToken:
      name: shareToken
      in: path
      required: true
      description: Token opaco do caso, o mesmo que o link compartilhavel carrega.
      schema: { type: string, minLength: 20, maxLength: 128 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 256 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Repetir a mesma chave em 24 h devolve a resposta original.
      schema: { type: string, format: uuid }
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Obrigatorio. A pagina publica reenvia por fila offline e o tutor nao
        pode receber o mesmo aviso varias vezes.
      schema: { type: string, format: uuid }

  responses:
    Accepted:
      description: Pedido aceito para processamento.
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status: { type: string, enum: [accepted] }
              correlation_id: { type: string, format: uuid }
    ReauthRequired:
      description: |
        Operacao destrutiva sem janela de reautenticacao aberta, ou com janela
        expirada. **Nao e falha de sessao**: a sessao continua valida, e a
        interface pede a senha sem perder o contexto.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            precisaDaSenha:
              value:
                type: https://dominio-a-definir.com.br/problems/reauthentication-required
                title: Confirme sua senha
                status: 401
                detail: Esta acao nao pode ser desfeita, entao pedimos a senha de novo.
                correlation_id: 018f7c1e-7a2b-7c3d-9e4f-2b1a0c9d8e7f
    Unauthorized:
      description: Sem token valido.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: |
        Autenticado, mas sem permissao sobre este recurso. Para recurso de
        outro tutor a API responde **404**, nao 403: confirmar a existencia de
        um pet alheio ja e vazamento.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Nao existe, ou nao e visivel para quem perguntou.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: Corpo ou parametro invalido.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            campoInvalido:
              value:
                type: https://dominio-a-definir.com.br/problems/validation-failed
                title: Dados invalidos
                status: 400
                detail: Um ou mais campos nao passaram na validacao.
                correlation_id: 018f7c1e-7a2b-7c3d-9e4f-2b1a0c9d8e7f
                errors:
                  - field: species
                    code: enum
                    message: Valor precisa ser dog, cat ou other.
    WeakPassword:
      description: |
        Senha fora da politica. `errors[].code` diz qual regra falhou, para que
        a tela marque o requisito especifico em vez de repetir a lista inteira.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TokenExpired:
      description: Token de uso unico expirado, ja usado ou invalido.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMedia:
      description: Tipo de arquivo nao aceito.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Limite de chamadas estourado.
      headers:
        Retry-After: { schema: { type: integer }, description: Segundos. }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PetLimitReached:
      description: Teto de 20 pets por conta.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    LostCaseBlocked:
      description: |
        Bloqueio de abertura de caso. Dois tipos possiveis, e a interface tem
        texto diferente para cada um.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            contatoNaoVerificado:
              value:
                type: https://dominio-a-definir.com.br/problems/contact-channel-unverified
                title: Confirme seu e-mail antes de avisar
                status: 409
                detail: Os tutores por perto vao receber a foto. Se alguem encontrar, e pelo seu e-mail que a gente avisa.
                correlation_id: 018f7c1e-7a2b-7c3d-9e4f-2b1a0c9d8e7f
            petSemFoto:
              value:
                type: https://dominio-a-definir.com.br/problems/pet-photo-missing
                title: A foto do pet nao subiu
                status: 409
                detail: Sem foto, ninguem reconhece o animal na rua.
                correlation_id: 018f7c1e-7a2b-7c3d-9e4f-2b1a0c9d8e7f

  schemas:

    Problem:
      type: object
      description: RFC 9457. O cliente decide por `type`, nunca pelo texto.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        correlation_id:
          type: string
          format: uuid
          description: Mesmo identificador propagado no log e no trace.
        next_action:
          type: string
          description: Caminho alternativo, quando existe um.
          enum: [register_stray_found_report, verify_email, upload_pet_photo, sign_in]
        errors:
          type: array
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }

    Password:
      type: string
      minLength: 10
      maxLength: 256
      description: |
        Politica alinhada ao NIST SP 800-63B: minimo de 10 caracteres, sem
        exigencia de composicao, sem expiracao periodica, e recusa por lista de
        senhas vazadas e por semelhanca com o e-mail e o nome. Regra de
        composicao empurra o usuario para `Senha@123`, que e pior.

    Slug:
      type: string
      pattern: '^[a-z0-9](?:[a-z0-9-]{1,28}[a-z0-9])$'
      minLength: 3
      maxLength: 30

    Species:
      type: string
      enum: [dog, cat, other]

    PetSize:
      type: string
      enum: [P, M, G, GG]

    Sex:
      type: string
      enum: [male, female, unknown]

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { $ref: '#/components/schemas/Password' }
        display_name: { type: string, maxLength: 80 }
        accepted_terms_version: { type: string, maxLength: 20 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, maxLength: 256 }
        stay_signed_in:
          type: boolean
          default: false
          description: |
            Escolha explicita, desmarcada por padrao. Falso: refresh de 7 dias.
            Verdadeiro: 90 dias, sempre com rotacao.

    SessionResponse:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, example: 900 }
        refresh_token: { type: string }
        refresh_expires_in: { type: integer, example: 604800 }
        user: { $ref: '#/components/schemas/Me' }

    Me:
      type: object
      required: [id, email, email_verified, pending_profile_fields, can_open_lost_case]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        email_verified: { type: boolean }
        pending_email:
          type: string
          format: email
          nullable: true
          description: |
            Endereco novo aguardando confirmacao, quando existe troca em curso.
            O e-mail da conta so muda quando a verificacao e concluida.
        email_deliverable:
          type: boolean
          default: true
          description: |
            Falso apos devolucao definitiva do provedor. Alimenta o aviso
            persistente com a oferta de corrigir o endereco: sem isto, o tutor
            de e-mail invalido nunca descobre que ninguem consegue avisa-lo.
        display_name: { type: string, nullable: true }
        phone_e164: { type: string, nullable: true, example: '+5511999998888' }
        phone_verified: { type: boolean, default: false }
        reference_area:
          type: object
          nullable: true
          properties:
            postal_code: { type: string, nullable: true, example: '05435-000' }
            neighborhood: { type: string, nullable: true }
            city: { type: string, nullable: true }
            state: { type: string, nullable: true, maxLength: 2 }
        pending_profile_fields:
          type: array
          description: Alimenta o aviso persistente de cadastro incompleto.
          items:
            type: string
            enum: [email_verification, phone, display_name, reference_area]
        can_open_lost_case:
          type: boolean
          description: Falso quando nenhum canal de contato esta verificado.
        created_at: { type: string, format: date-time }

    MeUpdate:
      type: object
      description: |
        **Nao aceita `email`** (SEC-003): trocar o e-mail e operacao propria,
        assincrona, em `POST /v1/me/email-change`. Aceitar aqui faria a
        resposta revelar se um endereco ja tem conta.
      properties:
        display_name: { type: string, maxLength: 80 }
        phone_e164: { type: string, pattern: '^\+55\d{10,11}$' }
        reference_area:
          type: object
          properties:
            postal_code: { type: string, pattern: '^\d{5}-?\d{3}$' }
            neighborhood: { type: string, maxLength: 80 }
            city: { type: string, maxLength: 80 }
            state: { type: string, minLength: 2, maxLength: 2 }

    Device:
      type: object
      required: [id, platform, push_permission]
      properties:
        id: { type: string, format: uuid }
        platform: { type: string, enum: [android, ios] }
        push_permission: { type: string, enum: [granted, denied, not_asked] }
        app_version: { type: string }
        last_seen_at: { type: string, format: date-time }

    DeviceRegistration:
      type: object
      required: [platform, push_permission]
      properties:
        platform: { type: string, enum: [android, ios] }
        push_token: { type: string, maxLength: 512, nullable: true }
        push_permission: { type: string, enum: [granted, denied, not_asked] }
        app_version: { type: string, maxLength: 20 }
        os_version: { type: string, maxLength: 20 }

    UserLocationInput:
      type: object
      required: [lat, lon, source]
      properties:
        lat: { type: number, format: double, minimum: -34, maximum: 6 }
        lon: { type: number, format: double, minimum: -74, maximum: -32 }
        source:
          type: string
          enum: [device_gps, map_pin]
          description: |
            `map_pin` e o toque unico no mapa durante o cadastro. Existe para
            que quem nega a permissao de localizacao continue no raio do
            alerta, que e o que sustenta a metrica de alcance.

    UserLocation:
      type: object
      nullable: true
      required: [lat, lon, precision_m, expires_at]
      properties:
        lat: { type: number, format: double }
        lon: { type: number, format: double }
        precision_m:
          type: integer
          example: 100
          description: Grade de quantizacao aplicada antes de gravar.
        source: { type: string, enum: [device_gps, map_pin] }
        captured_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          description: 30 dias apos a captura. Expirada, sai do raio de alerta.

    PetInput:
      type: object
      required: [name, species, size]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        species: { $ref: '#/components/schemas/Species' }
        breed_code:
          type: string
          maxLength: 40
          description: Codigo vindo de `reference-data`, nunca texto livre.
        size: { $ref: '#/components/schemas/PetSize' }
        primary_color_code: { type: string, maxLength: 30 }
        secondary_color_code: { type: string, maxLength: 30 }
        sex: { $ref: '#/components/schemas/Sex' }
        neutered: { type: boolean, nullable: true }
        birth_date_approx: { type: string, format: date, nullable: true }
        distinctive_marks: { type: string, maxLength: 500 }
        care_notes:
          type: string
          maxLength: 280
          nullable: true
          description: |
            **O que alguem que acabou de encontrar o animal precisa saber nos
            proximos cinco minutos**, em uma frase. Exemplos do que serve:
            "toma remedio de uso continuo", "e medroso, nao corra atras",
            "nao consegue subir escada", "reage mal a outros caes".

            O limite de 280 caracteres e desenho, nao economia: o destinatario
            le de pe, com uma mao, com o animal se mexendo. Um paragrafo nao e
            lido, e um campo que aceita paragrafo convida a escrever um.

            **Este campo e publico por definicao**, e nao tem interruptor de
            visibilidade. Ele existe para uma unica finalidade, que e aparecer
            para quem encontrou o pet; guardado sem aparecer, ele seria dado
            retido sem proposito. Quem nao quer publicar **deixa em branco**,
            e essa e a forma de nao publicar.

            **Onde aparece:** na pagina do achador (`/t/{code}`), na pagina
            publica do caso e no cartaz. **Onde nunca aparece:** no perfil
            publico por `@slug`, que e indexavel por buscador e permanente.
            Mostrar a quem esta com o animal na mao que ele toma medicacao e
            util; deixar isso indexado para sempre e outra coisa.

            **Conteudo esperado:** manejo e saude do animal. O servidor aplica a
            **mesma redacao das mensagens do canal mediado** (telefone, e-mail,
            endereco e link externo) antes de gravar, e devolve o que retirou em
            `care_notes_redactions`, para a tela explicar. Nome de clinica,
            nome do tutor e endereco nao pertencem a este campo: o contato com o
            tutor e mediado, e o campo nao e um atalho para furar essa regra.
        microchip_number: { type: string, maxLength: 20, nullable: true }
        sinpatinhas_id:
          type: string
          maxLength: 40
          nullable: true
          description: |
            RG Animal do registro federal. Campo livre e **sem validacao
            automatica**: o SinPatinhas nao tem API publica.

    Pet:
      allOf:
        - $ref: '#/components/schemas/PetInput'
        - type: object
          required: [id, status, created_at]
          properties:
            id: { type: string, format: uuid }
            status:
              type: string
              enum: [active, lost, deceased, archived]
            slug: { type: string, nullable: true }
            public_profile_enabled: { type: boolean, default: false }
            care_notes_redactions:
              type: array
              description: |
                O que a redacao retirou de `care_notes` ao gravar. Vazio quando
                nada foi retirado. Existe para a tela dizer o que aconteceu, em
                vez de o tutor achar que o texto sumiu sozinho.
              items:
                type: object
                properties:
                  kind: { type: string, enum: [phone, email, address, external_link] }
                  hint: { type: string }
            photos:
              type: array
              items: { $ref: '#/components/schemas/PetPhoto' }
            active_tag_count: { type: integer }
            open_case_id: { type: string, format: uuid, nullable: true }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    PetPhoto:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [processing, ready, rejected]
          description: |
            `rejected` quando os bytes reais nao sao imagem aceita. O tipo
            declarado no upload nunca e a fonte da verdade.
        is_primary: { type: boolean }
        thumb_url: { type: string, format: uri, nullable: true }
        card_url:
          type: string
          format: uri
          nullable: true
          description: |
            Derivada de ate 1024 px, sem EXIF, servida pelo dominio de midia.
            **E a unica derivada que a rota publica mostra.** O arquivo
            original nunca sai do armazenamento privado.
        created_at: { type: string, format: date-time }

    UploadIntentInput:
      type: object
      required: [content_type, byte_size]
      properties:
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/heic, image/webp]
        byte_size: { type: integer, minimum: 1, maximum: 10485760 }

    UploadIntent:
      type: object
      required: [upload_id, method, url, expires_at]
      properties:
        upload_id: { type: string, format: uuid }
        method:
          type: string
          enum: [POST, PUT]
          default: POST
          description: |
            A forma da requisicao de upload. Existe para que a troca do
            provedor de armazenamento seja configuracao: nem todo provedor
            compativel com S3 aceita politica de POST.
        url: { type: string, format: uri }
        fields:
          type: object
          additionalProperties: { type: string }
          description: Campos do formulario assinado. Presente quando `method` e POST.
        headers:
          type: object
          additionalProperties: { type: string }
          description: |
            Cabecalhos assinados que o cliente precisa enviar sem alterar
            (inclusive `Content-Type` e `Content-Length`). Presente quando
            `method` e PUT.
        expires_at: { type: string, format: date-time }
        max_bytes: { type: integer }

    PetTag:
      type: object
      required: [id, status, code_suffix, created_at]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [active, revoked] }
        code_suffix:
          type: string
          maxLength: 4
          description: Quatro ultimos caracteres, para identificar a plaquinha.
        label: { type: string, nullable: true, maxLength: 40 }
        scan_count: { type: integer }
        last_scanned_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        revocation_reason: { $ref: '#/components/schemas/TagRevocationReason' }
        created_at: { type: string, format: date-time }

    PetTagIssued:
      allOf:
        - $ref: '#/components/schemas/PetTag'
        - type: object
          required: [code, url]
          properties:
            code:
              type: string
              description: |
                **Unica resposta que traz o codigo em claro.** O cliente nao
                persiste este valor.
            url: { type: string, format: uri }
            qr_png_url: { type: string, format: uri }

    TagRevocationReason:
      type: string
      nullable: true
      enum: [lost_tag, suspected_clone, owner_request, pet_transferred, pet_deceased, pet_deleted]

    TagResolution:
      type: object
      required: [viewer, pet]
      properties:
        viewer:
          type: string
          enum: [owner, authenticated_other, anonymous]
          description: |
            `owner` faz o app abrir o modo dono. Os outros dois veem a mesma
            coisa: a excecao permanente nao distingue quem esta logado.
        pet:
          type: object
          required: [display_name, species, size]
          description: |
            Visao publica minima. **Nao contem** id interno, dados do tutor,
            outros pets, historico nem localizacao.
          properties:
            display_name: { type: string }
            species: { $ref: '#/components/schemas/Species' }
            breed_label: { type: string, nullable: true }
            size: { $ref: '#/components/schemas/PetSize' }
            primary_color: { type: string, nullable: true }
            distinctive_marks: { type: string, nullable: true }
            care_notes:
              type: string
              nullable: true
              description: |
                O cartao de manejo, ja redigido. Muda o que o achador faz agora:
                "e medroso, nao corra atras" evita a perseguicao que faz o
                animal fugir de novo.
            photo_url: { type: string, format: uri, nullable: true }
        lost:
          type: object
          properties:
            is_lost: { type: boolean }
            since: { type: string, format: date-time, nullable: true }
        already_notified:
          type: boolean
          description: |
            Verdadeiro quando este mesmo dispositivo ja avisou nas ultimas 24 h.
            Muda o texto do botao; nao impede avisar de novo.
        owner_view:
          type: object
          nullable: true
          description: Presente apenas quando `viewer` e `owner`.
          properties:
            pet_id: { type: string, format: uuid }
            tag_id: { type: string, format: uuid }

    FoundReportFromTagInput:
      type: object
      description: Todos os campos opcionais. Corpo vazio e o caminho principal.
      properties:
        found_at: { type: string, format: date-time }
        client_note: { type: string, maxLength: 500 }

    FoundReportCreated:
      type: object
      required: [finder_token, conversation_url, owner_notified]
      description: |
        **Nao devolve identificador interno** (SEC-001). A URL ja endereca e o
        token ja autoriza; devolver UUIDv7 a quem nao tem conta entregaria de
        graca o instante de criacao e a posicao do registro na base.
      properties:
        finder_token: { type: string }
        conversation_url: { type: string, format: uri }
        owner_notified:
          type: boolean
          description: |
            Falso apenas quando a notificacao foi **agrupada** a um aviso
            recente. O aviso em si nunca e descartado, e a tela do achador
            continua dizendo a verdade.
        pet_display_name: { type: string }

    FoundReportEnrichment:
      type: object
      properties:
        message: { type: string, maxLength: 1000 }
        photo_upload_id: { type: string, format: uuid }
        location:
          type: object
          properties:
            lat: { type: number, format: double }
            lon: { type: number, format: double }
            accuracy_m: { type: integer }
        finder_contact:
          type: object
          description: |
            Opcional e nunca exibido a ninguem alem do canal mediado. Usado so
            para avisar a resposta do tutor e o desfecho do caso.
          properties:
            display_name: { type: string, maxLength: 60 }
            email: { type: string, format: email }

    StrayFoundReportInput:
      type: object
      description: |
        **Coordenada nao e obrigatoria**, pelo mesmo motivo do caso: quem negou
        a permissao informa `area`. Sem coordenada o cruzamento perde o
        criterio de distancia e passa a valer dentro da mesma cidade; a regra
        completa esta na secao 4.10 de `docs/03-arquitetura.md`.

        `share_token` existe para o vizinho que **chegou pelo push de um caso
        especifico** e esta dizendo "vi este pet": o achado e vinculado
        diretamente aquele caso, sem depender do cruzamento por atributos.
      required: [species, size, found_at]
      anyOf:
        - required: [location]
        - required: [area]
      properties:
        species: { $ref: '#/components/schemas/Species' }
        breed_code: { type: string, maxLength: 40 }
        size: { $ref: '#/components/schemas/PetSize' }
        primary_color_code: { type: string, maxLength: 30 }
        sex: { $ref: '#/components/schemas/Sex' }
        found_at: { type: string, format: date-time }
        location: { $ref: '#/components/schemas/GeoPoint' }
        area: { $ref: '#/components/schemas/Area' }
        share_token:
          type: string
          description: |
            Opcional. Vincula o achado a um caso conhecido em vez de deixar o
            cruzamento descobrir. O candidato nasce com `status: suggested` e
            **continua exigindo confirmacao humana do tutor**.
        notes: { type: string, maxLength: 1000 }
        photo_upload_id: { type: string, format: uuid }

    FoundReport:
      type: object
      required: [id, origin, status, created_at]
      properties:
        id: { type: string, format: uuid }
        origin: { type: string, enum: [tag_scan, stray_report] }
        status: { type: string, enum: [open, matched, closed] }
        species: { $ref: '#/components/schemas/Species' }
        size: { $ref: '#/components/schemas/PetSize' }
        area_label:
          type: string
          nullable: true
          description: Bairro. O ponto exato nunca sai desta forma.
        found_at: { type: string, format: date-time }
        photo_url: { type: string, format: uri, nullable: true }
        notes: { type: string, nullable: true }
        conversation_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }

    FinderFoundReportView:
      type: object
      description: |
        O que o achador sem conta ve do proprio aviso. Sem id interno, sem dado
        do tutor e sem coordenada de volta.
      required: [status, found_at]
      properties:
        status: { type: string, enum: [open, matched, closed] }
        found_at: { type: string, format: date-time }
        has_photo: { type: boolean }
        has_location: { type: boolean }
        message: { type: string, nullable: true }
        pet_display_name: { type: string }
        conversation_url: { type: string, format: uri }

    FoundReportPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FoundReport' }
        next_cursor: { type: string, nullable: true }

    Area:
      type: object
      description: |
        Localizacao por texto, o caminho de quem nao concedeu a permissao e nao
        marcou ponto no mapa. **Bairro e cidade sao o nivel maximo de precisao
        que sai em superficie publica** de qualquer forma (ADR-0010), entao esta
        representacao nao perde nada na exibicao; ela perde no alerta, que
        precisa de um centro para ter raio.
      required: [city]
      properties:
        city: { type: string, minLength: 2, maxLength: 80 }
        neighborhood: { type: string, maxLength: 80 }
        state: { type: string, minLength: 2, maxLength: 2 }

    GeoPoint:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number, format: double, minimum: -34, maximum: 6 }
        lon: { type: number, format: double, minimum: -74, maximum: -32 }
        accuracy_m: { type: integer }

    LostCaseInput:
      type: object
      description: |
        **Coordenada nao e obrigatoria.** Quem negou a permissao de localizacao
        e nao marcou ponto no mapa informa `last_seen_area`, e o caso existe do
        mesmo jeito. O que muda esta descrito em `AlertDispatch.reach_status`:
        sem centro nao ha raio, entao **o alerta de 5 km nao dispara** — e a
        tela precisa dizer isso, em vez de mostrar sucesso.

        O caso sem coordenada continua util, e por dois caminhos que nao
        dependem de raio: ele **entra na lista publica de perdidos** da cidade e
        do bairro, e a tag continua levando qualquer pessoa direto ao tutor.
      required: [last_seen_at]
      anyOf:
        - required: [last_seen_location]
        - required: [last_seen_area]
      properties:
        last_seen_at: { type: string, format: date-time }
        last_seen_location: { $ref: '#/components/schemas/GeoPoint' }
        last_seen_area: { $ref: '#/components/schemas/Area' }
        description: { type: string, maxLength: 1000 }
        share_to_public_list: { type: boolean, default: true }

    LostCase:
      type: object
      required: [id, pet_id, status, opened_at, alert]
      properties:
        id: { type: string, format: uuid }
        pet_id: { type: string, format: uuid }
        status:
          type: string
          enum: [open, closed_reunited, closed_not_found, closed_false_alarm]
        opened_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        area_label: { type: string, nullable: true }
        has_location:
          type: boolean
          description: |
            Falso quando o caso foi aberto sem coordenada. A tela do caso usa
            isto para explicar por que nao houve alerta, em vez de deixar a
            secao de alcance vazia.
        description: { type: string, nullable: true }
        alert: { $ref: '#/components/schemas/AlertDispatch' }
        candidate_count: { type: integer }
        unread_message_count: { type: integer }
        share_url: { type: string, format: uri }
        poster_url: { type: string, format: uri }
        reopen_deadline: { type: string, format: date-time, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true }
        resolution: { $ref: '#/components/schemas/LostCaseClosure' }

    LostCaseClosure:
      type: object
      nullable: true
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [reunited, not_found, false_alarm]
          description: |
            `false_alarm` e o caso aberto por engano, em que o animal nunca
            esteve perdido. **Nao e tela nova**: e uma terceira opcao na mesma
            pergunta de encerramento, oferecida **somente** quando o caso tem
            menos de 6 horas e nenhum aviso ou candidato. Existe porque a
            alternativa e pior: sem ele o tutor responde "voltou" e um caso que
            nunca foi perdido entra na metrica de reencontro, que e o
            instrumento de medicao do produto. Caso encerrado assim **sai do
            numerador e do denominador** dessa metrica, e quem recebeu o alerta
            e avisado do cancelamento.
        reunion_channel:
          type: string
          nullable: true
          description: |
            So faz sentido com `outcome: reunited`. E o que torna a metrica de
            reencontro atribuivel a um canal.
          enum: [tag_scan, bichu_alert, poster_or_link, on_my_own, other]
        note: { type: string, maxLength: 500, nullable: true }

    AlertDispatch:
      type: object
      required: [reach_status]
      properties:
        reach_status:
          type: string
          enum: [computed, unavailable, queued, no_location]
          description: |
            Quatro estados, e eles nao se confundem: `computed` com
            `recipients_total: 0` e "nao ha ninguem num raio de 5 km";
            `unavailable` e "nao conseguimos calcular"; **`no_location` e "nao
            existe raio, porque o caso nao tem coordenada"**. A tela tem texto
            diferente para cada um, e mostrar zero no lugar de `unavailable` ou
            de `no_location` e mentir para alguem em panico.
        recipients_total: { type: integer, nullable: true }
        radius_m: { type: integer, example: 5000 }
        dispatched_at: { type: string, format: date-time, nullable: true }
        next_resend_allowed_at: { type: string, format: date-time, nullable: true }

    LostCaseReachPreview:
      type: object
      required: [reach_status, radius_m, blockers]
      properties:
        reach_status:
          type: string
          enum: [computed, unavailable, no_location]
          description: |
            `unavailable` e obrigatorio quando o calculo falhou ou estourou o
            tempo. `no_location` quando nao ha coordenada nem do pet nem do
            tutor: **nao ha raio, e portanto nao havera alerta**, e o caso
            continua valendo pela lista publica e pela tag. Mostrar zero em
            qualquer um dos dois casos e mentir para quem esta em panico.
        reachable_tutors:
          type: integer
          nullable: true
          description: |
            Conta apenas tutores com localizacao valida **e** push concedido.
            Nulo quando `reach_status` e `unavailable`.
        radius_m: { type: integer, example: 5000 }
        area_label: { type: string, nullable: true }
        blockers:
          type: array
          description: |
            O que impede abrir o caso. **Falta de coordenada nao e bloqueio**:
            ela reduz o alcance, nao a existencia do caso.
          items:
            type: string
            enum: [contact_channel_unverified, pet_photo_missing, pet_already_lost]

    MatchCandidate:
      type: object
      required: [id, found_report, score, status]
      properties:
        id: { type: string, format: uuid }
        found_report: { $ref: '#/components/schemas/FoundReport' }
        score:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: |
            Ordena a lista. **Nunca** confirma sozinho: nenhum caso e fechado
            sem decisao humana do tutor.
        matched_attributes:
          type: array
          items: { type: string }
        distance_m:
          type: integer
          nullable: true
          description: Nulo quando caso ou achado nao tem coordenada.
        link_origin:
          type: string
          enum: [attribute_match, share_token]
          description: |
            `share_token` e o vizinho que chegou pelo push e disse "vi este
            pet": o vinculo e direto, nao veio do cruzamento. Continua exigindo
            confirmacao humana.
        strategy_version:
          type: string
          description: |
            Versao da regra de cruzamento que produziu este candidato (secao
            4.10 do documento de arquitetura). Sem ela, mudar os pesos torna
            impossivel saber por que um candidato antigo apareceu.
        status: { type: string, enum: [suggested, confirmed, rejected] }
        created_at: { type: string, format: date-time }

    CandidatePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MatchCandidate' }
        next_cursor: { type: string, nullable: true }

    Conversation:
      type: object
      required: [status, participants, messages]
      description: |
        `id` e `case_id` sao devolvidos **apenas ao chamador autenticado**. Para
        quem chega por `finderToken` eles sao omitidos, porque a rota do achador
        nao precisa de id e UUID interno nao sai para quem nao tem conta.
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid, nullable: true }
        pet_display_name: { type: string }
        status: { type: string, enum: [open, blocked, closed] }
        participants:
          type: array
          items:
            type: object
            required: [role, display_name]
            properties:
              role: { type: string, enum: [tutor, finder, system] }
              display_name:
                type: string
                description: |
                  Primeiro nome ou apelido. **Nunca** sobrenome completo,
                  telefone, e-mail nem foto de perfil.
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        next_cursor: { type: string, nullable: true }

    ConversationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Conversation' }
        next_cursor: { type: string, nullable: true }

    Message:
      type: object
      required: [sender_role, body, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: Omitido nas respostas ao achador por token (SEC-001).
        sender_role: { type: string, enum: [tutor, finder, system] }
        body: { type: string }
        redactions:
          type: array
          description: |
            O que foi retirado do texto antes de entregar, para que a interface
            explique em vez de o remetente achar que foi censurado sem motivo.
            Telefone e e-mail trocados em claro sao a porta do golpe.
          items:
            type: object
            properties:
              kind: { type: string, enum: [phone, email, address, external_link] }
              hint: { type: string }
        photo_url: { type: string, format: uri, nullable: true }
        created_at: { type: string, format: date-time }

    PublicLostPet:
      type: object
      required: [share_token, pet_display_name, species, size, lost_since, area_label]
      description: |
        Projecao publica. Nao possui, e nunca deve possuir, `pet_id`, `case_id`,
        `user_id`, coordenada, dado do tutor nem endereco (SEC-002). A chave
        estavel da lista e o `share_token` opaco, que e o mesmo que o link de
        compartilhamento ja carrega.
      properties:
        share_token:
          type: string
          description: Opaco, o mesmo do `share_url`. Nao e UUID e nao e ordenavel.
        pet_display_name: { type: string }
        species: { $ref: '#/components/schemas/Species' }
        breed_label: { type: string, nullable: true }
        size: { $ref: '#/components/schemas/PetSize' }
        primary_color: { type: string, nullable: true }
        lost_since: { type: string, format: date-time }
        area_label:
          type: string
          description: Bairro e cidade. Este e o nivel maximo de precisao publica.
        photo_url: { type: string, format: uri, nullable: true }
        share_url: { type: string, format: uri }

    PublicLostCase:
      allOf:
        - $ref: '#/components/schemas/PublicLostPet'
        - type: object
          properties:
            description:
              type: string
              nullable: true
              description: Texto do tutor. Passa pela mesma redacao de contato das mensagens.
            care_notes:
              type: string
              nullable: true
              description: O mesmo cartao de manejo da pagina do achador.
            can_report_sighting:
              type: boolean
              description: |
                Falso para o proprio tutor. Verdadeiro para qualquer outra conta:
                e o botao "vi este pet", que cria o achado ja vinculado pelo
                `share_token`.
            poster_url: { type: string, format: uri }

    PublicLostPetPage:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PublicLostPet' }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        applied_filters:
          type: object
          description: Devolvido para a tela poder dizer o que esta filtrado.
          additionalProperties: { type: string }

    PublicPetProfile:
      type: object
      required: [slug, display_name, species]
      properties:
        slug: { type: string }
        display_name: { type: string }
        species: { $ref: '#/components/schemas/Species' }
        breed_label: { type: string, nullable: true }
        size: { $ref: '#/components/schemas/PetSize' }
        primary_color: { type: string, nullable: true }
        distinctive_marks: { type: string, nullable: true }
        photo_url: { type: string, format: uri, nullable: true }
        is_lost: { type: boolean }

    ReferenceData:
      type: object
      required: [version, species, breeds, colors, sizes]
      properties:
        version: { type: string }
        species:
          type: array
          items:
            type: object
            properties:
              code: { $ref: '#/components/schemas/Species' }
              label: { type: string }
        breeds:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              label: { type: string }
              species: { $ref: '#/components/schemas/Species' }
        colors:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              label: { type: string }
        sizes:
          type: array
          items:
            type: object
            properties:
              code: { $ref: '#/components/schemas/PetSize' }
              label: { type: string }
              weight_hint: { type: string }

    PetTransfer:
      type: object
      required: [id, status, expires_at]
      description: |
        **Nao contem o token em nenhuma hipotese.** Ele existe apenas na caixa de
        entrada do destinatario, e e isso que separa "o tutor quer transferir" de
        "quem pegou o celular do tutor transferiu".
      properties:
        id: { type: string, format: uuid }
        pet_id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending_acceptance, accepted, effective, cancelled, expired]
        recipient_email_masked: { type: string, example: 'ma****@exemplo.com.br' }
        expires_at:
          type: string
          format: date-time
          description: Fim do prazo para aceitar (72 h).
        accepted_at: { type: string, format: date-time, nullable: true }
        effective_at:
          type: string
          format: date-time
          nullable: true
          description: |
            24 h apos o aceite. **Ate este instante nada foi revogado.**
        cancelled_at: { type: string, format: date-time, nullable: true }
