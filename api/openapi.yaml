              schema: { $ref: '#/components/schemas/AdminDirectorySuggestion' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  # ----------------------------------------------------------------------
  # A fila dos pedidos da plaquinha da coleira
  #
  # O LADO DO BACKEND ESTA AQUI; A TELA DO PAINEL NAO. A sessao Backoffice e
  # dona do painel, e estas tres operacoes sao o que ela precisa chamar.
  # ----------------------------------------------------------------------

  /admin/tag-requests:
    get:
      operationId: listAdminCollarTagRequests
      tags: [admin]
      x-effects: []
      summary: A fila de pedidos da plaquinha da coleira
      description: |
        So existe no painel. Sem filtro, vem a fila de `pending`, do pedido
        mais antigo para o mais novo.

        **Devolve o ENDERECO DE ENTREGA**, que e o que o administrador le para
        enviar a plaquinha (decisao do cliente, 17/10). E dado pessoal, e por
        isso: so nesta superficie, nunca em resposta sem conta, nunca na
        trilha de auditoria e nunca geocodificado (ADR-0006).

        **Nenhum PERFIL do solicitante sai aqui**: nem e-mail, nem telefone,
        nem UUID, nem identificador estavel. A unica leitura de conta do
        backoffice v1 segue sendo a fila de pedidos de encontro (D53 a D57).

        **Nao traz o codigo da plaquinha.** O codigo e credencial ao portador
        (ADR-0004) e hoje sai em duas superficies, as duas do tutor; uma
        terceira, no painel, e decisao que o cliente ainda nao tomou. O que
        identifica o pedido para quem atende e `ref` e o nome do pet.
      security:
        - adminSession: []
      x-admin-roles: [admin]
      x-rate-limit:
        - dimension: [account]
          limit: 300
          window: 1h
          on_exceed: deny_429
          note: "contagem de requisicoes, aplicada pela borda. Nao e `rows_returned`: o teto por linhas e da leitura de pessoa (D56), e esta fila nao le pessoa"
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AdminCollarTagRequestStatus' }
        - name: delivery_state
          in: query
          description: |
            Recorta por PASSO DA ENTREGA, e combina com `status` em vez de
            substitui-lo: os dois sao eixos diferentes. `status=fulfilled` com
            `delivery_state=requested` e a fila de trabalho de quem despacha --
            pedidos aceitos que ainda nao sairam.
          schema: { $ref: '#/components/schemas/CollarTagDeliveryState' }
        - $ref: '#/components/parameters/AdminPage'
        - name: limit
          in: query
          description: Teto de 50 por pagina, como na outra fila que le pessoa (D56).
          schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
      responses:
        '200':
          description: Pagina da fila.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCollarTagRequestPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/tag-requests/{requestRef}:
    parameters:
      - $ref: '#/components/parameters/CollarTagRequestRef'
    get:
      operationId: getAdminCollarTagRequest
      tags: [admin]
      x-effects: []
      summary: Um pedido da plaquinha
      description: |
        A leitura de UM pedido, para a tela de entrega do painel: quem atende
        abre o pedido, confere o endereco, digita o rastreio e marca o passo.
        Sem ela a tela teria de achar o pedido dentro da pagina da listagem, e
        perderia a linha a cada recarga.

        Mesma projecao da listagem (`AdminCollarTagRequest`), e as mesmas
        regras: **devolve o ENDERECO DE ENTREGA** (dado pessoal, so nesta
        superficie, nunca na trilha, nunca geocodificado -- ADR-0006); **nenhum
        PERFIL do solicitante**; e **nao traz o codigo da plaquinha**, que e
        credencial ao portador (ADR-0004).

        **Pedido de conta desabilitada responde `404`**, e nao uma leitura
        parcial: decisao do cliente de 17/10 -- conta desabilitada nao e mais
        encontrada em nenhuma pagina nem funcionalidade. O filtro esta na
        clausula `WHERE`, e nao num ramo de JavaScript. `404` tambem para `ref`
        desconhecido e para pedido de pet ja excluido; nao ha `403` nesta
        superficie (ADR-0021).
      security:
        - adminSession: []
      x-admin-roles: [admin]
      x-rate-limit:
        - dimension: [account]
          limit: 300
          window: 1h
          on_exceed: deny_429
          note: "contagem de requisicoes, aplicada pela borda. Nao e `rows_returned`: o teto por linhas e da leitura de pessoa (D56), e este pedido nao le pessoa"
      responses:
        '200':
          description: O pedido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCollarTagRequest' }
        # `requestRef` e validado pela borda, entao esta leitura PODE recusar
        # parametro -- e `rotas-registradas-contra-o-contrato` cobra o 400 de
        # toda operacao registrada que possa.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/tag-requests/{requestRef}/delivery:
    parameters:
      - $ref: '#/components/parameters/CollarTagRequestRef'
    post:
      operationId: updateAdminCollarTagRequestDelivery
      tags: [admin]
      x-effects: []
      summary: Atualiza a entrega da plaquinha
      description: |
        O estado da entrega e o codigo de rastreio, numa escrita so -- que e
        como o cliente pediu em 18/10: "mudar o status da entrega e inserir o
        codigo de rastreio e atualizar a entrega".

        As transicoes aceitas, o que acontece com cada uma e por que nao se
        volta atras estao em `AdminCollarTagDeliveryUpdate`. Transicao fora da
        tabela responde `400` com `code: invalid_delivery_transition`;
        rastreio so com espaco responde `400` com `code: blank_tracking_code`.

        **`POST` e nao `PATCH`**, e nao por indecisao: as outras duas escritas
        desta fila sao `POST` em sub-recurso de acao
        (`/fulfillment`, `/decline`), e esta e a terceira irma delas. Um `PATCH`
        aqui obrigaria o painel a falar dois dialetos com a mesma fila.

        **Sem `If-Match`**, ao contrario de `updateAdminDirectoryEntry`. La o
        recurso tem `version` e a escrita e de formulario inteiro, onde duas
        pessoas se sobrescrevem em silencio. Aqui a trava e a propria maquina de
        estados, sob `FOR UPDATE`: quem chega com a tela velha tenta uma
        transicao que o estado atual nao permite e leva `400` em voz alta. Um
        `ETag` para esta fila seria uma segunda trava para a mesma propriedade,
        e uma coluna `version` que so ela usaria.

        **Nao apaga nada.** Nao existe exclusao de pedido nesta superficie, e o
        que seria cancelar e `declined` -- estado, e por
        `declineAdminCollarTagRequest`.

        **Nao emite codigo** (ADR-0004) e **nao consulta transportadora
        nenhuma**: o rastreio e texto digitado.

        Pedido de conta desabilitada responde `404`, pela mesma clausula `WHERE`
        da leitura.
      security:
        - adminSession: []
          adminCsrf: []
      x-admin-roles: [admin]
      x-audit:
        action: admin.collar_tag_request.delivery_updated
        resource_kind: collar_tag_request
      x-rate-limit:
        - dimension: [account]
          limit: 120
          window: 10m
          on_exceed: deny_429
          note: "balde compartilhado admin_write (D52)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminCollarTagDeliveryUpdate' }
      responses:
        '200':
          description: Entrega atualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCollarTagRequest' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/tag-requests/{requestRef}/fulfillment:
    parameters:
      - $ref: '#/components/parameters/CollarTagRequestRef'
    post:
      operationId: fulfillAdminCollarTagRequest
      tags: [admin]
      x-effects: []
      summary: Marca que a plaquinha saiu
      description: |
        So a partir de `pending` (`400`, `code: request_not_pending`, nos
        outros casos). Pedido que nao existe, ou de pet ja excluido, responde
        `404`.

        **Nao emite codigo nenhum.** Emitir e `issuePetTag`, e o codigo e
        irreversivel: um painel que emitisse criaria plaquinha sem o tutor
        pedir. Aqui so se registra que o objeto fisico saiu.
      security:
        - adminSession: []
          adminCsrf: []
      x-admin-roles: [admin]
      x-audit: { action: admin.collar_tag_request.fulfilled, resource_kind: collar_tag_request }
      x-rate-limit:
        - dimension: [account]
          limit: 120
          window: 10m
          on_exceed: deny_429
          note: "balde compartilhado admin_write (D52)"
      responses:
        '200':
          description: Pedido atendido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCollarTagRequest' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/tag-requests/{requestRef}/decline:
    parameters:
      - $ref: '#/components/parameters/CollarTagRequestRef'
    post:
      operationId: declineAdminCollarTagRequest
      tags: [admin]
      x-effects: []
      summary: Recusa o pedido da plaquinha
      description: |
        So a partir de `pending` (`400`, `code: request_not_pending`, nos
        outros casos). Sem motivo escrito: motivo e mensagem, e mensagem e v2.

        **O que o tutor ve depois da recusa e decisao de produto em aberto** e
        nao esta resolvida aqui: hoje `requestCollarTag` devolve o estado
        verdadeiro, inclusive `declined`. A outra fila do painel esconde a
        recusa por decisao do cliente de 23/09; essa decisao foi tomada para
        encontro privado e nao para plaquinha, e copia-la seria decidir no
        lugar dele.
      security:
        - adminSession: []
          adminCsrf: []
      x-admin-roles: [admin]
      x-audit: { action: admin.collar_tag_request.declined, resource_kind: collar_tag_request }
      x-rate-limit:
        - dimension: [account]
          limit: 120
          window: 10m
          on_exceed: deny_429
          note: "balde compartilhado admin_write (D52)"
      responses:
        '200':
          description: Pedido recusado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCollarTagRequest' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/media/catalog-image-intents:
    post:
      operationId: createAdminCatalogImageIntent
      tags: [admin]
      x-effects: [irreversible_write]
      summary: Pede a politica de envio direto de uma imagem de catalogo
      description: |
        ADR-0007 a letra, com `kind = catalog_image` e `purpose` gravados no
        envio. O backend nunca recebe os bytes. JPEG, PNG e WebP; **SVG
        recusado sempre** (`415`). A confirmacao e a escrita do item
        (`images`) ou do encontro (`images`) com o mesmo
        `purpose`; e ela que enfileira o processamento. A derivada publica so e
        servida pronta.
      security:
        - adminSession: []
          adminCsrf: []
      x-admin-roles: [admin]
      x-audit: { action: admin.catalog_image.intent_created, resource_kind: upload_intent }
      x-rate-limit:
        - dimension: [account]
          limit: 60
          window: 1h
          on_exceed: deny_429
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminCatalogImageIntentInput' }
            examples:
              capa:
                value: { purpose: network_event, content_type: image/jpeg, byte_size: 834112, width: 1200, height: 900 }
      responses:
        '201':
          description: Politica de envio, valida por 10 minutos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadIntent' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '422': { $ref: '#/components/responses/ImageTooSmall' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token JWT assinado em RS256, 15 minutos de validade. `sub` e o
        UUID interno do usuario. A chave publica vem de
        `/.well-known/jwks.json`, selecionada pelo `kid` do cabecalho.
    reauth:
      type: apiKey
      in: header
      name: X-Reauth-Token
      description: |
        Segunda credencial das operacoes destrutivas, obtida em
        `POST /v1/auth/reauth`. Tres propriedades, e sem as tres os 5 minutos
        nao valem nada:

        - **uso unico**: consumido na primeira operacao que o apresenta;
        - **escopo por operacao**: emitido para **uma** finalidade declarada, e
          recusado nas demais. Sem isso, o tutor que reautentica para revogar uma
          plaquinha emite, sem saber, uma autorizacao para excluir a conta dele;
        - **vinculo com a sessao**: preso ao `jti` do token de acesso que o
          pediu, e invalidado por logout, troca de senha e
          `sessions_invalid_before`.

        A finalidade exigida por cada operacao esta em `x-reauth-scope`, porque
        requisito de seguranca de esquema `apiKey` nao aceita escopo na propria
        lista de `security`.
    webhookSignature:
      type: apiKey
      in: header
      name: X-Postmark-Signature
      description: |
        Assinatura do provedor, verificada com `MAIL_WEBHOOK_SECRET` em
        comparacao de tempo constante. Nao e credencial de usuario.
    finderToken:
      type: http
      scheme: bearer
      description: |
        Token opaco de 256 bits entregue a quem avisou o tutor sem ter conta.
        Escopo de **uma** conversa, valido enquanto o caso estiver aberto mais
        30 dias. Nao e JWT e nao carrega dado pessoal.

    adminSession:
      type: apiKey
      in: cookie
      name: __Host-bichu_adm
      description: |
        Sessao do backoffice (ADR-0027 item 2). Token opaco de 256 bits,
        guardado no servidor so como SHA-256, em cookie `__Host-` `HttpOnly`,
        `Secure`, `SameSite=Strict`, sem `Domain` e sem `Max-Age`. 30 minutos
        de inatividade e 12 horas de teto desde a senha. O papel e lido do
        banco a cada requisicao, nunca de claim.

        **Vale so em `/v1/admin/*`**, e so ele vale ali: `bearerAuth` em
        `/v1/admin/*` responde 401, e este cookie e ignorado fora do prefixo.
    adminCsrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        Token sincronizador da sessao administrativa (D39), exigido em todo
        metodo nao seguro de `/v1/admin/*` junto com `Origin` exatamente igual
        a `https://admin.bichu.app`. Entregue no corpo de `openAdminSession`,
        `getAdminSession` e `reauthenticateAdmin`, **nunca em cookie**. Troca
        junto com o identificador da sessao. Ausente ou divergente: 403.
    adminReauth:
      type: apiKey
      in: header
      name: X-Admin-Reauth-Token
      description: |
        **Sem uso desde 07/10/2026**: nenhuma operacao a exige mais (decisao do
        cliente, ADR-0027 item 23). Fica declarada para a rota obsoleta
        `reauthenticateAdmin`.

        Segunda credencial das operacoes sensiveis do backoffice (D40), obtida
        em `POST /v1/admin/auth/reauth`: 5 minutos, uso unico, um escopo,
        presa a sessao administrativa. O escopo exigido esta em
        `x-admin-reauth-scope`. Nao e o `X-Reauth-Token` do app, que e preso ao
        `jti` do JWT movel.
  parameters:
    NetworkEventQuery:
      name: q
      in: query
      description: |
        Busca por texto no **titulo, no nome do lugar e no bairro**, no servidor.
        **O encontro privado casa so pelo titulo**: casar pelo bairro entregaria
        onde ele e (ADR-0027 12.14).
      schema: { type: string, minLength: 2, maxLength: 80 }
    NetworkEventCity:
      name: city
      in: query
      description: |
        A cidade DIGITADA, nunca coordenada (ADR-0006). **Exclui encontro
        privado**: a cidade dele e oculta, e aparecer no recorte a entregaria.
      schema: { type: string, minLength: 2, maxLength: 60 }
    NetworkEventWhenParam:
      name: when
      in: query
      description: |
        O recorte no tempo, calculado no servidor e **no fuso de cada encontro**.
        `upcoming` e o default. `today` e a data local de hoje no fuso do
        encontro; `weekend` e o sabado e o domingo correntes (ou os proximos);
        `next_30_days` e inicio entre agora e agora mais 30 dias.
      schema: { $ref: '#/components/schemas/NetworkEventWhen' }
    NetworkEventSortParam:
      name: sort
      in: query
      description: |
        **O default depende de `when`, e por isso `effective_sort` existe.** Com
        `past`, o default e `recentes`; com os outros, `proximos`.
      schema: { $ref: '#/components/schemas/NetworkEventSort' }
    NetworkEventAdmissionParam:
      name: admission
      in: query
      description: |
        Gratuito ou pago. **Exclui encontro privado**: a condicao de acesso dele
        e oculta, e aparecer no recorte "pago" a entregaria (ADR-0027 12.14).
      schema: { type: string, enum: [free, paid] }
    NetworkEventVisibilityParam:
      name: visibility
      in: query
      description: |
        A visibilidade e visivel, entao filtra os dois. **Sem padrao**, de
        proposito: o `default: public` de `NetworkEventVisibility` aplicado aqui
        tiraria todo encontro privado da agenda sem ninguem ter pedido.
      schema: { type: string, enum: [public, private] }
    NetworkEventSizeParam:
      name: size
      in: query
      description: |
        Encontros que aceitam aquele porte. **Exclui encontro privado**, pelo
        mesmo motivo de `admission`.
      schema: { $ref: '#/components/schemas/PetSize' }
    NetworkEventSlugParam:
      name: eventSlug
      in: path
      required: true
      description: O endereco publico do encontro.
      schema: { type: string, minLength: 3, maxLength: 30 }
    PetId:
      name: petId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PhotoId:
      name: photoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TagId:
      name: tagId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CaseId:
      name: caseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CandidateId:
      name: candidateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FoundReportId:
      name: foundReportId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TagCode:
      name: code
      in: path
      required: true
      # O 400 deste parametro NAO e `validation-failed`: as operacoes que o usam
      # declaram `tag-code-malformed`, e o app decide a tela pelo `type`. A borda
      # le esta chave para produzir o problema certo; sem ela, ligar a validacao
      # de parametro trocaria o tipo em silencio e o teto de tentativas invalidas
      # deixaria de contar a tentativa (ele conta por `type`, nao por status).
      x-problem-type: tag-code-malformed
      description: |
        Codigo da tag. **A forma canonica** e Crockford Base32, **16
        caracteres**, maiusculas, sem separador: e ela que e hasheada e
        guardada. Sao **15 simbolos de aleatoriedade** (75 bits exatos de
        CSPRNG) e **1 simbolo de verificacao**, que nao e aleatorio e nao conta
        como entropia. A forma **impressa** e a mesma em grupos de quatro
        separados por hifen (`XXXX-XXXX-XXXX-XXXX`), porque digito agrupado se
        le e se confere melhor.

        **O que o servidor aceita na entrada e mais largo do que a forma
        canonica**, porque existe um caminho em que a pessoa digita em vez de
        escanear: sem sinal, QR danificado, impressao ruim, ou lendo da URL
        legivel impressa na plaquinha. A normalizacao e parte do contrato, nao
        decisao de quem implementa, e a ordem dos passos importa:

        1. remover tudo que nao for letra ou digito (hifen **em qualquer
           posicao**, espaco, ponto);
        2. passar para maiusculas;
        3. aplicar as substituicoes do proprio Crockford: **`I` e `L` viram
           `1`**, **`O` vira `0`**;
        4. o resultado precisa ter exatamente 16 caracteres, todos do alfabeto
           `0-9 A-H J K M N P-T V-Z` (sem `I`, `L`, `O`, `U`);
        5. o **decimo sexto** caractere precisa ser o simbolo de verificacao dos
           quinze primeiros. E um simbolo de paridade sobre `GF(2^5)`
           (Reed-Solomon [16,15,2] encurtado, primitivo `x^5 + x^2 + 1`), que
           pega **todo** erro de um simbolo e **toda** transposicao. Este passo
           roda **antes de qualquer acesso ao banco**: quem erra uma letra
           recebe 400 "confira o codigo", e nao 404. Ele **detecta e nunca
           corrige** -- um codigo corrigido seria um codigo valido e diferente,
           e abriria a pagina do pet errado;
        6. buscar pelo resumo desse resultado.

        A mesma normalizacao e aplicada na emissao, entao ela e idempotente: o
        codigo emitido normaliza para ele mesmo.

        **Nenhuma outra substituicao e aceita, e isso e decisao, nao omissao.**
        Confusoes de leitura como `5`/`S`, `8`/`B` e `2`/`Z` **nao** sao
        corrigidas: o alfabeto de Crockford foi desenhado justamente para
        excluir os pares ambiguos, e acrescentar substituicao mapearia dois
        codigos validos e distintos um no outro. O resultado nao seria "nao
        encontrado": seria **abrir a pagina do pet errado**, o que e pior do que
        pedir para digitar de novo. `U` nao tem substituicao e e caractere
        invalido.
      schema:
        type: string
        pattern: '^[0-9A-Za-z][0-9A-Za-z-]{15,23}$'
      example: GQSM-0XHB-T4D9-G31S
    ShareToken:
      name: shareToken
      in: path
      required: true
      description: Token opaco do caso, o mesmo que o link compartilhavel carrega.
      schema: { type: string, minLength: 20, maxLength: 128 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 256 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    CaptchaToken:
      name: X-Captcha-Token
      in: header
      required: false
      description: |
        Token do reCAPTCHA Enterprise, verificado **no servidor** contra o
        provedor. Limiar 0,5, com a faixa de 0,3 a 0,5 prosseguindo e entrando
        na fila de revisao (secao 18.6 de `docs/04-seguranca.md`). Token
        validado no cliente nao vale nada.

        Declarado nas quatro operacoes de `auth` que a politica nomeia:
        cadastro, login, pedido de redefinicao de senha e reenvio de
        verificacao. Sao as que **disparam envio pago** ou **verificam um
        segredo por tentativa**. A operacao que **consome** um token de alta
        entropia (`/auth/password-reset/confirm`,
        `/auth/email-verification/confirm`) nao leva desafio, e isso e decisao:
        ali os 256 bits ja sao o controle, e o desafio so acrescenta uma forma
        de falhar para quem ja esta trancado do lado de fora.

        **`required: false` e a parte que faz trabalho.** O cliente manda o
        cabecalho em toda chamada a essas quatro operacoes e o omite
        **somente** quando nao conseguiu obter um token: SDK que nao
        inicializa, rede que bloqueia o dominio do provedor, aparelho sem os
        servicos do Google, extensao de privacidade. Nesse caso o servidor
        atende assim mesmo, pela regra de degradacao descrita em
        `info.description`. Marcar este cabecalho como obrigatorio
        transformaria a disponibilidade de um terceiro na porta de entrada do
        produto, e e exatamente o que o ADR-0020 recusa.
      schema:
        type: string
        minLength: 20
        maxLength: 4096

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Repetir a mesma chave em 24 h devolve a resposta original.
      schema: { type: string, format: uuid }
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Obrigatorio. A pagina publica reenvia por fila offline e o tutor nao
        pode receber o mesmo aviso varias vezes.
      schema: { type: string, format: uuid }

    PartnerSlug:
      name: partnerSlug
      in: path
      required: true
      description: O endereco publico do parceiro. Nenhum UUID no caminho.
      schema: { $ref: '#/components/schemas/Slug' }
    ItemSlug:
      name: itemSlug
      in: path
      required: true
      description: O endereco publico do item.
      schema: { $ref: '#/components/schemas/Slug' }
    EntrySlug:
      name: entrySlug
      in: path
      required: true
      description: O endereco publico da entrada do diretorio. Nenhum UUID no caminho.
      schema: { $ref: '#/components/schemas/Slug' }
    EventSlug:
      name: eventSlug
      in: path
      required: true
      description: O endereco publico do encontro.
      schema: { $ref: '#/components/schemas/Slug' }
    JoinRequestRef:
      name: requestRef
      in: path
      required: true
      description: O identificador opaco do pedido (`AdminJoinRequest.ref`). Nao e UUID.
      schema: { type: string, minLength: 20, maxLength: 32, pattern: '^[A-Za-z0-9_-]+$' }
    CollarTagRequestRef:
      name: requestRef
      in: path
      required: true
      description: O identificador opaco do pedido da plaquinha (`AdminCollarTagRequest.ref`). Nao e UUID.
      schema: { type: string, minLength: 20, maxLength: 32, pattern: '^[A-Za-z0-9_-]+$' }
    DirectorySuggestionRef:
      name: suggestionRef
      in: path
      required: true
      description: |
        O identificador opaco da indicacao (`AdminDirectorySuggestion.reference`,
        o mesmo `DirectorySuggestionReceipt.reference` que o aplicativo
        devolveu). **Nao e UUID** (ADR-0010 item 6), e nao ha `slug` aqui: o
        `slug` e da ENTRADA do diretorio, e a entrada so passa a existir na
        aprovacao.
      schema: { type: string, minLength: 20, maxLength: 32, pattern: '^[A-Za-z0-9_-]+$' }
    DirectoryEntrySlug:
      name: slug
      in: path
      required: true
      description: |
        O endereco publico da entrada do diretorio, como
        `listDirectoryEntries` o devolve. **Nao e UUID**, e nao pode ser:
        `professionals.id` e identidade interna e o ADR-0010 item 6 a proibe em
        saida publica.
      schema: { $ref: '#/components/schemas/Slug' }
    DirectoryReviewRef:
      name: reviewRef
      in: path
      required: true
      description: |
        O identificador opaco da avaliacao (`DirectoryReview.ref`). **Nao e
        UUID** e nao e derivado de quem escreveu: um identificador que
        carregasse o autor permitiria cruzar as avaliacoes de uma pessoa entre
        locais, que e o vinculo entre pessoas que a BICHUS-174 proibe. Mesmo
        formato de `AdminJoinRequest.ref`.
      schema: { type: string, minLength: 20, maxLength: 32, pattern: '^[A-Za-z0-9_-]+$' }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        O `ETag` da ultima leitura. Obrigatorio em toda escrita sobre recurso
        existente do backoffice: dois administradores editando o mesmo recurso
        nao se sobrescrevem em silencio. Ausente: 428. Diferente da versao
        atual: 412, e o painel mostra o que mudou antes de deixar salvar.
      schema: { type: string, example: '"7"' }
    AdminPage:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    AdminLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }

  responses:
    Accepted:
      description: Pedido aceito para processamento.
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status: { type: string, enum: [accepted] }
              correlation_id: { type: string, format: uuid }
    ReauthRequired:
      description: |
        Operacao destrutiva sem janela de reautenticacao aberta, ou com janela
        expirada. **Nao e falha de sessao**: a sessao continua valida, e a
        interface pede a senha sem perder o contexto.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            precisaDaSenha:
              value:
                type: https://dominio-a-definir.com.br/problems/reauthentication-required
                title: Confirme sua senha
                status: 401
                detail: Esta acao nao pode ser desfeita, entao pedimos a senha de novo.
                correlation_id: 018f7c1e-7a2b-7c3d-9e4f-2b1a0c9d8e7f
    Unauthorized:
      description: |
        Sem token valido. Dois tipos possiveis, e o app reage diferente a cada
        um: `unauthenticated` (nao ha token, ou a assinatura nao confere) manda
        entrar; `token-expired` renova em silencio e so manda entrar se a
        renovacao falhar.

        **Nenhum 401 sai com `forbidden`.** `forbidden` e 403 e significa outra
        coisa: autenticado, sem permissao sobre aquele recurso. Um app que trata
        "sua senha nao confere", "seu token venceu" e "este recurso nao e seu"
        pelo mesmo caminho ou desloga quem nao precisava, ou deixa de deslogar
        quem precisava.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            semToken:
              value:
                type: https://dominio-a-definir.com.br/problems/unauthenticated
                title: Entre para continuar
                status: 401
                next_action: sign_in
                correlation_id: 018f7c1e-7a2b-7c3d-9e4f-2b1a0c9d8e7f
            tokenVencido:
              value:
                type: https://dominio-a-definir.com.br/problems/token-expired
                title: Entre de novo
                status: 401
                correlation_id: 018f7c1e-7a2b-7c3d-9e4f-2b1a0c9d8e7f
    Forbidden:
      description: |
        Autenticado, mas sem permissao sobre este recurso. Para recurso de
        outro tutor a API responde **404**, nao 403: confirmar a existencia de
        um pet alheio ja e vazamento.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Nao existe, ou nao e visivel para quem perguntou.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    LostCaseClosed:
      description: |
        O link publico do caso nao leva mais a caso aberto. `type` e sempre
        `lost-case-closed`, e cobre, **com o mesmo corpo**: caso encerrado; pet
        excluido, falecido ou arquivado; e token desconhecido. A superficie
        publica nao distingue o motivo, porque distinguir contaria a um estranho
        o que aconteceu com o animal de outra pessoa, ou se aquele token um dia
        existiu. Nao e 404 pela mesma razao da tag revogada (ADR-0004): link
        impresso num cartaz nao pode terminar numa pagina sem saida.

        `next_action: register_stray_found_report` e a saida: quem chegou por um
        cartaz antigo e esta vendo um animal parecido ainda consegue registrar o
        achado avulso, e o cruzamento por atributos faz o resto.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            encerrado:
              value:
                type: https://dominio-a-definir.com.br/problems/lost-case-closed
                title: Este caso foi encerrado
                status: 410
                detail: Este pet nao esta mais sendo procurado por este link.
                next_action: register_stray_found_report
                correlation_id: 018f7c1e-7a2b-7c3d-9e4f-2b1a0c9d8e7f
    FinderLinkInvalid:
      description: |
        O token do achador esta ausente, malformado ou nao corresponde a aviso
        nenhum. Os tres casos tem **o mesmo corpo**: distinguir "malformado" de
        "nao existe" diria a quem tenta que chegou perto. `type` e sempre
        `finder-link-invalid`.

        E 401, e nao 403, pelo mesmo criterio de `getPublicLostCase`: credencial
        que nao autentica e 401, e 403 fica para quem se autenticou e nao tem
        permissao, que aqui nao existe (o token tem escopo de uma conversa so).
        Nao e `unauthenticated` porque aquele tipo manda entrar, e quem abriu
        este link nao tem conta. Sai com `WWW-Authenticate: Bearer`.
      headers:
        WWW-Authenticate: { schema: { type: string }, description: 'Sempre `Bearer`.' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            linkInvalido:
              value:
                type: https://dominio-a-definir.com.br/problems/finder-link-invalid
                title: Este link nao vale
                status: 401
                detail: Confira se o endereco foi copiado inteiro.
                next_action: register_stray_found_report
                correlation_id: 018f7c1e-7a2b-7c3d-9e4f-2b1a0c9d8e7f
    FinderAccessEnded:
      description: |
        O token do achador existiu e **venceu**: passou dos 30 dias do aviso com
        o caso ja encerrado, ou dos 30 dias depois do encerramento. `type` e
        `conversation-closed`, e o corpo e **fixo**: nao traz o desfecho do caso
        em campo nenhum, nem no `detail`. Ver a descricao de
        `getFinderConversation`.

        Vale igual para as seis operacoes do achador. Bloquear, denunciar,
        enviar foto ou recado por um link vencido recebe a mesma resposta que
        ler a conversa: responder 401 ali diria que o link nunca valeu.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            vencido:
              value:
                type: https://dominio-a-definir.com.br/problems/conversation-closed
                title: Esta conversa terminou
                status: 410
                detail: Este link nao da mais acesso a conversa.
                correlation_id: 018f7c1e-7a2b-7c3d-9e4f-2b1a0c9d8e7f
    ValidationFailed:
      description: Corpo ou parametro invalido.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            campoInvalido:
              value:
                type: https://dominio-a-definir.com.br/problems/validation-failed
                title: Dados invalidos
                status: 400
                detail: Um ou mais campos nao passaram na validacao.
                correlation_id: 018f7c1e-7a2b-7c3d-9e4f-2b1a0c9d8e7f
                errors:
                  - field: species
                    code: enum
                    message: Valor precisa ser dog, cat ou other.
    ImageTooSmall:
      description: |
        A imagem declarada e menor que a dimensao minima do proposito: 600 x
        600 pixels no encontro da `Rede`, 800 x 800 no produto da `Loja`.
        `errors[]` traz `width` e/ou `height` com `code: minimum`. Nada foi
        assinado: escolha outra imagem.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    WeakPassword:
      description: |
        Senha fora da politica. `errors[].code` diz qual regra falhou, para que
        a tela marque o requisito especifico em vez de repetir a lista inteira.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TokenExpired:
      description: Token de uso unico expirado, ja usado ou invalido.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UploadNotReceived:
      description: |
        O envio foi confirmado, mas os bytes nao estao no armazenamento.
        Acontece quando a rede cai no meio do envio: o cliente chega a confirmar
        e o objeto nunca chegou. Sem este estado a foto nasceria `processing`
        para sempre.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMedia:
      description: Tipo de arquivo nao aceito.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Limite de chamadas estourado.
      headers:
        Retry-After: { schema: { type: integer }, description: Segundos. }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PetLimitReached:
      description: Teto de 20 pets por conta.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    LostCaseBlocked:
      description: |
        Bloqueio de abertura de caso. Dois tipos possiveis, e a interface tem
        texto diferente para cada um.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            contatoNaoVerificado:
              value:
                type: https://dominio-a-definir.com.br/problems/contact-channel-unverified
                title: Confirme seu e-mail antes de avisar
                status: 409
                detail: Os tutores por perto vao receber a foto. Se alguem encontrar, e pelo seu e-mail que a gente avisa.
                correlation_id: 018f7c1e-7a2b-7c3d-9e4f-2b1a0c9d8e7f
            petSemFoto:
              value:
                type: https://dominio-a-definir.com.br/problems/pet-photo-missing
                title: A foto do pet nao subiu
                status: 409
                detail: Sem foto, ninguem reconhece o animal na rua.
                correlation_id: 018f7c1e-7a2b-7c3d-9e4f-2b1a0c9d8e7f

    AdminUnauthorized:
      description: |
        Sem sessao administrativa valida. `unauthenticated`: nao ha cookie, ou
        ele nao corresponde a sessao nenhuma, ou veio `Authorization: Bearer`
        no lugar dele (D36). `token-expired`: a sessao venceu por inatividade
        ou pelo teto, foi revogada, ou e anterior a `sessions_invalid_before`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            semSessao:
              value:
                type: https://dominio-a-definir.com.br/problems/unauthenticated
                title: Entre para continuar
                status: 401
                next_action: sign_in
                correlation_id: 018f7c1e-7a2b-7c3d-9e4f-2b1a0c9d8e7f
            sessaoVencida:
              value:
                type: https://dominio-a-definir.com.br/problems/token-expired
                title: A sua sessao terminou
                status: 401
                next_action: sign_in
                correlation_id: 018f7c1e-7a2b-7c3d-9e4f-2b1a0c9d8e7f
    AdminForbidden:
      description: |
        Sessao valida, e a requisicao recusada pela guarda: conta sem o papel
        exigido em `x-admin-roles` ou desativada (D37, D38), ou, em metodo nao
        seguro, `Origin` diferente da origem do painel (`ADMIN_ORIGIN`) ou
        `X-CSRF-Token` ausente ou divergente (D39). A guarda decide antes de ler o recurso, entao o 403 nao diz nada
        sobre ele.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            semPermissao:
              value:
                type: https://dominio-a-definir.com.br/problems/forbidden
                title: Voce nao tem permissao para isto
                status: 403
                correlation_id: 018f7c1e-7a2b-7c3d-9e4f-2b1a0c9d8e7f
    AdminReauthRequired:
      description: |
        **Sem uso desde 07/10/2026** (ADR-0027 item 23): nenhuma escrita do
        painel pede reautenticacao. Mantida declarada, sem remover.

        Dois casos. Sem sessao valida: os mesmos tipos de `AdminUnauthorized`.
        Sessao valida sem `X-Admin-Reauth-Token` do escopo da operacao, com
        token vencido, ja usado ou de outro escopo:
        `reauthentication-required`, e o painel pede a senha sem perder o que
        estava na tela.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            precisaDaSenha:
              value:
                type: https://dominio-a-definir.com.br/problems/reauthentication-required
                title: Confirme sua senha
                status: 401
                detail: Mudar onde e quando as pessoas levam os caes pede a senha de novo.
                correlation_id: 018f7c1e-7a2b-7c3d-9e4f-2b1a0c9d8e7f
    SlugTaken:
      description: O `slug` pedido ja e de outro recurso do mesmo tipo.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            ocupado:
              value:
                type: https://dominio-a-definir.com.br/problems/slug-taken
                title: Este endereco ja esta em uso
                status: 409
                correlation_id: 018f7c1e-7a2b-7c3d-9e4f-2b1a0c9d8e7f
    EventNotOpen:
      description: |
        O encontro do pedido foi cancelado, removido ou ja terminou: nenhuma
        decisao sobre o pedido vale mais, e o painel tira o pedido da fila.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            encerrado:
              value:
                type: https://dominio-a-definir.com.br/problems/event-not-open
                title: Este encontro nao recebe mais decisoes
                status: 409
                correlation_id: 018f7c1e-7a2b-7c3d-9e4f-2b1a0c9d8e7f
    PreconditionFailed:
      description: |
        `If-Match` nao corresponde a versao atual: outra pessoa salvou depois
        da sua leitura. Nada foi gravado.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            mudouAntes:
              value:
                type: https://dominio-a-definir.com.br/problems/precondition-failed
                title: Alguem alterou isto antes de voce
                status: 412
                detail: Recarregue para ver a versao atual antes de salvar.
                correlation_id: 018f7c1e-7a2b-7c3d-9e4f-2b1a0c9d8e7f
    PreconditionRequired:
      description: Escrita sobre recurso existente sem `If-Match`. Nada foi gravado.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            semVersao:
              value:
                type: https://dominio-a-definir.com.br/problems/precondition-required
                title: Falta a versao que voce leu
                status: 428
                correlation_id: 018f7c1e-7a2b-7c3d-9e4f-2b1a0c9d8e7f

  headers:
    ETag:
      description: |
        A versao do recurso (`version` no banco), entre aspas. Muda a cada
        escrita. E o valor que a proxima escrita apresenta em `If-Match`.
      schema: { type: string, example: '"7"' }

