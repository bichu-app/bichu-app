        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/devices/{deviceId}:
    delete:
      operationId: deleteDevice
      security:
        - bearerAuth: []
      tags: [me]
      x-effects: []
      x-rate-limit:
        - dimension: [account]
