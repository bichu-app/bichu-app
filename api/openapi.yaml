          content:
            application/json:
              schema: { $ref: '#/components/schemas/LostCasePoster' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
          # `ShareToken` fora da faixa de tamanho. Ver `getPublicLostCase`.
        '410': { $ref: '#/components/responses/LostCaseClosed' }

  /public/password-reset/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: checkPasswordResetToken
      tags: [auth]
      x-effects: []
      summary: Diz se o link de redefinicao ainda vale
      description: |
        Existe para a tela saber **antes** de a pessoa digitar a senha nova.
        Sem esta operacao, quem clica num link vencido escolhe uma senha,
        confirma, e so entao descobre que precisa pedir outro link — que e o
        pior momento possivel para dar essa noticia, e o momento em que a pessoa
        desiste.

        Nao revela nada sobre a conta: 200 com `{ "valid": true }` ou 410. Nao
        diz de quem e o link, nem se existe conta com aquele e-mail.
      security: []
      x-no-challenge: true
      x-rate-limit:
        - dimension: [ip]
          limit: 30
          window: 1h
          on_exceed: log_and_alert
          note: "chamada ao abrir a pagina, sem ninguem para responder a um desafio; teto existe para o laco, e o alerta e o que importa"
      responses:
        '200':
          description: O link vale.
          content:
            application/json:
              schema:
                type: object
                required: [valid]
                properties:
                  valid: { type: boolean, enum: [true] }
        '410': { $ref: '#/components/responses/TokenExpired' }


  /public/session-alerts/{alertToken}/disavow:
    parameters:
      - name: alertToken
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: disavowSessionAlert
      tags: [auth]
      x-effects: [verifies_secret, notifies, irreversible_write]
      summary: '"Nao fui eu": derruba todas as sessoes pelo link do aviso'
      description: |
        O aviso de reuso de refresh chega por e-mail, e quem o le pode ser
        justamente quem **perdeu** a conta: o invasor ja trocou o que precisava
        trocar, ou o celular ficou no bolso de outra pessoa. Um botao que exija
        login e inutil para essa pessoa, e e por isso que esta operacao nao pede
        conta. Mesmo desenho, e pelo mesmo motivo, de
        `cancelTransferByToken`: a operacao existe para **desfazer**, e um
        obstaculo aqui e o dano consumado.

        O que ela faz, e so isto: revoga todas as familias de refresh da conta e
        empurra `users.sessions_invalid_before`, o que derruba tambem o token de
        acesso ja emitido em menos de um segundo (SEC-006). Ela **nao troca a
        senha** e nao mexe em mais nada: quem tem o link nao provou ser o
        titular, e uma troca de senha a partir daqui trancaria o titular para
        fora com o link que existe para protege-lo. O e-mail que sai em seguida
        convida a redefinir a senha pelo fluxo que exige a caixa de entrada.

        E **POST, sem GET equivalente**, e isso e defesa: cliente de e-mail e
        antivirus de borda pre-carregam link por GET, e uma revogacao disparada
        por pre-carga derrubaria a sessao de quem nunca clicou.

        O token e de uso unico, vale 7 dias e e consumido **depois** de a
        revogacao concluir. A ordem e deliberada: revogar duas vezes tem o mesmo
        efeito de revogar uma, entao gastar o token antes deixaria uma falha
        passageira do banco queimar o unico remedio da vitima.

        Responde 204 tambem quando a conta ja estava sem sessao nenhuma. O
        pedido e o que importa, nao o numero de linhas que caiu.
      security: []
      x-no-challenge: true
      x-rate-limit:
        - dimension: [ip]
          limit: 10
          window: 1h
          on_exceed: log_and_alert
          note: "recusar aqui trabalharia contra quem a rota protege; o teto existe para o laco, e o alerta e o que importa. O token de 256 bits e a defesa real"
      responses:
        '204': { description: Todas as sessoes da conta foram encerradas. }
        '410':
          description: |
            O link nao vale mais: inexistente, vencido ou ja usado. O corpo e o
            mesmo nos tres casos, porque distinguir contaria a um estranho que
            aquele token existiu.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /public/transfers/{cancelToken}:
    parameters:
      - name: cancelToken
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getTransferByCancelToken
      tags: [pets]
      x-effects: []
      summary: A transferencia pendente, pelo token que chegou por e-mail
      description: |
        O tutor atual tem 24 h para cancelar depois do aceite, e o caminho e um
        link no e-mail. Ele pode estar em outro aparelho, deslogado, com o app
        desinstalado — e este e o momento em que **nao** se pede que ele entre
        na conta: a operacao existe para desfazer a coisa mais destrutiva do
        produto, e um obstaculo aqui e um pet transferido por engano.

        `POST /v1/pets/transfers/{transferId}/cancel` continua existindo e
        continua exigindo conta: e o caminho de dentro do app.

        Devolve o minimo para a tela dizer o que sera desfeito: o nome do pet e
        quando a transferencia se consuma. Nunca o e-mail do destinatario nem
        UUID interno.
      security: []
      x-no-challenge: true
      x-rate-limit:
        - dimension: [ip]
          limit: 30
          window: 1h
          on_exceed: log_and_alert
      responses:
        '200':
          description: A transferencia pendente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferCancelView' }
        '410':
          description: |
            Ja consumada, ja cancelada, ou o token nao vale mais. O corpo e o
            mesmo nos tres casos: dizer qual deles ocorreu entregaria a quem
            tem um token velho o estado atual de uma transferencia alheia.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /public/transfers/{cancelToken}/cancel:
    parameters:
      - name: cancelToken
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: cancelTransferByToken
      tags: [pets]
      x-effects: [irreversible_write, notifies]
      summary: Cancela a transferencia pelo token do e-mail, sem conta
      description: |
        Desfaz a transferencia dentro da janela de 24 h. O token e de uso unico
        e e consumido aqui.

        **Nao exige reautenticacao**, e e deliberado: as quatro camadas que
        protegem a transferencia (reautenticacao com senha, vinculo com o e-mail
        verificado do destinatario, token de 256 bits so por e-mail, e esta
        janela de 24 h) protegem o ato de TRANSFERIR. Cancelar e a operacao
        segura: ela devolve ao estado anterior. Exigir credencial para desfazer
        e o desenho que faz a protecao trabalhar contra quem ela protege.
      security: []
      x-no-challenge: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      x-rate-limit:
        - dimension: [ip]
          limit: 10
          window: 1h
          on_exceed: log_and_alert
      responses:
        '204': { description: Transferencia cancelada. O pet continua com o tutor atual. }
        '410':
          description: Ja consumada, ja cancelada, ou o token nao vale mais.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

