      security:
        - adminSession: []
          adminCsrf: []
      x-admin-roles: [admin]
      x-audit: { action: admin.network_event.updated, resource_kind: network_event }
      x-rate-limit:
        - dimension: [account]
          limit: 120
          window: 10m
          on_exceed: deny_429
          note: "balde compartilhado admin_write (D52)"
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminNetworkEventPatch' }
      responses:
        '200':
          description: Encontro alterado.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
