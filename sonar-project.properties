# SonarCloud (SonarQube Cloud) do Bichu. docs/07-devops.md secao 8.4.
#
# AS DUAS CHAVES ABAIXO NAO SAO SEGREDO. Elas identificam a organizacao e o
# projeto; nao autorizam nada. O que autoriza e `SONAR_TOKEN`, que vive so em
# Settings > Secrets do repositorio e chega ao job por `secrets.SONAR_TOKEN`.
# Token nunca entra aqui, nem em log, nem em mensagem de erro.
#
# Este arquivo precisa ficar na raiz do projeto: e de la que o scanner o le.

sonar.organization=bichu-app
sonar.projectKey=bichu-app_bichu-app
sonar.projectName=bichu-app

sonar.sourceEncoding=UTF-8

# Blame do Git alimenta a atribuicao de "codigo novo". Exige checkout completo
# (`fetch-depth: 0` no job), senao o scanner nao enxerga historico e trata
# tudo como novo -- que e justamente o erro que faz o portao reprovar por
# motivo errado.
sonar.scm.provider=git

# NAO declare `sonar.branch.name` nem `sonar.pullrequest.*` aqui. O scanner le
# esses valores do ambiente do GitHub Actions sozinho, e um valor fixo no
# arquivo transforma toda analise de PR em analise da mesma branch -- o
# resultado some, e ninguem percebe porque o job continua verde.

# ---------------------------------------------------------------------------
# O que e analisado
# ---------------------------------------------------------------------------
# Somente `src`: o backend TypeScript. O que esta fora dele ou nao e linguagem
# que o SonarCloud analisa, ou ja tem portao proprio e mais especifico na
# esteira:
#
#   api/openapi.yaml   -> Spectral 6.15.0, o lint de limite (BICHUS-25) e o
#                         portao de contrato publico (BICHUS-55)
#   migrations/*.sql   -> a esteira aplica as seis em banco vazio e conta
#   infra/caddy/       -> verificar_borda.py e verificar_borda_local.py
#   app/               -> Flutter; ver o bloco "Dart" mais abaixo
#   .github/, Dockerfile, compose.yaml
#                      -> gitleaks, `docker compose config -q` e a subida real
#                         da pilha no job `integracao`
#
# Ampliar `sonar.sources` e decisao a tomar com o resultado da primeira
# semana na mao, nao descuido.
sonar.sources=src

sonar.tests=src,tests,cypress
sonar.test.inclusions=src/**/*.test.ts,tests/**/*,cypress/**/*

# ---------------------------------------------------------------------------
# O que NAO e analisado, e o motivo de cada um
# ---------------------------------------------------------------------------
# src/shared/types/generated/  gerado de api/openapi.yaml por
#                              `npm run generate:types`. Editar a mao ja
#                              reprova no job `codigo`. Achado do Sonar aqui
#                              nao tem conserto possivel: quem escreve o
#                              arquivo e o gerador, e a proxima geracao desfaz
#                              a correcao em silencio.
# src/**/*.test.ts             entra como TESTE (sonar.tests), nao como fonte.
#                              Sai daqui para os dois conjuntos ficarem
#                              disjuntos e o scanner nao indexar o mesmo
#                              arquivo duas vezes.
# dist/, node_modules/,
# coverage/, app/build/        artefato de build; nao e codigo-fonte de
#                              ninguem.
# app/                         Dart, ver abaixo.
sonar.exclusions=src/**/*.test.ts,src/shared/types/generated/**,dist/**,node_modules/**,coverage/**,app/**,**/*.g.dart,**/*.g.ts

# Redundante com `sonar.exclusions` de proposito: se alguem ampliar
# `sonar.sources` amanha, os testes continuam fora do denominador da cobertura.
# NENHUM arquivo de producao entra nesta lista. Tirar do denominador o que nao
# tem teste e a forma mais barata de inventar cobertura, e e exatamente o que
# este portao existe para nao fazer.
sonar.coverage.exclusions=src/**/*.test.ts

# ---------------------------------------------------------------------------
# Dart: o que fica coberto e o que nao fica
# ---------------------------------------------------------------------------
# O SonarCloud NAO analisa Dart. Nao e questao de configuracao nem de plano:
# nao existe analisador de Dart no SonarQube Cloud, e o plugin de comunidade
# que existe so roda em SonarQube auto-hospedado. Os 41 arquivos de `app/lib`
# ficam fora desta analise, e dizer o contrario seria a confianca falsa do
# job que fica verde sem olhar.
#
# O que cobre `app/` e, e continua sendo, o job `app` (`flutter analyze` e
# `flutter test`), o job `tokens` e o job `contraste`. Se um dia alguem quiser
# metrica de Dart dentro do Sonar, o caminho e SonarQube auto-hospedado com o
# plugin de comunidade -- decisao de infraestrutura, nao linha neste arquivo.

# ---------------------------------------------------------------------------
# Cobertura
# ---------------------------------------------------------------------------
# SAO DOIS RELATORIOS, E A LISTA E ORDENADA POR QUEM OS PRODUZ:
#
#   coverage/lcov.info             suite UNITARIA, gerada no proprio job `sonar`
#                                  por `npm test -- --lcov ...`
#   coverage/lcov-integracao.info  suite de INTEGRACAO, gerada no job
#                                  `integracao` (onde existe banco de pe) e
#                                  trazida para ca por artefato
#
# O SonarCloud aceita a lista e AGREGA os dois: linha coberta em qualquer um
# conta como coberta. Nao ha passo de fusao, e de proposito -- fusao e mais um
# programa para dar errado em silencio, e cada relatorio continua conferivel
# sozinho.
#
# POR QUE A SEGUNDA LINHA EXISTE. Ate 22/09 so a unitaria chegava aqui, e 40
# arquivos de producao de `src` nao apareciam em relatorio nenhum -- os
# adaptadores `kysely-*`, os pontos de entrada e as portas. Para o Sonar,
# arquivo de fonte SEM dado de cobertura e arquivo com 0%, e ele nao reclama:
# so publica o numero. A suite de integracao media tres desses e a medicao
# morria dentro do container.
#
# Os caminhos dentro dos dois apontam para `src/**/*.ts` porque as duas suites
# rodam com `--enable-source-maps`. SEM ESSA FLAG o lcov sai apontando para
# `dist/_tests/**/*.js`, o Sonar nao casa nenhum arquivo, e a analise sobe com
# 0% de cobertura SEM ERRO ALGUM. Por isso
# `infra/verificacao/verificar-cobertura-lcov.mjs` roda antes do scanner, sobre
# OS DOIS, e reprova relatorio que aponta para o lugar errado -- e, desde a
# versao 2.0.0, tambem reprova quando uma fonte de `src` nao aparece em
# nenhum deles.
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage/lcov-integracao.info
