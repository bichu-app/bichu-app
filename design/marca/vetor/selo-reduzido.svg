<svg xmlns="http://www.w3.org/2000/svg" viewBox="-189.12 -258.15 1112.71 1112.71" width="16" height="16" role="img" aria-label="Bichu, selo reduzido">
  <title>Bichu, selo reduzido</title>
  <desc>Selo reduzido: simbolo-reduzido.svg vazado em neutral.25 sobre o quadrado raspberry.700 de cantos arredondados, que e a construcao do icone do app da folha do cliente (referencia/03-icone-do-app.png). Destino: favicon de 16 e 32 px. A 16 px quem carrega a marca e o quadrado, nao o desenho -- ver o README desta pasta.</desc>
